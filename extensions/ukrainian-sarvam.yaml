  - id: PH-UKR-dzh
    letter: "дж"
    ipa: "d͡ʒ"
    features:
      place: postalveolar
      manner: affricate
      voicing: voiced
      aspiration: unaspirated
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-10:1
      shared:
        manner: affricate or stop (unresolved in Sanskrit)
        voicing: voiced
      differences:
        ipa:
          sanskrit: "unresolved (d͡ʑ, d͡ʒ, or ɟ)"
          ukrainian: "d͡ʒ"
        place:
          sanskrit: "palatal (if /ɟ/) or alveolo-palatal (if /d͡ʑ/)"
          ukrainian: "postalveolar"
        aspiration:
          sanskrit: "contrastive (j vs jh)"
          ukrainian: "non-contrastive"
        breathy_voice:
          sanskrit: "contrastive (/d͡ʑʰ/ or /ɟʰ/ exists)"
          ukrainian: "absent (no breathy-voiced series)"
      note: >-
        Potential relation to canonical j (sūtra 10, position 1).
        Same caveat as ч/c.
        If Sanskrit j = /d͡ʒ/, segment-equivalent.
        Until resolved, near-equivalent.
    sources:
      - "Wikipedia: Ukrainian phonology"
      - "JIPA Illustration (2017)"
    notes: >-
      Voiced postalveolar affricate.
      Written as digraph дж.

