# Ukrainian Academic Extension Layer v0.3
# ==========================================
#
# This file is the ACADEMIC EXTENSION of the Śiva Sūtra canon to Ukrainian.
#
# v0.3 changelog:
#   Enriched with dimensions revealed by English (english.yaml v0.1).
#   When a third language is added, it reveals system-level contrasts that
#   were invisible with only two data points. For example:
#     - English /t/ is alveolar → revealed 'place' as a varying dimension
#     - English /b/ has fortis/lenis → revealed fortis_lenis as a dimension
#     - English /m/ has syllabic [m̩] → revealed syllabic as a dimension
#     - English /h/ is voiceless → revealed voicing as a dimension for h
#   Ukrainian v0.2 omitted these because it only compared against Sanskrit.
#   v0.3 adds them — not by changing Ukrainian values, but by making explicit
#   what Ukrainian does NOT have. The absence is information.
#
# Architecture (unchanged):
#   CANON: siva-sutras.yaml (immutable)
#     ↑ referenced by
#   ACADEMIC INTERPRETATION: sanskrit.yaml
#     ↑ cross-referenced by
#   ACADEMIC EXTENSION: this file (ukrainian.yaml)
#     ↑ cross-referenced by
#   ACADEMIC EXTENSION: english.yaml (peer extension, enriched this file)

layer_id: ukrainian-academic-extension-v0.3
layer_type: academic_extension
canon_reference: siva-sutras-v1
interpretation_reference: sanskrit-academic-interpretation-v0.1
peer_extension_reference: english-academic-extension-v0.1
layer_status: draft
date: 2026-08-14

# Primary sources
# ---------------
# Pompino-Marschall, Steriopolo & Żygis (2017). 'Ukrainian'.
#   JIPA 47(3), 349–357.
# Wikipedia: Ukrainian phonology (en.wikipedia.org)
# Vakulenko, M.O. (2019). 'Ukrainian Consonant Phones in the IPA
#   Context'. Linguistica ONLINE 22, 36–61.
# Enrichment source: english.yaml v0.1 (peer extension)

phonemes:
  # ===== VOWELS (6 phonemic, no length distinction) =====

  - id: PH-UKR-i
    letter: "і"
    ipa: "i"
    features:
      place: palatal
      manner: vowel
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-01:2
      shared:
        ipa: i
        place: palatal
        manner: vowel
        voicing: voiced
        syllabicity: syllabic
      differences:
        phonemic_length:
          sanskrit: "contrastive (i vs ī)"
          ukrainian: "non-contrastive"
        vowel_inventory:
          sanskrit: "9 vowels (incl. ṛ, ḷ, diphthongs)"
          ukrainian: "6 vowels"
        ipa:
          sanskrit: "i (short, /i/)"
          ukrainian: "i"
        length_opposition:
          sanskrit: "contrastive i vs ī"
          ukrainian: "absent (no phonemic length)"
        diphthongization:
          sanskrit: "monophthong"
          ukrainian: "absent (monophthongal)"
      note: >-
        Same IPA /i/.
        But Sanskrit i enters a contrastive length opposition (i vs ī), while Ukrainian і has no phonemic length.
        The segment is identical; the phonological role is not.
    sources:
      - "Pompino-Marschall, Steriopolo & Żygis (2017), JIPA 47(3), 349–357"
      - "Wikipedia: Ukrainian phonology"
    notes: >-
      High front unrounded vowel.
      Relatively stable across stressed/unstressed positions.

  - id: PH-UKR-y
    letter: "и"
    ipa: unresolved
    ipa_candidates: ["ɪ", "ɪ̞", "e", "ɨ"]
    features:
      place: unresolved
      manner: vowel
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: syllabic
    relation_to_canon:
      type: new-extension
      canonical_unit: null
      shared: null
      differences: null
      note: >-
        No canonical equivalent.
        Slavic innovation — Proto-Slavic *y → Ukrainian /ɪ/.
        The Śiva Sūtras have no sound in this phonetic space.
    sources:
      - "Pompino-Marschall et al. (2017)"
      - "Wikipedia: Ukrainian phonology"
      - "Shevelov (1979)"
    notes: >-
      THE distinctive Ukrainian vowel.
      Pompino-Marschall et al.: retracted close-mid front [ɪ̞].
      Unstressed /ɛ/ and /ɪ/ approach shared allophone [e].

  - id: PH-UKR-e
    letter: "е"
    ipa: "ɛ"
    features:
      place: palatal
      manner: vowel
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-03:1
      shared:
        manner: vowel
        voicing: voiced
        syllabicity: syllabic
      differences:
        ipa:
          sanskrit: "eː"
          ukrainian: "ɛ"
        phonemic_length:
          sanskrit: "inherently long (dīrgha)"
          ukrainian: "non-contrastive"
        vowel_height:
          sanskrit: "close-mid"
          ukrainian: "open-mid"
        checked:
          sanskrit: "n/a"
          ukrainian: "absent (vowels can occur in any position)"
      note: >-
        Same phoneme class (mid front vowel), cognate.
        But Sanskrit e = /eː/ (close-mid, inherently long).
        Ukrainian /ɛ/ = open-mid, no length.
    sources:
      - "Pompino-Marschall et al. (2017)"
      - "Wikipedia: Ukrainian phonology"
    notes: >-
      Open-mid front unrounded vowel.
      Stressed [ɛ], unstressed approaches [e].

  - id: PH-UKR-a
    letter: "а"
    ipa: unresolved
    ipa_candidates: ["a", "ɐ"]
    features:
      place: unresolved
      manner: vowel
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-01:1
      shared:
        manner: vowel
        voicing: voiced
        syllabicity: syllabic
      differences:
        ipa:
          sanskrit: "unresolved (ɐ, ə, or a)"
          ukrainian: "unresolved (a or ɐ)"
        phonemic_length:
          sanskrit: "contrastive (a vs ā)"
          ukrainian: "non-contrastive"
        allophony:
          sanskrit: "not documented as stress-dependent"
          ukrainian: "[a] stressed, [ɐ] unstressed"
        backness:
          sanskrit: "central (unresolved)"
          ukrainian: "unresolved"
        length_opposition:
          sanskrit: "a vs ā"
          ukrainian: "absent (no phonemic length)"
      note: >-
        Both unresolved.
        Unstressed Ukrainian [ɐ] matches one proposed Sanskrit value.
        Sanskrit a enters contrastive length opposition (a vs ā).
        Ukrainian a does not.
    sources:
      - "Pompino-Marschall et al. (2017)"
      - "Wikipedia: Ukrainian phonology"
    notes: >-
      Low central vowel.
      Stressed [a], unstressed [ɐ].
      Notable: [ɐ] matches a proposed Sanskrit /a/ value.

  - id: PH-UKR-o
    letter: "о"
    ipa: unresolved
    ipa_candidates: ["ɔ", "o"]
    features:
      place: velar
      manner: vowel
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-03:2
      shared:
        manner: vowel
        voicing: voiced
        syllabicity: syllabic
        place: velar/back
      differences:
        ipa:
          sanskrit: "oː"
          ukrainian: "ɔ or o"
        phonemic_length:
          sanskrit: "inherently long (dīrgha)"
          ukrainian: "non-contrastive"
        vowel_height:
          sanskrit: "close-mid"
          ukrainian: "open-mid"
        rounding:
          sanskrit: "rounded"
          ukrainian: "rounded"
      note: >-
        Same phoneme class (mid back rounded), cognate.
        Sanskrit o = /oː/, Ukrainian /ɔ/.
    sources:
      - "Pompino-Marschall et al. (2017)"
      - "Wikipedia: Ukrainian phonology"
    notes: >-
      Open-mid back rounded vowel.
      Stressed [ɔ], unstressed [o].

  - id: PH-UKR-u
    letter: "у"
    ipa: "u"
    features:
      place: velar
      manner: vowel
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-01:3
      shared:
        ipa: u
        place: velar
        manner: vowel
        voicing: voiced
        syllabicity: syllabic
      differences:
        phonemic_length:
          sanskrit: "contrastive (u vs ū)"
          ukrainian: "non-contrastive"
        vowel_inventory:
          sanskrit: "9 vowels"
          ukrainian: "6 vowels"
        ipa:
          sanskrit: "u (short, /u/)"
          ukrainian: "u"
        length_opposition:
          sanskrit: "u vs ū"
          ukrainian: "absent (no phonemic length)"
        diphthongization:
          sanskrit: "monophthong"
          ukrainian: "absent (monophthongal)"
      note: >-
        Same IPA /u/.
        But Sanskrit u enters contrastive length opposition (u vs ū), while Ukrainian у has no phonemic length.
        Segment identical; role differs.
    sources:
      - "Pompino-Marschall et al. (2017)"
      - "Wikipedia: Ukrainian phonology"
    notes: >-
      High back rounded vowel.
      Stressed [u], unstressed [ʊ].

  # ===== PLAIN STOPS =====

  - id: PH-UKR-p
    letter: "п"
    ipa: "p"
    features:
      place: bilabial
      manner: stop
      voicing: voiceless
      aspiration: unaspirated
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-12:2
      shared:
        ipa: p
        place: bilabial
        manner: stop
        voicing: voiceless
      differences:
        aspiration:
          sanskrit: "contrastive (p vs ph)"
          ukrainian: "non-contrastive (no aspirated series)"
        stop_inventory:
          sanskrit: "20 stops (5 places × 4 voicing/aspiration)"
          ukrainian: "6 stops (3 places × 2 voicing)"
        aspiration_type:
          sanskrit: "contrastive series"
          ukrainian: "absent (no aspirated series at all)"
      note: >-
        Same IPA /p/.
        But Sanskrit has a contrastive aspirated counterpart /pʰ/ (ph).
        Ukrainian has no aspirated stops at all.
        Segment identical; system role differs.
    sources:
      - "Wikipedia: Ukrainian phonology"
      - "JIPA Illustration (2017)"
    notes: >-
      Voiceless bilabial stop.
      No phonemic aspiration in Ukrainian.

  - id: PH-UKR-b
    letter: "б"
    ipa: "b"
    features:
      place: bilabial
      manner: stop
      voicing: voiced
      aspiration: unaspirated
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-10:2
      shared:
        ipa: b
        place: bilabial
        manner: stop
        voicing: voiced
      differences:
        aspiration:
          sanskrit: "contrastive (b vs bh)"
          ukrainian: "non-contrastive"
        breathy_voice:
          sanskrit: "contrastive (/bʱ/ exists)"
          ukrainian: "absent"
        voicing:
          sanskrit: "fully voiced"
          ukrainian: "voiced"
        fortis_lenis:
          sanskrit: "n/a (uses voicing + aspiration)"
          ukrainian: "absent (uses voicing only, no aspiration)"
      note: >-
        Same IPA /b/.
        Sanskrit has contrastive breathy-voiced counterpart /bʱ/ (bh).
        Ukrainian does not.
    sources:
      - "Wikipedia: Ukrainian phonology"
      - "JIPA Illustration (2017)"
    notes: >-
      Voiced bilabial stop.
      No phonemic aspiration.

  - id: PH-UKR-t
    letter: "т"
    ipa: "t̪"
    features:
      place: dental
      manner: stop
      voicing: voiceless
      aspiration: unaspirated
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-11:8
      shared:
        ipa: t̪
        place: dental
        manner: stop
        voicing: voiceless
      differences:
        aspiration:
          sanskrit: "contrastive (t vs th)"
          ukrainian: "non-contrastive"
        palatalization:
          sanskrit: "no palatalized t (has separate c)"
          ukrainian: "contrastive (t vs tʲ)"
        retroflex:
          sanskrit: "contrastive (t vs ṭ)"
          ukrainian: "absent (no retroflex series)"
        ipa:
          sanskrit: "t̪ (dental)"
          ukrainian: "t̪"
        place:
          sanskrit: "dental (tongue on teeth)"
          ukrainian: "dental"
        glottalization:
          sanskrit: "absent"
          ukrainian: "absent"
      note: >-
        Same IPA /t̪/, both dental.
        But: Sanskrit has aspirated /t̪ʰ/ and retroflex /ʈ/ counterparts.
        Ukrainian has palatalized /tʲ/ counterpart.
        Three different system-level contrasts radiate from the same segment.
    sources:
      - "Wikipedia: Ukrainian phonology"
      - "JIPA Illustration (2017)"
      - "Vakulenko (2019)"
    notes: >-
      Voiceless dental stop.
      Palatalized /tʲ/ is a separate phoneme.

  - id: PH-UKR-d
    letter: "д"
    ipa: "d̪"
    features:
      place: dental
      manner: stop
      voicing: voiced
      aspiration: unaspirated
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-10:5
      shared:
        ipa: d̪
        place: dental
        manner: stop
        voicing: voiced
      differences:
        aspiration:
          sanskrit: "contrastive (d vs dh)"
          ukrainian: "non-contrastive"
        palatalization:
          sanskrit: "no palatalized d (has separate j)"
          ukrainian: "contrastive (d vs dʲ)"
        retroflex:
          sanskrit: "contrastive (d vs ḍ)"
          ukrainian: "absent"
        ipa:
          sanskrit: "d̪ (dental)"
          ukrainian: "d̪"
        place:
          sanskrit: "dental"
          ukrainian: "dental"
      note: >-
        Same IPA /d̪/, both dental.
        Sanskrit has aspirated /d̪ʱ/ and retroflex /ɖ/.
        Ukrainian has palatalized /dʲ/.
    sources:
      - "Wikipedia: Ukrainian phonology"
      - "JIPA Illustration (2017)"
    notes: >-
      Voiced dental stop.
      Palatalized /dʲ/ is a separate phoneme.

  - id: PH-UKR-k
    letter: "к"
    ipa: "k"
    features:
      place: velar
      manner: stop
      voicing: voiceless
      aspiration: unaspirated
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-12:1
      shared:
        ipa: k
        place: velar
        manner: stop
        voicing: voiceless
      differences:
        aspiration:
          sanskrit: "contrastive (k vs kh)"
          ukrainian: "non-contrastive"
        palatalization:
          sanskrit: "no palatalized k (has separate c/j)"
          ukrainian: "allophonic only (kʲ before /i/)"
        velar_fricative:
          sanskrit: "absent"
          ukrainian: "present (/x/)"
      note: >-
        Same IPA /k/.
        Sanskrit has aspirated /kʰ/.
        Ukrainian has no aspirated velar but has a velar fricative /x/ (Sanskrit does not).
    sources:
      - "Wikipedia: Ukrainian phonology"
      - "JIPA Illustration (2017)"
    notes: >-
      Voiceless velar stop.
      Semi-palatalized [kʲ] before /i/ is allophonic.

  - id: PH-UKR-g
    letter: "ґ"
    ipa: "ɡ"
    features:
      place: velar
      manner: stop
      voicing: voiced
      aspiration: unaspirated
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-10:3
      shared:
        ipa: ɡ
        place: velar
        manner: stop
        voicing: voiced
      differences:
        aspiration:
          sanskrit: "contrastive (g vs gh)"
          ukrainian: "non-contrastive"
        frequency:
          sanskrit: "full phoneme"
          ukrainian: "peripheral (mainly loanwords)"
        voiced_velar_fricative:
          sanskrit: "absent"
          ukrainian: "present (/ɦ~ɣ/ as г)"
        breathy_voice:
          sanskrit: "contrastive (/ɡʱ/ exists)"
          ukrainian: "absent (no breathy-voiced series)"
        voicing:
          sanskrit: "fully voiced"
          ukrainian: "voiced"
      note: >-
        Same IPA /ɡ/.
        But Sanskrit g is a full phoneme with aspirated counterpart /gʱ/.
        Ukrainian ґ is peripheral (mainly loanwords), and Ukrainian has a voiced velar fricative /ɦ~ɣ/ (г) where Sanskrit has none.
    sources:
      - "Wikipedia: Ukrainian phonology"
      - "JIPA Illustration (2017)"
      - "Vakulenko (2019)"
    notes: >-
      Voiced velar stop.
      Represented by ґ, distinct from г (/ɦ/).
      Peripheral phoneme.

