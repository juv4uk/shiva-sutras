  - id: PH-UKR-ch
    letter: "ч"
    ipa: "t͡ʃ"
    features:
      place: postalveolar
      manner: affricate
      voicing: voiceless
      aspiration: unaspirated
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-11:6
      shared:
        manner: affricate or stop (unresolved in Sanskrit)
        voicing: voiceless
      differences:
        ipa:
          sanskrit: "unresolved (t͡ɕ, t͡ʃ, or c)"
          ukrainian: "t͡ʃ"
        place:
          sanskrit: "palatal (if /c/) or alveolo-palatal (if /t͡ɕ/)"
          ukrainian: "postalveolar"
        aspiration:
          sanskrit: "contrastive (c vs ch)"
          ukrainian: "non-contrastive"
        system_status:
          sanskrit: "full phoneme, grouped with stops"
          ukrainian: "full phoneme"
      note: >-
        Potential relation to canonical c (sūtra 11, position 6).
        Sanskrit c is unresolved (could be /t͡ʃ/).
        If Sanskrit c = /t͡ʃ/, this becomes segment-equivalent.
        Until resolved, near-equivalent.
    sources:
