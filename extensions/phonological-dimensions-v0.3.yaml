    name: velarization
    level: phonological_function
    scope: language-specific
    domain: consonant
    description: 'Whether this phoneme is velarized, and if so, whether phonemically or allophonically.'
    values: ['present (dark l)', absent, 'absent (unlike plain /ɫ/)', 'allophonic ([ɫ] in coda, [l] in onset)']
    provenance_sources: [ukrainian, english]
    provenance_classification: disputed
    v02_placement: phoneme-system-feature
    v03_placement: phonological_function
    placement_reason: >-
      Sarvam placed in phoneme-system-feature. Blind agent placed in
