    applies_when: segment is a liquid (/l/)
    backfill_trigger: 'language-specific'
    na_condition: 'phonemes that cannot be velarized'

  - id: DIM-TAP-REALIZATION
    name: tap_realization
    level: phonological_function
    scope: language-specific
    domain: consonant
    description: 'Whether this phoneme has a tap realization as an allophone.'
    values: ['often [ɾ]', 'not documented']
    provenance_sources: [ukrainian]
    provenance_classification: both-agree
    v02_placement: phoneme-system-feature
    v03_placement: phonological_function
    placement_reason: 'Both agents agree.'
    applies_when: segment is /r/ or a rhotic
    backfill_trigger: 'language-specific'
    na_condition: 'non-rhotic consonants'

  - id: DIM-ALLOPHONY
    name: allophony
    level: phonological_function
    scope: universal
    domain: segment
    description: 'Context-dependent phonetic realizations (allophones) of this phoneme.'
    values: ['[a] stressed, [ɐ] unstressed', 'devoiced [v̥] in coda', 'stable /ɦ/', '3 allophones in complementary distribution', '4 allophones across contexts', 'not documented as context-dependent', 'not documented as stress-dependent']
    provenance_sources: [ukrainian, english]
    provenance_classification: reconciled
    v02_placement: 'process-allophony (separate level)'
    v03_placement: phonological_function
    placement_reason: >-
      Sarvam had a separate process-allophony level. Blind agent merged
      allophony into phonological_function. Decision: MERGE — allophony is a
      functional property, not a separate ontological category. Reconciled.
    applies_when: all phonemes
    backfill_trigger: 'universal'
    na_condition: 'none — stable or not documented is valid'

  - id: DIM-GLOTTALIZATION
    name: glottalization
    level: phonological_function
