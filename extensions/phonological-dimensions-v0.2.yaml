# Phonological Dimensions Registry v0.2
# ======================================
#
# This file is NOT a language registry. It is a registry of the AXES along
# which phonological systems can differ from each other.
#
# Extracted from three language registries:
#   sanskrit.yaml v0.1 (academic interpretation)
#   ukrainian.yaml v0.3 (academic extension)
#   english.yaml  v0.1 (academic extension)
#
# Changes from v0.1:
#   1. Auto-generated summary (computed from actual data)
#   2. Epistemic states: present / absent / not-applicable / unknown / disputed
#   3. relation_between_dimensions section (deduplication analysis)
#   4. Two annotation models: academic_interpretation vs cross_language_comparison
#   5. Applicability rules per dimension
#   6. Positive comparison structure specification
#
# STATUS: HYPOTHESIS (H-SS-EXT-001)
# This registry is an independent hypothesis from the sarvam agent.
# It has NOT been adapted to the existing shiva-sutras architecture.
# A reconciliation experiment is required before adoption.
# See: hypotheses/independent-claims-sarvam.yaml

registry_id: phonological-dimensions-v0.2
registry_type: dimension_registry
layer: meta
status: hypothesis
date: 2026-08-15
extracted_from:
  - sanskrit-academic-interpretation-v0.1
  - ukrainian-academic-extension-v0.3
  - english-academic-extension-v0.1

