# English Academic Extension Layer v0.1
# ======================================
#
# This file is the ACADEMIC EXTENSION of the Śiva Sūtra canon to English.
# Base accent: SSBE (Standard Southern British English).
#
# ADVERSARIAL TEST: English is the stress test for the architecture.
# Many English phonemes LOOK canonical but differ in place, manner, or voicing:
#   - English /t/ is ALVEOLAR, not dental like Sanskrit /t̪/
#   - English /h/ is VOICELESS, not voiced like Sanskrit /ɦ/
#   - English /r/ is an APPROXIMANT, not a trill like Sanskrit /r/
#   - English /v/ is a FRICATIVE, not an approximant like Sanskrit /v/
#   - English /θ ð/ have NO canonical equivalent at all
#   - English schwa /ə/ has no canonical equivalent
#   - English has 20 vowel phonemes vs Sanskrit's 9
#
# If the architecture survives this without modifying 0x00–0x29, it works.

layer_id: english-academic-extension-v0.1
layer_type: academic_extension
canon_reference: siva-sutras-v1
interpretation_reference: sanskrit-academic-interpretation-v0.1
base_accent: SSBE (Standard Southern British English)
layer_status: draft
date: 2026-08-14

# Primary sources
# ---------------
# Wells, J.C. 'Phonetic symbols for English' (phon.ucl.ac.uk)
# Wikipedia: English phonology, Phonemes of English
# Roach, P. (2004). English Phonetics and Phonology. CUP.
# Collins, B. & Mees, I. (2008). Practical Phonetics and Phonology.
# Sheffield phoneme list (learnipa.github.io)

phonemes:
  # ===== PLOSIVES (6) =====

  - id: PH-ENG-p
    letter: "p"
    ipa: "p"
    features:
      place: bilabial
      manner: stop
      voicing: voiceless
      aspiration: variable
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-12:2
      shared:
        ipa: p
        place: bilabial
        manner: stop
        voicing: voiceless
      differences:
        aspiration:
          sanskrit: "contrastive (p vs ph)"
          english: "allophonic (aspirated in onset, unaspirated after /s/)"
        aspiration_type:
          sanskrit: "contrastive series"
          english: "positional allophone"
        stop_inventory:
          sanskrit: "20 stops (5 places × 4 types)"
          english: "6 stops (3 places × 2 fortis/lenis)"
      note: >-
        Same IPA /p/, both bilabial voiceless stop.
        But Sanskrit has contrastive aspiration (p vs ph).
        English aspiration is allophonic — aspirated [pʰ] in word-initial stressed position, unaspirated [p] after /s/ and in unstressed position.
        The fortis/lenis contrast replaces the voicing/aspiration matrix.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
      - "Roach (2004)"
    notes: >-
      Voiceless bilabial stop.
      Aspiration is allophonic, not phonemic.
      Part of fortis/lenis opposition with /b/, not a voicing opposition.

  - id: PH-ENG-b
    letter: "b"
    ipa: "b"
    features:
      place: bilabial
      manner: stop
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-10:2
      shared:
        ipa: b
        place: bilabial
        manner: stop
        voicing: voiced
      differences:
        aspiration:
          sanskrit: "contrastive (b vs bh)"
          english: "absent (no aspirated voiced series)"
        breathy_voice:
          sanskrit: "contrastive (/bʱ/ exists)"
          english: "absent"
        voicing:
          sanskrit: "fully voiced"
          english: "partially voiced (devoiced word-finally and in clusters)"
        fortis_lenis:
          sanskrit: "n/a (uses voicing + aspiration)"
          english: "/b/ is lenis counterpart of /p/"
      note: >-
        Same IPA /b/.
        Sanskrit has breathy-voiced /bʱ/ (bh).
        English has no breathy voice and /b/ is only partially voiced (devoiced in coda).
        English uses fortis/lenis, not voicing/aspiration, as primary contrast.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiced bilabial stop.
      Actually partially devoiced in many positions.
      Lenis counterpart of /p/.

  - id: PH-ENG-t
    letter: "t"
    ipa: "t"
    features:
      place: alveolar
      manner: stop
      voicing: voiceless
      aspiration: variable
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-11:8
      shared:
        manner: stop
        voicing: voiceless
      differences:
        ipa:
          sanskrit: "t̪ (dental)"
          english: "t (alveolar)"
        place:
          sanskrit: "dental (tongue on teeth)"
          english: "alveolar (tongue on ridge)"
        aspiration:
          sanskrit: "contrastive (t vs th)"
          english: "allophonic"
        glottalization:
          sanskrit: "absent"
          english: "common (t-glottalization in many dialects)"
        palatalization:
          sanskrit: "no palatalized t (has separate c)"
          english: "absent (no phonemic palatalized stops)"
        retroflex:
          sanskrit: "contrastive (ṭ exists)"
          english: "absent"
      note: >-
        NEAR-EQUIVALENT, not segment-equivalent! Same IPA symbol /t/ but different place: Sanskrit t = /t̪/ (dental), English t = /t/ (alveolar).
        This is THE adversarial case — identical IPA letter, different articulation.
        The dental diacritic in Sanskrit is not cosmetic; it marks a real place difference.
        English t is pronounced with the tongue on the alveolar ridge, not on the teeth.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
      - "Roach (2004)"
    notes: >-
      Voiceless ALVEOLAR stop.
      Aspiration is allophonic.
      Subject to t-glottalization ([ʔ] for /t/) in many dialects.
      The place difference from Sanskrit is real, not notational.

  - id: PH-ENG-d
    letter: "d"
    ipa: "d"
    features:
      place: alveolar
      manner: stop
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-10:5
      shared:
        manner: stop
        voicing: voiced
      differences:
        ipa:
          sanskrit: "d̪ (dental)"
          english: "d (alveolar)"
        place:
          sanskrit: "dental"
          english: "alveolar"
        aspiration:
          sanskrit: "contrastive (d vs dh)"
          english: "absent"
        retroflex:
          sanskrit: "contrastive (ḍ exists)"
          english: "absent"
      note: >-
        NEAR-EQUIVALENT.
        Same IPA letter but Sanskrit d = /d̪/ (dental), English d = /d/ (alveolar).
        Same place mismatch as t/t̪.
        Sanskrit has aspirated /d̪ʱ/ and retroflex /ɖ/.
        English has neither.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiced ALVEOLAR stop.
      Partially devoiced in coda.
      Lenis counterpart of /t/.

  - id: PH-ENG-k
    letter: "k"
    ipa: "k"
    features:
      place: velar
      manner: stop
      voicing: voiceless
      aspiration: variable
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-12:1
      shared:
        ipa: k
        place: velar
        manner: stop
        voicing: voiceless
      differences:
        aspiration:
          sanskrit: "contrastive (k vs kh)"
          english: "allophonic"
        palatalization:
          sanskrit: "no palatalized k (has separate c/j)"
          english: "allophonic before front vowels"
        velar_fricative:
          sanskrit: "absent"
          english: "absent in SSBE (present in Scottish/Irish as /x/)"
      note: >-
        Same IPA /k/, both velar voiceless stop.
        Sanskrit has aspirated /kʰ/.
        English aspiration is allophonic.
        English has no /x/ in SSBE (present in some dialects).
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiceless velar stop.
      Aspiration allophonic.
      Fronted [k̟] before front vowels.

  - id: PH-ENG-g
    letter: "ɡ"
    ipa: "ɡ"
    features:
      place: velar
      manner: stop
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-10:3
      shared:
        ipa: ɡ
        place: velar
        manner: stop
        voicing: voiced
      differences:
        aspiration:
          sanskrit: "contrastive (g vs gh)"
          english: "absent"
        breathy_voice:
          sanskrit: "contrastive (/ɡʱ/ exists)"
          english: "absent"
        frequency:
          sanskrit: "full phoneme"
          english: "full phoneme"
        voicing:
          sanskrit: "fully voiced"
          english: "partially voiced (devoiced in coda)"
      note: >-
        Same IPA /ɡ/.
        Sanskrit has breathy-voiced /ɡʱ/.
        English has no breathy voice.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiced velar stop.
      Partially devoiced in coda.
      Lenis counterpart of /k/.

  # ===== AFFRICATES (2) =====

  - id: PH-ENG-tʃ
    letter: "tʃ"
    ipa: "t͡ʃ"
    features:
      place: postalveolar
      manner: affricate
      voicing: voiceless
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-11:6
      shared:
        manner: affricate or stop (unresolved in Sanskrit)
        voicing: voiceless
      differences:
        ipa:
          sanskrit: "unresolved (t͡ɕ, t͡ʃ, or c)"
          english: "t͡ʃ"
        place:
          sanskrit: "palatal or alveolo-palatal"
          english: "postalveolar"
        aspiration:
          sanskrit: "contrastive (c vs ch)"
          english: "absent (fortis/lenis only)"
        system_status:
          sanskrit: "grouped with stops"
          english: "grouped with affricates"
      note: >-
        Potential relation to canonical c (sūtra 11, position 6).
        Same as Ukrainian ч.
        Sanskrit c is unresolved.
        If Sanskrit c = /t͡ʃ/, this becomes segment-equivalent.
        Until resolved, near-equivalent.
        English /tʃ/ is always postalveolar affricate, never a true palatal stop.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiceless postalveolar affricate.
      Fortis counterpart of /dʒ/.

  - id: PH-ENG-dʒ
    letter: "dʒ"
    ipa: "d͡ʒ"
    features:
      place: postalveolar
      manner: affricate
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-10:1
      shared:
        manner: affricate or stop (unresolved in Sanskrit)
        voicing: voiced
      differences:
        ipa:
          sanskrit: "unresolved (d͡ʑ, d͡ʒ, or ɟ)"
          english: "d͡ʒ"
        place:
          sanskrit: "palatal or alveolo-palatal"
          english: "postalveolar"
        aspiration:
          sanskrit: "contrastive (j vs jh)"
          english: "absent"
        breathy_voice:
          sanskrit: "contrastive (/d͡ʑʰ/ or /ɟʰ/ exists)"
          english: "absent"
      note: >-
        Potential relation to canonical j (sūtra 10, position 1).
        Same caveat as tʃ/c.
        Sanskrit j is unresolved.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiced postalveolar affricate.
      Lenis counterpart of /tʃ/.

  # ===== FRICATIVES (9) =====

  - id: PH-ENG-f
    letter: "f"
    ipa: "f"
    features:
      place: labiodental
      manner: fricative
      voicing: voiceless
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: new-extension
      canonical_unit: null
      shared: null
      differences: null
      note: >-
        No canonical equivalent.
        Sanskrit has no /f/.
        English /f/ is a full phoneme (unlike Ukrainian where it's peripheral).
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiceless labiodental fricative.
      Full phoneme in English.

  - id: PH-ENG-v
    letter: "v"
    ipa: "v"
    features:
      place: labiodental
      manner: fricative
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-05:3
      shared:
        voicing: voiced
        manner: involves labial articulation
      differences:
        ipa:
          sanskrit: "unresolved (ʋ or w)"
          english: "v (labiodental fricative)"
        manner:
          sanskrit: "approximant (not fricative)"
          english: "fricative (not approximant)"
        place:
          sanskrit: "unresolved (labiodental or bilabial)"
          english: "labiodental"
        allophony:
          sanskrit: "not documented as context-dependent"
          english: "devoiced [v̥] in coda"
        alternation:
          sanskrit: "not documented"
          english: "no alternation with /u/ (unlike Ukrainian)"
      note: >-
        NEAR-EQUIVALENT.
        Sanskrit v is an approximant (/ʋ/ or /w/).
        English v is a labiodental FRICATIVE /v/.
        Different manner! Sanskrit v is unresolved, but even the most fricative-like interpretation (/ʋ/) is an approximant, not a true fricative.
        English /v/ has frication noise.
        This is the most challenging case — the canonical symbol 'v' maps to two very different phonetic types across languages.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiced labiodental FRICATIVE.
      Not an approximant like Sanskrit v.
      Devoiced in coda.

  - id: PH-ENG-θ
    letter: "θ"
    ipa: "θ"
    features:
      place: dental
      manner: fricative
      voicing: voiceless
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: new-extension
      canonical_unit: null
      shared: null
      differences: null
      note: >-
        No canonical equivalent.
        Sanskrit has no dental fricative /θ/.
        Sanskrit th = aspirated dental STOP /t̪ʰ/, not a fricative.
        English /θ/ is a completely different phonological category — a fricative, not an aspirated stop.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
      - "Roach (2004)"
    notes: >-
      Voiceless dental fricative.
      The 'th' sound in 'thin'.
      Unique to English among the three languages so far.
      No relation to Sanskrit th (which is an aspirated stop).

  - id: PH-ENG-ð
    letter: "ð"
    ipa: "ð"
    features:
      place: dental
      manner: fricative
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: new-extension
      canonical_unit: null
      shared: null
      differences: null
      note: >-
        No canonical equivalent.
        Sanskrit has no voiced dental fricative /ð/.
        Sanskrit dh = breathy-voiced dental STOP /d̪ʱ/, not a fricative.
        Same category mismatch as θ/th.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiced dental fricative.
      The 'th' sound in 'then'.
      No Sanskrit equivalent.

  - id: PH-ENG-s
    letter: "s"
    ipa: "s"
    features:
      place: alveolar
      manner: fricative
      voicing: voiceless
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-13:3
      shared:
        manner: fricative
        voicing: voiceless
      differences:
        ipa:
          sanskrit: "s̪ (dental)"
          english: "s (alveolar)"
        place:
          sanskrit: "dental"
          english: "alveolar"
        sibilant_inventory:
          sanskrit: "3 voiceless sibilants (ś, ṣ, s)"
          english: "2 voiceless + 2 voiced (s, z, ʃ, ʒ)"
      note: >-
        NEAR-EQUIVALENT.
        Same IPA letter but Sanskrit s = /s̪/ (dental), English s = /s/ (alveolar).
        Same place mismatch as t/d̪.
        The dental/alveolar distinction is systematic across all English coronals.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiceless ALVEOLAR fricative.
      English s is alveolar, not dental like Sanskrit s.

  - id: PH-ENG-z
    letter: "z"
    ipa: "z"
    features:
      place: alveolar
      manner: fricative
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: new-extension
      canonical_unit: null
      shared: null
      differences: null
      note: >-
        No canonical equivalent.
        Sanskrit has no voiced sibilant.
        English /z/ is the voiced counterpart of /s/.
        Same category as Ukrainian /z/ — Slavic innovation, also present in English independently.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiced alveolar fricative.
      Full phoneme.
      No Sanskrit equivalent.

  - id: PH-ENG-ʃ
    letter: "ʃ"
    ipa: "ʃ"
    features:
      place: postalveolar
      manner: fricative
      voicing: voiceless
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-13:1
      shared:
        manner: fricative
        voicing: voiceless
      differences:
        ipa:
          sanskrit: "ɕ (alveolo-palatal)"
          english: "ʃ (postalveolar)"
        place:
          sanskrit: "alveolo-palatal"
          english: "postalveolar"
        palatalization:
          sanskrit: "inherent (ś is palatalized)"
          english: "not palatalized"
      note: >-
        Cognate with canonical ś.
        Sanskrit ś = /ɕ/ (alveolo-palatal).
        English ʃ = /ʃ/ (postalveolar).
        Same divergence as Ukrainian ш — different place of articulation.
        Not identical, despite both being 'sh' sounds.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiceless postalveolar fricative.
      The 'sh' sound.
      Not the same as Sanskrit ś /ɕ/.

  - id: PH-ENG-ʒ
    letter: "ʒ"
    ipa: "ʒ"
    features:
      place: postalveolar
      manner: fricative
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: new-extension
      canonical_unit: null
      shared: null
      differences: null
      note: >-
        No canonical equivalent.
        Sanskrit has no voiced sibilant.
        English /ʒ/ is rare — occurs in 'leisure', 'vision', 'measure'.
        Voiced counterpart of /ʃ/.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Voiced postalveolar fricative.
      Rare phoneme.
      No Sanskrit equivalent.

  - id: PH-ENG-h
    letter: "h"
    ipa: "h"
    features:
      place: glottal
      manner: fricative
      voicing: voiceless
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-05:1
      shared:
        place: glottal
        manner: fricative
      differences:
        ipa:
          sanskrit: "ɦ (voiced glottal fricative)"
          english: "h (voiceless glottal fricative)"
        voicing:
          sanskrit: "voiced [ɦ]"
          english: "voiceless [h]"
        aspiration:
          sanskrit: "not contrastive"
          english: "not contrastive (but /h/ only occurs in onset)"
        distribution:
          sanskrit: "any position"
          english: "only in syllable onset (never in coda)"
      note: >-
        NEAR-EQUIVALENT — critical adversarial case.
        Same IPA letter 'h', same place (glottal), but DIFFERENT VOICING: Sanskrit h = /ɦ/ (VOICED glottal fricative), English h = /h/ (VOICELESS glottal fricative).
        This is not a notational difference — the two sounds are auditorily and articulatorily distinct.
        Sanskrit h has vocal fold vibration throughout; English h is breath.
        Additionally, English /h/ only occurs in syllable onset, never in coda.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
      - "Roach (2004)"
    notes: >-
      Voiceless glottal fricative.
      Only occurs in syllable onset.
      Not the same as Sanskrit /ɦ/ — the voicing difference is real.

  # ===== NASALS (3) =====

  - id: PH-ENG-m
    letter: "m"
    ipa: "m"
    features:
      place: bilabial
      manner: nasal
      voicing: voiced
      aspiration: n/a
      nasality: nasal
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-07:2
      shared:
        ipa: m
        place: bilabial
        manner: nasal
        voicing: voiced
      differences:
        nasal_inventory:
          sanskrit: "5 nasals (ñ, m, ṅ, ṇ, n)"
          english: "3 nasals (m, n, ŋ)"
        palatalization:
          sanskrit: "no palatalized m (has separate ñ)"
          english: "absent"
        retroflex:
          sanskrit: "contrastive (ṇ exists)"
          english: "absent"
        syllabic:
          sanskrit: "no syllabic m"
          english: "syllabic [m̩] possible (e.g., 'rhythm')"
      note: >-
        Same IPA /m/.
        Sanskrit has 5 nasal phonemes; English has 3.
        English has syllabic nasal [m̩] in unstressed position — Sanskrit does not.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Bilabial nasal.
      Can be syllabic in unstressed position (e.g., 'rhythm' [ˈrɪðm̩]).

