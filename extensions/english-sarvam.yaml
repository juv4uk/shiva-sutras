  # ===== APPROXIMANTS (4) =====

  - id: PH-ENG-w
    letter: "w"
    ipa: "w"
    features:
      place: labiovelar
      manner: approximant
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-05:3
      shared:
        manner: approximant
        voicing: voiced
      differences:
        ipa:
          sanskrit: "unresolved (ʋ or w)"
          english: "w (labiovelar approximant)"
        place:
          sanskrit: "unresolved (labiodental or bilabial)"
          english: "labiovelar"
        alternation:
          sanskrit: "not documented"
          english: "no alternation with /u/ in SSBE (but /w/~[u̯] in some dialects)"
        phonemic_status:
          sanskrit: "full phoneme v"
          english: "full phoneme w"
      note: >-
        NEAR-EQUIVALENT.
        Potential relation to canonical v (sūtra 5, position 3).
        Sanskrit v is unresolved (/ʋ/ or /w/).
        If Sanskrit v = /w/, this becomes segment-equivalent.
        English /w/ is unambiguously a labiovelar approximant.
        Unlike Ukrainian в, English /w/ does not alternate with /u/ and has stable labiovelar articulation.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Labiovelar approximant.
      Stable articulation.
      If Sanskrit v = /w/, this is segment-equivalent.
      Until Sanskrit v is resolved, near-equivalent.

  - id: PH-ENG-r
    letter: "ɹ"
    ipa: "ɹ"
    features:
      place: postalveolar
      manner: approximant
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-05:4
      shared:
        voicing: voiced
      differences:
        ipa:
          sanskrit: "r (alveolar trill)"
          english: "ɹ (postalveolar approximant)"
        manner:
          sanskrit: "trill"
          english: "approximant"
        place:
          sanskrit: "alveolar"
          english: "postalveolar"
        rhoticity:
          sanskrit: "always rhotic"
          english: "rhotic in GA, non-rhotic in SSBE (no /r/ in coda)"
        syllabic_variant:
          sanskrit: "has syllabic ṛ"
          english: "no syllabic r"
      note: >-
        NEAR-EQUIVALENT — major adversarial case.
        Same IPA letter 'r' but completely different manner: Sanskrit r = /r/ (TRILL), English r = /ɹ/ (APPROXIMANT).
        These are articulatorily very different — a trill involves rapid tongue vibration; an approximant involves a constricted but continuous airflow without vibration.
        Additionally, SSBE is non-rhotic: /r/ only occurs before vowels, not in coda.
        GA is rhotic.
        The symbol 'r' in English transcription is a convention, not a phonetic description.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
      - "Roach (2004)"
    notes: >-
      Postalveolar approximant.
      Not a trill.
      In SSBE, only occurs before vowels (non-rhotic).
      The IPA symbol 'r' is a typographic convention; the phonetic value is /ɹ/.

  - id: PH-ENG-l
    letter: "l"
    ipa: "l"
    features:
      place: alveolar
      manner: lateral approximant
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: near-equivalent
      canonical_unit: SS-06:1
      shared:
        manner: lateral approximant
        voicing: voiced
      differences:
        ipa:
          sanskrit: "l (dental, not velarized)"
          english: "l (alveolar, with velarized allophone)"
        place:
          sanskrit: "dental"
          english: "alveolar"
        velarization:
          sanskrit: "absent"
          english: "allophonic ([ɫ] in coda, [l] in onset)"
        palatalization:
          sanskrit: "no palatalized l"
          english: "absent (no phonemic palatalization)"
      note: >-
        NEAR-EQUIVALENT.
        Sanskrit l = /l/ (dental, never velarized).
        English l = /l/ in onset (clear), /ɫ/ in coda (dark, velarized).
        The velarization is allophonic in English, unlike Ukrainian where /ɫ/ is phonemic.
        English has a clear/dark allophony that Sanskrit entirely lacks.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
      - "Roach (2004)"
    notes: >-
      Alveolar lateral approximant.
      Clear [l] in onset, dark [ɫ] in coda.
      Velarization is allophonic, not phonemic (unlike Ukrainian).
      Not dental like Sanskrit l.

  - id: PH-ENG-j
    letter: "j"
    ipa: "j"
    features:
      place: palatal
      manner: approximant
      voicing: voiced
      aspiration: n/a
      nasality: oral
      length: n/a
      palatalization: false
      retroflexion: false
      syllabicity: non-syllabic
    relation_to_canon:
      type: system-equivalent
      canonical_unit: SS-05:2
      shared:
        ipa: j
        place: palatal
        manner: approximant
        voicing: voiced
      differences: null
      note: >-
        Same IPA /j/.
        Both Sanskrit y and English j are the sole palatal approximant in their systems.
        No contrastive length, aspiration, palatalization, or allophonic variation in either language.
        This is the only phoneme where segment AND system role are fully shared — same as Ukrainian /j/.
    sources:
      - "Wells: phon.ucl.ac.uk"
      - "Wikipedia: English phonology"
    notes: >-
      Palatal approximant.
      Full system-equivalent with Sanskrit y and Ukrainian j.

