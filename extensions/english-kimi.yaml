canon_ref: siva-sutras.yaml
relation_to_canon: comparison
language: english
iso_639_1: en
iso_639_3: eng
metadata:
  description: English phonological inventory mapped against Śiva-sūtras canonical
    sequence
  source: Standard English phonology (RP/General American consensus, Wells 1982, Giegerich
    1992)
  status: PROPOSED
  version: '0.1'
  canon_version: '1.0'
  note: English has a large vowel inventory and several consonants absent from Sanskrit.
    This file uses RP as the reference accent.
phonological_inventory:
  vowels:
    monophthongs:
    - symbol: ee
      ipa: iː
      type: vowel
      height: high
      backness: front
      rounded: false
      length: long
      canon_mapping:
        equivalent: i
        sutra: 1
        relation: approximate
        note: Sanskrit /i/ is short; English /iː/ is long. Same quality, different
          length.
    - symbol: i
      ipa: ɪ
      type: vowel
      height: near-high
      backness: front
      rounded: false
      length: short
      canon_mapping:
        equivalent: i
        sutra: 1
        relation: approximate
        note: Sanskrit /i/ is high front; English /ɪ/ is near-high front. Same backness,
          different height.
    - symbol: e
      ipa: e
      type: vowel
      height: mid
      backness: front
      rounded: false
      length: short
      canon_mapping:
        equivalent: e
        sutra: 3
        relation: approximate
        note: Sanskrit /e/ is close-mid front long [eː]; English /e/ is mid front
          short. Same backness, different height and length.
    - symbol: a
      ipa: æ
      type: vowel
      height: near-open
      backness: front
      rounded: false
      length: short
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No near-open front unrounded vowel in Śiva-sūtras. Sanskrit /a/ is central/open
          back, not front.
    - symbol: ah
      ipa: ɑː
      type: vowel
      height: open
      backness: back
      rounded: false
      length: long
      canon_mapping:
        equivalent: a
        sutra: 1
        relation: approximate
        note: Sanskrit /a/ is short and central [ə] in many positions; English /ɑː/
          is long and back.
    - symbol: o
      ipa: ɒ
      type: vowel
      height: open-mid
      backness: back
      rounded: true
      length: short
      canon_mapping:
        equivalent: a
        sutra: 1
        relation: approximate
        note: No exact equivalent. Sanskrit /a/ is unrounded; English /ɒ/ is rounded.
          Some analyses relate it to /o/.
    - symbol: aw
      ipa: ɔː
      type: vowel
      height: open-mid
      backness: back
      rounded: true
      length: long
      canon_mapping:
        equivalent: o
        sutra: 3
        relation: approximate
        note: Sanskrit /o/ is close-mid back rounded long [oː]; English /ɔː/ is open-mid
          back rounded long. Same backness and rounding, different height.
    - symbol: u
      ipa: ʊ
      type: vowel
      height: near-high
      backness: back
      rounded: true
      length: short
      canon_mapping:
        equivalent: u
        sutra: 1
        relation: approximate
        note: Sanskrit /u/ is high back rounded; English /ʊ/ is near-high back rounded.
          Same backness and rounding, different height.
    - symbol: oo
      ipa: uː
      type: vowel
      height: high
      backness: back
      rounded: true
      length: long
      canon_mapping:
        equivalent: u
        sutra: 1
        relation: approximate
        note: Sanskrit /u/ is short; English /uː/ is long. Same quality, different
          length.
    - symbol: uh
      ipa: ʌ
      type: vowel
      height: open-mid
      backness: back
      rounded: false
      length: short
      canon_mapping:
        equivalent: a
        sutra: 1
        relation: approximate
        note: Sanskrit /a/ is central/open; English /ʌ/ is open-mid back unrounded.
          Different height and backness.
    - symbol: schwa
      ipa: ə
      type: vowel
      height: mid
      backness: central
      rounded: false
      length: short
      canon_mapping:
        equivalent: a
        sutra: 1
        relation: approximate
        note: Sanskrit /a/ in weak positions is often realized as [ə]; English /ə/
          is a dedicated phoneme. Functional convergence, different phonological status.
    - symbol: er
      ipa: ɜː
      type: vowel
      height: mid
      backness: central
      rounded: false
      length: long
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No r-colored or centralized long vowel in Śiva-sūtras. Unique to English
          and other rhotic languages.
    diphthongs:
    - symbol: ay
      ipa: eɪ
      type: diphthong
      components:
      - e
      - ɪ
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras. Sanskrit has no phonemic diphthongs of
          this type.
    - symbol: eye
      ipa: aɪ
      type: diphthong
      components:
      - a
      - ɪ
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras.
    - symbol: oy
      ipa: ɔɪ
      type: diphthong
      components:
      - ɔ
      - ɪ
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras.
    - symbol: ow
      ipa: aʊ
      type: diphthong
      components:
      - a
      - ʊ
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras.
    - symbol: oh
      ipa: əʊ
      type: diphthong
      components:
      - ə
      - ʊ
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras.
    - symbol: eer
      ipa: ɪə
      type: diphthong
      components:
      - ɪ
      - ə
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras. Centering diphthong unique to English.
    - symbol: air
      ipa: eə
      type: diphthong
      components:
      - e
      - ə
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras.
    - symbol: oor
      ipa: ʊə
      type: diphthong
      components:
      - ʊ
      - ə
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras.
  consonants:
  - symbol: p
    ipa: p
    voicing: voiceless
    place: bilabial
    manner: plosive
    canon_mapping:
      equivalent: p
      sutra: 12
      relation: exact
      note: 'Exact match with Sanskrit /p/ (SS-12: k p y).'
  - symbol: b
    ipa: b
    voicing: voiced
    place: bilabial
    manner: plosive
    canon_mapping:
      equivalent: b
      sutra: 10
      relation: exact
      note: 'Exact match with Sanskrit /b/ (SS-10: j b g ḍ d ś).'
  - symbol: t
    ipa: t
    voicing: voiceless
    place: alveolar
    manner: plosive
    canon_mapping:
      equivalent: t
      sutra: 11
      relation: exact
      note: 'Exact match with Sanskrit /t/ (SS-11: kh ph ch ṭh th c ṭ t v).'
  - symbol: d
    ipa: d
    voicing: voiced
    place: alveolar
    manner: plosive
    canon_mapping:
      equivalent: d
      sutra: 10
      relation: exact
      note: 'Exact match with Sanskrit /d/ (SS-10: j b g ḍ d ś).'
  - symbol: k
    ipa: k
    voicing: voiceless
    place: velar
    manner: plosive
    canon_mapping:
      equivalent: k
      sutra: 12
      relation: exact
      note: 'Exact match with Sanskrit /k/ (SS-12: k p y).'
  - symbol: g
    ipa: g
    voicing: voiced
    place: velar
    manner: plosive
    canon_mapping:
      equivalent: g
      sutra: 10
      relation: exact
      note: 'Exact match with Sanskrit /g/ (SS-10: j b g ḍ d ś).'
  - symbol: ch
    ipa: tʃ
    voicing: voiceless
    place: postalveolar
    manner: affricate
    canon_mapping:
      equivalent: ch
      sutra: 11
      relation: approximate
      note: Sanskrit /ch/ is a palatal aspirated affricate [cʰ] ~ [tɕʰ]; English /tʃ/
        is a postalveolar affricate. Same broad manner, different place and aspiration.
  - symbol: j
    ipa: dʒ
    voicing: voiced
    place: postalveolar
    manner: affricate
    canon_mapping:
      equivalent: jh
      sutra: 8
      relation: approximate
      note: Sanskrit /jh/ is a voiced aspirated palatal affricate [ɟʱ] ~ [dʑʱ]; English
        /dʒ/ is a postalveolar affricate without aspiration. Same broad manner, different
        place and phonation.
  - symbol: f
    ipa: f
    voicing: voiceless
    place: labiodental
    manner: fricative
    canon_mapping:
      equivalent: ph
      sutra: 11
      relation: approximate
      note: Sanskrit /ph/ is an aspirated bilabial plosive [pʰ]; English /f/ is a
        labiodental fricative. No true equivalent in Śiva-sūtras.
  - symbol: v
    ipa: v
    voicing: voiced
    place: labiodental
    manner: fricative
    canon_mapping:
      equivalent: v
      sutra: 5
      relation: approximate
      note: Sanskrit /v/ is a labiodental approximant [ʋ]; English /v/ is a labiodental
        fricative. Same place, different manner.
  - symbol: th
    ipa: θ
    voicing: voiceless
    place: dental
    manner: fricative
    canon_mapping:
      equivalent: null
      sutra: null
      relation: unique_to_language
      note: No dental fricative in Śiva-sūtras. This is one of the most distinctive
        English phonemes, absent from most world languages.
  - symbol: th-voiced
    ipa: ð
    voicing: voiced
    place: dental
    manner: fricative
    canon_mapping:
      equivalent: null
      sutra: null
      relation: unique_to_language
      note: No voiced dental fricative in Śiva-sūtras. Unique to English and a few
        other languages (e.g., Icelandic).
  - symbol: s
    ipa: s
    voicing: voiceless
    place: alveolar
    manner: fricative
    canon_mapping:
      equivalent: s
      sutra: 13
      relation: approximate
      note: Sanskrit /s/ has multiple allophones (dental [s], retroflex [ʂ], palatal
        [ɕ]) depending on context; English /s/ is consistently alveolar [s].
  - symbol: z
    ipa: z
    voicing: voiced
    place: alveolar
    manner: fricative
    canon_mapping:
      equivalent: null
      sutra: null
      relation: unique_to_language
      note: No alveolar voiced fricative in Śiva-sūtras. Sanskrit has no /z/ phoneme.
  - symbol: sh
    ipa: ʃ
    voicing: voiceless
    place: postalveolar
    manner: fricative
    canon_mapping:
      equivalent: ś
      sutra: 10
      relation: approximate
      note: Sanskrit /ś/ is a palatal fricative [ɕ]; English /ʃ/ is postalveolar.
        Both are voiceless coronal fricatives but differ in sub-place. Some scholars
        map English /ʃ/ to Sanskrit /ṣ/ [ʂ] instead.
  - symbol: zh
    ipa: ʒ
    voicing: voiced
    place: postalveolar
    manner: fricative
    canon_mapping:
      equivalent: null
      sutra: null
      relation: unique_to_language
      note: No postalveolar voiced fricative in Śiva-sūtras.
  - symbol: h
    ipa: h
    voicing: voiceless
    place: glottal
    manner: fricative
    canon_mapping:
      equivalent: h
      sutra: 5
      relation: approximate
      note: Sanskrit /h/ is typically voiced [ɦ] in many positions; English /h/ is
        consistently voiceless [h]. Same place, different phonation.
  - symbol: m
    ipa: m
    voicing: voiced
    place: bilabial
    manner: nasal
    canon_mapping:
      equivalent: m
      sutra: 7
      relation: exact
      note: 'Exact match with Sanskrit /m/ (SS-7: ñ m ṅ ṇ n m).'
  - symbol: n
    ipa: n
    voicing: voiced
    place: alveolar
    manner: nasal
    canon_mapping:
      equivalent: n
      sutra: 7
      relation: exact
      note: 'Exact match with Sanskrit /n/ (SS-7: ñ m ṅ ṇ n m).'
  - symbol: ng
    ipa: ŋ
    voicing: voiced
    place: velar
    manner: nasal
    canon_mapping:
      equivalent: ṅ
      sutra: 7
      relation: approximate
      note: Sanskrit /ṅ/ is a velar nasal phoneme; English /ŋ/ is a velar nasal phoneme.
        Exact phonetic match, but in Sanskrit /ṅ/ occurs only before velar stops (allophonic
        in some analyses), while in English /ŋ/ is a full phoneme (e.g., 'sing').
  - symbol: l
    ipa: l
    voicing: voiced
    place: alveolar
    manner: lateral_approximant
    canon_mapping:
      equivalent: l
      sutra: 6
      relation: approximate
      note: 'Sanskrit /l/ in Śiva-sūtras is retroflex [ɭ] (sutra 6: l ṇ); English
        /l/ is alveolar [l]. Same manner, different place. English also has dark [ɫ]
        allophone.'
  - symbol: r
    ipa: r
    voicing: voiced
    place: postalveolar
    manner: approximant
    canon_mapping:
      equivalent: r
      sutra: 5
      relation: approximate
      note: Sanskrit /r/ is a retroflex flap or trill [ɽ] ~ [r]; English /r/ is a
        postalveolar approximant [ɹ]. Same broad category (rhotic), very different
        articulation.
  - symbol: w
    ipa: w
    voicing: voiced
    place: labial-velar
    manner: approximant
    canon_mapping:
      equivalent: v
      sutra: 5
      relation: approximate
      note: Sanskrit /v/ is a labiodental approximant [ʋ] that functions as both /v/
        and /w/; English /w/ is a dedicated labial-velar approximant. Different place
        and secondary articulation.
  - symbol: y
    ipa: j
    voicing: voiced
    place: palatal
    manner: approximant
    canon_mapping:
      equivalent: y
      sutra: 5
      relation: exact
      note: 'Exact match with Sanskrit /y/ [j], a palatal approximant (SS-5: h y v
        r ṭ).'
canon_coverage_summary:
