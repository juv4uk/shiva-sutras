unique_to_english:
- æ (/æ/ — near-open front unrounded vowel)
- ɜː (/ɜː/ — mid central unrounded long vowel, r-colored)
- eɪ, aɪ, ɔɪ, aʊ, əʊ, ɪə, eə, ʊə (diphthongs — English has 8 phonemic diphthongs,
  Sanskrit has 2)
- θ (/θ/ — voiceless dental fricative, e.g., 'think')
- ð (/ð/ — voiced dental fricative, e.g., 'this')
- z (/z/ — alveolar voiced fricative)
- ʒ (/ʒ/ — postalveolar voiced fricative, e.g., 'measure')
- w (/w/ — labial-velar approximant, distinct from /v/)
- ɹ (/ɹ/ — postalveolar approximant, distinct from trill/flap)
- Dark [ɫ] allophone of /l/
- Phonemic stress and vowel reduction (schwa system)
absent_from_english:
- Syllabic consonants (ṛ, ḷ)
- Diphthongs (ai, au) — English has its own diphthongs, not these
- Retroflex series (ṭ, ṭh, ḍ, ḍh, ṇ, ṣ)
- Aspirated plosives (kh, ph, ch, th, gh, bh, jh, dh) — English has no phonemic aspiration
- Palatal nasal (ñ)
- Palatal fricative (ś)
- Palatal affricate (c) — English /tʃ/ is postalveolar, not palatal
