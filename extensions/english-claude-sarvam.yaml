    letter: "aw (as in 'thought')"
    ipa: "ɔː"
    features: {place: back, manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: long, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: new-extension
      note: "No canonical equivalent; back rounded long vowel, and accent-variable (merged with PH-ENG-CS-oh in many General American varieties)."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-oo
    letter: "oo (as in 'goose')"
    ipa: "uː"
    features: {place: back, manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: long, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-01:3
      differences:
        length_system: {sanskrit: "ū is exactly 2x u, same quality", english: "uː differs in quality as well as length from ʊ"}
      note: "Same structural caveat as iː/ī above, mirrored at the back vowel."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-er
    letter: "ir (as in 'nurse')"
    ipa: "ɜː"
    features: {place: central, manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: long, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: new-extension
      note: "No canonical equivalent; a long, central, unrounded vowel — the 'stressed cousin' of schwa, with the same structural mismatch (vowel-reduction system) noted at PH-ENG-CS-schwa."
    sources: ["Roach (2009)"]

  # ===== DIPHTHONGS (8) =====

  - id: PH-ENG-CS-ei
    letter: "ay (as in 'face')"
    ipa: "eɪ"
    features: {place: "front-gliding", manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: long, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: new-extension
      note: "Gliding diphthong starting near canonical e; no single-phoneme canonical equivalent (contrast canonical ai, SS-04:1, which is a genuinely different starting/ending quality, not this segment)."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-ai
    letter: "i (as in 'price')"
    ipa: "aɪ"
    features: {place: "open-to-close gliding", manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: long, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: false-friend
      canonical_unit: SS-04:1
      differences:
        quality: {sanskrit: "canonical ai is traditionally described/realized closer to [ai̯] or [æi̯], a single diphthongal unit within a symmetric vowel-length system", english: "aɪ starts further open/back and is one of several independent diphthongs, not part of a symmetric short/long/diphthong system"}
      note: "Both are called 'ai'-type diphthongs and both are written with similar Latin letters in some romanizations, but they are not the same glide, and English's diphthong ʌ ɪ AND ʊ combination sets exist outside any length-pairing system at all, unlike canonical ai's place within sutra 4."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-oi
    letter: "oy (as in 'choice')"
    ipa: "ɔɪ"
    features: {place: "back-to-front gliding", manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: long, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: new-extension
      note: "No canonical equivalent at all; historically a loanword-only diphthong in English (French/Latin borrowings)."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-ou
    letter: "o (as in 'goat')"
    ipa: "əʊ"
    features: {place: "central-to-back gliding", manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: long, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: new-extension
      note: "No canonical equivalent; starts from schwa's own quality (see PH-ENG-CS-schwa), inheriting the same structural mismatch."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-au
    letter: "ow (as in 'mouth')"
    ipa: "aʊ"
    features: {place: "open-to-close-back gliding", manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: long, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: false-friend
      canonical_unit: SS-04:2
      differences:
        quality: {sanskrit: "canonical au sits within the same symmetric length/diphthong system as ai", english: "aʊ is an independent diphthong outside any such system"}
      note: "Same false-friend logic as PH-ENG-CS-ai/canonical ai: shared name, shared rough IPA shape, structurally unrelated systems."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-ia
    letter: "ear (as in 'near')"
    ipa: "ɪə"
    features: {place: "close-to-central gliding", manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: long, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: new-extension
      note: "No canonical equivalent; a 'centring' diphthong, and strongly accent-dependent — largely absent from rhotic accents (e.g. General American), which instead have ɪ + r."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-ea
    letter: "air (as in 'square')"
    ipa: "eə"
    features: {place: "front-to-central gliding", manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: long, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: new-extension
      note: "No canonical equivalent; centring diphthong, same rhotic-accent caveat as PH-ENG-CS-ia."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-ua
    letter: "oor (as in 'cure')"
    ipa: "ʊə"
    features: {place: "back-to-central gliding", manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: long, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: new-extension
      note: "No canonical equivalent; the least stable of the centring diphthongs — many speakers merge it into ɔː entirely, a real ongoing sound change noted for completeness, not asserted as universal."
    sources: ["Roach (2009)"]

