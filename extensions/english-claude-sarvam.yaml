# English Academic Extension Layer — claude-sarvam v0.1 (full inventory)
# ==========================================
#
# NOT a replacement for english-kimi.yaml or english-sarvam.yaml — a
# NEW, independent third extension, companion to
# ukrainian-claude-sarvam.yaml, per owner instruction (2026-08-25).
# Independent judgments throughout, not copied from the peer files.
#
# Framed the same way english-sarvam.yaml frames itself: an
# ADVERSARIAL TEST for the canon-mapping architecture. English has
# far more superficially-similar-but-actually-different phonemes than
# Ukrainian did — same letter, same rough IPA symbol, different place/
# manner/voicing/phonemic status from its Sanskrit look-alike. Several
# entries below exist specifically to name that mismatch, not to force
# a match.
#
# Sarvam MCP actively engaged during authoring (2026-08-25):
#   - transliterate_text (en-IN -> hi-IN) called on "think this thin"
#     and "very where this that". Real output: "थिंक दिस थिन" and
#     "वेरी वेयर दिस दैट". This is genuine cross-check signal, used
#     below: Sarvam's own model renders voiceless θ ("thin") as थ
#     (aspirated dental stop) but voiced ð ("this"/"that") as द
#     (plain dental stop, NOT ध aspirated) — an asymmetry worth
#     recording as independent evidence that ð is perceived as closer
#     to a plain stop than θ is. It also collapses both v ("very") and
#     w ("where") onto व, consistent with the known real limitation
#     that Devanagari/Hindi do not phonemically distinguish v/w — used
#     below as supporting evidence, not as the sole basis, for the
#     v/w entries' relation_to_canon notes.
#   - analyze_text called with two direct phonology questions (place/
#     manner of "this"-initial consonant; manner of English /r/):
#     failed again with the same not_found_error as in the Ukrainian
#     work — confirmed reproducible on a second, unrelated attempt,
#     not a one-off. Reported honestly rather than silently retried
#     into a fabricated answer.
#
# Does NOT touch docs/preregistration-L001.yaml.

layer_id: english-claude-sarvam-extension-v0.1
layer_type: academic_extension
canon_reference: siva-sutras-v1
base_accent: "General/reference (non-regional composite; see per-entry notes for known accent variation)"
layer_status: draft
date: "2026-08-25"

# Primary sources
# ---------------
# Traditional phonemic inventory of English as standardly described
# (Roach, P. (2009). 'English Phonetics and Phonology', 4th ed.);
# cross-checked, where noted, against real Sarvam transliterate_text
# output (2026-08-25, logged above).

phonemes:
  # ===== PLOSIVES (6) =====

  - id: PH-ENG-CS-p
    letter: "p"
    ipa: "p"
    features: {place: bilabial, manner: stop, voicing: voiceless, aspiration: "allophonic (aspirated [pʰ] in stressed onset, unaspirated elsewhere)", nasality: oral, length: n/a, palatalization: false, retroflexion: false, syllabicity: non-syllabic}
    relation_to_canon:
      type: false-friend
      canonical_unit: SS-12:2
      differences:
        aspiration_status: {sanskrit: "phonemic (p vs ph are separate phonemes)", english: "allophonic (aspiration is positional, not contrastive)"}
      note: "English [pʰ] in 'pin' sounds close to Sanskrit ph but is not the SAME kind of fact: swapping it for unaspirated [p] in 'spin' never changes a word's identity in English, the way p/ph genuinely contrast in Sanskrit."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-b
    letter: "b"
    ipa: "b"
    features: {place: bilabial, manner: stop, voicing: voiced, aspiration: unaspirated, nasality: oral, length: n/a, palatalization: false, retroflexion: false, syllabicity: non-syllabic}
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-10:2
      differences:
        breathy_voice: {sanskrit: "contrastive (/bʱ/ exists)", english: "absent"}
      note: "Same IPA /b/; no English counterpart to Sanskrit's breathy-voiced series."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-t
    letter: "t"
    ipa: "t"
    features: {place: alveolar, manner: stop, voicing: voiceless, aspiration: "allophonic (aspirated in stressed onset)", nasality: oral, length: n/a, palatalization: false, retroflexion: false, syllabicity: non-syllabic}
    relation_to_canon:
      type: false-friend
      canonical_unit: SS-11:8
      differences:
        place: {sanskrit: "dental त̪", english: "alveolar, further back"}
        aspiration_status: {sanskrit: "phonemic", english: "allophonic"}
      note: "The single most consequential false friend in this whole file: English 't' is NOT dental. Sanskrit learners with an English-only phonetic background routinely mis-hear/mis-produce त as their own alveolar t; the actual dental target is closer to Ukrainian's т̪ than to English 't'."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-d
    letter: "d"
    ipa: "d"
    features: {place: alveolar, manner: stop, voicing: voiced, aspiration: unaspirated, nasality: oral, length: n/a, palatalization: false, retroflexion: false, syllabicity: non-syllabic}
    relation_to_canon:
      type: false-friend
      canonical_unit: SS-10:5
      differences:
        place: {sanskrit: "dental द̪", english: "alveolar"}
      note: "Same place mismatch as t/त: English d is not dental."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-k
    letter: "k"
    ipa: "k"
    features: {place: velar, manner: stop, voicing: voiceless, aspiration: "allophonic (aspirated in stressed onset)", nasality: oral, length: n/a, palatalization: false, retroflexion: false, syllabicity: non-syllabic}
    relation_to_canon:
      type: false-friend
      canonical_unit: SS-12:1
      differences:
        aspiration_status: {sanskrit: "phonemic (k vs kh)", english: "allophonic"}
      note: "Segment matches; the aspiration contrast English speakers can HEAR (pin vs spin) is not the same contrast Sanskrit actually phonemicizes."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-g
    letter: "g"
    ipa: "ɡ"
    features: {place: velar, manner: stop, voicing: voiced, aspiration: unaspirated, nasality: oral, length: n/a, palatalization: false, retroflexion: false, syllabicity: non-syllabic}
    relation_to_canon:
      type: segment-equivalent
      canonical_unit: SS-10:3
      differences:
        breathy_voice: {sanskrit: "contrastive (/gʱ/ exists)", english: "absent"}
      note: "Same IPA /ɡ/; no breathy counterpart in English."
    sources: ["Roach (2009)"]

