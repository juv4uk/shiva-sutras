  - id: PH-ENG-CS-h
    letter: "h"
    ipa: "h"
    features: {place: glottal, manner: fricative, voicing: voiceless, aspiration: n/a, nasality: oral, length: n/a, palatalization: false, retroflexion: false, syllabicity: non-syllabic}
    relation_to_canon:
      type: false-friend
      canonical_unit: SS-05:1
      differences:
        voicing: {sanskrit: "canonical h / Ukrainian г are VOICED glottal fricatives ɦ", english: "h is VOICELESS"}
      note: "A genuine false friend hiding behind an identical letter: the same grapheme 'h' names a voiced sound in Sanskrit's ह and Ukrainian's г, but a voiceless one in English. This is the mirror image of the Ukrainian file's PH-UKR-CS-h entry, which correctly matched г to canonical h precisely because г, unlike English h, IS voiced."
    sources: ["Roach (2009)"]

