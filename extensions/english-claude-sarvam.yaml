  - id: PH-ENG-CS-schwa
    letter: "a (as in 'about', unstressed)"
    ipa: "ə"
    features: {place: central, manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: short, palatalization: false, retroflexion: false, syllabicity: syllabic}
    relation_to_canon:
      type: new-extension
      note: "The single most structurally alien entry in this file: schwa is English's default REDUCED vowel, the outcome of unstressed-syllable vowel reduction, and by far the most frequent vowel sound in connected English speech. Sanskrit's vowel system has no reduction process of this kind and no equivalent central-neutral vowel category; this is a structural, not merely segmental, mismatch."
    sources: ["Roach (2009)"]

