# affricates, 9 fricatives, 3 nasals, 4 approximants, 7 short/checked
# vowels, 5 long/free vowels, 8 diphthongs — 44 phonemes total. Accent
# variation (rhotic mergers, ɒ/ɔː merger, etc.) is flagged per-entry
# where it materially affects a claim, not treated as a separate
