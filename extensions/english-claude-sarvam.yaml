    ipa: "θ"
    features: {place: dental, manner: fricative, voicing: voiceless, aspiration: unaspirated, nasality: oral, length: n/a, palatalization: false, retroflexion: false, syllabicity: non-syllabic}
    relation_to_canon:
      type: false-friend
      canonical_unit: SS-11:8
      differences:
        manner: {sanskrit: "त्/थ् are STOPS (plain/aspirated)", english: "θ is a true FRICATIVE, no stop closure at all"}
      note: "The classic false friend: English spells this digraph 'th' and many English speakers, transliterating Sanskrit थ (aspirated dental STOP) into English, reach for this SAME letters 'th' — but θ has no stop closure, while थ does. Empirically supported by real Sarvam transliterate_text output (2026-08-25): 'thin' -> थिन, i.e. Sarvam's own model maps English θ onto थ (aspirated dental stop), reproducing the exact false-friend conflation this note warns against, in a real system, not just in theory."
    sources: ["Roach (2009)", "Sarvam transliterate_text, 2026-08-25, request_id 20260825_e4e29e51-2f6b-4028-9a94-710df7af63f4"]

  - id: PH-ENG-CS-eth
    letter: "th (voiced)"
    ipa: "ð"
    features: {place: dental, manner: fricative, voicing: voiced, aspiration: unaspirated, nasality: oral, length: n/a, palatalization: false, retroflexion: false, syllabicity: non-syllabic}
    relation_to_canon:
      type: false-friend
      canonical_unit: SS-10:5
      differences:
        manner: {sanskrit: "द् is a STOP", english: "ð is a true FRICATIVE"}
