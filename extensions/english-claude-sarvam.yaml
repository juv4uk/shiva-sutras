  - id: PH-ENG-CS-oh
    letter: "o (as in 'lot')"
    ipa: "ɒ"
    features: {place: back, manner: vowel, voicing: voiced, aspiration: n/a, nasality: oral, length: short, palatalization: false, retroflexion: false, syllabicity: syllabic}
