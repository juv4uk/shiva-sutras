      note: "Empirically supported by real Sarvam transliterate_text output (2026-08-25): 'very' -> वेरी, using व, the SAME grapheme it used for w in 'where' -> वेयर. Devanagari/Hindi genuinely do not distinguish v/w phonemically, which is suggestive but not sufficient on its own — the actual English/Sanskrit manner mismatch (fricative vs approximant) is the primary evidence, drawn from Roach (2009), not from the transliteration alone."
    sources: ["Roach (2009)", "Sarvam transliterate_text, 2026-08-25, request_id 20260825_9f8ff741-9418-4e60-84c6-94867bee1d85"]

