    letter: "f"
    ipa: "f"
    features: {place: labiodental, manner: fricative, voicing: voiceless, aspiration: unaspirated, nasality: oral, length: n/a, palatalization: false, retroflexion: false, syllabicity: non-syllabic}
    relation_to_canon:
      type: new-extension
      note: "No canonical labiodental fricative."
    sources: ["Roach (2009)"]

  - id: PH-ENG-CS-v
    letter: "v"
    ipa: "v"
    features: {place: labiodental, manner: fricative, voicing: voiced, aspiration: unaspirated, nasality: oral, length: n/a, palatalization: false, retroflexion: false, syllabicity: non-syllabic}
    relation_to_canon:
      type: false-friend
      canonical_unit: SS-05:2
      differences:
