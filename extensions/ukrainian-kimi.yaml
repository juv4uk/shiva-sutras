canon_ref: siva-sutras.yaml
relation_to_canon: comparison
language: ukrainian
iso_639_1: uk
iso_639_3: ukr
metadata:
  description: Ukrainian phonological inventory mapped against Śiva-sūtras canonical
    sequence
  source: Standard Ukrainian phonology (Bulakhovsky, Shevelov, contemporary academic
    consensus)
  status: PROPOSED
  version: '0.1'
  canon_version: '1.0'
  note: Palatalized consonants are phonemic in Ukrainian but absent in Sanskrit. This
    is a systematic difference, not an anomaly.
phonological_inventory:
  vowels:
    monophthongs:
    - symbol: а
      ipa: ɑ
      type: vowel
      height: open
      backness: back
      rounded: false
      length: short
      stressed_variants:
      - ɑ
      - ɐ
      canon_mapping:
        equivalent: a
        sutra: 1
        relation: approximate
        note: Sanskrit /a/ is central [ə] in many positions; Ukrainian /ɑ/ is back
          and open. Both are low unrounded vowels but differ in backness and exact
          quality.
    - symbol: е
      ipa: ɛ
      type: vowel
      height: open-mid
      backness: front
      rounded: false
      length: short
      canon_mapping:
        equivalent: e
        sutra: 3
        relation: approximate
        note: Sanskrit /e/ is a long close-mid front vowel [eː]; Ukrainian /ɛ/ is
          a short open-mid front vowel. Same frontness, different height and length.
    - symbol: и
      ipa: ɪ
      type: vowel
      height: near-high
      backness: back
      rounded: false
      length: short
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No direct equivalent in Śiva-sūtras. Sanskrit has no near-high back
          unrounded vowel. Closest is /i/ but /ɪ/ is significantly more back and lower.
          This is a defining phoneme of Ukrainian.
    - symbol: і
      ipa: i
      type: vowel
      height: high
      backness: front
      rounded: false
      length: short
      canon_mapping:
        equivalent: i
        sutra: 1
        relation: exact
        note: Exact match with Sanskrit /i/.
    - symbol: о
      ipa: ɔ
      type: vowel
      height: open-mid
      backness: back
      rounded: true
      length: short
      canon_mapping:
        equivalent: o
        sutra: 3
        relation: approximate
        note: Sanskrit /o/ is a long close-mid back rounded vowel [oː]; Ukrainian
          /ɔ/ is a short open-mid back rounded vowel. Same backness and rounding,
          different height and length.
    - symbol: у
      ipa: u
      type: vowel
      height: high
      backness: back
      rounded: true
      length: short
      canon_mapping:
        equivalent: u
        sutra: 1
        relation: exact
        note: Exact match with Sanskrit /u/.
    diphthongoids:
    - symbol: я
      ipa: jɑ
      type: vowel_sequence
      components:
      - j
      - ɑ
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: Sequence of palatal approximant + open back vowel. Sanskrit has no phonemic
          diphthongoid of this type; closest is /ya/ as a consonant-vowel sequence.
    - symbol: є
      ipa: jɛ
      type: vowel_sequence
      components:
      - j
      - ɛ
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras.
    - symbol: ї
      ipa: ji
      type: vowel_sequence
      components:
      - j
      - i
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras.
    - symbol: ю
      ipa: ju
      type: vowel_sequence
      components:
      - j
      - u
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras.
    - symbol: йо
      ipa: jɔ
      type: vowel_sequence
      components:
      - j
      - ɔ
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras.
  consonants:
    hard:
    - symbol: б
      ipa: b
      voicing: voiced
      place: bilabial
      manner: plosive
      canon_mapping:
        equivalent: b
        sutra: 10
        relation: exact
        note: 'Exact match with Sanskrit /b/ (SS-10: j b g ḍ d ś).'
    - symbol: в
      ipa: v
      voicing: voiced
      place: labiodental
      manner: fricative
      canon_mapping:
        equivalent: v
        sutra: 5
        relation: approximate
        note: Sanskrit /v/ is a labiodental approximant [ʋ]; Ukrainian /v/ is a labiodental
          fricative [v]. Same place, different manner.
    - symbol: г
      ipa: ɦ
      voicing: voiced
      place: glottal
      manner: fricative
      canon_mapping:
        equivalent: h
        sutra: 5
        relation: approximate
        note: Ukrainian /ɦ/ is a voiced glottal fricative; Sanskrit /h/ is typically
          [h] (voiceless) or [ɦ] (voiced) depending on context. Both are glottal fricatives
          but voicing differs systematically.
    - symbol: ґ
      ipa: ɡ
      voicing: voiced
      place: velar
      manner: plosive
      canon_mapping:
        equivalent: g
        sutra: 10
        relation: exact
        note: Exact match with Sanskrit /g/. Rare in native Ukrainian (mostly in loanwords
          and onomatopoeia), but phonemically distinct from /ɦ/.
    - symbol: д
      ipa: d
      voicing: voiced
      place: alveolar
      manner: plosive
      canon_mapping:
        equivalent: d
        sutra: 10
        relation: exact
        note: 'Exact match with Sanskrit /d/ (SS-10: j b g ḍ d ś).'
    - symbol: ж
      ipa: ʒ
      voicing: voiced
      place: postalveolar
      manner: fricative
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No direct equivalent in Śiva-sūtras. Sanskrit has no postalveolar voiced
          fricative.
    - symbol: з
      ipa: z
      voicing: voiced
      place: alveolar
      manner: fricative
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No direct equivalent in Śiva-sūtras. Sanskrit has no alveolar voiced
          fricative /z/.
    - symbol: й
      ipa: j
      voicing: voiced
      place: palatal
      manner: approximant
      canon_mapping:
        equivalent: y
        sutra: 5
        relation: exact
        note: 'Exact match with Sanskrit /y/ [j], a palatal approximant (SS-5: h y
          v r ṭ).'
    - symbol: к
      ipa: k
      voicing: voiceless
      place: velar
      manner: plosive
      canon_mapping:
        equivalent: k
        sutra: 12
        relation: exact
        note: 'Exact match with Sanskrit /k/ (SS-12: k p y).'
    - symbol: л
      ipa: l
      voicing: voiced
      place: alveolar
      manner: lateral_approximant
      canon_mapping:
        equivalent: l
        sutra: 6
        relation: approximate
        note: 'Sanskrit /l/ in Śiva-sūtras is retroflex [ɭ] (sutra 6: l ṇ); Ukrainian
          /l/ is alveolar [l]. Same manner, different place.'
    - symbol: м
      ipa: m
      voicing: voiced
      place: bilabial
      manner: nasal
      canon_mapping:
        equivalent: m
        sutra: 7
        relation: exact
        note: 'Exact match with Sanskrit /m/ (SS-7: ñ m ṅ ṇ n m).'
    - symbol: н
      ipa: n
      voicing: voiced
      place: alveolar
      manner: nasal
      canon_mapping:
        equivalent: n
        sutra: 7
        relation: exact
        note: 'Exact match with Sanskrit /n/ (SS-7: ñ m ṅ ṇ n m).'
    - symbol: п
      ipa: p
      voicing: voiceless
      place: bilabial
      manner: plosive
      canon_mapping:
        equivalent: p
        sutra: 12
        relation: exact
        note: 'Exact match with Sanskrit /p/ (SS-12: k p y).'
    - symbol: р
      ipa: r
      voicing: voiced
      place: alveolar
      manner: trill
      canon_mapping:
        equivalent: r
        sutra: 5
        relation: approximate
        note: 'Sanskrit /r/ in Śiva-sūtras is retroflex [ɽ] or [ɾ] (sutra 5: h y v
          r ṭ); Ukrainian /r/ is an alveolar trill [r]. Same broad category (coronal
          rhotic), different sub-place and manner.'
    - symbol: с
      ipa: s
      voicing: voiceless
      place: alveolar
      manner: fricative
      canon_mapping:
        equivalent: s
        sutra: 13
        relation: approximate
        note: Sanskrit /s/ has multiple allophones (dental [s], retroflex [ʂ], palatal
          [ɕ]) depending on context; Ukrainian /s/ is consistently alveolar [s].
    - symbol: т
      ipa: t
      voicing: voiceless
      place: alveolar
      manner: plosive
      canon_mapping:
        equivalent: t
        sutra: 11
        relation: exact
        note: 'Exact match with Sanskrit /t/ (SS-11: kh ph ch ṭh th c ṭ t v).'
    - symbol: ф
      ipa: f
      voicing: voiceless
      place: labiodental
      manner: fricative
      canon_mapping:
        equivalent: ph
        sutra: 11
        relation: approximate
        note: Sanskrit /ph/ is an aspirated bilabial plosive [pʰ]; Ukrainian /f/ is
          a labiodental fricative. No true equivalent in Śiva-sūtras.
    - symbol: х
      ipa: x
      voicing: voiceless
      place: velar
      manner: fricative
      canon_mapping:
        equivalent: kh
        sutra: 11
        relation: approximate
        note: Sanskrit /kh/ is an aspirated velar plosive [kʰ]; Ukrainian /x/ is a
          velar fricative. Same place, different manner (plosive vs fricative).
    - symbol: ц
      ipa: ts
      voicing: voiceless
      place: alveolar
      manner: affricate
      canon_mapping:
        equivalent: c
        sutra: 4
        relation: approximate
        note: Sanskrit /c/ is a palatal/velar affricate [c] ~ [tɕ]; Ukrainian /ts/
          is an alveolar affricate. Same broad manner (affricate), different place.
    - symbol: ч
      ipa: tʃ
      voicing: voiceless
      place: postalveolar
      manner: affricate
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No postalveolar affricate in Śiva-sūtras. Sanskrit /ch/ is a palatal
          aspirated affricate [cʰ] ~ [tɕʰ].
    - symbol: ш
      ipa: ʃ
      voicing: voiceless
      place: postalveolar
      manner: fricative
      canon_mapping:
        equivalent: ṣ
        sutra: 9
        relation: approximate
        note: Sanskrit /ṣ/ is a retroflex fricative [ʂ]; Ukrainian /ʃ/ is postalveolar.
          Both are voiceless fricatives in the coronal region but differ in sub-place.
    - symbol: щ
      ipa: ʃtʃ
      voicing: voiceless
      place: postalveolar
      manner: affricate
      canon_mapping:
        equivalent: null
        sutra: null
        relation: unique_to_language
        note: No equivalent in Śiva-sūtras. Some analyses treat it as /ʃː/ (long /ʃ/),
          others as /ʃtʃ/ (affricate cluster). Either way, absent from Sanskrit phonology.
    - symbol: дж
      ipa: dʒ
      voicing: voiced
      place: postalveolar
      manner: affricate
      canon_mapping:
        equivalent: j
        sutra: 10
        relation: approximate
        note: Sanskrit /j/ is a palatal affricate [ɟ] ~ [dʑ]; Ukrainian /dʒ/ is a
          postalveolar affricate. Same broad manner, different place.
