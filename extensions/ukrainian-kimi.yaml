unique_to_ukrainian:
- и (/ɪ/ — near-high back unrounded vowel, defining phoneme of Ukrainian)
- я, є, ї, ю, йо (/jɑ/, /jɛ/, /ji/, /ju/, /jɔ/ — diphthongoid sequences)
- ж (/ʒ/ — postalveolar voiced fricative)
- з (/z/ — alveolar voiced fricative)
- ч (/tʃ/ — postalveolar voiceless affricate)
- щ (/ʃtʃ/ or /ʃː/ — postalveolar complex)
- Palatalized consonants (б', в', г', ґ', д', з', к', л', м', н', п', р', с', т',
  ф', х', ц') — systematic phonemic feature absent from Sanskrit
- Phonemic stress (not a segmental phoneme, but a prosodic feature absent from Sanskrit's
  pitch-accent system)
absent_from_ukrainian:
- Syllabic consonants (ṛ, ḷ)
- Diphthongs (ai, au)
- Retroflex series (ṭ, ṭh, ḍ, ḍh, ṇ, ṣ)
- Aspirated plosives (kh, ph, ch, th, gh, bh, jh, dh)
- Palatal nasal (ñ)
- Velar nasal phoneme (ṅ — only allophonic [ŋ] in Ukrainian)
- Palatal fricative (ś)
