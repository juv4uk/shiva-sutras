meta:
  agent_identity: >
      The sarvam agent was not instructed to follow the repository's
      epistemic contract. It arrived at similar principles independently:
        - "absent ≠ unknown ≠ not-applicable" maps to the repository's
          "Reproducibility ≠ Authenticity" and "UNRESOLVED-BY-EVIDENCE"
        - The four-level architecture maps to the repository's
          CANON / INTERPRETATION / EXTENSION / ENGINEERING layers
        - The "package manager for knowledge" observation maps to
          the repository's claims-export.yaml system
      This convergence may be evidence that the underlying principles
      are robust — or it may be confirmation bias from an agent that
      had access to the repository before forming its hypotheses.
      
      The correct epistemic stance is: BOTH are possible, and only
      an independent agent WITHOUT repository access can distinguish
      between them.
  
  experiment_proposed: >
      Conduct a reconciliation experiment:
        1. An independent agent builds a phonological comparison ontology
           from the same three language registries, WITHOUT access to
           the shiva-sutras repository or its epistemic contract.
        2. Compare the independent ontology with H-SS-EXT-001.
        3. If they converge on similar dimensions/levels: evidence that
           the ontology is inherent in the data.
        4. If they diverge: evidence that the sarvam agent's ontology was
           shaped by the repository's architecture (confirmation bias).
  
  guiding_principle: >
      Agents should not agree — they should leave traces.
      The system coordinates these traces.
