# Невирішені джерелознавчі питання щодо канону

questions:
  - id: "Q1"
    topic: "Авторство (pauruṣeya vs apauruṣeya)"
    description: "Чи є Паніні автором цих сутр, чи він успадкував їх від своїх попередників (таких як Āpiśali)? Існує думка, що Паніні взяв існуючий алфавітний порядок і реформував його it-маркерами для своїх потреб."
    status: "open"
    scholarly_consensus: "Більшість сучасних дослідників (Cardona, Kiparsky) вважають, що Паніні сам сконструював цю систему специфічно для своєї граматики, оскільки it-маркери ідеально підігнані під Aṣṭādhyāyī."

  - id: "Q2"
    topic: "Сенс подвійного входження 'ṇ'"
    description: "Існує два маркери 'ṇ' (у сутрах 1 і 6). Це створює неоднозначність для pratyāhāra 'aṇ' і 'iṇ'. Патанджалі детально вирішує цю неоднозначність (aṇ зазвичай стосується першого, крім одного специфічного правила, iṇ - другого)."
    status: "resolved_by_tradition"
    note: "Це питання лежить на межі CANON і PĀṆINIAN FORMAL USE."

  - id: "Q3"
    topic: "Вимова 'a' у приголосних"
    description: "У сутрах 5-14 приголосні записані з голосним 'a' (ha, ya, va, ra). Чи був цей звук 'a' частиною канону (і мав граматичне значення), чи це просто фонетична підпорка (uccāraṇārtha) для полегшення вимови?"
    status: "resolved_by_tradition"
    scholarly_consensus: "Патанджалі стверджує, що 'a' тут виключно для вимови і не включається у pratyāhāra, за винятком сутри 6 (l ṇ), де 'a' є it-маркером для утворення специфічного pratyāhāra 'ra'."
