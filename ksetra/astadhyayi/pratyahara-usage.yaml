- id: aṇ
  set:
  - a
  - i
  - u
  meaning: Базові прості голосні (до першого ṇ)
  count_in_astadhyayi: medium
  usage_example:
    sutra_id: 1.1.69
    sutra_text: aṇudit savarṇasya cāpratyayaḥ
    purpose: Встановлює, що базовий aṇ представляє також всі свої гомогенні варіанти
      (довгі, носові).
