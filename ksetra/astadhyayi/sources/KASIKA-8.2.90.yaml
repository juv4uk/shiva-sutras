witness_text:
  sutra: yājyāntaḥ
  commentary: yājyā nāma ye yājyākāṇḍe paṭhyante mantrāḥ, teṣām antyo yaḥ ṭiḥ sa plavate
    yajñakarmaṇi  / stomairvidhemāgnaye3  / jihvāmagne cakṛṣe havyavāha3m  / antagrahaṇaṃ
    kim ? yājyā nāma ṛcaḥ kāścidvākyasamudāyarūpaḥ, tatra yāvanti vākyāni teṣāṃ sarveṣāṃ
    ṭeḥ plutaḥ prāpnoti  / sarvāntyasya+eva iṣyate, tadartham antagrahaṇam //
