source_id: KASIKA-1.4.52
locator:
  sutra: 1.4.52
witness_text:
  sutra: guti-buddhi-pratyavasāna-artha-śabda-karma-akarmakāṇām aṇi kartā sa ṇau
  commentary: artha-śabdaḥ praty-ekam abhisambadhyate  / gaty-arthānāṃ buddhy-arthānāṃ
    pratyavasāna-arthānam ca dhātūnāṃ, tatha śabda-karmakāṇām akarmakanām ca aṇy-antānām
    yaḥ kartā, sa ṇy-antānāṃ karmasañjño bhavati  / gacchati māṇavako grāmam, gamayati
    māṇavakaṃ grāmam  / yāti māṇavako grāmam, yāpayati māṇavakaṃ grāmam  / gaty-artheṣu
    nīvahyoḥ pratiṣedho vaktavyaḥ  / nayati bhāram devadattaḥ, nāyayati bhāram devadattena  /
    vahati bhāram devadattaḥ, vāhyati bhāraṃ devadattena  / vaheraniyantṛkartṛkasya+iti
    vaktavyam  / iha praitṣedho mā bhūt, vahanti yavān balīvardāḥ, vāhayati yavān
    balīvardān iti  / buddhiḥ - budhyate māṇavako dharmam, bodhayati māṇavakaṃ dahrmam  /
    vetti māṇavako dharmam, vedayati māṇavakaṃ dharmam  / pratyavasānam abhyavahāraḥ  /
    bhuṅkte māṇavaka odanam, bhojayati māṇavakam odanam  / aśnāti mānavaka odanam,
    āśayati māṇavakamodanam  / ādikhādyoḥ pratiśedho vaktavyaḥ  / atti māṇavaka odanam,
    ādayate māṇavakena odanam  / khādati māṇavakaḥ, khādayati māṇavakena  / bhakṣer
    ahiṃsa-arthasya pratiṣedho vaktavyaḥ  / bhakṣayati piṇḍīṃ devadattaḥ, bhakṣayati
    piṇḍīṃ devadattena iti  / ahiṃsa-arthasya iti kim ? bhakṣayanti balīvardāḥ sasyam,
    bhakṣayanti balīvardān sasyam  / śabda-karmaṇām -- adhīte mānavako vedam, adhyāpayati
    māṇavakaṃ vedam  / paṭhati māṇavako vedam  / pāṭhayati māṇavakaṃ vedam  / akarmakāṇām
    - āste devadattaḥ, āsayati devadattam  / śete devadattaḥ, śāyayati devadattam  /
    eteṣām iti kim ? pacaty odanaṃ devadattaḥ, pācayaty odanaṃ devadattena iti  /
    aṇyantānām iti kim ? gamayati devadatto yajñadattam, tam aparaḥ prayuṅkte, gamayati
    devadattena yajñadattaṃ viṣṇumitraḥ // [#87]
