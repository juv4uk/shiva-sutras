source_id: KASIKA-8.1.9
locator:
  sutra: 8.1.9
witness_text:
  sutra: ekaṃ bahuvrīhivat
  commentary: ekam ity etac chabdarūpaṃ dviruktaṃ bahuvrīhivad bhavati  / bahuvrīhivattve
    prayojanaṃ sublopapuṃvadbhāvau  / kaikamakṣaraṃ paṭhati  / ekaikayā āhutyā juhoti  /
    sarvanāmasañjñāpratiṣedhasvarasamāsāntāḥ samāsādhikāravihite bahuvrīhau vijñāyante  /
    tena atideśike bahuvrīhau na bhavanti  / ekaikasmai  / na bahuvrīhau (*1,1.129)
    iti pratiṣedho na bhavati, bahuvrīhir eva yo bahuvrīhiḥ iti vijñānāt  / nana,
    susu, nañsubhyām (*6,2.172) ity antodāttatvaṃ na bhavati  / ṛk ṛk, pūḥ pūḥ, ṛk
    pūḥ iti samāsānto na bhavati //
