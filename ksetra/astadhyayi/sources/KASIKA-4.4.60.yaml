source_id: KASIKA-4.4.60
locator:
  sutra: 4.4.60
witness_text:
  sutra: asti-nāsti-diṣṭaṃ matiḥ
  commentary: tad asya ity eva  / tad iti prathamāsamarthebhyaḥ asti nāsti diṣṭa ity
    etebhyaḥ śabdebhyaḥ asya iti ṣaṣṭhyarthe ṭhak pratyayo bhavati yat tat prathamāsamarthaṃ
    matiś cet tad bhavati  / asti matiḥ asya āstikaḥ  / nāsti matiḥ asya nāstikaḥ  /
    daiṣṭikaḥ  / na ca matisattāmātre pratyaya iṣyate, kiṃ tarhi, paraloko 'sti iti
    yasya matiḥ sa āstikaḥ  / tadviparīto nāstikaḥ  / pramāṇa-anupātinī yasya matiḥ
    sa daiṣṭikaḥ  / tad etad abhidhāna-śakti-svabhāvāl labhyate  / asti-nāsti-śabdau
    nipātau, vacanasāmarthyād vā ākhyātād vākyāc ca pratyayaḥ //
