source_id: KASIKA-7.2.66
locator:
  sutra: 7.2.66
witness_text:
  sutra: iḍ atty-arti-vyayatīnām
  commentary: atti arti vyayati ity eteṣāṃ thali iḍāgamo bhavati  / āditha  / āritha  /
    vivyayitha  / vyeñaḥ na vyo liṭi (*6,1.46) iti ātvapratiṣedhaḥ  / attivyayatyoḥ
    ṛto bhāradvājasya (*7,2.63) iti niyamād vikalpaḥ  / artter api nityaḥ pratiṣedhaḥ  /
    atra iḍgrahaṇam vispaṣṭārtham  / vikalpavidhāne hi sati attivyayatigrahaṇam anarthakam,
    pratiṣedhavidhāne ca artigrahaṇam iti nityo 'yaṃ vidhiḥ iḍgrahaṇam antareṇa api
    śakyate vijñātum //
