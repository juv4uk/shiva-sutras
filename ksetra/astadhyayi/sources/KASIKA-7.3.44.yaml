source_id: KASIKA-7.3.44
locator:
  sutra: 7.3.44
witness_text:
  sutra: pratyayasthāt kāt pūrvasya ata id āpy asupaḥ
  commentary: pratyayasthāt kakārāt pūrvasya akārasya ikārādeśo bhavati āpi parataḥ,
    sa ced āp supaḥ paro na bhavati  / jaṭilikā  / muṇḍikā  / kārikā  / hārikā  /
    etikāścaranti  / pratyayagrahaṇaṃ kim ? śaknoti iti śakā  / sthagrahaṇam vispaṣtārtham  /
    [#842] kakāramātraṃ pratyayo na asti iti sāmarthyāt pratyayasthasya grahaṇam śakyate
    vijñātum  / kāt iti kim ? maṇḍanā  / ramaṇā  / pūrvasya iti kim ? parasya mā bhūt,
    paṭukā  / mṛdukā  / ataḥ iti kim ? gokā  / naukā  / taparakaraṇaṃ kim ? rākā  /
    dhākā  / āpi iti kim ? kārakaḥ  / dhārakaḥ  / atha āpi ity anena kim ? viśiṣyate
    ? kakāraḥ  / yady evam, kārikā ity atra api na prāpnoti, akāreṇa vyavahitatvāt
    ? ekādeśe kṛte na asti vyavadhānam  / ekādeśaḥ pūrvavidhau sthānivadbhavati iti
    vyavadhānam eva ? vacanād vyavadhānamīdṛśaṃ yat sthānivadbhāvakṛtam ekena varṇena
    tadāśrīyate  / rathakaṭyādiṣu tu śrutikṛtam anekena varṇena vyavadhānam iti itvaṃ
    na bhavati  / asupaḥ iti kim ? bahavaḥ parivrājakā asyāṃ mathurāyām bahuparivrājakā
    mathurā  / subantād ayaṃ bahuparivrājakaśabdāt paraḥ āp iti pratiṣedho bhavati  /
    prasajyapratiṣedhaścāyam, na paryudāsaḥ  / paryudāse hi sati samudāyād asubantāt
    parataḥ āp iti itvam atra syād eva  / avidyamānaḥ sup yasmin so 'yam asup iti
    ? evam api nāśīyate  / tathā hi sati bahucarmikā ity atra api na syāt  / māmakanarakayor
    upasaṅkhyānaṃ kartavyam apratyayasthatvāt  / mama iyaṃ māmikā narikā  / aṇi mamakādeśaḥ  /
    kevalamāmaka iti niyamāt sañjñāchandasoḥ īkāro na asty atra, tena aṇpratyayāntād
    api ṭāp bhavati, narān kāyati iti narikā  / āto 'nupasarge kaḥ (*3,2.3) iti kaḥ
    pratyayaḥ  / pratyayaniṣedhe tyaktyapoś ca+upasaṅkhyānam  / udīcāmātaḥ sthāne
    yakpūrvāyāḥ (*7,3.43) iti vikalpo mā bhūt iti  / dīkṣiṇātyikā  / ihatyikā //
