source_id: KASIKA-6.1.154
locator:
  sutra: 6.1.154
witness_text:
  sutra: maskaramaskariṇau veṇuparivrājakayoḥ
  commentary: maskara maskarin ity etau yathāsaṅkhyaṃ veṇau parivrājake ca nipātyete  /
    makaraśabdo hy avyutpannaṃ prātipadikam, tasya veṇau abhidheye suṭ nipātyate,
    parivrājake tviniḥ api  / maskaraḥ veṇuḥ  / maskarī parivrājakaḥ  / veṇuparivrājakayoḥ
    iti kim ? makaro grāhaḥ  / makarī samudraḥ  / kecit punar atra māṅi upapade karoteḥ
    karaṇe 'cpratyayam api nipātayantik māṅś ca hrasvatvam suṭ ca  / mā kriyate yena
    pratiṣidhyate sa maskaro veṇuḥ  / veṇugrahaṇaṃ ca pradarśanārtham anyatra api
    bhavati, maskaro daṇḍaḥ iti  / parivrājake api māṅi upapade karotestācchīlye inirnipātyate,
    māṅo hrasvatvaṃ suṭ ca tathā+eva  / mākaraṇaśīlo maskarī karmāpavāditvāt parivrājka
    ucyate  / sa hy evam āha - mā kuruta karmāṇi śāntirvaḥ śreyasī iti //
