source_id: KASIKA-8.2.18
locator:
  sutra: 8.2.18
witness_text:
  sutra: kṛpo ro laḥ
  commentary: kṛpeḥ dhātoḥ rephasya lakārādeśo bhavati  / raḥ iti śrutisāmānyam upādīyate  /
    tena yaḥ kevalo repho, yaś ca ṛkārasthaḥ, tayor dvayor api grahaṇam  / laḥ ity
    api sāmanyam eva  / tato 'yaṃ kevalasya rephasya sthāne lakārādeśo vidhīyate  /
    ṛkārasya apy ekadeśavikāradvāreṇa lṛkāraḥ, evaṃ ca luṭi ca klṛpaḥ (*1,3.93) ity
    evam ādayo nirdeśā upapadyante  / kalptā  / kalptārau  / kalptāraḥ  / ciklṛpsati  /
    klṛptaḥ  / klṛptavān  / kṛpā ity etat ṛpeḥ samprasāraṇam ca iti bhidādiṣu pāṭhād
    bhavati  / tasya hi kṛtasamprasāraṇasya lākṣaṇikatvāt iha kṛpaḥ iti grahaṇaṃ na
    asti  / kṛpaṇakṛpīṭakrapūrādayo 'pi kraper eva draṣṭavyāḥ  / uṇādayo bahulam (*3,3.1)
    iti vā kṛpereva latvābhāvaḥ  / [#914] vālamūlalaghvasurālam aṅgulīnāṃ vā ro lamāpadyata
    iti vaktavyam  / vālaḥ, vāraḥ  / mūlam, mūram  / laghu, raghu  / asuraḥ, asulaḥ  /
    alam, aram  / aṅguliḥ, aṅguriḥ  / kapilakādīnāṃ sañjñāchandasor vā ro lamāpadyata
    iti vaktavyam  / kapirakaḥ, kapilakaḥ  / tilpilīkam, tirpirīkam  / lomāni, romāṇi  /
    pāṃśuram, pāṃśulam  / karma, kalma  / śukraḥ, śuklaḥ  / ralayor ekatvasmaraṇam
    iti kecit  / kim idam ekatvasmaraṇamiti ? samānaviṣayatvam eva tayoḥ smaryate
    ity arthaḥ //
