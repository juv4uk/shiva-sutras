locator:
  sutra: 8.2.91
witness_text:
  sutra: brūhi-preṣya-śrauṣaḍ-vauṣaḍ-āvahānām ādeḥ
  commentary: brūhi preṣya śrauṣaṭ vauṣaṭ āvaha ity eteṣām ādeḥ pluto bhavati yajñakarmaṇi  /
    agnaye 'nubrū3hi  / preṣya - agnaye gomayān pre3ṣya  / śrauṣaṭ - astu śrau3ṣaṭ  /
    vauṣaṭ - somas ne vīhi vau3ṣaṭ  / āvaha - āgnimā3vaha  / āvaha devān yajamānāya
    ity evam ādāvayaṃ pluto na bhavati, sarve vidhayaḥ chandasi vikalpyante iti //
