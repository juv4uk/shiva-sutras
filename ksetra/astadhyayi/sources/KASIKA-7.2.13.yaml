source_id: KASIKA-7.2.13
locator:
  sutra: 7.2.13
witness_text:
  sutra: kṛ-sṛ-bhṛ-vṛ-stu-dru-sru-śruvo liṭi
  commentary: kṛ sṛ bhṛ vṛ stu dru sru śru ity eteṣāṃ liṭi pratyaye iḍāgamo na bhavati  /
    kṛ - cakṛva, cakṛma  / sṛ - sasṛva, sasṛma  / bhṛ - babhṛva, babhṛma  / vṛñ -
    vavṛva, vavṛma  / vṛṅ - vavṛvahe, vavṛmahe  / stu - tuṣṭuva, tuṣṭuma  / dru -
    dudruva, dudruma  / sru - susruva, susruma  / śru - śuśruva, śuśruma  / siddhe
    satyārambho niyamarthaḥ , krādaya eva liṭi aniṭaḥ, tato 'nye seṭaḥ iti  / bibhidiva,
    bibhidima  / luluviva, luluvima  / anudāttopadeśānām atra prakṛtyāśrayaḥ pratiṣedhaḥ,
    vṛñvṛṅostu prtyayāśrayaḥ, tadubhayasya apy ayaṃ niyamaḥ  / vṛño hi thali vavartha
    iti nipātanād vyavasthā  / studrusruśruvāṃ tu ṛto bhāradvājasya (*7,2.63) ity
    asmād api niyamāt ya iṭ prāpnoti so 'pi neṣyate  / tuṣṭotha  / dudrotha susrotha  /
    śuśrotha  / kṛño 'suṭkasya+iti vaktavyam  / sasuṭkasya iḍagamo yathā syāt  / sañcaskariva,
    sañcaskarima  / ṛto bhāradvājasya (*7,2.63) ity etad apy asuṭkasya+eva+iṣyate,
    sañcaskaritha //
