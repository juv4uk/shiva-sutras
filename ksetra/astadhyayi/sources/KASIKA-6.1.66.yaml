source_id: KASIKA-6.1.66
locator:
  sutra: 6.1.66
witness_text:
  sutra: lopo vyor vali
  commentary: dhatoḥ iti prakṛtaṃ yat tad dhātvādeḥ iti punar dhātugrahaṇān nivṛttam  /
    tena dhātor adhātośca vakārayakārayoḥ vali parato lopo bhavati  / div - didivān,
    didivāṃsau, didivāṃsaḥ  / ūyī - ūtam  / knūyī - knūtam  / godhāyā ḍhrak (*4,1.129)  /
    ghaudheraḥ  / paceran  / yajeran  / vakārasya - jīveradānuk, jīradānuḥ  / sriveḥ
    - āsremāṇam  / uṇādayo bahulam (*3,3.1) iti bahulavacanāc ccḥ-voḥ ś-ūḍ-anunāsike
    ca (*6,4.19) iti ūṭḥ na bhavati  / bali iti kim ? ūyyate  / knūyyate  / ūrvaṃ
    lopagrahaṇaṃ kim ? verapṛktalopāt pūrvaṃ vali lopo yathā syāt  / kaṇḍūyateḥ kvip-kaṇḍūḥ  /
    lolūyateḥ - lolūḥ  / vraścādīnām upadeśasāmarthyāt vali lopo na bhavati  / vṛścati  /
    vavṛśca ity atra api hi samprasāraṇahalādiḥśeṣayor bahiraṅgatvāt prāpnoti // [#614]
