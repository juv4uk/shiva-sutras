source_id: KASIKA-4.3.104
locator:
  sutra: 4.3.104
witness_text:
  sutra: kalāpi-vaiśampāyana-antevāsibhyaś ca
  commentary: kalāpyantevāsināṃ vaiśampāyanāntevāsināṃ ca ye vācakāḥ śabdās tebhyo
    ṇiniḥ pratyayo bhavati tena proktam ity etasmin viṣaye  / aṇo 'pavādaḥ  / chaṃ
    tu paratvād bādhate  / tatra kalāpyantevāsinaścatvāraḥ - haridruḥ, chagalī, tumburuḥ,
    ulapaḥ iti  / vaiśampāyanāntevasinaḥ nava - ālambiḥ, palaṅgaḥ, kamalaḥ, ṛcābhaḥ,
    āruṇiḥ, tāṇḍyaḥ, śyāmāyanaḥ, kaṭhaḥ, kalāpī iti  / pratyakṣa-kāriṇo gṛhyante na
    tu vyavahitāḥ śaiṣyaśiṣyāḥ  / kutaḥ ? kalāpikhāṇḍāyana-grahaṇāt  / tathā hi vaiśampāyanāntevāsī
    kalāpī, tadantevāsino vaiśampāyanāntevāsina eva bhavanti, kiṃ kalāpi-grahaṇena
    ? tathā vaiśampāyanāntevāsī kaṭhas tadantevāsī khāṇḍāyanaḥ, tasya kiṃ śaunakādisu
    pāṭhena ? tad etat pratyakṣakāri-grahaṇasya liṅgam  / kalāpyanatevāsibhyaḥ tāvat
    - haridruṇā proktam adhīyate hāridraviṇaḥ  / taumburaviṇaḥ  / aulapinaḥ  / chaṅgalinaḥ
    ḍhinukaṃ vakṣyati  / vaiśampāyanāntevāsibhyaḥ - ālambinaḥ  / pālaṅginaḥ  / kāmalinaḥ  /
    ārcābhinaḥ  / āruṇinaḥ  / tāṇḍinaḥ  / śyāmāyaninaḥ  / kaṭhāllukaṃ vakṣyati, kalāpinaścāṇam  /
    [#423] haridrureṣāṃ prathamastataśchagalitumburū  / ulapena caturthena kālāpakam
    iha+ucyate // ālambiścarakaḥ prācāṃ palaṅgakamalāvubhau  / ṛcābhāruṇitāṇḍyāś ca
    madhyamīyāstrayo 'pare // śyāmāyana udicyeṣu uktaḥ kaṭhakalāpinoḥ  / carakaḥ iti
    vaiśampāyanasyākhyā, tatsambandhena sarve tadantevāsinaścarakāḥ ity ucyante //
