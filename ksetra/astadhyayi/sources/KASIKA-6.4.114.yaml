source_id: KASIKA-6.4.114
locator:
  sutra: 6.4.114
witness_text:
  sutra: id daridrasya
  commentary: daridrāteḥ halādau sārvadhātuke kṅiti parataḥ ikarādeśo bhavati  / daridritaḥ
    daridrithaḥ  / daridrivaḥ  / daridrimaḥ  / hali ity eva, daridrati  / kṅiti ity
    eva, daridrāti  / daridrāter ārdhadhātuke lopo vaktavyaḥ  / siddhaś ca pratyayavidhau
    bhavati iti vaktavyam  / daridrāti iti daridraḥ  / ākārāntalakṣaṇo ṇapratyayo
    na bhavati, pacāditvādajeva bhavati  / na daridrāyake lopo daridrāṇe ca neṣyate  /
    didaridrāsatītyeke didaridriṣatīti vā // adyatanyāṃ veti vaktavyam  / adaridrīt,
    adaridrāsīt  / daridrasya iti nirdeśe chāndasaṃ hrasvatvam draṣtavyam //
