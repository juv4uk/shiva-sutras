source_id: KASIKA-1.2.28
locator:
  sutra: 1.2.28
witness_text:
  sutra: acaś ca
  commentary: paribhāṣā iyaṃ sthāni-niyama-arthā hrasva-dīrgha-plutaḥ svasañjñayā
    śiṣyamāṇā aca eva sthāne veditavyāḥ  / vakṣyati hrasvo napuṃsake prātipadikasya
    (*1,2.47), rai--atiri  / nau--atinu  / go--upagu  / acaḥ iti kim ? suvāg brahmaṇa-kulam  /
    akṛt-sārvadhātukayor dīrghaḥ (*7,4.25) -- cīyate  / śrūyate  / acaḥ iti kim ?
    bhidyate  / dhidyte  / vākyasya ṭeḥ pluta udāttaḥ (*7,2.82) --devadatta3  / yajñadatta3  /
    acaḥ iti kim ? agnici3t  / somasu3t  / takārasya mā bhūt  / svasañjñayā vadhāne
    niyamaḥ  / ac iti vartate  / iha mā bhūt  / dyauḥ panthāḥ  / saḥ dyaubhyām  /
    dyubhiḥ  / atra niyamo na asti //
