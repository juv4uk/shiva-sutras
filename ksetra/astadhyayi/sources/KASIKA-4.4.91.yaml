source_id: KASIKA-4.4.91
locator:
  sutra: 4.4.91
witness_text:
  sutra: nau-vayo-dharma-viṣa-mūla-mūla-sītā-tulābhyas tārya-tulya-prāpya-vadhya-ānāmya-sama-samita-saṃmiteṣu
  commentary: nāvādhibhyo 'ṣṭabhyaḥ śabdebhyo 'ṣṭasv eva tāryādiṣv artheṣu yathāsaṅkhyaṃ
    yat pratyayo bhavati  / pratyayārthadvāreṇa tṛtīyā samarthavibhaktir labhyate  /
    nāvā tāryam navyam udakam  / navyā nadī  / śakyārthe kṛtyaḥ  / vayasā tulyaḥ vayasyaḥ
    sakhā  / sañjñādhikāro 'bhidheyaniyamārthaḥ  / tena vayasā tulye śatrau na bhavati  /
    dharmeṇa prāpyaṃ dharmyam  / nanu ca dharmādanapete iti vakṣyamāṇena+eva siddham
    ? na+etad asti  / dharmaṃ yad anuvartate tad dharmād anapetam ity ucyate  / phalaṃ
    tu dharmād apety eva, kāryavirodhitvād dharmasya  / viṣeṇa vadhyaḥ viṣyaḥ  / viṣeṇa
    vadham arhati ity arthaḥ  / mūlena ānāmyam mūlyam  / ānāmyam abhibhavanīyam  /
    paṭādīnām utpattikāraṇaṃ mūlaṃ tena tadabhibhūyate śeṣīkriyate  / mūlaṃ hi saguṇaṃ
    mulyaṃ karoti  / poradupadhāt (*3,1.98) iti yati prāpte ānāmyam iti nipātanāt
    ṇyat  / mūlena samaḥ mūlyaḥ paṭaḥ  / upadānena samānaphalaḥ ity arthaḥ  / sītayā
    samitaṃ sītyam kṣetram  / samitaṃ saṅgatam ity arthaḥ  / rathasītāhalebhyo yad
    vidhau iti tad antavidhir api iṣyate  / paramasītyam  / uttarasītyam  / dvisītyam  /
    trisītyam  / tulyā saṃmitaṃ tulyam  / saṃmitaṃ samānaṃ, sadṛśam ity arthaḥ  /
    yathā tulā paricchinatti param evaṃ tad api iti //
