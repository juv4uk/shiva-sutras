source_id: KASIKA-3.4.62
locator:
  sutra: 3.4.62
witness_text:
  sutra: nā-dhā-arthapratyaye cvy-arthe
  commentary: nā-artho dhā-arthaś ca pratyayo yasmāt sa evam ucyate  / nādhārthapratyaye
    śabde cvy-arthe upapade kṛbhvoḥ dhātvoḥ ktvāṇamulau pratyayu bhavataḥ  / anānā
    nānā kṛtvā gataḥ nānākṛtya gataḥ, nānā kṛtvā gataḥ, nānākāraṃ gataḥ  / vinākṛtya
    gataḥ, vinā kṛtvā gataḥ, vinākāraṃ gataḥ  / nānābhūya gataḥ, nānā bhūtvā gataḥ,
    nānābhāvaṃ gataḥ  / vinābhūya gataḥ, vinā bhūtvā gataḥ, dvinābhāvaṃ gataḥ  / dvidhākṛtya
    gataḥ, dvidhā kṛtvā gataḥ, dvidhākāraṃ gataḥ  / dvidhābhūya gataḥ, dvidhā bhūtvā
    gataḥ, dvidhābhāvaṃ gataḥ  / dvaidhaṃkṛtya gataḥ, dvaidhaṃ kṛtvā gataḥ, dvaidhaṃkāraṃ
    gataḥ  / dvaidhaṃbhūya gataḥ, dvaidhaṃ bhūtvā gataḥ, dvaidhaṃbhāvaṃ gataḥ  / pratyaya-grahaṇaṃ
    kim ? hiruk kṛtvā  / pṛthak kṛtvā  / cvy-arthe iti kim ? nānā kṛtvā kāṣṭhāni gataḥ  /
    dhārtham artha-grahaṇam, nā punar eka eva, vinañbhyāṃ nānāñau iti //
