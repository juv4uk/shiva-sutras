source_id: KASIKA-6.1.127
locator:
  sutra: 6.1.127
witness_text:
  sutra: iko 'savarṇe śākalyasya hrasvaś ca
  commentary: iko 'savarne aci parataḥ śākalyasya ācāryasya matena prakṛtyā bhavanti,
    hrasvaś ca tasya ikaḥ sthāne bhavati  / dadhi atra, dadhyatra  / madhu atra, madhvatra  /
    kumāri atra, kumāryatra  / kiśori atra, kiśoryatra  / ikaḥ iti kim ? khaṭvendraḥ  /
    asavarṇe iti kim  / kumārīndraḥ  / śākalyasya grahaṇaṃ pūjārtham  / ārambhasāmarthyād
    eva hi yaṇādeśena saha vikalpaḥ siddhaḥ  / sinnityasamāsayoḥ śākalapratiṣedho
    vaktavyaḥ  / siti - ayaṃ te yonir ṛtviyaḥ  / nityasamāse - vyākaranam  / kumāryartham  /
    īṣā akṣādiṣu chandasi prakṛtibhāvamātraṃ vaktavyam  / īṣā akṣo hiraṇyayaḥ  / kā
    imare piśaṅgilā  / pathā agaman //
