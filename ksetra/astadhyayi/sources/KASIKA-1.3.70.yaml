source_id: KASIKA-1.3.70
locator:
  sutra: 1.3.70
witness_text:
  sutra: liyaḥ saṃmānana-śālīnīkaraṇayoś ca
  commentary: ṇeḥ iti vartate  / akartr-abhiprāya-artho 'yam-ārambhaḥ  / līṅ śleṣaṇe
    iti divādau paṭhyate lī śleṣaṇe iti ca kryādau  / viśeṣābhāvād dvayor api grahaṇam  /
    liyo ṇy-antāt saṃmānane śālīnīkaraṇe ca vartamānād ātmanepadaṃ bhavati  / ca-śabdāt
    pralambhane ca  / sammānanaṃ pūjanam - jaṭābhir ālāpayate  / pūjāṃ samadhigacchati
    ity arthaḥ  / śālīnīkaraṇaṃ nyagbhāvanam - śyeno vartikāmullāpayte  / nyakkaroti
    ity arthaḥ  / pralambhane - kastvāmullāpayate  / visaṃvādayati it yarthaḥ  / vibhāṣā
    līyateḥ (*6,1.51) iti vā ātvaṃ vidhīyate  / tad-asmin viṣaye nityam anyatra vikalpaḥ  /
    vyavasthita-vibhāṣā hi sā  / sammānanādiṣu iti kim ? bālakamullāpayati //
