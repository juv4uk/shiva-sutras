source_id: KASIKA-2.1.65
locator:
  sutra: 2.1.65
witness_text:
  sutra: poṭā-yuvati-stoka-katipaya-gṛṣṭi-dhenu-vaśā-vehad-baṣkayaṇī-pravaktṛ-śrotriya-adhyāpaka-dhūrtair
    jātiḥ
  commentary: ubhaya-vyañjanā poṭā ity abhidhīyate  / gṛṣṭirekavāraprasūtā  / dhenuḥ
    pratyagraprasūtā  / vaśā vandhyā  / dehad garbhapātinī  / baṣkayaṇī taruṇavatsā  /
    poṭādibhiḥ saha jātivāci subantaṃ samasyate, tatpuruṣaś ca samāso bhavati  / ibhapoṭā  /
    ibhayuvatiḥ  / agnistokaḥ  / udaśvitkatipayam  / gogṛṣṭiḥ  / godhenuḥ  / govaśā  /
    govehat  / gobaṣkayaṇī  / kaṭhapravaktā  / kaṭhaśrotriyaḥ  / kaṭhādhyāpakaḥ  /
    kaṭhadhūrtaḥ  / jātiḥ iti kim ? devadatttaḥ pravaktā  / dhūrta-grahaṇam akutsa-artham
    // [#117]
