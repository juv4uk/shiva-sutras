source_id: KASIKA-6.1.16
locator:
  sutra: 6.1.16
witness_text:
  sutra: grahi-jyā-vayi-vyadhi-vaṣṭi-vicati-vṛścati-pṛcchati-bhṛjjatīnāṃ ṅiti ca
  commentary: graha upādāne, jyā vayohānau, veño vayiḥ (*2,4.41), vyadha tāḍane, vaśa
    kāntau, vyac vyājīkaraṇe, ovraścū chedane, praccha jñīpsāyām, bhrasja pāke ity
    eteṣāṃ dhātūnāṃ ṅīti pratyaye parataḥ cakārāt kati ca saṃprasāraṇaṃ bhavati  /
    graha - gṛhītaḥ  / gṛhītavān  / ṅiti - gṛhṇāti jarīgṛhyate  / jyā - jīnaḥ  / jīnavān  /
    lvādibhyaḥ (*8,2.44) iti niṣṭhānatvam  / ṅiti- jināti  / jejīyate  / halaḥ (*6,4.2)
    iti samprasāraṇadīrghe kṛte pvādīnāṃ iti hrasvaḥ kriyate  / vayi - liṭi parataḥ
    veño vayiḥ ādeśaḥ, tasya ṅidabhāvāt kidevodāhriyate  / ūyatuḥ  / ūyuḥ  / yady
    evaṃ vayigrahaṇam anarthakam, yajādiṣu veñ paṭhyate ? na+evaṃ śakyam  / liṭi tasya
    veñaḥ (*6,1.40) iti pratiṣedho vakṣyate, tatra yathā+eva sthānivadbhāvād vyervidhiḥ
    evaṃ pratiṣedho 'pi prāpnoti ? na+eṣa doṣaḥ  / liṭi vayo yaḥ (*6,1.38) iti yakārasya
    saṃprasāraṇapratiṣedhād vayervidhau grahaṇaṃ pratiṣedhe cāgrahaṇamanumāsyate ?
    satyam etat  / eṣa eva arthaḥ sākṣān nirdeśena vyeḥ spaṣṭīkriyate  / vyadha -
    viddhaḥ  / viddhavān  / ṅiti - vidhyati  / vevidhyate  / vaśa - uśitaḥ  / uśitavān  /
    ṅiti - uṣṭaḥ  / uśanti  / vyaca - vicitaḥ  / vicitavān  / ṅiti - vicati  / vevicyate  /
    vyaceḥ kuṭāditvamanasi pratipāditam, tena sarvatra añṇiti pratyaye samprasāraṇaṃ
    bhavati, udvicitā, udvicitum, udvicitavyam iti  / vraśceḥ - vṛkṇaḥ  / vṛkṇavān  /
    atha katham atra kutvaṃ, vraścabhrasja iti hi ṣatvena bhavitavyam ? niṣṭhādeśaḥ
    ṣatvasvarapratyayavidhīḍvidhiṣu siddho vaktavyaḥ  / [#601] tatra ṣtvaṃ prati natvasya
    siddhatvād jñalādir niṣṭhā na bhavati  / kutve tu kartavye tad asiddham eva iti
    pravartate kutvam  / ṅiti - vṛścati  / varīvṛścyate  / praccha - pṛṣṭaḥ  / pṛṣṭavan  /
    ṅiti - pṛcchati  / parīpṛchyate  / praśnaḥ  / naṅi tu praśne ca āsannakāle (*3,2.117)
    iti nipātanād asaṃprasāraṇam  / bhrasja - bhṛṣṭaḥ  / bhṛṣṭavān  / ṅiti - bhṛjjati  /
    barībhṛjyate  / sakārasya jñalāṃ jaś jñaśi (*7,4.53) iti jaśtvena dakāraḥ, stoḥ
    ścunā ścuḥ (*8,4.40) iti ścutvena jakāraḥ //
