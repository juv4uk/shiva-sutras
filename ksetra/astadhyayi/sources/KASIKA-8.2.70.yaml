source_id: KASIKA-8.2.70
locator:
  sutra: 8.2.70
witness_text:
  sutra: amnar-ūdhar-avar ity ubhayathā chandasi
  commentary: amnas ūdhas avas ity eteṣāṃ chandasi viṣaye ubhayathā bhavati, rurvā
    repho vā  / amnas - amna eva, amnareva  / ūdhas - ūdha eva, ūdhar eva  / avas
    - avaḥ eva, avereva  / yadā rutvaṃ tadā bhobhago 'gho 'pūrvasya yo 'śi (*8,3.17)
    iti yakāraḥ  / chandasi bhāṣāyāṃ ca vibhāṣā pracetaso rājany upasaṅkhyānaṃ kartavyam  /
    pracetā rājan, praceto rājan  / aharādīnāṃ patyādiṣu upasaṅkhyānaṃ kartavyam  /
    aharpatiḥ, ahaḥ patiḥ  / gīrpatiḥ, gīḥpatiḥ  / dhūrpatiḥ, dhūḥpatiḥ  / visarjanīyabādhanārtham
    atra pakṣe rephasya+eva repho vidhīyate //
