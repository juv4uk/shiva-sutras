source_id: KASIKA-1.3.62
locator:
  sutra: 1.3.62
witness_text:
  sutra: pūrvavat sanaḥ
  commentary: sanaḥ pūrvo yo dhātuḥ ātmanepadī, tadvat sannantād ātmanepadam bhavati  /
    yena nimittena pūrvasmād ātmanepadaṃ vidhīyate tena+eva sannantādapi bhavati  /
    anudātta-ṅita ātmanepadam (*1,3.12) -- āste, śete  / sannantād api tad eva nimittam
    - āsisiṣate, śiśayiṣate  / ner viśaḥ (*1,3.17) -- niviśate, nivivikṣate  / āṅa
    udgamne (*1,3.40) -- ākramate, ācikraṃsate  / iha na bhavati, śiśatsati, mumūrṣati  /
    na hi śadimriyatimātram ātmanepadanimittam  / kiṃ tarhi ? śidādy api, tac ca+iha
    na asti  / yasya ca pūrvatra+eva nimitta-bhāvaḥ pratiśidhyate, tat sannanteśv
    apy animittam -- anucikīrṣati  / parācikīrṣati  / iha jugupsate, mīmāṃsate iti
    ? anudātta-ṅita ity eva siddham ātmanepdam  / avayave kṛtaṃ liṅgaṃ samudāyasya
    viśeṣakaṃ bhavati iti //
