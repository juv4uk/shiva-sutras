locator:
  sutra: 2.4.27
witness_text:
  sutra: pūrvavad-aśvava-ḍavau
  commentary: aśva-vaḍavayor vibhāṣa-ekavad-bhāvaḥ uktaḥ  / tatra+ekavad-bhāvād anyatra
    paravilliṅgatāyāṃ prāptāyām idam ārabhyate  / aśva-vaḍavayoḥ pūrvavalliṅgaṃ bhavati  /
    aśvaś ca vaḍavā ca aśvavaḍavau  / artha-atideśaś ca ayam, na nipātanam  / tatra
    dvivacanamatantram  / vacana-antare 'pi pūrvavalliṅgatā bhavati, aśva-vaḍavān,
    aśva-vaḍavaiḥ iti //
