locator:
  sutra: 1.4.90
witness_text:
  sutra: lakṣana-itthaṃ-bhūta-ākhyāna-bhāga-vīpsāsu prati-pary-anavaḥ
  commentary: lakṣaṇe, itthaṃ-bhūta-ākhyāne, bhāge, vīpsāyāṃ ca viśāya-bhūtāyāṃ prati
    pari anu ity ete karmapravacanīya-sañjñā bhavanti  / lakṣaṇe tāvat - vṛkṣaṃ prati
    vidyotate vidyut  / vṛkṣaṃ pari  / vṛkṣam anu  / itthaṃ-bhūta-ākhyāne - sādhur
    devadatto mātaram prati  / mātaram pari  / mātaram anu  / bhāge - yad atra māṃ
    prati syāt  / mām pari syāt  / māmanu syāt  / vīpsāyām - vṛkṣaṃ vṛkṣam prati siñcati  /
    pari siñcati  / anu siñcati  / lakṣaṇādiṣu iti kim ? odanaṃ pariṣiñcati  / atha
    pariśabda-yoge pañcamī kasmān na bhavati pañcamy-apa-aṅ-paribhiḥ (*2,3.10) iti
    ? varjanaviṣāye sā vidhīyate, apaśabda-sāhacaryāt //
