source_id: KASIKA-2.1.72
locator:
  sutra: 2.1.72
witness_text:
  sutra: mayūra-vyaṃsaka-ādayaś ca
  commentary: samudāyā eva nipātyante  / mayūra-vyaṃsaka-ādayaḥ śabdāḥ tatpuruṣasañjñā
    bhavati  / cakāro 'vadhāraṇa-arthaḥ , paramamayūravyaṃsakaḥ iti samāsāntaraṃ na
    bhavati  / mayūravyaṃsakaḥ  / chātravyaṃsakaḥ  / kāmbojamuṇḍaḥ  / yavanamuṇḍaḥ  /
    chandasi - hastegṛhya  / pādegṛhya  / lāṅgalegṛhya  / punardāya  / ehīḍādayo 'nyapadārthe
    - ehīḍam  / ehiyavaṃ vartate  / ehivāṇijākriyā  / apehivāṇijā  / prehivāṇijā  /
    ehisvāgatā  / apohisvāgatā  / prehisvāgatā  / ehidvitīyā  / apehidvitīyā  / ihavitarkā  /
    prohakaṭā  / apohakaṭā  / prohakardamā  / apohakardamā  / uddharacūḍā  / āharacelā  /
    āharavasanā  / āharavanitā  / kṛntavicakṣaṇā  / uddharotsṛjā  / uddhamavidhamā  /
    utpacivipacā  / utpatanipatā  / uccāvacam  / uccanīcam  / acitopacitam  / avacitaparācitam  /
    niścapracam  / akiñcanam  / snātvākālakaḥ  / pītvāsthirakaḥ  / bhuktvāsuhitaḥ  /
    proṣyapāpīyān  / utpatyapākalā  / nipatyarohiṇī  / niṣaṇṇāśyāmā  / apehiprasavā  /
    ihapañcamī  / ihadvitīyā  / jahikarmaṇā bahulamābhīkṣṇye kartāraṃ cābhidadhāti
    - jahijoḍaḥ  / ujjahijoḍaḥ  / jahistambaḥ  / ujjahistambaḥ  / ākhyātamākhyātena
    kriyāsātatye - aśnītapibatā  / pacatabhṛjjatā  / khādatamodatā  / khādatavamatā  /
    khādatācamatā  / āharanivapā  / āvapaniṣkirā  / utpacacvipacā  / bhindhilavanā  /
    chindhivicakṣanā  / pacalavanā  / pacaprakūṭā  / avihitalakṣanas tatpuruṣo mayūra-vyaṃsaka-ādiṣu
    draṣṭavyaḥ // iti śrījayādityaviracitāyām kāśikāyāṃ vṛttau dvitīyādhyāyasya prathamaḥ
    pādaḥ // dvittiyo 'dhyayaḥ dvitīyaḥ pādaḥ [#119]
