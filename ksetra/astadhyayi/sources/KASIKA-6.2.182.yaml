source_id: KASIKA-6.2.182
locator:
  sutra: 6.2.182
witness_text:
  sutra: parer abhitobhāvi maṇḍalam
  commentary: parer uttaram abhitobhavivacanaṃ maṇḍalaṃ ca antodāttaṃ bhavati  / parikūlam  /
    paritīram  / parimaṇḍalam  / bahuvrīhir ayaṃ prādisamāso 'vyayībhāvo vā  / avyayībhāvapakṣe
    'pi hi pari-praty-upa-apā varjyamāna-ahorātra-avayaveṣu (*6,2.33) iti pūrvapadaprakṛtisvaratvaṃ
    prāptam anena bādhyate  / abhitaḥ ity ubhayataḥ  / abhito bhāvo 'sya asti iti
    tadabhitobhāvi  / yac ca+evaṃ svabhāvaṃ kūlādi tad abhitobhāvigrahaṇena gṛhyate
    // [#696]
