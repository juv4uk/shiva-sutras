source_id: KASIKA-1.1.9
locator:
  sutra: 1.1.9
witness_text:
  sutra: tulya-āsya-prayarnaṃ savarṇam
  commentary: tulya-śabdaḥ sadṛśa-paryāyaḥ  / āsye bhavam-āsyaṃ tālv-ādi-sthānam  /
    prayatanaṃ prayatnaḥ spaṛṣṭata-ādir varṇa-guṇaḥ  / tulya āsye prayatno yasya varṇasya
    yena varṇena saha sa samānajātīyaṃ prati savarṇasañjño bhavati  / [#9] catvāra
    ābhyantarāḥ prayatnāḥ savarṇasaṃ jñāyām āśrīyante -- spṛṣṭatā, īṣat-spṛṣṭatā,
    saṃvṛtatā, vivṛtatā ca iti  / a a a iti trayo 'kārā udātta-anudātta-svaritāḥ pratyekaṃ
    sānunāsikā niranunāsikāś ca hrasva-dīrgha-pluta-bhedād aṣṭādaśa dhā bhidyante  /
    tathā i-varṇaḥ, tathā u-varṇaḥ, tathā ṛ-varṇaḥ  / ḷ-varṇasya dīrghā na santi,
    taṃ dvādaśa-bhedam ācakśate  / sandhy-akṣarāṇāṃ hrasvā na santi, tāny api dvādaśa-prabhedāni  /
    antaḥsthā dviprabhedāḥ, rephavarjitā yavalāḥ sānunāsikā niranunāsikāśca  / rephoṣmaṇāṃ
    savarṇā na santi  / vargyo vargyeṇa savarṇaḥ  / daṇḍāgram  / khaṭvāgram  / āsya-grahaṇaṃ
    kim ? kacaṭatapānāṃ bhinna-sthānānāṃ tulya-prayatnānāṃ mā bhūt  / kiṃ ca syāt
    ? tarptā, tarptum  ity atra jharo jhari savarṇe (*8,4.65) iti pakārasya takāre
    lopaḥ syāt  / prayatna-grahaṇaṃ kim ? icuyaśānāṃ tulya-sthānānāṃ bhinna-jātīyānāṃ
    mā bhūt  / kiṃ ca syāt ? aruścyotati ity atra jharo jhari savarṇe (*8,4.65) iti
    śakārasya cakāre lopaḥ syāt  / rkāra-ḷkārayoḥ savarṇasñjñā vaktavyā  / hotḷkāraḥ  /
    hotṛkāraḥ  / ubhayoḥ ṛvarṇasya ḷvarṇasya ca āntaratamaḥ savarṇo dīrgho nāsti iti
    rkāra eva dīrgho bhavati  / savarṇa-pradeśāḥ - akaḥ savarṇe dīrghaḥ (*6,1.101)
    ity evam ādayaḥ //
