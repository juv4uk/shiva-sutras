source_id: KASIKA-5.4.17
locator:
  sutra: 5.4.17
witness_text:
  sutra: saṅkyāyāḥ kriyā-abhyāvṛttigaṇane kṛtvasuc
  commentary: saṅkhyāśabdebhyaḥ kriyābhyāvṛttigaṇane vartamānebhyaḥ svārthe kṛtvasuc
    pratyayo bhavati  / paunaḥpunyam abhyāvṛttiḥ  / ekakakārtṛṇāṃ tulyajātīyānāṃ kriyāṇāṃ
    janmasaṅkhyānaṃ kriyābhyāvṛttigaṇanaṃ, tatra pratyayaḥ  / pañcavārān bhuṅkte pañcakṛtvaḥ  /
    saptakṛtvaḥ  / saṅkhyāyāḥ iti kim ? mūrīn vārān bhuṅkte  / kriyāgrahaṇam kimartham,
    yāvatā abhyavṛttiḥ kriyāyā eva sambhavati, na dravyaguṇayoḥ ? uttarārthaṃ kriyāgrahaṇam  /
    ekasya sakṛc ca (*5,4.19) ity atra kriya+eva gaṇyate, na abhyāvṛttiḥ, asambhavāt  /
    abhyāvṛttigrahaṇaṃ kim ? kriyāmātragrahaṇe mā bhūt  / pañca pākāḥ  / daśa pākāḥ  /
    [#562] gaṇanagrahaṇaṃ kimartham, yāvatā gaṇanātmikaiva saṅkhyā ? akriyamāṇe gaṇanagrahaṇe
    kriyābhyāvṛttau vartamānebhyaḥ saṅkhyeyavacanebhya eva pratyayaḥ syāt, śatavārān
    bhuṅkte śatakṛtvaḥ iti ? iha na syāt, śataṃ vārāṇāṃ bhuṅkte iti ? na hy atra abhyāvṛttau
    śataśabdaḥ, saṅkhyānamātravṛttitvāt  / gaṇanagrahaṇāt tu sarvatra siddhaṃ bhavati
    //
