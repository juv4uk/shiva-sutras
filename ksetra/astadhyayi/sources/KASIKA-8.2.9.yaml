source_id: KASIKA-8.2.9
locator:
  sutra: 8.2.9
witness_text:
  sutra: m-ād-upadhāyāś ca mator vo 'yava-ādibhyaḥ
  commentary: matoḥ iha kāryitvena upādānāt sāmarthyalabdhaṃ prātipadikaṃ tat māt
    iti makārāvarṇābhyāṃ viśiṣyate  / makārāvarṇaviśiṣṭayā ca upadhayā ity ayam artho
    bhavati  / makārāntāt makāropadhāt avarṇāntād avarṇopadhāt ca uttarasya matoḥ
    vaḥ ity ayam ādeśo bhavati, yavādibhyas tu parato na bhavati  / makārāntāt tāvat
    kiṃvān  / śaṃvān  / makāropadhāt - śamīvān  / dāḍimīvān  / avarṇāntāt - vṛkṣavān  /
    plakṣavān  / khaṭvāvān  / mālāvān  / avarṇopadhāt - payasvān  / yaśasvān  / bhāsvān  /
    mādupadhāyāś ca iti kim ? agnimāt  / vāyumān  / ayavādibhyaḥ iti kim ? yavamān  /
    dalmimān  / ūrmimān  / yava  / dalmi  / ūrmi  / bhūmi  / kṛmi  / kruñcā  / vaśā  /
    drākṣā  / eteṣāṃ mādupadhāyāś ca  / iti prāpnoti  / dhraji, dhvaji, sañji ity
    eteṣāṃ chandasīraḥ (*8,2.15) iti  / harit, kakut, garut ity eteṣāṃ jhayaḥ (*8,2.10)
    iti  / ikṣu, madhu, druma, maṇḍa, dhūma ity eteṣāṃ sañjñāyām (*8,2.11) iti  /
    ākṛtigaṇaś ca yavādiḥ  / akṛtavattvo matub yavādiṣu draṣṭavyaḥ  / yasya sati nimitte
    matupo vattvaṃ na dṛśyate sa yavādiṣu draṣṭavyaḥ iha nṛmataḥ idaṃ nārmatam iti
    bahiraṅgalakṣaṇatvāt avarṇopadhasya matupo vattvaṃ na bhavati //
