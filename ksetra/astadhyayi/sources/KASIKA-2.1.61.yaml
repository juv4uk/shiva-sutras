witness_text:
  sutra: san-mahat-parama-uttama-utkṛṣṭāḥ pūjyamānaiḥ
  commentary: sat mahat parama uttama utkṛṣṭa ity ete pūjyamānaiḥ saha samasyante,
    tatpuruṣaś ca samāso bhavati  / pūjyamānaiḥ iti vacanāt pūjāvacanāḥ sadādayo vijñāyante  /
    satpuruṣaḥ  / mahāpuruṣaḥ  / paramapuruṣaḥ  / uttamapuruṣaḥ  / utkṛṣṭapuruṣaḥ  /
    pūjyamānaiḥ iti kim ? utkṛṣṭo gauḥ kadarmāt //
