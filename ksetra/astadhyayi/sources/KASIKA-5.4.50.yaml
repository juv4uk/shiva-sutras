source_id: KASIKA-5.4.50
locator:
  sutra: 5.4.50
witness_text:
  sutra: abhūtatadbhāve kṛ-bhv-astiyoge sampadyakartari cviḥ
  commentary: kāraṇasya vikārarūpeṇa abhūtasya tadātmanā bhāvaḥ abhūtatadbhāvaḥ  /
    sampadyateḥ kartā sampadyakartā  / sampadyakartari vartamānāt prātipadikāt abhūtatadbhāve
    gamyamāne kṛbhvastibhir dhātubhir yoge cviḥ pratyayo bhavati  / aśuklaḥ śuklaḥ
    sampadyate, taṃ karoti śuklīkaroti  / malinaṃ śuklīkaroti  / śuklībhavati  / śuklīsyāt  /
    ghaṭīkaroti mṛdam  / ghaṭībhavati  / ghaṭīsyāt  / abhūtatadbhāve iti kim ? śuklaṃ
    karoti  / na atra prakṛtir vivakṣitā  / kṛbhvastiyoge iti kim ? aśuklaḥ śuklo
    jāyate  / sampadyakrtari iti kim, yāvatā abhūtatadbhāvasāmarthyāl labdham eva
    sampadyakartṛtvam ? kārakāntarasampattau mā bhūt, adevagṛhe devagṛhe sampadyate  /
    devagṛhasyādheyaviśeṣasambandhena abhūtatadbhāvaḥ sattvādhikaraṇasya, na kartuḥ
    iti ? //
