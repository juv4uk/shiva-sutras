locator:
  sutra: 5.1.136
witness_text:
  sutra: brahmaṇas tvaḥ
  commentary: hotrābhyaḥ ity anuvartate  / brahman-śabdād hotrāvācinaḥ tvaḥ pratyayo
    bhavati bhāvakarmaṇoḥ  / chasya apavādaḥ  / brahmaṇo bhāvaḥ karma vā brahmatvam  /
    na iti vaktavye tvavacanaṃ talo bādhanārtham  / yas tu jāti-śabdo brāhmaṇaparyāyo
    brahman-śabdaḥ, tataḥ tvatalau bhavata eva  / brahmatvam, brahmatā  / bhavanāvadhikayor
    nañstañor adhikāraḥ samāptaḥ // iti kāśikāyāṃ vṛttau pañcamādhyāyasya prathamaḥ
    pādaḥ ______________________________________________________ pañcamādhyāyasya
    dvitīyaḥ pādaḥ  / [#498]
