source_id: KASIKA-8.2.25
locator:
  sutra: 8.2.25
witness_text:
  sutra: dhi ca
  commentary: dhakārādau pratyaye parataḥ sakārasya lopo bhavati  / alavidhvam, alaviḍhvam  /
    apavidhvam, apaviḍhvam  / yadyatra sakāralopo na syāt, sicaḥ ṣatve jaśtve ca vibhāṣeṭaḥ
    (*8,3.79) iti mūrdhanyābhāvapakṣe 'pi na dhakāraḥ śrūyeta  / itaḥ prabhṛti sicaḥ
    sakārasya lopa iṣyate  / iha na bhavati, cakāddhi palitaṃ śiraḥ iti  / tathā payo
    dhāvati ity evam ādāv api na bhavati  / sagdhiḥ, babdhām iti chāndaso varṇa lopaḥ  /
    bhāṣyakārastvāha, cakādhi ity eva bhavitavyam iti  / tena payo dhāvati ity evam
    ādau yatnānataramāstheyam  / [#916] dhi sakāre sico lopaścakāddhīti prayojanam  /
    āśādhvaṃ tu kathaṃ jaśtvaṃ sakārasya bhaviṣyati // sarvam evaṃ prasiddhaṃ syāc
    chru tiścāpi na bhidyate  / luṅaścāpi na murdhanye grahaṇaṃ seṭi duṣyati // ghasibhasor
    na sidhyeta tasmāt sijgrahaṇaṃ na tat  / chāndaso varṇalopo vā yatheṣkartāramadhvare
    // niṣkartāramadhvarasya ity evaṃ prāpte //
