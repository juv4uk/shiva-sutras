source_id: KASIKA-5.1.124
locator:
  sutra: 5.1.124
witness_text:
  sutra: guṇavacana-brāhmaṇādibhyaḥ karmaṇi ca
  commentary: guṇam uktavanto guṇavacanāḥ  / guṇavacanedhyo brāhmaṇādibhyaś ca tasya
    iti ṣaṣthīsamarthebhyaḥ karmaṇyabhidheye ṣyañ pratyayo bhavati  / cakārād bhāve
    ca  / karma-śabdaḥ kriyāvacanaḥ  / jaḍasya bhāvaḥ karma vā jāḍyam  / brāhmaṇādibhyaḥ
    khalv api - brāhmaṇyam  / māṇavyam  / āpādaparisamāpter bhāvakarmādhikāraḥ  /
    brāhmaṇādir ākṛtigaṇaḥ  / ādi-śabdaḥ prakāravacanaḥ  / caturvarṇyādibhyaḥ svārthe
    upasaṅkhyānam  / catvāra eva varṇāḥ cāturvarṇyam  / cāturāśramyam  / trailokyam  /
    traisvaryam  / ṣāḍguṇyam  / sainyam  / sānnidhyam  / sāmīpyam  / aupamyam  / saukhyam  /
    brāhmaṇa  / vāḍava  / māṇava  / cora  / mūka  / ārādhaya  / virādhaya  / aparādhaya  /
    uparādhaya  / ekabhāva  / dvibhāva  / tribhāva  / anyabhāva  / samastha  / viṣamastha  /
    paramastha  / madhyamastha  / anīśvara  / kuśala  / kapi  / capala  / akṣetrajña  /
    nipuṇa  / arhato num ca ārhantyam  / saṃvādin  / saṃveśin  / bahubhāṣin  / bāliśa  /
    duṣpuruṣa  / kāpuruṣa  / dāyād  / viśasi  / dhūrta  / rājan  / saṃbhāṣin  / śīrṣapātin  /
    adhipati  / alasa  / piśāca  / piśuna  / viśāla  / gaṇapati  / dhanapati  / narapati  /
    gaḍula  / niva  / nidhāna  / viṣa  / sarvavedādibhyaḥ svārthe  / caturvedasya+ubhayapada-vṛddhiś
    ca  / cāturvaidyam  / iti brāhmaṇādiḥ // [#495]
