source_id: KASIKA-1.2.51
locator:
  sutra: 1.2.51
witness_text:
  sutra: lupi yuktavad-vyaktivacane
  commentary: lupi iti lup-sanñjñayā luptasya pratyayasya artha ucyate  / tatra lupi
    yuktavad-vyaktivacane bhavataḥ  / yuktavat iti niṣṭhā-pratyayena ktavatunā prakṛtyartha
    ucyate  / sa hi pratyaya-artham ātmanā yunakti  / tasya yuktavato vyaktivacane
    lub-arthe vidhīyete  / atha vā yuktaḥ prakṛty-arthaḥ pratyaya-arthena sambaddhaḥ,
    tasminn-iva vyaktivacane lub-arthe bhavataḥ  / saptamy-arthe vatiḥ  / vyaktivacane
    iti ca liṅga-saṅkhyayoḥ pūrvācarya-nirdeśaḥ, tad-īyam eva+idaṃ sūtram  / tathā
    ca asya pratyākhyānaṃ bhaviṣyate, tad aśiṣyaṃ sañjñā-pramāṇatvāt (*1,2.53) iti  /
    vyaktiḥ -- strī-pum-napuṃsakāni  / vacanam -- ekatva-dvitva-bahutvāni  / pañcalāḥ
    kṣatriyāḥ puṃliṅgā bahuvacana-viśayāḥ  / teṣāṃ nivāso janapadaḥ  / yathā teṣu
    kṣatriyeṣu vyaktivacane tadvajjanapade bhavataḥ  / pañcālāḥ  / kuravaḥ  / magadhāḥ  /
    matsyāḥ  / aṅgāḥ  / vaṅgāḥ  / sugmāḥ  / puṇḍrāḥ  / lupi iti kim ? luki mā bhūt  /
    [#45] lavaṇaḥ sūpaḥ  / lavaṇā yavāgūḥ  / lavaṇaṃ śākam  / vyaktivacane iti kim
    ? śirīṣāṇām adūrabhavo grāmaḥ śirīṣāḥ, tasya vanaṃ śirīṣavanam  / vibhāṣaa-oṣadhi-vanas-patibhyaḥ
    (*8,4.6) iti ṇatvaṃ na bhavati  / haritakyādiṣu vyaktiḥ  / harītakyāḥ phalāni
    harītakyaḥ phalāni  / khalatikādiṣu vacanam  / khalatikasya parvatasya adūrabhavāni
    vanāni khalatikaṃ vanāni //
