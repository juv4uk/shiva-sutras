source_id: KASIKA-5.2.29
locator:
  sutra: 5.2.29
witness_text:
  sutra: saṃ-pra-udaś ca kaṭac
  commentary: sam pra ud ity etebhyaḥ kaṭac pratyayo bhavati  / cakārād veśca  / saṅkaṭam  /
    prakaṭam  / utkaṭam  / vikaṭam  / kaṭacprakaraṇe 'lābūtilomābhaṅgābhyo rajasy
    upasaṅkhyānam  / alābūnāṃ rajaḥ alābūkaṭam  / tilakaṭam  / umākaṭam  / bhaṅgākaṭam  /
    goṣṭhādayaḥ sthānādiṣu paśunām ādibhya upasaṅkhyānam  / gavāṃ sthānaṃ gogoṣṭham  /
    mahiṣīgoṣṭham  / saṅghāte kaṭac vaktavyaḥ  / [#504] avīnāṃ saṅghātaḥ avikaṭam  /
    vistāre paṭac vaktavyaḥ  / avipaṭam  / dvitve goyugac  / uṣṭragoyugam  / aśvagoyugam  /
    prakṛtyarthasya ṣaṭtve ṣaṅgavac  / hastiṣaṅgavam  / aśvaṣaṅgavam  / vikāre snehe
    tailac  / eraṇḍatailam  / iṅgudītailam  / tilatailam  / bhavane kṣetre ikṣvādibhyaḥ
    śākaṭaśākinau  / ikṣuśākaṭam, ikṣuśākinam  / mūlaśākaṭam, mūlaśākinam //
