source_id: KASIKA-3.4.1
locator:
  sutra: 3.4.1
witness_text:
  sutra: dhātu-sambandhe pratyayāḥ
  commentary: dhātv-arthe dhātu-śabdaḥ  / dhātv-arthānāṃ sambandho dhātu-sambandhaḥ
    viśeṣaṇaviśeṣya-bhāvaḥ  / tasmin sati ayathākāloktā api pratyayāḥ sādhavo bhavanti  /
    agniṣṭomayājyasaya putro janitā  / kṛtaḥ kaṭaḥ śvo bhavitā  / bhāvi kṛtyam āsīt  /
    agniṣṭomayājī iti bhūtakālaḥ, janitā iti bhaviṣyatkālaḥ  / tatra bhūtaḥ kālaḥ
    bhaviṣyatkālena abhisambadhyamānaḥ sādhur bhavati  / viśeṣaṇaṃ guṇatvād viśeṣyakālam
    anurudhyate, tena viparyayo na bhavati  / pratyayādhikāre punaḥ pratyaya-grahaṇam
    adhātv-adhikāra-vihitā api pratyayāḥ taddhitā dhātu-sambandhe sati kālabhede sādhavo
    yathā syuḥ iti  / gomān āsīt  / gomān bhavitā  / gāvo vidyante 'sya iti vartamāna-vihito
    matup, āsīt bhavitā iti sambandhādtīte bhaviṣyati ca sādhur bhavati //
