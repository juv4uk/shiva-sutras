source_id: KASIKA-7.3.18
locator:
  sutra: 7.3.18
witness_text:
  sutra: je proṣṭhapadānām
  commentary: ja iti jātārtho nirdiśyate  / tatra yaḥ taddhito vihitaḥ tasmin ñiti,
    ṇiti, kiti ca parataḥ proṣthapadānām uttarasya acāmādeḥ acaḥ vṛddhir bhavati  /
    proṣṭhapadā nāma nakṣatram, tābhiḥ yuktaḥ kālaḥ ity aṇ  / tasya lubaviśeṣe (*4,2.4)
    iti lup  / proṣṭhapadāsu jātaḥ, ṛtunakṣatrebhyo 'ṇ ity aṇ, proṣthapādaḥ māṇavakaḥ  /
    je iti kim ? yadā proṣthapado megho dharaṇīmabhivarṣati, proṣthapadāsu bhavaḥ
    prauṣṭhapadaḥ  / proṣthapadānām iti bahuvacananirdeśāt paryāyo 'pi gṛhyate bhadrapādaḥ
    iti //
