witness_text:
  sutra: rājasūya-sūrya-mṛṣodya-rucya-kupya-kṛṣṭapacya-avyathyāḥ
  commentary: rājasuya surya mṛṣodya rucya kupya kṛṣṭapacya avyathya ity ete śabdāḥ
    kyapi nipātyante  / rājñā sotavyaḥ, rājā vā iha sūyate rājasūyaḥ kratuḥ  / sūsartibhyāṃ
    kyap, sarter utvaṃ, subater vā ruḍāgamaḥ  / sarati suvati va sūryaḥ  / mṛṣāpūrvasya
    vadateḥ pakṣe yati prāpte nityaṃ kyab nipātyate  / mṛṣā-pūrvasya mṛṣodyam  / rocate
    'sau rucyaḥ  / kartari kyap  / guper ādeḥ ktvaṃ ca sajñāyām  / kupyam  / gopyam
    anyat  / kṛṣṭe pacyante kṛṣṭapcyāḥ  / karmakartari nipātanam  / na vyathate avyathyaḥ
    //
