locator:
  sutra: 6.2.105
witness_text:
  sutra: uttarapadavṛddhau sarvaṃ ca
  commentary: uttarapadasya (*7,3.10) ity adhikṛtya yā vihitā vṛddhiḥ, tadvaty uttarapade
    sarvaśabdo dikśabdāś ca antodāttā bhavanti  / sarvapañcālakaḥ  / pūrvapañcālakaḥ  /
    uttarapāñcālakaḥ  / susarvārdhadikśabdebhyo janapadasya+iti tadantavidhinā janapadalakṣaṇo
    vuñ pratyayaḥ  / susarvārdhājjanapadasya (*7,3.12) diśo 'madrāṇām (*7,3.13) iti
    ca+uttarapadavṛddhiḥ  / adhikāralakṣaṇād iha na bhavati, sarvamāsaḥ, sarvakārakaḥ
    iti //
