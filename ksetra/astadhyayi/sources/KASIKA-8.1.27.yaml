source_id: KASIKA-8.1.27
locator:
  sutra: 8.1.27
witness_text:
  sutra: tiṅo gotrādīni kutsana-ābhīkṣṇyayoḥ
  commentary: tiṅantāt padāt parāṇi gotrādīni kutsane ābhīkṣṇye cārthe vartamānāni
    anudāttāni bhavanti  / pacati gotram  / jalpati gotram  / ābhīkṣṇye - pacati pacati
    gotram  / jalpati jalpati gotram  / bruvaḥ - pacati bruvam  / jalpati bruvam  /
    pacati pacati bruvam  / jalpati jalpati bruvam  / bruvaḥ iti bruvaḥ kannipātanād
    vacyādeśābhāvaśca  / gotra  / bruva  / pravacana  / prahasana  / prakathana  /
    pratyayana  / pracakṣaṇa  / prāya  / vicakṣaṇa  / avacakṣaṇa  / svādhyāya  / bhūyiṣtha  /
    vā nāma  / nāma ity etad vā nihanyate  / pakṣe ādyudāttam eva bhavati  / pacati
    nāma  / paṭhati nāma  / tiṅaḥ iti kim ? kutsitaṃ gotram  / gotrādīni iti kim ?
    pacati pāpam  / kutsanābhīkṣṇyayoḥ iti kim ? khanati gotraṃ sametya kūpam  / kutsanābhīkṣṇyagrahaṇaṃ
    ca pāṭhaviśeṣaṇaṃ draṣṭavyam  / tena anyatra api gotrādigrahaṇena kutsanābhīkṣṇyayor
    eva kāryaṃ bhavati //
