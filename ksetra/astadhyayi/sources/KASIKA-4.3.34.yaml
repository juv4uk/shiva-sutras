source_id: KASIKA-4.3.34
locator:
  sutra: 4.3.34
witness_text:
  sutra: śraviṣṭhā-phalguny-anurādhā-svāti-tiṣya-punarvasu-hasta-viśākhā-aṣāḍhā-bahulāl
    luk
  commentary: śraviṣṭhā-ādibhyaḥ śabdebhyaḥ nakṣatrebhyaḥ āgatasya jātārthe lug bhavati  /
    tasmin strīpratyayasya api luk taddhitaluki (*1,2.49) iti bhavati  / śraviṣṭhāsu
    jātaḥ śraviṣṭhaḥ  / phalgunaḥ  / anurādhaḥ  / svātiḥ  / tiṣyaḥ  / punarvasuḥ  /
    hastaḥ  / viśākhaḥ  / aṣāḍhaḥ  / bahulaḥ  / lukprakaraṇe citrārevatīrohiṇībhyaḥ
    striyām upasaṅkhyānam  / citrāyāṃ jātā citrā  / revatī  / rohiṇī  / strīpartyayasya
    luki kṛte gaurāditvāt ṅīṣ  / phalgunyaṣāḍhābhyāṃ ṭānau vaktavyau  / phalgunī  /
    aṣāḍhā  / śraviṣṭhāṣāḍhābhyāṃ chaṇapi vaktavyaḥ  / śrāviṣṭhīyaḥ  / āṣāḍhīyaḥ //
    [#407]
