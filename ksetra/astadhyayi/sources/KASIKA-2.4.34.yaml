source_id: KASIKA-2.4.34
locator:
  sutra: 2.4.34
witness_text:
  sutra: dvitīyā-ṭā-ossv enaḥ
  commentary: anvādeśe 'nudāttaḥ iti vartate  / dvitīyā ṭā os ity eteṣu parata idam
    etador anvādeśa-viṣayayoḥ ena-śabda ādeśo ādeśo bhavati anudāttaḥ  / idamo maṇḍūkaplutinyāyena
    anuvṛttiḥ  / imaṃ  chātraṃ chando 'dhyāpaya, atho enaṃ vyākaraṇamadhyāpaya  /
    anena chātreṇa rātriradhītā, atho enenāharapyadhītam  / anayośchātrayoḥ śobhanaṃ
    śīlam, atho enayoḥ prabhūtaṃ svam  / etadaḥ khalv api -- etaṃ chātraṃ chanto 'dhyāpaya,
    atho enaṃ vyākaraṇamapyadhyāpaya  / etena chātrena rātriradhītā, atho enenāharapyadhītam  /
    etayoś chātrayoḥ śobhanaṃ śīlam, atho enayoḥ prabhūtaṃ svam  / enad iti napuṃsakaikavacane
    vaktavyam  / prakṣālayainat  / parivartayainat  / iha kasmān na bhavati, ayaṃ
    daṇḍo harānena, etamātaṃ ṅitaṃ vidyāt iti ? yatra kiñcid vidhāya vākyāntareṇa
    punar anyadupadiśyate so 'nvādeśaḥ  / iha tu vastu-nirdeśamātraṃ kṛtvā ekam eva
    vidhānam //
