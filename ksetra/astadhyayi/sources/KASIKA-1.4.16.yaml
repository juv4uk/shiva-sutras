witness_text:
  sutra: siti ca
  commentary: yaci bham (*1,4.18) iti vakṣyati  / tasyāyaṃ purastād apavādaḥ  / siti
    pratyaye parataḥ pūrvaṃ padasañjñaṃ bhavati  / bhavataṣ ṭhak-chasau (*4,2.115)
    - bhavadīyaḥ  / ūrṇāyā yus (*5,2.123) - ūrṇāyuḥ  / ṛtor aṇ (*5,1.105), chandasi
    ghas (*5,1.106) - ṛtviyaḥ //
