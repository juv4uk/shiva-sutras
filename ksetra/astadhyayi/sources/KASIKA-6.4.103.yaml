source_id: KASIKA-6.4.103
locator:
  sutra: 6.4.103
witness_text:
  sutra: aṅitaś ca
  commentary: aṅitaś ca herdhirādeśo bhavati  / vā chandasi iti pitvenāsya aṅittvam  /
    somaṃ rārandḥ  / asamabhyaṃ taddharyaśva prayandhi  / yuyodhyasmajjuhurāṇamenaḥ  /
    aṅitaḥ iti kim ? hvayaṃ prīṇīhi  / rārandhi iti ramervyatyayena parasmaipadam
    , śapaḥ ślu, abhyāsadīrghatvaṃ chāndasatvāt  / malopābhāvas tu aṅittvād eva  /
    prayandhi iti yameḥ śapo luk  / yuyodhi iti yauteḥ śapaḥ śluḥ //
