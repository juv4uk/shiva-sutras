witness_text:
  sutra: tip-tas-jhi-sip-thas-tha-mib-vas-mas-ta-ātāṃ-jha-thās-āthām-dhvam-iḍ-vahi-mahiṅ
  commentary: lasya tib-ādya ādeśā bhavanti  / tip-sip-mipāṃ pakāraḥ svara-arthaḥ  /
    iṭaṣṭakāraḥ iṭo 't (*3,4.106) iti viśeṣaṇa-arthaḥ, tib-ādibhir ādeśais tulyatvān
    na deśa-vidhyarthaḥ  / mahiṅo ṅakāraḥ tiṅ iti pratyāhāra-grahaṇa-arthaḥ  / pacati,
    pacataḥ, pacanti  / pacasi, pacathaḥ, pacatha  / pacāmi, pacāvaḥ, pacāmaḥ  / pacate,
    pacete, pacante  / pacase, pacethe, pacadhve  / pace, pacāvahe, pacāmahe  / evam
    anyeṣv api lakareṣu udāhāryam //
