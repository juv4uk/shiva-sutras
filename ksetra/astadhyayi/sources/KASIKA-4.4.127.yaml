source_id: KASIKA-4.4.127
locator:
  sutra: 4.4.127
witness_text:
  sutra: vayasyāsu mūrdhno matup
  commentary: vayasvānupadhāno mantro yāsāṃ tā vayasyāḥ, tāsv abhidheyāsu mūrdhno
    matup pratyayo bhavati  / pūrvasya yato 'pavādaḥ  / yasmin mantre vayaḥ-śabdo
    mūrdhan-śabdaś ca vidyate sa vayasvān api bhavati mūrdhanvān api, yathā mūrdhā
    vayaḥ prajāpatiś chandaḥ iti  / tatra vayasvacchabdād iva mūrdhavacchabdād api
    yati prāpte matup vidhāsyate  / mūrdhanvatīr bhavanti  / vayasyā eva mūrdhanvatyaḥ  /
    vayasyāsu iti kim ? yatra mūrdhan-śabda eva kevalo na vayaḥ-śabdasn tatra mā bhūt  /
    mūrdhanvataḥ iti vaktavye mūrdhnaḥ ity uktaṃ, matupo lukaṃ bhāvinaṃ citte kṛtvā
    // [#461]
