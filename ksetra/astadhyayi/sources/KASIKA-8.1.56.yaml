source_id: KASIKA-8.1.56
locator:
  sutra: 8.1.56
witness_text:
  sutra: yad-dhi-tuparaṃ chandasi
  commentary: āmantritam ity etad asvaritatvān nānuvartate  / tiṅ iti vartate eva  /
    yatparaṃ, hiparaṃ, tuparaṃ ca tiṅantaṃ chandasi nānudāttaṃ bhavati  / yatparaṃ
    tāvat - gavāṃ gotramudasṛjo yadaṅgiraḥ  / hiparam - indavo vāmuśanti hi tuparam
    - ākhyāsyāmi tu te  / nipātair yadyadihanta iti, hi ca (*8,1.34) iti, tupaśyapaśyatāhaiḥ
    iti ca nighātapratiṣedhe siddhe vacanam idaṃ niyamārtham, ebhir eva parairyoge
    pratiṣedho bhavati, nānyaiḥ iti  / iha na bhavati, jāye svo rohāvaihi  / ehi ity
    anena gatyarthaloṭā yuktasya rohāva ity asya loḍantasya highāto bhavaty eva //
