source_id: KASIKA-8.2.80
locator:
  sutra: 8.2.80
witness_text:
  sutra: adaso 'ser dād u do maḥ
  commentary: adaso 'sakārāntasya varṇasya dāt parasya uvarṇādeśo bhavati, dakārasya
    ca makāraḥ  / amum, amū, amūn  / amunā, amūbhyām  / bhāvyamānena apy ukāreṇa savarṇānāṃ
    grahaṇam iṣyate iti ekamātrikasya mātrikaḥ, dvimātrikasya dvimātrikaḥ ādeśo bhavati  /
    aseḥ iti kim ? adaḥ icchati adasyati  / adaso 'nosra iti vaktavyam  / okārarephayor
    api pratiṣedho yathā syāt iti  / ado 'tra  / adaḥ  / tadarthaṃ kecit sūtraṃ varṇayanti,
    aḥ seḥ yasya so 'yam asiḥ, yatra sakārasya akāraḥ kriyate iti, tena tyadādyatvavidhāne
    etad anyatra na bhavitavyam eva iti  / adryādeśe katham ? adaso 'dreḥ pṛthaṅ mutvaṃ
    kecid icchanti latvavat  / kecidantyasadeśasya netyeke 'serhi dṛśyate // iti  /
    yaiḥ aseḥ iti sakārasya pratiṣedhaḥ kriyate, anantyavikāre antyasadeśasya iti
    ca paribhāṣā na aśrīyate, teṣām ubhayor api mutvena bhavitavyam, amumuyaṅ, amumuyañcau,
    amumuyañcaḥ iti , yathā calīklṛpyate iti latvam  / ye tu paribhāṣām āśrayanti
    teṣām antyasadeśasya eva bhavitavyam, adamuyaṅ, adamuyañcau, adamuyañcaḥ iti  /
    yeṣaṃ tu tyadādyatvaviṣaya eva mutvena bhavitavyam iti darśanam teṣām atra na
    bhavitavyam, adadryaṅ, adadryañcau, adadryañcaḥ iti  / dāt iti kim ? alo 'ntyasya
    mā bhūt, amuyā  / amuyoḥ //
