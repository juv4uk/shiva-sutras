source_id: KASIKA-6.3.99
locator:
  sutra: 6.3.99
witness_text:
  sutra: aṣaṣthy-atṛtīyāsthasya anayasya dug āśīr-āśā-āsthā-āsthita-utsuka-ūti-kāraka-rāga-ccheṣu
  commentary: aṣaṣthīsthasya atṛtīyāsthasya ca anyaśabdasya dugāgamo bhavati āśis
    āśā āsthā āsthita utsuka ūti kāraka rāga cha ity eteṣu parataḥ  / anyā āśīḥ anyadāśīḥ  /
    anyā āśā anyadāśā  / anyā āsthā anyadāsthā  / anya āsthitaḥ anyadāsthitaḥ  / anya
    utsukaḥ anyadutsukaḥ  / anyā ūtiḥ anyadūtiḥ  / anyaḥ kārakaḥ anyatkārakaḥ  / anyaḥ
    rāgaḥ anyadrāgaḥ  / anyasmin bhavaḥ anyadīyaḥ  / gahādiṣv anyaśabdo draṣṭavyaḥ  /
    aṣaṣṭhyatṛtīyāsthasya iti kim ? anyasya āśīḥ anyāśīḥ  / anyena āsthitaḥ anyāsthitaḥ  /
    dugāgamo 'viśeṣeṇa vaktavyaḥ kārakacchayoḥ  / ṣaṣṭhītṛtīyayor neṣṭa āśīrādiṣu
    saptasu // anyasya kārakam anyatkārakam  / anyasya idam anyadīyam  / asya ca dvirnañgrahaṇaṃ
    liṅgam //
