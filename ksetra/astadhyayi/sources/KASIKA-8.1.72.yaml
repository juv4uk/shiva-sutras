source_id: KASIKA-8.1.72
locator:
  sutra: 8.1.72
witness_text:
  sutra: āmantritaṃ pūrvam avidyamānavat
  commentary: āmantritaṃ pūrvam avidyamānavad bhavati, tasmin sati yatkāryaṃ tana
    bhavati, asati yat tad bhavati  / kāni punar avidyamānavattve prayojanāni  / āmantritatiṅnighātayuṣmadasmadādeśābhāvāḥ  /
    devadatta, yajñadatta ity atra āmantritasya padāt parasya iti nighāto na bhavati  /
    ṣaṣṭikāmantritādyudāttatvaṃ bhavati  / devadatta pacasi ity atra tiṅṅantiṅaḥ (*8,1.28)
    iti nighāto na bhavati  / devadatta tava grāmaḥ svam, devadatta mama grāmaḥ svam
    ity evam ādisu yuṣmadasmadādeśā na bhavanti  / [#903] pūjāyāmanantarapratiṣedhaḥ
    prayojanam  / yāvad devadatta pacasi ity atra api pūjāyāṃ nānantaram ity eva pratiṣedho
    bhavati  / jātvapūrvam (*8,1.47) tiy etat, devadatta jātu pacasi ity atra api
    bhavati  / āho utāho cānantaram (*8,1.49) iti, āho devadatta pacasi, utāho devadatta
    pacasi ity atra api bhavati  / āma ekāntaramāmantritamanantike (*8,1.55) iti,
    ām bho pacasi devadatta ity atra api bhavati  / āmantritam iti kim ? devadattaḥ
    pacati  / pūrvam iti kim ? devadatta ity etasya āmantritādyudāttatve kartavye
    na avidyamānavad bhavati  / pūrvatvam ca parāpekṣam bhavati iti parasya+eva kārye
    svanimitte 'nyanimitte vā tadavidyamānavad bhavati, na tu svakārye  / devadatta
    pacasi ity atra api hi āmantritādyudāttatvaṃ bhavaty eva  / iha imaṃ me gaṅge
    yamune sarasvati iti gaṅgeśabdaḥ pūrvamānantritam, tataḥ parasya yamuneśabdasya
    anudāttatve kartavye svayam avidyamānavattvān nimittaṃ na bhavati  / meśabdasya
    nimittabhāvaṃ na pratibadhnāti //
