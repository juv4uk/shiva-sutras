source_id: KASIKA-3.3.152
locator:
  sutra: 3.3.152
witness_text:
  sutra: uta-apyoḥ samarthayor liṅ
  commentary: uta api ity etayoḥ samarthayoḥ dhātoḥ liṅ pratyayo bhavati  / sarvalakārāṇām
    apavādaḥ  / bāḍham ity asminn arthe samānārthatvam anayoḥ  / uta kuryāt  / api
    kuryāt  / utādhīyīta  / apyadhīyīta  / bāḍhamadhyeṣyate ity arthaḥ  / samarthayoḥ
    iti kim? uta daṇḍaḥ patiṣyati ? api dvāraṃ dhāsyati  / praśnaḥ pracchādanaṃ ca
    gamyate  / vā-ā-utāpyoḥ (*3,3.141) iti vikalpo nivṛttaḥ  / itaḥ prabhṛṭi bhūte
    'pi liṅ-nimitte kriya-atipattau nityaṃ lṛṅ  / bhaviṣyati tu sarvatra+eva nityaḥ
    //
