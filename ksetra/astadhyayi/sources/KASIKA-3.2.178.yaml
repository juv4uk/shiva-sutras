source_id: KASIKA-3.2.178
locator:
  sutra: 3.2.178
witness_text:
  sutra: anyebhyo 'pi dṛśyate
  commentary: anyebhyo 'pi dhātubhyaḥ tācchīlikeṣu kvip pratyayo dṛśyate  / yuk  /
    chit  / bhit  / dṛśi-grahaṇaṃ vidhy-antara-upasaṅgraha-artham  / kvacid dīrghaḥ,
    kvacid dvirvacanam, kvacit samprasāraṇam  / tathā ca āha -- kvibvacipracchāyatastukaṭaprujuśrīṇāṃ
    dīrgho 'saṃprasāraṇaṃ ca  / vāk  / śabdaprāṭ  / āyatastūḥ  / kaṭaprūḥ  / jūḥ  /
    śrīḥ  / jugrahanena atra na arthaḥ, bhrājādi sūtra eva gṛhītatvāt  / dyuti-gami-juhotīnāṃ
    dve ca  / didyut  / jagat  / juhoter dīrghaś ca  / juhūḥ  / [#250] dṝ bhye ity
    asya hrasvaś ca dve ca  / dadṛt  / dhyāyateḥ samprasāraṇaṃ ca  / dhīḥ //
