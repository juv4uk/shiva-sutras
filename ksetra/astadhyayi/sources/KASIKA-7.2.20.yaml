source_id: KASIKA-7.2.20
locator:
  sutra: 7.2.20
witness_text:
  sutra: dṛḍhaḥ sthūlabalayoḥ
  commentary: dṛḍha iti nipātyate sthūle balavati cārthe  / dṛḍhaḥ sthūlaḥ  / dṛḍho
    balavān  / kim atra nipātyate ? dṛṃheḥ ktapratyaye iḍabhāvaḥ, hakāranakārayoḥ
    lopaḥ, parasya ḍhatvam  / atha dṛhiḥ prakṛtyanataram asti ? tatra apy etad eva
    sarvaṃ nalopavarjam, nakārasya abhāvāt  / halopanipātanaṃ pūrvatra asiddhatvanivṛttyartham  /
    ḍhalope hi sati tasya pūrvatra asiddhatvāt draḍhimā, draḍhīyān, draḍhayati ity
    atra ra ṛto halāderlaghoḥ (*6,2.161) iti repho na syāt, iha ca paridraḍhyya gata
    iti lyapi laghupūrvāt (*6,4.56) iti ṇerayādeśo na syāt, iha ca paridṛḍhasyāpatyaṃ
    pāridṛḍhī kanyā iti gurūpottamalakṣaṇaḥ ṣyaṅ ca prasajyeta  / sthūlabalayoḥ iti
    kim ? dṛṃhitam  / dṛhitam //
