locator:
  sutra: 5.4.119
witness_text:
  sutra: upasargāc ca
  commentary: upasargāt paro yo nāsikāśabdaḥ tadantāt bahuvrīheḥ ac pratyayo bhavati,
    nāsikāśabdaś ca na samāpadyate  / asañjñārthaṃ vacanam  / unnatā nāsikā asya unnasaḥ  /
    pranasaḥ  / upasargād bahulam (*8,4.28) iti ṇatvam  / vergro vaktavyaḥ  / vigatā
    nāsikā asya vigraḥ // [#586]
