source_id: KASIKA-7.1.74
locator:
  sutra: 7.1.74
witness_text:
  sutra: tṛtīyādiṣu bhāṣitapuṃskaṃ puṃvad gālavasya
  commentary: tṛtīyādiṣu vibhaktiṣv ajādiṣu bhāṣitapuṃskam igantaṃ napuṃsakaṃ gālavasyācāryasya
    matena puṃvad bhavati  / yathā puṃsi hrasvanumau na bhavataḥ, tadvad atra api
    na bhavataḥ ity arthaḥ  / grāmaṇīḥ brāhmaṇaḥ  / grāmaṇi brāhmaṇakulam  / grāmaṇyā  /
    brāhmaṇakulena, grāmaṇinā brāhmaṇakulena  / grāmaṇye brāhmaṇakulāya, grāmaṇine
    brāhmaṇakulāya  / grāmaṇyo brāhmaṇakulāt, grāmaṇino brāhmaṇakulāt  / grāmaṇyo
    brāhmaṇakulasya, grāmaṇino brāhmaṇakulasya  / grāmaṇyor brāhmaṇakulayoḥ, grāmaṇinor
    brāhmaṇakulayoḥ  / grāmaṇyāṃ brāhmaṇakulānām, numacira iti pūrvavipratiṣedhena
    nuṭ, grāmaṇīnāṃ brāhmaṇakulānām  / grāmaṇyāṃ brāhmaṇakule, grāmaṇini brāhmaṇakule  /
    śucirbrāhmaṇaḥ  / śuci brāhmaṇakulam  / śucaye brāhmaṇakulāya, śucine brāhmaṇakulāya  /
    śucer brāhmaṇakulāt, śucino brāhmaṇakulāt  / śucer brāhmaṇakulasya, śucino brāhmaṇakulasya  /
    śucyor brāhmaṇakulayoḥ, śucinor brāhmaṇakulayoḥ  / śucau brāhmaṇakule, śucini
    brāhmaṇakule  / tṛtīyādiṣu iti kim ? grāmaṇinī brāhmaṇakule  / śucinī brāhmaṇakule  /
    bhāṣitapuṃskam iti kim ? trapuṇe  / jatune  / iha kasmān na bhavati, pīlurvṛkṣaḥ,
    pīlu phalam, pīlune phalāya iti ? samānāyāmākṛtau yad bhāṣītpuṃskaṃ tulye pravṛttinimatte
    tasya puṃvadbhāvaḥ  / iha tu vṛkṣākṛtiḥ pravṛttinimittaṃ puṃsi śabdasya, phalākṛtirnapuṃsake  /
    tad etad evaṃ kathaṃ bhavati bhāsitapuṃskam iti ? bhāṣitaḥ pumān yasminn arthe
    pravṛttinimitte sa bhāsitapuṃskaśabdena ucyate, uadyogād abhidheyam api yad napuṃsakaṃ
    tad api bhāṣitapuṃsakam  / tasya pratipādakaṃ yac chabdarūpaṃ tad api bhāṣitapuṃskam
    iti ? ikaḥ ity eva, kīlālapā brāhmaṇaḥ  / kīlālapaṃ bāhmaṇakulam  / kīlālapena
    brāhmaṇakulena  / aci ity eva, grāmaṇibhyāṃ brāhmaṇakulābhyām // [#791]
