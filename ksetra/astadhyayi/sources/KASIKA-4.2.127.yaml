source_id: KASIKA-4.2.127
locator:
  sutra: 4.2.127
witness_text:
  sutra: dhūmādibhyaś ca
  commentary: dhūmādibhyo deśavacibhyaḥ prātipadikebhyaḥ vuñ pratyayo bhavati śaiṣikaḥ  /
    aṇāder apavādaḥ  / dhaumakaḥ  / khāṇḍakaḥ  / pātheya-śabdaḥ paṭhyate, tasya yopadhātvād
    eva vuñi siddhe sāmarthyād adeśārthaṃ grahaṇam  / tathā videha-anartaśabdayoḥ
    janapada-lakṣaṇe vuñi siddhe 'deśārthaḥ pāṭhaḥ  / videhānāṃ kṣatriyāṇāṃ svaṃ vaidehakam  /
    ānartakam  / samudra-śabdaḥ paṭhyate, tasya nāvi manuṣye ca vuñ iṣyate  / sāmudrikā
    nauḥ  / sāmudrako manusyaḥ  / anyatra na bhavati, sāmudraṃ jalam iti  / dhūma  /
    khaṇḍa  / śaśādana  / ārjunāda  / dāṇḍāyanasthalī  / māhakasthalī  / ghoṣasthalī  /
    māṣasthalī  / rājasthalī  / rājagṛha  / satrāsāha  / bhakṣāsthalī  / madrakūla  /
    gartakūla  / āñjīkūla  / dvyāhāva  / tryāhāva  / saṃhīya  / varvara  / varcagarta  /
    videha  / ānarta  / māṭhara  / pātheya  / ghoṣa  / śiṣya  / mitra  / vala  / ārājñī  /
    dhartarājñī  / avayāta  / tīrtha  / kūlāt sauvīreṣu  / samudrānnāvi manusye ca  /
    kukṣi  / antarīpa  / dvīpa  / aruṇa  / ujjayinī  / dakṣiṇāpatha  / sāketa // [#396]
