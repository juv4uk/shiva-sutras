source_id: KASIKA-7.2.49
locator:
  sutra: 7.2.49
witness_text:
  sutra: sani ivanta-rdha-bhrasja-dambhu-śri-svṛ-yu-ūrṇu-bhara-jñapi-sanām
  commentary: ivantānāṃ dhātūnām, ṛdhu bhrasja dambhu śri svṛ yu ūrṇu bhara jñapi
    san ity eteṣāṃ ca sani vā iḍāgamo bhavati  / ivantānām - dideviṣati, dudyūṣati  /
    siseviṣati, susyūṣati  / ṛdhu - ardidhiṣati, īrtsati  / bhrasja - bibhrajjiṣati,
    bibhrakṣati, bibharjjiṣati, bibharkṣati  / dambhu - didambhiṣati, dhipsati, dhīpsati  /
    śri - ucchiśrayiṣati, ucchiśrīṣati  / svṛ - sisvariṣati, susvūrṣati  / yu- yiyaviṣati,
    yuyūṣati  / ūrṇu - prorṇunaviṣati, prorṇunaviṣati, prorṇunūṣati  / bhara iti bhṛñ
    ity etasya bhauvādikasya grahaṇam, śapā nirdeśāt  / vibhariṣati, bubhūrṣati  /
    jñapi - jijñapayiṣati, jñīpsaṭi  / san - sisaniṣati, siṣāsati  / kecid atra bharajñapisanitanipatidaridrāṇām
    iti paṭhanti  / tani - titaniṣati, titaṃsati, titāṃsati  / pati - pipatiṣati,
    pitsati  / daridrā - didaridriṣati, didaridrāsati  / sani iti kim ? devitā  /
    bhraṣṭā //
