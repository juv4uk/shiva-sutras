source_id: KASIKA-1.1.34
locator:
  sutra: 1.1.34
witness_text:
  sutra: pūrva-para-avaradakṣiṇa-uttara-apara-adharāṇi vyavasthāyām asañjñāyām
  commentary: pūrva para avara dakṣiṇa uttara apara adhara ity-eṣāṃ gaṇe pāṭhāt pūrveṇa
    nityāyāṃ sarvanāma-sañjñāyāṃ prāptāyāṃ jasi vibhāṣā ārabhyate  / pūrvādīni vibhaṣā
    jasi sarvanāma-sañjñāni bhavanti vyavasthāyām asañjñāyām  / svābhidheya-apekṣāvadhiniyamo
    vyavasthā  / pūrve, pūrvāḥ  / pare, parāḥ  / avare, avarāḥ  / dakṣṇe, dakṣṇāḥ  /
    uttare, uttarāḥ  / apare, aparāḥ  / adhare, adharaḥ  / vyavasthāyām iti kiṃ ?
    dakṣiṇā ime gāthakāḥ  / pravīṇāḥ ityarthaḥ  / asañjñāyām iti kim ? uttarāḥ kuravaḥ  /
    satyām eva vyavasthāyām iyaṃ teṣāṃ sañjñā //
