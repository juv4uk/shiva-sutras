source_id: KASIKA-6.4.133
locator:
  sutra: 6.4.133
witness_text:
  sutra: śva-yuva-maghonām ataddhite
  commentary: śvan yuvan maghavan ity eteṣām aṅgānām ataddhite pratyaye parataḥ samprasāraṇaṃ
    bhavati  / śunaḥ  / śunā  / śune  / yūnaḥ  / yūnā  / yūne  / maghonaḥ  / maghonā  /
    maghone  / ataddhite iti kim ? śauvaṃ māṃsam  / yauvanaṃ vartate  / māghavanaḥ
    sthālīpākaḥ  / śuno vikāre prāṇirajatādibhyo 'ñ (*4,3.154), dvārāditvādaijāgamaḥ  /
    śvādīnām etat samprasāraṇaṃ nakārāntānām iṣyate  / iha na bhavati, yuvatīḥ paśya  /
    maghavataḥ  / maghavatā  / maghavate  / tadartham uttaratra yogavibhāgam kurvanti  /
    allopaḥ  / anaḥ  / anaḥ ity ubhayoḥ śeṣaḥ iti //
