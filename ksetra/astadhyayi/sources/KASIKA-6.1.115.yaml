source_id: KASIKA-6.1.115
locator:
  sutra: 6.1.115
witness_text:
  sutra: prakṛtyā 'ntaḥpādam avyapare
  commentary: eṅo 'ti (*6,1.109) ity eva  / eṅaḥ iti yat pañcamyantam anuvartate,
    tadarthād iha prathamāntaṃ bhavati  / prakṛtiḥ iti svabhāvaḥ kāraṇam vā 'bhidhīyate  /
    antar iti avyayam adhikaranabhūtaṃ madhyam ācaṣṭe  / pādaśabdena ca ṛkpādasya+eva
    grahaṇam iṣyate, na tu ślokapadasya  / avakārayakārapare ati parataḥ eṅ prakṛtyā
    bhavati  / svabhāvena avatiṣṭhate kāraṇātmanā vā bhavati, na vikāram āpadyate  /
    tau cen nimittakāryiṇau antaḥpādamṛkpādamadhye bhavataḥ  / te agre aśvamāyuñjan  /
    te asmiñjavamādadhuḥ  / upaprayanto adhvaram  / śiro apaśyam sujāte aśvasūnṛte  /
    adhvartyo adribhiḥ sutam  / antaḥpādam iti kim  / kayā matī kuta etāsa ete 'rcanti  /
    avyapare iti kim  / te 'vadan  / tejo 'yasmayam  / eṅ iti kim ? anvagniruṣasāmagramakhyat  /
    kecid idaṃ sūtraṃ na antaḥpādam avyapare iti paṭhanti, te saṃhitāyām iha yad ucyate
    tasya sarvasya pratiṣedhaṃ varṇayanti // [#627]
