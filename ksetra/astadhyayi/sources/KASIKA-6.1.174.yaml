source_id: KASIKA-6.1.174
locator:
  sutra: 6.1.174
witness_text:
  sutra: udāttayaṇo halpūrvāt
  commentary: udāttasthāne yo yaṇ halapūrvas tasmāt parā nadī ajādir yā asarvanāmavidbhaktir
    udāttā bhavati  / kartrī  / hartrī  / pralavitrī  / prasavitrī  / kartrā  / hartrā  /
    pralavitrā  / prasavitrā  / tṛjantā ete 'ntodāttāḥ  / udāttagrahaṇaṃ kim ? kartrī  /
    hartrī  / kartrā  / hartrā  / tṛnnanto 'yam ādyudāttaḥ  / halpūrvāt iti kim ?
    bahutitavā brāhmaṇyā  / nakāragrahaṇaṃ kartavyam  / vākpatnī iyaṃ kanyā //
