source_id: KASIKA-5.2.47
locator:
  sutra: 5.2.47
witness_text:
  sutra: saṅkhyāyā guṇasya nimāne mayaṭ
  commentary: tad asya ity anuvartate tad asya sañjātam ity ataḥ  / tad iti prathamāsamarthāt
    saṅkhyāvācinaḥ prātipadikāt asya iti ṣaṣṭhyarthe mayaṭ pratyayo bhavati yat tat
    prathamāsamarthaṃ guṇasya cen nimāne vartate  / guṇo bhāgaḥ nimānaṃ mūlyam  /
    guṇo yena nimīyate mūlyabhūtena so 'pi sāmarthyād bhāga eva vijñāyate  / yavānāṃ
    dvau bhāgau nimānam asya udaśvidbhāgasya dvimayamudaśvid yavānām  / trimayam  /
    caturmayam  / bhāge 'pi tu vidhīyāmānaḥ pratyayaḥ prādhānyena bhāgavantamācaṣṭe  /
    tena sāmānyādhikaraṇyaṃ bhavati dvimayamudaśvit iti  / guṇasya iti caikatvaṃ vivakṣitaṃ,
    tena+iha na bhavati, dvau bhāgau yavānāṃ traya udaśvitaḥ iti  / [#510] bhūyasaś
    ca vācikāyāḥ saṅkhyāyāḥ pratyaya iṣyate  / iha na bhavati, eko bhāgo nimānamasya
    iti  / bhūyasaḥ iti ca pratyayārthāt prakṛtyarthasya adhikyamātraṃ vivakṣitam  /
    bahutvamatantraṃ, tena dviśabdād api bhavati  / guṇaśabdaḥ samānāvayvavacanaḥ  /
    tena+iha na bhavati, dvau bhāgau yavānām adhyardha udaśvitaḥ iti  / nimeye cāpi
    dṛśyate  / nimeye vartamānāyāḥ saṅkhyāyā nimāne pratyayo dṛśyate  / udaśvito dvau
    bhāgau nimeyamasya yavabhāgasya dvimayā yavā udaśvitaḥ  / trimayā yavā udaśvitaḥ  /
    caturmayāḥ  / guṇasya iti kim ? dvau vrīhiyavau nimānamasya+udaśvitaḥ  / nimāne
    iti kim ? dvau guṇau kṣīrasya ekastailasya, dviguṇaṃ pacyate tailaṃ kṣīreṇa ity
    atra mā bhūt //
