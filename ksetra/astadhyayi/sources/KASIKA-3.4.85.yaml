witness_text:
  sutra: loṭo laṅvat
  commentary: atideśo 'yam  / loṭo laṅvat kāryaṃ bhavati  / tām-ādayaḥ, salopaś ca  /
    pacatām  / pacatam  / pacata  / pacāva  / pacāma  / aḍāṭau kasmān na bhavataḥ,
    tathā jher jus-ādeśaḥ laṅaḥ śākaṭāyanasya+eva (*3,4.111) iti vāntu, yāntu ? vido
    laṭo vā (*3,4.83) ity ato vā-grahaṇam anuvartate, sā ca vyavasthita-vibhāṣā bhaviṣyati
    //
