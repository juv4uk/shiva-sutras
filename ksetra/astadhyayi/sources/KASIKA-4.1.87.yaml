source_id: KASIKA-4.1.87
locator:
  sutra: 4.1.87
witness_text:
  sutra: strī-puṃsābhyāṃ nañ-snañau bhavanāt
  commentary: dhānyānāṃ bhavane kṣetre khañ (*5,2.1) iti vakṣyati  / tasya prāg ity
    anena+eva sambandhaḥ  / prāgbhavanasaṃśabdanād ye 'rthās teṣu strī-śabdāt puṃs-śabdāc
    ca yathākramaṃ nañsnañau pratyayu bhavataḥ  / strīṣu bhavaṃ straiṇam  / pauṃsnam  /
    striṇāṃ samūhaḥ straiṇam  / pauṃsnam  / strībhya āgataṃ straiṇam  / apuṃsnam  /
    strībhyo hitaṃ straiṇam  / pauṃsnam  / striyāḥ puṃvat iti jñāpakād vatyarthe na
    bhavati  / yoga-apekṣaṃ ca jñāpakam iti strīvad ity api siddham //
