source_id: KASIKA-1.1.19
locator:
  sutra: 1.1.19
witness_text:
  sutra: īd-ūtau ca saptamy-arthe
  commentary: śāklyasya-itāv-anārśe iti nivṛttam  / īdantam ūdantaṃ ca śabda-rūpaṃ
    saptamy-arthe vartamānaṃ pragṛhya-sañjñaṃ bhavati  / adhyasyāṃ māmakī tanū  /
    māmakyāṃ tanvām iti prāpte, māṃkyām māmakī iti, tanvām tanū iti  / somo gaurī
    adhi śritaḥ  / īdūtau iti kim ? priyaḥ sūrye priyo agnā bhavāti  / agni-śabdāt
    parasyāḥ saptamyāḥ ḍādeśaḥ  / saptamī-grahaṇaṃ kim ? dhītī, matī, suṣṭutī - dhītyā,
    matyā, suṣṭutyā iti prāpte  / artha-grahaṇaṃ kim ? vā-apy aśvaḥ  / nadyātiḥ  /
    taparakaraṇam asandeha-arthaṃ  / [#12] īd-ūtau saptamī-ity eva lupte 'rtha-grahaṇād
    bhavet  / pūrvasya cet savarṇo 'sāvāḍāmbhāvaḥ prasajyate  //1// vacanādy-atra
    dīrghatvaṃ tatra api sarasī yadi  / jñāpakaṃ syāt tad-antatve mā vā pūrvapadasya
    bhūt  //2 //
