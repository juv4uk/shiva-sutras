source_id: KASIKA-6.2.47
locator:
  sutra: 6.2.47
witness_text:
  sutra: ahīne dvitīyā
  commentary: ahīnavācini samāse ktānte uttarapade dvitīyāntaṃ pūrvapadaṃ prakṛtisvaraṃ
    bhavati  / kaṣṭaśritaḥ  / triśakalapatitaḥ  / grāmagataḥ  / kaṣṭaśabdo 'ntodāttaḥ  /
    trīṇi śakalāni asya triśakalaḥ, bahuvrīhisvareṇa ādyudāttaḥ  / grāmaśabdo nitsvareṇa
    ādyudāttaḥ  / ahīne iti kim ? kāntārātītaḥ  / yojanātītaḥ  / dvitīyā 'nupasarge
    iti vaktavyam  / iha mā bhūt, sukhaprāptaḥ  / duḥkhaprāptaḥ  / sukhāpannaḥ  /
    duḥkhāpannaḥ  / antaḥ thāthety asya apavādo 'yam // [#667]
