source_id: KASIKA-1.3.67
locator:
  sutra: 1.3.67
witness_text:
  sutra: ṇe raṇau yat karma ṇau cet sa kartā 'nādhyāne
  commentary: ṇicś ca (*1,3.74) iti kartr-abhiprāye kriyā-phale siddham eva ātmanepadam  /
    akartr-abhiprāyārtho 'yama-arambhaḥ  / ṇy-antā dātmanepdaṃ bhavati  / katham ?
    aṇau yat karma ṇau cet tad eva karma, sa eva kartā bhavati, anādhyāne ādhyānaṃ
    varjayitvā  / ārohanti hastinaṃ hastipakāḥ, arohayate hastī svayam eva  / upasiñcanti
    hastinaṃ hastipakāḥ, upasecayate hastī svayam eva  / paśyanti bhṛtyā rājānam,
    darśayate rājā svayam eva  / ṇeḥ iti kim ? ārohanti hastinaṃ hastipakāḥ, ārohayamāṇo
    hastī sādhvārohati  / aṇau iti kim ? ganayati ganaṃ gopālakaḥ, ganayati gaṇaḥ
    svayam eva  / karma-grahaṇaṃ kim ? lunāti dātrena, lāvyati dātram svayam eva  /
    ṇau ced-grahanaṃ samāna-kriya-artham -- ārohanti hastinaṃ hastipakāḥ, ārohayamāṇo
    hastī bhītān secayati maūtreṇa  / yatsa-grahaṇam ananyakarma-artham  / ārohanti
    hastinaṃ hastipakāḥ, ārohayamāṇo hastī sthalamārohayati manuṣyān  / kartā iti
    kim ? ārohanti hastinam hastipakāḥ, tānarohayati mahāmātraḥ  / anādhyāne iti kim
    ? smarati vaṅgulmasya kokilaḥ, samarayatyenaṃ vaṅgulmaḥ svayam eva  / nanu cātra
    karmakartari mūlodāharaṇāni  / tatra karma-vadbhāvena+eva siddham ātmanepadam  /
    kim artham idam ucyate ? karmasthabhāvakānāṃ karmasthakriyāṇāṃ ca karmavadatideśo
    vijñāyate  / kartṛstha-artho 'yam-ārambhaḥ  / tathā ca ruhiḥ kartṛstha-kriyaḥ,
    dṛśiḥ kartṛsthabhāvakaḥ udāhṛtaḥ // [#68]
