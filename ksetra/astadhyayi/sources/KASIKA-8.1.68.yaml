locator:
  sutra: 8.1.68
witness_text:
  sutra: sagatir api tiṅ
  commentary: sagatir agatir api pūjanebhyaḥ kāṣṭhādibhyaḥ paraṃ pūjitaṃ tiṅantam
    anudāttam bhavati  / yatkāṣṭhaṃ pacati  / yatkāṣṭhaṃ prapacati  / yaddāruṇaṃ pacati  /
    yad dāruṇaṃ prapacati  / tiṅṅatiṅaḥ (*8,1.28) iti nighātasya, nipātair yadyadihanta
    iti pratiṣedhe prāpte punar vidhānam  / sagatigrahaṇāc ca gatir api nihanyate  /
    gatigrahaṇe ca atra upasargagrahaṇam iṣyate  / iha na bhavati, yat kāṣṭhaṃ śuklīkaroti  /
    yat kāṣṭhaṃ kṛṣṇīkaroti //
