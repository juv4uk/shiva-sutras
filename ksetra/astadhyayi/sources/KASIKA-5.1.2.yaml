source_id: KASIKA-5.1.2
locator:
  sutra: 5.1.2
witness_text:
  sutra: u-gavādibhyo yat
  commentary: prāk krītāt ity eva  / u-varṇāntāt prātipadikāt gava-ādibhyaś ca yat
    pratyayo bhavati prāk-krītiyeṣv artheṣu  / chasya apavādaḥ  / śaṅkavyaṃ dāru  /
    picavyaḥ kārpāsaḥ  / kamaṇḍalavyā mṛttikā  / gavādibhyaḥ khalv api - gavyam  /
    haviṣyam  / sanaṅgurnāma carmavikāraḥ  / tataḥ paratvāt carmaṇo 'ñ (*5,1.15) ity
    eṣa vidhiḥ prāpnoti  / tathā carurnāma haviḥ, sakturannavikāraḥ  / apūpādiṣu annavikārebhyaś
    ca iti paṭhyate  / tato vibhāṣā havir-apūpa-ādibhyaś ca (*5,1.3) ity eṣa vidhiḥ
    prāpnoti  / tatra sarvatra pūrvavipratiṣedhena yat-pratyay eva+iṣyate, sanaṅgavyaṃ
    carma, caravyāstaṇḍulāḥ, saktavyā dhānāḥ iti  / gavādiṣu nābhi nabha ca iti paṭhyate  /
    tasya ayam arthaḥ  / nābhi-śabdo yat-pratyayam utpādayati nabhaṃ cādeśam āpadyate
    iti  / nābhaye hitaḥ nabhyo 'kṣaḥ  / nabhyamañjanam  / yas tu śarīra-avayavād
    yat (*5,1.6) iti yati kṛte, nābhaye hitaṃ nābhyaṃ tailam iti bhavitavyam  / gava-ādiṣu
    yatā sanniyukto nabhabhāvo 'tra na bhavati  / go  / havis  / varhiṣ  / khaṭa  /
    aṣṭakā  / yuga  / medhā  / srak  / nābhi nabhaṃ ca  / śunaḥ samprasāraṇaṃ vā ca
    dīrghatvaṃ tatsaniyogena cāntodāttatvam  / śunyaṃ, śūnyam  / cakārasya anukta-samuccaya-arthatvāt
    nas taddhite iti lopo na syāt  / ūdhaso 'naṅ ca  / ūdhanyaḥ kūpaḥ  / khara  /
    skhada  / akṣara  / viṣa  / gavādiḥ // [#466]
