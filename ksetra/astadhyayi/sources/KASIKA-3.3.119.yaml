source_id: KASIKA-3.3.119
locator:
  sutra: 3.3.119
witness_text:
  sutra: gocara-sañcara-vaha-vraja-vyaja-āpaṇa-nigamāś ca
  commentary: gocarādayaḥ śabdāḥ gha-prayayāntā nipātyante pūrvasminn eva arthe  /
    halaś ca (*3,3.121)  / iti ghañaṃ vakṣyati, tasya ayam apavādaḥ  / gāvaś caranti
    asmin iti gocaraḥ  / sañcarante anena iti sañcaraḥ  / vahanti tena vahaḥ  / vrajanti
    tena vrajaḥ  / vyajanti tena vyajaḥ  / nipātanāt ajer vyaghañapoḥ (*2,4.56) iti
    vībhāvo na bhavati  / etya tasminn āpaṇante ity āpaṇaḥ  / nigacchanti tasmin iti
    nigamaḥ  / cakāro 'nukt-asamuccaya-arthaḥ  / kaṣaḥ  / nikaṣaḥ //
