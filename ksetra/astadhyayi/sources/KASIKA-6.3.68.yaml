source_id: KASIKA-6.3.68
locator:
  sutra: 6.3.68
witness_text:
  sutra: ica ekāco 'mpratyayavac ca
  commentary: ijantasya ekācaḥ khidante uttarapade amāgamo bhavati, ampratyayavac
    ca dvitīyaikavacanavac ca sa bhavati  / am iti hi dvir āvartate  / gāmmanyaḥ  /
    strīmmanyaḥ, striyammanyaḥ  / śriyammanyaḥ  / bhruvammanyaḥ  / ampratyayavac ca
    ity atideśāt ātvapūrvasavarṇaguṇeyaṅuvaṅādeśā bhavanti  / icaḥ iti kim ? tvaṅamanyaḥ  /
    ekācaḥ iti kim ? lekhābhrummanyāḥ  / atheha kathaṃ bhavitavyam, śriyam ātmānaṃ
    brāhmaṇakulaṃ manyate ity upakramya śrimanyam iti bhavitavyam iti bhāṣye vyavasthitam
    ? tatra+idaṃ bhāṣyakārasya darśanam, atra viṣaye parityaktasvaliṅgaḥ śrīśabdo
    brāhmaṇakule vartate, yathā praṣṭhādayaḥ striyām  / tatra svamor napuṃsakāt (*7,1.23)
    ity amo lug bhavati //
