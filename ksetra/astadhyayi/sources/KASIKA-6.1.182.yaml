source_id: KASIKA-6.1.182
locator:
  sutra: 6.1.182
witness_text:
  sutra: na go-śvan-sāvavarṇa-rāḍ-aṅ-kruṅ-kṛdbhyaḥ
  commentary: go śvan, sāvavarṇaḥ sau prathamaikavacane yadavarṇāntam, rāḍ aṅ kruṅ
    kṛd ity etebhyo yad uktaṃ tan na bhavati  / gavā, gave, gobhyām iti  / sāv ekācas
    tṛtīyādir vibhaktiḥ (*6,1.168) iti prāptiḥ pratiṣidhyate  / sugunā, sugave, sugubhyām  /
    antodāttād uttarapadāt iti prāptiḥ  / śvan - śunā, śune, śvabhyām  / paramaśunā,
    paramaśune, paramaśvabhyām  / pūrvavat prāptiḥ  / sāvavarṇaḥ - sau prathamaikavacane
    yad avarṇāntaṃ tasya grahaṇam  / yebhyaḥ  / tebhyaḥ  / kebhyaḥ  / rāṭ - rājatiḥ
    kvibantaḥ  / rājā  / paramarājaḥ  / aṅ - añcatiḥ kvibantaḥ, tasya sanakārasya
    grahaṇaṃ viṣayāvadhāraṇārtham, yatra asya nalopo na asti tatra pratiṣedho yathā
    syāt  / nāñceḥ pūjāyām (*6,4.60)  / iti pratiṣidhyate nalopaḥ  / prāñcā  / prāṅbhyām  /
    nalopaviṣaye tu bhavaty eva vibhakter udāttatvam  / prācā  / prāce  / prāgbhyām  /
    kruṅ kvinnanta eva -kruñcā  / paramakruñcā  / kṛt - karoti kṛtir vā kvibantaḥ  /
    kṛtā  / paramakṛtā //
