source_id: KASIKA-3.2.59
locator:
  sutra: 3.2.59
witness_text:
  sutra: ṛtvig-dadhṛk-srag-dig-uṣṇig-añcu-yuji-kruñcāṃ ca
  commentary: ṛtvigādayaḥ pañca-śabdāḥ kvin-pratyayāntāḥ nipātyante, apare trayo dhātvo
    nirdiṣyante  / ṛtu-śabda upapade yajer dhatoḥ kvin pratyayo nipātyate  / ṛtau
    yajati, ṛtuṃ vā yajati, ṛtuprayukto vā yajati ṛtvik  / rūḍhireṣā yathā kathaṃcid
    anugantavyā  / dhṛṣeḥ kvin pratyayaḥ, dvirvacanam, antodāttatvaṃ ca nipātyate  /
    dhṛṣṇoti iti dadhṛk  / sṛjeḥ karmaṇi kvin, amāgamaḥ ca nipātyate  / sṛjanti tam
    iti srak  / diṣeḥ karmaṇi kvin nipātyate  / diśanti tām iti dik  / utpūrvāt sniheḥ
    kvin, upasargānta-lopaḥ, ṣatvaṃ ca nipātyate  / uṣṇik  / añcu yuji kruñca ity
    eteṣāṃ dhātūnāṃ kvin pratyayo bhavati  / nipātanaiḥ saha nirdeśāt atra api kiṃcid
    alākṣaṇikaṃ kāryam asti  / añcateḥ subnata-mātra upapade kvin pratyayo bhavati  /
    prāṅ  / pratyaṅ  / udaṅ  / yujeḥ kruñceś ca kevalād eva  / yuṅ, yuñjau, yuñjaḥ  /
    sopapadāt tu satsūdviṣa (*3,2.61) ity ādinā kvip bhavati  / aśvayuk, aśvayujau,
    aśvayujaḥ  / kruṅ, kruñcau, kruñcaḥ  / nalopaḥ kasmān na bhavati ? nipātana-sāhacaryāt
    //
