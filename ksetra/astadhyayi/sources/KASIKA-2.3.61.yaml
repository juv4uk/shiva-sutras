locator:
  sutra: 2.3.61
witness_text:
  sutra: preṣya-bruvor haviṣo devatā-sampradāne
  commentary: preṣya iti iṣyater daivādikasya loṇ-madhyamapuruṣasya+ekavacanam, tatsāhacaryād
    bruvir api tadviṣaya eva gṛhyate  / preṣyabruvorhaviṣaḥ karmaṇaḥ ṣaṣthī vibhaktir
    bhavati devatāsampradāne sati  / agnaye chāgasya haviṣo vapāyā medasaḥ pre3ṣya  /
    agnaye chāgasya haviṣo vapāyai medaso 'nubrūhi3  / preṣyabruvoḥ iti kim ? agnaye
    chāgaṃ havirvapāṃ medo juhudhi  / haviṣaḥ iti kim ? agnaye gomayāni preṣya  /
    devatāsampradāne iti kim ? māṇavakāya puroḍāśaṃ preṣya  / haviṣaḥ prasthitasya
    pratiṣedho vaktavyaḥ  / indrāgnibhyāṃ chāgaṃ havirvapāṃ medaḥ prasthitaṃ preṣya3
    // [#148]
