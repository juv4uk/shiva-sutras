source_id: KASIKA-1.3.29
locator:
  sutra: 1.3.29
witness_text:
  sutra: samo gamy-ṛcchi-pracchi-svaraty arti-śru-vidighyaḥ
  commentary: akarmakāt iti vartate  / śeṣāt kartari parasmaipadam (*1,3.78) iti prāpte
    sampūrvebhyo gami ṛcchi pracchi svarati arti śru vidi ity etebhyo 'karmakebhyo
    dhātubhya ātmanepadaṃ bhavati  / saṅgacchate  / amṛddhate  / saṃpṛcchate  / saṃsvarati  /
    saṅkalpā asya samaranta  / [#59] arter luṅi cleḥ sar-ti-śāsty-artibhyaśca (*3,1.56)  /
    ity aṅ-ādeśaḥ  / tatra prasmaipadeśu ity etan nāśrīyate  / bahulaṃ chandasy amāṅyoge
    'pi (*6,4.75) ity āṭ pratiṣadhyate  / ṛdṛśo 'ṅi guṇaḥ (*7,4.16) iti guṇaḥ -- samaranata  /
    saṃśṛṇute  / saṃvitte  / ṛccheran ādeśasya grahaṇam, samṛcchiṣyate  / arty-ādeśasya
    tv arti ity eva siddham ātmanepadam  / artirubhayatra paṭhyate, ṛ gati-prāpaṇayoḥ
    iti bhvādau, ṛ sṛ gatau iti juhoty-ādau  / viśeṣābhāvād dvayor api grahaṇam  /
    viderjñāna-arthasya grahanam, parasmaipadibhir gamādibhiḥ sāhacaryāt, na lābha-arthasya
    svaritettvādubhyatobhāṣasya  / dṛśeśca+iti vaktavyam  / saṃpaśyate  / akarmakāt
    ity eva  / grāmaṃ saṃpasyati //
