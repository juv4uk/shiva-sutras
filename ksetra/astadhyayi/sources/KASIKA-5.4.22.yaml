locator:
  sutra: 5.4.22
witness_text:
  sutra: samūhavac ca bahuṣu
  commentary: tatprakṛtavacane ity eva  / bahusu prakṛteṣu ucyamānesu samūhavat pratyayā
    bhavanti  / cakārāt mayaṭ ca  / modakāḥ prakṛtāḥ prācuryeṇa prastutāḥ maudakikam,
    modakamayam  / śāṣkulikam, śaṣkulīmayam  / ativartante 'pi svārthikāḥ prakṛtito
    liṅgavacanāni  / [#563] dvitīye sūtrārthe - modakāḥ prakṛtāḥ asmin yajñe maudakiko
    yajñaḥ, modakamayaḥ  / śāṣkulikaḥ, śaṣkulīmayaḥ //
