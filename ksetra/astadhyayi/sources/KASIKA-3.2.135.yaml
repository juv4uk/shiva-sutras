locator:
  sutra: 3.2.135
witness_text:
  sutra: tṛn
  commentary: sarvadhātubhyaḥ tṛn-pratyayo bhavati tacchīlādiṣu kartṛṣu  / nakāraḥ
    svara-arthaḥ  / tacchīle tāvat - kartā kaṭān  / vaditā janāpavādān  / taddharmaṇi
    - muṇḍayitāraḥ śrāviṣṭhāyanāḥ bhavanti vadhūmūḍhām  / annamapahartāraḥ āhvarakāḥ
    bhavanti śrāddhe siddhe  / unnetāraḥ taulvalāyanāḥ bhavanti putre jāte  / tatsādhukāriṇi
    - kartākaṭam  / gantā kheṭam  / tṛnvidhāv ṛtvikṣu ca anupasargasya  / hotā  /
    potā  / anupasargasya iti kim ? udgātā  / pratihartā  / tṛj eva bhavati  / svare
    viśeṣaḥ  / nayateḥ ṣuk ca  / neṣṭā  / [#241] tviṣer devatāyām akāraś ca+upadhāyā
    aniṭtvaṃ ca  / tvaṣṭā  / kṣadeś ca niyukte  / kṣattā  / kvacid adhikṛta ucyate  /
    chandasi tṛc ca  / kṣatṛbhyaḥ saṅgrahītṛbhyaḥ  / svare viśeṣaḥ //
