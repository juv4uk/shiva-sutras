source_id: KASIKA-4.1.39
locator:
  sutra: 4.1.39
witness_text:
  sutra: varṇād anudāttāt topadhātto naḥ
  commentary: vā iti vartate  / varṇa-vācinaḥ prātipadikāt anudāttāntāt takāropadhād
    vā ṅīp pratyayo bhavati, takārasya nakārādeśo bhavati  / etā, enīṃ  / śyetā, śyenī  /
    haritā, hariṇī  / sarve ete ādyudāttāḥ, varṇānāṃ taṇatinitāntānām iti vacanāt  /
    varṇāt iti kim ? prakṛtā  / prarutā  / gatisvareṇādyudāttaḥ  / anudāttāt iti kim
    ? śvetā  / ghṛtāditvādantodāttaḥ  / topadhāt iti kim ? anyato ṅīṣaṃ vakṣyati  /
    ataḥ ity eva, śitir brahmaṇī  / piśaṅgādupasaṅkhyānam  / piśaṅgī  / asitapalitayoḥ
    pratiṣedhaḥ  / asitā  / palitā  / chandasi knam ityeke  / asiknī  / paliknī  /
    bhāṣāyām api iṣyate  / gato gaṇastūrṇamasiknikānām // [#328]
