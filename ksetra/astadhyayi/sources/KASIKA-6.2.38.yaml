source_id: KASIKA-6.2.38
locator:
  sutra: 6.2.38
witness_text:
  sutra: mahān vrīhy-aparāhṇa-gṛṣṭi-iṣvāsa-jābāla-bhāra-bhārata-hailihila-raurava-pravṛddheṣu
  commentary: prakṛtyā pūrvapadam iti vartate, dvandve iti nivṛttam  / mahān ity etat
    pūrvapadaṃ vrīhi aparāhṇa gṛṣṭi iṣvāsa jābāla bhāra bhārata hailihila laurava
    pravṛddha ity eteṣu uttarapadeṣu prakṛtisvaraṃ bhavati  / mahavrīhiḥ  / mahāparāhṇaḥ  /
    mahāgṛṣṭiḥ  / maheṣvāsaḥ  / mahājābālaḥ  / mahābhāraḥ  / mahābhārataḥ  / mahāhailihilaḥ  /
    mahārauravaḥ  / mahāpravṛddhaḥ  / mahacchabdo 'ntodāttaḥ, tasya ratipadokto yaḥ
    samāsaḥ sanmahatparamotkṛṣṭāḥ pūjyamānaiḥ (*2,1.61) iti tatra+eṣa svaraḥ  / tena+eṣāṃ
    ṣaṣṭhīsamāso 'ntodātta eva bhavati, mahato vrīhiḥ mahadvrīhiḥ iti  / karmadhāraye
    'niṣṭhā (*6,2.46) ity ayam api śreṇyādisamāse vidhiḥ iti pravṛddhaśabdaḥ iha paṭhyate
    //
