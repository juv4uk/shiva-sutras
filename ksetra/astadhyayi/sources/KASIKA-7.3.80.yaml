source_id: KASIKA-7.3.80
locator:
  sutra: 7.3.80
witness_text:
  sutra: pv-ādīnāṃ hrasvaḥ
  commentary: pū ity evam ādīnāṃ hrasvo bhavati śiti parataḥ  / pvādayaḥ kryādiṣu
    paṭhyante  / pūñ pavan ity ataḥ prabhṛti plī gatau vṛt iti yāvat kecit icchanti,
    vṛtkaraṇam etat lvādīnāṃ pvādīnāṃ ca parisamāptyartham iti  / apare tu lvādīnām
    eva parisamāptyarthaṃ vṛtkaraṇam etad icchanti, āgaṇāntāḥ pvādayaḥ iti  / pūñ
    - punāti  / lūñ - lunāti  / stṝñ - stṛṇāti  / yeṣām āgaṇāntāḥ pvādayaḥ teṣāṃ jānāti
    ity atra hrasvaḥ prāpnoti, jñājanor jā (*7,3.79) iti dīrghakaraṇasāmarthyān na
    bhavati  / janer api hi jādeśe sati ato dīrgho yañi (*7,3.101) iti dīrghatvena
    jāyate iti sidhyati //
