source_id: KASIKA-4.3.3
locator:
  sutra: 4.3.3
witness_text:
  sutra: tavaka-mamakāv ekavacane
  commentary: ekavacana-parayor yuṣmad-asmadoḥ tavaka mamaka ity etāv ādeśau bhavataḥ
    yathāsaṅkhyaṃ tasmin khañi aṇi ca parataḥ  / nimittayos tu yathāsaṅkhyaṃ pūrvavad
    eva na bhavati  / nanu ca na lumatā aṅgasya (*1,1.63) iti pratyayalakṣaṇa-pratiṣedhād
    ekavacana-paratā yuṣmad-asmador na sambhavati ? vacanāt pratyayalakṣaṇam bhaviṣyati  /
    atha vā na+eva+idaṃ pratyayalakṣaṇaṃ, kiṃ tarhy anvartha-grahaṇam  / ekavacane
    yuṣmad-asamādī ekasya arthasya vācake tavaka-mamakāv ādeśau pratipadyete iti sūtra-arthaḥ  /
    tāvakīnaḥ  / māmakīnaḥ  / tāvakaḥ  / māmakaḥ  / tasminn aṇi ca ity eva, tvadīyaḥ  /
    madiyaḥ //
