locator:
  sutra: 3.3.7
witness_text:
  sutra: lipsyamāna-siddhau ca
  commentary: vibhāṣā ity eva  / lipsyamānāt siddhiḥ lipsyamāna-siddhiḥ  / lipsyamāna-siddhau
    gamyamānāyāṃ bhaviṣyati kāle dhātoḥ vibhāṣā laṭ pratyayo bhavati  / akiṃvṛtta-artho
    'yam ārambhaḥ  / yo bhaktaṃ dadāti sa svargaṃ gacchati, yo bhaktaṃ dāsyati sa
    svargaṃ gamiṣyati, yo bhaktaṃ dāta sa svargaṃ gantā  / lipsyamānād bhaktāt svargasiddhimācakṣāṇo
    dātāraṃ protsāhayati //
