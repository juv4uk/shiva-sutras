source_id: KASIKA-7.3.56
locator:
  sutra: 7.3.56
witness_text:
  sutra: her acaṅi
  commentary: hinoter hakarasya abhyāsād uttarasya kavargādeśo bhavati acaṅi  / prajighīṣati  /
    prajeghīyate  / prajighāya  / acaṅi iti kim ? prājīhayat dūtam  / acaṅi iti śakyamakartum  /
    katham ? caṅyabhyāsanimitte ṇau hinotir aṅgaṃ bhavati, tatra abhyāsanimitte pratyaye
    heraṅgasya iti vijñāyamane prāptir eva na asti ? tat kriyate jñāpakārtham  / etat
    jñāpyate, heracaṅi iti caṅo 'nyatra herṇya dhikasya api kutvaṃ bhavati iti  /
    tena prajighāyayiṣati iti siddhaṃ bhavati //
