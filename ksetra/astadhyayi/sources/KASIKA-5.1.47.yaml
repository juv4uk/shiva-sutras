source_id: KASIKA-5.1.47
locator:
  sutra: 5.1.47
witness_text:
  sutra: tad asmin vṛddhy-āya-lābha-śulka-upadā dīyate
  commentary: tad iti prathamāsamarthād asminn iti saptamyarthe yathāvihitaṃ pratyayo
    bhavati, yat tat prathamāsamarthaṃ vṛddhyādi cet tad dīyate  / dīyate ity ekavacanāntaṃ
    vṛddhyādibhiḥ pratyekam abhisambadhyate  / tatra yad adhamarṇena uttamarṇāya mūladhanātiriktaṃ
    deyaṃ tad vṛddhiḥ  / grāmādiṣu svāmigrāhyo bhāgaḥ āyaḥ  / paṭādīnām upādānamūlādatiriktaṃ
    dravyaṃ lābhaḥ  / rakṣānirveśo rājabhāgaḥ śulkaḥ  / utkocaupadā  / pañca asmin
    vṛddhir vā āyo vā lābho vā śulko vā upadā vā dīyate pañcakaḥ  / saptakaḥ  / śatyaḥ,
    śatikaḥ  / sāhasraḥ // caturthyartha upasaṅkhyānam  / pañca asmai vṛddhir vā āyo
    vā lābho vā upadā vā dīyate pajcako devadattaḥ  / siddhaṃ tv adhikaraṇatvena vivakṣitatvāt  /
    samamabrāhmaṇe dānam iti yathā //
