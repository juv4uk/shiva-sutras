source_id: KASIKA-1.2.9
locator:
  sutra: 1.2.9
witness_text:
  sutra: iko jhal
  commentary: san ity anuvartate  / ktvā iti nivṛtam  / igantād dhātoḥ paro jhal-ādiḥ
    san kid bhavati  / cicīṣati  / tuṣṭūṣati  / cikīrṣati  / ikaḥ iti kim ? pipāsati  /
    tiṣṭhāsati  / jhal iti kim ? śiśayiṣate  / kim artham idam ucyate ? guṇo mā bhūt
    iti  / aj-jhana-gamāṃ sani (*6,4.16) iti dīrghatvaṃ guṇasya bādhakaṃ bhaviṣyati
    ? yatha-iva tarhi dīrghatvaṃ guṇaṃ bādhate tathā ṇilopamapi badheta  / tasmād
    dīrghatvasya avakāśa-dānāya kittvam idam ārabhyate  / cicīṣati ity ādiṣu sāvakāśaṃ
    dīrghatvaṃ partvād ṇilopena bādhyate  / jñīpsati  / [#34] ikaḥ kittvaṃ guṇo mā
    bhūt dīrgha-ārambhāt kṛte bhatet  / anarthakam tu hrasva-arthaṃ dīrghāṇāṃ tu prasajyate  //1//
    sāmarthyāddhi punarbhāvyamṝdittvaṃ dīrghasaṃśrayam  / dīrghāṇāṃ nākṛte kīrghe
    ṇilopastu prayojanam  //2//
