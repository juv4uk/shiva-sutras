source_id: KASIKA-5.2.33
locator:
  sutra: 5.2.33
witness_text:
  sutra: inac piṭac cika ci ca
  commentary: neḥ ity eva, nate nāsikāyāḥ iti ca  / ni-śabdān nāsikāyā nate 'bhidheye
    inac piṭac ity etau pratyayau bhavataḥ, tatsaṃniyogena ca ni-śabdasya yathāsaṅkhyaṃ
    cika ci ity etāv ādeśau bhavataḥ  / cikinaḥ, cipiṭaḥ // kakāraḥ pratyayo vaktavyaścik
    ca prakṛtyādeśaḥ  / cikkaḥ  / tathā ca+uktam - inac-piṭac-kāścikacicikādeśāś ca
    vaktavyāḥ iti  / klinnasya cil-pillaś ca asya cakṣuṣī  / klinnasya cil pil ity
    etāv ādeśau bhavataḥ laś ca pratyayo 'sya cakṣuṣī ity etasminn arthe  / klinne
    asya cakṣuṣī cillaḥ, pillaḥ  / culādeśo vaktavyaḥ  / cullaḥ  / asya ity anena
    nārthaḥ  / cakṣuṣor eva abhidhāne pratyaya iṣyate  / klianne cakṣuṣī cille, pille
    culle  / tadyogāt tu puruṣas tathā+ucyate //
