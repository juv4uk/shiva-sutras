source_id: KASIKA-7.1.1
locator:
  sutra: 7.1.1
witness_text:
  sutra: yu-vor ana-akau
  commentary: yu vu ity etayoḥ utsṛṣṭaviśeṣaṇayoḥ anunāsikayaṇoḥ pratyayayor grahaṇam,
    tayoḥ sthāne yathāsaṅkhyam ana aka ity etāv ādeśau bhavataḥ  / yoḥ anaḥ, voḥ akaḥ  /
    nandyādibhyo lyuḥ - nandanaḥ  / ramaṇaḥ  / sāyamādibhyaṣṭyuṭyulau tuṭ ca - sāyanatanaḥ  /
    cirantanaḥ  / ṇvultṛcau - kārakaḥ  / hārakaḥ  / vāsudeva-arjunābhyāṃ vun (*4,3.98)
    - vūsudevakaḥ  / arjunakaḥ  / anunāsikayaṇoḥ iti kim ? ūrṇāyā yus (*5,2.123) -
    ūrṇāyuḥ  / bhujimṛṅbhyāṃ yuktyukau - bhujyuḥ, mṛtyuḥ iti  / evam ādīnāṃ hi yaṇo
    'nunāsikatvaṃ na pratijñāyate, pratijñānunāsikyāḥ pāṇinīyāḥ  / iha yuvor iti nirdeśād
    dvandvaikavadbhāvapakṣe anityam āgamaśāsanam iti num na kriyate  / napuṃsakaliṅgatā
    vā liṅgamaśiṣyaṃ lokāśrayatvāl liṅgasya iti na bhavati  / itaretarapakṣe tu chāndasatvāt
    varṇalopo draṣṭavyaḥ  / yuvoś ced dvitvanirdeśo dvitve yaṇ tu prasajyate  / atha
    ced ekavadbhāvaḥ kathaṃ puṃvad bhavedayam // dvitve vaigamiko lopa ekatve numanityatā  /
    aśiṣyatvād dhi liṅgasya puṃstvaṃ veha samāśritam //
