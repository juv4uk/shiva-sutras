source_id: KASIKA-8.3.59
locator:
  sutra: 8.3.59
witness_text:
  sutra: ādeśapratyayayoḥ
  commentary: mūrdhanyaḥ iti vartate, sa iti ca  / ādeśapratyayayoḥ iti ṣaṣṭhī bhedena
    sambadhyate  / ādeśo yaḥ sakāraḥ, pratyayasya ca yaḥ sakāraḥ iṇkor uttaraḥ tasya
    mūrdhanyo bhavati ādeśaḥ  / ādeśasya tāvat - siṣeva  / suṣvāpa  / pratyayasya
    - agniṣu  / vāyuṣu  / kartṛṣu  / hartṛṣu  / indro mā vakṣat, sa devān yakṣat iti
    vyapadeśivadbhāvāt pratyayasya iti ṣatvaṃ bhavati  / yajater vahateś ca pañcamalakāre
    parasmaipadaprathamaikavacane ikāralopaḥ, leṭo 'ḍaṭau (*3,4.94) iti aṭ, sibbahulaṃ
    leṭi (*3,1.34) iti sip, tataḥ siddhaṃ yakṣat, vakṣat iti //
