locator:
  sutra: 4.3.111
witness_text:
  sutra: karmanda-kṛśāśvād iniḥ
  commentary: bhikṣu-naṭasūtrayoḥ ity eva  / karmanda-kṛśāśva-śabdābhyām iniḥ pratyayo
    bhavati tena proktam ity etasmin viṣaye yathāsaṅkhyaṃ bhikṣu-naṭasūtrayor abhidheyayoḥ  /
    aṇo 'pavādaḥ  / atra api tadviṣayatārthaṃ chando-grahaṇam anuvartyam  / karmandena
    proktam adhīyate karmandino bhikṣavaḥ  / kṛśāśvino naṭāḥ  / bhikṣu-naṭasūtrayoḥ
    ityeva, kārmandam  / kārśāśvam // [#425]
