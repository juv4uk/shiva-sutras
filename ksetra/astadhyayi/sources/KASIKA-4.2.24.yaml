source_id: KASIKA-4.2.24
locator:
  sutra: 4.2.24
witness_text:
  sutra: sā 'sya devatā
  commentary: sā iti prathamāsamarthād asya iti ṣaṣṭhyarthe yathāvihitaṃ pratyayo
    bhavati, yat prathamāsamarthaṃ devatā cet sā bhavati  / yāgasaṃpradānaṃ devatā,
    deyasya puroḍāśādeḥ svāminī, tasminn abhidheye pratyayaḥ  / indro devatā asya
    aindraṃ haviḥ  / ādityam  / bārhaspatyam  / prājāpatyam  / devatā iti kim ? kanyā
    devatā asya  / katham aindro mantraḥ ? mantrastutyam api devatā ity upacaranti  /
    katham āgneyo vai brāhmaṇo devatā iti ? upamānād bhaviṣyati  / mahārājaproṣṭhapadāṭ
    ṭhañ (*4,2.35) iti yāvat sā 'sya devatā ity adhikāraḥ  / sā iti prakṛte punaḥ
    samartha-vibhakti nirdeśaḥ sañjñā-nivṛtty-arthaḥ //
