locator:
  sutra: 8.4.31
witness_text:
  sutra: halaścejupadhāt
  commentary: kṛtyacaḥ iti vartate  / halādiḥ yo dhāturijupadhaḥ tasmāt paro yaḥ kṛtpratyayaḥ
    tatsthastha nakārasya aca uttarasya upasargasthān nimittād uttarasya vibhāṣā ṇakārādeśo
    bhavati  / prakopaṇam, prakopanam  / parikopaṇam, parikopanam  / halaḥ iti kim
    ? prehaṇam  / prohaṇam  / ijupadhāt iti kim ? pravapaṇam  / parivapaṇam  / kṛtyacaḥ
    iti nitye prāpte vikalpaḥ  / acaḥ ity eva, paribhugnaḥ  / ijupadhasya sarvasya
    halantatvād iha halgrahaṇamādiviśeṣaṇam //
