source_id: KASIKA-6.1.45
locator:
  sutra: 6.1.45
witness_text:
  sutra: ād eca upadeśe 'śiti
  commentary: dhātoḥ iti vartate  / ejanto yo dhātur upadeśe tasya akārādeśo bhavati,
    śiti tu pratyaye na bhavati  / glai - glātā  / glātum  / glātavyam  / śo - niśātā  /
    niśātum  / niśātavyam  / ecaḥ iti kim ? kartā  / hartā  / upadeśe iti kim ? cetā  /
    stotā  / aśiti iti kim ? glāyati  / mlāyati  / kathaṃ jagle, mamle ? na+evaṃ vijñāyate,
    śakāra id yasya so 'yaṃ śit iti, kiṃ tarhi, śa eva it śit  / tatra yasmin vidhistadādāvalgrahaṇe
    iti śidādau pratyaye pratiṣedhaḥ  / eś śakārānto bhavati  / aśiti iti prasajyapratiṣedho
    'yam, tena etad āttvam anaimittikaṃ prāg eva pratyayotpatter bhavati iti, suglaḥ,
    sumlaḥ iti ātaścopasarge (*3,1.136) iti kapratyayaḥ, suglānaḥ, sumlānaḥ iti āto
    yuc (*3,3.128) ity evam ādi siddham bhavati iti  / ākārādhikārastvayaṃ nityaṃ
    samyateḥ (*6,1.57) iti yāvat //
