locator:
  sutra: 6.1.166
witness_text:
  sutra: tisṛbhyo jasaḥ
  commentary: tisṛbhya uttarasya jaso 'nta udātto bhavati  / tisrastiṣṭhanti  / udātta-svaritayor
    yaṇaḥ svarito 'nudāttasya (*8,2.4) ity asya apavādaḥ  / śasi udāttayaṇo hal-pūrvāt
    (*6,1.174) iti siddhe 'nyatra bahuvacane ṣaṭtricaturbhyo halādiḥ (*6,1.179) iti
    vidhānāt jas eva labhyate iti jasgrahaṇam upasamastārtham eke icchanti atitistrau
    ity atra svaro mā bhūt iti //
