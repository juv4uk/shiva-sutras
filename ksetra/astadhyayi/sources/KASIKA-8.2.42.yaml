source_id: KASIKA-8.2.42
locator:
  sutra: 8.2.42
witness_text:
  sutra: ra-dābhyāṃ niṣthāto naḥ pūrvasya ca daḥ
  commentary: rephadakārābhyām uttarasya niṣthātakārasya nakāraḥ ādeśo bhavati pūrvasya
    ca dakārasya  / rephāntāt tāvat - āstīrṇam  / vistīrṇam  / viśīrṇam  / nigīrṇam  /
    avagūrṇam  / dakārāt - bhinnaḥ  / bhinnavān  / dhinnaḥ  / chinnavān  / radābhyām
    iti kim ? kṛtaḥ  / kṛtavān  / raḥ ity atra raśrutisām anyaṃ na+upādīyate, kiṃ
    tarhi, vyañjanamātram  / rephasāmānyanirdeśe 'pi sati rephāt parā yā 'jbhaktis
    tadvyavadhānānnatvaṃ na bhavati  / niṣthā iti kim ? kartā  / hartā  / taḥ iti
    kim ? caritam  / muditam  / pūrvasya iti kim ? parasya mā bhūt, bhinnavadbhyām  /
    bhinnavadbhiḥ  / iha kṛtasya apatyaṃ kārtiḥ iti vṛddheḥ bahiraṅgalakṣaṇāyā asiddhatvānnatve
    kartavye rephasya asiddhatvam //
