locator:
  sutra: 6.4.112
witness_text:
  sutra: śnā-abhyas tayor ātaḥ
  commentary: śnā ity etasya abhyastānāṃ ca aṅgānām ākārasya lopo bhavati sārvadhātuke
    kṅiti parataḥ  / lunate  / lunatām  / alunata  / abhyastānām - mimate  / mimatām  /
    amimata  / saṃjihate  / saṃjihatām  / samajihata  / śnābhyas tayoḥ iti kim ? yānti  /
    vānti  / ātaḥ iti kim ? bibhrati  / kṅiti ity eva, alunāt  / ajahāt  / ādgrahaṇaṃ
    spaṣṭārtham // [#756]
