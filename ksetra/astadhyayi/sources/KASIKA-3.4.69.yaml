source_id: KASIKA-3.4.69
locator:
  sutra: 3.4.69
witness_text:
  sutra: laḥ karmaṇi ca bhāve ca akramakebhyaḥ
  commentary: laḥ ity utsṛṣṭānaubandhaṃ sāmānyaṃ gṛhyate, prathamābahuvacanāntaṃ caa+eat  /
    lakārāḥ karmaṇi kārake bhavanti, cakārāt kartari ca akarmakebhyo dhātubhyo bhāve
    bhavanti, punaś cakārāt kartari ca  / gamyate grāmo devadattena  / gacchati grāmaṃ
    devadattaḥ  / akarmakebhyaḥ - āsyate devadattena  / āste devadattaḥ  / sakramakebhyo
    bhāve na bhavanti // [#308]
