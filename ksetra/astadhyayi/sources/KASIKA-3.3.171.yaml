source_id: KASIKA-3.3.171
locator:
  sutra: 3.3.171
witness_text:
  sutra: kṛtyāś ca
  commentary: āvaśyaka-ādhamarṇyayoḥ iti vartate  / kṛtya-sañjākāś ca pratyayā āvaśyaka-ādhamarṇyayor
    upādhibhūtayoḥ dhātor bhavanti  / bhavatā khalu avaśyaṃ kaṭaḥ kartavyaḥ, avaśyaṃ
    karaṇīyaḥ, avaśyaṃ kāryaḥ, avaśyaṃ kṛtyaḥ  / ādhamarṇye - bhavatāśataṃ dātavyam  /
    sahasraṃ deyam  / kimartham idam, yāvatā sāmāgyena vihitā asminn api viṣaye bhavisyanti
    ? viśeṣa-vihitena ṇininā bādhyeran  / kartari ṇiniḥ, bhāva-karmaṇoḥ kṛtyāḥ, tatra
    kuto bādhaprasaṅgaḥ ? tatra kecid āhuḥ, bhavyageyādayaḥ kartṛ-vācinaḥ kṛtyāḥ,
    ta iha+udāharaṇam iti // [#291]
