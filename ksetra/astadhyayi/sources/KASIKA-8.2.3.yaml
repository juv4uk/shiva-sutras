source_id: KASIKA-8.2.3
locator:
  sutra: 8.2.3
witness_text:
  sutra: na mu ne
  commentary: mubhāvo nābhāve kartavye na asiddho bhavati  / kiṃ tarhi ? siddha eva  /
    amunā  / mubhāvasya asiddhatvāt ghilakṣaṇo nābhāvo na syāt  / kṛte tu nābhāve
    mubhāvasya asiddhatvāt, supi ca (*7,3.102) iti dīrghatvaṃ yat prāpnoti, tat sannipātalakṣaṇo
    vidhir animittaṃ tadvighātasya iti na bhavati  / athavā yogadvayam idam ubhayārthaṃ
    tantreṇa+uccāritam  / atha vā ne parato yat prāpnoti tasmin kartavye mubhāvo na
    asiddhaḥ ity eṣa eva atra sūtrārthaḥ  / ne tu kartavye mubhāvasya yat siddhatvaṃ
    tadarthāt saṅgṛhītam  / tena atra mubhāvasya siddhatvāt nābhāvaś ca bhavati, dīrghatvaṃ
    ca na bhavati  / ekādeśasvaro 'ntaraṅgaḥ siddho vaktavyaḥ  / kiṃ prayojanam ?
    ayāyāvekādeśaśatṛsvaraikānanudāttasarvānudāttārtham  / vṛkṣa idam, plakṣa idam  /
    atra prātipadikāntasaptamyekavacanayor udāttānudāttayor ekādeśaḥ  / sa ekādeśasvaro
    'ntaraṅgaḥ siddho vaktavyaḥ  / kiṃ prayojanam ? ayāyāvekādeśaśatṛsvaraikānanudattasarvānudāttārtham  /
    vṛkṣa idam, plakṣa idam  / atra prātipadikāntasaptamyekavacanayor udāttānudāttayor
    ekādeśaḥ  / sa ekādeśa udāttena+udāttaḥ (*8,2.5) ity udāttaḥ  / tasya ? siddhatvaṃ
    vaktavyam  / āntaryataḥ ayādeśaḥ udātto yathā syāt  / āy - kumāryā idam  / katham
    idam udāharaṇam yadi udāttayaṇo halpūrvāt (*6,1.174) ity udāttatve kṛte vibhakteḥ
    āṭaś ca (*6,1.90) ekādeśaḥ, tadā bhavati idam udāharaṇam  / atha tu kṛte ekādeśe
    udāttayaṇo halpūrvāt (*6,1.174) iti svaraḥ, tadā na+etad asya prayojanaṃ bhavati  /
    āv - vṛkṣāvidam  / plakṣāvidam  / ekādeśaḥ svaraḥ gāṅge 'nūpa iti gāṅgeśabde ekāraḥ
    ekādeśa udāttena+udāttaḥ (*8,2.5) iti udāttaḥ  / tasya siddhatvāt ya punaḥ eṅaḥ
    padāntādati (*6,1.109) iti ekādeśaḥ sa ekādeśa udāttena+udāttaḥ (*8,2.5) iti,
    ata svarito vā 'nudātte padādau (*8,2.6) ity etad bhavati  / śatṛsvaraḥ - tudatī  /
    nudatī  / adupadeśāt iti lasārvadhātukānudattatve kṛte ekādeśaḥ, tad udāttasya
    siddhatvāt śaturanumo nadyajādī (*6,1.173) antodāttāt ity eṣa svaro bhavati  /
    anuma iti pratiṣedho jñāpakaḥ, ekādeśasvaraḥ śatṛsvare siddhaḥ iti  / nahi sanuṃkaṃ
    śatrantaṃ śatrantaṃ kiñcid ekādeśasvaram antareṇa antodāttam asti  / ekānanudāttaḥ
    - tudanti  / likhanti  / ekadeśasvarasya siddhatvāt tena anudāttaṃ padam ekavarjam
    (*6,1.158) iti varjyamānatā bhavati  / sarvānudāttaḥ - brāhmaṇās tudanti  / brāhmaṇāḥ
    likhanti  / ekādeśasvarasya siddhatvāt kṛte tasmin tiṅṅatiṅaḥ (*8,1.27) iti nighāto
    bhavati  / antaraṅga iti vacanād bahiraṅgasya asiddhatvam eva, pacatīti, prapacatīti  /
    [#907] saṃyogāntalopo rorutve siddho vaktavyaḥ  / kiṃ prayojanam ? harivo medinaṃ
    tvā  / harivaḥ iti matubantam etat, tatra chandasīraḥ (*8,2.15) iti vattve, saṃyogāntasya
    lope ca kṛte, matuvaso ru mambuddhau chandasi (*8,3.1) iti rutvam, tasya saṃyogāntasya
    lopasya asiddhatvāt haśi ca (*6,1.114) iti utvaṃ na prāpnoti  / sijlopa ekādeśe
    siddho vaktavyaḥ  / alāvīt  / apāvīt  / iṭa īṭi (*8,2.29) iti sijlopasya siddhatvāt
    savarṇadīrghatva bhavati  / niṣṭhādeśaḥ ṣatvasvarapratyayeḍvidhiṣu siddḥ vaktavyaḥ  /
    vṛkṇaḥ  / vṛkṇavān  / niṣṭhādeśasya siddhatvāt jhali iti ṣatvaṃ na bhavati  /
    kutvaṃ tu prati asiddha eva iti tad bhavati  / svarapratyayavidhīḍvidhiṣu kṣībaśabda
    udāhriyate  / tatra ca nipātanam anekadhā samāśrīyate  / yadā kṣīber niṣṭhāyām
    iṭi kṛte itśabdalopo nipātyate, tadā kṣībaḥ iti sañjñāyām itśabdalopasya asiddhatvāt
    niṣṭhā ca dvyajanāt (*6,1.205) ity eṣa svaro na prāpnoti, kṣībena tarati kṣībikaḥ
    iti dvyajalakṣaṇaṣṭhan na prapnoti  / yadā tu takāralopo nipātyate, tadā tasya
    asiddhatvāt iḍāgamaḥ prāpnoti  / plutavikārastugvidhau che siddho vaktavyaḥ  /
    agnā3icchatram  / paṭā3ucchatram  / plutavikārasya asiddhatvat che ca (*6,1.73)
    iti hrasvalakṣaṇo nityas tug na prāpnoti  / ścutvaṃ dhuṭi siddhaṃ vaktavyam  /
    ścyutir kṣaraṇe ity ayaṃ dhātuḥ sakārādiḥ paṭhyate, tasya ścutvasya asiddhatvāt
    aṭ ścyotati, raṭ ścyotati iti ḍaḥ si ḍhuṭ (*8,3.21) iti prāpnoti  / aṭati iti
    aḍ, raṭati iti raḍ, kvibanto 'yam  / kimarthaṃ punaḥ sakārādiḥ paṭhyate ? iha
    madhu ścyotati iti madhuścyut, kvibantaḥ, madhuścyutam ācaṣṭe iti ṇic, madhuścyayati,
    madhuścyayateḥ punaḥ kvipi kṛte saṃyogāditvāt salopaḥ, saṃyogāntatvād yalopaḥ,
    cakārasya kutvam, madhug iti siddham  / [#908] śakārādau punar etasmin saṃyogāntalopena
    yakāracakārayoḥ luptayoḥ śakārasya ṣatve sati madhuḍ iti syāt  / abhyāsajaśtvacartve
    etvatukoḥ siddhe vaktavye  / babhaṇatuḥ  / babhaṇuḥ  / abhyāsajaśtvasyāsiddhatvāt
    anādeśādeḥ iti etvaṃ prāpnoti  / chideḥ vicicchitsati, uccheḥ ucicchiṣati iti
    abhyāsādeśasya asiddhatvāt che ca (*6,1.73) iti tuk na prāpnoti  / dvirvacane
    parasavarnavaṃ siddhaṃ vaktavyam  / sayṃ yṃ yantā, savṃ vṃ, vatsaraḥ, yalṃ lṃ,
    lokam, talṃ lṃ lokam iti parasavarṇasyāsiddhatvād yaraḥ iti dvirvacanaṃ na syāt  /
    padādhikāraścel latvaghatvaḍhatvanatvarutvaṣatvaṇatvānunāsikachatvāni siddhāni
    vaktavyāni  / latvam - galo halaḥ, garo garaḥ  / ghatvam - drogdhā drogdhā  /
    ḍhatvam - droḍhā droḍhā  / natvam - nunno nunnaḥ, nutto nuttaḥ  / rutvam - abhino
    'bhinaḥ, abhinadabhinat  / ṣatvam - mātuḥṣvasā mātuḥṣvasā, mātuḥsvasā matuḥsvasā  /
    pituḥṣvasā pituḥṣvasā, pituḥsvasā pituḥsvasā  / ṇatvam - māṣavāpāṇi māṣavāpāṇi,
    māṣavāpāni māśavāpāni  / anunāsikam - vāṅnayanaṃ bāṅnayanam, vāgnayanaṃ vāgnayanam  /
    chatvam - vakcchayanaṃ vākcchayanam, vākśayanaṃ vākśayanam  / latvādīnāṃ vikalpitānām
    asiddhatvāt kṛte dvirvacane satyupariṣṭad vikalpe siti garo galaḥ, galo garaḥ
    ity evaṃ rūpam api dviruktaṃ syāt  / tad etat sarvaṃ na mu ne iti yogavibhāgena
    sādhyate  / na ity etāvadaniṣṭe viṣaye pūrvatra asiddhasya pratiṣedhārtham  /
    tato mu ne iti  / nety etad anuvartate //
