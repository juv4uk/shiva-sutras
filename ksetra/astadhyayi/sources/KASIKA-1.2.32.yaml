source_id: KASIKA-1.2.32
locator:
  sutra: 1.2.32
witness_text:
  sutra: tasya-ādita udāttam ardha-hrasvam
  commentary: udātta-anudātta-svara-samāhāraḥ svaritaḥ ity uktam  / tatra na jñāyate
    kasminnaṃśe udāttaḥ kasminn anudāttaḥ, kiyān vā udāttaḥ kiyān vā anudāttaḥ iti  /
    tad-ubhayam anena-ākhyāyate  / tasya svaritasya ādāv ardha-hrasvam udāttam, pariśiṣṭam
    anudāttam  / ardha-hrasvam iti ca ardhamātra-upalakṣyate  / hrasva-grahaṇam atantram  /
    sarveṣām eva hrasva-dīrgha-plutānāṃ svaritānām eṣa svara-vibhāgaḥ  / śikyam ity
    atra ardha-mātrā ādita udātta, apara-ardha-mātrā anudāttā, eka-śrautir vā  / kanyā
    ity atra ardha-mātrā ādita udattā adhyardha-mātrā anudāttā  / māṇavaka3 māṇavaka
    (*8,2.103) ity atra ardha-mātrā ādita udāttā ardha-tṛtīya-mātrā anudāttā //
