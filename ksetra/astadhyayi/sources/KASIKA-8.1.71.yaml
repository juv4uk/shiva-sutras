source_id: KASIKA-8.1.71
locator:
  sutra: 8.1.71
witness_text:
  sutra: tiṅi ca+udāttavati
  commentary: gatiḥ iti vartate  / tiṅante udāttavati parato gatiranudātto bhavati  /
    yat prapacati  / yat prakaroti  / tiṅgrahaṇam udāttavataḥ parimāṇārtham  / anyathā
    hi yaṃ prati gatiḥ, tatrānudātto bhavati iti dhātau eva udāttavati syāt, pratyaye
    na syāt yat prakaroti iti  / yatkriyāprayuktāḥ prādayas teṣām taṃ prati gatyupasargasañjñe
    bhavataḥ iti tiṅante dhātum eva prati gatisañjñā  / āmante tarhi na prāpnoti,
    prapacatitarām, prapacatitamām iti ? atra kecidāmantena gataḥ samāsaṃ kurvanti  /
    teṣām avyayapūrvapadaprakṛtisvaratve satyakriyamāṇe 'pi tiṅgrahaṇe paramanudāttavad
    bhavati iti gatinighāto naiva sidhyati  / atha tarabantasy gatisamāsaḥ ? evam
    api satiśiṣṭatvādāma eva svare sati gateḥ anudāttaṃ padam ekavarjam (*6,1.158)
    ity evānudāttatvaṃ siddham  / yeṣāṃ gatikārakopapadānāṃ kṛdbhiḥ samāsavacanam
    prāk subutpatteḥ ity anena vacanena kṛdantena+eva prāk subutpatteḥ samāso bhavati,
    na anyena, iti darśanam, teṣām evaṃvidhe viṣayesamāsena na+eva bhavitavyam iti  /
    pṛthak svarapravṛttau satyāmanena nighātena prayojanam asti  / tadarthaṃ yatnaḥ
    kartavyaḥ  / udāttavati iti kim ? prapacati  / prakaroti //
