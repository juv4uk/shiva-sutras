source_id: KASIKA-4.1.112
locator:
  sutra: 4.1.112
witness_text:
  sutra: śiva-ādibhyo 'ṇ
  commentary: gotre iti nivṛttam  / ataḥ prabhṛti sāmānyena pratyayāḥ vijñāyante  /
    śivādibhyo 'patye aṇ pratyayo bhavati  / yathāyatham iñādīnām apavādaḥ  / śaivaḥ  /
    prauṣṭhaḥ  / takṣan śabdo 'tra paṭhyate kārilakṣaṇamudīcāmiñaṃ bādhitum  / ṇyatpratyaysya
    tu bādho niṣyate  / tākṣṇaḥ, tākṣaṇyaḥ  / gaṅgā-śabdaḥ paṭhyate tikādiphiñā śumrādiḍhakā
    ca samāveśa-artham  / tena trairūpyaṃ bhavati  / gāṅgaḥ, gāṅgāyaniḥ , gāṅgeyaḥ  /
    vipāśaśabdaḥ paṭhyate kuñjādilakṣaṇena cphañā samāveśa-artham  / vaipāśaḥ, vaipāśāyanyaḥ  /
    śiva  / prauṣṭha  / prauṣṭhika  / caṇḍa  / jambha  / muni  / sandhi  / bhūri  /
    kuṭhāra  / anabhimlāna  / kakutstha  / kahoḍa  / lekha  / rodha  / khañjana  /
    kohaḍa  / piṣṭa  / hehaya  / khañjāra  / khañjāla  / surohikā  / parṇa  / kahūṣa  /
    parila  / vataṇḍa  / tṛṇa  / karṇa  / kṣīrahrada  / jalahrada  / pariṣika  / jaṭilika  /
    gophilika  / badhirikā  / mañjīraka  / vṛṣṇika  / rekha  / ālekhana  / viśravaṇa  /
    ravaṇa  / vartanākṣa  / piṭaka  / piṭāka  / tṛkṣāka  / nabhāka  / ūrṇanābha  /
    jaratkāru  / utkṣipā  / rohitika  / āryaśveta  / supiṣṭa  / kharjūrakarṇa  / masūrakarṇa  /
    tūṇakarṇa  / mayūrakarṇa  / khaḍaraka  / takṣan  / ṛṣṭiṣeṇa  / gaṅgā  / vipāśa  /
    yaska  / lahya  / drugha  / ayaḥsthūṇa  / bhalandana  / virūpākṣa  / bhūmi  /
    ilā  / sapatnī  / dvyaco nadyāḥ  / t riveṇī trivaṇaṃ ca // [#349]
