source_id: KASIKA-1.4.96
locator:
  sutra: 1.4.96
witness_text:
  sutra: apiḥ padārtha-sambhāvana-anvavasarga-garhā-samuccayeṣu
  commentary: padārthe, sambhāvane, anvavasarge, garhāyām, samuccaye ca vartamānaḥ
    apiḥ karmapravacanīya-sañjño bhavati  / padāntarasya aprayujyamānasya arthaḥ padārthaḥ
    - sarpiṣo 'pi syāt  / madhuno 'pi syāt  / mātrā, binduḥ, stokam ity asya arthe  'pi
    śabdo vartate  / sambhāvanam adhikārtha-vacanena śakter apratighātāviṣkaranam
    - api siñcen mūlaka-sahasram  / api stuyād rājānam  / anvavasargaḥ kāmacāra-abhyanujñānam
    - api siñca  / api stuhi  / garhā nindā - dhig jālmaṃ devadattam, api siñcet palāṇḍum  /
    api stuyād vṛṣalam  / samuccaye - api siñca  / api stuhi  / siñca ca stuhi ca  /
    upasargasañjñābādhanāt ṣatvam na bhavati //
