source_id: KASIKA-6.1.51
locator:
  sutra: 6.1.51
witness_text:
  sutra: vibhāṣā līyateḥ
  commentary: lyapi iti vartate, ādeca upadeśe iti ca  / līṅ śleṣaṇe iti divādiḥ  /
    lī śleṣaṇe iti kryādiḥ  / tayoḥ ubhayoḥ api yakā nirdeśaḥ smaryate  / līyater
    dhatoḥ lyapi ca ecaśca viṣaye upadeśe eva alo 'ntyasya sthāne vibhāṣā ākārādeśo
    bhavati  / vilatā  / vilātum  / vilātavyam  / vilāya  / viletā  / viletum  / viletavyam  /
    vilīya  / nimimīliyaṃ khalacoḥ pratiṣedho vaktavyaḥ  / īṣat pramayaḥ  / pramayo
    vartate  / īṣannimayaḥ  / nimayo vartate  / īṣad vilayaḥ  / vilayo vartate  /
    atra tu liyo vyavasthitavibhāṣāvijñānāt siddham  / evaṃ ca pralambhanaśālīnīkaranayoś
    ca ṇau nityamāttvaṃ bhavati, kastvāmullāpayate, śyeno vartikāmullāpayate // [#610]
