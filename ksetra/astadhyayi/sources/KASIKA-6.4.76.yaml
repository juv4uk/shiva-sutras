locator:
  sutra: 6.4.76
witness_text:
  sutra: irayo re
  commentary: ire ity etasya chadasi viṣaye bahulaṃ re ity ayam ādeśo bhavati  / garbhaṃ
    prathamaṃ dadhra āpaḥ  / yā 'sya paridadhre  / dhāño rebhāvasya asiddhatvād āto
    lopo bhavati  / na ca bhavati  / paramāyā dhiyo 'gnikarmāṇi cakrire  / atra reśabdasya
    seṭoṃ dhātūnāmiṭi kṛte punā rebhāvaḥ kriyate, tadartham irayoḥ ity ayaṃ dvivacananirdeśaḥ
    //
