source_id: KASIKA-3.4.72
locator:
  sutra: 3.4.72
witness_text:
  sutra: gaty-artha-akramaka-śliṣa-śīṅ-sthā-āsa-vasa-jana-ruha-jīryatibhyaś ca
  commentary: gaty-arthabhyo dhātubhyo 'karmakebhya śliṣādibhyaś ca yaḥ ktaḥ, sa kartari
    bhavati  / cakārād yathāprāptaṃ ca bhāvakarmaṇoḥ  / gato devadatto grāmam, gato
    devadattena grāman, gato devadattena grāmaḥ, gataṃ devadattena  / akarmakebhyaḥ
    - glāno bhavān, glānaṃ bhavatā  / āsito bhavān, āsitaṃ bhavatā  / śliṣa - upaśliṣṭo
    guruṃ bhavān, upaśliṣṭo gururbhavatā, upaśliṣṭaṃ bhavatā  / śīṅ - upaśayito guruṃ
    bhavān, upaśayito gururbhavatā, upaśayitaṃ bhavatā  / sthā - upasthito guruṃ bhavān,
    upasthito gururbhavatā, upasthitaṃ bhavatā  / āsa - upāsito guruṃ bhavān, upāsito
    gururbhavatā, upāsitaṃ bhavatā  / vasa - anūṣito guruṃ bhavān, anūṣito gururbhavatā,
    anūṣitaṃ bhavatā  / jana - anujāto māṇavako māṇa - vikām, anujātā māṇavakena māṇavikā,
    anujātaṃ māṇavakena  / ruha - ārūḍho vṛkṣaṃ bhavān, ārūḍho vṛkṣo bhavatā, ārūḍhaṃ
    bhavatā  / jīryati - anujīrṇo vṛṣalīṃ devadattaḥ, anujīrṇā vṛpalī devadattena,
    anujīrṇaṃ devadattena  / śliṣādayaḥ sopasargāḥ sakarmakā bhavanti, tadartham eṣām
    upādānam //
