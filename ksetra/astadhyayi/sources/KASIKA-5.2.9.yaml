source_id: KASIKA-5.2.9
locator:
  sutra: 5.2.9
witness_text:
  sutra: anupada-sarvānna-aya-anayaṃ baddhā-bhakṣayati-neyeṣu
  commentary: anupada-ādibhyaḥ śabdebhyaḥ tad iti dvitīyāsamarthebhyaḥ yathāsaṅkhyaṃ
    baddhā bhakṣayati neya ity eteṣv artheṣu khaḥ pratyayo bhavati  / anuḥ āyāme sādṛśye
    vā  / anupadaṃ baddhā upānat anupadīnā  / padapramāṇā ity arthaḥ  / sarvānnāni
    bhakṣayati sarvānnīno bhikṣuḥ  / ayaḥ pradakṣiṇam, anayaḥ prasavyam  / pradakṣiṇaprasavyagāmināṃ
    śārāṇāṃ yasmin paraśāraiḥ padānāmasamāveśaḥ so 'yānayaḥ  / ayānayaṃ neyaḥ ayānayīnaḥ
    śāraḥ  / phalakaśiraḥsthita ity arthaḥ //
