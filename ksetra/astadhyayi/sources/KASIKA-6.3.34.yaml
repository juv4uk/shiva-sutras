source_id: KASIKA-6.3.34
locator:
  sutra: 6.3.34
witness_text:
  sutra: striyāḥ puṃvad-bhāṣītapuṃskādanūṅ samānādhikaraṇe striyām apūraṇī-priyādiṣu
  commentary: bhāṣitaḥ pumān yena samānāyāmākṛtāvekasmin pravṛttinimitte sa bhāṣitapuṃskaḥ
    śabdaḥ  / tadetadevaṃ kathaṃ bhavati ? bhāsitaḥ pumān yasminn arthe pravṛttinimite
    sa bhāṣitapuṃskaśabdena+ucyate, tasya pratipādako yaḥ śabdaḥ so 'pi bhāsitapuṃskaḥ
    ūṅo 'bhāvaḥ anūṅ, bhāṣitapuṃskādanūṅ yasmin strīśabde sa bhāṣitapuṃskādanūṅ strīśabdaḥ  /
    bahuvrīhirayam, alug nipātanāt pañcamyāḥ  / tasya bhāsitapuṃskāadanūṅaḥ strīśabdasya
    puṃśabdasyeva rūpaṃ bhavati samānādhikaraṇe uttarapade strīliṅge pūraṇīpriyādivarjite  /
    darśanīyabhāryaḥ  / śalakṣṇacūḍaḥ  / dīrghajaṅghaḥ  / striyā iti kim ? grāmaṇi
    brāhmaṇakulaṃ dṛṣṭirasya grāmaṇidṛṣṭiḥ  / bhāṣitapuṃskāt iti kim ? khaṭvābhāryaḥ  /
    samānāyāmākṛtau iti kim ? droṇībhāryaḥ  / kathaṃ garbhibhāryaḥ, prasūtabhāryaḥ,
    prajātabhāryaḥ iti ? kartavyo 'tra yatnaḥ  / anūṅa iti kim ? brahmabandhūbhāryaḥ  /
    samānādhikaraṇe iti kim ? kalyāṇā mātā kalyaṇīmātā  / striyām iti kim ? kalyāṇī
    pradhānam eṣā kalyāṇīpradhānā ime  / apūraṇī iti kim ? kalyāṇī pañcamī yāsāṃ tāḥ
    kalyāṇīpañcamā rātrayaḥ  / kalyāṇīdaśamāḥ  / pradhānapūraṇīgrahaṇaṃ kartavyam  /
    iha mā bhūt, kalyāṇīpañcamīkaḥ pakṣaḥ iti  / ap pūraṇīpramāṇyoḥ (*5,4.116) ity
    atra api pradhānapūraṇīgrahaṇam eva ity appratyayo na bhavati  / apriyādiṣu iti
    kim ? kalyāṇīpriyaḥ  / priyā  / manojñā  / kalyāṇī  / subhagā  / durbhagā  / bhakti  /
    sacivā  / ambā  / kāntā  / kṣāntā  / samā  / capalā  / duhitā  / vāmā  / priyādiḥ  /
    dṛḍhabhaktiḥ ity evam ādiṣu strīpūrvapadasya avivakṣitvāt siddham iti samādheyam
    //
