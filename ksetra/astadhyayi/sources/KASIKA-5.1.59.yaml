source_id: KASIKA-5.1.59
locator:
  sutra: 5.1.59
witness_text:
  sutra: paṅkti-viṃśati-triṃśac-catvāriṃśat-pañcāśat-ṣaṣṭi-saptaty-aśīti-navati-śatam
  commentary: tad asya parimāṇam (*5,1.47) iti vartate  / paṅktyādayaḥ śabdā nipātyante  /
    yad iha lakṣaṇena anupapannaṃ tat sarvaṃ nipātanāt siddham  / pañcānā ṭilopaḥ
    tiś ca pratyayaḥ  / pañca parimāṇam asya paṅktiś chandaḥ  / dvayor daśatoḥ vinbhāvaḥ
    śatiś ca pratyayaḥ dvau daśatau praimāṇam asya saṅghasya viṃśatiḥ  / trayāṇāṃ
    daśatāṃ trinbhāvaḥ śat ca pratyayaḥ  / trayo daśataḥ parimāṇam asya triṃśat  /
    caturṇāṃ daśatāṃ catvārinbhāvaḥ śat ca pratyayaḥ  / catvāro daśataḥ parimāaṇasya
    catvāriṃśat  / pañcānāṃ daśatāṃ pañcābhāvaḥ śat ca pratyayaḥ  / pañca daśataḥ
    parimāṇām asya pañcāśat  / ṣaṇṇāṃ daśatāṃ ṣaḍbhāvaḥ, tiḥ pratyayo 'padatvaṃ ca  /
    ṣaṅ daśataḥ parimāṇam asya ṣaṣṭiḥ  / saptānāṃ daśatāṃ saptabhāvaḥ tiḥ pratyayaś
    ca  / sapta daśataḥ parimāṇam asya saptatiḥ  / [#481] aṣṭānāṃ daśatām aśībhāvaḥ
    tiḥ pratyayaś ca  / [#480] aṣṭau daśataḥ parimāṇam asya aśītiḥ  / navānāṃ daśatāṃ
    navabhāvaḥ tiḥ pratyayaś ca  / nava daśataḥ parimāṇam asya navatiḥ  / daśanāṃ
    daśatāṃ śabhāvaḥ taś ca pratyayaḥ  / daśa daśataḥ parimāṇam asya saṅghasya śatam  /
    viṃśatyādayo guṇa-śabdāḥ, te yathā kathaṃcid vyutpādyāḥ  / na atra avayavārthe
    'bhiniveṣṭavyam  / tathā hi - paṅktiḥ iti kramasamniveśe 'pi vartate, brāhmaṇapaṅktiḥ,
    papīlikāpaṅktiḥ iti  / na ca atra avayavārthaḥ kaścid asti  / yā ca+eṣāṃ viṣayabhedena
    guṇa-mātre guṇini ca vṛttiḥ, svaliṅga-saṅkhya-anuvidhānaṃ ca, etad api sarvaṃ
    svābhāvikam eva  / sahasrādayo 'py evaṃ jātiyakāḥ tadvad eva draṣṭavyāḥ  / udāharaṇamātram
    etad iti // [#481]
