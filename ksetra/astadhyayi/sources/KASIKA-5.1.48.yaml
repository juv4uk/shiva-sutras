witness_text:
  sutra: pūraṇa-ardhāṭ ṭhan
  commentary: pūraṇa-vācinaḥ śabdāt ardha-śabdāc ca ṭhan pratyayo bhavati tad asmin
    vṛddhy-āya. lābhaśulka-upadā dīyate (*5,1.47) ity etasminn arthe  / yathāyathaṃ
    ṭhakṭiṭhanor apavādaḥ  / dvitīyo vṛddhyādir asmin dīyate dvitīyikaḥ  / tṛtīyikaḥ  /
    pañcamikaḥ  / saptamikaḥ  / ardhikaḥ  / ardha-śabdo rupakārdhasya rūḍhiḥ //
