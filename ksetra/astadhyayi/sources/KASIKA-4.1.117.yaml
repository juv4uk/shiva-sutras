locator:
  sutra: 4.1.117
witness_text:
  sutra: vikarṇa-śuṅga-chaṅgalād vatsa-bharadvāja-atriṣu
  commentary: vikarṇ-aśuṅga-chaṅgala-śabdebhyaḥ yathāsaṅkhyaṃ vatsabharadvājātriṣu
    apatya-viśeṣeṣu aṇ pratyayo bhavati  / vaikarṇo bhavati vātsyaś cet  / vaikarṇiḥ
    anyaḥ  / śauṅgo bhavati bhāradvājaś cet  / śauṅgiḥ anyaḥ  / chāgalo bhavati ātreyaś
    cet  / chāgaliḥ anyaḥ  / śuṅgā-śabdaṃ strīliṅga-manye paṭhanti, tato ḍhakaṃ pratyudāharanti
    śauṅgeyaḥ iti  / dvayam api ca+etat pramāṇam, ubhayathā sūtra-praṇayanāt //
