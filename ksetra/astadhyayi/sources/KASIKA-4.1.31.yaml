source_id: KASIKA-4.1.31
locator:
  sutra: 4.1.31
witness_text:
  sutra: rātreś ca ajasau
  commentary: jasviṣayādanyatra sañjñāyāṃ chandasi ca rātri-śabdāt ṅīp pratyayo bhavati  /
    yā ca rātrī sṛṣṭā  / rātrībhiḥ  / ajasau iti kim ? yāstā rātrayaḥ  / ajasādiṣv
    iti vaktavyam  / rātriṃ sahoṣitvā  / kathaṃ timirapaṭalairavaguṇṭhitāś ca ratryaḥ
    ? ṅīṣayaṃ bahvādi-lakṣaṇaḥ  / tatra hi paṭhyate kṛdikārādaktinaḥ, sarvato 'ktinn-arthāt
    ity eke iti // [#326]
