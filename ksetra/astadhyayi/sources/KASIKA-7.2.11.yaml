source_id: KASIKA-7.2.11
locator:
  sutra: 7.2.11
witness_text:
  sutra: śry-ukaḥ kiti
  commentary: śri ity etasya ugantānāṃ ca kiti pratyaye parataḥ iḍāgamo na bhavati  /
    śri - śritvā  / śritaḥ  / śritavān  / ugantānāṃ ca-yutvā  / yutaḥ  / yutavān  /
    lūtvā  / lūnaḥ  / lūnavān  / vṛtvā  / vṛtaḥ  / vṛtavān  / tīrtvā  / vīrṇaḥ  /
    tīrṇavān  / śryukaḥ iti kim ? viditaḥ  / kiti iti kim ? śrayitā  / śrayitum  /
    śrayitavyam  / kecid atra dvikakāranirdeśena gakārapraśleṣaṃ varnayanti, bhūṣṇuḥ
    ity evaṃ yathā syāt  / sautratvāc ca nirdeśasya śryukaḥ kiti ity atra cartvasya
    asiddhatvamanāśritya rorutvaṃ na kṛtam visarjanīyaś ca kṛtaḥ iti  / glājisthaś
    ca kṣnuḥ (*3,2.139) ity atra sthā ā ity ākārapraśleṣeṇa sthāsnoḥ siddhatvān na
    kiṃcid etat  / upadeśe ity eva, tīrṇa ity atra api yathā syāt  / itve hi kṛte
    raparatve cana syāt  / mā bhūd evam  / iṭ sani vā (*7,2.41) iti vikalpe vihite
    yasya vibhāṣā (*7,2.15) iti niṣṭhāyāṃ pratiṣedho bhaviṣyati ? kasya punaḥ sā vibhāṣā
    ? ṝtaḥ  / yady evam itve hi kṛte na ayam ṝkarānto bhaviṣyati ? sthānivadbhāvād
    bhaviṣyati  / analvidhau sthānivadbhāvaḥ, alvidhiścāyam ? tasmād anuvartayitavyam
    upadeśe iti  / tathā ca sati jāgaritaḥ, jāgaritavān ity atra api prāpnoti, tad
    artham ekācaḥ ity anuvartayitavyam  / ūrṇotestu - vācya ūrṇorṇuvadbhāvo yaṅprasiddhiḥ
    prayojanam  / āmaśca pratiṣedhārtham ekācaśceḍupagrahāt // prorṇutaḥ  / prorṇutavān
    // [#803]
