source_id: KASIKA-3.1.13
locator:
  sutra: 3.1.13
witness_text:
  sutra: lohitādi-ḍājbhyaḥ kyaṣ
  commentary: lohitādibhyo ḍājantebhyaś ca bhavaty arthe kyaṣ pratyayo bhavati  /
    lohitāyati, lohitayate  / ḍājantebhyaḥ - paṭapaṭāyati, paṭapaṭāyate  / lohitaḍājbhyaḥ
    kyaṣ vacanam, bhṛśādiṣvitarāṇi  / yāni lohitādiṣu paṭhyante tebhyaḥ kyaṅ eva,
    aparipaṭhitebhyas tu kyaṣ eva bhavati  / varmāyati, varmāyate  / nidrayati, nidrāyate  /
    karuṇāyati, karuṇāyate  / kṛpāyati, kṛpāyate  / ākṛtigaṇo 'yam  / yathā ca kakāraḥ
    sāmānyagrahaṇārtho 'nubadhyate naḥ kye (*1,4.15) iti  / na hi paṭhitānāṃ madhye
    nakārāntaḥ śabdo 'sti  / kṛbhvastibhir iva kyaṣā 'pi yoge ḍāj bhavati ity etad
    eva vacanam jñāpakam  / acveḥ ity anuvṛtter abhūta-tadbhāve kyaṣ vijñāyate  /
    lohita  / nīla  / harita  / pīta  / madra  / phena  / manda  / lohitādiḥ //
