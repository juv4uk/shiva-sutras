source_id: KASIKA-8.2.72
locator:
  sutra: 8.2.72
witness_text:
  sutra: vasu-sraṃsu-dhvaṃsv-anaḍuhāṃ daḥ
  commentary: sasajuṣo ruḥ (*8,2.66) ity ataḥ saḥ iti vartate, tena sambhavāt vyabhicārāc
    ca vasur eva viśeṣyate, na sraṃsudhvaṃsū, vyabhicārābhāvāt, asambhavāc ca na anaḍuh,
    śabdaḥ  / vasvantasya padasya sakārāntasya sraṃsu, dhvaṃsu, anaḍuḥ ity eteṣāṃ
    ca dakārādeśo bhavati  / vasu - vidvadbhyām  / vidvadbhiḥ  / papivadbhyām  / papivadbhiḥ  /
    sraṃsu - uravāsradbhyām  / uravāsradbhiḥ  / dhvaṃsu - parṇadhvadbhyām  / parṇadhvadbhiḥ  /
    anaḍuḥ - anaḍudbhyām  / anaḍudbhiḥ  / saḥ ity eva, vidvān  / papivān  / nakārasya
    na bhavati  / rutve nāprāpte idam ārabhyate iti tad bādhyate  / saṃyogāntalopas
    tu na+evam iti tena etad eva datvaṃ bādhyate  / anaḍuho 'pi ḍhatvam anena bādhyate  /
    numastu vidhānasāmarthyānna bhavati, anaḍvān, he anaḍvan iti  / padasya ity eva,
    vidvāṃsau  / vidvāṃsaḥ //
