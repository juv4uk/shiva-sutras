source_id: KASIKA-2.1.37
locator:
  sutra: 2.1.37
witness_text:
  sutra: pañcamī bhayena
  commentary: sup supā iti vartate  / tasya viśeṣaṇam etat  / pañcamyantaṃ subanataṃ
    bhaya-śabdena  / subantena saha samasyate vibhāṣā, tatpuruṣaś ca samāso bhavati  /
    vṛkebyo bhayaṃ vṛkabhayam  / caurabhayam  / dasyubhayam  / bhaya-bhīta-bhīti-bhībhir
    iti vaktavyam  / vṛkebhyo bhītaḥ vṛkabhītaḥ  / vṛkabhītiḥ  / vṛkabhīḥ  / pūrvasya+eva
    ayaṃ bahulagrahaṇasya prapñcaḥ  / tathā ca grāmanirgataḥ, adharmajugupsuḥ ity
    evam ādi siddhaṃ bhavati //
