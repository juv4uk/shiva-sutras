source_id: KASIKA-1.2.37
locator:
  sutra: 1.2.37
witness_text:
  sutra: na subrahmaṇyāyāṃ svaritasya tu udāttaḥ
  commentary: subrahmaṇyā nāma nigadas tatra yajña-karmaṇi iti vibhāṣā chandasi (*1,2.36)
    iti ca ekaśrutiḥ prāptā pratiṣidyate  / subrahmaṇyāyām ekaśrutir na bhavati  /
    yas tu lakṣaṇa-prāptaḥ svaritas tasya-udātta ādeśo bhavati  / subrahmanyom  /
    indrāgaccha, hariva āgaccha, medhātithermeṣa vṛṣaṇaśvasya mene  / gaurāva-skandinnahalyāyai
    jāra kauśikabrāhmaṇa gautamabruvāṇa śvaḥ sutyāmāgaccha maghavan  / atra subrahmaṇyom
    ity okāras titsvareṇa svaritas tasya-udātto vidhīyate  / indra āgaccha ity āmantritam
    ādy-udattam  / dvitīyo varṇo 'nudāttaḥ  / udāttād anudātasya svaritaḥ iti svaritaḥ
    prasaktas tasya anena-udāttaḥ triyate  / tad evam indra āgaccha iti catvāra udāttāḥ  /
    paścima eko 'nudāttaḥ  / hariva āgaccha ityanayaiva prakriyayā catvāra udāttāḥ
    dvāv anudāttau  / medhātitheḥ iti ṣaṣṭyantaṃ parama-amantritam anupraviśati subāmantrite
    parāṅgavatsvare (*2,1.2) iti  / tataḥ sakalasyā mantritādy-udāttatve iṛte dvitīyam
    akṣaram anudāttaṃ, tasya udāttād anudāttasya svaritaḥ (*8,4.66) iti svaritatve
    prāpte idam-udāttatvaṃ vidhīyate  / tena dvāvapy-udāttau bhavataḥ  / [#41] śeṣaman-udāttam  /
    vṛṣaṇaśvasya mene iti samānaṃ pūrveṇa  / gaurāvaskandin iti tatha-iva dve ādye
    akṣare udātte, śeṣam anudāttam  / ahalyāyai jāra iti subantasya amantrita-anupraveśāt
    t advadeva svaraḥ  / dvāv udāttau śeṣam anudāttam  / kauśikabrahmaṇa iti samastamāmantritamādy-udāttaṃ
    tatra pūrvavad dvāv udāttau śeṣam anudāttam  / evam gautama-bruvāṇa iti dvāv udāttau
    śeṣam anudāttām  / śvaḥ sutyāmāgaccha maghavan iti śvaḥ-śabda udāttaḥ sutyām ity
    antodāttaḥ  / sañjñāyāṃ samajaniṣadanipatamanavidaṣuñ śīṅbhṛñiṇaḥ (*3,3.99) iti
    kyapo vidhāne udāttaḥ iti vartate  / agaccha iti dva-udāttau  / antyo 'nudattaḥ  /
    maghavan iti padāt paramāmantritaṃ nihanyate //
