source_id: KASIKA-1.4.61
locator:
  sutra: 1.4.61
witness_text:
  sutra: ūry-ādi-cvi-ḍācaś ca
  commentary: ūry-ādayaḥ śabdāḥ cvy-antā ḍaj-antāś ca kriyā-yoge gati-sañjñā bhavanti  /
    cvi-ḍācoḥ kṛbhvastiyoge vidhanam  / tat-sāhacaryād ūry-ādīnām api tair eva yoge
    gati-sañjñā vidhīyate  / ūrī-urarī-śabdāv aṅgīkarane vistāre ca  / ūrīkṛtya  /
    ūrīkṛtam  / yadurīkaroti  / urarīkṛtya  / [#90] urarīkṛtam  / yadurarīkaroti  /
    pāpī  / tālī  / āttālī  / vetālī  / dhūsī  / śakalā  / saṃśaklā  / dhvaṃsakalā  /
    bhraṃśakalā  / ete śakalādayo hiṃsāyam  / śakalākṛtya  / saṃśakalākṛtya  / dhvaṃsakalākṛtya  /
    bhraṃśakalākṛtya  / gulugudha pīḍa-arthe - gulugudhākṛtya  / sujūḥsaha-arthe -
    sajūḥkṛtya  / phalū, phalī, viklī, āklī iti vikāre - phalū kṛtya  / phalī kṛtya  /
    viklī kṛtya  / ālooṣṭī  / karalī  / kevālī  / śevālī  / varṣālī  / masmasā  /
    masamasā  / ete hiṃsāyām  / vaṣaṭ  / vauṣaṭ  / śrauṣaṭ  / svāhā  / svadhā  / vandhā  /
    prādus  / śrut  / āvis  / cvy-antāḥ khalv api -- śuklīkṛtya  / śuklīkṛtam  / yacchuklīkaroti  /
    ḍāc -- paṭapaṭākrṛtya  / paṭapaṭākṛtam  / yatpaṭapaṭakaroti //
