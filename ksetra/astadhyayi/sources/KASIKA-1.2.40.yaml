source_id: KASIKA-1.2.40
locator:
  sutra: 1.2.40
witness_text:
  sutra: udātta-svarita-parasya sannataraḥ
  commentary: anudātta-grahaṇam anuvartate  / udāttaḥ paro yasmāt sa udāttaparaḥ svaritaḥ
    paro yasmāt sa svaritaparaḥ  / udāttaparasya svaritaparasya ca anudāttasya sannatara
    ādeśo bhavati  / anudāttataraḥ ity arthaḥ  / devā marutaḥ pṛśnimātaro 'paḥ  /
    mātaraḥ ity anudāttaḥ  / apaḥ ity anta-udāttaḥ ūḍ-idaṃ-pad-ādy-ap-pum-rai-dyubhyaḥ
    (*6,1.171) iti  / tatra anudāttayor ekādeśa okāro 'nudāttaḥ tasya-udātte parabhūte
    sannatara ādeśo bhavati  / imaṃ me gaṅge yamune sarasvati śutudri  / ikāro 'nudāttaḥ  /
    śutudri ity etad āmantritaṃ pādādau tasmān na nihanyate, anudāttaṃ sarvam apādādau
    (*8,1.18) iti  / [#42] tasya prathamam akṣaram udāttaṃ tasmin parabhūte pūrvasya
    sarasvati iti ikārasya sannatara ādeśo bhavati  / māṇavaka jaṭilakādyāpaka kva
    gamiṣyasi  / kva iti svaritas tasmin parabhūte ka iti anudattas tasya sannatara
    ādeśo bhavati //
