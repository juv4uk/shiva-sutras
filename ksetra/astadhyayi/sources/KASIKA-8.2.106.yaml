locator:
  sutra: 8.2.106
witness_text:
  sutra: plutāv aica idutau
  commentary: dūrāddhūtādiṣu pluto vihitaḥ  / tatra aicaḥ plutaprasaṅge tadavayavabhūtau
    idutau plutau  / ai3tikāyana  / au3pamanyava  / atra yadevarṇovarṇayoḥ avarṇasya
    ca saṃvibhāgaḥ, tadā idutau dvimātrāvanena plutau kriyete  / plutau iti hi kriyānimitto
    'yaṃ vyapadeśaḥ  / idutau plavete vṛddhiṃ gacchataḥ ity arthaḥ  / tāvatī ca sā
    plutir bhavati yayā tāvecau trimātrau sampadyete  / yadā tu ardhamātrā avarṇasya
    adhyardhamātrā ivarṇovarṇayoḥ, tadā tau ardhatṛtīyamātrau kriyete iti  / bhaṣye
    tu uktam, iṣyate eva caturmātraḥ plutaḥ iti  / tat katham ? samapravibhāgapakṣe
    idutor anena trimātraḥ pluto vidhīyate //
