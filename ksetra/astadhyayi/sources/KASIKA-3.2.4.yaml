locator:
  sutra: 3.2.4
witness_text:
  sutra: supi sthaḥ
  commentary: subante upapade tiṣṭhateḥ kapratyayo bhavati  / samasthaḥ  / viṣamasthaḥ  /
    atra yogavibhāgaḥ kartavyaḥ supi iti  / supi ākārāntebhyaḥ kapratyayo bhavati  /
    dvābhyām pibati iti dvipaḥ  / pādapaḥ  / kacchapaḥ  / tataḥ sthaḥ iti  / sthaś
    ca supi kapratyayo bhavati  / kimartham idam ? kartari pūrvayogaḥ  / anena bhāve
    'pi yathā syāt  / ākhūnām utthānam ākhūtthaḥ  / śalabhotthaḥ  / iti uttaraṃ karmaṇi
    iti ca supi iti ca dvayam apy anuavartate  / tatra sakarmakeṣu dhātuṣu krmaṇi
    ity etad upatiṣṭhate  / anyatra supi iti // [#212]
