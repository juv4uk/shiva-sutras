locator:
  sutra: 1.4.55
witness_text:
  sutra: tat-prayojako hetuś ca
  commentary: tat iti anantaraḥ kartā parāmṛśyate  / tasya prayojakas tat-prayojakaḥ  /
    nipātanāt samāsaḥ  / svatantrasya prayojako yo 'rthaḥ, tat-kārakaṃ hetu-sañjñaṃ
    bhavati  / cakārāt kartṛ-sañjñaṃ ca  / sañjñāsamāveśa-arthaś-cakāraḥ  / kurvāṇaṃ
    prayuṅkte, kārayati  / hārayati  / hetutvad ṇico nimittaṃ kartṛtvāc ca kartṛ-pratyayena+ucyate  /
    hetu-pradeśāḥ - hetumati ca (*3,1.26) ity evam adayaḥ //
