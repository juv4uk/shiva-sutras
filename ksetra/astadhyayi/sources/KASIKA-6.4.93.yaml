source_id: KASIKA-6.4.93
locator:
  sutra: 6.4.93
witness_text:
  sutra: ciṇ-ṇamulor dīrgho 'nyatarasyām
  commentary: ciṇpare ṇamulpare ca ṇau parataḥ mitām aṅgānām upadhāyāḥ dīrgho bhavati
    anyatarasyāṃ  / aśami, aśāmi  / atami, atāmi  / śamaṃśamam, śāmaṃśāmam  / tamantamam,
    tāmantāmam  / dīrghagrahaṇaṃ kiṃ, na hrasvavikalpa eva vidhīyate ? na+evaṃ śakyam,
    śamayantaṃ prayuṅkte iti dvitīye ṇici hrasvavikalpo na syāt  / ṇilopasya sthānivadbhāvād
    dīrghavidhau tvajādeśo na sthānivat  / śayamantaṃ prayuktavān  / aśami, aśāmi  /
    śamaṃśamam, śāmaṃśāmam  / śaṃśamayateḥ - aśaṃśami, aśaṃśāmi  / śaṃśamaṃśaṃśamam,
    śaṃśāmaṃśaṃśāmam  / yo 'sau ṇau ṇirlupyate, yaś ca yaṅkāraḥ, tayor dirghavidhau
    ādeśo na sthānivad bhavati iti asthānivadbhāvāt dīrghaḥ siddho bhavati  / hrasvavikalpe
    tu vidhīyamāne sthānivadbhāvaḥ syāt  / ṇiṇyante yaṅṇyante tv asiddhireva  / vyāśrayatvād
    asiddhatvam api na asti  / ṇau hi ṇiyaṅor lopaḥ, ciṇṇamulpare ṇāvaṅgasya dīrghatvam
    //
