source_id: KASIKA-4.1.99
locator:
  sutra: 4.1.99
witness_text:
  sutra: naḍādibhyaḥ phak
  commentary: naḍ ity evam ādibhyaḥ prātipadikebhyaḥ gotrāpatye phak pratyayo bhavati  /
    nāḍāyanaḥ  / cārāyaṇaḥ  / gotre ity eva, nāḍiḥ  / śalaṅku śalaṅkaṃ ca ity atra
    paṭhyate  / śālaṅkāyanaḥ  / pailādiṣu śālaṅki-śabdaḥ paṭhyate  / śālaṅkiḥ pitā  /
    śālaṅkiḥ putraḥ  / tat katham ? gotra-viśeṣe kauśike phakaṃ smaranti, iñ eva anyatra
    śālaṅkiḥ iti  / athavā pailādipāṭha eva jñāpakaḥ iño bhāvasya  / naḍa  / cara  /
    baka  / muñja  / itika  / itiśa  / upaka  / lamaka  / śalaṅku śalaṅkaṃ ca  / saptala  /
    vājapya  / tika  / agniśarman vṛśagaṇe  / prāṇa  / nara  / sāyaka  / dāsa  / mitra  /
    dvīpa  / piṅgara  / piṅgala  / kiṅkara  / kiṅkala  / kātara  / kātala  / kāśya  /
    kāśyapa  / kāvya  / aja  / amuṣya  / kṛṣṇaraṇau brāhmaṇavāsiṣṭhayoḥ  / amitra  /
    ligu  / citra  / kumāra  / kroṣṭu kroṣṭaṃ ca  / loha  / durga  / stambha  / śiṃśipā  /
    agra  / tṛṇa  / śakaṭa  / sumanas  / sumata  / mimata  / ṛk  / jat  / yugandhara  /
    haṃsaka  / daṇḍin  / hastin  / pañcāla  / camasin  / sukṛtya  / sthiraka  / brāhmaṇa  /
    caṭaka  / badara  / aśvaka  / kharapa  / kāmuka  / vrahmadatta  / udumbara  /
    śoṇa  / aloha  / daṇḍa //
