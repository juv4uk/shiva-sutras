source_id: KASIKA-1.3.86
locator:
  sutra: 1.3.86
witness_text:
  sutra: budha-yudha-naśa-jana-iṅ-pru-dru-srubhyo ṇeḥ
  commentary: ṇicaś ca (*1,3.74) iti kartr-abhiprāya-triyāphala-vivakṣāyām ātmanepade
    prāpte parasmaipadaṃ vidhīyate  / budha yudha naśa jana iṅ pru dru sru ity etebhyo
    ṇyantemyaḥ parasmaipadam bhavati  / bodhyati  / yodhyati  / nāśayati  / janayati  /
    adhyāpayati  / prāvayati  / drāvayati  / sravayati  / [#72] ye 'tra-akarmakās
    teṣām aṇāv-akarmakāc cittavat-kartṛkāt (*1,3.88) ity evaṃ siddhe vacanam idam
    acittavat-kartṛka-artham  / bodhyati padmam  / yodhyanti kāṣṭhāni  / nāśayati
    duḥkham  / janayati sukham  / ye 'tra calana-artha api teṣām nigaraṇa-calana-arthebhyaś
    ca (*1,3.87) iti siddhe yadā na calana-arthās tad-arthaṃ vacanam  / pravate  /
    prāpnoti iti gamyate  / ayo dravati  / vilīyate ity arthaḥ kuṇḍikā sravati  /
    syandate ity arthaḥ  / tad-viṣayāṇy udāharaṇāni { - prāvayati  / drāvayati  /
    srāvayati} //
