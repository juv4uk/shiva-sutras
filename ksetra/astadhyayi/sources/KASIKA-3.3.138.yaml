source_id: KASIKA-3.3.138
locator:
  sutra: 3.3.138
witness_text:
  sutra: parasmin vibhāṣā
  commentary: bhaviṣyati maryādā-vacane kālavibhāge ca anahorātrāṇām iti sarvam anuvartate  /
    kālamaryādāvibhāge sati bhavisyati kāle parasmin pravibhāge vibhāṣā anadyatanavat
    pratyayavidhir na bhavati, na ced aho-rātra-sambandhī pravibhāgaḥ  / avarasmin
    varjaṃ pūrvam anuvartate  / avarasmin pūrveṇa pratiṣedha uktaḥ, samprati parasminn
    aprāpta eva vikalpa ucyate  / yo 'yaṃ saṃvatsara āgāmī, tasya yat paramāgrahāyaṇyāḥ
    tatra yuktā adhyeṣyāmahe, adhyetāsmahe, tatra saktūn pāsyāmaḥ, tatra saktūn pātāsmaḥ  /
    anahorātrāṇām ity eva  / yo 'yaṃ triṃśadrātra āgāmī, tasya yaḥ paraḥ pañcadaśa-rātraḥ,
    tatra yuktā adhyetāsmahe, tatra saktūn pātāsmaḥ  / bhaviṣyati ity eva  / yo 'yaṃ
    saṃvatsaro 'tītaḥ, tasya yat paramāgrahāyaṇyāḥ, tatra yuktā adhyaimahi, tatraudanamabhuñjmahi  /
    maryādāvacane ity eva  / yo 'yaṃ  saṃvatsaro niravadhikaḥ kāla agāmī, tasya yat
    pramāgrahāyaṇyāḥ, tatra yuktā adhyetāsmahe, tatra saktūn pātāsmaḥ  / kāla-vibhāge
    ity eva  / yo 'yamadhvā gantavya āpāṭaliputrāt, tasya yat paraṃ kauśāmbyāḥ, tatra
    yuktā adhyetāsmahe, odanaṃ bhoktāsmahe  / iti sarvatra anadyatanavat pratyayā
    udāhāryāḥ //
