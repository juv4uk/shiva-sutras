source_id: KASIKA-1.3.89
locator:
  sutra: 1.3.89
witness_text:
  sutra: na pādamy-āṅyama-āṅyasa-parimuha-ruci-nṛti-vada-vasaḥ
  commentary: pūrveṇa yogadvayena kartrabhipraya-kriyāphala-vivakṣāyām ātmanepada-apavādaḥ
    parasmaipadaṃ vihitam  / tasya pratiṣedho 'yam-ucyate  / yat kartrabhiprāya-viṣayam
    ātmanepadaṃ tad-avasthitam eva, na pratiṣidhyate  / pā dami aṅyama āṅyasa parimuha
    ruci nṛti vada vasa ity etebhyo ṇy-antebhyaḥ parasmaipadaṃ na bhavati  / [#73]
    ṇicaś ca (*1,3.74) ity ātmanepadaṃ bhavati  / tatra pivatir nigaraṇa-arthaḥ  /
    damiprabhṛtayaścittavatkartṛkāḥ  / nṛtiś calana-artho 'pi  / eṣāṃ parasmaipadaṃ
    na bhavati  / pā - pāyayate  / dami - damayate  / āṅyam - āyāmayate  / yamo 'pariveṣaṇe
    iti mitsañjñā pratiṣidhyate  / aṅyasa - āyāsayate  / parimuha - parimohayate  /
    ruci - rocayate  / nṛti - nartayate  / vada - vādayate  / vasa - vāsayate  / pādiṣu
    dheṭa upasaṅkhyānam  / dhāpayete śiśumekaṃ samīcī //
