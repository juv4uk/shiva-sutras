source_id: KASIKA-5.2.56
locator:
  sutra: 5.2.56
witness_text:
  sutra: viṃśaty-ādibhyas tamaḍ anyatarasyām
  commentary: viṃśaty-ādibhyaḥ parasya ḍaṭaḥ tamaḍāgamo bhavaty anyatarasayām  / pūraṇādhikārāt
    ḍaṭpratyaya āgamī vijñāyate  / viṃśateḥ pūraṇaḥ viṃśatitamaḥ, viṃśaḥ  / ekaviṃśatitamaḥ,
    ekaviṃśaḥ  / triviṃśatitamaḥ, triviṃśaḥ  / triṃśattamaḥ, triṃśaḥ  / ekatriṃśattamaḥ,
    ekatriṃśaḥ  / viṃśatyādayo laukikāḥ saṅkhyāśabdā gṛhyante, na paṅktyādi-sūtra-saṃniviṣṭāḥ  /
    tadgrahaṇe hy ekaviṃśatiprabhuṛtibhyo na syāt  / grahaṇavatā prātipadikena tadantavidhipratiṣedhāt  /
    evaṃ ca sati ṣaṣṭyādeś ca asaṅkhyādeḥ (*5,2.58) iti paryudāsoyujyata eva //
