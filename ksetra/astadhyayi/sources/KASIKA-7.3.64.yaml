locator:
  sutra: 7.3.64
witness_text:
  sutra: oka ucaḥ ke
  commentary: ucer dhātoḥ ke pratyaye okaḥ iti nipātyate  / kim punar atra nipātyate
    ? kutvaṃ guṇaś ca  / nyokaḥ śakunataḥ  / nyoko gṛham  / kartari igupadhalakṣaṇaḥ
    kaḥ pratyayaḥ  / adhikaraṇādau tu kārakāntare ghañarthe kavidhānam iti  / kim
    arthaṃ punar ayaṃ ghañyeva na vyutpadyate ? svarārtham antodātto 'yam iṣyate,
    ghañi sati ādyudāttaḥ syāt  / divaukasaḥ, jalaukasaḥ ity evam ādāv apy asuni pratyaye
    uṇādayo bahulam (*3,3.1) iti kutvaṃ draṣṭavyam //
