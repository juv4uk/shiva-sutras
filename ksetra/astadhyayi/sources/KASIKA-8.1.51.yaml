source_id: KASIKA-8.1.51
locator:
  sutra: 8.1.51
witness_text:
  sutra: gatyartha-loṭā lṛṇ na cet kārakaṃ sarvānyat
  commentary: gaminā samānārthā gatyarthāḥ  / gatyarthānāṃ loṭ gatyarthaloṭ  / tena
    gatyarthaloṭā yuktaṃ lṛḍantaṃ tiṅantaṃ nānudāttaṃ bhavati, na cet kārakam sarvānyad
    bhavati  / yatra+eva kārake kartari karmaṇi vā loṭ, tatra+eva yadi lṛḍ api bhavati
    ity arthaḥ  / kartṛkarmaṇī eva atra tiṅantavācye kārakagrahaṇena gṛhyete, na karaṇādi
    kārakāntaram  / āgaccha devadatta grāmam, drakṣyasi enam  / āgaccha devadatta
    grāmam, odanaṃ bhokṣyase  / uhyantāṃ devadattena śālayaḥ, tena+eva bhokṣyante  /
    uhyantāṃ devadattena śālayaḥ, yajñadattena bhokṣyante  / gatyarthagrahaṇaṃ kim
    ? paca devadatta odanam, bhokṣyase enam  / loṭā iti kim ? āgaccheḥ devdatta grāmam,
    drakṣyasi enam  / lṛṭ iti kim ? āgaccha devadatta grāmam, paśyasi enam  / na cet
    kārakam sarvānyat iti kim ? āgaccha devadatta grāmam, pitā te odanaṃ bhokṣyate  /
    [#897] uhyantāṃ devadattena śālayaḥ, saktavaḥ tena pāsyante  / sarvagrahaṇam kim
    ? āgaccha devadatta grāmam, tvaṃ cāhaṃ ca drakṣyāvaḥ enam ity atra api nighātapratiṣedho
    yathā syāt  / lṛḍantavācye hi sarvasmin kārake anyasmin na bhavitavyam, iha tu
    yat loḍantasya kārakaṃ taccānyacca lṛḍantena ucyate iti //
