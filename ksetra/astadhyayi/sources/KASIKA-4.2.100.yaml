source_id: KASIKA-4.2.100
locator:
  sutra: 4.2.100
witness_text:
  sutra: raṅkor amanuṣye 'ṇ ca
  commentary: raṅku-śabdād aṇ pratyayo bhavati, cakārāt ṣphak ca śaiṣiko 'manusye
    'bhidheye  / rāṅkavo gauḥ, rāṅkavāyaṇo gauḥ  / amanusye iti kim ? rāṅkavako manusyaḥ  /
    nanu ca raṅku-śabdaḥ kacchādiṣu paṭhyate, tatra ca manuṣya-tasthayor vuñ (*4,2.134)
    iti manusye paratvād vuñaiva bhavitavyaṃ, kacchādipāṭhādamanusye aṇ api siddhaḥ,
    kim iha manusya-pratiṣedhena aṇgrahanena ca ? tad ucyate, na+eva ayam manusyapratiṣedhaḥ,
    kiṃ tarhi, nañivayaktanyāyena manusyasadṛśe prāṇini pratipattiḥ kriyate  / tena
    rāṅkavaḥ kambalaḥ iti ṣphak na bhavati  / viśeṣavihitena ca ṣphakā aṇo bādhā mā
    bhūt ity aṇ-grahaṇam api kriyate //
