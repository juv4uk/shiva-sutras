source_id: KASIKA-7.2.98
locator:
  sutra: 7.2.98
witness_text:
  sutra: pratyaya-uttarapadayoś ca
  commentary: ekavacane ity anuvartate  / pratyaye uttarapade ca parata ekavacane
    vartamānayoḥ yusmadasmador maparyantasya tva ma ity etāv ādeśau bhavataḥ  / tavāyaṃ
    tvadīyaḥ  / madīyaḥ  / atiśayena tvam tvattaraḥ  / mattaraḥ  / tvām icchati tvadyati  /
    madyati  / tvamivācarati tvadyate  / madyate  / uttarapade - tava putraḥ tvatputraḥ  /
    matputraḥ  / tvaṃ nātho 'sya tvannāthaḥ  / mannathaḥ  / ekavacane ity eva, yuṣmākamidam
    yuṣmadīyam  / asmadīyam  / yuṣmākaṃ putraḥ, asmākaṃ putraḥ yuṣmatputraḥ, asmatputraḥ  /
    vibhaktau ity adhikārāt pūrvayogo vibhaktāv eva  / tato 'nyatra api pratyaye uttarapade
    ca yathā syāt ity ayam ārambhaḥ  / nanu cātrāpyantarvartinī vibhaktir asti, tasyām
    eva ādeśau bhavisyataḥ ? na+evaṃ śakyam, lukā tasyā bhavitavyam  / bahiraṅgo luk,
    antaraṅgau ādeśau, prathamaṃ tau bhaviṣyataḥ ? etad eva tarhi ādeśavacanaṃ jñāpakam
    antaraṅgān api vidhīn bahiraṅgo 'pi luk bādhate iti  / tena gomān priyo 'sya gomatpriyaḥ
    ity evam ādau numādi lukā bādhyate  / evaṃ ca sati tvāhau sau (*7,2.94) ity evam
    ādayo 'pi pratyayottarpadayor ādeśā na bhavanti  / tvaṃ pradhānam eṣāṃ tvatpradhānāḥ  /
    matpradhānāḥ  / yūyaṃ putrā asya yuṣmatputraḥ  / asmatputraḥ tubhyaṃ hitaṃ tvaddhitam  /
    maddhitam  / tava putraḥ tvatputraḥ  / matputraḥ  / atha kimarthm eṣāṃ tvāhādīnāṃ
    bādhanārtham etan na vijñāyate ? lakṣyasthityapekṣayā  / jñāpkārthe hy etasmin
    bahutaramiṣṭaṃ saṅgṛhyate //
