source_id: KASIKA-7.2.101
locator:
  sutra: 7.2.101
witness_text:
  sutra: jarāyā jaras anyatarasyām
  commentary: jarā ity etasya jaras ity ayam ādeśo bhavati anyatrasyām ajādau vibhaktau
    parataḥ  / jarasā dantāḥ śīryante, jarayā dantāḥ śīryante  / jarase tvā paridadyuḥ,
    jarāyai tvā paridadyuḥ  / aci ity eva, jarābhyām  / jarābhiḥ  / numo vidhānāt
    jarasādeśo bhavati vipratiṣedhena  / atijarāṃsi brāhmaṇakulāni  / iha atijarasaṃ
    brāhmaṇakulaṃ paśya iti lug na bhavati, ānupūrvyā siddhatvat  / atijara am iti
    sthite luk, ambhāvaḥ, jarasbhāvaḥ iti trīṇi kāryāṇi yugapat prāpnuvanti  / tatra
    luk tāvadapavādatvād ambhāvena bādhyate, ambhāvo 'pi paratvāj jarasādeśena  /
    na ca punar lukśāstraṃ pravartate, bhraṣṭāvasaratvāt, iti evam eva bhavati atijarasaṃ
    brāhmaṇakulaṃ paśya iti  / prathamaikavacane tṛtīyābahuvacane ca atijaraṃ brāhmaṇakulaṃ
    tiṣṭhati, atijaraiḥ iti ca bhavitavyam iti gonardīyamatena  / kiṃ kāraṇam ? sannipātalakṣaṇo
    vidhiranimittaṃ tadvidghātasya iti  / anye tu anityatvāt asyāḥ paribhāṣāyāḥ atijarasaṃ
    brāhmaṇakulaṃ tiṣṭhati, atijarasaiḥ ity evaṃ bhavitavyam iti manyante // [#827]
