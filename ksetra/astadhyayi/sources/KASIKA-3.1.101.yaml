locator:
  sutra: 3.1.101
witness_text:
  sutra: avadya-paṇya-varyā garhya-paṇitavya-anirodheṣu
  commentary: avadya paṇya varyā ity ete śabdā nipātyante garhya paṇitavya anirodha
    ity eteṣv artheṣu yathā-saṅkhyam  / avadhyam iti nipātyate garhyaṃ cet tad bhavati  /
    avadyaṃ pāpam  / anudyam anyat  / vadaḥ supi kyap ca (*3,1.106)  / paṇyam iti
    nipātyate, paṇitavyaṃ cet tad bhavati  / paṇyaḥ kambalaḥ  / paṇyā gauḥ  / pāṇyam
    anyat  / varyā iti striyāṃ nipātyate, anirodhaś ced bhavati  / anirodho 'pratibandhaḥ  /
    śatena varyā  / sahasreṇa varyā  / vṛtyā anyā  / strīliṅga-nirdeśaḥ kim arthaḥ
    ? vāryā ṛtvijaḥ //
