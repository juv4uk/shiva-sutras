source_id: KASIKA-1.2.65
locator:
  sutra: 1.2.65
witness_text:
  sutra: vṛddho yūnā tal-lakṣaṇaś ced-eva viśeṣaḥ
  commentary: śeṣaḥ iti vartate  / yūnā iti sahayoge tṛtīyā  / vṛddho yūnā sahavacane
    śiṣyate yuvā nivartate  / vṛddha-śabdaḥ pūrvācārya-sañjñā gotrasya apatyam antarhitaṃ
    vṛddham iti  / vṛddha-yūnoḥ sahavacane vṛddhaḥ śiṣyate tal-lakṣaṇaś ced eva viśeṣaḥ  /
    tad iti vṛddha-yūnor nirdeśaḥ  / lakṣaṇa-śabdo nimitta-paryāyaḥ  / cec-chabdo
    yady arthe  / evakāro 'vadhāraṇe  / viśeṣo vairūpyam  / vṛddha-yuva-nimittakam
    eva yadi vairūpayam bhavati tato vṛddhiḥ śiṣyate, yuvā nivartate  / samānāyāmākṛtau
    vṛddha-yuva-pratyayau bhidyete  / gārgyaś ca gārgyāyṇaś ca gārgyau  / [#49] vatsyaś
    ca vātsyāyanaś ca vātsyau  / vṛddhaḥ iti kim ? gargaś ca gārgyāyaṇaś ca gargagārgāyaṇau  /
    yū nā iti kim ? gārgyaś ca gargaś ca gārgya-gargau  / tal-lakṣaṇaḥ iti kim ? gārgya-vātsyayanau  /
    evakāraḥ kim-arthaḥ  / bhāgavittiś ca bhāgavittikaś ca bhāgavitti-bhāgavittikau  /
    kutsā sauvīratvaṃ ca bhāgavittikasya aparo viśeṣo vidyate //
