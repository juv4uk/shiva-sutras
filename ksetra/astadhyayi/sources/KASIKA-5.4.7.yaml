source_id: KASIKA-5.4.7
locator:
  sutra: 5.4.7
witness_text:
  sutra: aṣaḍakṣa-āśitaṅgv-alaṅkarma-alampuruṣa-adhyuttarapadāt khaḥ
  commentary: aṣaḍakṣa āśitaṅgu alagkarma alampuruṣa ity etebhyaḥ adhyuttarapadāt
    ca svārthe khaḥ pratyayo bhavati  / avidyamānāni ṣaḍkṣīṇi asya iti bahuvrīhiḥ  /
    bahuvrīhau sakthyakṣṇoḥ iti ṣac, tataḥ khapratyayaḥ  / aṣaḍakṣīṇo mantraḥ  / yo
    dvābhyam eva kriyate na bahubhiḥ  / āśitā gāvo 'sminn araṇye āśitaṅgavīnam araṇyam  /
    nipātanāt pūrvapadasya mumāgamaḥ  / akaṅkarman, alampuruṣaḥ iti paryādayo glānadyarthe
    caturthyā iti samāsaḥ  / alaṃ karmaṇe alaṅkakarmīṇaḥ  / alaṃ puruṣāya alaṃpuruṣīṇaḥ  /
    adhyuttarapadas tatpurusaḥ  / adhiśabdaḥ śauṇḍādisu paṭhyate  / rājādhīnaḥ  /
    nityaś ca ayaṃ pratyayaḥ, uttaratra vibhāṣāgrahaṇāt  / anye 'pi svārthikā nityāḥ
    pratyayāḥ smaryante, tamabādayaḥ prakknaḥ, ñyādayaḥ prāgvunaḥ, āmādayaḥ prāṅ mayaṭaḥ,
    bṛhatījātyantāḥ samānāntāś ca iti // [#560]
