source_id: KASIKA-6.1.103
locator:
  sutra: 6.1.103
witness_text:
  sutra: tasmāc chaso naḥ puṃsi
  commentary: tasmāt pūrvasavarṇadīrghāt uttarasya śaso 'vayavasya sakārasya puṃsi
    nakārādeśo bhavati  / vṛkṣān  / agnīn  / vāyūn  / kartṝn  / hartṝn  / ṣaṇḍakān  /
    ṣaṇḍhakān  / ṣaṇḍhakān  / sthūrān  / ararakān paśya  / sarva ete puṃliṅgaviśiṣṭaṃ
    svārthaṃ pratipādayanti  / iha tu cañceva cañcā, lummanuṣye iti kano lupi kṛte
    lupi yuktavad vyaktivacane (*1,2.5) iti puṃso 'pi strīliṅgata, tena natvaṃ na
    bhavati, cañcāḥ paśya, vadhrikāḥ paśya iti  / tasmāt iti kim ? etāṃścarato gāḥ
    paśya  / śāsaḥ iti kim  / vṛkṣāḥ  / plakṣāḥ  / puṃsi iti kim ? dhenūḥ  / bahvīḥ  /
    kumarīḥ //
