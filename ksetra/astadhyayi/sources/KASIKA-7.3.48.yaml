source_id: KASIKA-7.3.48
locator:
  sutra: 7.3.48
witness_text:
  sutra: abhāṣitapuṃskāc ca
  commentary: abhāṣitapuṃskād vihitasya ātaḥ sthāne yo 'kāraḥ tasya udīcām ācāryāṇāṃ
    matena ikārādeśo na bhavati  / khaṭvakā, khaṭvikā  / akhaṭvakā, akhaṭvikā  / paramakhaṭvakā,
    paramakhaṭvikā  / bahuvrīhau yadā kapi hrasvaḥ kriyate tadā bhavitavyam anena
    vidhinā  / atra api abhāṣitapuṃskād vihitasya ataḥ sthāne bhavatyakāraḥ iti  /
    yadā tu avidyamānā khaṭvā asyāḥ akhaṭvā, alpā akhaṭvā akhaṭvikā iti tadā na bhavati  /
    tathā atikrāntā khaṭvām atikhaṭvā, alpā atikhaṭva atikhaṭvikā //
