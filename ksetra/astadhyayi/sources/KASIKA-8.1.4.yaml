source_id: KASIKA-8.1.4
locator:
  sutra: 8.1.4
witness_text:
  sutra: nitya-vīpsayoḥ
  commentary: nitye cārthe vipsāyāṃ ca yad vartate tasya dve bhavataḥ  / keṣu nityatā
    ? tiṅkṣu nityatā avyayakṛtsu ca  / kuta etat  / ābhīkṣṇyam iha nityatā  / ābhīkṣṇyaṃ
    ca kriyādharmaḥ  / yāṃ kriyāṃ kartā prādhānyena anuparaman karoti tan nityam  /
    pacati pacati  / jalpati jalpati  / bhuktvā bhuktvā vrajati  / bhojaṃ bhojaṃ vrajati  /
    lunīhi lunīhi ity evāyaṃ lunāti ktvāṇamulorloṭaś ca dvirvacanāpekṣāyām eva paunaḥpunyaprakāśane
    śaktiḥ  / [#883] yaṅ tu tannirapekṣaḥ prakāśayati, punaḥ punaḥ pacati pāpacyate
    iti  / yadā tu tatra dvirvacanam tadā kriyāsamabhihāre paunaḥpunyaṃ draṣṭavyam
    pāpacyate pāpacyate iti  / atha keṣu vīpsā ? supsu vīpsā  / kā punar vīpsā ? vyāptiviśeṣaviṣayā
    prayoktur icchā vīpsā  / kā punaḥ sā ? nānāvācinām adhikaraṇānāṃ kriyāguṇābhyāṃ
    yugapat prayokturvyāptum icchā vīpsā  / nānābhūtārthavācināṃ śabdānāṃ yānyadhikaraṇāni
    vācyāni teṣāṃ kriyāguṇābhyāṃ yugapat prayoktum icchā vīpsā  / grāmo grāmo ramaṇīyaḥ  /
    janapado janapado ramaṇīyaḥ  / puruṣaḥ puruṣo nidhanam upaiti  / yat tiḍantaṃ
    nityatayā prakarṣeṇa ca yuktaṃ tataḥ kṛtadvirvacanāt prakarṣapratyaya iṣyate pacati
    pacatitarām iti  / iha tu āḍhyataramāḍhyataramānaya iti prakarṣayuktasya vīpsāyoga
    iṣyate //
