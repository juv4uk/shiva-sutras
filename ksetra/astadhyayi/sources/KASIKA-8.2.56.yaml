source_id: KASIKA-8.2.56
locator:
  sutra: 8.2.56
witness_text:
  sutra: nuda-vida-unda-trā-ghrā-hrībhyo 'nyatarasyām
  commentary: nuda vida unda trā ghrā hrī ity etebhyaḥ uttarasya niṣṭhātakārasya nakāra
    ādeśo bhavati anyatarasyām  / nuda - nunnaḥ, nuttaḥ  / vida - vinnaḥ, nittaḥ  /
    unda - samunnaḥ, samuttaḥ  / trā - trāṇaḥ, trātaḥ  / ghrā - ghrāṇaḥ, ghrātaḥ  /
    hrī - hrīṇaḥ, grītaḥ  / hrī ity etasmād aprāptaṃ natvam, itareṣāṃ nityaṃ prāptaṃ
    vikalpyate  / vida vicāraṇe ity asya vider iha grahaṇam iṣyate  / evaṃ hy uktam
    - vettestu vidito niṣṭhā vidyater vinna iṣyate  / vinater vinnaś ca vittaśca bhogavittaś
    ca vindateḥ // iti //
