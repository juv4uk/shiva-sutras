source_id: KASIKA-7.1.90
locator:
  sutra: 7.1.90
witness_text:
  sutra: goto ṇit
  commentary: gośadāt paraṃ sarvanāmasthānaṃ ṇit bhavati  / ṇitkāryaṃ tatra bhavati
    ity arthaḥ  / gauḥ, gāvau, gāvaḥ  / taparakaraṇaṃ kim ? citraguḥ  / śabalaguḥ  /
    kathaṃ he citrago, he śabalagava iti ? aṅgavṛtte punarvṛttāvavidhirniṣṭhitasya
    iti sambuddhijasorgune kṛte ṇittvaṃ na bhavati  / atha vā gotaḥ iti sambadhalakṣaṇā
    ṣaṣṭhī, gotaḥ sambandhi yat sarvanāmasthānam iti  / yac ca tadarthasyaikatvādiṣu
    sarvanāmasthānaṃ tad goḥ sarvanāmasthānam ity ucyate  / citraguśabdāt tu sarvanāmasthānaṃ
    tadanyapadārthasaikatvādināha  / taparakaraṇaṃ tu nirdeśartham eva  / kecit oto
    ṇit iti paṭhanti, dyośabdād api yat sarvanāmasthānaṃ vidyate tadartham  / dyauḥ,
    dyāvau, dyāvaḥ  / gotaḥ ity etad eva taparakaraṇanirdeśāt okārāntopalakṣaṇaṃ draṣṭavyam  /
    varṇanirdeśeṣu hi taparakaraṇaṃ prasiddham //
