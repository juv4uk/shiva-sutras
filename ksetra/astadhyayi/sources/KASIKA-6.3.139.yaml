source_id: KASIKA-6.3.139
locator:
  sutra: 6.3.139
witness_text:
  sutra: samprasāraṇasya
  commentary: uttarapde iti vartate  / samprasāraṇāntasya pūrvapadasya+uttarapade
    dīrgho bhavati  / kārīṣagandhīputraḥ  / kārīṣagandhīpatiḥ  / kaumudagandhīputraḥ  /
    kaumudīgandhīpatiḥ  / karīṣasya iva gandho 'sya, kumudasya iva gandho 'sya, alpākhyāyām
    (*5,4.136), upamānāc ca (*5,4.137) iti ikāraḥ samāsāntaḥ  / karīṣagandherapatyam
    kārīṣagandhyā  / kumudagandherapatyam kaumudagandhyā, tasyāḥ putraḥ kaumudagandhīputraḥ  /
    kaumudagadhīpatiḥ  / iko hrasvo 'ṅyo gālavasya (*6,3.61) ity etan na bhavati  /
    vyavasthitavibhāṣā hi sā  / akṛta eva dīrghatve hrasvabhāvapakṣe kṛtārthena api
    dīrgheṇa pakṣāntare paratvād hrasvo bādhyate  / punaḥ prasaṅgavijñānaṃ ca na bhavati,
    sakṛdgatau vipratiṣedhe yad bādhitaṃ tadbādhitam eva iti // iti śrīvāmanaviracitāyāṃ
    kāśikāyāṃ vṛttau ṣaṣṭhādhyāyasya tṛtīyaḥ pādaḥ // [#731] ṣaṣṭhādhyāyasya caturthaḥ
    pādaḥ  /
