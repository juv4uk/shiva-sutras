source_id: KASIKA-4.3.100
locator:
  sutra: 4.3.100
witness_text:
  sutra: janapadināṃ janapadavat sarvaṃ janapadena samānaśabdānāṃ bahuvacane
  commentary: janapadino ye bahuvacane janapadena samānaśabdās teṣāṃ janapadavat sarvaṃ
    bhavati, pratyayaḥ prakṛtiś ca so 'sya bhaktiḥ ity etasmin viṣaye  / janapadatadavadhyoś
    ca ity atra prakaraṇe ye pratyayā vihitāḥ, te janapadibhyo 'sminn arthe 'tidiśyante  /
    janapadino janapadasvāminaḥ kṣatriyāḥ  / aṅgā janapado bhaktir asya āṅgakaḥ  /
    vāṅgakaḥ  / sauhmakaḥ  / pauṇḍrakaḥ  / tadvat aṅgāḥ kṣatriyā bhaktir asya āṅgakaḥ  /
    vāṅgakaḥ  / sauhmakaḥ  / pauṇḍrakaḥ  / janapadinām iti kim ? pañcālāḥ brāhmaṇā
    bhaktir asya pājcālaḥ  / sarva-grahaṇaṃ prakṛty-atideśa-arthaṃ, sa ca dvyekayoḥ
    prayojayati, vṛddhi-nimitteṣu ca vuñādiṣu viśeṣo na asti iti  / madravṛjyoḥ kani
    viśeṣaḥ  / madrasyāpatyaṃ, dvyañ-magadha-kaliṅga-sūramasād aṇ (*4,1.170), mādraḥ  /
    vṛji-śabdād api, vṛddha-it-kosala-ajādāñ ñyaṅ (*4,1.171), vārjyaḥ  / sa bhaktir
    asya iti prakṛtinirhrāse kṛte, madrakaḥ  / vṛjikaḥ  / janapadena samānaśabdānām
    iti kim ? anuṣṇḍo janapadaḥ pauravo rājā, sa bhaktir asya, pauravīyaḥ  / bahuvacana-grahaṇaṃ
    samānaśabdatāviṣayalakṣaṇārtham  / anyathā hi yatra+eva samānaśabdatā tatra+eva
    atideśaḥ syāt, ekavacan-advivacanayor na syāt, vāṅgo vaṅgau vā bhaktir asya iti  /
    bahuvacane tu, bahuvacane samānaśabdānām ekavacana-dvivacanayoḥ saty api śabdabhede
    'tideśo bhavati  / vāṅgaḥ vāṅgau vā bhaktir asya vāṅgaka // [#422]
