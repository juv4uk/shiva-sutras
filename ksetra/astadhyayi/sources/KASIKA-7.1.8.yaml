source_id: KASIKA-7.1.8
locator:
  sutra: 7.1.8
witness_text:
  sutra: bahulaṃ chandasi
  commentary: chandasi viṣaye bahulaṃ ruḍāgamo bhavati  / devā aduhra  / gandharvā
    apsaraso aduhra  / duherlaṅi jhakārasya adādeśe kṛte ruṭ  / lopasya ātmanepadeṣu
    (*7,2.41) iti takāralopaḥ  / na ca bhavati, aduhata  / bahulavacanād anyatra api
    bhavati  / adṛśramasya ketavaḥ  / ṛduśo 'ḍi guṇaḥ (*7,4.16) ity etad api bahulavacanād
    eva atra na bhavati //
