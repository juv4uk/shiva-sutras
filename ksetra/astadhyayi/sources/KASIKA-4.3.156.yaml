source_id: KASIKA-4.3.156
locator:
  sutra: 4.3.156
witness_text:
  sutra: krītavat praimāṇāt
  commentary: prāgvateṣṭhañ (*4,1.18) ity ata ārabhya krītārthe ye pratyayāḥ parimāṇād
    vihitāḥ, te vikāre 'tidiśyante  / parimāṇāt krīta iva pratyayā bhavanti tasya
    vikāraḥ ity etasmin viṣaye  / aṇādīnām apavādaḥ  / saṅkhyā api parimāṇa-grahaṇena
    gṛhyate, na rūḍhiparimāṇam eva  / niṣkeṇa krītaṃ naiṣkikam  / evaṃ niṣkasya vikāro
    naiṣkikaḥ  / śatena krītaṃ śatyam, śatikam  / śatasya vikāraḥ śatyaḥ, śatikaḥ  /
    sāhasraḥ  / vatiḥ sarvasādṛśyārthaḥ  / adhyardhapūrvād dvigor lug asañjñāyām (*5,1.28)
    ity evam ādikam apy atidiśyate  / dvisahasraḥ, dvisāhasraḥ  / dviniṣkaḥ, dvinaiṣkikaḥ
    //
