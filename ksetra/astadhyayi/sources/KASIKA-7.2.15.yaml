source_id: KASIKA-7.2.15
locator:
  sutra: 7.2.15
witness_text:
  sutra: yasya vibhāṣā
  commentary: yasya dhātoḥ vibhāṣā kvacid iḍ uktaḥ tasya niṣṭhāyāṃ parataḥ iḍāgamo
    na bhavati  / vakṣyati - svarati-sūti-sūyati-dhūñ-ūdito vā (*7,2.44)  / vidhūtaḥ  /
    vidhūtavān  / guhū - gūḍhaḥ  / gūḍhavān  / udito vā - vṛdhu - vṛddhaḥ  / vṛddhavān  /
    tanipatidaridrāṇām upasaṅkhyānam iti pater vibhāṣiteṭkasya api dvitīyāśritātītapatita
    (*2,1.24) ti nipātanāt iḍāgamaḥ //
