source_id: KASIKA-6.1.64
locator:
  sutra: 6.1.64
witness_text:
  sutra: dhātvādeḥ ṣaḥ saḥ
  commentary: dhātor ādeḥ ṣakārasya sthāne sakārādeśo bhavati  / ṣaha - sahate  /
    ṣica - siñcati  / dhātugrahaṇaṃ kim ? soḍaśa  / ṣoḍan  / ṣaṇḍaḥ  / ṣaḍikaḥ  /
    ādeḥ iti kim ? kaṣati  / laṣati  / kṛṣati  / ādeśa pratyayayoḥ (*8,3.59) ity atra
    ṣatvavyavasthārtham ṣādayo dhātavaḥ kecid upadiṣṭāḥ  / ke punas te ? ye tathā
    paṭhyante  / athavā lakṣaṇaṃ kriyate, ajdantyaparāḥ sādayaḥ ṣopadeśāḥ smisvidisvadisvañjisvapitayaś
    ca, sṛpisṛjistṛstyāsekṣṛvarjam  / subdhātuṣṭhivuṣvaṣkatīnāṃ satvapratiṣedho vaktavyaḥ  /
    ṣoḍīyati  / ṣaṇḍīyati  / ṣṭhīvati  / ṣvaṣkate  / ṣṭhivu ity asya dvitīyasthakāraṣṭhakāraś
    ca+iṣyate  / tena teṣṭhīvyate, ṭeṣṭhīvyate iti ca abhyāsarūpaṃ dvidhā bhavati
    //
