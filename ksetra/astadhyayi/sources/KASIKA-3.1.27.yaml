source_id: KASIKA-3.1.27
locator:
  sutra: 3.1.27
witness_text:
  sutra: kaṇḍv-ādibhyo yak
  commentary: kaṇḍūñ ity evam ādibhyo yak pratyayo bhavati  / dvivadhāḥ kaṇḍv-ādayo,
    dhātavaḥ prātipādikāni ca  / tatra dhātvadhikārād dhatubhyaḥ eva pratyayo vidhīyate,
    na tu prātipadikebhyaḥ  / tathā ca guṇapratiṣedha-arthaḥ kakāro 'nubadhyate  /
    dhātuprakaraṇād dhātuḥ kasya cāsañjanād api  / āha ca ayam imaṃ dīrghaṃ manye
    dhatur vibhāṣitaḥ // kaṇḍūñ -- kaṇḍūyati, kaṇḍūyate  / ñitvāt kartr-abhiprāye
    kriyāphale (*1,3.72) ity ātmanepadam  / kaṇḍūñ  / mantu  / hṛṇīṅ  / valgu  / asmanas  /
    mahīṅ  / leṭ  / loṭ  / iras  / iraj  / irañ  / dravas  / medhā  / kuṣubha  / magadha  /
    tantas  / pampas  / sukha  / duḥkha  / sapara  / arara  / bhiṣaj  / bhiṣṇaj  /
    iṣudha  / caraṇa  / curaṇa  / bhuraṇa  / turaṇa  / gadgada  / elā  / kelā  / khelā  /
    liṭ  / loṭ //
