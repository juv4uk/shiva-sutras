source_id: KASIKA-7.2.29
locator:
  sutra: 7.2.29
witness_text:
  sutra: hṛṣer lomasu
  commentary: lomasu vartamānasya hṛṣer niṣṭhāyāṃ vā iḍāgamo na bhavati  / hṛṣṭāni
    lomāni, hṛṣitāni lomāni  / hṛṣṭaṃ lomabhiḥ, hṛṣitaṃ lomabhiḥ  / hṛṣṭāḥ keśāḥ,
    hṛṣitāḥ keśāḥ  / hṛṣṭaṃ keśaiḥ hṛṣitaṃ keśaiḥ  / hṛṣu alīke ity udittvān niṣṭhāyāmaniṭ,
    hṛṣa tuṣṭau ity ayaṃ seṭ, tayor ubhayor iha grahaṇam ity ubhayatra vibhāṣā iyam  /
    lomāni mūrdhajāni aṅgajāni ca sāmānyena gṛhyante, yathā lomanakhaṃ spṛṣṭvā śaucaṃ
    kartavyam iti  / tadviṣaye ca harṣe vartamāno lomasu vartate ity ucyate  / lomasu
    iti kim ? hṛṣṭo devadatta ity alīkārthasya, hṛṣito devadattaḥ iti tuṣṭyarthasya  /
    vismitapratighātayoś ca+iti vaktavyam  / hṛṣṭo devadattaḥ, hṛsito devadattaḥ  /
    vismitaḥ ity arthaḥ  / hṛṣṭāḥ dantāḥ, hṛṣitāḥ dantāḥ  / pratihatāḥ ity arthaḥ
    // [#808]
