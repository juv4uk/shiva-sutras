source_id: KASIKA-6.2.26
locator:
  sutra: 6.2.26
witness_text:
  sutra: kumāraś ca
  commentary: kumāraśabdaḥ pūrvapadaṃ karmadhāraye samāse prakṛtisvaram bhavati  /
    kumāraśramaṇā  / kumārakulaṭā  / kumāratāpasī  / kumāraśabdo 'ntodāttaḥ  / atra
    kecit lakṣaṇapratipadokayoḥ pratipadoktasya+eva grahaṇam it paribhāṣayā kumāraḥ
    śramaṇādibhiḥ (*2,1.70) ity atra+eva samāse svaram etam icchanti  / kecit punar
    aviśeṣeṇa sarvatra+eva karmadhāraye //
