source_id: KASIKA-8.1.55
locator:
  sutra: 8.1.55
witness_text:
  sutra: āma ekāntaram āmantritam anantike
  commentary: āmaḥ uttaram ekapadāntaram āmantritāntam anantike nānudāttaṃ bhavati  /
    ām pacasi devadatta 3  / ām bho devadatta 3  / bho ity āmantritāntam api, nāmantrite
    samānādhikaraṇe sāmānyavacanam iti nāvidyamānavad bhavati  / āmaḥ iti kim ? śākaṃ
    pacasi devadatta 3  / ekāntaram iti kim ? ām prapacasi devadatta 3  / āmantritam
    iti kim ? ām pacati devadattaḥ  / anantike iti kim ? ām devadatta  / [#898] āma
    ekāntaram āmantritaṃ yat tasya ekaśruter anudāttasya ca pratiṣedha iṣyate  / tad
    ubhayam anena kriyate iti kecid āhuḥ  / plutodāttaḥ punar asiddhatvān na pratiṣidyate  /
    apareṣāṃ darśanam, anantike ity anena yan na dūraṃ na sannikṛṣṭaṃ tat parigṛhyate,
    tena asminnekadśruteḥ prāptir eva na asti, plutodātto 'pi nodāhartavyaḥ iti //
