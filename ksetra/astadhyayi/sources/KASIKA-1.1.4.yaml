source_id: KASIKA-1.1.4
locator:
  sutra: 1.1.4
witness_text:
  sutra: na dhātu-lopa ārdhadhātuke
  commentary: dhātv-ekadeśo dhātuḥ, tasya lopo yasminn ārdhadhātuke tad-ārdhadhātukaṃ
    dhātu-lopaṃ, tatra ye guṇa-vṛddhī prāpnutaḥ, te na bhavataḥ  / loluvaḥ  / popuvaḥ  /
    marīmṛjaḥ  / lolūya-ādibhyo yaṅantebhyaḥ paca-ādy-aci vihite yaṅo 'ci ca (*2,4.74)
    iti yaṅo luki kṛte tam eva acam āśritya ye guṇa-vṛddhī prāpte tayoḥ pratiṣedhaḥ  /
    dhātu-grahaṇaṃ kim ? lūñ, lavitā  / reḍasi  / parṇaṃ na veḥ  / anubandha-pratyaya-lope
    mā bhūt  / riṣer-hi-sa-arthasya vicpratyaya-lopa udāharaṇaṃ reṭ iti  / ārdhadhātuke
    iti kim ? tridhā baddho vṛṣabho roravīti iti  / sārvadhātuke mā bhūt  / ikaḥ ity
    eva - abhāji, rāgaḥ  / bahuvrīhi-samāśrayaṇaṃ kim ? knopayati, preddham //
