source_id: KASIKA-6.3.122
locator:
  sutra: 6.3.122
witness_text:
  sutra: upasargasya ghañyamanuṣye bahulam
  commentary: upasargasya ghañante uttarapade amanuṣye 'bhidheye bahulaṃ dīrgho bhavati  /
    vīkledaḥ  / vīmārgaḥ  / apāmārgaḥ  / na ca bhavati  / prasevaḥ  / prasāraḥ  /
    sādakārayoḥ kṛtrime dīrgho bhavati  / prāsādaḥ  / prākāraḥ  / kṛtrime iti kim
    ? prasādaḥ  / prakāraḥ  / veśādiṣu vibhāṣā dīrgho bhavati  / prativeśaḥ, pratīveśaḥ  /
    pratirodhaḥ, pratīrodhaḥ  / amanuṣye iti kim ? niṣādo manuṣyaḥ //
