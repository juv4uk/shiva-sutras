source_id: KASIKA-1.3.32
locator:
  sutra: 1.3.32
witness_text:
  sutra: gandhana-avakṣepaṇa-sevana-sāhasikya-pratithatna-prakathana-upayogeṣu kṛñaḥ
  commentary: kartr-abhiprāye kriyāphale siddham eva-ātmanepadam  / akartr-abhipraya-artho
    'yamārambhaḥ  / gandhana-ādiṣv artheṣu vartamānat karoter ātmanepadaṃ bhavati  /
    gandhanam pakāra-prayuktaṃ hiṃsātmakaṃ sūcanam  / tathā hi, basta gandha ardane,
    arda hiṃsāyām iti cur-ādau pathyate  / avakṣepaṇam bhartsanam  / sevanam anuvṛttiḥ  /
    sāhasikyaṃ sāhasikaṃ karma  / pratiyatnaḥ sato guṇa-antarādhānam  / prakathanaṃ
    prakarṣeṇa kathanam  / upayogo dharmādi prayojano viniyogaḥ  / gandhane tāvat
    -- utkurute  / udākurute  / sūcayati ity arthaḥ  / avakṣepaṇe -- śyeno vartikām
    udākurute  / bhartsayati ity arthaḥ sevate -- gaṇakānupakurute  / mahāmātrānupakurute  /
    sevate ity arthaḥ  / sāhāsikye -- paradārān prakurute  / [#60] teṣu sahasā pravartate
    ity arthaḥ  / pratiyatne -- edho dakasya+upaskurute  / kāṇḍaṃ guḍasya+upaskurute  /
    tasya sato guṇantarādhānaṃ karoti ity arthaḥ  / ṣaṣṭhīsuṭau karoteḥ pratiyatna
    eva vidhīyete  / prakathane -- gāthāḥ prakurute  / janāpavādān prakurute  / prakarṣeṇa
    kathayati ity arthaḥ  / upayoge -- śatam prakurute  / sahasraṃ prakurute  / dharma-arthaṃ
    śataṃ viniyuṅkte ity arthaḥ  / eteṣu iti kim ? kaṭaṃ karoti //
