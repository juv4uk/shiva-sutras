source_id: KASIKA-5.2.37
locator:
  sutra: 5.2.37
witness_text:
  sutra: pramāṇe dvayasaj-daghnañ-mātracaḥ
  commentary: tad asya ity anuvartate  / tad iti prathamāsamarthād asya iti ṣaṣṭhyarthe
    dvayasac daghnac mātrac ity ete pratyayā bhavanti yat tat prathamāsamarthaṃ pramāṇaṃ
    cet tad bhavati  / ūruḥ pramāṇam asya ūrudvayasam, ūrudaghnam, ūrumātram  / jānudvayasam  /
    jānudaghnam  / jānumātram  / prathamaś ca dvitiyaś ca ūrdhvamāne matau mama  /
    ūrudvayasam udakam  / ūrudaghnam udakam  / mātrac punar aviśeṣeṇa, prasthamātram
    ity api bhavati  / pramāṇe lo vaktavyaḥ  / pramāṇa-śabdā iti ye prasiddhāḥ, tebhya
    utpannasya pratyayasya lug bhavati  / śamaḥ pramāṇamasya śamaḥ  / diṣṭiḥ  / vitastiḥ  /
    dvigor nityam  / dvau śamau pramāṇam asya dviśamaḥ  / triśamaḥ  / dvivitastiḥ  /
    nitya-grahaṇaṃ kim ? saṃśaye śrāviṇaṃ vakṣyati, tatra api dvigor lug eva yathā
    syāt  / dve diṣṭī syātāṃ vā na vā dvidiṣṭiḥ  / ḍiṭ stome vaktavyaḥ  / pañcadaśaḥ
    stomaḥ  / pañcadaśī rātriḥ  / ṭittvād ṅīp  / śanśatorḍinirvaktavyaḥ  / pañcadaśino
    'rdhamāsāḥ, triṃśino māsāḥ  / viṃśateś ceti vaktavyam  / viṃśino 'ṅgirasaḥ  /
    pramāṇaparimāṇābhyāṃ saṅkhyāyāś ca api saṃśaye mātrac vaktavyaḥ  / śamamātram  /
    diṣṭimātram  / prasthamātram  / kuḍavamātram  / pañcamātram  / daśamātrā gāvaḥ  /
    vatvantāt svārthe dvayasajmātracau bahulam  / tāvad eva tāvaddvayasam, tāvanmātram  /
    etāvaddvayasam, etāvanmātram  / yāvaddvayasam, yāvanmātram // [#507]
