locator:
  sutra: 3.1.79
witness_text:
  sutra: tan-ādi-kṛñbhyaḥ uḥ
  commentary: tanu vistāre ity evam ādibhyo dhātubhyaḥ kṛñaś ca u-pratyayo bhavati  /
    śapo 'pavādaḥ  / tanoti  / sanoti  / kṣaṇoti  / kṛñaḥ khalv api - karoti  / tanādi-pāṭhād
    eva u-pratyaye siddhe karoter upādānaṃ niyama-artham, anyat tan-ādi-kāryaṃ mā
    bhūt iti  / tan-ādibhyas ta-thāsoḥ (*2,4.79)  / iti vibhāṣā sico lug na bhavati  /
    akṛta  / akṛthāḥ //
