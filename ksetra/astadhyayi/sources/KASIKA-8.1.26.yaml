source_id: KASIKA-8.1.26
locator:
  sutra: 8.1.26
witness_text:
  sutra: sapūrvāyāḥ prathamāyā vibhāṣā
  commentary: vidyamānapūrvāt prathamāntāt padāt uttarayoḥ yuṣmadasmadoḥ vibhāṣa vānnāvādayo
    na bhavanti  / grāme kambalaste svam, grāme kambalastava svam  / grāme kambalo
    me svam, grāme kambalo mama svam  / grāme kambalaste dīyate, grāme kambalastubhyaṃ
    dīyate  / grāme kambalo me dīyate, grāme kambalo mahyaṃ dīyate  / grāme chātrāstvā
    paśyanti, grāme chātrāstvāṃ paśyanti  / grām chātrā mā paśyanti, grāme chātrā
    māṃ pśyanti  / supūrvāyāḥ iti kim ? kambalaste svam  / kambalo me svam  / pathamāyāḥ
    iti kim ? kambalo grāme te svam  / kambalo grāme me svam  / [#891] yuṣmadasmador
    vibhāṣā ananvādeś iti vaktavyam  / iha mā bhūt, atho grāme kambalaste svam, atho
    grāme kambalo me svam  / apara āha - sarva eva vānnāvādayo 'nanvādeśe vibhāṣā
    vaktavyāḥ  / kambalaste svam, kambalastava svam  / kambalo me svam, kambalo mama
    svam  / ananvādeśe iti kim ? atho kambalaste svam  / atho kambalo me svam  / na
    tarhi idānīmidaṃ vaktavyam sapūrvāyāḥ prathamāyā vibhāṣā iti ? vaktavyaṃ ca  /
    kiṃ prayojanam ? anvādeśārtham  / anavādeśe hi vibhāṣā yathā syāt  / atho grāme
    kambalaste svam, atho grāme kambalaste svam  / atho grāme kambalo me svam, atho
    grāmekambalo me svam, atho grāme kambalo mama svam //
