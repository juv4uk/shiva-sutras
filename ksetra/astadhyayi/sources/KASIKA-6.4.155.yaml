source_id: KASIKA-6.4.155
locator:
  sutra: 6.4.155
witness_text:
  sutra: ṭeḥ
  commentary: bhasya ṭerlopo bhavati iṣṭhemeyassu parataḥ  / paṭu - paṭiṣṭhaḥ  / paṭimā  /
    paṭīyān  / laghu - laghiṣṭhaḥ  / laghimā  / laghīyān  / ṇāviṣṭhavat prātipadikasya
    kāryaṃ bhavati iti vaktavyam  / kiṃ prayojanam ? puṃvadbhāvarabhāvaṭilopayaṇādi.
    parārtham  / puṃvadbhāvaḥ - enīmācaṣṭe etayati  / śyetayati  / tasilādiṣvākṛtvasucaḥ
    (*6,3.35) iti iṣṭhe puṃvadbhāvaḥ uktaḥ  / rabhāvaḥ - pṛthumācaṣṭe prathayati  /
    mradayati  / ṭilopaḥ - paṭunācaṣṭe paṭayati  / laghayati  / yaṇādiparam - sthūlamācaṣṭe
    sthavayati  / bhāradvājīyāstu paṭhanti, ṇāviṣṭhavat prātipadikasya puṃvadbhāvarabhāvaṭilopayaṇādiparavinmatorlukkanartham
    iti  / sragviṇamācaṣṭe srajayati  / vasumantamācaṣṭe vasayati  / yuvānamācaṣṭe
    yavayati  / kanyati  / etad ubhayam api udāharaṇamātram, na parigaṇanam  / prādayo
    'pi hīṣyante, priyamācaṣṭe prāpayati //
