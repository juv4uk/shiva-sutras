source_id: KASIKA-6.1.1
locator:
  sutra: 6.1.1
witness_text:
  sutra: eka-aco dve prathamasya
  commentary: adhikāro 'yam  / ekācaḥ iti ca, dve iti ca, prathamasya iti ca tritayam
    adhikṛtaṃ veditavyam  / ita uttaraṃ yad vakṣyāmaḥ prāk saṃprasāraṇavidhānāt tatra
    ekācaḥ prathamasya dve bhavataḥ ity evaṃ tad veditavyam  / vakṣyati - liṭi dhātor
    anabhyāsasya (*6,1.8) iti  / tatra dhātor avayavayasya anabhyāsasya prathamasya+ekāco
    dve bhavataḥ  / jajāgāra  / papāca  / iyāya  / āra  / ekāca iti bahuvrīhinirdeśaḥ  /
    eko 'c yasya so 'yam ekāc ity avayavena vigrahaḥ  / tatra samudāyaḥ samāsārthaḥ  /
    abhyantaraś ca samudāye 'vayavo bhavati iti sāckasya+eva dvirvacanaṃ bhavati  /
    evaṃ ca pac ity atra yena+eva acā samudāyaḥ ekāc, tenaa+eva tadavayavo 'cchabdaḥ
    paśabdaś ca  / tatra pṛthag avayavaikāc na dvir ucyate, kiṃ tarhi, samudāyaikāj
    eva  / tathā hi sakṛcchāstrapravṛttyā sāvayavaḥ samudāyo 'nugṛhyate  / papāca
    ity atra prathamatvaṃ vyapadeśivadbhāvāt  / iyāya, āra ity atra ekāctvam api vyapadeśibhāvād
    eva  / dviḥprayogaś ca dvirvacanam idam  / āvṛttisaṅkhyā hi dve iti vidhīyate  /
    tena sa eva śabdo dvir ucāryate, na ca śabdāntaraṃ tasya sthāne vidhīyate //
