locator:
  sutra: 3.1.119
witness_text:
  sutra: pada-asvairi-bāhyā-pakṣyeṣu ca
  commentary: pade asvairiṇi bāhyāyāṃ pakṣye carthe graher dhātoḥ kyap pratyayo bhavati  /
    pade tāvat -- pragṛhyaṃ padam, yasya pragṛhya-sañjñā vihitā  / avagṛhyaṃ padam,
    yasya avagrahaḥ kriyate  / asvairī paratantraḥ  / gṛhyakā ime  / gṛhītakā ity
    arthaḥ  / bāhyāyam -- grāma-gṛhyā senā  / nagara-gṛhyā senā  / grāma.-nagara-abhyāṃ
    bahir-bhūtā ity arthaḥ  / strīliṅgaḥ nirdeśād anyatra na bhavati  / pakṣe bhavaḥ
    pakṣyaḥ  / vāsudeva-gṛhyāḥ  / arjuna-gṛhyāḥ  / tatpakṣāśritāḥ ity arthaḥ //
