source_id: KASIKA-3.2.21
locator:
  sutra: 3.2.21
witness_text:
  sutra: divā-vibhā-niśā-prabhā-bhās-kāra-anta-ananta-ādi-bahu-nāndī-kiṃ-lipi-libi-bali-bhakti-kartṛ-citra-kṣetra-saṅkhyā-jaṅghā-bāhv-ahar-yat-tad-dhanur-aruṣṣu
  commentary: karmaṇi supi iti ca dvayam apy anuvartate  / tatra yathāyogaṃ sambandhaḥ  /
    divā-ādiṣu upapadeṣu karoter dhātoḥ ṭapratyayo bhavati  / ahetvādy-artha ārambhaḥ  /
    divā-śabdo adhikaraṇa-vacanaḥ supi ity asya viśeṣaṇam  / divā karoti prāṇinaśaceṣṭāyuktān
    iti divākaraḥ  / vibhāṃ karoti iti vibhākaraḥ  / niśākaraḥ  / prabhākaraḥ  / bhāskaraḥ  /
    sakārasya nipātanād visarjanīya-jihvāmūlīyau na bhavataḥ  / kārakaraḥ  / antakaraḥ  /
    anantakaraḥ  / ādikaraḥ  / bahukaraḥ  / nāndīkaraḥ  / kiṅkaraḥ  / lipikaraḥ  /
    libikaraḥ  / balikaraḥ  / bhaktikaraḥ  / kartṛkaraḥ  / citrakaraḥ  / kṣetrakaraḥ  /
    saṅkhyā - ekakaraḥ, dvikaraḥ, trikaraḥ  / jaṅghākaraḥ  / bāhukaraḥ  / ahaskaraḥ  /
    yatkaraḥ  / tatkaraḥ  / dhanuṣkaraḥ  / aruṣkaraḥ  / kiṃyattadbahuṣu kṛño 'jvidhānam  /
    kiṅkarā  / yatkarā  / tatkarā  / bahukarā  / athavā ajādiṣu pāṭhaḥ karisyate //
    [#216]
