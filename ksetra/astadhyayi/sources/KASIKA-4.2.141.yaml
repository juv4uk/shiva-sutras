source_id: KASIKA-4.2.141
locator:
  sutra: 4.2.141
witness_text:
  sutra: vṛddhād aka-ika-anta-kha-upadhāt
  commentary: deśe ity eva  / vṛddhād deśa-vācinaḥ aka ika ity evam antāt khakāropadhāc
    ca prātipadikāt chaḥ pratyayo bhavati śaisikaḥ  / kopadha-lakṣaṇasya aṇo 'pavādaḥ  /
    vāhīkagrāma-lakṣaṇasya ca pratyayasya, ropadhetoḥ prācām (*4,2.123) iti ca  /
    akāntāt tāvat - ārīhaṇakīyam  / draughaṇakīyam  / ikāntāt - āśvapathikīyam  /
    śālmalikīyam  / khopadhāt - kauṭiśikhīyam  / āyomukhīyam  / akekānta-grahaṇe kopadha-grahaṇaṃ
    sausukādyartham  / sausukīyam  / mausukīyam  / aindraveṇukīyam //
