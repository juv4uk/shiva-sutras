locator:
  sutra: 8.2.69
witness_text:
  sutra: ro 'supi
  commentary: ahan ity etasya rephādaśo bhavati asupi parataḥ  / ahardadāti  / aharbhuṅkte  /
    asupi iti kim ? ahobhyām  / ahobhiḥ  / nanu catra api pratyayalakṣaṇena subasti,
    ahardadāti, aharbhuṅkte iti ? na+etad asti  / uktam etat - ahnor avidhau lumatā
    lupte pratyayalakṣaṇaṃ na bhavati iti  / nāyamahaḥśabdaḥ supparo bhavati  / yatra
    tu lopaśabdena lupyate tatra pratyayalakṣaṇaṃ bhavaty eva, yathā he dīrghaho 'tra,
    dīrghāho nidāgha iti  / atra hi halṅyābbhyaḥ iti lopena pratyayasya nivṛttiḥ //
    [#927]
