source_id: KASIKA-8.4.40
locator:
  sutra: 8.4.40
witness_text:
  sutra: s-toḥ ś-cunā ś-cuḥ
  commentary: sakāratavargayoḥ śakāracavargābhyāṃ sannipāte śakāracavargāv ādeśau
    bhavataḥ  / stoḥ ścunā iti yathāsaṅkhyam atra neṣyate  / sakārasya śakāreṇa, cavargeṇa,
    dvābhyām api sannipāte śakāro bhavati  / tavargasya api ca śakāreṇa, cavargena
    ca sannipāte cavargo bhavati  / ādeśe tu yathāsaṅkhyam isyate, sakārasya śakāraḥ,
    tavargasya ca cavargaḥ iti  / sakārasya śakāreṇa sannipāte - vṛkṣaśśete  / plakṣaśśete  /
    tasya+eva cavargeṇa - vṛkṣaścinoti  / plakṣaścinoti  / vṛkṣaśchādayati  / plakṣaśchādayati  /
    tavargasya śakāreṇa - agnicicchete  / somasucchete  / tasya+eva cavargeṇa - agniciccinoti  /
    somasuccinoti  / agnicicchādayati  / somasucchādayati  / agnicijjayati  / somasujjayati  /
    agnicijjhakāraḥ  / asomasujjhakāraḥ  / agniciññakāraḥ  / somasuññakāraḥ  / masjeḥ
    majjati  / bhrasjeḥ - bhṛjjati  / vraśceḥ - vṛścati  / yajeḥ yajñaḥ  / yāceḥ -
    yācñā  / śāt (*8,4.44) iti pratiṣedho jñāpakaḥ saṅkhyātānudeśābhāvasya  / stoḥ
    ścau iti saptamīnirdeśo na kṛtaḥ, pūrveṇa pareṇa ca ścunā sannipāte ścutvaṃ yathā
    syāt iti //
