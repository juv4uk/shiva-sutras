source_id: KASIKA-6.2.37
locator:
  sutra: 6.2.37
witness_text:
  sutra: kārta-kaujapa-ādayaś ca
  commentary: kārtakaujapādayo ye dvandvāḥ teṣu pūrvapadaṃ prakṛtisvaraṃ bhavati  /
    prakṛtisvarapūrvapadāḥ kārtakaujapādayo bhavanti  / vibhaktyantānāṃ pāṭho vacanavivakṣārthaḥ  /
    cakāro dvandvādhikārānuvṛttyarthaḥ  / kārtakaujapau  / kṛtasya apatyaṃ, kujapasya
    apatyam ity aṇantāvetau  / sāvarṇimāṇḍūkeyau  / sāvarṇiriñantaḥ  / avantyaśmakāḥ  /
    avanter apatyāni vahūni, tannivāso janapado 'vantayaḥ  / tathā aśmakāḥ  / pailaśyāparṇeyāḥ  /
    yuvadvandvo 'yam  / pīlāyāḥ apatyaṃ pailaḥ, tasya apatyaṃ yuvā iti aṇo dvyacaḥ
    (*4,1.156) iti vihitasya phiñaḥ pailādibhyaś ca (*2,4.59) iti luk  / śyāparṇaśabdo
    bidādiḥ, tasya apatyaṃ strī śyāparṇī, tadapatyaṃ yuvā śyāparṇeyaḥ  / bahuvacanamatantram,
    tena pailaśyāparṇeyau ity atra api bhavati  / kapiśyāparṇeyāḥ  / kapirantodāttaḥ,
    tasya apatyaṃ bahutve kapi-bodha-aṅgirase (*4,1.107) iti utpannasya yañaḥ yañañoś
    ca iti luk, tena atra bahutvam āśrīyata eva  / [#663] śaitikākṣapāñcāleyāḥ  /
    śitikākṣo nāma ṛṣiḥ, tasya apatyam iti ṛṣyaṇ, tadapatye yūni ya iñ tasya ṇyakṣatriyārṣañito
    yūni lugaṇiñoḥ (*2,4.58) iti luk  / pāñcālasya apatyaṃ strī pāñcālī, tadapatyam
    yuvā pāñcāleyaḥ  / atra api bahuvacanam avivakṣitam iti śaitikākṣapañcāleyau ity
    atra api bhavati  / kaṭukavārcaleyāḥ  / kaṭukasya apatyam iti ata iñ (*4,1.95),
    tasya bahvaca iñaḥ prācyabharateṣu (*2,4.66) iti bahuṣu luk  / varcalāyāḥ apatyaṃ
    vārcaleyaḥ  / śākalaśunakāḥ  / śakalasya apatyaṃ śākalyaḥ, tasya chātrāḥ śākalāḥ  /
    kaṇvādibhyo gotre (*4,2.111) ity aṇ  / śunakasya apataym iti bidādibhyo 'ñ (*4,1.104),
    tasya bahuṣu luk  / śākalaśaṇakāḥ iti kecit paṭhanti  / teṣāṃ śaṇakaśabād utpannasya
    iñaḥ bahvaca iñaḥ prācyabharateṣu (*2,4.66) iti bahuṣu luk  / śunakadhātreyāḥ  /
    dhātryā apatyaṃ dhātreyaḥ  / śaṇakabābhravāḥ  / babhrorapatyaṃ bābhravaḥ  / ārcābhimaudgalāḥ  /
    ṛcābhena proktam adhīyate ārcābhinaḥ  / vaiśampāyanāntevāsitvāt ṇiniḥ  / mudgalaḥ
    kaṇvādiḥ, tadapatyasya chātrā maudgalāḥ  / kuntisurāṣṭrāḥ  / kunteḥ surāṣṭrasya
    ca apatyeṣu bahuṣu tannivāse vā janapade dvandvo 'yam  / kunticintiśabdau antodāttau  /
    cintisurāṣṭrāḥ kuntisurāṣṭravat  / taṇḍavataṇḍāḥ  / pacādyacpratyayāntau antodāttau
    etau gargādiṣu paṭhyete  / tatra apatyabahutve yaño luk kriyate  / gargavatsāḥ  /
    atra api apatyeṣu bahuṣu iñaḥ bahvaca iñaḥ prācyabharateṣu (*2,4.66) iti luk kriyate  /
    bābhravaśālaṅkāyanāḥ  / babhrorapatyaṃ bābhravaḥ  / śalaṅku śalaṅkaṃ ca iti śālaṅkāyanaḥ  /
    bābhravadānacyutāḥ  / dānacyutaśabdāt iñaḥ bahvacaḥ iti luk  / kaṭhakālāpāḥ  /
    kaṭhena proktam adhīyate kaṭhāḥ, vaiśampāyanāntevāsitvāt ṇiniḥ, tasya kaṭhacarakāl
    luk  / kalāpinā proktamadhīyate kālāpāḥ  / kalāpino 'ṇ (*4,3.108) ity aṇ pratyayaḥ,
    tasmin inaṇyanapatye (*6,4.164) iti prakṛtibhāve prāpte na antasya ṭilope sabrahmacāripīṭhasarpi
    ity ādinopasaṅkhyānena ṭilopaḥ  / kaṭhakauthumāḥ  / kuthuminā proktamadhīyate
    iti prāgdīvyato 'ṇ (*4,1.83), tasya pūrvavat ṭilopaḥ  / kauthumalaukākṣāḥ  / lokākṣeṇa
    proktam adhīyate laukākṣāḥ  / lokākṣasya vā apatyaṃ laukākṣiḥ, tasya chātrāḥ laukākṣāḥ  /
    strīkumāram  / strīśabdo 'ntodāttaḥ  / maudapaippalādāḥ  / mudasya apatyaṃ maudiḥ  /
    tasya chātrā maudāḥ  / tathā paippalādāḥ  / maudapaippalādāḥ iti dviḥ paṭhyate,
    tasya prayojanaṃ pakṣe samāsāntodāttatvam eva yathā syād iti  / vatsajarat  /
    vatsaś ca jarac ca  / vatsaśabdo 'ntodāttaḥ  / sauśrutapārthavāḥ  / suśrutasya
    pṛthoś ca chātrāḥ, prāgdīvyato 'ṇ (*4,1.83)  / jarāmṛtyū  / yājyānuvākye  / yajerṇyat,
    yajayācarucapravacarcaś ca (*7,3.66) iti kutvābhāvaḥ  / tatsvaritam (*6,1.185)
    ity antasvaritaḥ  / anuvākyā iti vacer anupūrvāt ṇyat  / ācāryopasarjanāntevāsinām
    iha pāṭhaḥ prapñcārthaḥ // [#664]
