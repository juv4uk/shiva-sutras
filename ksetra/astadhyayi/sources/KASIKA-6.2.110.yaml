source_id: KASIKA-6.2.110
locator:
  sutra: 6.2.110
witness_text:
  sutra: niṣṭhā-upasargapūrvam anyatarasyām
  commentary: bahuvrīhau samāse niṣṭhāntam upasargapūrvaṃ pūrvapadam anatarasyām anatodāttaṃ
    bhavati  / pradhautamukhaḥ, pradhautamukhaḥ pradhautamukhaḥ  / prakṣālitapādaḥ,
    prakṣālitapādaḥ  / yadi mukhaśabdaḥ svāṅgavācī tadā pakṣe mukhaṃ svāṅgam (*6,2.167)
    ity etad bhavati, na cet pūrvapadaprakṛtisvaratvena gatir anantaraḥ (*6,2.49)
    ity etad bhavati  / niṣṭhā iti kim ? prasecakamukhaḥ  / upasargapūrvam iti kim
    ? śuṣkamukhaḥ //
