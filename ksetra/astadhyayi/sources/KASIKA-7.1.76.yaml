locator:
  sutra: 7.1.76
witness_text:
  sutra: chandasy api dṛśyate
  commentary: asthi-dadhi-sakthy-akṣṇām anaṅ chandasy api dṛśyate  / yatra vihitas
    tato 'nyatra api dṛśyate  / aci ity uktam, anajādau ai dṛśyate  / indro dadhīco
    asthabhiḥ  / bhadraṃ paśyemākṣabhiḥ  / tṛtīyādiṣu ity uktam, atṛtīyādiṣu api dṛśyate  /
    asthānyutkṛtya juhoti  / vibhaktau ity ukta, avibhaktāv api dṛśyate  / akṣaṇvatā
    lāṅgalena  / asthanvantaṃ yadanasthā bibharti //
