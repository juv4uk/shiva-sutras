source_id: KASIKA-3.3.113
locator:
  sutra: 3.3.113
witness_text:
  sutra: kṛtya-lyuṭo bahulam
  commentary: bhāve, akartari ca kārake iti nivṛtam  / kṛtya-sañjñakāḥ pratyayāḥ lyuṭ
    ca bhaulam artheṣu bhavanti  / yatra vihitās tato 'nyatra api bhavanti  / bhāvakarmaṇoḥ
    kṛtyā vihitāḥ kārakāntare 'pi bhavanti  / snānīyaṃ cūrṇam  / dānīyo brāhmaṇaḥ  /
    karaṇa-adhikaraṇayoḥ bhāve ca lyuṭ  / anyatra api bhavati  / apasecanam  / avasrāvaṇam  /
    rājabhojanāḥ śālayaḥ  / rājācchādanāni vāsāṃsi  / praskandanam  / prapatanam  /
    bahula-grahaṇād anye 'pi kṛtaḥ yathāprāptam abhidheyaṃ vyabhicaranti  / pādābhyāṃ
    hriyate pādahārakaḥ  / gale copyate galecopakaḥ // [#277]
