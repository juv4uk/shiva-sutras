source_id: KASIKA-6.2.155
locator:
  sutra: 6.2.155
witness_text:
  sutra: naño guṇapratiṣedhe sampādy-arha-hita-alamarthās taddhitāḥ
  commentary: sampādi arha hita alam ity evam arthā ye taddhitāḥ tadantāni uttarapadāni
    naño guṇapratiṣedhe vartamānāt parāṇi antodāttāni bhavanti  / sampādi-karṇaveṣṭakābhyāṃ
    sampādi mukhaṃ kārṇaveṣṭakikam, na kārṇaveṣṭakikam akārṇaveṣṭakikam  / arhaṃ -
    chedamarhati chaidikaḥ, na chaidikaḥ acchaidikaḥ  / hita - vatsebhyo hitaḥ vatsīyaḥ,
    na varsīyaḥ avarsīyaḥ  / alamartha - santāpāya prabhavati sāntāpikaḥ, na sāntāpikaḥ
    asāntāpikaḥ  / nañaḥ iti kim ? gardabharatham arhati, gārdabharathikaḥ  / vigārdabharathikaḥ  /
    guṇapratiṣedhe iti kim ? gārdabharathikādanyaḥ agārdabharathikaḥ  / guṇa iti taddhitārthapravṛttinimittaṃ
    sampāditvādy ucyate  / tatpratiṣedho yatra+ucyate samāse tatra ayaṃ vidhiḥ karnaveṣṭakābhyāṃ  /
    sampādi mukham iti  / sampādyarhahitālamarthāḥ iti kim ? pāṇinīyam adhīte pāṇinīyaḥ,
    na pāṇinīyaḥ apāṇinīyaḥ  / taddhitāḥ iti kim ? anyāṃ voḍhumarhati kanyāvoḍhā,
    na voḍhā avoḍhā  / arhe kṛtyatṛcaś ca (*3,3.169) iti tṛc //
