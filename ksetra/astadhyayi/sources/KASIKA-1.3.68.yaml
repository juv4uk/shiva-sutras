locator:
  sutra: 1.3.68
witness_text:
  sutra: bhī-smyor hetubhaye
  commentary: ṇeḥ iti vartate  / akartr-abhiprāya-artho 'yam-ārambhaḥ  / vibheteḥ
    smayateś ca ṇy-antād ātmanepadaṃ bhavati hetubhaye  / hetuḥ prayojakaḥ kartā lakāra-vācyaḥ,
    tataś ced bhayaṃ bhavati  / bhaya-grahaṇam upalakṣaṇa-artham, vismayo 'pi tata
    eva ? jaṭilo bhīṣayate  / muṇḍo bhīṣayate  / jaṭilo vismāpayate  / muṇḍo vismāpayate  /
    hetubhaye iti kim ? kuñcikayainaṃ bhāyayati  / rūpeṇa vismāyayati  / atra kuñcikā
    bhayasya karaṇam, na hetuḥ //
