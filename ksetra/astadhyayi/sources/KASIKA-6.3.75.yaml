source_id: KASIKA-6.3.75
locator:
  sutra: 6.3.75
witness_text:
  sutra: nabhrāṇ-napān-navedā-nāsatyā-namuci-nakula-nakha-napuṃsaka-nakṣatra-nakra-nākeṣu
    prakṛtyā
  commentary: nabhrāṭ napāt navedāḥ nāsatyāḥ namuci nakula nakha napuṃsaka nakṣatra
    nakra nāka ity eteṣu nañ prakṛtyā bhavati  / na bhrājate iti nabhrāṭ  / bhrājateḥ
    kvibantasya nañsamāsaḥ  / napāti iti napāt  / pātiḥ śatrantaḥ  / navetti iti navedāḥ  /
    vittirasunpratyayāntaḥ  / nāsatyāḥ - satsu sādhavaḥ satyāḥ, na satyāḥ asatyāḥ,
    na asatyāḥ nāsatyāḥ  / na muñcati iti namuciḥ  / mucerauṇādikaḥ kipratyayaḥ  /
    na asya kulam asti nakulaḥ  / nakha - na asya kham asti iti nakham  / napuṃsaka
    - na strī na pumān napuṃsakam  / strīpuṃsayoḥ puṃsakabhāvo nipātyate  / nakṣatra
    - na kṣarate kṣīyate iti vā najñātram  / kṣiyaḥ kṣaratervā kṣatram iti nipātyate  /
    nakra - na krāmati iti nakraḥ  / kramerḍapratyayo nipātanāt  / nāka - na asmin
    akamasti nākam // [#718]
