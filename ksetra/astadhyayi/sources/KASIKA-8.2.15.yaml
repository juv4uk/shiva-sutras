locator:
  sutra: 8.2.15
witness_text:
  sutra: chandasi iraḥ
  commentary: chandasi viṣaye ivarṇāntād rephāntāc ca+uttarasya matorvattvaṃ bhavati  /
    ivarṇāntāt tāvat - trivatī yājyānuvākyā bhavati  / harivo medinaṃ tvā  / adhipativatī
    juhoti caruragnivāniva  / ā revānetu mā viśat  / [#913] rayermatau iti samprasāraṇam  /
    sarasvatīvān bhāratīvān  / dadhīvāṃścaruḥ  / chandasi sarve vidhayo vikalpyante
    iti iha na bhavati, saptarṣimantam, ṛṣimān, ṛtīmān, sūryaṃ te dyāvāpṛthivīmantam
    iti  / rephāntāt gīrvān  / dhūrvān  / āśīrvān //
