source_id: KASIKA-1.3.8
locator:
  sutra: 1.3.8
witness_text:
  sutra: la-śa-kv ataddhite
  commentary: taddhita-varjitasya pratyayasy ādito vartamānā lakāra-śakāra-kavargā
    itsañjñā bhavanti  / lakaraḥ, lyuṭ ca (*3,3.115) - cayanam, jayanam  / śakāraḥ,
    kartari śap (*3,1.68) - bhavati, pacati  / kavargaḥ, ktaktavatū niṣṭhā (*1,1.26)
    - bhuktaḥ, bhuktavat  / priya-vaśo vadaḥ khac (*3,2.38) - priyaṃvadaḥ, vaśaṃvadaḥ  /
    glā-ji-sthaś ca gsnuḥ (*3,2.139) - glāsnuḥ, jiṣṇuḥ, bhūṣṇuḥ  / bhañja-bhāsa-mido
    ghurac (*3,2.161) - bhuaṅguram  / ṭā-ṅasiṅasām ina-āt-syāḥ (*7,1.12) - vṛkṣāt,
    vṛkśasya  / ataddhite iti kim ? cūḍhālaḥ  / lomaśaḥ  / karṇikā //
