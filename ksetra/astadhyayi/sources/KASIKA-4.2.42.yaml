source_id: KASIKA-4.2.42
locator:
  sutra: 4.2.42
witness_text:
  sutra: brāhmaṇa-māṇava-vāḍavād yan
  commentary: brāhmaṇādibhyaḥ śabdebhyo yan pratyayo bhavati tasya samūhaḥ ity etasmin
    viṣaye  / nakāraḥ svarārthaḥ  / brāhmaṇānāṃ samūhaḥ brāhmaṇyam  / māṇavyam  /
    vāḍavyam  / yan-prakaraṇe pṛṣṭhād upasaṅkhyānam  / pṛṣṭhānāṃ samūhaḥ pṛṣṭhyaḥ  /
    ahnaḥ khaḥ kratau  / ahṇāṃ samūhaḥ ahīnaḥ kratuḥ  / kratau iti kim ? āhnaḥ  /
    khaṇḍikādiṣu darśanādañ bhavati  / parśvā ṇas vaktavyaḥ  / parśūnāṃ samūhaḥ pārśvam  /
    padasañjñakatvād guṇo na bhavati  / vātādūlaḥ  / vātānāṃ samūhaḥ vātūlaḥ //
