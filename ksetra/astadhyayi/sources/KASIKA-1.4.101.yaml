source_id: KASIKA-1.4.101
locator:
  sutra: 1.4.101
witness_text:
  sutra: tiṅas trīṇi trīṇi prathama-madhyama-uttamāḥ
  commentary: tiṅo 'ṣṭādaśa pratyayāḥ  / nava parasmaipada-sañjñakāḥ, nava-ātmanepada-sañjñakāḥ  /
    tatra parasmaipradeṣu trayastrikāḥ yathākramaṃ prathama-madhyama-uttama-sañjñā
    bhavanti  / tip, tas, jhi iti prathamaḥ  / sip, thas, tha iti madyamaḥ  / mip,
    vas, mas iti uttamaḥ  / ātmanepadeṣu - ta, ātām, jha iti prathamaḥ  / thās, āthām,
    dhvam iti madhyāmaḥ  / iṭ, vahi, mahiṅ iti uttamaḥ  / prathama-madhyama-uttama-pradeśāḥ
    - śeṣe prathamaḥ (*1,4.108) ity evam ādayaḥ //
