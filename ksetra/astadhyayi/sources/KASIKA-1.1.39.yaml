source_id: KASIKA-1.1.39
locator:
  sutra: 1.1.39
witness_text:
  sutra: kṛn-m-ej-antaḥ
  commentary: kṛd yo ma-kāra-antaḥ, ej-antaś ca tad-antaṃ śabda-rūpam avyaya-sañjñaṃ
    bhavati  / svāduṅ-kāraṃ bhuṅkte  / sampannaṅ-kāraṃ bhuṅkte  / lavaṇaṅ-kāraṃ bhuṅkte  /
    ejantaḥ-vakṣe rāyaḥ  / tā vāmeṣe rathānām  / ṛtve dakṣāya jīvase  / jyok ca sūryaṃ
    dṛśe  / vakṣe iti vaceḥ tum-arthe se-sen-ase (*3,4.9) iti se-pratyaye kutve ṣatve
    ca kṛte rūpam  / eṣe iti iṇaḥ se-pratyaye guṇe ṣatve ca kṛte rūpam  / jīvase iti
    jīveḥ ase pratyaye rūpam  / dṛśe iti dṛśeḥ ken-pratyayo nipātyate - dṛśe vikhye
    ca (*3,4.11) iti  / anta-grahaṇam aupadeśika-pratipatty-artham  / iha mā bhūt
    - ādhaye, cikīrṣave, kumbha-kārebhyaḥ iti //
