source_id: KASIKA-3.2.124
locator:
  sutra: 3.2.124
witness_text:
  sutra: laṭaḥ śatṛ-śānacāv aprathamā-samānādhikaraṇe
  commentary: laṭaḥ śatṛśānacau ity etāv ādeśau bhavataḥ, aprathamāntena cet tasya
    sāmānādhikaraṇyaṃ bhavati  / pacantaṃ devadattaṃ paśya  / pacamānaṃ devadattaṃ
    paśya  / pacatā kṛtam  / pacamanena kṛtam  / aprathamā-samānādhikaraṇe iti kim
    ? devadattaḥ pacati  / laṭ iti vartamane punar laṅ-grahaṇam adhikavidhāna-artham  /
    kvacit prathamā-samānādhikaraṇe 'pi bhavati  / san brāhmaṇaḥ  / asti brāhmaṇaḥ  /
    vidyamānaḥ brāhmaṇaḥ  / vidyate brāhmaṇaḥ  / juhvat  / juhoti  / adhīyānaḥ  /
    adhīte // māṅyākrośe  / mā pacan  / mā pacamānaḥ  / kecid vibhāṣā-grahaṇam anuvartayanti
    na-nvor vibhāṣā (*3,2.121) iti  / sā ca vyavasthitā  / tatra yathā-darśanaṃ prayogā
    netavyāḥ //
