locator:
  sutra: 1.2.11
witness_text:
  sutra: liṅ-sicau ātmanepadeṣu
  commentary: parataḥ kitau bhavataḥ  / bhitsīṣṭa, bhutsīṣṭa  / sici khalvapi--abhitta,
    abuddha  / ikaḥ ity eva  / yakṣīṣṭa, ayaṣṭa  / samprasāraṇaṃ hi syāt  / ātmanepadeṣu
    iti kim ? asrākṣit  / adrākṣīt  / sṛji-dṛśor jhaly-am-akiti (*6,1.58) ity am-āgamo
    na syāt  / hal-antāt ity eva  / ceṣīṣṭa, aceṣṭa  / guṇo na syāt  / [#33] jhal
    ity eva vartiṣīṣṭa, avartiṣṭa  / guṇo na syāt  / [#34] liṅ-sicau iti kim ? dveṣṭā
    dvekṣyati //
