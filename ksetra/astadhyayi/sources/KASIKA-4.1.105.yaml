locator:
  sutra: 4.1.105
witness_text:
  sutra: garga-ādibhyo yañ
  commentary: gotre ity eva  / gargādibhyo gotrāpatye yañ pratyayo bhavati  / gārgyaḥ  /
    vātsyaḥ  / manu-śabdo 'tra paṭhyate  / tatra katham mānavī prajā ? gotre ity ucyate  /
    apatyasāmānye bhaviṣyati  / katham anantaro rāmo jāmadagnyaḥ, vyāsaḥ pārāśaryaḥ
    iti ? gotrarūpādhyāropeṇa bhaviṣyati  / anantarāpatyavivakṣāyāṃ tu ṛṣyaṇaiva bhavitavyaṃ
    jāmadagnaḥ, pārāśaraḥ iti  / garga  / vatsa  / vājā 'se  / saṃkṛti  / aja  / vyāghrapāt  /
    vidabhṛt  / prācīnayoga  / agasti  / pulasti  / rebha  / agniveśa  / śaṅkha  /
    śaṭha  / ghūma  / avaṭa  / camasa  / dhanañjaya  / manasa  / vṛkṣa  / viśvāvasu  /
    janamāna  / lohita  / śaṃsita  / babhru  / maṇḍu  / makṣu  / aligu  / śaṅku  /
    ligu  / gulu  / mantu  / jigīṣu  / manu  / tantu  / manāyī  / bhūta  / kathaka  /
    kaṣa  / taṇḍa  / vataṇḍa  / kapi  / kata  / kurukata  / anaḍuḥ  / kaṇva  / śakala  /
    gokakṣa  / agastya  / kuṇḍina  / yajñavalka  / ubhaya  / jāta  / virohita  / vṛṣagaṇa  /
    rahūgaṇa  / śaṇḍila  / vaṇa  / kaculuka  / mudgala  / musala  / parāśara  / jatūkarṇa  /
    māntrita  / saṃhita  / aśmaratha  / śarkarākṣa  / pūtimāṣa  / sthūṇa  / araraka  /
    piṅgala  / kṛṣṇa  / golunda  / ulūka  / titikṣa  / bhiṣaj  / bhaḍita  / bhaṇḍita  /
    dalbha  / cikita  / devahū  / indrahū  / ekalū  / pippalū  / vṛdagni  / jamadagni  /
    sulobhin  / ukattha  / kuṭīgu //
