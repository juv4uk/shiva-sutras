source_id: KASIKA-2.1.6
locator:
  sutra: 2.1.6
witness_text:
  sutra: avyayaṃ vibhakti-samīpa-samṛddhi-vyṛddhy-arthābhāva-atyaya-asamprati-śabdaprādurbhāva-paścād-yathā-ānupūrvya-yaugapadya-sādṛśya-sampatti-sākalya-antavcaneṣu
  commentary: sup supā iti ca vartate  / vibhaktyādiśv artheṣu yadavyayaṃ vartate
    tat samarthena sub-antena saha samasyate, avyayībhāvaś ca samāso bhavati  / vacana-grahaṇaṃ
    pratyekaṃ sambadhyate  / vibhaktivacane tāvat -- strīṣvadhikṛtya kathā pravartate
    adhistri  / adhikumāri  / saptamy-arthe yadavyayaṃ tad bibhaktivacanam  / samīpavacane
    -- kumbhasya samīpam upakumbham  / upamaṇikam  / samṛddhir ṛddher ādhikyam --
    samṛddhir madrāṇāṃ sumadram  / sumagadhaṃ vartate  / vyṛddhir ṛddher abhāvaḥ --
    gavadikānām ṛddher abhāvaḥ durgavadikam  / duryabanaṃ vartate  / artha-abhāvaḥ
    vastuno 'bhāvaḥ -- abhāvo makṣikāṇāṃ nirmakṣikam  / nirmaśakam vartate  / atyayaḥ
    abhūtatvam, atikramaḥ -- atītāni himāni atihimam  / nirhimam  / niḥśītaṃ vartate  /
    asamprati upabhogasya vartamānakāla-pratiṣedhaḥ -- atitasṛkam  / taisṛkamācchādanam,
    tasya ayam upabhogakālo na bhavati ity arthaḥ  / śabdaprādurbhāvaḥ prakāśatā śabdasya
    - iti pāṇini  / tat-pāṇini  / pāṇini-śabdo loke prakāśate ity arthaḥ  / paścāt
    -- anurathaṃ pādātam  / rathānāṃ paścāt ity arthaḥ  / yathā  / yathā-arthe yad
    avyayaṃ vartate tat samasyate  / yogyatā vipsā padārthānativṛttiḥ sādṛśyaṃ ca
    iti yathārthāḥ  / yogyatāyām -- anurūpam  / rūpayogyam bhavati ity arthaḥ  / vīpsāyām
    -- arthamarthaṃ prati pratyartham  / [#102] padārthanativṛttau -- yathāśakti  /
    ānupūrvyamanukramaḥ -- anujyeṣṭhaṃ praviśantu bhavantiaḥ  / jyeṣṭhānupūrvyā bhavantaḥ
    praviśantu ity arthaḥ  / yaugapadyam ekakālatā -- sacakram dhehi  / yugapaccakraṃ
    dhehi ity arthaḥ  / sādṛśyam tulyatā  / kim-artham idam ucyate, yathārtha ity
    eva siddham ? guṇabhūte 'pi sādṛśye yathā syāt, sadṛśaḥ kikhyā rākikhi  / sampattiḥ
    anurūpa ātmabhāvaḥ samṛddheranyaḥ -- sabrahma bābhravāṇām  / sakṣatraṃ śālaṅkāyanānām  /
    sāklyam aśeṣatā -- satṛṇam abhyāvaharati  / sabusam  / na kiṃcid abhyāvahāryaṃ
    parityajati ity ayamartho 'dhikārthavacanena pratipādyate  / antavacane -- antaḥ
    iti parigraha-apekṣayā samāptirucyate  / sāgni adhīte  / seṣṭi sapaśubandham  /
    sapaśubandhāntamadhīte ity arthaḥ  / iyaṃ samāptirasakale 'py adhyayane bhavati
    iti sākalyāt pṛthag ucyate //
