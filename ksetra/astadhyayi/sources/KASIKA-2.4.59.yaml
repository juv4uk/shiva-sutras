source_id: KASIKA-2.4.59
locator:
  sutra: 2.4.59
witness_text:
  sutra: paila-ādibyaś ca
  commentary: paila ity evam ādibhyaś ca yuva-pratyayasya lug bhavati  / pīlāyā vā
    (*4,1.118) ityaṇ, tasmad aṇo dvyacaḥ (*4,1.156) iti phiñ, tasya luk  / pailaḥ
    pitā  / pailaḥ putraḥ  / anye paila-ādayaḥ iñantāḥ tebhyaḥ iñaḥ prācām (*2,4.60)
    iti luki siddhe 'prāg-arthaḥ pāṭhaḥ  / paila  / śālaṅika  / sātyaki  / sātyakāmi  /
    daivi  / audamajji  / audavraji  / audameghi  / audabuddhi  / daivasthāni  / paiṅgalāyani  /
    rāṇāyani  / rauhakṣiti  / bhauliṅgi  / audgāhamāni  / aujjihāni  / tadrājāccāṇaḥ  /
    ākṛtigaṇo 'yam // [#168]
