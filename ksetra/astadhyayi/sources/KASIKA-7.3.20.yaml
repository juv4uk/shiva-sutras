source_id: KASIKA-7.3.20
locator:
  sutra: 7.3.20
witness_text:
  sutra: anuśatika-ādīnām ca
  commentary: anuśatika ity evam ādīnāṃ cāṅgānāṃ pūrvapadasya ca+uttarapadasya ca
    cāmāder acaḥ sthāne vṛddhir bhavati taddhite ñiti, ṇiti, kiti ca parataḥ  / anuśatikasya
    idam ānuśātikam  / anuhoḍena carati ānugauḍikaḥ  / anusaṃvaraṇe dīyate ānusāṃvaraṇam  /
    anusaṃvatsare dīyate ānusāṃvatsarikaḥ  / aṅgāraveṇuḥ nāma kaścit, tasya apatyam
    āṅgāravaiṇavaḥ  / asihatya - tatra bhavam āsihātyam  / asyahatya iti kecit paṭhanti,
    tato 'pi vimuktāditvādaṇ  / asyahatyaśabdo 'sminnadhyāye 'sti āsyahātyaḥ  / asyahetiḥ
    ity evam apare paṭhanti  / asyahetiḥ prayojanam asya āsyahaitikaḥ  / ata eva vacanādasya
    samudāyasya prātipadikatvaṃ vibhakteś ca aluk  / vadhyoga iti bidādiḥ ayam, tasya
    apatyam vādhyaugaḥ  / puṣkarasad, anuharat iti bāhvādiṣu paṭhyete  / pauṣkarasādiḥ  /
    [#836] ānuhāratiḥ  / kurukata gargādiḥ , kaurukātyaḥ  / kurupañcāla - kurupañcāleṣu
    bhavaḥ kaurupāñcālaḥ  / janapadasamudāyo janapadagrahaṇena na gṛhyate iti vuñ
    na bhavati  / udakaśuddhasya apatyam audakaśauddhiḥ  / ihaloka, paraloka - tatra
    bhavaḥ aihalaukikaḥ, pāralaukikaḥ  / lokottarapadasya iti ṭhañ  / sarvaloka -
    tatra viditaḥ sārvalaukikaḥ  / sarvapuruṣasya idam sārvapauruṣam  / sarvabhūmeḥ
    nimittaṃ saṃyogaḥ utpāto vā sārvabhaumaḥ  / prayoga - tatra bhavaḥ prāyaugikaḥ  /
    parastrī - pārastraiṇeyaḥ  / kulaṭāyā vā (*4,1.127) iti inaṅ  / rājapuruṣāt ṣyañi  /
    rājapauruṣyam  / ṣyañi iti kim ? rājapuruṣasya apatyam rājapuruṣāyaṇiḥ  / udīcāṃ
    vṛddhād agotrāt (*4,1.157) iti phiñ  / śatakumbhasukhaśayanādayaḥ - śatakumbhe
    bhavaḥ śātakaumbhaḥ  / saukhaśāyanikaḥ  / pāradārikaḥ  / sūtranaḍasya apatyam
    sautranāḍiḥ  / ākṛtigaṇaś ca ayam iṣyate  / tena idamapi siddhaṃ bhavati, abhigamamarhati
    ābhigāmikaḥ  / adhideve bhavam ādhidaivikam  / ādhibhautikam  / catasra eva vidyāḥ
    cāturvaidyam  / svārthe ṣyañ  / anuśatika  / anuhoḍa  / anusaṃvaraṇa  / anusaṃvatsara  /
    aṅgāraveṇu  / asihatya  / vadhyoga  / puṣkarasad  / anuharat  / kurukata  / kurupañcāla  /
    udakaśuddha  / ihaloka  / paraloka  / sarvaloka  / sarvapuruṣa  / sarvabhūmi  /
    prayoga  / parastrī  / rājapuruṣāt ṣyañi  / sūtranaḍa  / anuśatikādiḥ //
