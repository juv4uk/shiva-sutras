source_id: KASIKA-3.1.87
locator:
  sutra: 3.1.87
witness_text:
  sutra: karmavat karmaṇā tulyakriyaḥ
  commentary: karmaṇi kriyā karma, karmasthayā kriyayā tulyakriyaḥ kartā karmavad
    bhavati  / yasmin karmaṇi kartṛbhūte 'pi tadvat kriyā lakṣyate yathā karmaṇi,
    sa kartā karmavad bhavati  / karmāśrayāṇi kāryāṇi pratipadyate  / kartari śap
    (*3,1.68) iti kartṛ-grahaṇam iha anuvṛttaṃ prathamayā vipariṇamyate  / yagātmanepadaciṇciṇvadbhāvāḥ
    prayojanam  / bhidyate kāṣṭhaṃ svayam eva  / abhedi kāṣṭhaṃ svayam eva  / kāriṣyate
    kaṭaḥ svayam eva  / vatkaraṇaṃ svāśrayam api yathā syāt, bhidyate kusūlena iti  /
    akarmakāṇāṃ bhāve laḥ siddho bhavati  / liṅy-āśi-ṣyaṅ (*3,1.86) iti dvilakārako
    nirdeśaḥ  / tatra lānuvṛtter lāntasya kartā karmavad bhavati iti kusūlād dvitīyā
    na bhavati  / karmaṇā iti kim ? karaṇa-adhikaraṇa-abhyāṃ tulyakriyasya mā bhūt  /
    sādhvasiśchinatti  / sādhu sthālī pacati  / dhātv-adhikārāt samāne dhātau karmavad-bhāvaḥ  /
    iha na bhavati, pacaty odanaṃ devadattaḥ, rādhyanty odanaṃ svayam eva iti  / karmasthabhāvakānāṃ
    karmasthakriyāṇāṃ ca kartā karmavadbhavati, na kartṛsthābhāvakānāṃ na vā kartṛstha-kriyāṇām  /
    karmasthaḥ pacater bhāvaḥ karmasthā ca bhideḥ kriyā  / māsāsibhāvaḥ kartṛsthaḥ
    kartṛsthā ca gameḥ kriyā //
