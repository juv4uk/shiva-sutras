source_id: KASIKA-8.2.7
locator:
  sutra: 8.2.7
witness_text:
  sutra: nalopaḥ prātipadikāntasya
  commentary: padasya iti vartate  / prātipadikasya padasya yo 'ntyo nakāraḥ tasya
    lopo bhavati  / rājā  / rājabhyām  / rājabhiḥ  / rājatā  / rājataraḥ  / rājatamaḥ  /
    prātipadikagrahaṇaṃ kim ? ahannahim  / antagrahaṇaṃ kim ? rājānau  / rājānaḥ  /
    prātipadikagrahaṇam asamastam eva supāṃ suluk iti ṣaṣṭhyā lukā nirdiṣṭam  / ahno
    nalopapratiṣedho vaktavyaḥ  / ahaḥ  / ahobhyām  / ahobhiḥ  / ro 'supi (*8,2.69),
    ahan (*7,2.68) iti repharutvayor asiddhatvāt nalopaḥ prāpnoti, sāvakāśaṃ tadubhayaṃ
    sambuddhau, he 'haḥ, he dīrghāto nidāgheti ? tatra samādhimāhuḥ  / ahan iti ruvidhau
    yad upādīyate prathamaikavacanāntam akṛtanalopaṃ tad āvartyate, tatra ekayā āvṛttyā
    tad evaṃ rūpaṃ nalopābhāvārtham anvākhyāyate, dvitīyayāpi tasya ruḥ vidhīyate
    //
