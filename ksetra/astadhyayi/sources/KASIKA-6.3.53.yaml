locator:
  sutra: 6.3.53
witness_text:
  sutra: pad yaty atadarthe
  commentary: yatpratyaye parataḥ pādasya pad ity ayam ādeśo bhavaty atadarthe  /
    pādau vidhyanti padyāḥ śarkarāḥ  / padyāḥ kaṇṭakāḥ  / atadarthe iti kim ? pādārtham
    udakaṃ pādyam  / padbhāva ike caratāv upasaṅkhyānam  / pādabhyāṃ carati padikaḥ  /
    parpādibhyaḥ ṣṭhan (*4,4.10) iti pādaśabdāt ṣṭhan pratyayaḥ  / śarīrāvayavavacanasya
    pādaśabdasya grahaṇam iha iṣyat, tena paṇapādamāṣaśatad yat (*5,1.34) ity atra
    padādeśo na bhavati  / dvipādyam  / tripādyam // [#713]
