source_id: KASIKA-5.1.16
locator:
  sutra: 5.1.16
witness_text:
  sutra: tad asya tad asmin syād iti
  commentary: tad iti prathamā samarthavibhaktiḥ, asya iti pratyayārthaḥ, syāt iti
    prakṛtiviśeṣaṇam  / iti-karaṇo vivakṣārthaḥ  / evaṃ dvitīye 'pi vākye  / saptamy-arthe
    tu pratyaya ity etāvān viśeṣaḥ  / prathamāsamarthāt ṣaṣṭhyarthe saptamyarthe ca
    yathāvihitaṃ pratyayo bhavati, yat tat prathamāsamarthaṃ syāc cet tad bhavati  /
    iti-karaṇaḥ tataś ced vivakṣā  / prākāra āsāmiṣṭakānāṃ syāt prākārīyā iṣṭakāḥ  /
    prāsādīyaṃ dāru  / saptamyarthe khalv api - prākāro 'smin deśe syāt prākārīyo
    deśaḥ  / prāsādīyā bhūmiḥ  / syād iti sambhāvanāyāṃ liṅ, sambhāvane 'lam iti ced
    ity ādinā  / iṣṭakānāṃ vahutvena tat sambhāvyate prākāra āsāmiṣṭakānāṃ syāt iti  /
    deśasya ca guṇena sambhāvyate prāsādo 'smin deśe syāt iti  / prakṛtivikārabhāvastādarthyaṃ
    ca+iha na vivakṣitam  / kiṃ tarhi, yogyatāmātram  / tena pūrvasya ayam aviṣayaḥ  /
    dvistad-grahaṇaṃ nyāya-pradarśanārtham, anekasmin pratyayārthe pratyekaṃ samarthavibhaktiḥ
    sambandhanīyā iti  / atha+iha kasmān na bhavati, prāsādo devadattasya syāt iti
    ? guṇavānayaṃ sambhāvyate prāsādalābho 'sya iti  / iti-karaṇo vivakṣārthaḥ ity
    uktam // [#470]
