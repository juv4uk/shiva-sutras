source_id: KASIKA-3.1.129
locator:
  sutra: 3.1.129
witness_text:
  sutra: pāyya-sān-nāyya-nikāyya-dhāyyā māna-havir-nivāsa-sāmidhenīṣu
  commentary: pāyyādayaḥ śabdā nipātyante yathā-saṅkhyaṃ māne haviṣi nivāse sāmidhenyāṃ
    ca abhidheyāyām  / pāyya iti māṅo ṇyat-pratyayaḥ, ādeḥ patvaṃ ca nipātyate māne  /
    pāyyaṃ mānam meyam anyat  / sampūrvānnayater ṇyadāyādeśāv upasarga-dīrghatvaṃ
    ca nipātyate  / sānāyyaṃ haviḥ  / saṃneyamanyat  / rūḍhitvāc ca havir-viśeṣa eva
    avatiṣṭhate  / nipūrvāc cinoteḥ ṇyadāyādeśāvādikuvaṃ ca nipātyate  / nikāyyo nivāsaḥ  /
    niceyam anyat  / sāmidhenī-śabda ṛg-viśeṣasya vācakaḥ  / tatra ca dhāyyā iti na
    sarvā sāmidhenī ucyate, kiṃ tarhi, kācid eva  / rūdhi-śabdo hy ayam  / tathā ca
    asāmidhenyām api dṛśyate, dhāyyāḥ śaṃsatyagnirnetā taṃ somakratubhiḥ iti // [#206]
