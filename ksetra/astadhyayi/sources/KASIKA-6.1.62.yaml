source_id: KASIKA-6.1.62
locator:
  sutra: 6.1.62
witness_text:
  sutra: aci śīrṣaḥ
  commentary: śjādau taddhite śirasaḥ śīrṣaśabdaḥ ādeśo bhavati  / hastiśirasaḥ apatyaṃ
    hāstiśīrṣiḥ  / bāhvādibhyaś ca (*4,1.96) iti iñ  / sthūlaśirasaḥ idaṃ sthau laśīrṣam  /
    śīrṣanbhāve hi an (*6,4.167) iti prakṛtibhāvaḥ syāt  / hāstiśīrṣiśabdāt striyām
    iño 'ṇ-iñor anārṣayoḥ ṣyaṅādeśe kṛte śīrṣasya śiraḥśabdagrahaṇena grahaṇāt śīrṣannādeśaḥ
    prāpnoti  / tatra prakṛtibhāve sati hāstiśīrṣaṇyā ity aniṣṭaṃ rūpaṃ syāt  / iṣyate
    tu hāstiśīrṣyā iti  / tat katham ? kartavyo 'tra yatnaḥ  / aṇiñantād vā paraḥ
    pratyayaḥ ṣyaṅāśrayitavyaḥ, tatra yasya+iti lopasya sthānivadbhāvād vyavadhānam
    //
