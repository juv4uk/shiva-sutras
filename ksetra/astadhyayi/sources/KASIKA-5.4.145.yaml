witness_text:
  sutra: agrānta-śuddha-śubhra-vṛṣa-varāhebhyaś ca
  commentary: vibhāṣā ity eva  / agrāntāt śabdāt śuddha śubhra vṛṣa varāha ity etebhyaś
    ca parasya dantaśabdasya vibhāṣā datṛ ity ayam ādeśo bhavati samāsānto bahuvrīhau
    samāse  / kuḍmalāgradan,kuḍmalāgradantaḥ  / śuddhadan, śuddhadantaḥ  / śubhradan,
    śubhradantaḥ  / vṛṣadan, vṛṣadantaḥ  / varāhadan, varāhadantaḥ  / anuktasamuccayārthaḥ
    cakāraḥ  / ahidan, ahidantaḥ  / mūṣikadan, mūṣikadantaḥ  / gardabhadan, gardabhadantaḥ  /
    śikharadan, śikharadantaḥ //
