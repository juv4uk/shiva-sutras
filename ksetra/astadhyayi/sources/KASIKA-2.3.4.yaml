source_id: KASIKA-2.3.4
locator:
  sutra: 2.3.4
witness_text:
  sutra: antarā 'ntareṇa yukte
  commentary: dvitīyā svaryate, na tṛtīyā  / antarāntareṇa śabdau nipātau sāhacaryād
    gṛhyete  / ābhyāṃ yoge dvitīyā vibhaktir bhavati  / ṣaṣṭhy-apavādo 'yam yogaḥ  /
    tatra antarāśabdo madhyamādheya-pradhānam ācaṣṭe  / antareṇa śabdas tu tac ca
    vinārthaṃ ca  / antarā tvāṃ ca māṃ ca kamaṇḍaluḥ  / antareṇa tvāṃ ca māṃ ca kamaṇḍaluḥ  /
    antareṇa puruṣakāraṃ na kiṃcil labhyate  / yukta-grahaṇaṃ kim ? antarā takṣaśilāṃ
    ca pāṭaliputraṃ srughnasya prākāraḥ //
