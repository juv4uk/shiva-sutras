source_id: KASIKA-7.2.9
locator:
  sutra: 7.2.9
witness_text:
  sutra: ti-tu-tra-ta-tha-si-su-sara-ka-seṣu ca
  commentary: ti tu tra ta tha si su sara ka sa ity eteṣu kṛtsu iḍāgamo na bhavati  /
    ti iti ktiṅkticoḥ sāmanyagrahaṇam  / ktic - tanitā  / tanitum  / tantiḥ  / ktin
    - dīpitā  / dīpitum  / dīptiḥ  / tu - sitanigamimasisacyavidhāñkruśibhyastun  /
    sacitā  / sacitum  / saktuḥ  / tra - dāmnīśasayuyuja iti ṣṭran  / patitā  / patitum  /
    patram vāhanam  / uṇādiṣv api sarvadhātubhyaḥ ṣṭran  / tanitā  / tanitum  / tantram  /
    ta - hasimṛgriṇvā+amidamilūpūdhurvibhyastan  / hasitā  / hasitum  / hastaḥ  /
    lavitā  / lavitum  / lotaḥ  / pavitā  / pavitum  / potaḥ  / dhūrvitā  / dhūrvitum  /
    dhūrtaḥ  / auṇādikasya+eva taśabdasya grahaṇam iṣyate, na punaḥ ktasya, hasitam
    ity eva hi tatra bhavati  / tha - hanikuṣinīramikāśibhyaḥ kthan  / koṣitā  / koṣitum  /
    kuṣṭham  / kāśitā  / kāśitum  / kāṣṭham  / si - pluṣiśuṣikuṣibhyaḥ kṣiḥ  / koṣitā  /
    koṣitum  / kukṣiḥ  / suk ca iṣeḥ  / eṣitā  / eṣitum  / ikṣuḥ  / aśeḥ kṣaran  /
    aśitā  / aśitum  / akṣaram  / ka - iṇbhīkāpāśalyatimarcibhyaḥ kan  / śalitā  /
    śalitum  / śalkaḥ  / sa - vṝtṝvadihanikamikaṣibhyaḥ saḥ  / vaditā  / vaditum  /
    vatsaḥ  / titutratatheṣvagrahādīnām iti vaktavyam  / grahādayo grahaprakārāḥ,
    yeṣām iṭ ktini dṛśyate  / nigṛhītiḥ  / upasnihitiḥ  / nikucitiḥ  / nipaṭhitiḥ  /
    kṛti ity eva, roditi  / svapiti //
