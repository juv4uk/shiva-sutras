source_id: KASIKA-7.2.10
locator:
  sutra: 7.2.10
witness_text:
  sutra: ekāca upadeśe 'nudāttāt
  commentary: upadeśe ya ekāc dhātur anudāttaś ca tasmād iḍāgamo na bhavati  / prakṛtyāśrayo
    'yaṃ pratiṣedhaḥ  / ke punar upadeśe 'nudāttāḥ ? ye tathā gaṇe paṭhyante, ta eva
    vispaṣṭārtham aniṭkārikāsu pravibhaktāḥ pradarśyante  / [#800] aniṭsvarānto bhavati
    iti dṛśyatāmimāṃstu seṭaḥ pravadanti tadvidaḥ  / adantamṝdantamṛtāṃ ca vṛṅvṛñau
    śviḍīṅivarṇeṣv atha śīṅśriñāvapi // guṇasthamūdantamutāṃ ca rusnuvau kṣuvaṃ tathorṇotimatho
    yuṇukṣṇavaḥ  / iti svarāntā nipuṇaṃ samuccitāstato halantān api sannibodhata //
    dvaye eva dhātavaḥ, svarāntāḥ vyañjanāntāś ca  / tatra sarve svarāntāḥ ekācaḥ
    anudāttāḥ  / avadhiṣṭa  / ṝdantam - taritā, tarītā  / ṛtāṃ ca vṛṅvṛñau - nirvaritā,
    nirvarītā  / pravaritā, pravarītā  / śviḍīṅivarṇeṣvatha śīṅśriñāvapi - śvayitā  /
    uḍḍayitā  / śayitā  / śrayitā  / gaṇasthamūdantam - lavitā  / pavitā  / utāṃ ca
    ursnuvau kṣuvaṃ tathorṇotimatho yuṇukṣṇavaḥ - ravitā  / prasnavitā  / kṣavitā  /
    prorṇavitā  / vācya ūrṇorṇuvadbhāvo yaṅprasiddhiḥ prayojanam ity atideśād ekāctvam
    ūrṇoter asti iti udātta upadiśyate  / yavitā  / navitā  / kṣṇavitā  / iti svarāntā
    nipuṇaṃ samuccitās tato halantān api sannibodhata  / śakistu kānteṣvaniḍeka iṣyate
    ghasiśca sāntesu vasiḥ prasāraṇī  / ghasiḥ prakṛtyantaram asti - ghastā  / vasiḥ
    prasāraṇī - vastā  / prasāraṇī iti kim ? vasitā vastrāṇām  / vasa nivāse ity asya
    yajāditvāt saṃprasāraṇaṃ vihitam, na tu vasa ācchādane ity asya  / sabhistu bhānteṣv
    atha maithune yabhistatastṛtīyo labhireva netare // ārabdhā  / yabdhā  / labdhā  /
    yamiryamanteṣvaniḍeka iṣyate ramisca yaśca śyani paṭhyate maniḥ  / namiścaturtho
    hanireva pañcamo gamiśca ṣaṣṭhaḥ pratiṣedhavācinām // yantā  / rantā  / mantā  /
    śyani iti kim ? manuteḥ manitā ity eva bhavati  / nantā  / hantā  / gantā  / dihirduhirmehatirohatī
    vahirnahistu ṣaṣtho dahatistathā lihiḥ  / ime 'niṭo 'ṣṭāviha muktasaṃśayā gaṇeṣu
    hāntāḥ pravibhajya kīrtitāḥ // degdhā  / dogdhā  / meḍhā  / roḍhā  / voḍhā  /
    naddhā  / dagdhā  / leḍhā  / muktasaṃśayāḥ iti kim ? tantrāntare catvāro 'pare
    paṭhyante  / sahimuhirihiluhayaḥ  / tatra sahervikalpastakārādau, muhirapi radhādau
    paṭhyate, tena tau sasaṃśayau savikalpau  / itarau tu dhātuṣu na paṭhyete, kaiścidabhyupagamyete
    iti svarūpeṇa+eva sasaṃśayau  / [#801] diśiṃ dṛśiṃ daṃśimatho mṛśiṃ spṛśiṃ riśiṃ
    ruśiṃ krośatimaṣṭamaṃ viśim  / liśaṃ ca śāntānaniṭaḥ purāṇagāḥ paṭhanti pāṭheṣu
    daśaiva netarān // deśṭā  / draṣtā  / daṃṣṭā  / āmraṣṭā, āmarṣṭā  / spraṣṭā, sparṣṭā  /
    ṛdupadhānām udāttopadeśānāṃ mṛjidṛśī varjayitvā anudāttasya cardupadhasya anyatarasyām
    (*6,1.59) iti ramāgamavikalpaḥ  / reṣṭā  / roṣṭā  / kroṣṭā  / praveṣṭā  / leṣṭā  /
    rudhiḥ sarādhiryudhibandhisādhayaḥ krudhakṣudhī śudhyatibudhyatī vyadhiḥ  / ime
    tu dhāntā daśa ye 'niṭo matāstataḥ paraṃ sidhyatir eva netare // roddhā  / rāddhā  /
    yoddhā  / banddhā  / sāddhā  / kroddhā  / kṣoddhā  / śoddhā  / boddhā  / vyaddhā  /
    seddhā  / budhyatisidhyatyoḥ śyanā nirdeśāt nyāyyavikaraṇayor buddhisidhyor iḍ
    bhavaty eva  / bodhitā  / sidhitā  / niṣṭhāyāmāpi pratiṣedhābhāvāt budhitam, sidhitam
    ity eva bhavati  / śiṣiṃ piṣiṃ śuṣyatipuṣyatī tviṣiṃ viṣiṃ śliṣiṃ tuṣyatiduṣyatī
    dviṣim  / imān  / daśaivopadiśantyaniḍvidhau gaṇeṣu ṣāntān kṛṣikarṣatī tathā //
    śeṣṭā  / peṣṭā  / śoṣṭa  / poṣṭā  / tveṣṭā  / veṣṭā  / śleṣṭa  / toṣṭā  / doṣṭā  /
    dveṣṭā  / kraṣṭa  / karṣṭā  / kṛṣestaudādikasya bhauvādikasya ca kṛṣikarṣatī iti
    nirdeśaḥ  / tapiṃ tipiṃ cāpimatho vapiṃ svapiṃ lipiṃ lupiṃ tṛpyatidṛpyatī sṛpim  /
    svareṇa vīcena śapiṃ chupiṃ kṣipiṃ pratīhi pāntān paṭhitāṃstrayodaśa // taptā  /
    teptā  / āptā  / vaptā  / svaptā  / leptā  / loptā  / tṛpyatidṛpyatyor anudāttatvamamāgamārthameva  /
    iṭ tvanayoḥ radhādipāṭhād vikalpena bhavati  / traptā, tarptā, tarpitā  / draptā,
    darptā, darpitā  / tudādiṣu tu yau tṛpidṛpī tāvudattāveva  / sraptā, sarptā  /
    śaptā  / choptā  / kṣeptā  / adiṃ hadiṃ skandibhidicchidikṣudīn śadiṃ sadiṃ svidyatipad
    yatī khidim  / tudiṃ nudiṃ vidyati vinta ity api pratīhi dāntān daśa pañca cāniṭaḥ
    // attā  / hattā  / skantā  / bhettā  / chettā  / kṣottā  / śattā  / sattā  /
    svettā  / svidyati iti śyanā nirdeśo ñiṣvidā ity asya grahaṇaṃ mā bhūt iti  /
    udātta eva ayam  / pattā  / khettā  / tottā  / nottā  / vettā  / vidyati vinta
    ity api śyanā śnamā ca nirdeśo 'nyavikaraṇanivṛttyarthaḥ  / vettivindatī udāttau
    eva  / veditā vidyānām  / veditā dhanānām  / [#802] paciṃ vaciṃ viciricirañjipṛcchatīn
    nijiṃ siciṃ mucibhajibhañjibhṛjjātīn  / tyajiṃ yajiṃ yujirujisañjimajjatīn bhujiṃ
    svajiṃ sṛjimṛjī viddhyaniṭsvarān // paktā  / vaktā  / vivektā  / rektā  / raṅktā  /
    praṣṭā  / nirṇektā  / sektā  / moktā  / bhaktā  / bhaṅktā  / bhraṣṭā, bharṣṭā  /
    tyaktā  / yaṣṭā  / yoktā  / roktā  / saṅktā  / maṅktā  / bhoktā  / pariṣvaktā  /
    sraṣṭā  / mārṣṭā  / mṛjirayamūdit paṭhyate, tato 'sya vikalpena iṭā bhavitavyam  /
    mārṣṭā, marjitā iti, amāgamo 'py asya na dṛśyate ? tad iha pāṭhasya prayojanaṃ
    cintyam  / kecid asya sthāne vijiṃ paṭhanti, sṛjiṃ vijiṃ viddhyaniṭsvarān iti  /
    nijādiṣu yo vijirasau aniḍiṣyate  / tathā ca tantrāntare nijivijiṣvañjivarjam
    ity uktam  / ekāca iti kim ? avadhīt  / vṛddhinivṛttyarthamadanto vidhir upadiśyate  /
    upadeśagrahaṇaṃ kim ? iha ca yathā syāt, laviṣyati, paciṣyati  / iha ca mā bhūt,
    kartā kaṭān, kartum iti //
