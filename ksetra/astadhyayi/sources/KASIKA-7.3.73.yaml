source_id: KASIKA-7.3.73
locator:
  sutra: 7.3.73
witness_text:
  sutra: lug vā duha-diha-liha-guhām ātmanepade dantye
  commentary: duha diha liha guha ity eteṣām aṅgānām ātmanepade dantyādau parataḥ
    kṣasya vā lug bhavati  / adugdha, adhukṣata  / adhugdhāḥ, adhukṣathāḥ  / adugdhvam,
    adhukṣadhvam  / aduhvahi, adhukṣāvahi  / diha - adigdha, adhikṣata  / liha - alīḍha,
    alikṣata  / guha - nyagūḍha, nyaghukṣata  / duhādīnām iti kim ? vyatyapukṣata  /
    ātmanepade iti kim ? adhukṣat  / dantye iti kim ? adhukṣāmahi  / lopa iti vartamāne
    luggrahaṇaṃ sarvādeśārtham  / tac ca bahyartham  / anyatra tu antyasya+eva lope
    kṛte jhalo jhali (*8,2.26) iti sakāralopena sidhyati  / sthānivadbhāvo 'pi akāralopasya
    na asti, pūrvatra asiddhe na sthānivat iti  / dantyoṣṭho 'pi vakāro dantya iti
    gṛhyate  / yadi sa na gṛhyeta tataḥ taugrahaṇam eva atra kṛtaṃ syāt // [#850]
