locator:
  sutra: 6.2.126
witness_text:
  sutra: cela-kheṭa-kaṭuka-kāṇḍaṃ garhāyām
  commentary: cela kheṭa katuka kāṇḍa ity etāni uttarapadāni tatpuruse samāse garhāyāṃ
    gamyamānāyām ādyudāttāni bhavanti  / putracelam  / bhāryācelam  / upānatkheṭam  /
    nagarakheṭam  / dadhikaṭukam  / udaśvitkaṭukam  / bhūtakāṇḍam  / prajākāṇḍam  /
    celāadisādṛśyena putrādīnāṃ garhā  / tatra putraḥ celam iva iti vigṛhya vyāghrāder
    ākṛtigaṇatvād upamitaṃ vyāghrādibhiḥ iti samāsaḥ  / garhāyām iti kim  / paramacelam
    //
