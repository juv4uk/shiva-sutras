source_id: KASIKA-6.1.176
locator:
  sutra: 6.1.176
witness_text:
  sutra: hrasva-nuḍbhyāṃ matup
  commentary: antodāttāt ity eva  / hrasvāntād antodāttān nuṭaś ca paro matub udātto
    bhavati  / agnimāt  / vāyumān  / kartṛmān  / hartṛmān  / nuṭaḥ khalv api - akṣaṇvatā  /
    śīrṣaṇvatā  / antodāttāt ity eva, vasumān  / vasuśabda ādyudāttaḥ, tasmān matub
    anudātta eva bhavati  / atra ca svaravidhau vyañjanam avidyamānavat ity eṣā paribhāṣā
    na aśrīyate nuḍgrahaṇāt, tena marutvān ity atra na bhavati  / [#642] reśabdāc
    ca matupa udāttattvaṃ vaktavyam  / ārevān  / treś ca pratiṣedho vaktavyaḥ  / trivatīryājyānuvākyā
    bhavati iti //
