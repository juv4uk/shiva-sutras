source_id: KASIKA-3.1.48
locator:
  sutra: 3.1.48
witness_text:
  sutra: ṇi-śri-dru-srubhyaḥ kartari caṅ
  commentary: sij-apavādaś caṅ vidhīyate  / ṇy-antebhyo dhātubhyaḥ, śri dru sru ity
    etebhyaś ca parasya cleḥ caṅ-ādeśo bhavati kartavācini luṅi parataḥ  / ṅakāro
    guṇa-vṛddhi-pratiṣedha-arthaḥ, cakāraḥ caṅi (*6,1.11) iti viśeṣaṇa-arthaḥ  / acīkarat  /
    ajīharat  / aśiśriyat  / adudruvat  / asusruvat  / kartari iti kim ? akārayiṣātāṃ
    kaṭau devadattena  / kamer upasaṅkhyānam  / āyādayaḥ ārdhadhātuke vā (*3,1.31)
    iti yadā ṇiṅ na asti tadaa+etat upasaṅkhyānam  / acakamata  / ṇiṅpakṣe sanvadbhāvaḥ  /
    acīkamata  / nākamiṣṭasukhaṃ yānti suyuktair vaḍavārathaiḥ  / atha patkaṣiṇo yānti
    ye 'cīkamatabhāṣiṇaḥ //
