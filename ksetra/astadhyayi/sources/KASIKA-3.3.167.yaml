witness_text:
  sutra: kāla-samaya-velāsu tumun
  commentary: kālādiṣu upapadesu dhātoḥ tumun pratyayo bhavati  / kālo bhoktum  /
    velā bhoktum  / iha kasmān na bhavati, kālaḥ pacati bhūtāni iti ? praiṣādi-grahaṇam
    iha abhisambadhyate  / iha kasmān na bhavati, [#290] kālo bhojanasya ? vāsarūpena
    lyuḍ api bhavati  / uktam idam, stry-adhikārāt paratra vāsarūpa-vidhir anityaḥ
    iti //
