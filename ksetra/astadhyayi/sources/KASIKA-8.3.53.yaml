witness_text:
  sutra: ṣaṣṭhyāḥ pati-putra-pṛṣṭha-pāra-pada-payas-poṣeṣu
  commentary: ṣaṣthīvisarjanīyasya sakārādeśo bhavati pati putra pṛṣṭha pāra pada
    payas poṣa ity eteṣu parataḥ chandasi viṣaye  / vācaspatiṃ viśvakarmāṇamūtaye  /
    putra - divasputrāya sūryāya  / pṛṣṭha - divaspṛṣṭhe dhāvamānaṃ suparnam  / pāra
    - aganma tamasaspāram  / pada - ilaspade samidhyase  / payas - sūryaṃ cakṣurdivaspayaḥ  /
    poṣa - rāyaspoṣaṃ yajamāneṣu dhāraya  / ṣaṣṭhyāḥ iti kim ? manuḥ putrebhyo dāyaṃ
    vyabhajat // [#951]
