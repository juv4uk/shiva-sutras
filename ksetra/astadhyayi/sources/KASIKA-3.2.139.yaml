source_id: KASIKA-3.2.139
locator:
  sutra: 3.2.139
witness_text:
  sutra: glā-ji-sthaś ca kṣnuḥ
  commentary: chandasi iti nivṛttam  / glā ji sthā ity etebhyo dhātubhyaḥ, cakārāt
    bhuvaś ca tacchīlādiṣu kṣnuḥ pratyayo bhavati  / glāsnuḥ  / jiṣṇuḥ  / sthāsnuḥ  /
    bhūṣṇuḥ  / giccāyaṃ pratyayo na kit  / tena sthaḥ īkāro na bhavati  / kṅiti ca
    (*1,1.5) ity atra gakāro 'pi cartvabhūto nirdiśyate, tena guṇo na bhavati  / śryukaḥ
    kiti (*7,2.11) ity atra api gakaro nirdiśyate, tena bhuva iḍ na bhavati  / [#242]
    kṣtorgittvān na stha īkāraḥ kaṅitorītvaśāsanāt  / guṇābhāvastriṣu smāryaḥ śryuko
    'niṭtvaṃ gakoritoḥ // daṃśeśchandasy upasaṅkhyānam  / daṃkṣṇavaḥ paśavaḥ  /
