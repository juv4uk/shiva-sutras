source_id: KASIKA-8.1.15
locator:
  sutra: 8.1.15
witness_text:
  sutra: dvandvaṃ rahasya-maryādāvacana-vyutkramaṇa-yajñapātraprayoga-abhivyaktiṣu
  commentary: dvandvam iti dviśabdasya dvirvacanam, pūrva padasyāmbhāvaḥ, attvaṃ ca+uttarapadasya
    nipātyate rahasya maryādāvacana vyutkramaṇa yajñapātraprayoga abhivyakti ity eteṣu
    artheṣu  / tatra rahasyaṃ dvandvaśabdavācyam, itare viṣayabhūtāḥ  / dvandvaṃ mantrayate  /
    maryādāvacane - maryādā sthītyanatikramaḥ  / ācaturaṃ hīme paśavo dvandvaṃ mithunīyanti  /
    mātā putreṇa mithunaṃ gacchati, pautreṇa, tatputreṇa api iti maryādārthaḥ  / vyutkramaṇe
    - dvandvaṃ vyutkrāntāḥ  / vyutkramaṇaṃ bhedaḥ, pṛthagavasthānam  / dvivargasambandhanena
    pṛthagavasthitā dvanvdvaṃ vyutkrāntā ity ucyante  / yajñapātraprayoge - dvandvaṃ
    nyañci yajñapātrāṇi prayunakti dhīraḥ  / abhivyaktau - dvandvaṃ nāradaparvatau  /
    dvandvaṃ saṅkarṣaṇavāsudevau  / dvāvapyabhivyaktau sāhacaryeṇa ity arthaḥ  / anyatra
    api dvandvam ity etad dṛśyate, tadarthaṃ yogavibhāgaḥ kartavyaḥ, dvandvaṃ yuddhaṃ
    vartate, dvandvāni sahate dhīraḥ, cārthe dvandvaḥ (*2,2.29) iti //
