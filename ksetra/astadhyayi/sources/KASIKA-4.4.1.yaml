source_id: KASIKA-4.4.1
locator:
  sutra: 4.4.1
witness_text:
  sutra: prāg vahateṣ ṭhak
  commentary: tad vahati ratha-yuga-prāsaṅgam (*4,4.76) iti vakṣyati  / prāgetasmād
    vahatisaṃśabdanād yānarthān anukramamiṣyāmaḥ, ṭhak pratyayas teṣv adhikṛto veditavyaḥ  /
    vakṣyati - tena dīvyati khanati jayati jitam (*4,4.2) iti  / akṣair dīvyati ākṣikaḥ  /
    ṭhak-prakaraṇe tadāheti māśabdādibhya upasaṅkhyānam  / māśabdaḥ ity āha māśabdikaḥ  /
    naityaśabdikaḥ kāryaśabdikaḥ  / vākyād etat pratyayavidhānam  / āhau prabhūtādibhyaḥ  /
    prabhūtam āha prābhūtikaḥ  / pāryāptikaḥ  / kriyāviśeṣaṇat pratyayaḥ  / pṛcchatau
    susnātādibhyaḥ  / susnataṃ pṛcchati sausnātikaḥ  / saukharātrikaḥ  / saukhaśāyanikaḥ  /
    gacchati paradārādibhyaḥ  / paradārān gacchati pāradārikaḥ  / gaurutalpikaḥ //
