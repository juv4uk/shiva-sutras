source_id: KASIKA-6.1.125
locator:
  sutra: 6.1.125
witness_text:
  sutra: pluta-pragṛhyā aci
  commentary: plutāś ca pragṛhyāś ca aci prakṛtyā bhavanti  / devadatta3atra nv asi  /
    yajñadatta3idam ānaya  / āśrayād atra plutaḥ siddhaḥ  / pragṛhyāḥ - agnī iti  /
    vāyū iti  / khaṭve iti  / māle iti  / aci ity anuvartamāne punar ajgrahaṇam ādeśanimittasya
    aciḥ parigrahārtham  / tena+iha na bhavati, jānu u asya rujati jānvasya rujati  /
    pragṛhyād ukārāt parasya akārasya savarṇadīrghatvaṃ pratyanimittatvād atra prakṛtibhāvo
    na bhavati  / nityagrahaṇam iha anuvartate  / plutapragṛhyāṇāṃ nityam ayam eva
    prakṛtibhāvo yathā syād, iko 'savarṇe śākalyasya hrasvaś ca (*6,1.127) ity etan
    mā bhūt iti // [#629]
