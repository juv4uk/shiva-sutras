witness_text:
  sutra: ghasi-bhasor hali ca
  commentary: ghasi bhasa ity etayoḥ chandasi upadhāyā lopo bhavati lahādau ajādau
    ca kgiti pratyaye parataḥ  / sagdhiś ca me sapītiś ca me  / babdhām te harī dhānāḥ  /
    sagdhiḥ iti adeḥ ktini bahulaṃ chandasi iti ghaslādeśe upadhāyāḥ lope ca kṛte
    jhalo jhali (*8,2.26) iti sakāralopaḥ  / dhatvaṃ takārasya, jaśtvaṃ ghakārasya  /
    tataḥ samānā gdhiḥ sagdhiḥ iti samāse kṛte samānasya sabhāvaḥ  / babdhām iti bhaser
    loṭi tāmi ślau dvirvacane kṛte upadhālopasalopadhatvajaśtvāni kartavyāni  / dvirvacanāt
    paratvān nityatvāc ca upadhālopaḥ prāpnoti, chāndasatvāt sa tathā na kriyate  /
    ajādau - bapsati  / kṅiti ity eva, aṃśūn babhasti //
