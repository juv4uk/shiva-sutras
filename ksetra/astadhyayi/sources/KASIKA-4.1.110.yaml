witness_text:
  sutra: aśvādibhyaḥ phañ
  commentary: āṅgirasa iti nivṛttam  / aśvādibhyaḥ gotrāpatye phañ pratyayo bhavati  /
    āśvāyanaḥ  / āśmāyanaḥ  / ye tv atra pratyayāntāḥ paṭhyante tebhyaḥ sāmārthyād
    yūni pratyayo vijñāyate  / aśva  / aśman  / śaṅkha  / bida  / puṭa  / rohiṇa  /
    kharjūra  / kharjūla  / piñjūra  / bhaḍila  / bhaṇḍila  / bhaḍita  / bhaṇḍita  /
    bhaṇḍika  / prahṛta  / rāmoda  / kṣatra  / grīvā  / kāśa  / golāṅkya  / arka  /
    svana  / dhvana  / pāda  / cakra  / kula  / pavitra  / gomin  / śyāma  / dhūma  /
    dhūmra  / vāgmin  / viśvānara  / kuṭa  / veśa  / śapa ātreye  / natta  / taḍa  /
    naḍa  / grīṣma  / arha  / viśamya  / viśālā  / giri  / capala  / cunama  / dāsaka  /
    vailya  / dharma  / ānaḍuhya  / puṃsijāta  / arjuna  / śūdraka  / sumanas  / durmanas  /
    kṣānta  / prācya  / kita  / kāṇa  / cumpa  / śraviṣṭhā  / vīkṣya  / pavindā  /
    ātreya bhāradvāje  / kutsa  / ātava  / kitava  / śiva  / khadira  / bhāradvāja
    ātreye //
