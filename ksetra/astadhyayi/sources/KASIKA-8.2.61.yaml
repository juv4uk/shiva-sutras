source_id: KASIKA-8.2.61
locator:
  sutra: 8.2.61
witness_text:
  sutra: nasatta-niṣatta-anutta-pratūrta-sūrta-gūrtāni chandasi
  commentary: nasatta niṣatta anutta pratūrta sūrta gūrta ity etāni chandasi viṣaye
    nipātyante  / nasatta, niṣatta iti sadeḥ naṇpūrvāt nipūrvāc ca natvābhāvo nipātyate  /
    nasattamañjasā  / nasannam iti bhaṣāyām  / niṣattaḥ  / niṣaṇṇaḥ iti bhāṣāyām  /
    anuttam iti undeḥ nañpūrvasya nipātanam  / anuttamā te maghavan  / anunna iti
    bhāṣāyām  / praturtam iti tvarateḥ turvī ity etasya vā nipātanam  / pratūrtaṃ
    vājin  / pratūrṇam iti bhāṣāyām  / sūrtam iti sṛ ity etasya utvaṃ nipātyate  /
    sūrtā gāvaḥ  / sṛtā gāvaḥ iti bhāṣāyām  / gūrtam iti gūrī ity etasya natvābhāvo
    nipātyate  / gūrtā amṛtasya  / gūrṇam iti bhāṣāyām // [#925]
