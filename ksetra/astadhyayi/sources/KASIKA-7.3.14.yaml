source_id: KASIKA-7.3.14
locator:
  sutra: 7.3.14
witness_text:
  sutra: prācāṃ grāma-nagarāṇām
  commentary: prācāṃ deśe grāmanagarāṇāṃ diśa uttareṣām acāmāder aco vṛddhir bhavati
    taddhite ñiti, ṇiti, kiti ca parataḥ  / grāmāṇām - pūrveṣukāmaśamyāṃ bhavaḥ pūrvaiṣukāmaśamaḥ  /
    aparaiṣukāmaśamaḥ  / pūrvakārṣṇamṛttikaḥ  / aparakārṣṇamṛttikaḥ  / nagarāṇām -
    pūrvasmin pāṭaliputre bhavaḥ pūrvapāṭaliputrakaḥ  / [#834] aparapāṭaliputrakaḥ  /
    pūrvakānyakubjaḥ  / aparakānyakubjaḥ  / grāmatvād eva nagarāṇām api grahaṇe siddhe
    bhedena yad ubhayor upādānaṃ tat sambandhabhedapratipattyartham  / dikpūrvapado
    hi samudāyaḥ pūrveṣukāmaśamyādiḥ grāmanāmadheyam  / pāṭaliputrādiḥ punar uttarapadam
    eva nagaram āha  / tatra grāmavācinām aṅgānām avayavasya dikśabdād uttarasya nagaravācinām
    uttarapadānām avayavasya ca vṛddhir bhavati ity evam abhisambandhaḥ kriyate  /
    itaratra tu diśa uttareṣām nagarāṇām ity eva  / pūrvaiṣukāmaśamaḥ ity evam ādiṣu
    kṛtāyām uttarapadavṛddhau ekādeśo bhavati iti jñāpi ta nendrasya parasya (*7,3.22)
    iti pratiṣedhena //
