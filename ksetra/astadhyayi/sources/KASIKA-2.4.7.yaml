source_id: KASIKA-2.4.7
locator:
  sutra: 2.4.7
witness_text:
  sutra: viśiṣṭa-liṅgo nadī deśo 'grāmāḥ
  commentary: viśiṣta-liṅgānāṃ bhinna-liṅgānāṃ nadī-vācināṃ śabdānāṃ deśavacināṃ ca
    grāma-varjitānaṃ dvandva ekavad bhavati  / nady-avayavo dvandvo nadī ity ucyate  /
    deśa-avayavaś ca deśaḥ  / nadī deśaḥ ity asamāsa-nirdeśa eva ayam  / uddhyaś ca
    irāvatī ca uddhyer āvati  / gaṅgāśoṇam  / deśaḥ khalv api - kuravaś ca kurukṣetraṃ
    ca kurukurukṣetram  / kurukurujāṅgalam  / viśiṣṭa-liṅgaḥ iti kim ? gaṅgā-yamune  /
    madrakekayāḥ  / nadī deśaḥ iti kim ? kukkuṭamayūryau  / agrāmāḥ iti kim ? jāmbavaś
    ca śālūkinī ca jāmbava-śālūkinyau  / nadī-grahaṇamadeśatvāt  / janapado hi deśaḥ  /
    tathā ca parvatānāṃ grahaṇaṃ na bhavati, kailāsaś ca gandhamādanaṃ ca kailāsa-gandhamādane  /
    agrāmā ity atra nagarānāṃ pratiṣedho vaktavyaḥ  / iha mā bhūt, mathurā ca pāṭaliputraṃ
    ca mathurā-pāṭaliputram  / ubhayataś ca grāmāṇāṃ pratiṣedho vaktavyaḥ  / sauryaṃ
    ca nagaraṃ, ketavataṃ ca grāmaḥ saurya-ketavate // [#155]
