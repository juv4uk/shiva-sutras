source_id: KASIKA-3.4.77
locator:
  sutra: 3.4.77
witness_text:
  sutra: lasya
  commentary: lasya ity ayam adhikāraḥ  / akāra uccārana-arthaḥ  / lakāramātraṃ sthānitvena
    adhikriyate  / yad iti ūrdhvam anukramiṣyāmaḥ lasya ity evaṃ tad veditavyam  /
    kiṃ ca+idaṃ lasya iti ? daśa lakārā anubandha-viśiṣṭā vihitā artha-viśeṣe kāla-viśeṣe
    ca  / teṣāṃ viśeṣakarān anubandhān utsṛjya yat sāmānyaṃ tad gṛhyate  / ṣaṭ ṭitaḥ,
    catvāraḥ ṅitaḥ  / akṣarasamāmnāyavadānupūrvyā kathyante  / laṭ  / liṭ  / luṭ  /
    lṛṭ  / leṭ  / loṭ  / laṅ  / liṅ  / luṅ  / lṛṅ  / iti  / atha lakāramātrasya grahaṇam
    kasmān na bhavati, lunāti, cūḍālaḥ iti ? dhātv-adhikāro 'nuvartate, kartrādayaś
    ca viśeṣakāḥ // [#310]
