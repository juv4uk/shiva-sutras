source_id: KASIKA-1.3.4
locator:
  sutra: 1.3.4
witness_text:
  sutra: na vibhaktau tusmāḥ
  commentary: pūrveṇa prāptāyamitsañjñāyāṃ vibhāktau vartamānānāṃ tavarga-sakāra-makaraṇāṃ
    pratiṣedha ucyate  / tavargaḥ, ṭā-ṅasi-ṅasām ina-āt-syāḥ (*7,1.12) - vṛkṣāt, plakṣāt  /
    sakāraḥ, jas - brāhmaṇāḥ  / [#52] tas - pacataḥ  / thas - pacathaḥ  / makāraḥ
    - upacattām, apacatam  / bibhaktau iti kim ? aco yat (*3,1.97), ūrṇāyā yus (*5,2.123),
    rudhādibhyaḥ śnam (*3,1.78)  / kimo 't (*5,3.12), iṭo 't (*3,4.106) ity atra pratiṣedho
    na bhvati , anityatva-ādasya pratiṣedhasya  / idamas thamuḥ (*5,3.24) ity ukāra-anubandha-nirdeśād
    anityatvam upalakṣyate //
