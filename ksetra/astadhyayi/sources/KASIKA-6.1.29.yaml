locator:
  sutra: 6.1.29
witness_text:
  sutra: liḍ-yaṅoś ca
  commentary: vibhāṣā iti nivṛttam  / pyāyaḥ pī (*6,1.28) ity etat caśabdena anukṛṣyate  /
    liṭi yaṅi ca parataḥ pyāyaḥ pī ity ayam ādeśo bhavati  / āpipye, āpipyāte, āpipyire  /
    paratvāt pībhāve kṛte punaḥ prasaṅgavijñānāt dvirvacanam, eranekācaḥ iti yaṇādeśaḥ  /
    yaṅi - āpepīyate, āpepīyete, apepīyante //
