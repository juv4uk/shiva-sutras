locator:
  sutra: 2.2.29
witness_text:
  sutra: ca-arthe dvandvaḥ
  commentary: anekam iti vartate  / anekaṃ subantaṃ ca-arthe vartamānam samasyate,
    dvandva-sañjñaś ca samāso bhavati  / samuccayānvācayetaretarayogasamāhārāś ca
    arthāḥ  / tatra samuccayānvācayayor asāmarthyāt na asti samāsaḥ  / itaretarayoge
    samāhāre ca samāso vidhīyate  / plakṣaś ca nyagrodhaś ca plakṣa-nyagrodhau  /
    dhavaś ca khadiraś ca palāśaś ca dhava-khadira-palāśāḥ  / vāk ca tvak ca vāk-tvacam  /
    vāg-dṛṣadam  / dvandva-pradeśāḥ - dvandve ca (*1,1.31) ity evam ādayaḥ //
