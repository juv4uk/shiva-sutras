source_id: KASIKA-8.1.37
locator:
  sutra: 8.1.37
witness_text:
  sutra: pūjāyāṃ na anantaram
  commentary: yāvad yathā ity etābhyāṃ yuktam anantaraṃ tiṅantaṃ pūjāyaṃ viṣaye nānudāttaṃ
    na bhavati, kiṃ tarhi ? anudāttam eva  / yāvat pacati śobhanam  / yathā pacati
    śobhanam  / yāvat karoti cāru  / yathā karoti cāru  / pūjāyām iti kim ? yāvad
    bhuṅkte  / yathā bhuṅkte  / anantaram iti kim ? yāvad devadattaḥ pacati śobhanam  /
    yathā devadattaḥ karoti cāru  / purrveṇa atra nighātaḥ pratiṣidhyate //
