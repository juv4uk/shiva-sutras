source_id: KASIKA-3.2.56
locator:
  sutra: 3.2.56
witness_text:
  sutra: āḍhya-subhaga-sthūla-palita-nagna-andha-priyeṣu cvy-artheṣv acvau kṛñaḥ karaṇe
    khyun
  commentary: āḍhyādiṣu karmasu upapadeṣu cvy-artheṣu acvyanteṣu karoteḥ dhātoḥ karaṇe
    kārake khyun pratyayo bhavati  / cver vikalpena vidhānād dvividhāḥ cvyarthāḥ,
    cvyantā acvyantā śca  / tatra cvyantāḥ paryudasyante  / anāḍhyaṃ āḍhyaṃ kurvanti
    anena āḍhyaṅkaraṇam  / subhagaṅkaraṇam  / sthūlaṅkaraṇam  / palitaṅkaraṇam  /
    nagnaṅkaraṇam  / andhaṅkaraṇam  / priyaṅkaraṇam  / cvyartheṣu iti kim ? āḍhyaṃ
    tailena kurvanti abhyañjayanti ity arthaḥ  / prakṛter avivakṣāyām abhūtaprādurbhāve
    'pi pratyudāharaṇaṃ bhavati  / acvau iti kim ? āḍhyīkurvanty anena  / nanu ca
    khyunā mukte lyuṭā bhavitavyam, na ca lyuṭaḥ khyunaś ca viśeṣo 'sti, tatra kiṃ
    pratiṣedhena ? evaṃ tarhi pratiṣedha-sāmarthyāt khyuni asati lyuḍ api na bhavati,
    tena lyuṭo 'py ayam arthataḥ pratiṣedhaḥ  / uttarārthaś ca cvi-pratiṣedhaḥ kriyate
    //
