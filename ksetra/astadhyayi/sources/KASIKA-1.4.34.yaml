locator:
  sutra: 1.4.34
witness_text:
  sutra: ślāgha-hnuṅ-sthā-śapāṃ jñīpsyamānaḥ
  commentary: ślāgha hnuṅ sthā śapa ity eteṣām jñīpsyamāno yo 'rthah, tat kārakaṃ
    sampradāna-sañjñaṃ bhavati  / jñīpsyamānaḥ jñapayitum iṣyamaṇaḥ, bodhyitum abhipretaḥ  /
    devadattāya ślāghate  / devadattaṃ ślāghamānastām ślāghāṃ tam eva jñapayitum icchati
    ity arthaḥ  / evam - devadattāya hnute  / yajñadattāya hnute  / devadattāya tiṣṭhate  /
    yajñadattāya tiṣṭhate  / devadattāya śapate  / yajñadattāya śapate  / jñīpsyamānaḥ
    iti kim ? deadattāya ślāghate pathi //
