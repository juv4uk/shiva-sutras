source_id: KASIKA-4.1.55
locator:
  sutra: 4.1.55
witness_text:
  sutra: nāsikā-udara-oṣṭha-jaṅghā-danta-karṇa-śṛṅgāc ca
  commentary: svāṅgāc ca+upasarjanāt ity eva  / bahvaj-lakṣaṇe saṃyogopadha-lakṣaṇe
    ca pratiṣedhe prāpte vacanam  / sahanañ-vidyamāna-lakṣaṇas tu pratiṣedho bhavaty
    eva  / nāsikā-ādyantāt prātipadikāt striyāṃ vā ṅīṣ pratyayo bhavati  / tuṅganāsikī,
    tuṅganāsikā  / tilodarī, tilodarā  / bamboṣṭhī, bamboṣṭhā  / dīrghajaṅghī, dīrghajaṅghā  /
    samadantī, samadantā  / cārukarṇī, cārukarṇā  / tīkṣaṇaśṛṅgī, tīkṣṇaśṛṅgā  / pucchāc
    ca+iti vaktavaym  / kalyāṇapucchī, kalyāṇapucchā  / kabara-maṇi-viṣa-śarebhyo
    nityam  / kabarapucchī  / maṇipucchī  / viṣayucchī  / śarapucchī  / upamānāt pakṣāc
    ca pucchāt ca  / ulūkapakṣīsenā  / ulūkapucchī śālā //
