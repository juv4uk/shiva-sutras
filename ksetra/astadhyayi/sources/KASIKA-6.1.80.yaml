source_id: KASIKA-6.1.80
locator:
  sutra: 6.1.80
witness_text:
  sutra: dhātos tannimittasya+eva
  commentary: ecaḥ iti vartate, vānto yi pratyaye iti ca  / dhātor ya ec tannimitto
    yakārādipratyayanimittaḥ, tasya yakārādau pratyaye parato vāntādeśo bhavati  /
    lavyam  / pavyam  / avaśyalāvyam  / avaśyapāvyam  / dhātoḥ iti kim ? prātipadikasya
    niyamo ma bhūt  / tatra ko doṣaḥ ? bābhravyaḥ ity atraa+eva syāt, iha na syāt
    gavyam, nāvyam iti  / tannimittasya iti kim ? atannimittasya mā bhūt  / upoyate  /
    auyata  / lauyamāniḥ  / pauyamāniḥ  / ata iñ (*4,1.95)  / evakārakaraṇam kim ?
    dhātvavadhāraṇam yathā syāt, tannimittāvadhāraṇam mā bhūt iti tānimittasya hi
    dhātoś ca adhātoś ca bhavati  / bābhravyaḥ  / avaśyalāvyam  / lavam //
