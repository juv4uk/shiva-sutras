source_id: KASIKA-8.1.8
locator:
  sutra: 8.1.8
witness_text:
  sutra: vākyāder āmantritasya asūyā-sammati-kopa-kutsana-bhartsaneṣu
  commentary: ekārthaḥ padasamūho vākyam  / vākyāder āmantritasya dve bhavataḥ asūyāsammatikopakutsanabhartsaneṣu
    yadi tad vākyaṃ bhavati  / tatra paraguṇānāmasahanam asūyā  / pūjā sammatiḥ  /
    kopaḥ krodhaḥ  / nindanaṃ kutsanam  / apakāraśabdairbhayotpādanaṃ bhartsanam  /
    ete ca prayoktṛdharmāḥ, nābhidheyadharmāḥ  / asūyāyām tāvat - māṇavaka 3 māṇavaka,
    abhirūpaka 3 abhirūpaka, riktaṃ te ābhirūpyam  / sammātau - māṇavaka 3 māṇavaka,
    abhirūpaka 3 abhirūpaka, śobhanaḥ khalvasi  / kope - māṇavaka 3 māṇavaka, avinītaka
    3 avinītaka, idānīṃ jñāsyasi jālma  / kutsane - śaktike 3 śaktike, yaṣṭike 3 yaṣṭike,
    riktā te śaktiḥ  / bhartsane - caura caura 3, vṛṣala vṛṣala 3, ghātayiṣyami tvāṃ
    bandhayiṣyāmi tvām  / asūyādiṣu svaritam āmreḍite 'sūyā-saṃmati-kopa-kutsaneṣu
    (*8,2.103) iti pūrvapadasya plutaḥ  / bhartsane tu āmreḍitaṃ bhartsane (*8,2.95)
    ity āmreḍitasya+eva plutaḥ  / vākyādeḥ iti kim ? antasya madhyamasya ca mā bhūt,
    śobhanaḥ khalvasi māṇavaka  / āmantritasya iti kim ? udāro devadattaḥ  / asūyādiṣu
    iti kim ? devadatta gāmabhyāja śuklām //
