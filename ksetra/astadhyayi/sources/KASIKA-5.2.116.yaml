source_id: KASIKA-5.2.116
locator:
  sutra: 5.2.116
witness_text:
  sutra: vrīhyādibhyaś ca
  commentary: vrīhyādibhyaḥ prātipadikebhyaḥ iniṭhanau pratyayau bhavato matvarthe  /
    matub bhavaty eva  / vrīhī, vrīhikaḥ, vrīhimān  / māyī, māyikaḥ, māyāvān  / na
    ca vrīhyādibhyaḥ sarvebhyaḥ pratyayadvayam iṣyate  / kiṃ tarhi ? śikhādibhya inirvācya
    ikan yavakhadādiṣu  / pariśiṣṭebhya ubhayam  / śikhā mekhalā sañjñā balākā mālā
    vīṇā vaḍavā aṣṭakā patākā karman carman haṃsā ity etebhya inir eva+iṣyate  / yavakhada
    kumārī nau ity etebhya ikann eva+iṣyate  / pariśiṣṭebhyo dvāv api pratyayau bhavataḥ  /
    vrīhigrahaṇaṃ kimartham, yāvatā tundādiṣu vrīhiśabdaḥ paṭhyate, tatra iniṭhanau
    cakāreṇa vidhīyete ? evaṃ tarhi tundādisu vrīhigrahaṇam arthagrahaṇam vijñāyate  /
    śālayo 'sya santi śālinaḥ, śālī, śālikaḥ, śālimān iti  / vrīhiśikhādayaḥ pūrvaṃ
    paṭhitāḥ  / yavakhada  / kumārī  / nau  / śīrṣān nañaḥ - aśīrṣī, aśīrṣikaḥ //
