source_id: KASIKA-3.3.137
locator:
  sutra: 3.3.137
witness_text:
  sutra: kāla-vihbhāge ca anahorātrāṇām
  commentary: bhaviṣyati maryādā-vacane 'varasmin iti vartate  / kālamaryādāvibhāge
    satyavarsmin pravibhāge bhaviṣyati kāle 'nadyatanavat pratyayavidhirna bhavati,
    na ced aho-rātra-sambhandhī vibhāgaḥ, taisteṣāṃ ca vibhāge pratiṣedhaḥ  / pūrveṇa+eva
    siddhe vacanam idam aho-rātra-niṣedha-artham  / yoga-vibhāga uttarārthaḥ  / yo
    'yaṃ saṃvatsara āgāmī, tatra yadavaramāgrahāyaṇyāḥ, tatra yuktā adhyeṣyāmahe,
    tatraudanaṃ bhokṣyāmahe  / bhaviṣyati ity eva  / yo 'yaṃ vatsaro 'tītaḥ, tasya
    yadavaramāgrahāyaṇyāḥ, tatra yuktā adhyaimahi, tatraudanamabhuñjamahi  / maryādāvacane
    ity eva  / yo 'yaṃ niravadhikaḥ kāla āgāmī, tasya yadavaramāgrahāyaṇyāḥ, tatra
    yuktā adhyetāsmahe, tatraudanaṃ bhoktāsmahe  / avarasmin ity eva  / parasmin vibhāṣāṃ
    vakṣyati  / aho-rātrāṇām iti kim ? trividham udāharaṇam - yo 'yaṃ māsa āgāmī,
    tasya yo 'varaḥ pañcadaśarātraḥ, yo 'yaṃ triṃśadrātra āgāmī, tasya yo 'varo 'rdhamāsaḥ,
    yo 'yaṃ triṃśadahorātra āgāmī, tasya yo 'varaḥ pañcadaśa-rātraḥ, tatra yuktā adhyetāsamahe,
    tatra saktūn pātāsmaḥ  / sarvathā ahorātrasparśe pratiṣedhaḥ // [#283]
