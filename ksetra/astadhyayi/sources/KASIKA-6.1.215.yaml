source_id: KASIKA-6.1.215
locator:
  sutra: 6.1.215
witness_text:
  sutra: vibhāṣā veṇv-indhānayoḥ
  commentary: veṇu indhāna ity etayoḥ vibhāṣā ādir udātto bhavati  / veṇuḥ, veṇuḥ  /
    indhānaḥ, indhānaḥ, indhānaḥ  / veṇuśabdo 'yam ajivṛrībhyo nicca iti ṇupratyayānto
    nitvān nityam ādyudāttaḥ prāptaḥ  / indhānaśabdo 'pi yadā cānaśantas tadā cittvadantodāttaḥ  /
    atha śānajantas tadā lasārvadhatuka-anudāttatve kṛte udāttanivṛttisvareṇa madhyodāttaḥ  /
    tad evam indhāne sarvathā aprāptam udāttatvaṃ pakṣe vidhīyate  / veṇur iva veṇuḥ
    ity upamānaṃ yadā sañjñā bhavati, tadā sañjñāyām upamānam (*6,1.204) iti nityam
    ādyudāttatvam iṣyate // [#650]
