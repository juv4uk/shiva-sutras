source_id: KASIKA-4.1.96
locator:
  sutra: 4.1.96
witness_text:
  sutra: bāhv-ādibhyaś ca
  commentary: bāhu ity evam ādibhyaḥ śabdebhyo 'patye iñ pratyayo bhavati  / bāhaviḥ  /
    aupabāhaviḥ  / anakārārtha ārambhaḥ  / kvacid bādhakavādhanārthaḥ  / bāhu  / upabāhu  /
    vivāku  / śivāku  / baṭāku  / upabindu  / vṛka  / cūḍālā  / mūṣikā  / balākā  /
    bhagalā  / chagalā  / ghruvakā  / dhuvakā  / sumitrā  / durmitrā  / puṣkarasat  /
    anuharat  / devaśarman  / agniśarman  / kunāman  / sunāman  / pañcan  / saptan  /
    aṣṭan  / amitaujasaḥ salopaś ca  / udañcu  / śiras  / śarāvin  / kṣemavṛddhin  /
    śṛṅkhalātodin  / kharanādin  / nagaramardin  / prākāramardin  / loman  / ajīgarta  /
    kṛṣṇa  / salaka  / yudhiṣṭhira  / arjuna  / sāmba  / gada  / pradyumna  / rāma  /
    udaṅkaḥ sañjñāyām  / ambhūyo 'mbhasoḥ salopaś ca  / bāhvādiprabhṛtiṣu yeṣāṃ darśanaṃ
    gotrabhāve laukike tato 'nyatra teṣāṃ pratiṣedhaḥ  / bāhurnāma kaścit, tasya apatyaṃ
    bāhavaḥ  / sambandhiśabdānāṃ ca tatsadṛśāt pratiṣedhaḥ  / sañjñā - śvaśurasya
    apatyaṃ śvāśuriḥ  / cakāro 'nukta-samuccaya-arthaḥ ākṛtigaṇatāmasya bodhayati  /
    jāmbiḥ  / aindraśarmiḥ  / ājadhenaviḥ  / ājabandhaviḥ  / auḍulomiḥ //
