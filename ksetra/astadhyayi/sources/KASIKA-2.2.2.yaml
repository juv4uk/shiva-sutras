locator:
  sutra: 2.2.2
witness_text:
  sutra: ardhaṃ napuṃsakam
  commentary: ekadeśinā ekādhikaraṇe iti vartate  / samapravibhāge 'rdhaśabdo napuṃsakam
    āviṣṭaliṅgaḥ, tasya+idaṃ grahanam  / ardham ity etad napuṃsakam ekadeśinā-ekādhikaraṇena
    samasyate, tatpuruṣaś ca samāso bhavati  / ṣaṣṭhīsamāsa-apavādo 'yam yogaḥ  /
    ardhaṃ pippalyāḥ ardhapippalī  / ardhakośātakī  / napuṃsakam iti kim ? grāmārdhaḥ  /
    nagarārdhaḥ  / ekadeśinā ity eva, ardhaṃ pasor devadattasya  / devadattena saha
    samaso na bhavati  / ekādhikaraṇe ity eva, ardhaṃ pippalīnām //
