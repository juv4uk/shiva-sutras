source_id: KASIKA-1.2.53
locator:
  sutra: 1.2.53
witness_text:
  sutra: tad aśiṣyaṃ sañjñā-pramāṇatvāt
  commentary: tat iti prakṛtaṃ yuktavadbhāva-lakṣaṇaṃ nirdiśyate  / tad-aśiṣyaṃ na
    vaktavyam  / kasmāt ? sañjñā-pramāṇatvāt  / sañjñā-śabdā hi nānāliṅga-saṅkhyāḥ
    pramāṇam  / pañcālāḥ, varaṇā iti ca, na+ete yoga-śabdāḥ  / kiṃ tarhi ? janapad-ādīnāṃ
    sañjñā etāḥ  / tatra liṅgaṃ vacanaṃ ca svabhāva-saṃsiddham eva na yatna-pratipādyam,
    yathā āpaḥ, dārāḥ, gṛhāḥ, sikatāḥ, varṣāḥ iti //
