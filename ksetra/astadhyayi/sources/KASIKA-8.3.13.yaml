source_id: KASIKA-8.3.13
locator:
  sutra: 8.3.13
witness_text:
  sutra: ḍho ḍhe lopaḥ
  commentary: ḍhakārasya ḍhakāre lopo bhavati  / saty api padādhikāre tasya asambhavād
    apadāntasya ḍhakārasya ayaṃ lopo vijñāyate  / līḍham  / upāgūḍham  / ṣṭutvasya
    atra siddhatvamāśrayād draṣṭavyam  / śvaliḍ ḍhau kate ity atra tu jaśve kṛte kāryaṃ
    na asti iti lopābhāvaḥ  / na ca ḍhalopo jaśtvāpavādo vijñātuṃ śakyate, tasya hi
    līḍhādiḥ viṣayaḥ sambhavati  / tatra hi śrutikṛtamānantaryam asti  / śāstrakṛtaṃ
    tu yadā nānantaryaṃ ṣṭutvasya asiddhatvena prāptam, tat tu sūtrakaraṇasāmarthyād
    bādhyate  / śvaliḍ ḍhaukate ity atra tu na śrutikṛtamanantaryam, na śāstrakṛtam
    iti aviṣayo 'yaṃ ḍhalopasya //
