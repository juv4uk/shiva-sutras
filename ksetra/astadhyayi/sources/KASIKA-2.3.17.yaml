source_id: KASIKA-2.3.17
locator:
  sutra: 2.3.17
witness_text:
  sutra: manya-karmaṇy-anādare vibhāṣā 'prāṇiṣu
  commentary: manyateḥ karmaṇi manyakarmaṇi  / manyakarmaṇi prāṇivarjite vibhāṣā caturthī
    vibhaktir bhavati anādare gamyamāne  / anādarastiraskāraḥ  / na tvā tṛṇaṃ manye,
    na tvā tṛṇāya manye  / na tvā busaṃ manye, na tvā busāya manye  / manyati-grahaṇaṃ
    kim ? na tvā tṛṇaṃ cintayāmi  / vikaraṇa-nirdeśaḥ kim arthaḥ ? na tvā tṛṇaṃ manve  /
    anādare iti kim ? aśmānaṃ dṛṣadaṃ manye manye kaṣṭhamulūkhalam  / andhāyāstaṃ
    sutaṃ manye yasya mātā na paśyati // aprāniṣu iti kim ? na tvā śṛgālaṃ manye  /
    yad etad aprāṇiṣviti tad anāvādiṣviti vaktavyam  / vyavasthita-vibhāṣā ca jñeyā  /
    na tvā nāvaṃ manye yāvad uttīrṇaṃ na nāvyam  / na tvā 'nnaṃ manye yāvan na bhuktaṃ
    śrāddham  / prāṇiṣu tūbhayam  / na tvā kākaṃ manye  / na tvā śṛgālaṃ manye  /
    iha caturthī dvitīyā ca bhavataḥ - na tvā śvānaṃ manye, na tvā śune manye  / yuṣmadaḥ
    kasmān na bhavati caturthī, etad api hi manyateḥ karma ? vyavasthita-vibhāṣā-vijñānād
    eva na bhavati // [#137]
