source_id: KASIKA-7.2.5
locator:
  sutra: 7.2.5
witness_text:
  sutra: h-m-yanta-kṣaṇa-śvasa-jāgṛ-ṇi-śvy-ed-itām
  commentary: hakārāntānāṃ makārāntānāṃ yakārāntānām aṅgānām, kṣaṇa śvasa jāgṛ ṇi
    śvi ity eteṣām, editāṃ ca iḍādau sici parasmaipade parato vṛddhir na bhavati  /
    graha - agrahīt  / syama - asyamīt  / vyaya - avyayīt  / ṭuvama - avamīt  / kṣaṇa
    - akṣaṇīt  / śvasa - aśvasīt  / jāgṛ - ajāgarīt  / ṇi - aunayīt  / ailayīt  /
    śvi - aśvayīt  / editām - rage - aragīt  / kakhe - akakhīt  / hmyantakṣaṇaśvasām
    editām ca ato halāder laghoḥ (*7,2.7) iti vikalpe prāpte pratiṣedhaḥ  / jāgṛṇiśvīnāṃ
    tu sici vṛddhiḥ prāptā, sā ca neṭi (*7,2.4) iti na pratiṣidhyate  / na ca antaraṅgatvād
    atra pūrvaṃ guṇo bhavati, sici vṛddher anavakāśatvāt  / yadi pūrvaṃ guṇaḥ syād
    iha ṇiśvigrahaṇam anarthakaṃ syāt, guṇāyādeśayoḥ kṛtayoḥ yakārantatvād eva pratiṣedhasya
    siddhatvāt  / tasmād idam eva śvigrahaṇaṃ jñāpakam na sidyantaraṅgam asti iti  /
    atha jāgṛgrahaṇam kimartham, jāgro 'vi-ciṇ-ṇal-ṅitsu (*7,3.85) iti jāgarter guṇo
    vṛddher apavādo vidhīyate, sa yathā aco ñṇiti (*6,2.115) iti vṛddhiṃ bādhate tathā
    sici vṛddhim api bādhiṣyate ? na+etad asti  / kṛte guṇe ato lrāntasya (*7,2.2)
    iti ya vṛddhiḥ prāpnoti sā pratiṣidhyate  / atha guṇavidhānasamarthyād uttarakālabhāvinyapi
    vṛddhir bādhyate, yathā jāgarayati ity atra ata upadhāyāḥ (*7,1.113) ity api vṛddhir
    na bhavati, tathā ciṇṇaloḥ pratiṣedho 'rthavān bhavati iti śakyam iha jāgṛgrahaṇam
    akartum ? tat tu kriyate vispaṣṭārtham //
