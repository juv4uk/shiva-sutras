source_id: KASIKA-3.3.10
locator:
  sutra: 3.3.10
witness_text:
  sutra: tumun-ṇvulau kriyāyāṃ kriya-arthāyām
  commentary: bhaviṣyati ity eva  / kriya-arthāyāṃ kriyāyām upapade dhātor bhavisyati
    kale tumun-ṇvulau pratyayau bhavataḥ  / bhoktuṃ vrajati  / bhojako vrajati  /
    bhujikriya-arthaḥ vrajiratropapadam  / kriyāyām iti kim ? bhikṣiṣya ity asya jaṭāḥ  /
    kriya-arthāyām iti kim ? dhāvataste patiṣyati daṇḍaḥ  / atha kimarthaṃ ṇvul vidhīyate
    yāvatā ṇvul-tṛcau (*3,1.133) iti sāmānyena vihita eva so 'sminn api viṣaye bhavisyati
    ? lṛṭā kriyārtha-upapadena bādhyeta  / vā 'sarūpa-vidhinā so 'pi bhavisyati ?
    evaṃ tarhi etad jñāpyate, kriyāyām upapade kriyārthāyāṃ vā 'sarūpeṇa tṛjādayo
    na bhavanti iti  / tena kartā vrajati, vikṣipo vrajati ity evam ādi nivartyate
    //
