source_id: KASIKA-8.2.84
locator:
  sutra: 8.2.84
witness_text:
  sutra: dūrād dhūte ca
  commentary: dūrād dhūte yad vākyaṃ vartate tasya ṭeḥ pluto bhavati, sa ca+udāttaḥ  /
    āhvānaṃ hūtam, śabdena sambodhanam  / āgaccha bho māṇavaka devadatta3  / āgaccha
    bho māṇavaka yajñadatta3  / dūraṃ yady apy apekṣābhedād anavasthitam, tathāpi
    hūtāpekṣaṃ yat tadāśrīyate iti yatra prākṛtāt prayatnād yatnaviśeṣe āśrīyamāṇe
    śabdaḥ śrūyate tad dūram  / hūtagrahaṇa ca sambodhanamātropalakṣaṇārthaṃ draṣṭavyam  /
    tena yatra apy āhvānaṃ na asti tatra api plutir bhavati, saktūn piba devadatta3,
    palāyasva devadatta3 iti  / asyāś ca pluter ekaśrutyā samāveśaḥ iṣyate  / dūrāt
    iti kim ? āgaccha bho māṇavaka devadatta  / dūrādāhvāne vākyasyānte yatra sambodhanapadaṃ
    bhavati tatra ayaṃ plutaḥ iṣyate, tena+iha na bhavati, devadatta āgaccha // [#931]
