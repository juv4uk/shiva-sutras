source_id: KASIKA-3.3.144
locator:
  sutra: 3.3.144
witness_text:
  sutra: kiṃvṛtte liṅ-lṛṭau
  commentary: garhāyām ity eva vibhāṣā na svaryate  / kiṃvṛtte upapade garhāyāṃ gamyamānāyāṃ
    dhātoḥ liṅ-lṛṭau pratyayau bhavataḥ  / sarvalakārāṇām apavādaḥ  / liṅ-grahaṇaṃ
    laṭo 'parigraha-artham  / ko nāma vṛṣalo yaṃ tatrabhavān yājayet, yaṃ tatrabhavān
    vṛṣalaṃ yājayiṣyati  / kataro nāma, katamo nāma yāṃ tatrabhavān vṛṣalaṃ yājayet,
    yājayiṣyati  / bhūte kriyātipattau vā lṛṅ  / bhaviṣyati tu nityam  / ko nāma vṛṣalo
    yaṃ tatrabhavān ayājayiṣyat // [#285]
