source_id: KASIKA-6.1.203
locator:
  sutra: 6.1.203
witness_text:
  sutra: vṛṣa-ādīnāṃ ca
  commentary: vṛṣaḥ ity evam ādīnām ādir udātto bhavati  / vṛṣaḥ  / janaḥ  / jvaraḥ  /
    grahaḥ  / hayaḥ  / gayaḥ  / ete sarve pacādyacpratyayāntāḥ  / gayaḥ ity atra gāyater
    nipātanād etvam  / nayaḥ  / tayaḥ  / ayaḥ  / vedaḥ  / aṃśaḥ  / aśaḥ  / davaḥ  /
    ete 'pi tathā+eva acpratyayāntāḥ  / sūdaḥ  / igupadhāt iti kapratyayāntaḥ  / guhā  /
    bhidādir aṅpratyayāntaḥ  / śamaraṇau sañjñāyāṃ sammatau bhāvakarmaṇoḥ  / śamo
    bhāve  / raṇaḥ karamaṇi  / ajantāv etau nipātanād bhāvakarmaṇoḥ bhavataḥ  / mantraḥ
    pacādyajantaḥ  / śāntiḥ iti ktijantaḥ  / kāmaḥ  / yāmaḥ  / ghañantāvetau  / ārā  /
    dhārā  / kārā  / bhidādayaḥ  / vahaḥ  / gocarādiṣu ghapratyayāntaḥ  / kalpaḥ  /
    ajantaḥ  / pādaḥ  / ghañantaḥ  / tatra kvacit pratyayasvaraḥ prāptaḥ, kvacit karṣātvato
    ghaño 'nta udāttaḥ (*6,1.159) iti  / vṛṣādir ākṛtigaṇaḥ  / avihitam ādyudāttatvaṃ
    vṛṣādiṣu draṣṭavyam // [#648]
