source_id: KASIKA-5.2.12
locator:
  sutra: 5.2.12
witness_text:
  sutra: samāṃsamāṃ vijāyate
  commentary: samāṃsamām iti vīpasā  / subantasamudāyaḥ prakṛtiḥ  / vijāyate garbhaṃ
    dhārayati iti pratyayārthaḥ  / garbhadhāraṇena sakalā 'pi samā vyāpyate iti atyantasaṃyoge
    dvitīyā  / samāṃsamāṃ vijāyate samāṃsamīnā gauḥ  / samāṃsamīnā vaḍavā  / pūrvapade
    supo 'lug vaktavyaḥ  / kecit tu samāyāṃ vijāyate iti vigṛhṇanti, garbhamocane
    tu vijanir vartate ity āhuḥ  / teṣāṃ pūrvapade yalopamātraṃ nipātyate, pariśiṣṭasya
    alug vaktavyaḥ  / anutpattāv uttarapadasya ca vā yalopo vaktavyaḥ  / samāṃsamāṃvijāyate,
    samāyāṃ samāyāṃ vijāyate iti vā //
