source_id: KASIKA-6.1.145
locator:
  sutra: 6.1.145
witness_text:
  sutra: goṣpadaṃ sevita-asevita-pramāṇesu
  commentary: goṣpadam iti suṭ nipātyate, tasya ca ṣatvaṃ sevite asevite pramāne ca
    viṣaye  / goṣpado deśaḥ  / gāvaḥ padyante yasmin deśe sa gobhiḥ sevito deśo goṣpadaḥ
    ity ucyate  / asevite - agoṣpadāny araṇyāni  / asevite goṣpadaśabdo na sambhavati
    ity agoṣpadaśabdārthaṃ nipātanam  / yady evaṃ na artha etena, goṣpadapratiṣedhād
    agoṣpadaṃ bhavisyati ? satyam etat, yatra tu sevitaprasaṅgo 'sti tatra+eva syād
    agoṣpadam iti, yatra tvatyantāsambhava eva tatra na syāt, agoṣpadānyaraṇyāni iti
    ? asevitagrahaṇāt tatra api bhavati  / yāni hi mahāntyaraṇāni yeṣu gavām atyantāsambhavas
    tāny evam ucyante  / pramāṇe - gospadamātraṃ kṣetram  / goṣpadapūraṃ vṛṣṭo devaḥ  /
    na atra goṣpadaṃ svārthapratipādanārtham upādīyate, kiṃ tarhi, kṣetrasya vṛṣṭeś
    ca paricchettumiyattām  / sevitāsevitapramāṇesu iti kim ? goḥ padam gopadam //
    [#634]
