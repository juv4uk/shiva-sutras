source_id: KASIKA-7.2.59
locator:
  sutra: 7.2.59
witness_text:
  sutra: na vṛdbhyaś caturbhyaḥ
  commentary: vṛtādibhyaś caturbhyaḥ uttarasya sakārāder ārdhadhātukasya parasmaipadeṣu
    iḍagamo na bhavati  / vṛt - vartsyati  / avartsyat  / vivṛtsati  / vṛdhū - vartsyati  /
    avartsyat  / vivṛtsati  / śṛdhū - śartsyati  / aśartsyat  / śiśṛtsati  / syandū
    - syantsyati  / asyantsyat  / sisyantsati  / caturbhyaḥ iti na vaktavyam, vṛdgrahaṇaṃ
    hi tatra dyutādiparisamāptyartham kriyate - kṛpū sāmarthye vṛt iti, tad eva yadi
    vṛtādisamāptyartham api vijñāyate na kiñcidaniṣṭaṃ prāpnoti ? tat kriyate syanderūdillakṣaṇam
    antaraṅgam api vikalpaṃ pratiṣedho yathā bādheta iti  / caturgrahaṇe hi sati tātparyeṇa
    syandiḥ saṃnidhāpito bhavati  / parasmaipadeṣu ity eva, vartiṣyate  / vartiṣīṣṭa  /
    avartiṣyata  / vivartiṣate  / atra api ātmanepadena samānapadasthebhyo vṛtādibhya
    iḍāgama iṣyate  / anyatra sarvatra pratiṣedhaḥ  / kṛtyapi hi parasmaipadaluki
    ca pratiṣedho bhavati, vivṛtsitā, vivṛtsa tvam iti // [#816]
