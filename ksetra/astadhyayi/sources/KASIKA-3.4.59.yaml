source_id: KASIKA-3.4.59
locator:
  sutra: 3.4.59
witness_text:
  sutra: avyaye 'yathābhipreta-ākhyāne kṛñaḥ ktvā-ṇamulau
  commentary: avyaye upapade ayathabhipreta-ākhyāne gamyamāne karoteḥ ktvā-ṇamulau
    bhavataḥ  / brāhmaṇa, putraste jātaḥ  / kiṃ tarhi vṛṣala, nīcaiḥ kṛṭyācakṣe, nīcaiḥ
    kṛtvā, nīcaiḥ kāram  / uccair nāma priyam ākhyeyam  / brāhamaṇa, kanyā te garbhiṇī  /
    kiṃ tarhi vṛṣala, uccaiḥ kṛtyācakṣe, uccaiḥ kṛtvā, uccaiḥ kāram  / nīcair nāmāpriyam
    ākhyeyam  / ayathābhipreta-ākhyāne iti kim ? uccaiḥ kṛtvācaṣṭe putraste jātaḥ
    iti  / ktvā-grahaṇaṃ kim, yāvatā sarvasminn eva atra prakaraṇe vāsarūpeṇa ktvā
    bhavati ity uktam ? samāsa-arthaṃ vacanam  / tathā ca ktvā ca (*2,2.22) ity asmin
    sūtre tṛtīyā-prabhṛtīny-anyatarasyām (*2,2.21) iti vartate  / ṇamul-adhikāre punar
    ṇamul-grahaṇaṃ tulyakakṣatvajñāpana-artham, tena+uttaratra dvayor apy anuvṛttir
    bhaviṣyati //
