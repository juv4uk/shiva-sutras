source_id: KASIKA-7.2.36
locator:
  sutra: 7.2.36
witness_text:
  sutra: snu-kramor anātmanepadanimitte
  commentary: niyamārtham idam  / snukramoḥ ārdhadhātukasya valādeḥ iḍāgamo bhavati,
    na cet snukramī ātmanepadasya nimittaṃ bhavataḥ  / kva ca tāvātmanepadasya nimittam
    ? yatra ātmanepadaṃ tad āśrayaṃ bhavati, bhāvakarmakarmakartṛkarmavyatihārāḥ kramer
    vṛttyādayaś ca  / tena ayam saty ātmanepade pratiṣedho bhavati na asati iti  /
    pratiṣedhaphalaṃ ca+idaṃ sūtram  / snukramoruditvāt iṭ siddha eva  / prasnavitā  /
    prasnavitum  / prasnavitavyam  / prakramitā  / prakramitum  / prakramitavyam  /
    anātmanepadanimitte iti kim ? prasnoṣīṣṭa  / prakraṃsīṣṭa  / prasnoṣyate  / prakraṃsyate  /
    prasusnūṣiṣyate  / pracikraṃsiṣyate  / sarvatra+eva atra snaitiḥ kramiś ca ātmanepadasya
    nimittam  / sanantād api pūrvavatsanaḥ (*1,3.62) iti ātmanepadaṃ vidhīyate  /
    nimittagrahaṇaṃ kim ? sīyuḍādes tatparaparasya ca pratiṣedhārtham  / iha tu prasnavitevācarati
    iti prasnavitrīyate iti kyaṅatam ātmanepadasya nimittam, na snautiḥ  / krames
    tu kartaryātmanepadaviṣayādasatyātmanepade kṛti pratiṣedho vaktavyaḥ  / prakrantā  /
    upakrantā  / kartari iti kim ? prakramitavyam  / upakramitavyam  / ātmanepadaviṣayāt
    iti kim ? niṣṭramitiā  / snauteḥ sani kiti ca pratyaye śryukaḥ kiti (*7,2.11),
    sani grahaguhośca (*7,2.12) ity eva pratiṣedho bhavati  / prasusnūṣati  / prasnutaḥ  /
    prasnutavān //
