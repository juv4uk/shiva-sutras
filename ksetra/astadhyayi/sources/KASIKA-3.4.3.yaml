source_id: KASIKA-3.4.3
locator:
  sutra: 3.4.3
witness_text:
  sutra: sayuccaye 'nyatarasyām
  commentary: anekakriyādhyāhāraḥ samuccayaḥ  / samuccīyamāna-kriyāvacanād dhātor
    anyatarasyāṃ loṭ pratyayo bhavati, tasya loṭo hi-svau ādeśau bhavataḥ  / tadhvaṃbhāvinastu
    vā bhavataḥ  / bhrāṣṭramaṭa, maṭhamaṭa, khadūramaṭa, sthālyapidhānam aṭa ity eva
    ayam aṭati, imāv aṭataḥ, ime 'ṭanti  / bhrāṣṭramaṭa, maṭhamaṭa, khadūram aṭa,
    sthālyapidhānam aṭa+ity eva tvam aṭasi, yuvām aṭathaḥ, yūyam aṭatha  / atha vā,
    bhrāṣṭram aṭata, maṭham aṭata, khadūram aṭata, sthālyupidhānam aṭata ity eva yūyam
    aṭatha  / bhrāṣṭram aṭa, maṭham aṭa, khadūram aṭa, sthālyupidhānam aṭa ity eva
    aham aṭāmi, āvām aṭāvaḥ, vayam aṭāmaḥ  / atha vā, bhrāṣṭram aṭati, maṭham aṭati,
    khadūram aṭati, sthālyupidhānam aṭati ity eva ayam aṭati, imā vaṭataḥ, ime 'ṭanti  /
    bhrāṣṭram aṭasi, maṭham aṭasi, khadūram aṭasi, sthālyupidhānam aṭasi, ity eva
    tvam aṭasi, yuvām aṭathaḥ, yūyam aṭatha  / bhrāṣṭram aṭāmi, maṭham aṭāmi, khadūram
    aṭāmi, sthālyupidhānam aṭāmi ity eva aham aṭāmi, āvām aṭāvaḥ, vayam aṭAamaḥ  /
    chando 'dhīṣva, vyākaraṇam adhīṣva, niruktam adhīṣva ity eva ayam adhīte, imāv
    adhīyāte, ime 'dhīyate  / chando 'dhīṣva, vyākaraṇam adhīdhvam ity eva yūyam adhīdhve  /
    chando 'dhīṣva, vyākaraṇam adhīṣva, niruktam adhīṣva ity eva aham adhīye, āvām
    adhīvahe, vayam adhīmahe  / atha vā, chando 'dhīte, vyākaraṇam adhīte, niruktamadhīte,
    ity eva ayam adhīte, imāv adhīyāte, ime 'dhīyate  / chando 'dhīṣe, vyākaraṇam
    adhīṣe, niruktam adhīṣe ity eva tvam adhīṣe, yuvām adhīyāthe, yūyam adhīdhve  /
    chando 'dhīye, vyākaraṇam adhīye, niruktam adhīye ity eva aham adhīye, āvām adhīvahe,
    vayam adhīmahe //
