source_id: KASIKA-4.1.82
locator:
  sutra: 4.1.82
witness_text:
  sutra: samarthānāṃ prathamād vā
  commentary: trayam apy adhikriyate samarthānām iti ca, prathamād iti ca, vā iti
    ca  / svārthika-pratyayāvadhiścāyam adhikāraḥ, prāgdiśo vibhaktiḥ (*5,3.1) iti
    vāvat  / svārthikeṣu hy asya+upayogo na asti, vikalpo 'pi tatra anavasthitaḥ  /
    kecin nityam eva bhavanti  / lakṣaṇavākyāni tasya apatyam (*4,1.92), tena raktaṃ
    rāgāt (*4,2.1) tatra bhavaḥ (*4,3.53) ity evam ādīni bhaviṣyanti  / teṣu sāmarthye
    sati prathama-nirdiṣṭād eva vikalpena pratyayo bhavati iti veditavyam  / samarthānām
    iti virdhāraṇe ṣaṣṭhī  / samarthānāṃ madye prathamaḥ pratyaya-prakṛtitvena nirdhāryate  /
    tasya iti sāmānyaṃ viśeṣalakṣaṇa-artham  / tadīyaṃ prāthamyaṃ viśeṣāṇāṃ vijñāyate  /
    upagoḥ apatyam aupagavaḥ  / samarthānām iti kim ? kambala upagoḥ, apatyaṃ devadattasya  /
    prathamāt iti kim ? ṣaṣṭhyāntād yathā syāt, prathamāntān mā bhūt  / vā iti kim
    ? vākyam api yathā syāt upagor apatyam iti  / yady evaṃ samāsa-vṛttiḥ taddhita-vṛttyā
    bādhyeta upagvapatyam iti  / na+eṣa doṣaḥ  / pūrvasūtrād anyatarasyāṃ grahaṇam
    anuvartate  / tena+etad api bhaviṣyati //
