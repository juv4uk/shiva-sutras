source_id: KASIKA-5.4.113
locator:
  sutra: 5.4.113
witness_text:
  sutra: bahuvrīhau sakthy-akṣṇoḥ svāṅgāt ṣac
  commentary: svāṅgavācī yaḥ sakthiśabdaḥ akṣiśabdaś ca tadantāt bahuvrīheḥ ṣac pratyayo
    bhavati samāsāntaḥ  / ayam artho 'bhipretaḥ  / sūtre tu duḥśliṣṭavibhaktīni padāni  /
    dīrghaṃ sakthi yasya dīrghasakthaḥ  / kalyāṇākṣaḥ  / lohitākṣaḥ  / viśālākṣaḥ  /
    bahuvrīhau iti kim ? paramasakthiḥ  / paramākṣiḥ  / sakthyakṣṇoḥ iti kim ? dīrghajānuḥ  /
    subāhuḥ  / svāṅgāt iti kim ? dīrghaskthi śakaṭam sthulākṣiḥ ikṣuḥ  / ṭaci prakṛte
    ṣajgrahaṇaṃ svarārtham  / cakrasakthī strī  / dīrghasakthī strī  / sakthaṃ cākrāntāt
    (*6,2.198) iti vibhāṣayottarapadasya antodāttatā vidhīyate  / tatra yasmin pakṣe
    na asty udāttatvaṃ tatra ṅīpi sati udāttanivṛttisvarasya abhāvād anudāttaḥ śrūyeta  /
    ṅīṣi tu sarvatra+udāttaḥ siddho bhavati  / bahuvrīhigrahaṇam ā pādaparisamāpter
    anuvartate //
