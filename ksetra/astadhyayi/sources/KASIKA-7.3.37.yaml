source_id: KASIKA-7.3.37
locator:
  sutra: 7.3.37
witness_text:
  sutra: śā-cchā-sā-hvā-vyā-ve-pāṃ yuk
  commentary: śā dhā sā hvā vyā ve pā ity eteṣam aṅgānāṃ yugāgamo bhavati ṇau parataḥ  /
    śā - niśāyayati  / chā - avacchāyayati  / sā - avasāyayati  / hvā - hvāyayati  /
    vyā - saṃvyāyayati  / ve - vāyayasti  / pā - pāyayati  / pāgrahaṇe pai ovai śoṣaṇe
    ity asya api iha grahaṇam icchanti  / pā rakṣaṇe ity asya lugvikaraṇatvān na bhavati  /
    lugāgamastu tasya vaktavyaḥ  / pālayati  / dhūñprīñor lugvaktavyaḥ  / dhūnayati  /
    prīṇayati  / ete 'pi pūrvāntā eva kriyante, tena nyaśīśayat, apīpalat, adūdhunat,
    apipriṇat iti upadhāhrasvatvaṃ bhavati  / śāchāsāhvāvyāvepāṃ kṛtātvānāṃ grahaṇaṃ
    pukaḥ prāptimākhyātum  / kim etasya ākhyāne prayojanam ? etasmin prakaraṇe lakṣaṇapratipadoktaparibhāṣā
    na asti ity upadiśyate  / tena adhyāpayati, jāpayati ity evam ādi siddhaṃ bhavati
    //
