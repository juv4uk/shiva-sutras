source_id: KASIKA-6.2.133
locator:
  sutra: 6.2.133
witness_text:
  sutra: na ācārya-rāja-rtvik-saṃyukta-jñāty-ākhyebhyaḥ
  commentary: ācaryaḥ upādyāyaḥ  / rājā īśvaraḥ  / ṛtvijo yājakāḥ  / saṃyuktāḥ strīsambandhinaḥ
    śyālādayaḥ  / jñātayo mātṛpitṛsambandhino bāndhavāḥ  / ācāryādyākhyebhyaḥ paraḥ
    putraśabdo nadyudātto bhavati ākhyāgrahaṇāt svarūpasya paryāyāṇāṃ viśeṣāṇāṃ ca
    grahaṇaṃ bhavati  / ācāryaputraḥ  / upādhyāyaputraḥ  / śākaṭāyanaputraḥ  / rājaputraḥ  /
    īśvaraputraḥ  / nandaputraḥ  / ṛtvikputraḥ  / yājakaputraḥ  / hotuḥputraḥ  / saṃyuktaputraḥ  /
    sambandhiputraḥ  / śyālaputraḥ  / jañātiputraḥ  / bhrātuṣputraḥ  / ṛto vidyāyonisambadhebhyaḥ
    (*6,3.23)  / iti ṣaṣṭhyā aluk  / putrasvare pratiṣiddhe samāsāntodāttatvam eva
    bhavati // [#684]
