source_id: KASIKA-2.1.60
locator:
  sutra: 2.1.60
witness_text:
  sutra: ktena nañ-viśiṣṭena anañ
  commentary: nañaiva viśeṣo yasya, sarvamanyat prakṛtyādikaṃ tulyaṃ, tan nañ-viśiṣṭam,
    tena nañviśiṣṭena ktāntena samānādhikaraṇena saha anañ ktāntaṃ samasyate, tatpuruṣaś
    ca samāso bhavati  / kṛtaṃ ca tadakṛtaṃ ca kṛtākṛtam  / bhuktābhuktam  / pītāpītam  /
    udatānuditam  / nuḍiṭau tadbhaktatvānnaiva bhedakau  / aśitānaśitena jīvati  /
    kliṣṭākliśitena vartate  / kṛtāpakṛtādīnām upasaṅhyānam  / kṛtāpakṛtam  / bhuktavibhuktam  /
    pītavipītam  / gatapratyāgatam  / yātānuyātam  / krayākrayikā  / puṭāpuṭikā  /
    phalāphalikā  / mānonmānikā  / samānādhikaraṇādhikāre śākapārthivādīnām upasaṅkhyānam
    uttarapadalopaś ca  / śākapradhānaḥ pārthivaḥ śākapārthivaḥ  / kutapasauśrutaḥ  /
    ajātaulvaliḥ // [#116]
