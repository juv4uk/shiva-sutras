source_id: KASIKA-8.1.42
locator:
  sutra: 8.1.42
witness_text:
  sutra: purā ca parīpsāyām
  commentary: purā ity anena yuktaṃ tiṅantaṃ parīpsāyām arthe vibhāṣā nānudāttaṃ bhavati  /
    parīpsā tvarā  / adhīṣva mānavaka, purā vidyotate vidyut  / purā stanayati stanayitnuḥ  /
    purāśabdo 'tra bhaviṣyadāsattiṃ dyotayati  / paīpsāyām iti kim ? naḍena sma purā
    adhīyate  / atra bhūtakālaviprakarṣaṃ purāśabdo dyotayati  / ūrṇayā sma purā adhīyate
    //
