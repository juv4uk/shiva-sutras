witness_text:
  sutra: rāl lopaḥ
  commentary: rephāduttarayoḥ chvorlopo bhavati kvau parato jhalādau kṅiti ca parataḥ  /
    murcchā - mūḥ, murau, muraḥ  / mūrtaḥ  / mūrtavān  / mūrtiḥ  / na dhyā-khyā-pṝ-mūrchi-madām
    (*8,2.57) iti niṣṭhānatvābhāvaḥ  / hurcchā - hūḥ, hurau, huraḥ  / hūrṇaḥ  / hūrṇavān  /
    hūrtiḥ  / rāllope sutukkasya chasya abhāvāt kevalo gṛhyate  / vakārasya - turvī
    - tūḥ, turau, turaḥ  / tūrṇaḥ  / tūrṇavān  / tūrtiḥ  / dhurvī - dhūḥ, dhurau,
    dhuraḥ  / dhūrṇaḥ  / dhūrṇavān  / dhūrtiḥ //
