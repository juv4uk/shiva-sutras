source_id: KASIKA-6.1.84
locator:
  sutra: 6.1.84
witness_text:
  sutra: ekaḥ pūrvaparayoḥ
  commentary: adhikāro 'yam  / khyatyāt parasya (*6,1.112) iti prāg etasmāt sūtrāt
    iti uttaraṃ yad vakṣyāmas tatra pūrvasya parasya dvayor api sthāne ekādeśo bhavati
    ity etad veditavyam  / vakṣyati ād guṇaḥ (*6,1.87) iti  / tatra aci pūrvasya avarṇāt
    ca parasya sthāne eko guṇo bhavati  / khaṭvendraḥ mālendraḥ  / pūrvaparagrahaṇaṃ
    dvayor api yugapadādeśapratipattyartham, ekasya+eva hi syāt, nobhe saptamīpañcamyau
    yugapat prakalpike bhavataḥ iti  / ekagrahaṇam pṛthagādeśanivṛttyarthaṃ, sthānibhedād
    dhi bhinnādiṣu natvavad dvāvādeśau syātām //
