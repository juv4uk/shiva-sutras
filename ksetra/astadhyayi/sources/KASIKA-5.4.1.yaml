source_id: KASIKA-5.4.1
locator:
  sutra: 5.4.1
witness_text:
  sutra: pādaśatasya saṅkhyāder vīpsāyāṃ vun lopaś ca
  commentary: pādaśatāntasya saṅkhyādeḥ prātipadikasya vīpsāyāṃ dyotyāyāṃ vun pratyayo
    bhavati  / tatsanniyogena cāntasya lopo bhavati  / yasya+iti lopena+eva siddhe
    punar vacanam anaimittikārtham  / yasya+iti lopaḥ paranimittakaḥ  / tasya sthānivadbhāvāt
    pādaḥ pat (*6,4.130) iti padbhāvo na syāt  / asya tv anaimittikatvān na sthānivattvam  /
    dvau dvau pādau dadāti dvipadikāṃ dadāti  / dve dve śate dadāti dviśatikāṃ dadāti  /
    taddhitārtha iti samāsaḥ  / tataḥ pratyayaḥ  / svabhāvāc ca vunpratyayāntaṃ striyām
    eva vartate  / pādaśatasya iti kim ? dvau dvau māṣau dadāti  / saṅkhyādeḥ iti
    kim ? pādaṃ pādaṃ dadāti  / vīpsāyām iti kim ? dvau pādau dadāti  / dve śate dadāti  /
    pādaśatagrahaṇam anarthakam  / anyatra api darśanāt  / dvimodakikāṃ dadāti trimodakikāṃ
    dadāti //
