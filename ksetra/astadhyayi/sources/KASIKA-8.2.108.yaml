source_id: KASIKA-8.2.108
locator:
  sutra: 8.2.108
witness_text:
  sutra: tayor y-v-āv aci saṃhitāyām
  commentary: tayoḥ idutoḥ yakāravakārādeśau bhavato 'ci saṃhitāyāṃ viṣaye  / saṃhitāyām
    ity etac cādhikṛtam  / ita utaram ādhyāyaparisamāpteḥ yad vakṣyāmaḥ saṃhitāyām
    ity evaṃ tad veditavyam  / agnā3yāśā  / paṭā3vāśā  / agnā3yindram  / paṭā3vudakam  /
    aci iti kim ? agnā3i  / paṭā3u  / saṃhitāyām iti kiṃ ? agnā3i indram  / paṭā3u
    udakam  / idutor asiddhatvāt iko yaṇaci (*6,1.77) iti na prāpnoti ity ayam ārambhaḥ  /
    athāpi kathañcit tayoḥ siddhatvaṃ syāt, evam api svarṇadīrghatvanivṛttyarthaṃ
    śākalanivṛttyarthaṃ ca vaktvayam etat  / athāpi tan nivṛttyarthaṃ yatnāntaram
    asti, tathāpi yaṇsvaranivṛttyartham idam ārabhyate  / yaṇādeśasya asiddhatvāt
    udāttasvaritayor yaṇaḥ svarito 'nudāttasya (*8,2.4) ity eṣa svaro na bhavati //
    kiṃ nu yaṇā bhavati iha na siddhaṃ yvāvidutoryadayaṃ vidadhāti  / tau ca mama
    svarasandhiṣu sidddhau śākaladīrghavidhī tu nivartyau // ik tu yadā bhavati plutapūrvas
    tasya yaṇaṃ vidadhātyapavādam  / tena tayoś ca na śākaladīrghau yaṇsvarabadhanam
    eva tu hetuḥ // iti śrīvāmanaviracitāyāṃ kāśikāyāṃ vṛttau aṣṭamādhyāyasya dvitīyaḥ
    pādaḥ  / aṣṭamādhyāyasya tṛtīyaḥ pādaḥ  / [#937]
