locator:
  sutra: 5.1.28
witness_text:
  sutra: adhyardhapūrva-dvigor lug asañjñāyām
  commentary: ārhāt ity eva  / adhyardha-śabdaḥ pūrvo yasmin tasmād adhyardhapūrvāt
    prātipadikad dvigoś ca parasya ārhīyasya lug bhavati asañjñāyāṃ iti kim ? pāñcalohitikam  /
    pāñcakalāpikam  / lohinī-śabdasya bhasyāḍhe taddhite iti puṃvadbhāvaḥ  / pratyayāntasya
    viśeṣaṇam asañjñā-grahaṇaṃ na cet pratyayāntaṃ sañjñā iti  / adhyardha-śabdaḥ
    saṅkhyā+eva, kimarthaṃ bhedena+upādīyate ? jñāpakārthaṃ, kvacid asya saṅkhyākāryaṃ
    na bhavati, saṅkhyāyāḥ kriyā-abhyāvṛttigaṇane kṛtvasuc (*5,4.17) iti //
