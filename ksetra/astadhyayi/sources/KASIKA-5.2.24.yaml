locator:
  sutra: 5.2.24
witness_text:
  sutra: tasya pāka-mūle pīlvadi-karṇādibhyaḥ kuṇab-jāhacau
  commentary: tasya iti ṣaṣṭhīsamarthebhyaḥ pīlvādibhyaḥ karṇādibhyaś ca yathāsaṅkhyaṃ
    pāka-mūlayor arthayoḥ kuṇap jāhac ity etau pratyayau bhavataḥ  / pīlūnāṃ pākaḥ
    pīlukuṇaḥ  / karkandhukuṇaḥ  / karṇādibhyaḥ - karṇasya mūlaṃ karṇajāham  / pīlu  /
    karkandhu  / śamī  / karīra  / kuvala  / badara  / aśvattha  / khadira  / pīlvādiḥ  /
    karṇa  / akṣi  / nakha  / mukha  / makha  / keśa  / pāda  / gulpha  / bhrūbhaṅga  /
    danta  / oṣṭha  / pṛṣṭha  / aṅguṣṭha  / karṇādiḥ // [#503]
