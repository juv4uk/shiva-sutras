source_id: KASIKA-6.1.12
locator:
  sutra: 6.1.12
witness_text:
  sutra: dāśvān sāhvān mīḍvāṃś ca
  commentary: dāśvān sāhvān mīḍvān ity ete śadāḥ chandasi bhāṣāyām ca aviśeṣeṇa nipāyane  /
    dāśvān iti dāśṛ dāne ity etasya dhātoḥ kvasau advirvacanam aniṭtvaṃ ca nipātyate  /
    dāśvāṃso dāśuṣaḥ sutam iti  / [#598] sāhvān iti ṣaha marṣaṇe ity etasya parasmaipadam,
    upadhādīrghatvam, advirvacanam aniṭtvaṃ ca nipātanāt  / sāhvān balāhakaḥ / mīḍvān
    iti miha secane ity etasya advirvacanam, aniṭtvam, upadhādīrghatvaṃ ḍhatvaṃ ca
    nipātanāt  / mīḍvastokāya tanayāya mṛla  / ekavacanam atantram  / kṛñādīnāṃ ke
    dve bhavata iti vaktavyam  / kriyate 'nena iti cakram  / ciklidam  / kṛñaḥ klideś
    ca ghañarthe kavidhānam iti kaḥ pratyayaḥ  / caricalipativadīnāṃ dvitvamacyāk
    ca abhyāsasya  / carādīnāṃ dhātūnām api pratyaye parataḥ dve bhavataḥ  / abhyāsasya
    āgāgamo bhavati  / āgāgamavidhānasāmarthyāc ca halādiśeṣo na bhavati  / halādiśeṣe
    hi sayāgamasya ādeśasya ca viśeṣo na asti  / carācaraḥ  / calācala  / patāpataḥ
    / vacāvadaḥ  / veti vaktavyam  / tena caraḥ puruṣaḥ, calo rathaḥ , pataṃ yānam,
    vado manuṣyaḥ ity evam ādi siddhaṃ bhavati  / hanter ghatvaṃ ca  / hanter aci
    pratyaye parato dve bhavataḥ, abhyāsasya ca hakārasya ca ghatvam, āk cāgamo bhavati  /
    parasya abhyāsāc ca (*7,3.55) iti kutvam ghanāghanaḥ kṣobhaṇaścarṣaṇīnām  / pāṭer
    ṇiluk cok ca dīrghaś ca abhyāsasya  / pāṭer aci parato dve bhavato ṇiluk ca bhavati  /
    abhyāsasya ca ūgāgamo dīrghaś ca bhavati  / pāṭūpaṭaḥ //
