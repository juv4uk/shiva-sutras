witness_text:
  sutra: chandoga-aukthika-yājñika-bahvṛca-naṭāj ñyaḥ
  commentary: saṅghādayo nivṛttāḥ, sāmānyena vivānam  / chandoga-ādibhyaḥ śabdebhyo
    ñyaḥ pratyayo bhavati tasya+idam ity etasmin viṣaye  / vuñaṇor apavādaḥ  / caraṇād
    dharmāmnāyayoḥ, tatsāhacaryān naṭaśabdādapi dharmāmnāyayoreva bhavati  / chandogānāṃ
    dharmo vā āmnāyo vā chandogyam  / aukthikyam  / yājñikyam  / bāhvṛcyam  / nāṭyam  /
    anyatra chāndogaṃ kulam ity ādiḥ //
