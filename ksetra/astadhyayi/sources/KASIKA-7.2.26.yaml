locator:
  sutra: 7.2.26
witness_text:
  sutra: ṇer adhyayane vṛttam
  commentary: ṇyantasya vṛtter niṣṭhāyām adhyayanārthe vṛttam iti iḍabhāvaḥ ṇiluk
    ca nipātyate  / vṛtto guṇe devadattena  / vṛttaṃ pārāyaṇaṃ devadattena  / adhyayane
    iti kim ? vartitam anyatra  / vṛtirayam akarmakaḥ, sa ṇyarthe vartamānaḥ sakarmako
    bhavati  / tena nirvṛttam iti hi prakṛṭer eva karmaṇi ktapratyayo dṛśyate  / tadvad
    iha api ṇyarthavṛtter eva ca vṛteḥ vṛtto guṇo devadattena iti bhaviṣyati iti nipātanam
    anarthakam ? tat kriyate yadāpi ṇicaiva ṇyartho 'bhidhīyate tadāvartitam ity adhyayane
    mā bhūt iti kecit  / apare tu vartito guṇo devadattena ity api icchanti // [#807]
