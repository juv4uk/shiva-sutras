source_id: KASIKA-6.4.62
locator:
  sutra: 6.4.62
witness_text:
  sutra: sya-sic-sīyuṭ-tāsiṣu bhāva-karmaṇor upadeśe 'j-jhana-graha-dṛśāṃ vā ciṇvad-iṭ
    ca
  commentary: sva sic sīyuṭ tāsi ity eteṣu bhāvakarmaviṣayeṣu parata upadeśe ajantānām
    aṅgānāṃ han graḥ dṛś ity eteṣāṃ ca ciṇvat kāryaṃ bhavati vā  / yadā ciṇvat tadā
    iḍāgamo bhavati  / kasya ? syasicsīyuṭtāsīnām eva iti veditavyam  / te hi prakṛtāḥ  /
    aṅgasya tu lakṣyavirodhāt na kriyate  / kāni punar asya yogasya prayojanāni ?
    ciṇvadvṛddhir yuk ca hanteś ca ghatvaṃ dīrghaś ca+ukto yo mitāṃ vā ciṇīti  / iṭ
    ca asiddhas tena me lupyate ṇirnityaś ca ayaṃ valnimitto vighātī // [#746] ajantānāṃ
    tāvat - cāyiṣyate, ceṣyate  / acāyiṣyata, aceṣyata  / dāyiṣyate, dāsyate  / adāyiṣyata,
    adāsyata  / śāmiṣyate, śamiśyate, śamayisyate  / aśāmiṣyata, aśamiṣyata aśamayiṣyata  /
    han - ghāniṣyate, haniṣyate  / aghāniṣyata, ahaniṣyata  / graḥ - grāhiṣyate, grahīṣyate  /
    agrāhiṣyata, agrahīṣyata  / graho 'liṭi dīrghaḥ (*7,2.37) iti prakṛtasya iṭo dīrghatvam  /
    dṛś - darśiṣyate, drakṣyate  / adarśiṣyata, adrakṣyata  / sici ajantānām - acāyiṣātām,
    aceṣātām  / adāyiṣātām, adiṣātām  / aśāmiṣātam, aśamiṣātam, aśamayiṣātām  / han
    - aghāniṣātām, avadhiṣātām, ahasātām  / graḥ - agrāhiṣātām, agrahīṣātām  / dṛś
    - adarśiṣātām, adṛkṣātām  / sīyuṭi ajantānām - cāyiṣīṣta, ceṣīṣṭa  / dāyiṣīṣṭa,
    dāsīṣṭa  / śāmiṣīṣṭa, śamiṣīṣṭa, śamayiṣīṣṭa  / han - ghāniṣīṣṭa, vadhiṣīṣṭa  /
    graḥ - grāhiṣīṣṭa, grahīṣīṣṭa  / dṛś - darśiṣīṣṭa, dṛkṣīṣṭa  / tāsāvajantānām
    - cāyitā, cetā  / dāyitā, dātā  / śāmitā, śamitā, śamayita  / han - ghānitā, hantā  /
    graḥ - grāhitā, grahītā  / dṛś - darśitā, draṣṭā  / syasicsīyuṭtāsiṣu iti kim
    ? cetavyam  / dātavyam  / bhāvakarmaṇoḥ iti kim ? ceṣyati  / dāsyati  / upadeśe
    iti kim ? kāriṣyate iti guṇe kṛte raparatve ca na prāpnoti, upadeśagrahaṇād bhavati  /
    ajjhanagrahadṛśām iti kim ? paṭhiṣyate  / aṅgādhikāravihitaṃ kāryam iha atidiśyate,
    tena haniṇiṅāmādeśā na bhavanti  / haniṣyate, ghāniṣyate  / eṣyate, āyiṣyate  /
    adhyeṣyate, adhyāyiṣyate  / hano vadha liṅi (*2,4.42), luṅi ca (*2,4.43), iṇo
    gā luṅi (*2,4.45), vibhāṣā luṅlṛṅoḥ (*2,4.50) ity ete vidhayo na bhavanti //
