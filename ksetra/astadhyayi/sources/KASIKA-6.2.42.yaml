source_id: KASIKA-6.2.42
locator:
  sutra: 6.2.42
witness_text:
  sutra: kurugārhapata-riktagurv-asūtajaraty-aślīladṛḍharūpā-pārevaḍavā-taitilakadrū-paṇyakambalo
    dāsībhārāṇāṃ ca
  commentary: kurugārhapata riktaguru asūtajaratī aślīladṛḍharūpā-pārevaḍavā taitilakadrū
    paṇyakambala ity ete samāsāḥ, teṣāṃ dāsībhārādīnāṃ ca pūrvapadaṃ prakṛtisvaraṃ
    bhavati  / kurūṇāṃ gārhapataṃ kurugārhapatam  / kṛgrorucca iti kuruśabdaḥ kupratyayānto
    'ntodāttaḥ  / kuruvṛjyor gārhapata iti vaktavyam  / vṛjīnāṃ gārhapataṃ vṛjigārhapatam  /
    vṛjiśabda ādyudāttaḥ  / rikto guruḥ riktaguruḥ, riktaguruḥ  / rikte vibhāṣā (*6,1.208)
    iti pūrvapadam ādyudāttam antodattaṃ vā  / asūtā jaratī asūtajaratī  / aślīlā
    dṛḍharūpā aślīladṛḍharūpā  / aślīlaśabdo nañsamāsatvād ādyudāttaḥ  / śrīḥ yasya
    asti tat ślīlam  / sidhmāder ākṛtigaṇatvāl lac  / kapilakāditvāc ca latvam  /
    aślīladṛḍharūpā iti hi saṃsthānamātreṇa śobhanā niḥśrīkā lāvaṇyavirahitā ucyate  /
    pāre vaḍavā iva pārevaḍavā  / nipātanādivārthe samāso vibhaktyalopaś ca  / pāraśado
    ghṛtāditvādantodāttaḥ  / taitilānāṃ kadrūḥ taitilakadrūḥ  / titilino 'patyaṃ chātro
    vā taitilaḥ ity aṇantaḥ  / paṇyakambalaḥ  / paṇyaśabdo yadantatvād ādyudāttaḥ  /
    paṇyakambalaḥ sañjñāyām iti vaktavyam  / anyatra paṇitavye kambale samāsāntodāttattvam
    eva  / pratipadokte hi kṛtyānāṃ samāse dvitīyā dṛtyā ity eṣa vihitaḥ svaritaḥ  /
    dāsyā bhāraḥ dāsībhāraḥ  / devahūtiḥ  / devajūtiḥ  / devasūtiḥ  / devanītiḥ  /
    antodāttaṃ pūrvapadam  / vasunītiḥ  / vasuśadaḥ ādyudāttaḥ  / śṝsvṛsnihitrapyasivasi
    ity atra dhānye nit iti vartate  / oṣadhiḥ  / oṣo dhīyate 'syām iti karmaṇyadhikaraṇe
    ca (*3,3.93) iti kipratyayaḥ  / oṣaśabdo ghañantatvād ādyudāttaḥ  / candramāḥ  /
    candre mo ḍit iti asipratyayānto 'yam  / candraśabdas tu rakpratyāntatvād antodāttaḥ  /
    yasya tatpuruṣasya pūrvapadaprakṛtisvaratvam iṣyate, na ca vihitaṃ, sa sarvo dāsībhārādisu
    draṣṭavyaḥ //
