locator:
  sutra: 3.3.145
witness_text:
  sutra: anavaklṛpty-amarṣayor akiṃvṛtte 'pi
  commentary: garhāyām iti nivṛttam  / anavaklṛptiḥ asambhāvanā  / amarṣaḥ akṣamā  /
    kiṃvṛtte 'kiṃvṛtte ca+upapade anavaklṛpty-amarṣayoḥ dhātoḥ liṅ-lṛṭau pratyayau
    bhavataḥ  / sarva-lakārāṇām apavādaḥ  / bahvacaḥ pūrvanipāto lakṣaṇavyabhicāracihnam  /
    tena yathāsaṅkhyaṃ na bhavati  / anavaklṛptau tāvat - na avakalpayāmi, na sambhāvayāmi,
    na śraddadhe tatrabhavān nāma vṛṣalaṃ yājayet, tatrabhavān nāma vṛṣalaṃ yājayiṣyati  /
    ko nāma vṛṣalo yaṃ tatrabhavān vṛṣalaṃ yājayet, ko nāma tatrabhavān vṛṣalaṃ yājayiṣyati  /
    amarṣe - na marṣayāmi tatrabhavān vṛṣalaṃ yājayet, yājayiṣyati  / ko nāma vṛṣalo
    yaṃ tatrabhavān yājayet, yājayiṣyati  / bhūta-vivakṣāyāṃ tu kriya-atipattau vā
    lṛṅ bhavati  / bhaviṣyati nityam  / na avakalpayāmi tatrabhavān nāma vṛṣalam ayājayiṣyat
    //
