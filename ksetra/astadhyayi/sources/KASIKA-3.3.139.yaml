source_id: KASIKA-3.3.139
locator:
  sutra: 3.3.139
witness_text:
  sutra: liṅ-nimitte lṛṅ kriyā-atipattau
  commentary: bhaviṣyati ity anuvartate  / hetu-hetumator liṅ (*3,3.156) ity evam
    ādikaṃ liṅo nimittam  / tatra liṅ-nimitte bhaviṣyati kāle lṛṅ pratyayo bhavati
    kriyātipattau satyām  / kutaścid vaiguṇyād anabhinirvṛttiḥ kriyāyāḥ kriyātipattiḥ  /
    dakṣiṇena ced āyāsyan na śakaṭaṃ paryabhavisyat  / yadi kamalakamāhvāsyan na śakaṭaṃ
    paryābhaviṣyat  / abhokṣyata bhavān ghṛtena yadi matsamīpamāgamiṣyat  / bhaviṣyat
    kāla-viṣayam etad vacanam  / bhavisyad aparyābhavanaṃ ca hetumat, tatra hetubhūtaṃ
    ca kamalakāhvānam  / liṅgiliṅge buddhavā tadatipattiṃ ca pramāṇāntarād avagamya
    vaktā vākyaṃ prayuṅkte, yadi kamalakamāhvāsyanna śakṭaṃ paryābhaviṣyat iti  /
    hetuhetumator āhvānāparyābhavanayoḥ bhaviṣyat kāla-viṣayayoḥ atipattiḥ ito vākyād
    avagamyate //
