source_id: KASIKA-6.4.60
locator:
  sutra: 6.4.60
witness_text:
  sutra: naṣṭhāyām aṇyadarthe
  commentary: ṇyataḥ kṛtyasya artho bhāvakarmaṇī, tābhyām anyatra yā niṣṭhā tasyāṃ
    kṣiyo dīrgho bhavati  / ākṣīṇaḥ  / prakṣīṇaḥ  / parikṣīṇaḥ  / akarmakatvāt kṣiyaḥ
    kartari ktaḥ  / prakṣīṇam idam devadattasya iti kto 'dhikaraṇe ca dhrauvya-gati.
    pratyavasānārthebhyaḥ (*3,4.76) ity adhikaraṇe ktaḥ  / aṇyadarthe iti kim ? akṣitamasi
    mā mekṣeṣṭhāḥ  / kṣitam iti bhāve dīrghābhāvāt kṣiyo dīrghāt (*8,2.46) iti niṣṭhānatvam
    api na bhavati //
