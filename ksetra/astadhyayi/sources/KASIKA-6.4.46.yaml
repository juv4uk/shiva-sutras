source_id: KASIKA-6.4.46
locator:
  sutra: 6.4.46
witness_text:
  sutra: ārdhadhātuke
  commentary: ārdhadhātuke ity adhikāraḥ  / na lyapi (*6,4.69) iti prāg etasmād yad
    ita ūrdhvam anukramiṣyāmaḥ ārdhahdātuke ity evaṃ tad veditavyam  / vakṣyati -
    ato lopaḥ (*6,4.48)  / cikirṣatā  / jihīrṣitā  / ārdhadhātuke iti kim ? bhavati  /
    bhavataḥ  / adiprabhṛtibhyaḥ śapo lugvacanaṃ (*2,4.72) pratyayalopalakṣaṇapratiṣedhārthaṃ
    syāt ity etan na jñāpakaṃ śapo lopābhāvasya  / yasya halaḥ (*6,4.49)  / bebhiditā  /
    bebhiditum  / bebhiditavyam  / ārdhadhātuke iti kim ? bebhidyate  / ṇeraniṭi (*6,4.51)  /
    kāraṇā  / hāraṇā  / ārdhadhātuke iti kim ? kārayati  / hārayati  / āto lopa iṭi
    ca (*6,4.64)  / yayatuḥ  / yayuḥ  / vavatuḥ  / vavuḥ  / ārdhadhātuke iti kim ?
    yānti  / vānti  / ghumāsthāgāpājahātisāṃ hali (*6,4.66)  / dīyate  / dhīyate  /
    ārdhadhātuke iti kim ? adātām  / adhātām  / vā 'nyasya saṃyogādeḥ (*6,4.68)  /
    sneyāt, snāyāt  / ārdhadhātuke iti kim ? snāyāt  / āśīrliṅo 'nyatra na bhavati  /
    [#743] syasicsīyuṭtāsiṣu bhāvakarmaṇor upadeśe 'jjhanagrahadṛśāṃ vā ciṇvadiṭ ca
    (*6,4.62)  / kāriṣīṣṭa  / hāriṣīṣṭa  / ārdhadhātuke iti kim ? kriyeta  / hriyeta
    yagantasya ajantatvāc ciṇvadbhāve sati vṛddhiḥ syāt, tataś ca yuk prasajyeta  /
    ato lopo yalopaś ca ṇilopaś ca prayojanam  / āllopa ītvam etvam ca ciṇvadbhavaś
    ca sīyuṭi //
