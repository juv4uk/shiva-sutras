source_id: KASIKA-3.3.110
locator:
  sutra: 3.3.110
witness_text:
  sutra: vibhā-āṣakhyāna-paripraśnayor iñ ca
  commentary: pūrvaṃ paripraśnaḥ, paścādākhyānam  / sūtre 'lpāctarasya pūrvanipātaḥ  /
    paripraśne ākhyāne ca gamyamāne dhatoḥ iñ pratyayo bhavati, cakārāt ṇvul api  /
    vibhāṣa-grahaṇāt paro 'pi yaḥ prāpnoti, so 'pi bhavati  / kāṃ tvaṃ kārimakārṣīḥ,
    kāṃ kārikām akārṣīḥ, kāṃ kriyāmakārṣīḥ, kāṃ kṛtyāmakārṣīḥ, kā kṛtimakārṣīḥ ? sarvāṃ
    kārimakārṣam, sarvāṃ kārikām akārṣam, sarvāṃ kriyāmakārṣam, sarvāṃ kṛtyāmakārṣam,
    sarvāṃ kṛtimakārṣam  / kāṃ gaṇimajīgaṇaḥ, kāṃ gaṇikāmajīgaṇaḥ, kāṃ gaṇanāmajīgaṇaḥ
    ? sarvāṃ gaṇimajīgaṇam, sarvāṃ gaṇikām, sarvāṃ gaṇanām  / evaṃ kāṃ yājim, kāṃ
    yājikām, kāṃ yācim, kāṃ yacikām, kāṃ pācim, kāṃ pācikām kāṃ pacām, kāṃ paktim,
    kāṃ pāṭhim, kāṃ pāṭhikām, kāṃ paṭhitim iti draṣṭavyam  / ākhyānaparipraśnayoḥ
    iti kim ? kṛtiḥ  / hṛtiḥ //
