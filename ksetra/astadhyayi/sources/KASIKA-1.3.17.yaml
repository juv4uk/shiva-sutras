source_id: KASIKA-1.3.17
locator:
  sutra: 1.3.17
witness_text:
  sutra: ner viśaḥ
  commentary: śaṣāt kartari parsmaipadam (*1,3.78) iti prasmaipade prāpte ni-pūrvād
    viśa ātmanepadaṃ vidhīyate  / neḥ parasmād viśa ātmanepadaṃ bhavati  / niviśate  /
    niviśante  / neḥ iti kim ? praviśati  / ya-dāgamās tad-grahaṇena gṛhyante tena
    aṭā na asti vyavadhānam  / nyaviśata  / ner upasargasya grahaṇam, arthavad-grahane
    na anarthakasya grahaṇam iti  / tasmād iha na bhavati, madhuni viśānti bhramarāḥ
    //
