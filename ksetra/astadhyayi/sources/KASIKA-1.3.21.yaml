source_id: KASIKA-1.3.21
locator:
  sutra: 1.3.21
witness_text:
  sutra: krīḍo 'nu-saṃ-paribhyaś ca
  commentary: krīḍṛ vihāre, etasmād anu sam pari ity evaṃ pūrvād āṅ-pūrvāc ca-ātmanepadaṃ
    bhavati  / anukrīḍate  / saṅkrīḍate  / parikrīḍate  / āṅaḥ khalvapi, ākrīḍate  /
    samā sāhacaryād anvādir upasargo gṛhyate, tena+iha karmapravacanīya-prayoge na
    bhavati, māṇavaka-manu krīḍati  / samo 'kūjane iti vaktavyam  / saṅkrīḍanti śakaṭāni  /
    āgameḥ kṣamāyām ātmanepadaṃ vaktavyam  / kṣamā upekṣā, kālaharaṇam iti yāvat  /
    āgamayasva tāvanmāṇavakam  / śikṣerjijñāsāyām  / vidyāsu śikṣate  / āśiṣi nāthaḥ  /
    sarpiṣo nāthate  / madhuno nāthate  / āśiṣi iti kim ? māṇavakamanunāthati  / haratergatatācchīlye  /
    paitṛkamaśvā anuharante  / mātṛkaṃ gāvo 'nuharante  / gatatācchīlye iti kim ?
    māturanuharati  / kiraterharṣajīvikākulāyakaraṇeṣv iti vaktavyam  / apaskirate
    vṛṣabho hṛṣṭaḥ  / jīvikāyām - apaskirate kukkuṭo bhakṣārthī  / kulāyakaraṇe --
    apaskirate śvā āśrayārthī  / harṣādiṣu iti kim ? apakirati kusumam  / āṅi nupracchyor
    upasaṅkhyānam  / ānute sṛgālaḥ  / āpṛcchate gurum  / śapa upalambhana iti vaktavyam  /
    vācā śarīra-sparśanam upalambhanam  / devadattāya śapate  / yajñadattāya śapate  /
    upalambhane iti kim ? śapati // [#57]
