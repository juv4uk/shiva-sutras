source_id: KASIKA-1.4.57
locator:
  sutra: 1.4.57
witness_text:
  sutra: ca-ādayo 'sattve
  commentary: ca-ādayo nipāta-sañjñā bhavanti, na cet sattve vartante  / prasajya-pratiṣedho
    'yam  / sattvam iti dravyam ucyate  / ca  / vā  / ha  / aha  / eva  / evam  /
    nūnam  / śaśvat  / yugapat  / sūpat  / kūpat  / kuvit  / net  / cet  / caṇ  /
    kaccit  / yatra  / naha  / hanta  / mākim  / nakim  / māṅ  / māṅo ṅakāro viśeṣaṇārthaḥ,
    māṅi luṅ (*3,3.175) iti  / iha na bhavati, mā bhavatu, ma bhaviṣyati  / nañ  /
    yāvat  / tāvat  / tvā  / tvai  / dvai  / rai  / śrauṣaṭ  / vauṣaṭ  / svāhā  /
    vaṣaṭ  / svadhā  / om  / kila  / tathā  / atha  / su  / sma  / asmi  / a  / i  /
    u  / ṛ  / ḷ  / e  / ai  / o  / au  / am  / tak  / uñ  / ukañ  / velāyām  / mātrāyām  /
    yathā  / yat  / yam  / tat  / kim  / purā  / addhā  / dhik  / hāhā  / he  / hai  /
    pyāṭ  / pāṭ  / thāṭ  / aho  / utāho  / ho  / tum  / tathāhi  / khalu  / ām  /
    āho  / atho  / nanu  / manye  / mithyā  / asi  / brūhi  / tu  / nu  / iti  / iva  /
    vat  / cana  / bata  / iha  / śam  / kam  / anukam  / nahikam  / hikam  / sukam  /
    satyam  / ṛtam  / śraddhā  / iddhā  / mudhā  / no cet  / na cet  / nahi  / jātu  /
    katham  / kutaḥ  / kutra  / ava  / anu  / hāhau  / haihā  / īhā  / āhosvit  /
    chambaṭ  / kham  / diṣṭyā  / paśu  / vaṭ  / saha  / ānuṣak  / aṅga  / phaṭ  /
    tājak  / aye  / are  / caṭu  / bāṭ  / kum  / khum  / ghum  / hum  / āīm  / śīm  /
    sīm  / vai  / upasarga-vibhakti-svara-pratirūpakāś ca nipātāḥ  / upasarga-pratirūpakāḥ
    -- avadattam vidattaṃ ca pradataṃ ca adikarmaṇi  / sudattam anudattaṃ ca nidattam
    iti ceṣyate // aca upasargāt taḥ (*7,4.47) iti tatvam na bhavati  / durnītam  /
    durnayaḥ  / durnirṇayaḥ // upasargāt (*8,4.14) iti ṇatvaṃ na bhavati  / asattve
    iti kim ? paśur vai puruṣaḥ  / paśuḥ puroḍaśaḥ nipāta-pradeśāḥ -- svara-ādi-nipatam
    avyayam (*1,1.37) ity evam ādayaḥ //
