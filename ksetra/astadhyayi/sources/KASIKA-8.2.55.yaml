source_id: KASIKA-8.2.55
locator:
  sutra: 8.2.55
witness_text:
  sutra: anupasargāt phulla-kṣība-kṛśa-ullāghāḥ
  commentary: phulla kṣība kṛśa ullāgha ity ete nipātyante, na ced upasargād uttarā
    bhavanti  / phullaḥ iti ñiphalā viśaraṇe ity etasmād dhātor uttarasya niṣṭhātakārasya
    lakāro nipātyate  / utvamiḍabhāvaś ca siddha eva  / ktavatvantasya apy etal latvam
    iṣyate, phullaḥ, phullavān iti  / kṣībakṛśollādhāḥ iti kṣībikṛśibhyām utpūrvāc
    ca lāgheḥ kta pratyayasya talopaḥ iḍabhāvaś ca nipātyate  / kṛte va iṭi icchabdalopaḥ  /
    kṣībaḥ  / kṛśaḥ  / ullāghaḥ  / anupasargāt iti kim ? praphultāḥ sumanasaḥ  / prakṣībitaḥ  /
    prakṛśitaḥ  / prollādhitaḥ  / lāgherudo 'nyaḥ upasarga pratiṣidhyate  / utphullasamphullayor
    iti vaktavyam  / utphullaḥ  / samphullaḥ  / parikṛśaḥ ity atra yaḥ pariśabdaḥ
    sa kriyāntarayogāt kṛśiṃ pratyanupasarga eva, parigataḥ kṛśaḥ parikṛśaḥ iti //
