source_id: KASIKA-8.2.29
locator:
  sutra: 8.2.29
witness_text:
  sutra: s-koḥ saṃyoga-ādyor ante ca
  commentary: padasya ante yaḥ saṃyogaḥ, jhali parato vā yaḥ saṃyogaḥ, tadādyoḥ sakārakakārayor
    lopo bhavati  / lasjeḥ lagnaḥ  / lagnavān  / sādhulak  / masjeḥ - magnaḥ  / kakārasya
    - takṣeḥ taṭ  / taṣṭaḥ  / taṣṭavān  / kāṣṭhatat  / jhali saṅīti vaktavyam  / kim
    idaṃ siṅi iti ? sanaḥ saprabhṛti mahiṅo ṅakāreṇa pratyāhāraḥ  / iha mā bhūt, kaṣṭhaśakṣthātā
    iti  / thakāre jhali kakārasya saṃyogāder lopaḥ prāpnoti  / tad atra śakeḥ kvibantasya
    prayoga eva na asti ity āha kāṣṭhaśageva na asti, kuto 'yaṃ kāṣṭhaśaki tiṣṭhet
    iti  / vāsyartham, kākvartham ity atra api bahiraṅgalakṣaṇasya yaṇādeśasya asiddhatvāt
    saṃyogādilopo na bhavati  / skoḥ iti kim ? narnarti  / varvarti  / saṃyogādyoḥ
    iti kim ? payaḥśak  / ante ca iti kim ? takṣitaḥ  / takṣakaḥ //
