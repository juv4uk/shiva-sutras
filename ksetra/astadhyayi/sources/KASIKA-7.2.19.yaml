source_id: KASIKA-7.2.19
locator:
  sutra: 7.2.19
witness_text:
  sutra: dhṛṣī śasī vaiyātye
  commentary: viyātasya bhāvo vaiyātyam prāgalbhyam, avinītatā  / tatra dhṛṣa śasa
    ity etayoḥ niṣṭhāyām iḍāgamo na bhavati  / dhṛṣṭo 'yam  / viśasto 'yam  / dhṛṣeḥ
    āditaś ca (*7,2.16) iti pratiṣedhaḥ siddha eva, śaser api udito vā (*7,2.56),
    yasya vibhāṣā (*7,2.15) iti ? niyamārthaṃ vacanam, dhṛṣiśasyoḥ vaiyātye eva iḍ
    na bhavati  / bhāvādikarmaṇor api vaiyātye dhṛṣirnāsti  / dhṛṣṭaḥ  / viśastaḥ  /
    vaiyātye iti kim ? dharṣitaḥ  / viśasitaḥ //
