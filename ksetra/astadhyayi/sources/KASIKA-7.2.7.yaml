source_id: KASIKA-7.2.7
locator:
  sutra: 7.2.7
witness_text:
  sutra: ato halāder laghoḥ
  commentary: halāder aṅgasya laghor akārasya iḍādau sici parasmaipadapare parato
    vibhāṣā vṛddhir na bhavati  / akaṇīt, akāṇīt  / araṇīt, arāṇīt  / ataḥ iti kim
    ? adevīt  / asevīt  / nyakuṭīt, nyapuṭīt, ity atra ataḥ ity asminnasati sthāninirdeśārthamacaḥ
    ity etad anuvartayitavyam  / tatra ajlakṣaṇā vṛddhir iglakṣaṇā na bhavati iti
    kṅiti ca (*7,2.118) iti pratiṣedho na syāt  / halāder iti kim ? ma bhavānaśīt  /
    mā bhavānaṭīt  / laghoḥ iti kim ? atakṣīt  / arakṣīt  / atha+iha kasmān na bhavati
    acakāsīt iti ? yena nāvyavadhānam tena vyavahite 'pi vacanaprāmāṇyāt iti halā
    vyavadhānam āśritam, na punaracāpi vyavadhānam iti vṛddhir na bhavati  / atha
    punar ekena varṇena vyavadhānam aśrīyate na punar anekena iti kalpane śakyamakartuṃ
    laghoḥ iti, atakṣīt ity atra anekena vyavadhānam iti na bhavisyati ? tat kriyate
    vispaṣṭārtham  / iṭi ity eva, apākṣīt // [#799]
