source_id: KASIKA-8.3.88
locator:
  sutra: 8.3.88
witness_text:
  sutra: su-vi-nir-durbhyaḥ supi-sūti-samāḥ
  commentary: su vi nir dur ity etebhyaḥ uttarasya supi sūti sama ity eteṣāṃ sakārasya
    mūrdhanyādeśo bhavati  / supi iti svapiḥ kṛtasamprasāraṇo gṛhyate  / suṣuptaḥ  /
    viṣuptaḥ  / niḥṣuptaḥ  / duḥṣuptaḥ  / sūti iti svarūpagrahaṇam  / suṣūtiḥ  / viṣūtiḥ  /
    niḥṣūtiḥ  / duḥṣūtiḥ  / sama - suṣamam  / viṣamam  / niḥṣamam  / duḥṣamam  / supeḥ
    ṣatvaṃ svapermā bhūd visuṣvāpeti kena na  / halādiśeṣānna supiriṣṭaṃ pūrvaṃ prasāraṇam
    // sthādīnāṃ niyamo nātra prāk sitāduttaraḥ supiḥ  / anarthake viṣuṣupuḥ supibhūto
    dvir ucyate // pūrvatrāsiddhīyamadvirvacane iti kṛte ṣtve tato dvirvacanam //
    [#959]
