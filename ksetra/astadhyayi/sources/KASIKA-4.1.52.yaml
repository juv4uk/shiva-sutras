source_id: KASIKA-4.1.52
locator:
  sutra: 4.1.52
witness_text:
  sutra: bahuvrīheś ca antodattāt
  commentary: ktāt ity eva  / bahuvrīhir yo 'ntodāttaḥ, tasmāt striyāṃ ṅīṣ pratyayo
    bhavati  / svāṅga-pūrva-pado bahuvrīhir iha+udāharaṇam  / asvāṅga-pūrvapadād vikalpaṃ
    vakṣyati  / śaṅkhyabhinnī  / ūrubhinnī  / galalotkṛttī  / keśalūnī  / bahuvrīheḥ
    iti kim ? pādapatitā  / antodāttāj jātapratiṣedhaḥ  / dantajātā  / stanajātā  /
    pāṇigṛhītyādīnām arthaviśeṣe  / pāṇigṛhītī bhāryā  / yasya astu kathañcit pāṇir
    gṛhyate pāṇigṛhītā sā bhavati  / abahunañsuiālasukhādi-pūrvād iti vaktavyam  /
    bahukṛtā  / naṅ - akṛtā  / su - sukṛtā  / kāla - māsajātā  / saṃvatsara-jātā  /
    sukhādi - sukhajātā  / duḥkhajātā  / jāti-kāla-sukha-ādibhyo 'nācchādanāt kto
    'kṛta-mita. pratipannāḥ (*6,2.170) ity evam ādinā bhauvrīher antodāttatvam //
