source_id: KASIKA-6.4.52
locator:
  sutra: 6.4.52
witness_text:
  sutra: niṣṭhāyāṃ seṭi
  commentary: niṣṭhāyāṃ seṭi parato ṇerlopo bhavati  / kāritam  / hāritam  / gaṇitam  /
    lakṣitam  / seṭi iti kim ? saṃjñapitaḥ paśuḥ  / seḍgrahaṇasāmarthyād iha pūrveṇa
    api na bhavati  / sanīvantardha (*7,2.49) iti jñaperiṭi vikalpite yasya vibhāṣā
    (*7,2.15) iti niṣṭhāyāṃ pratiṣedhaḥ  / atha punaḥ ekācaḥ iti tatra anuvartate,
    tadā nityam atra bhavitavyam eva iḍāgamena iti seḍgrahaṇam anarthakam ? tat kriyate
    kālāvadhāraṇārtham, iḍāgame kṛte ṇilopo yathā syāt  / akṛte hi tatra ṇilope sati
    kāritam ity atra ekāca upadeśe 'nudāttāt (*7,2.10) iti iṭaḥ pratiṣedhaḥ prasajyeta
    //
