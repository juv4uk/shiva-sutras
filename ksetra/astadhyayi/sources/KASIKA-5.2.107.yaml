locator:
  sutra: 5.2.107
witness_text:
  sutra: ūṣa-suṣi-muṣka-madho raḥ
  commentary: ūṣa suṣi maṣka madhu ity etebhyo raḥ pratyayo bhavati matvarthe  / ūṣaraṃ
    kṣetram  / suṣiraṃ kāṣṭham  / muṣkaraḥ paśuḥ  / madhuro guḍaḥ  / [#523] itikaraṇo
    vivakṣārthaḥ sarvatrābhidheyaniyamaṃ karoti  / iha na bhavati, ūṣo 'smin ghaṭe
    vidyate, madhu asmin ghaṭe vidyate iti  / raprakaraṇe khamukhakuñjebhya upasaṅkhyānam  /
    khamasya asti kaṇṭhavivaram mahat kharaḥ  / mukham asya asti iti sarvasmin vaktavye
    mukharaḥ  / kuñjāvasya staḥ kuñjaraḥ  / hastihanū kuñjaśabdena+ucyete  / nagapāṃsupāṇḍubhyaś
    ca+iti vaktavyam  / nagaram  / pāṃsuram  / pāṇḍuram  / kacchvā hrasvatvam ca  /
    kaccuram //
