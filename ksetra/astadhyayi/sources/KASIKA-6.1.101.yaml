source_id: KASIKA-6.1.101
locator:
  sutra: 6.1.101
witness_text:
  sutra: akaḥ savarṇe dīrghaḥ
  commentary: akaḥ savarṇe aci parataḥ pūrvaparayoḥ sthāne dīrgha ekādeśo bhavati  /
    daṇḍāgram  / dadhīndraḥ  / madhūdake  / hotṝśyaḥ  / akaḥ iti kim ? agnaye  / savarne
    iti kim ? dadhyatra  / aci ity eva, kumārī śete  / nājjhalau (*1,1.10) ity atra
    yat ac iti pratyāhāragrahaṇaṃ tatra grahaṇakaśāstrasya anabhinirvṛttatvāt savarṇā
    na gṛhyanta iti savarnatvamīkāraśakārayor apratiṣiddham  / savarṇadīrghatve ṛti
    ṛ vā vacanam  / ṛti savarṇe parabhūte tatra ṛ vā bhavati iti vaktavyam  / hotṛ
    ṛkāraḥ hotṛkāraḥ  / yadā na ṛ tadā dīrgha eva hotṝkāraḥ  / lṛti lṛ vā vaktavyam  /
    lṭti savarṇe parato lṛ vā bhavati iti vaktavyam  / hotṛ lṛkāraḥ hotlṛkāraḥ  /
    hotṝkāraḥ  / ṛkāralṛkārayoḥ savarṇāsañjñāvidhir uktaḥ  / dīrghapakṣe tu samudāyāntaratamasya
    lṛvarṇasya dīrghasya abhāvāt ṛkāraḥ kriyate //
