source_id: KASIKA-2.1.48
locator:
  sutra: 2.1.48
witness_text:
  sutra: pātresamita-ādayaś ca
  commentary: samudāyā eva nipātyante  / pātresamita-ādayaḥ śabdas tatpuruṣa-sañjñā
    bhavanti kṣepe gamyamāne  / ye ca atra ktāntena saha samāsāḥ, teṣāṃ pūrvena+eva
    siddhe punaḥ pāṭho yuktārohyādi-parigraha-arthaḥ, pūrvapadādy-udāttatvaṃ yathā
    sayāt iti  / yuktarohyādiṣu hi pātresamitādayaś ca iti paṭhyate  / pātresamitāḥ  /
    pātrebahulāḥ  / avadhāraṇena kṣepo gamyate, pātre eva samitā na punaḥ kvacit kārye
    iti  / udumbaramaśakādaṣu upamayā kṣepaḥ  / mātaripuruṣaḥ iti pratiṣiddhasevanena  /
    piṇḍīṣūrādiṣu nirīhatayā  / avyaktattvāccākṛtigaṇo 'yam  / pātresamitāḥ  / pātrebahulāḥ  /
    udumbaramaśakāḥ  / udarakṛmiḥ  / kūpakacchapaḥ  / kūpacūrṇakaḥ  / avaṭakacchapaḥ  /
    kūpamaṇḍūkaḥ  / kumbhamaṇḍūkaḥ  / udapānamaḥḍūkaḥ  / nagarakākaḥ  / nagaravāyasaḥ  /
    mātariṣuruṣaḥ  / piṇḍīṣūraḥ  / pitariṣūraḥ  / geheśūraḥ  / gehenardī  / gehekṣveḍī  /
    gehevijitī  / gehevyāḍaḥ  / gehemehī  / gehedāhī  / hehedṛptaḥ  / gehedhṛṣṭaḥ  /
    garbhetṛptaḥ  / ākhanikabakaḥ  / goṣṭheśūraḥ  / goṣṭhe vijitī  / goṣṭhekṣveḍī  /
    goṣṭhepaṭuḥ  / goṣṭhepaṇḍitaḥ  / goṣṭhepragalbhaḥ  / karṇeṭiṭṭibhaḥ  / karṇeṭiriṭirā  /
    karṇecuracurā  / cakāro 'vadhāraṇa-arthaḥ, tena samāsāntaraṃ na bhavati, paramapātresamitāḥ
    iti //
