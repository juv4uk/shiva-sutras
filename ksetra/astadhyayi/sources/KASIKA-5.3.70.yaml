locator:
  sutra: 5.3.70
witness_text:
  sutra: prāg-ivāt kaḥ
  commentary: ive pratikṛtau (*5,3.96) iti vakṣyati  / prāk etasmād iva saṃśabdanād
    yānita ūrdhvam anukramiṣyāmaḥ kapratyayas teṣu adhikṛto veditavyaḥ  / vakṣyati
    - ajñāte (*5,3.73) iti  / aśvakaḥ  / gardabhakaḥ  / tiṅantād ayaṃ pratyayo niṣyate,
    akajiṣyate  / tiṅaś ca (*5,3.56) ity anuvṛttam uttarasūtreṇa+eva sambandhanīm
    // [#546]
