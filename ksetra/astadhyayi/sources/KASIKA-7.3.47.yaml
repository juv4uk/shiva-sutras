source_id: KASIKA-7.3.47
locator:
  sutra: 7.3.47
witness_text:
  sutra: bhastrā-eṣā-ajā-jñā-dvā-svā nañpūrvāṇām api
  commentary: eṣām ātaḥ sthāne yo 'kāras tasya itvaṃ na bhavati udīcāmācaryāṇāṃ matena  /
    bhastrā - bhastrakā, bhastrikā  / abhastrakā, abhastrikā  / eṣā - eṣakā, eṣikā  /
    ajā - ajakā, ajikā  / anajakā, anajikā  / jñā - jñakā jñikā  / ajñakā, ajñikā  /
    dvā - dvake, dvike  / svā - svakā, svikā  / asvakā, asvikā  / eṣādve nañpūrve
    na prayojayataḥ  / kiṃ kāraṇam ? tatra hi sati yadi sākackābhyāṃ nañsamāsaḥ, athāpi
    kṛte nañsamāse paścādakac, ubhayathāpi samāsād ya vibhaktir utpadyate tasyāṃ satyāṃ
    tyadātyatve sati ṭāpā bhavitavyam, so 'ntarvartinyā vibhaktyā subantāt paraḥ iti
    itvasya prāptir eva na asti  / tena aneṣakā, advake ity eva nityaṃ bhavitavyam  /
    svaśabdastu jñātidhanākhyāyāṃ nañpūrvo 'pi prayojayati  / bhastrā ity ayam abhāṣitapuṃskaḥ,
    tasya abhāṣitapuṃskāc ca (*7,3.48) ity eva siddhe yad iha grahaṇaṃ tadupasarjanārtham  /
    avidyamānā bhastrā yasyāḥ abhastrā  / sālpā abhastrakā, abhastrikā  / atra upasarjanahrasvatve
    kṛte punar bahuvrihau kṛte bhāṣitapuṃskād yaḥ ṭāp utpadyate tasya ke 'ṇaḥ (*7,4.13)
    iti yo hrasvaḥ, na asau abhāsitapuṃskād vihitasya ataḥ sthāne bhavati  / nañpūrvāṇām
    api ity apiśabdād anyapūrvāṇāṃ kevalānāṃ ca vidhir ayam iṣyate  / nirbhastrakā,
    nirbhastrikā, bahubhastrakā, bahubhastrikā, ity evam anayor api iṣyate  / atra
    nañpūrvāṇām iti vacanam anuvāda eva mandabuddhipratipattyarthaḥ //
