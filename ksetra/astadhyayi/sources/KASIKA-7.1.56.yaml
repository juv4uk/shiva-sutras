locator:
  sutra: 7.1.56
witness_text:
  sutra: śrī-grāmaṇyoś chandasi
  commentary: śrī grāmaṇī ity etayoḥ chandasi viṣaye āmo nuḍāgamo bhavati  / śrīṇāmudāro
    dharuṇo rayīṇām  / api tatra sūtagrāmaṇīnām  / śrīśabdasya vāmi (*1,4.5) iti vikalpena
    nadīsañjñā, tatra nityārthaṃ vacanam  / sūtagrāmaṇīnām iti yadā sūtāś ca te grāmaṇyaś
    ca sūtagrāmaṇyo bhavanti tadartham idaṃ vacanam  / yadā tu sūtaś ca grāmaṇīś ca
    sūtagrāmaṇi, sūtagrāmaṇi ca sūtagrāmaṇi ca sūtagrāmaṇi ca iti sūtagrāmaṇīnām iti,
    tadā hrasvāt ity eva siddham //
