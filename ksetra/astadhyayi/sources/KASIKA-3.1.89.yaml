source_id: KASIKA-3.1.89
locator:
  sutra: 3.1.89
witness_text:
  sutra: na duha-snu-namāṃ yak-ciṇau
  commentary: duha sanu nam it yeteṣaṃ karmakartari yak-ciṇau karmavadbhāva-apadiṣṭau
    na bhavataḥ  / duher anena yak pratiṣidhyate  / ciṇ tu duhaś ca (*3,1.63) iti
    pūrvam eva vibhāṣitaḥ  / dugdhe gauḥ svayam eva  / adugdha gauḥ svayam eva  /
    adohi gauḥ svayam eva  / prasnute gauḥ svayam eva  / prāsnoṣṭa gauḥ svayam eva  /
    namate daṇḍaḥ svayam eva  / anṃsta daṇḍaḥ svayam eva  / yak-ciṇoḥ pratiṣedhe ṇiśranthigranthibrūñ.
    ātmanepadākarmakāṇām upasaṅkhyānam  / kārayati kaṭaṃ devadattaḥ  / kārayate kaṭaḥ
    svayam eva  / acīkarat kaṭaṃ devadattaḥ  / acīkarata kaṭaḥ svayam eva  / utpucchayate
    gāṃ gopaḥ  / utpucchayate gauḥ svayam eva  / udapupucchata gauḥ svayam eva  /
    śrathnāti granthaṃ devadattaḥ  / śrathnīte granthaḥ svayam eva  / aśranthiṣṭa
    granthaḥ svayam eva  / grathnāti ślokaṃ devadattaḥ  / grathnīte  ślokaḥ svayam
    eva  / [#196] agranthiṣṭa ślokaḥ svayam eva  / bravīti ślokaṃ devadattaḥ  / brūte
    ślokaḥ svayam eva  / avocat ślokaṃ devadattaḥ  / avocata ślokaḥ svayam eva  /
    ātmanepada-vidhāne 'karmakāṇām - āhanti māṇavakaṃ devadattaḥ  / āhate māṇavakaḥ
    svayam eva  / āvadhiṣṭa mānavakaḥ svayam eva, āhata iti vā  / vikurvate saindhavāḥ
    svayam eva  / vyakṛṣata saindhavaḥ svayam eva //
