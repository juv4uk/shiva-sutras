source_id: KASIKA-3.4.27
locator:
  sutra: 3.4.27
witness_text:
  sutra: anyathā-evaṃ-katham-itthaṃsu siddha-aprayogaś-cet
  commentary: kṛñaḥ ity eva  / anyathādiṣu upapadesu kṛño ṇamul pratyayo bhavati,
    siddhāprayogaścet karoter bhavati  / kathaṃ punar asau siddhāprayogaḥ ? nirarthakatvān
    na prayogam arhati iti evam eva prayujyate  / anyathā bhuṅkte iti yavānarthastāvān
    eva anyathākāraṃ bhugkte iti gamyate  / anyathākāraṃ bhuṅkte  / evaṅ-kāraṃ bhuṅkte  /
    kathaṅ-kāraṃ bhuṅkte  / itthaṃ-kāraṃ bhuṅkte  / sidhāprayogaḥ iti kim ? anyathā
    kṛtvā śiro bhuṅkte // [#299]
