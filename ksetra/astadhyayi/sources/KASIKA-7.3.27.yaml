source_id: KASIKA-7.3.27
locator:
  sutra: 7.3.27
witness_text:
  sutra: nātaḥ parasya
  commentary: ardhāt parasya parimāṇākārasya vṛddhir na bhavati, pūrvasya tu vā bhavati
    taddhite ñiti, ṇiti, kiti ca parataḥ  / ardhaprasthikaḥ, ārdhaprasthikaḥ  / ardhakaṃsikaḥ,
    ārdhakaṃsikaḥ  / ataḥ iti kim ? ārdhakauḍavikaḥ  / taparakaraṇaṃ kim ? iha mā
    bhūt, ardhakhāryāṃ bhavā ardhakhārī  / kiṃ ca syāt ? ardhakhārī bhāryā yasya ardhakhārībhāryaḥ,
    vṛddhinimittasya ca taddhitasya araktavikāre (*6,3.39) iti puṃvadbhāvapratiṣedho
    na syāt  / yatra hi taddhite vṛddhiḥ pratiṣidhyate, sa vṛddhinimittaṃ na bhavati
    iti puṃvadbhāvo na pratiṣidhyate, yathā vaiyākaraṇī bhāryā asya vaiyākaraṇabhāryaḥ
    iti // [#838]
