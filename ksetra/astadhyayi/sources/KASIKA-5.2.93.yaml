source_id: KASIKA-5.2.93
locator:
  sutra: 5.2.93
witness_text:
  sutra: indriyam-indraliṅgam-indradṛṣṭam-indrasṛṣṭam-indrajuṣṭam-indradattam iti
    vā
  commentary: indriyam ity antodāttaṃ śabdarūpaṃ nipātyate  / rūḍhir eṣā cakṣurādināṃ
    karaṇānam  / tathā ca vyutpatter aniyamaṃ darśayati  / indra-śabdāt ṣaṣṭhīsamarthāt
    liṅgam ity etasminn arthe ghac-pratyayo bhavati  / indrasy liṅgam indriyam  /
    indra ātmā, sa cakṣurādinā karaṇena anumīyate  / nākartṛkaṃ karaṇam asti  / indreṇa
    dṛṣṭam  / tṛtīyāsamarthāt pratyayaḥ  / ātmanā dṛṣṭam ity arthaḥ  / indreṇa sṛṣṭam,
    ātmanā sṛṣṭam  / tatkṛtena śubhāśubhakarmaṇotpannam iti kṛtvā  / indreṇa juṣṭam,
    ātmanā juṣṭaṃ, sevitam  / taddvāreṇa vijñānotpādanāt  / indreṇa dattam, ātmanā
    viṣayebhyo dattaṃ yathāyathaṃ grahaṇāya  / itikaraṇaḥ prakārārthaḥ  / sati sambhave
    vyutpattir anyathā 'pi kartavyā, rūḍheraniyamāt iti  / vāśabdaḥ pratyekam abhisambadhyamāno
    vikalpānāṃ svātantryam darśayati //
