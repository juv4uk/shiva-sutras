witness_text:
  sutra: raśmau ca
  commentary: grahaḥ vibhāṣā pre iti vartate  / pra-śabde upapade graher dhātoḥ vibhāṣā
    ghañ pratyayo bhavati, raśmiś cet pratyayāntena abhidhīyate  / rathādiyuktānām
    aśvādīnāṃ saṃyamana-arthā rajjū raśmir iha gṛhyate  / pragrāḥ, pragrahaḥ // [#264]
