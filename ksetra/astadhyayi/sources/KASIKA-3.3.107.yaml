source_id: KASIKA-3.3.107
locator:
  sutra: 3.3.107
witness_text:
  sutra: ṇy-āsa-śrantho yuc
  commentary: ṇyantebhyo dhātubhyaḥ, āsa śrantha ity etābhyām ca striyām yuc pratyayo
    bhavati  / akārasya apavādaḥ  / kāraṇā  / hāraṇā  / āsanā  / śranthanā  / katham
    āsyā ? ṛ-halor ṇyat (*3,1.124) bhaviṣyati  / vāsarūpa-pratiṣedhaś ca strīprakaraṇa-viṣayasya+eva+utsarga-apavādasya  /
    śranthiḥ kryādirgṛhyate śrantha vimocanapratiharṣayoḥ iti , na curādiḥ śrantha
    grantha sandarbhe iti  / ṇyantatvena+eva siddhatvāt  / ghaṭṭivandividhibhya upasaṅkhyānam  /
    ghaṭṭanā  / vandanā  / vedanā  / ghaṭṭeḥ bhauvādikasya grahaṇaṃ ghaṭṭa calane
    iti, na cuarādikasya, tasya ṇeḥ ity eva siddhatvāt  / iṣeranicchārthasya yuj vaktavyaḥ  /
    adhyeṣaṇā  / anveṣanā  / parervā  / paryeṣanā, parīṣṭiḥ // [#275]
