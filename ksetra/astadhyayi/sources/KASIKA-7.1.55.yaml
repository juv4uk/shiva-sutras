source_id: KASIKA-7.1.55
locator:
  sutra: 7.1.55
witness_text:
  sutra: ṣaṭ-caturbhyaś ca
  commentary: ṣaṭsañjñakebhyaḥ catuḥśabdāc ca+uttarasyāmo nuḍāgamaḥ bhavati  / ṣaṇṇām  /
    pañcānām  / saptānām  / navānām  / daśānām  / caturṇām  / rephāntāyāḥ saṅkhyāyāḥ
    ṣaṭsañjñā na vihitā, ṣaḍbhyo luk (*7,1.22) iti lug mā bhūt  / bahuvacananirdeśād
    atra saṅkhyāpradhānasya grahaṇaṃ bhavati  / paramaṣaṇṇām  / paramapañcānām  /
    paramasaptānām  / paramacaturṇām  / upasarjanībhūtāyās tu saṅkhyāyāḥ na bhavati,
    priyaṣaṣām, priyapañcām, priyacaturām iti // [#786]
