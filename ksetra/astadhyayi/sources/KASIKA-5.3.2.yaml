source_id: KASIKA-5.3.2
locator:
  sutra: 5.3.2
witness_text:
  sutra: kiṃ-sarvanāma-bahubhyo 'dvy-ādibhyaḥ
  commentary: prāgdiśaḥ ity eva  / kimaḥ sarvanāmno bahuśabdāc ca prāgdiśaḥ pratyayāḥ
    veditavyāḥ  / sarvanāmatvāt prāpte grahaṇe dvyādiparyudāsaḥ kriyate  / kutaḥ ,
    kutra  / yataḥ, yatra  / tataḥ, tatra  / bahutaḥ, bahutra  / advyādibhyaḥ iti
    kim ? dvābhyām  / dvayoḥ  / prakṛtiparisaṅkhyānaṃ kim ? vṛkṣāt  / vṛkṣe  / prāgdiśaḥ
    ity eva, vaiyākaraṇapāśaḥ  / sarvanāmatvād eva siddhe kimo grahaṇam dvyādiparyudāsāt  /
    bahugrahaṇe saṅkhyāgrahaṇam  / iha na bhavati, bahoḥ sūpāt, bahau sūpe iti //
