source_id: KASIKA-2.3.12
locator:
  sutra: 2.3.12
witness_text:
  sutra: gatyartha-karmaṇi dvitīyā-caturthyau ceṣṭāyām anadhvani
  commentary: gatyarthānāṃ dhātūnāṃ ceṣtākriyāṇāṃ parispandakriyāṇāṃ karmaṇi kārake
    'dhvavarjite dvitīyā-caturthyau bhavataḥ  / grāmaṃ gacchati, grāmāya gacchati  /
    grāmaṃ vrajati, grāmāya vrajati  / gatyartha-grahaṇaṃ kim ? odanam pacati  / karmaṇi
    iti kim ? aśvena vrajati  / deṣṭāyam iti kim ? manasā pāṭaliputraṃ gacchati  /
    anadhvani iti kim ? adhvānaṃ gacchati  / adhvanītyartha-grahanam  / panthānaṃ
    gacchati  / mārgaṃ gacchati  / āsthita-pratiṣedhaś cāyaṃ vijñeyaḥ  / āsthitaḥ
    samprāptaḥ, ākrānta ucyate  / yatra tu utpathena panthānaṃ gacchati, tatra bhavitavyam
    eva caturthyā, pathe gacchati iti  / dvitīyā-grahanaṃ kim ? na catrthy eva viklpyeta,
    apavāda-viṣaye 'pi yathā syāt  / grāmam gantā grāmāya gantā  / kṛd-yoga-lakṣaṇā
    ṣaṣṭhī na bhavati // [#135]
