source_id: KASIKA-4.2.16
locator:
  sutra: 4.2.16
witness_text:
  sutra: saṃskṛtaṃ bhakṣāḥ
  commentary: tatra iti saptamīsamarthāt saṃskṛtam ity etasminn arthe yathāvihitaṃ
    pratyayo bhavati, yat saṃskṛtaṃ bhakṣāḥ cet te bhavanti  / kharaviśadam abhyavahārārthaṃ
    bhakṣam ity ucyate  / sat utkarṣādhānam saṃskāraḥ  / bhrāṣṭre saṃskṛtā bhakṣāḥ
    bhrāṣṭrā apūpāḥ  / kālaśāḥ  / kaumbhāḥ  / bhakṣāḥ iti kim ? puṣpapuṭe saṃskṛto
    mālāguṇaḥ //
