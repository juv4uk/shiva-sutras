source_id: KASIKA-2.1.31
locator:
  sutra: 2.1.31
witness_text:
  sutra: pūrva-sadṛśa-sama-ūnārtha-kalaha-nipuṇa-miśra-ślakṣṇaiḥ
  commentary: pūrva sadṛśa sama ūnārtha kalaha nipuṇa miśra ślakṣṇa ity etaiḥ saha
    tṛtīyāntaṃ samasyate, tatpuruṣaś ca samaso bhavati  / asmād eva vacanāt pūrvādibhir
    yoge tṛtīyā bhavati, hetau vā draṣṭavyā  / pūrva -- māsena pūrvaḥ māsapūrvaḥ  /
    saṃvatsarapūrvaḥ  / sadṛśa -- mātṛsadṛśaḥ  / pitṛsadṛśaḥ  / sama -- mātṛsamaḥ  /
    ūnārtha - māśonam  / kārṣāpaṇonam  / māṣavikalam  / kārṣāpanavikalam  / kalaha
    -- asikalahaḥ  / vākkalahaḥ  / nipuṇa - vāṅnipuṇaḥ  / ācāranipuṇaḥ  / miśra -
    guḍamiśraḥ  / tilamiśraḥ  / ślakṣṇa -- ācāraślakṣṇaḥ  / pūrvādiṣvavarasyopasaṅkhyānam  /
    māsenāvaraḥ māsāvaraḥ  / saṃvatsarāvaraḥ // [#108]
