source_id: KASIKA-8.1.73
locator:
  sutra: 8.1.73
witness_text:
  sutra: na āmantrite samānādhikaraṇe sāmānyavacanam
  commentary: avidyamānavattvasya pratiṣedhaḥ āmantritānte samānādhikarane parataḥ
    pūrvam āmantritāntaṃ sāmānyavacanam na avidyamānavad bhavati  / kiṃ tarhi ? vidyamānavadeva  /
    agne gṛhapate  / māṇavaka jaṭilakādhyāpaka  / pūrvasya vidyamānavattvāt paramanudāttam
    eva bhavati  / āmantrite iti kim ? devadatta pacasi  / samānādhikarane iti kim
    ? devadatta paṇḍita yajñadatta  / atra yajñadattaviśeṣanam paṇḍitaśabdaḥ, na pūrveṇa
    samānādhikaranaḥ  / sāmānyavacanam iti kim ? paryāyeṣu mā bhūt, adhnye, devi,
    sarasvati, īḍe, kāvye, vihavye  / paryāyaśabdā ete  / evaṃ hi uktam, etā te aghnye
    nāmāni iti //
