source_id: KASIKA-2.2.11
locator:
  sutra: 2.2.11
witness_text:
  sutra: pūraṇa-guṇa-suhitārtha-sad-avyaya-tavya-samānādhikaranena
  commentary: pūraṇa guna suhitārtha sat avyaya tavya samānādhikaraṇa ity etaiḥ saha
    ṣaṣṭhī na samasyate  / artha-śabdaḥ pratyekam abhisambadhyate, tena svarūpa-vidhir
    na bhavati  / pūraṇārthe - dhātrāṇāṃ pañcamaḥ  / chātrāṇāṃ daśamaḥ  / guṇa - balākāyāḥ
    śauklyam  / kākasya kārṣnyam  / suhita-arthās tṛptyarthāḥ - phalānāṃ suhitaḥ  /
    phalānāṃ tṛptaḥ  / sat - brāhmaṇasya kurvan  / brāhmaṇasya kurvāṇaḥ  / avyaya
    - brāhmaṇasya kṛtvā  / brāhmaṇasya hṛtvā  / tavya - brāhamaṇasya kartavyam  /
    tavyatā sānubandhakena samāso bhavaty eva, brāhmaṇa-kartavyam  / samānādhikaraṇa
    - śukasya mārāvidasya  / rājñaḥ pāṭaliputrakasya  / pāṇineḥ sūtrakārasya  / kiṃ
    ca syāt ? pūrvanipātasya aniyamaḥ syāt  / anantarāyāṃ tu prāptau pratiṣiddhāyāṃ
    viśeṣaṇaṃ viśeṣyeṇa bahulam (*2,1.57) iti bhavaty eva samāsaḥ  / purvanipātaś
    ca tadā diyogato viśeṣaṇasya+eva // [#122]
