source_id: KASIKA-3.2.114
locator:
  sutra: 3.2.114
witness_text:
  sutra: vibhāṣā sākāṅkṣe
  commentary: yadi iti na anuvartate  / ubhayatra vibhāśeyam  / abhijñā-vacane upapade
    yac-chabda-sahite kevale ca vibhāṣā lṛṭ pratyayo bhavati, sākāṅkṣaś cet prayoktā  /
    lakṣya-lakṣaṇayoḥ sambandhe prayoktur ākāṅkṣā bhavati  / abhijānasi devadatta
    kaśmīreṣu vatsyāmas tatra udanaṃ bhokṣyāmahe  / abhijānāsi devadatta magadheṣu
    vatsyāmaḥ, tatra udanaṃ bhokṣyāmahe  / yadi khalv api - abhijānāsi devadatta yat
    kaśmīreṣu vatsyāmaḥ, yat tatra udanaṃ bhokṣyāmahe  / abhijānasi devadatta yat
    kaśmīreṣv avasāma, yat tatra udanam abhuñjmahi  / vāso lakṣaṇaṃ, bhojanaṃ lakṣyam
    //
