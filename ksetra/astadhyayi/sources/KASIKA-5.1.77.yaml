source_id: KASIKA-5.1.77
locator:
  sutra: 5.1.77
witness_text:
  sutra: uttarapathen āhṛtaṃ ca
  commentary: nirdeśād eva samarthavibhaktiḥ  / uttarapatha-śabdād tṛtīyāsamarthāt
    āhṛtam ity etasmin viṣaye ṭhañ pratyayo bhavati  / cakāraḥ pratyayārthasam uccaye,
    gacchati iti ca  / atra api tṛtīyā+eva samarthavibhaktiḥ  / uttarapathena-āhṛtam
    auttarapathikam  / uttarapathena gacchati auttarapathikaḥ  / āhṛta-prakaraṇe vārijaṅgalasthalkāntārapūrvapadād
    upasaṅkhyānam  / vāripathena āhṛtam vāripathikam  / vāripathena gacchati vāripathikaḥ  /
    jaṅgalapathena āhṛtam jāṅgalapathikam  / jaṅgalapathena gacchati jāṅgalapathikaḥ  /
    sthalapathena āhṛtam sthālapathikam  / sthalapathen agacchati sthālapathikaḥ  /
    kāntārapathena āhṛtam kāntārapathikam  / kāntārapathena gacchati kāntārapathikaḥ  /
    ajapathaśaṅkupathābhyāṃ ca+upasaṅkhyānam  / ajapathena āhṛtam ājapathikam, gacchati
    vā ājapathikaḥ  / śaṅkupathena āhṛtam śāṅkupathikam  / gacchati vā śāṅkupathikaḥ  /
    madhukamaricayor aṇ sthalāt  / sthalapathena āhṛtam sthālapathaṃ madhukam //
