locator:
  sutra: 7.1.30
witness_text:
  sutra: bhyaso bhyam
  commentary: yuṣmadasmadbhyām uttarasya bhyasaḥ bhyam ity ayam ādeśo bhavati  / yuṣmabhyaṃ
    dīyate  / asmabhyaṃ dīyate  / bhyamādeśe kṛte śeṣelope ca bahuvacane jhalyet (*7,3.103)
    iti etvaṃ prāpnoti, tat aṅgavṛtte punarvṛttāvavidhirniṣṭhitasya iti na bhavati  /
    kecit punarabhyamādeśametvanivṛttyarthaṃ kurvanti  / yeṣāṃ tu śeṣelopaḥ ṭilopaḥ,
    teṣām abhyamādeśa eva  / udāttanivṛttisvaraścāder eva bhavati //
