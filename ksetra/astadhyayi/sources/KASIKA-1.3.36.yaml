source_id: KASIKA-1.3.36
locator:
  sutra: 1.3.36
witness_text:
  sutra: sammānana-utsañjana-ācāryakaraṇa-jñāna-bhṛti-vigaṇana-vyayeṣu niyaḥ
  commentary: ṇīñ prāpaṇe  / asmāt kartr-abhiprāye kriyāphale siddham eva-ātmanepadam  /
    akartr-abhiprayārtho 'yam ārambhaḥ  / ṇīñ prāpṇe ity etasmāt dhātor ātmanepadaṃ
    bhavati sammānana-ādiṣu viśeṣaṇeṣu satsu  / sammānanaṃ pūjanam -- nayate cārvī
    lokāyate  / cārvī buddhiḥ, tat-sambandhād acārye 'pi cārvī  / sa lokāyate śāstre
    pada-arthān nayate, upapattibhiḥ sthirīkṛtya śiṣyebhyaḥ prāpayati  / te yuktibhiḥ
    sthāpyamānāḥ sammānitāḥ pūjitā bhavanti  / utsañjanam utkṣepaṇam -- māṇavakam
    udānayate  / utkṣipati ity arthaḥ  / ācārya-karaṇam ācāryakriyā -- māṇavakam īdṛśena
    vidhinā ātma-samīpaṃ prāpyati yathā sa upanetā svayam ācāryaḥ sampadyate  / māṇavakam
    upanayate  / ātmānam ācāryīkurvan māṇavakam ātma-samīpaṃ prāpayati ity arthaḥ  /
    jñānaṃ prameya-niścayaḥ -- nayate carvī lokayate  / tatra prameyaṃ niścinoti ity
    arthaḥ  / bhṛtirvetanam -- karmakarānupanayate  / bhṛtidānena samīpaṃ karoti ity
    arthaḥ  / vigaṇanam ṛṇāder niryātanam -- madrāḥ karam vinayante  / niryātayanti
    ity arthaḥ  / vyayo dharma-ādiṣu viniyogaḥ  / śataṃ vinayate  / sahasraṃ vinayate  /
    dharma-ādy-arthaṃ śatam viniyuṅkte ity arthaḥ  / eteṣu iti kim ? ajāṃ nayati grāmam
    // [#61]
