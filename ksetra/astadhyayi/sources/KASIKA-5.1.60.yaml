locator:
  sutra: 5.1.60
witness_text:
  sutra: pañcad-daśatau varge vā
  commentary: pañcat daśat ity etau nipātyete tad asya aprimāṇam ity asmin viṣaye
    varge 'bhidheye  / saṅkhyāyāḥ iti kani prāpte ḍatirnipātyate  / vāvacanāt pakṣe
    so 'pi bhavati  / pañca parimāṇasya pañcad vargaḥ  / daśadvargaḥ  / pañcako vargaḥ  /
    daśako vargaḥ //
