source_id: KASIKA-2.3.14
locator:
  sutra: 2.3.14
witness_text:
  sutra: kriya-artha-upapadasya ca karmaṇi sthāninaḥ
  commentary: kriyārthā kriyā upapadaṃ yasya so 'yaṃ kriyārthopapāḥ  / tumun-ṇvulau
    kriyāyāṃ kriyārthāyām (*3,3.10) ity eṣa viṣayo lakṣyate  / kriyārthopapadasya
    ca sthānino 'prayujyamānasya dhātoḥ karmaṇi kārake caturthī vibhaktir bhavati  /
    dvitīya-apavādo yogaḥ  / edhebhyo vrajati  / puṣpebhyo vrajati kriyārthopapadasya
    iti kim ? praviśa piṇḍīm  / praviśa tarpanam  / bhakṣir atra sthānī, na tu kriyārthopapadaḥ  /
    karmaṇi iti kim ? edhebhyo vrajati śakaṭena  / sthāninaḥ iti kim ? edhānāhartuṃ
    vrajati //
