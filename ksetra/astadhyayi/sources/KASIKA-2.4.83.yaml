source_id: KASIKA-2.4.83
locator:
  sutra: 2.4.83
witness_text:
  sutra: na avyayībhāvād ato 'm tv apañcamyāḥ
  commentary: pūrveṇa luk prāptaḥ pratiṣidhyate  / dantād avyayībhāvād uttarasya supo
    na lug bhavati, amādeśas tu tasya supo bhavaty apañcamyāḥ  / etasmin pratiṣiddhe
    pañcamyāḥ śravanam eva bhavati  / upakumbhaṃ tiṣṭhati  / upakumbhaṃ paśya  / upamaṇikaṃ
    tiṣṭhati  / upamaṇikaṃ paśya  / ataḥ iti kim ? adhistri  / adhikumāri  / apañcamyāḥ
    iti kim ? upakumbhādānaya //
