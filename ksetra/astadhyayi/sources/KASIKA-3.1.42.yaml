source_id: KASIKA-3.1.42
locator:
  sutra: 3.1.42
witness_text:
  sutra: abhyutsādayāṃ-prajanayām-cikayāṃ-ramayām-akaḥ pāvayām-kriyād vidām-akrann
    iti cchandasi
  commentary: abhyutsādayām ity evam ādayaḥ chandasi viṣaye 'nyatarasyāṃ nipātyante  /
    sadijaniramīṇāṃ ṇyantānāṃ luḍi ām pratyayo nipātyate  / cinoter api tatra+eva+aampratyayo
    dvirvacanaṃ kutvaṃ ca  / akar iti caturbhir api pratyekam anuprayogaḥ sambadhyate  /
    pāvayām kriyāt iti pavateḥ punāter vā ṇyantasya liṅi ām nipātyate, guṇābhāvaś
    ca, akran iti ca asya anuprayogaḥ  / vidām-akran iti vider luṅi ām nipātyate,
    gunabhāvaś ca, akran iti ca asya anuprayogaḥ  / abhyutsādayām akaḥ  / abhyudasīṣadat
    iti bhāṣāyām  / prajanayām akaḥ  / prājījanat iti bhāṣāyām  / cikayām akaḥ  /
    acaiṣīt iti bhāṣāyām  / ramayām akaḥ  / arīramat iti bhāṣāyām  / pāvayāṅkriyāt  /
    pāvyāt iti bhāṣāyām  / vidām akran  / avediṣuḥ iti bhāṣāyām //
