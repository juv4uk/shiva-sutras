source_id: KASIKA-5.1.58
locator:
  sutra: 5.1.58
witness_text:
  sutra: saṅkhyāyāḥ sañjñā-saṅgha-sūtra-adhyayaneṣu
  commentary: tad asya parimāṇam (*5,1.57) iti vartate  / saṅkhyā-vācinaḥ prātipadikāt
    parimāṇopādhikāt prathamāsamarthād asya iti ṣaṣṭhyarthe yathāvihitaṃ pratyayo
    bhavati  / sañjñā-saṅgha-sūtra-adhyayaneṣu iti pratyayārtha-viśeṣaṇam  / tatra
    sañjñāyāṃ svārthe pratyayo vācyaḥ  / pañcaiva pañcakāḥ śakunayaḥ  / trikāḥ śālaṅkāyanāḥ  /
    saṅgha - pañca parimāṇam asya pañcakaḥ saṅghaḥ  / aṣṭakaḥ  / sūtra - aṣṭau adhyāyāḥ
    parimāṇam asya sūtrasya aṣṭakaṃ pāṇinīyam  / daśakaṃ vaiyāghrapadīyam  / trikaṃ
    kāśakṛtsnam  / nanu ca adhyāyasamūhaḥ sūtrasaṅgha eva bhavati ? na+etad asti  /
    prāṇisamūhe saṅgha-śabdo rūḍhaḥ  / adhyayana - pañcako 'dhītaḥ  / saptako 'dhītaḥ  /
    aṣṭakaḥ  / anavakaḥ  / adhītir adhyayanam  / tasya saṅkhyāparimāṇaṃ pañcāvṛttayaḥ
    pañcavārāḥ pañca rūpāṇi asya adhyayanasya pañcakam adhyayanam  / stome ḍavidhiḥ
    pañcadaśādy-arthaḥ  / pañcadaśa mantrāḥ parimāṇam asya pañcadaśaḥ stomaḥ  / saptadaśaḥ  /
    ekaviṃśaḥ  / śanśator ḍiniś chandasi  / pañcadaśino 'rdhamāsāḥ triṃśino māsāḥ  /
    viṃśateś ca+iti vaktavyam  / viṃśino 'ṅgirasaḥ //
