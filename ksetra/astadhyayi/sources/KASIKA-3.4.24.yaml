source_id: KASIKA-3.4.24
locator:
  sutra: 3.4.24
witness_text:
  sutra: vibhāṣā 'gre prathama-pūrveṣu
  commentary: aprāpta-vibhāṣeyam  / ābhīkṣṇye iti na anuvartate  / agre prathama pūrva
    ity eteṣu upapadeṣu samānakartṛkayoḥ pūrvakāle dhātoḥ ktvāṇamulau pratyayu vibhāṣā
    bhavataḥ  / agre bhojaṃ vrajati, agre bhuktvā vrajati  / prathamaṃ bhojaṃ vrajati,
    prathamaṃ bhuktvā vrajati  / pūrvaṃ bhojaṃ vrajati, pūrvaṃ bhuktvā vrajati  /
    vibhāṣāgrahaṇam etābhyāṃ mukte laḍādayo 'pi yathā syuḥ  / agre bhuṅkte tato vrajati  /
    nanu ca vāsarūpa iti bhavisyati ? ktvāṇamulau yatra saha vidhīyete tatra vāsarūpavidhir
    na asti ity etad anena jñāpyate, tena ābhīkṣṇye laḍādayo na bhavanti  / upapadasamāsaḥ
    kasmān na kriyate ? uktaṃ tatra+eva kārasya prayojanam, amaiva yat tulya-vidhānam
    upapadaṃ tat samasyate, na anyat iti //
