source_id: KASIKA-8.1.62
locator:
  sutra: 8.1.62
witness_text:
  sutra: ca-aha-lopa eva+ity avadhāraṇam
  commentary: calope ahalope prathamā tiṅvibhaktiḥ nānudāttā bhavati  / eva iti etac
    ced avadhāraṇārthaṃ prayujyate, kva ca asya lopaḥ ? yatra gamyate cārthaḥ, na
    ca prayujyate, tatra lopaḥ  / tatra caśabdaḥ samuccayārthaḥ, āhaśabdaḥ kevalārthaḥ
    iti samānakartṛke calopaḥ, nānākartṛke ahalopaḥ  / calope - devadatta eva grāmaṃ
    gacchatu, sa devadatta evāraṇyaṃ gacchatu  / grāmaṃ cāraṇyaṃ ca gacchatu ity arthaḥ  /
    ahalope - devadatta eva grāmaṃ gacchatu, yajñadatta evāraṇyam gacchatu  / grāmaṃ
    kevalam, araṇyaṃ devalam ity arthaḥ  / avadhāraṇam iti kim ? devadattaḥ kveva
    bhokṣyate  / anavaklṛptāvayam evaśabdaḥ  / na kva cid bhokṣyate ity arthaḥ  /
    eve cāniyoge iti pararūpam //
