source_id: KASIKA-2.2.27
locator:
  sutra: 2.2.27
witness_text:
  sutra: tatra tena+idam iti sarūpe
  commentary: tatra iti saptamyantaṃ gṛhyate  / tena iti tṛtīyāntam  / sarūpa-grahanaṃ
    pratyekam abhisambadhyate  / tatra iti saptamyante sarūpe pade teneti ca tṛtīyānte
    idam ity etasminn arthe saṃsyete, bahuvrīhiś ca samāso bhavati  / itikaranaś ca+iha
    vivakṣārtho laukikam artham anusārayati  / tato grahaṇaṃ, praharanaṃ karmavyatīhāro,
    yuddhaṃ ca samāsa-arthaḥ iti sarvam itikaranāllabhyate  / [#127] yat tatra iti
    nirdiṣṭaṃ grahaṇam cet tad bhavati, yat tena iti nirdiṣṭaṃ praharanaṃ cet tad
    bhavati, yat idam iti nirdiṣṭaṃ yuddhaṃ cet tad bhavati  / keśeṣu keśeṣu ca gṛhītvā
    idaṃ yuddhaṃ pravṛttaṃ keśākeśi  / kacākaci  / daṇḍaiś ca daṇḍaiś ca pragṛtya
    idaṃ yuddhaṃ pravṛttaṃ daṇḍādaṇḍi  / musalāmusali  / ic karmavyatīhāre (*5,4.127)
    iti ic samāsāntaḥ, sa ca avyayam  / anyeṣām api dṛśyate (*6,3.137) iti pūrvapadasya
    dīrghatvam  / sarūpa-grahaṇaṃ kim ? halaiś ca musalaiś ca prahṛtya idaṃ yuddhaṃ
    pravṛttam //
