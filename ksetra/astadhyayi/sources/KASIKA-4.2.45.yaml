source_id: KASIKA-4.2.45
locator:
  sutra: 4.2.45
witness_text:
  sutra: khaṇḍika-ādibhyaś ca
  commentary: khaṇdikā ity evam ādibhyaḥ śabdebhyo 'ñ pratyayo bhavati tasya samūhaḥ
    ity etasmin viṣaye  / ādy-udātta-artham acittārtham ca vacanam  / khaṇdikānāṃ
    mamūhaḥ khāṇḍikam  / vāḍavam  / kṣudraka-mālava-śabdotra paṭhyate  / kṣudrakāś
    ca mālavāś ca iti kṣatriya-dvandvaḥ  / tataḥ pūrveṇa+eva añi siddhe vacanaṃ gotravuñ
    bādhana-artham  / nanu ca paratvādañā vuñ bādhiṣyate, na ca gotrasamudāyo gotraṃ,
    na ca tadantavidhir atra asti ? evaṃ tarhi etaj jñāpayati vuñi pūrvavipratiṣedhaḥ,
    samūhikeṣu ca tadantavidhir asti iti  / pratyojanam aupagavakaṃ kāpaṭavakam iti
    vuñ bhavati, vānahastikaṃ gaudhenukam iti ca tadantavidhiḥ  / kṣudrakamālavāt
    ity etāvatā yogavibhāgena pūrvaviprateṣedhas tadantavidhiś ca jñāpitaḥ, punar
    asyaa+eva niyamārtham ucyate senāsañjñāyām iti  / kṣudrakamālavāt senāsaṃjñāyām
    eva añ bhavati  / kṣaudrakamālavī senā  / kṣaudrakamālavamanyat  / añsiddhir anudātādeḥ
    ko 'rthaḥ kṣudrakamālavāt  / gotrād vuñ na ca tadgotraṃ tadantān na ca sarvataḥ
    // jñāpakaṃ syāt tadantatve tathā ca api śalier vidhiḥ  / senāyāṃ niyama-arthaṃ
    ca yathā badhyeta cāñ vuñā // khaṇdikā  / vaḍavā  / kṣudrakamālavāt senāsañjñāyām  /
    bhikṣuka  / śuka  / ulūka  / śvan  / yuga  / ahan  / varatrā  / halabandha //
