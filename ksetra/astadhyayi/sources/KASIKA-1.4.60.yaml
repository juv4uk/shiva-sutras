source_id: KASIKA-1.4.60
locator:
  sutra: 1.4.60
witness_text:
  sutra: gatiś ca
  commentary: gati-sañjñakāś ca pra-ādayo bhavanti kriyā-yoge  / prakṛtya  / prakṛtam  /
    yat prakaroti  / yoga-vibhāga uttara-arthaḥ  / uttaratra gati-sañjñā+eva yathā
    syāt  / upasarga-sañjñā mā bhūt  / ūrīsyāt ity atra upasarga-prādurbhyām astir
    y-ac-paraḥ (*8,3.87) iti ṣatvaṃ prasajyeta  / ca-karaḥ sañjñā-samāveśa-arthaḥ  /
    praṇītam  / abhiṣiktam  / gatir anantaraḥ (*6,2.49) iti svaraḥ, upasargāt (*8,4.14)
    (*8,3.65) iti ṇatvaṣatve ca bhavataḥ  / kārikā-śabdasya+upasaṅkhyānam  / kārikā-kṛtya  /
    kārikā-kṛtam  / yat kārikā karoti  / punaścanasau chandasi gatisañjñau bhavata
    iti vaktavyam  / punarutsyūtaṃ vāso deyam  / gatir gatau (*8,1.70) iti nighāto
    bhavati  / cano hitaḥ  / gatir anantaraḥ (*6,2.49) iti svaraḥ  / gati-pradeśāḥ
    -- ku-gati-pra-ādaya (*2,2.18) ity evam ādayaḥ //
