locator:
  sutra: 6.1.99
witness_text:
  sutra: na āmreḍitasya anatyasya tu vā
  commentary: avyaktānukaraṇasya āmreḍitasya yo atśabdaḥ itau tasya pararūpaṃ na bhavati,
    tasya yo 'ntyastakārastasya vā bhavati  / paṭatpaṭaditi, paṭatpaṭeti karoti  /
    nityavīpsayoḥ (*8,1.4) iti dvirvacanam  / yadā tu samudāyānukaraṇaṃ tadā bhavaty
    eva pūrveṇa pararūpam, paṭatpaṭeti karoti //
