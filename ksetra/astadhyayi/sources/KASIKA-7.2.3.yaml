source_id: KASIKA-7.2.3
locator:
  sutra: 7.2.3
witness_text:
  sutra: vada-vraja-halantasya acaḥ
  commentary: vadavrajoḥ halantānāṃ ca aṅgānām acaḥ sthāne vṛddhir bhavati sici parasmaipade
    parataḥ  / avādīt  / avrājīt  / vikalpabādhanārthaṃ vadivrajigrahaṇam  / halantānām
    - apākṣīt  / abhaitsīt  / acchaitsīt  / arautsīt  / atra yogavibhāge sati halantagrahaṇam
    antareṇa api sidhyati  / katham ? vadivrajyoḥ ity atra prathamayoge ataḥ iti sthānī
    anuvartate, tato yat acaḥ iti sūtraṃ tatra aṅgena ajviśeṣyate, aṅgasya acaḥ sici
    parataḥ vṛddhir bhavati  / tad etad dhalgrahaṇam halsamudāyaparigrahārtham  /
    iha api syāt, arāṅkṣīt, asāṅkṣīt  / anyathā hi yena na avyavadhānaṃ tena vyavahite
    'pi vacanaprāmāṇyāt ity ekena varṇena vyavadhāne syāt, anekena halā na syāt  /
    udavoḍhām, udavoḍham ity atra vaheḥ sici ḍhatvasalopādīnām pūrvatra asiddham (*8,2.1)
    ity asiddhatvāt pūrvaṃ halantalakṣaṇā vṛddhiḥ kriyate, paścād ḍhalopanimittamotvam  /
    tatra kṛte punar vṛddhir na bhavati, kṛtatvāt  / yatra tvakṛtā vṛddhiḥ, okārasya
    eva tatra bhavati, soḍhāmitrasya apatyam sauḍhāmitriḥ iti //
