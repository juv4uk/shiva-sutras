source_id: KASIKA-3.1.134
locator:
  sutra: 3.1.134
witness_text:
  sutra: nandi-grahi-pacādibhyo lyu-ṇiny-acaḥ
  commentary: ādi-śabdaḥ prayekaṃ sambadhyate  / tribhyo gaṇebhyaḥ trayaḥ pratyayāḥ
    yathāsaṅkhyaṃ bhavanti  / nandya-ādibhyo lyuḥ, grahādibhyo ṇiniḥ, pacādibhyo 'c  /
    nandi-graha-pacādayaś ca na dhātu-pāṭhataḥ sanniviṣṭā gṛhyante, kiṃ tarhi, nandana
    ramaṇa ity evam ādiṣu prātipadika-gaṇeṣu apoddhṛtya prakṛtayo nirdiśyante  / [#207]
    nandivāsipadidūṣisādhivardhiśobhirocibhyo ṇyantebhyaḥ sañjñāyām  / nandanaḥ  /
    vāsanaḥ  / madanaḥ  / dūṣaṇaḥ  / sādhanaḥ  / vardhanaḥ  / śobhanaḥ  / rocanaḥ  /
    sahitapidameḥ sañjñāyām  / sahanaḥ  / tapanaḥ  / damanaḥ  / jalpanaḥ  / ramaṇaḥ  /
    darpaṇaḥ  / saṅkrandanaḥ  / saṅkarṣaṇaḥ  / janārdanaḥ  / yavanaḥ  / madhusūdanaḥ  /
    vibhīṣaṇaḥ  / lavaṇaḥ  / nipātanāṇ ṇatvam  / cittavināśanaḥ  / kuladamanaḥ  /
    śatrudamanaḥ  / iti nandy-ādiḥ  / graha  / utsaha  / uddasa  / udbhāsa  / sthā  /
    mantra  / sammarda  / grāhī  / utsāhī  / uddāso  / udbhāsī  / sthāyī  / mantrī  /
    sammardī  / rakṣaśruvasavapaśāṃ nau  / nirakṣī  / niśrāvī  / nivāsī  / nivāpī  /
    niśāyī  / yācivyāhṛsaṃvyāhṛvrajavadavasāṃ pratiṣiddhānām  / ayācī  / avyāhārī  /
    asaṃvyāhārī  / avrājī  / avādī  / avāsī  / acāmacittakartṛkāṇām  / pratiṣiddhānām
    ity eva  / akārī  / ahārī  / avināyī  / aviśāyī  / viśayī  / viśayī deśe  / viśayo,
    viṣayī deśaḥ  / abhibhāvī bhūte  / abhibhāvī  / aparādhī  / uparodhī  / paribhavī  /
    paribhāvī  / iti grahyādiḥ  / paca  / vapa  / vada  / cala  / śala  / tapa  /
    pata  / nadaṭ  / bhaṣaṭ  / vasa  / garaṭ  / plavaṭ  / caraṭ  / taraṭ  / coraṭ  /
    grāhaṭ  / jara  / mara  / kṣara  / kṣama  / sūdaṭ  / devaṭ  / modaṭ  / seva  /
    meṣa  / kopa  / medhā  / narta  / vraṇa  / darśa  / daṃśa  / dambha  / jārabharā  /
    śvapaca  / pacādirākṛtigaṇaḥ  / ajvidhiḥ sarvadhātubhyaḥ paṭhyante ca pacādayaḥ  /
    aṇbādhana-artham eva syāt sidhyanti śvapacādayaḥ //
