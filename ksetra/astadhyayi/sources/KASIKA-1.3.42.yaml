source_id: KASIKA-1.3.42
locator:
  sutra: 1.3.42
witness_text:
  sutra: pra-upābhyāṃ samarthābhyām
  commentary: pra up ity etābhyāṃ parasmāt kramater ātmanepadaṃ bhavati, tau cet propau
    samarthau tulya-arthau bhavataḥ  / kva cānayos tulya-arthatā ? ādikarmaṇi  / prakramate
    bhoktum  / upakramate bhoktum  / samarthābhyām iti kim ? pūrvedhyuḥ prakrāmati  /
    gacchati ity arthaḥ  / aparedhyur upakrāmati  / āgacchati ity arthaḥ  / atha upaparābhyām
    (*1,3.39) ity anena ātmanepadam atra karmān na bhāti ? vṛttyādi-grahaṇam tatra
    anuvartate  / tato 'nyatra+idaṃ pratyudāharaṇam //
