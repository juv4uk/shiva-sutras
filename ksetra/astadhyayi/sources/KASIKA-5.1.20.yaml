source_id: KASIKA-5.1.20
locator:
  sutra: 5.1.20
witness_text:
  sutra: asamāse niṣka-ādibhyaḥ
  commentary: ārhāt ity eva  / viṣkādibhyaḥ śabdebhyo 'samāse ṭhak pratyayo bhavati
    ārhīyeṣv artheṣu  / ṭhaño 'pavādaḥ  / naiṣkikam  / pāṇikam  / pādikam  / māṣikam  /
    asamāse iti kim ? paramanaiṣkikam  / uttamanaiṣkikam  / ṭhaj eva bhavati, arimāṇāntasya
    ity uttarapadavṛddhiḥ  / atha kimartham asamāse ity ucyate yāvatā grahaṇavatā
    prātipadikena tadantavidhiḥ pratiṣidhyate ? niṣkādiṣv asamāsa-grahaṇaṃ jñāpakaṃ
    pūrvatra tadantāpratiṣedhasya  / ugavādibhyo yat (*5,1.2) - gavyam, sugavyam,
    atisugavyam vibhāṣā havir-apūpādibhyaḥ (*5,1.4) - apūpyam, apūpīyam, yavāpūpyam,
    yavāpūpīyam  / [#471] śarīra-avayavād yat (*5,2.6) - dantyam, rājadantyam ity
    evamādi sidhdaṃ bhavati  / ita uttaraṃ ca saṅkhyāpūrvapadānāṃ tadantavidhir iṣyate  /
    pārāyaṇa-turāyaṇa-cāndrāyaṇaṃ vartayati (*5,1.72) - dvaipārāyaṇikaḥ, traipārāyaṇikaḥ  /
    lugantāyāḥ tu prakṛter na+iṣyate  / dvābhyāṃ śūrpābhyāṃ krītam dviśūrpam  / triśūrpam  /
    dviśūrpeṇa krītam iti tadantavidhi-pratiṣedhāt śūrpād añ anyatrasyām (*5,1.26)
    iti añ na bhavati  / sāmānyavihitaṣ ṭhañ eva bhavati  / dviśaurpikam  / ṭhaño
    dviguṃ pratyanimittāl lugabhāvaḥ  / tathā ca+uktam, prāgvateḥ saṅkhyāpūrvapadānāṃ
    tadant-agrahaṇam aluki iti  / niṣka  / paṇa  / pāda  / māṣa  / vāha  / droṇa  /
    ṣaṣti  / niṣkādiḥ //
