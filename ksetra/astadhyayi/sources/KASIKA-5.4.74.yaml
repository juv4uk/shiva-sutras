source_id: KASIKA-5.4.74
locator:
  sutra: 5.4.74
witness_text:
  sutra: ṛk-pūr-ab-dhūḥ-pathām ānakṣe
  commentary: bahuvrīhau iti na svaryate  / sāmānyena vidhānam  / ṛk pur ap dhur pathin
    ity evam antānāṃ samāsānām akāraḥ pratyayo bhavati samāsānto 'kṣe na  / sāmarthyād
    dhura etad viśeṣaṇam, ṛgādīnāṃ na bhavati  / akṣesambandhinī yā dhūḥ tadantasya
    na bhavati  / anṛcaḥ  / bahvṛcaḥ  / ardharcaḥ  / pur - lalāṭapuram  / nāndīpuram  /
    ap - dvīpam  / antarīpam  / samīpam  / dhur - rājadhurā  / mahādhuraḥ  / pathin
    - sthalapthaḥ  / jalapathaḥ  / anṛco anakṣe iti kim ? akṣasya dhūḥ akṣadhūḥ  /
    dṛḍhadhūḥ akṣaḥ  / anṛco māṇavako jñejo, baḥ vṛcaścaraṇākhyāyām  / māṇavakaḥ  /
    bahvṛco brāhmaṇaḥ  / anṛkkaṃ sāma, bahvṛkkaṃ sūktam ity atra na bhavati // [#576]
