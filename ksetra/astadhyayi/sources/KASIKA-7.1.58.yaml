source_id: KASIKA-7.1.58
locator:
  sutra: 7.1.58
witness_text:
  sutra: idato num dhātoḥ
  commentary: idito dhātor numāgamo bhavati  / kuḍi - kuṇḍitā  / kuṇḍitum  / kuṇḍitavyam  /
    kuṇḍā  / huḍi - huṇḍitā  / huṇḍitum  / huṇditavyam  / huṇḍā  / iditaḥ iti kim
    ? pacati  / paṭhati  / ayaṃ dhātūpadeśāvasthāyām eva nugāmamo bhavati kuṇḍā, guṇḍā
    iti, guroś ca halaḥ (*3,3.103) ity akārapratyayo yathā syāt  / tathā hi dhinvikṛṇvyora
    ca (*3,1.80) iti pratyayavidhāv eva numanuṣaktayor grahaṇam  / dhātugrahaṇam ca+iha
    kriyate dhātūpadeśakāla eva numāgamo yathā syāt ity evam artham  / tāsisicoriditkāryaṃ
    na asti ity uccāraṇārtho niranunāsika ikāraḥ paṭhyate  / amaṃsta ity evam ādau
    hi hanaḥ sic (*1,2.24) iti kitvavidhānasāmarthyāt nakāralopo na bhavati  / mantā
    ity atra api asiddhavad-atra-ā bhāt (*6,4.22) iti ṭilopasya asiddhatvān nalopo
    na bhavati  / iha kasmān na bhavati, bhettā, dhettā iti ? iritāṃ samudāyasyetsañjñā
    iti iditvaṃ na asti  / avayavaśo 'pi itsañjñāyāṃ satyāṃ goḥ pādānte (*7,1.57)
    ito 'ntagrahaṇam anuvartayitavyam, tenāntedito dhātavo gṛhyante //
