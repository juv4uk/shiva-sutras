locator:
  sutra: 8.3.101
witness_text:
  sutra: yuṣmat-tat-tatakṣuḥṣv antaḥpādam
  commentary: yuṣmat tat tatakṣus ity eteṣu takārādiṣu parataḥ sakārasya mūrdhanyādeśo
    bhavati, sa cet sakāro 'ntaḥpādaṃ bhavati  / yuṣmadādeśāḥ tvam, tvām, te, tava  /
    agniṣṭvaṃ nāmāsīt  / tvā - agniṣṭvā vardhayāmasi  / te - agniṣṭe viśvamānaya  /
    tava - apsvagne sadhiṣṭava  / tat - agniṣṭad viśvamāpṛṇāti  / tatakṣus - dyāvāpṛthivī
    niṣṭatakṣuḥ  / antaḥpādam iti kim ? yanma ātmano mindābhūdagnistatpunarāhārjatavedā
    vica //
