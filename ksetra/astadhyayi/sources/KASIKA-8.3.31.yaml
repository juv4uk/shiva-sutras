locator:
  sutra: 8.3.31
witness_text:
  sutra: śi tuk
  commentary: nakārasya padantasya śakāre parato vā tugāgamo bhavati  / bhavāñcchete  /
    pūrvāntakaraṇaṃ chatvārtham  / yady evaṃ kurvajcchete ity atra nakārasya apadāntatvāt
    ṇatvaṃ prāpnoti ? tatra samadhimāhuḥ, stoḥ ścunā ścuḥ (*8,4.40) ity atra yogavibhāgaḥ
    kriyate, ṇatvapratiṣedhārthaṃ stoḥ ścunā ṇakāro na bhavati iti, tataḥ ścuḥ iti
    //
