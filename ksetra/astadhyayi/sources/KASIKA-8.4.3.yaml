source_id: KASIKA-8.4.3
locator:
  sutra: 8.4.3
witness_text:
  sutra: pūrvapadāt sañjñāyām agaḥ
  commentary: pūrvapadasthān nimittād uttarasya gakāravarjitād nakārasya ṇakāra ādeśo
    bhavati sañjñāyāṃ viṣaye  / druṇasaḥ  / vārghrīṇasaḥ  / kharaṇasaḥ  / śūrpaṇakhā  /
    sañjñāyām iti kim ? carmanāsikaḥ  / agaḥ iti kim ? ṛgayanam  / kecid etan niyamārthaṃ
    varṇayanti, pūrvapadāt sañjñāyām eva ṇatvaṃ na anyatra iti  / [#967] samāse 'pi
    hi samānapade nimittanimittinor bhāvād asti pūrveṇa prāptiḥ iti sa ca niyamaḥ
    pūrvapadasambadhād uttarapadasthasya+eva ṇatvaṃ nivartayati, carmanāsikaḥ iti,
    na taddhitapūrvapadasthasya, khārapāyaṇaḥ, mātṛbhonīṇaḥ, karṇapriyaḥ iti  / agaḥ
    iti yogavibhāgena ṇatvapratiṣedhaḥ, na niyamapratiṣedhaḥ iti  / apare tu pūrvasūtre
    samānam eva yan nityaṃ padaṃ tat samānapadam ity āśrayanti, samānagrahaṇāt  /
    teṣām aprāptam eva ṇatvam anena nidhīyate  / samāse hi pūrvapadottaravibhāgād
    asamānapadatvam apy asti iti //
