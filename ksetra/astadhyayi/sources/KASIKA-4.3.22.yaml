source_id: KASIKA-4.3.22
locator:
  sutra: 4.3.22
witness_text:
  sutra: sarvatra aṇ ca talopaś ca
  commentary: hemanta-śabdād aṇ pratyayo bhavati, tatsaṃniyogena ca asya takāra-lopaḥ  /
    haimanaṃ vāsaḥ  / heimanam upalepanam  / sarvatra-grahaṇaṃ chando 'dhikāranivṛtty-artham  /
    chandasi bhāṣāyāṃ ca sarvatra+etad bhavati  / nanu ca chandasi iti na anuvartiṣyate
    ? saivān anuvṛttiḥ śabdena akhyāyate pratyatnādhikyena pūrvasūtre 'pi sambandha-artham  /
    [#404] haimantikam iti bhāṣāyām api ṭhañaṃ smaranti  / atha aṇ ca iti cakāraḥ
    kim arthaḥ ? aṇ, yathāprāptaṃ ca ṛtvaṇ iti  / kaḥ punar anayor viśeṣaḥ ? ṛtvaṇi
    hi takāralopo na asti haimanti paṅktī paṅktiḥ iti  / tad evaṃ trīṇi rūpāṇi bhavanti,
    haimantikam, haimantam, haimanam iti //
