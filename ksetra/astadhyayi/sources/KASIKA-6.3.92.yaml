source_id: KASIKA-6.3.92
locator:
  sutra: 6.3.92
witness_text:
  sutra: viṣvag-devayoś ca ṭer adry añcatau vapratyaye
  commentary: viṣvak deva ity etayoḥ sarvanāmnaś ca ṭeḥ adri ity ayam ādeśo bhavati
    añcatau vapratyayānte uttarapade  / diṣvag ajcati iti viṣvadryaṅ  / devadryaṅ  /
    sarvanāmnaḥ - tadryaṅ  / yadryaṅ adrisaghryorantodāttanipātanaṃ kṛtsvaranivṛttyartham  /
    tatra yaṇādeśe kṛte udāttasvaritayor yaṇaḥ svarito 'nudāttasya (*8,2.4) ity eṣa
    svaro bhavati  / viṣvagdevayoḥ iti kim ? aśvācī  / añcatau iti kim ? viṣvagyuk  /
    vapratyaye iti kim ? viṣvagañcanam  / vapratyayagrahaṇam anyatra dhātugrahaṇe
    tadādividhipratipattyartham  / tena ayaskṛtam, ayaskāraḥ ity atra ataḥ kṛkamikaṃsakumbhapātra
    iti satvaṃ bhavati  / chandasi striyāṃ bahulam iti vaktavyam  / viśvāī ca ghṛtācī
    ca ity atra na bhavati  / kadrīcī ity atra tu bhavaty eva //
