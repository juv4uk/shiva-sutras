source_id: KASIKA-1.2.29
locator:
  sutra: 1.2.29
witness_text:
  sutra: uccair udāttaḥ
  commentary: ac iti vartate  / udātta-ādi-śabdāḥ svare varṇadharme loka-vedayoḥ prasiddhā
    eva  / te iha tadguṇe 'ci paribhāṣyante  / uccair upalabhyamāno yo 'c sa udātta-sañjño
    bhavati  / uccaiḥ iti ca śruti-prakarṣo na gṛhyate, uccair bhāṣate, ucaiḥ paṭhati
    iti  / kiṃ tarhi ? sthāna-kṛtam uccatvaṃ sañjñino viśeṣaṇam  / tālv-ādiṣu hi bhāgavatsu
    sthāneṣu varṇā niṣpadyante  / tatra yaḥ samāne sthāne ūrdhva-bhaga-niṣpanno 'c
    sa udātta-sañjño bhavati  / yasminn ucāryamāṇe gātrāṇāmāyāmo nigraho bhavati,
    rūkṣatā asnigdhatā svarasya, saṃvṛtatā kṇṭhavivarasya  / ye  / te  / ke  / udātta-pradeśāḥ--ādy-udāttaś
    ca (*3,1.3) ity evam ādayaḥ //
