source_id: KASIKA-2.4.62
locator:
  sutra: 2.4.62
witness_text:
  sutra: tadrājasya bahuṣu tena+eva astriyām
  commentary: te tadrājāḥ (*4,1.172), ñya-ādayas tadrājāḥ (*5,3.119) iti vakṣyati,
    tasya tadrāja-sañjñasya pratyayasya bahuṣu vartamānasya astrīliṅgasya lug bhavati,
    tena+eva cet tadrājena kṛtaṃ bahutvaṃ bhavati  / aṅgāḥ  / vaṅgāḥ  / puṇḍrāḥ  /
    suhmāḥ  / magadhāḥ  / lohadhvajāḥ  / vrīhimantaḥ  / tadrājasya iti kim ? aupagavāḥ  /
    bahuṣu iti kim ? āṅgaḥ  / tena+eva grahaṇaṃ kim ? priyo vāṅgo yeṣāṃ te ime priyavāṅgāḥ  /
    astriyām iti kim ? āṅgyaḥ striyaḥ //
