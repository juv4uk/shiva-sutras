source_id: KASIKA-2.1.1
locator:
  sutra: 2.1.1
witness_text:
  sutra: samarthaḥ padavidhiḥ
  commentary: paribhāṣeyam  / yaḥ kaścidiha śāstre padavidhiḥ śrūyate sa samartho
    viditavyaḥ  / vidhīyate iti vidhiḥ  / padānāṃ vidhiḥ padavidhiḥ  / sa punaḥ samāsādiḥ  /
    samarthaḥ śaktaḥ  / vigrahavākyārthabhidhāne yaḥ śaktaḥ sa samartho vidhitavyaḥ  /
    atha vā samarthapadāśrayatvāt samarthaḥ  / samarthanāṃ padānāṃ sambaddhārthānāṃ
    saṃsṛṣṭārthānāṃ vidhirveditavyaḥ  / vakṣyati, dvitīyā śrita-atīta-patita-gata-atyasta-prāpta-āpannaiḥ
    (*2,1.24) - kaṣṭaṃ śritaḥ kaṣṭaśritaḥ  / samartha-grahaṇaṃ kim ? paśya devadatta
    kaṣṭaṃ, śrito viṣṇumitro gurukulam  / tṛtīyā tatkṛta-arthena guṇavacanena (*2,1.30)
    - śaṅkulayā khaṇḍaḥ śaṅkulākhaṇḍaḥ  / samartha-grahaṇaṃ kim ? kiṃ tvaṃ kariṣyasi
    śaṅkulayā, khaṇḍo devadatta upalena  / caturthī tadartha-artha-vali-hita-sukha-rakṣitaiḥ
    (*2,1.36) - yūpāya dāru yūpadāru  / samartha-grahaṇaṃ kim ? gaccha tvaṃ yūpāya,
    dāru devadattasya grehe  / pañcamī bhayena (*2,1.37) - vṛkebhyo bhayaṃ vṛkabhayam  /
    samartha-grahaṇaṃ kim ? gaccha tvaṃ mā vṛkebhyo, bhayaṃ devadattasya yajñadattāt  /
    ṣaṣṭhī (*2,2.8) - rājñaḥ puruṣaḥ rājapuruṣaḥ  / samartha-grahaṇaṃ kim ? bhāryā
    rājñaḥ, puruṣo devadattasya  / saptamī śauṇḍaiḥ (*2,1.40) - akṣeṣu śauṇḍaḥ akṣaśauṇḍaḥ  /
    samartha-grahaṇaṃ kim ? śaktastvaṃ akṣeṣu, śauṇḍaḥ pibati pānāgāre  / pada-grahaṇaṃ
    kim ? varṇavidhau samarthaparibhāśā mā bhūt  / tiṣṭhatu dadhyaśāna tvaṃ śākena  /
    tiṣṭhatu kumārī cchatraṃ haradevadattāt  / yaṇādeśo, nityaś ca tug bhavati //
