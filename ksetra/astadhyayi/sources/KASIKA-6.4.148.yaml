source_id: KASIKA-6.4.148
locator:
  sutra: 6.4.148
witness_text:
  sutra: yasya+iti ca
  commentary: ivarṇāntasya avarṇātasya ca bhasya ikāre pare taddhite ca lopo bhavati  /
    ivarṇāntasya īkāre - dākṣī  / plākṣī  / sakhī  / savarnadīrghatve hi sati atisakher
    āgacchati ity atra ekādeśasya antavattvād askhi iti ghisañjñāyāḥ pratiṣedhaḥ syāt  /
    ivarṇāntasya taddhite - duli - dauleyaḥ  / vali - vāleyaḥ  / atri - ātreyaḥ  /
    avarṇāntasya īkāre - kumārī  / gaurī  / śārṅgaravī  / avarṇāntasya taddhite -
    dākṣiḥ  / plākṣiḥ  / cauḍiḥ  / bālākiḥ  / saumitriḥ  / yasyetyauṅaḥ śyāṃ pratiṣedho
    vaktavyaḥ  / kāṇḍe  / kuḍye  / saurye himavataḥ śṛṅge  / auṅaḥ śībhāve kṛte yasya+iti
    ca iti, sūryatiṣyāgastyamatsyānāṃ ya upadhāyāḥ (*6,4.149) iti ca lopaḥ prāpnoti  /
    iyaṅuvaṅbhyāṃ lopo bhavati vipratiṣedhena  / vatsān prīṇāti vatsaprīḥ, tasya apatyam
    vātsapreyaḥ  / catuṣpādbhyo ḍañ (*4,1.135) iti ḍhañpratyayaḥ  / lokhābhrūḥ śubhrādiḥ,
    tasyāḥ apatyam laikhābhreyaḥ //
