witness_text:
  sutra: jaṅgala-dhenu-valajāntasya vibhāṣitam uttaram
  commentary: jaṅgala dhenu valaja ity evam antasya aṅgasya pūrvapadasya acāmāder
    aco vṛddhir bhavati, vibhāṣitam uttaram uttarapadasya vibhāṣā bhavati taddhite
    ñiti, ṇiti, kiti ca parataḥ  / kurujaṅgaleṣu bhavam kaurujaṅgalam, akurujāṅgalam  /
    vaiśvadhenavam, vaiśvadhainavam  / sauvarṇavalajaḥ, sauvarṇavālajaḥ //
