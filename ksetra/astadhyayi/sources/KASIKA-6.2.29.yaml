source_id: KASIKA-6.2.29
locator:
  sutra: 6.2.29
witness_text:
  sutra: iganta-kāla-kapāla-bhagāla-śarāveṣu dvigau
  commentary: igante uttarapade, kālavācini, kapāla bhagāla śarāva ity eteṣu ca dvigau
    samāse pūrvapadaṃ prakṛtisvaraṃ bhavati  / iganta - pañcāratniḥ  / daśāratniḥ  /
    pañcāratnayaḥ pramāṇamasya, daśāratnayaḥ pramāṇamasya iti taddhitārthe dviguḥ,
    pramāṇe laḥ dvigor nityam iti mātraco lopaḥ  / iganta  / kāla - pañcamāsyaḥ  /
    daśamāsyaḥ  / pañca māsān bhṛto bhūto bhāvī vā iti taddhitārthe dvigor yap (*5,1.82)  /
    pañcavarṣaḥ  / daśavarṣaḥ  / varṣāl luk ca (*5,1.88) iti ṭhaño luk  / kāla  /
    kapāla - pañcakapālaḥ  / daśakapālaḥ  / kapāla  / bhagāla - pañcabhagālaḥ  / daśabhagālaḥ  /
    bhagāla  / śarāva - pañcaśarāvaḥ  / daśaśarāvaḥ  / saṃskṛtaṃ bhakṣāḥ (*4,2.16)
    iti taddhitārthe ete samāsāḥ dvigor lug anapatye (*4,1.88) iti kṛtāṇpratyayalopā
    draṣṭavyāḥ  / igantādiṣu iti kim ? pañcabhir aśvaiḥ krītaḥ pañcāśvaḥ  / daśāśvaḥ  /
    dvigau iti kim ? paramāratniḥ  / paramaśarāvam  / pañcāratnyo daśāratnyaḥ iti
    ca yaṇguṇayoḥ bahiraṅgalakṣaṇayor asiddhatvāt sthānivadbhāvād vā dvigusvara igantalakṣaṇaḥ
    pravartate //
