source_id: KASIKA-1.1.41
locator:
  sutra: 1.1.41
witness_text:
  sutra: avyayī-bhāvaś ca
  commentary: avyayī-bhāva-samāso 'vyaya-sañjño bhavati  / kiṃ prayojanam ? luṅ-mukha-svara-upacārāḥ  /
    luk - upāgni, pratyagni śalabhāḥ patanti  / mukha-svaraḥ- upāgnimukhaḥ, pratyagnimukhaḥ  /
    mukhaṃ sva-aṅgam (*6,2.167) ity uttarapada-anta-udāttatvaṃ prāptam, na-avyaya-dik-śabda
    (*6,2.168) iti pratiṣidhyate  / tasmin pratiṣiddhe pūrvapada-prakṛti-svara eva
    bhavati  / [#19] upacāraḥ - upapayaḥ-kāraḥ, upapayaḥ-kāmaḥ  / visarjanīya-sthānikasya
    sa-kārasya upacāraḥ iti sañjñā  / tatra avyayībhāvasya avyayatve ataḥ kṛ-kami-kaṃsa-kumbha-pātra-kuśā-karṇī-ṣv
    anavyayasya (*8,3.46) iti paryudāsaḥ siddho bhavati  / sarvam idaṃ kāṇḍaṃ svara-adāv
    api paṭhyate  / punar vacanam anityatvajñāpana-artham  / tena ayaṃ kārya-niyamaḥ
    siddho bhavati  / iha ca -- purā sūryasyodetor-ādheyaḥ, purā krūrasya visṛpo virapśin
    iti na la-u-uka-avyaya-niṣṭhā-khal-artha-tṛnām (*2,3.69) iti ṣaṣṭhī-pratiṣedho
    na bhavati //
