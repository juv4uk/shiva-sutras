source_id: KASIKA-3.4.9
locator:
  sutra: 3.4.9
witness_text:
  sutra: tumarthe se-sen-ase-asen-kṣe-kasen-adhyai-adhyain-kadhyai-kadhyain-śadhyai-śadhyain-tavai-taveṅ-tavenaḥ
  commentary: chandasi ity eva  / tumuno 'rthas tum-arthaḥ  / tatra chandasi viṣaye
    dhātoḥ sayādayaḥ pratyayā bhavanti  / tumartho bhāvaḥ  / kathaṃ jñāyate ? vacanasāmarthyāt
    tāvad ayam kartur apakṛṣyate  / na ca ayam anyasminn arthe tumun ādiśyate  / anirdiṣṭa-arthāś
    ca pratyayāḥ svārthe bhavanti  / svārthaś ca dhātūnāṃ bhāva eva  / se - vakṣe
    rāyaḥ  / sen - tā vāmeṣe rathānām  / ase, asen - kratve dakṣāya jīvase  / svare
    viśeṣaḥ  / kṣe - preṣe bhagāya kasen - śriyase  / adhyai, adhyain - kāmamupācaradhyai  /
    svare viśeṣaḥ  / kadhyai - indrāgnī āhuvadhyai  / kadhyain - śriyadhyai  / śadhyai,
    śadhyain - vāyave pibadhyai  / rādhasaḥ saha mādayadhyai  / tavai - somamindrāya
    pātavai  / taveṅ - daśame māsi sūtave  / taven - svardeveṣu gantave  / kartave  /
    hartave //
