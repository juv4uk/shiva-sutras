source_id: KASIKA-8.3.22
locator:
  sutra: 8.3.22
witness_text:
  sutra: hali sarveṣāṃ
  commentary: hali parataḥ bhobhagoaghoapūrvasya yakārasya padāntasya lopo bhavati
    sarveṣām ācāryāṇāṃ matena  / bho hasati  / bhago hasati  / agho hasati  / bho
    yāti  / bhago yāti  / agho yāti  / vṛkṣā hasanti  / sarveṣāṃ grahaṇaṃ śākaṭāyanasya
    api lopo yathā syāt, laghuprayatnataro mā bhūt iti //
