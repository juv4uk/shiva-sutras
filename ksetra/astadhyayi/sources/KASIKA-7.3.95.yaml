source_id: KASIKA-7.3.95
locator:
  sutra: 7.3.95
witness_text:
  sutra: tu-ru-stu-śamy-amaḥ sārvadhātuke
  commentary: tu iti sautro 'yaṃ dhātuḥ, ru śabde, ṣṭuñ stutau, śamu upaśame, ama
    gatyādiṣu ity etebhyaḥ parasya sārvadhātukasya halāder vā īḍāgamo bhavati  / uttauti,
    uttavīti  / uparauti, uparavīti  / upastauti, upastavīti  / śāmyadhvam, śamīdhvam  /
    abhyamati, abhyamīti  / śamyamoḥ bahulaṃ chandasi (*2,4.73) iti vikaraṇaluki sati
    halādisārvadhātukam anantaraṃ sambhavati  / āpiśalāḥ turustuśamyamaḥ sārvadhātukāsucchandasi
    iti paṭhanti  / tatra sarveṣām eva chandasi viṣaye vidhir ayaṃ bhavati  / sārvadhātuke
    iti anuvartamāne punaḥ sārvadhātukagrahaṇam apidartham, stuvīta, śamīdhvam ity
    atra api yathā syāt iti // [#855]
