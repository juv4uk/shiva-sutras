source_id: KASIKA-6.3.43
locator:
  sutra: 6.3.43
witness_text:
  sutra: gharūpakalpacelaḍbrūvagotramatahateṣu ṅyo 'nekāco hrasvaḥ
  commentary: gha rūpa kopa celaṭ brūva gotra mata hata ity eteṣū parato bhāṣitapuṃskat
    paro yo ṅīpratyayas tadantasya anekāco hrasvo bhavati  / gha - brāhmaṇitarā  /
    brāhmaṇitamā  / rūpa - brāhmanṇirūpā  / kalpa - brāhmaṇikalpā  / celaṭ - brāhmaṇicelī  /
    bruva - brāhmaṇibruvā  / gotra - brāhmaṇigotrā  / mata - brāhmaṇimatā  / hata
    - brāhmaṇihatā  / gharūpakalpāḥ pratyayāścelaḍādīny uttarapadāni  / brauva iti
    bravīti iti bruvaḥ pacādyuaci, vacyādeśo guṇaś ca nipātanānna bhavati  / ṅyaḥ
    iti kim ? dattātarā  / guptātarā  / anekacaḥ iti kim ? nadyāḥ śeṣasya anyatarasyām
    (*6,3.44) iti vakṣyati  / bhāṣitapuṃskād ity eva, āmalakītarā  / kuvalītarā //
