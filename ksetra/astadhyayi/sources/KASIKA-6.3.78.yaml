source_id: KASIKA-6.3.78
locator:
  sutra: 6.3.78
witness_text:
  sutra: sahasya saḥ sañjñāyām
  commentary: sahaśabdasya sa ity ayam ādeśo bhavati sañjñāyāṃ viṣaye  / sāśvattham  /
    sapalāśam  / saśiṃśapam  / sañjñāyām iti kim ? sahayudhvā  / sahakṛtvā  / sādeśa
    udātto nipātyate  / udāttānudāttavato hi sahaśabdasya antaryataḥ svaritaḥ syāt  /
    sanipātanasvaraḥ pūrvapadaprakṛtisvaratvaṃ yatra tatra upayujyate  / anyatra samāsāntodāttatvena
    bādhyata eva, seṣṭi, sapaśubandham iti //
