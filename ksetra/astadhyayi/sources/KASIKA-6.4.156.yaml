locator:
  sutra: 6.4.156
witness_text:
  sutra: sthūla-dūra-yuva-hrasva-kṣiprakṣudrāṇāṃ yaṇādiparaṃ pūrvasya ca guṇaḥ
  commentary: sthūla dūra yuva hrasva kṣipra kṣudra ity eteṣāṃ yaṇādiparaṃ lupyate
    iṣṭhemeyassu parataḥ, pūrvasya ca guṇo bhavati  / sthūla - sthaviṣṭhaḥ  / sthavīyān  /
    dūra - daviṣṭhaḥ  / davīyān  / yuvan - yaviṣṭhaḥ  / yavīyān  / hrasva - hrasiṣṭhaḥ  /
    hrasimā  / hrasīyān  / kṣipra - kṣepiṣṭhaḥ  / kṣepimā  / kṣepīyān  / kṣudra -
    kṣodiṣṭhaḥ  / kṣodimā  / kṣodīyān  / hrasvakṣiprakṣudraśabdāḥ pṛthvādiṣu paṭhyante  /
    paragrahaṇaṃ kim ? yaviṣṭhaḥ, yavīyān, hrasiṣṭhaḥ, hrasīyān ity atra pūrvasya
    yaṇāderlopo mā bhūt  / pūrvagrahaṇaṃ vispaṣṭārtham //
