source_id: KASIKA-6.2.138
locator:
  sutra: 6.2.138
witness_text:
  sutra: śiter nitya-abahv-ajb-ahuvrīhāv abhasat
  commentary: śiteḥ uttarapadaṃ nityaṃ yad abahvaj bhasacchabdavarjitaṃ bahuvrīhau
    samāse tat prakṛtisvaram bhavati  / śitipādaḥ  / śityaṃsaḥ  / śityoṣṭhaḥ  / pādaśabdo
    vṛṣāditvād adyudāttaḥ  / aṃsauṣṭhaśabdau ca pratyayasya nittvāt  / śiteḥ iti kim
    ? darśanīyapādaḥ  / nityagrahaṇam kim ? śitikakut kakudasya vasthāyāṃ lopo vidhīyate  /
    tatra avasthāyā anyatra śitikakuda iti bahvajuttarapadaṃ bhavati iti tena na nityābahvac  /
    abahvac iti kim ? śitilalāṭaḥ  / bahuvrīhau iti kim ? śiteḥ pādaḥ śitipādaḥ  /
    abhasat iti kim ? śitibhasad  / śitiśabda ādyudāttaḥ  / pūrvapadaprakṛtisvarāpavādo
    yogaḥ // [#685]
