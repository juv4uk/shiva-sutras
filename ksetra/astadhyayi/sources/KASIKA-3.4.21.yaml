source_id: KASIKA-3.4.21
locator:
  sutra: 3.4.21
witness_text:
  sutra: samāna-kartuṛkayoḥ pūrvakāle
  commentary: samānaḥ kartā yayoḥ dhātv-arthayos tatra pūrvakāle dhātv-arthe vartamānād
    dhātoḥ ktvā pratyayo bhavati  / śaktiśaktimatoḥ bhedasya avivakṣitatvāt samānakartṛkatā  /
    bhuktvā vrajati  / pītvā vrajati  / dvivacanamatantram  / snātvā pītvā bhukvā
    vrajati  / samāna-kartuṛkayoḥ iti kim ? bhuktavati brāhmaṇe gacchati devadattaḥ  /
    pūrvakāle iti kim ? vrajati ca jalpati ca  / āsyaṃ vyādāya svapiti cakṣuḥ saṃmīlya
    hasti ity upasaṃkhyānam apūrvakālatvāt //
