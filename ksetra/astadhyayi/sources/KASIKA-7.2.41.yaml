source_id: KASIKA-7.2.41
locator:
  sutra: 7.2.41
witness_text:
  sutra: iṭ sani vā
  commentary: vṝtaḥ sani vā iḍāgamo bhavati  / vuvūrṣate, vivariṣate, vivarīṣate  /
    prāvuvūrṣati, prāvivariṣati, prāvivarīṣati  / ṝkārāntebhyaḥ - titīrṣati, titariṣati,
    titarīṣati  / ātistīrṣate, ātistariṣate, ātistarīṣate  / sani grahaguhoś ca (*7,2.12)
    iti iṭpratiṣedhe prāpte pakṣe iḍāgamo vidhīyate  / iṭaś ca vṝto vā (*7,2.38) iti
    pakṣe dīrghaḥ  / cikīrṣati, jihīrṣati ity atra+upadeśādhikārāt lākṣaṇikatvāc ca
    iḍāgamo na bhavati //
