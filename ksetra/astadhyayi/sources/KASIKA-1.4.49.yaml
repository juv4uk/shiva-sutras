source_id: KASIKA-1.4.49
locator:
  sutra: 1.4.49
witness_text:
  sutra: kartrur īpsitatamaṃ karma
  commentary: kartuḥ kriyayā yad āptum iṣṭatamaṃ tat kārakaṃ karmasañjñaṃ bhavati  /
    kaṭaṃ karoti  / grāmaṃ gacchati  / kartuḥ iti kim ? māṣeṣvaśvaṃ badhnāti  / karmaṇa
    īpsitā māṣāḥ, na kartuḥ  / tam abgrahaṇaṃ kim ? payasā odanaṃ bhuṅkte  / karma
    ityanuvartamāne punaḥ karma-grahaṇam ādhāra-nivṛtty-artham  / itarathā ādhārasya+eva
    hi syāt gehaṃ praviśati iti  / odanaṃ pacati, saktūn pibati ity ādiṣu na syāt  /
    punaḥ karma-grahaṇāt sarvatra siddha bhavati  / karma-pradeśāḥ -- karmaṇi dvitīyā
    (*2,3.2) ity evam ādayaḥ //
