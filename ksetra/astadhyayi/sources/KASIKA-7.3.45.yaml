source_id: KASIKA-7.3.45
locator:
  sutra: 7.3.45
witness_text:
  sutra: na yā-sayoḥ
  commentary: yā sā ity etayoḥ ikārādeśo na bhavati  / yakā  / sakā  / yā sā iti nirdeśo
    'tantram, yattador upalakṣaṇametat  / iha api pratiṣedha iṣyate, yakāṃ yakāmadhīmahe
    takāṃ pacāmahe iti  / yāsayorittvapratiṣedhe tyakana upasaṅkhyānam  / upatyakā  /
    adhityakā  / pāvakādīnāṃ chandasy upasaṅkhyānam  / hiraṇyavarṇāḥ śucayaḥ pāvakāḥ  /
    yāsu alomakāḥ  / chandasi iti kim ? pāvikā  / āśiṣi ca+upasaṅkhyānam  / jīvatāt
    jīvakā  / nandatāt nandakā  / bhavatāt bhavakā  / [#843] uttarapadalope ca+upasaṅkhyānam  /
    devadattikā, devakā  / yajñadattikā, yajñakā  / kṣipakādīnāṃ ca+upasaṅkhyānam  /
    kṣipakā  / dhruvakā  / tārakā jyotiṣy upasaṅkhyānam  / tārakā  / jyotiṣi iti kim
    ? tārikā dāsī  / varṇakā tāntava upasaṅkhyānam  / varṇakā prāvaraṇabhedaḥ  / tāntave
    iti kim ? vaṇikā bhāgurī laukāyate  / vartakā śakunau prācām upasaṅkhyānam  /
    vartakā śakuniḥ  / prācām anyatra udīcāṃ tu vartikā  / śakunau iti kim ? vartikā
    bhāgurī laukāyatasya  / aṣṭakā pitṛdaivatye  / aṣṭakā  / pitṛdaivatye iti kim
    ? aṣṭikā khārī  / vā sutakāputrakāvṛndārakāṇām upasaṅkhyānam  / sutikā, sutakā  /
    putrikā, putrakā  / vṛndārikā, vṛndārakā //
