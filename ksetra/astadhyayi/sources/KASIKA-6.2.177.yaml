locator:
  sutra: 6.2.177
witness_text:
  sutra: upasargāt svāṅgaṃ dhruvam aparśu
  commentary: upasargāt svāṅgaṃ dhruvaṃ parśuvarjitam antodāttaṃ bhavati bahuvrīhau
    samāse  / prapṛṣṭhaḥ  / prodaraḥ  / pralalāṭaḥ  / dhruvam ity ekarūpam ucyate,
    dhruvam asya śītam iti yathā  / satataṃ yasya pragataṃ pṛṣṭhaṃ bahvati sa prapṛṣṭhaḥ  /
    upasargāt iti kim ? darśanīyalalāṭaḥ  / svāṅgam iti kim ? praśākho vṛkṣaḥ  / dhruvam
    iti kim ? udbāhuḥ krośati  / aparśu iti kim ? utparśuḥ  / viparśuḥ //
