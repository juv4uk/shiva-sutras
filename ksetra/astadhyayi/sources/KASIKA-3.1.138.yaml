locator:
  sutra: 3.1.138
witness_text:
  sutra: anupasargāl limpa-vinda-dhāri-pāri-vedy-udeji-ceti-sāti-sāhibhyaś ca
  commentary: anupasargebhyo limpa-ādibhyaḥ śa-pratyayo bhavati  / limpati iti limpaḥ  /
    vindati ti vindaḥ  / dhārayati iti dhārayaḥ  / pārayati iti pārayaḥ  / vedayati
    iti vedayaḥ  / udejāti iti udejayaḥ  / cetayati iti cetayaḥ  / sātiḥ sautro dhātuḥ  /
    sātayaḥ  / sāhayaḥ  / anupasargāt iti kim  / pralipaḥ  / nau limper iti vaktavyam  /
    nilimpā nāma devāḥ  / gavādiṣu vindeḥ sañjñāyām  / govindaḥ  / aravindaḥ //
