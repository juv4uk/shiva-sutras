source_id: KASIKA-5.1.21
locator:
  sutra: 5.1.21
witness_text:
  sutra: śatāc ca ṭhanyatāv aśate
  commentary: ārhāt ity eva  / śata-śabdāt ṭhanyatau pratyayau bhavataḥ aśate 'dhidheye
    ārhīyeṣv artheṣu  / kano 'pavādaḥ  / śatena krītaṃ śatikam, śatyam  / aśate iti
    kim ? śataṃ parimāṇam asya śatakaṃ nidānam  / pratyayārtho 'tra saṅghaḥ  / śatam
    eva vastutaḥ prakṛtyarthān na bhidyate  / iha tu na bhavati, śatena krītaṃ śatyaṃ
    śāṭakaśatam, śatikaṃ śāṭakaśatam iti  / vākyena hy atra pratyaya-arthasya tattvaṃ
    gamyate, na śrutyā  / tathā ca+uktam, śatapratiśedhe 'nyaśatatve 'pratiṣedhaḥ
    iti  / cakāro 'samāsa ity anukarṣaṇa-arthaḥ  / dvau ca śataṃ ca dviśataṃ, dviśatena
    krītaṃ dviśatakam  / triśatakam  / prāgvateḥ saṅkhyā-pūrvapadānāṃ tadantagrahaṇam
    aluki ity anayā iṣṭyā samāsād api prāpnoti //
