source_id: KASIKA-8.3.65
locator:
  sutra: 8.3.65
witness_text:
  sutra: upasargāt sunoti-suvati-syati-stauti-stobhati-sthā-senaya-sedha-sica-sañja-svañjām
  commentary: mūrdhanya iti vartate, saḥ iti ca  / upasargasthān nimittāt uttarasya
    sunoti suvati syati stauti stobhati sthā senaya sedha sica sañja svañja ity eteṣāṃ
    sakārasya mūrdhanyādeśo bhavati  / sunoti - abhiṣuṇoti  / pariṣuṇoti  / abhyaṣuṇot  /
    paryaṣuṇot  / suvati - abhiṣuvati  / pariṣuvati  / abhyaṣuvat  / paryaṣuvat  /
    syati - abhiṣyati  / pariṣyati  / abhyaṣyat  / paryaṣyat  / stauti - tabhiṣṭauti  /
    pariṣṭauti  / abhyaṣtaut  / paryaṣṭaut  / stobhati - abhiṣṭobhate  / pariṣtobhate  /
    abhyaṣṭobhata  / paryaṣṭobhata  / sthā - abhiṣṭhāsyati  / pariṣṭhāsyati  / abhyaṣṭāt  /
    paryaṣṭhāt  / abhitaṣṭau  / paritaṣṭhau  / senaya - abhiṣeṇayati  / pariṣeṇayati  /
    abhyaṣeṇayat  / paryaṣeṇayat  / abhiṣiṣeṇayiṣati  / [#954] pariṣiṣeṇayiṣati  /
    sedha - abhiṣedhati  / priṣedhati  / abhyaṣedhat  / paryaṣedhat  / sica - abhiṣiñcati  /
    pariṣiñcati  / abhyaṣiñcat  / paryaṣiñcat  / abhiṣiṣikṣati  / pariṣiṣikṣati  /
    sañja - abhiṣajati  / pariṣajati  / abhyaṣajat  / paryaṣajat  / abhiṣiṣaṅkṣati  /
    priraṅkṣati  / svañja - abhiṣvajate  / pariṣvajate  / abhyaṣvajata  / paryaṣvajata  /
    abhiṣiṣvaṅkṣate  / pariṣiṣvaṅkṣate  / sedha iti śabvikaraṇanirdeśaḥ sidhyatinivṛttyarthaḥ  /
    upasargāt iti kim ? dadhi siñcati  / madhu siñcati  / nirgatāḥ secakā usmasad
    deśāt niḥsecako deśaḥ iti nāyaṃ siceḥ upsargaḥ  / abhisāvakoyati ity atra api
    na sunotiṃ prati kiryāyogaḥ, kiṃ tarhi ? sāvakīyaṃ prati  / abhiṣāvayati ity atra
    tu sunotimeva prati kriyāyogaḥ, na sāvaryatiṃ prati iti ṣatvaṃ bhavati //
