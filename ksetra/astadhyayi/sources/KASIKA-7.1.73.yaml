source_id: KASIKA-7.1.73
locator:
  sutra: 7.1.73
witness_text:
  sutra: iko 'ci vibhaktau
  commentary: igantasya napuṃsakasya aṅgasya ajādau vibhaktau numāgamo bhavati  /
    trapuṇī  / jatunī  / tumburuṇī  / trapuṇe  / jatune  / tumburuṇe  / ikaḥ iti kim
    ? kuṇḍe  / pīṭhe  / aci iti kim ? uttarārtham  / yady evam, tatra+eva kartavyam
    ? iha tu karaṇasya etat prayojanam, he trapo ity atra num mā bhūt, iti, na ṅisambuddhyoḥ
    (*8,2.8) iti nalopapratiṣedhaḥ syāt  / nanu ca na lumatāṅgasya (*1,1.63) iti pratyayalakṣaṇe
    pratiṣiddhe vibhaktir eva na asti ? etad eva ajgrahaṇaṃ jñāpakaṃ pratyayalakṣaṇapratiṣedho
    'tra na bhavati iti  / tathā ca sambuddhiguṇaḥ kriyate  / vibhaktau iti kiṃ ?
    taumburavaṃ cūrṇam  / iko 'ci vyañjane mā bhūdastu lopaḥ svaraḥ katham  / svaro
    vai śrūyamāṇe 'pi lupte kiṃ na bhaviṣyati  / rāyātvaṃ tisṛbhāvaś ca vyavadhānānnumā
    api  / nuḍ vācya uttarārthaṃ tu iha kiñcit trapo iti //
