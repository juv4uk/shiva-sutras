source_id: KASIKA-3.3.94
locator:
  sutra: 3.3.94
witness_text:
  sutra: striyāṃ ktin
  commentary: bhāve akartari ca kārake ti vartate  / strīliṅge bhāvādau dhātoḥ ktin
    pratyayo bhavati  / ghañajapāmapavādaḥ  / kṛtiḥ  / citiḥ  / matiḥ  / ktinnāvādibhyaś
    ca vaktavyaḥ  / ābādayaḥ prayogato 'nusartavyāḥ  / āptiḥ  / rāddhiḥ  / dīptiḥ  /
    srastiḥ  / dhvastiḥ  / labdhiḥ  / śruyajistubhyaḥ karaṇe  / śrūyate anayā iti
    śrutiḥ  / iṣṭiḥ  / stutiḥ  / glāmlājyāhābhyo niḥ  / glāniḥ  / mlāniḥ  / jyāniḥ  /
    hāniḥ  / ṝkāralvādibhyaḥ ktin niṣṭhāvad bhavati iti vaktavyam  / kīrṇiḥ  / gīrṇiḥ  /
    jīrṇiḥ  / śīrṇiḥ  / lūniḥ  / yūniḥ  / sampadādibhyaḥ kvip  / sampad  / vipad  /
    pratipad  / ktinn api iṣyate  / sampattiḥ  / vipattiḥ // [#272]
