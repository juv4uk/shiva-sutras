source_id: KASIKA-6.4.144
locator:
  sutra: 6.4.144
witness_text:
  sutra: nas taddhite
  commentary: nakārāntasya bhasya ṭeḥ lopo bhavati taddhite parataḥ  / āgniśarmiḥ  /
    auḍulomiḥ  / bāhvāditvād iñ pratyayaḥ  / naḥ iti kim ? sātvataḥ  / taddhite iti
    kim ? śarmaṇā  / śarmane  / nānatasya ṭilope sabrahmacāri-pīṭhasarpi-kalāpi-kuthumi.
    taitili-jājalilāṅga-liśilāli-śikhaṇḍi-sūkarasadma-suparvaṇām upasaṅkhyānaṃ kartavyam  /
    atra ye innantāḥ teṣām in aṇy anapatye (*6,4.164) iti prakṛtibhāvaḥ prāptaḥ, ye
    tu anantāḥ teṣām an (*6,4.167) iti  / sabrahmacāriṇaḥ ime sābrahmacārāḥ, pīṭhasarpiṇaḥ
    paiṭhasarpāḥ  / kalāpinā proktamadhīyate kālāpāḥ, kuthuminaḥ kauthumāḥ  / taitilijājalinau
    ācāryau, tatkṛto granthaḥ upacārāt taitilijājaliśabdābhyām abhidhīyate, taṃ granthamadhīyate
    taitilāḥ, jājalāḥ  / śaiśikeṣv artheṣu vṛddhatvād atra chaḥ prāpnoti  / evaṃ lāṅgalāḥ  /
    śailālāḥ  / [#763] śikhaṇḍinaḥ śaikhaṇḍāḥ  / sūkarasadmanaḥ saukarasadmāḥ  / suparvaṇaḥ
    sauparṇāḥ  / aśmano vikāra upasaṅkhyānam  / aśmano vikāraḥ āśmaḥ  / aśmano 'nyaḥ  /
    carmaṇaḥ kośa upasaṅkhyānam  / cārmaḥ kośaḥ  / cārmaṇo 'nyaḥ  / śunaḥ saṅkoca
    upasaṅkhyānam  / śauvaḥ saṅkocaḥ  / śauvano 'nyaḥ  / avyayānāṃ ca sāyaṃpratikādyartham
    upasaṅkhyānam  / ke punaḥ sāyaṃprātikādayaḥ ? yeṣām avyayānām avihitaṣṭilopaḥ,
    prayoge ca dṛśyate, te sāyaṃprātikaprakārāḥ grahītavyāḥ  / sāyaṃprātarbhavaḥ sāyaṃprātikaḥ  /
    paunaḥpunikaḥ  / bāhyaḥ  / kautaskutaḥ  / kālāṭ ṭhañ (*4,3.11) iti ṭhañpratyayaḥ  /
    ṭyuṭyulau tu neṣyete  / ārātīyaḥ, śāśvatikaḥ, śāśvataḥ ity evam ādiṣu na dṛśyate
    ṭilopaḥ //
