source_id: KASIKA-8.3.38
locator:
  sutra: 8.3.38
witness_text:
  sutra: so 'padādau
  commentary: sakāra ādeśaḥ bhavati visarjanīyasya kupvoḥ apadādyoḥ parataḥ pāśakalpakakāmyeṣu  /
    yāpye pāśap (*5,3.57) - payaspāśam  / īṣadasamāptau kalpap - payaskalpam  / yaśaskalpam  /
    prāgivāt kaḥ (*5,3.70) - payaskam  / yaśaskam  / kāmyac - payaskāmyati  / yaśaskāmyati  /
    apadādau iti kim ? payaḥ kāmayate  / payaḥ pibati  / so 'padādāvityanavyayasya+iti
    vaktavyam  / iha mā bhūt, prātaḥ kalpam, punaḥ kalpam iti  / roḥ kāmye niyamārtham  /
    ror eva kāmye na anyasya iti niyamārthaṃ vaktavyam  / payaskāmyati  / yaśaskāmyati  /
    iha ma bhūt, gīḥ kāmyati  / dhūḥ kāmyati  / upadhmānīyasya kavarge parataḥ sakārādeśo
    bhavati iti vaktavyam  / kiṃ prayojanam ? ubjirupadhmānīyopadhaḥ paṭhyate iti
    darśane abhyudgaḥ, samudagaḥ iti yathā syāt //
