witness_text:
  sutra: kiṃkila-asty-artheṣu lṛṭ
  commentary: anavaklṛpty-amarṣayoḥ iti vartate  / kiṃkila-śabdaḥ samudāya eva upapadam  /
    asty-arthāḥ astibhavati - vidyatayaḥ  / kiṃkila-asty-artheṣu upapadeṣu anavaklṛpty-amarṣayoḥ
    dhātoḥ lṛṭ pratyayo bhavati  / liṅo 'pavādaḥ  / kiṃ - kila nāma tatrabhavan vṛṣalaṃ
    yājayiṣyati  / asti nāma tatrabhavān vṛṣalaṃ yājayiṣyati  / bhavati nāma tatrabhavān
    vṛṣalaṃ yājayiṣyati  / vidyate nāma tatrabhavān vṛṣalaṃ yājayiṣyati  / na śraddadhe,
    na marṣayāmi  / liṅ-nimittam iha na asti tena lṛṅ na bhavati //
