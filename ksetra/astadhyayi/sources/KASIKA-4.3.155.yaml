source_id: KASIKA-4.3.155
locator:
  sutra: 4.3.155
witness_text:
  sutra: ñitaś ca tatpratyayāt
  commentary: añ ity eva  / tad iti vikārāvayavayor arthayoḥ pratyavamarśaḥ  / ñid
    yo vikārāvayavapratyayas tadantāt prātipadikāt añ pratyayo bhavati vikāravayavayoḥ
    eva  / mayaṭo 'pavādaḥ  / orañ (*4,2.71), śamyāṣṭlañ (*4,3.142), prāṇirajatādibhyo
    'ñ (*4,3.154), uṣṭrādvuñ (*4,3.157), eṇyā ḍhañ (*4,3.159), kaṃsīya-paraśavyayor
    yañ-añau luk ca (*4,3.168) ity ete pratyayāḥ gṛhyante  / daivadāravasya vikāro
    'vayavo vā daivadāravam  / dādhitthasya dādhittham  / pālāśasya pālāśam  / śāmīlasya
    śāmīlam  / kāpotasya kāpotam  / auṣṭrakasya auṣṭrakam  / aiṇeyasya aiṇeyam  /
    kāṃsyasya kāṃsyam  / pāraśavasya pāraśavam  / ñitaḥ iti kim ? bailvamayam  / tatpratyayāt
    iti kim ? baidamayam //
