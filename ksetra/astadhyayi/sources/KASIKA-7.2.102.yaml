locator:
  sutra: 7.2.102
witness_text:
  sutra: tyadādīnām aḥ
  commentary: tyad ity evam ādīnām akārādeśo bhavati vibhaktau parataḥ  / tyad - syaḥ,
    tyau, tye  / tad - saḥ, tau, te  / yad - yaḥ, yau, ye  / etad - eṣaḥ, etau, ete  /
    idam - ayam, imau, ime  / adas - asau, amū, amī  / dvi - dvau  / dvābhyām  / dviparyantānāṃ
    tyadādīnāmatvamiṣyate  / iha na bhavati, bhavat - bhavān  / sañjñopasarjanībhūtāḥ
    tyadādayaḥ pāṭhādeva paryudastāḥ iti iha na bhavati, tyad, tyadau, tyadaḥ  / atityad,
    atityadau, atityadaḥ  / tyadādipradhāne tu śabde bhavaty eva, paramasaḥ paramatau,
    parmate //
