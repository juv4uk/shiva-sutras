source_id: KASIKA-4.2.21
locator:
  sutra: 4.2.21
witness_text:
  sutra: sā 'smin paurṇamāsī iti sañjñāyām
  commentary: sā iti prathamāsamarthād asminn iti saptamy-arthe yathāvihitaṃ pratyayo
    bhavati, yat tat prathamāsamarthaṃ paurṇamāsī ced bhavati  / iti-karaṇaḥ tataś
    ced vivakṣā bhavati  / sañjñāyām iti samudāyopādhiḥ, pratyayāntena cet sañjñā
    gamyate iti  / māsārdhamāsasaṃvatsarāṇām eṣā sañjñā  / pauṣī paurṇamāsī asmin
    pauṣo māsaḥ  / pauṣo 'rdhamāsaḥ  / [#368] pauṣaḥ saṃvatsaraḥ  / iha na bhavati,
    pauṣī paurṇamāsī asmin daśarātre iti  / bhṛtakamāse ca na bhavati  / itikaraṇasya
    sañjñāśabdasya ca tulyam eva phalaṃ prayoga-anusaraṇaṃ, tatra kimarthaṃ dvayam
    upādīyate ? sañjñāśabdena tulyatām iti karaṇasya jñāpayituṃ, na hy ayaṃ loke tathā
    prasiddhaḥ  / sañjñārthatve tu samprati jñāpite yat tatra tatra+ucyate itikaraṇas
    tataś ced vivakṣā iti tadupapannaṃ bhavati  / atha paurṇamāsī iti ko 'yaṃ śabdaḥ  /
    pūrṇamāsādaṇ paurṇamāsī  / athavā pūrṇo māḥ pūrṇamāḥ, pūrṇamāsa iyaṃ paurṇamāsī  /
    mā iti candra ucyate //
