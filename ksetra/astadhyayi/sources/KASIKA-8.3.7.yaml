source_id: KASIKA-8.3.7
locator:
  sutra: 8.3.7
witness_text:
  sutra: naśchavyapraśān
  commentary: bhavāṃścarati  / kecit tu paraśabdam eva anyārthaṃ varṇayanti  / anunāsikāt
    paraḥ anunāsikāt anyaḥ anusvāro bhavati  / yasmin pakṣe 'nunāsiko na asti tatra
    anusvārāgamo bhavati  / sa tu kasya āgamo bhavati ? roḥ pūrvasya+eva+iti vartate,
    vyākhyānād ādeśo na bhavati // samaḥ suṭi (*8,3.5)  / ruḥ vartate  / samaḥ ity
    etasya ruḥ bhavati suṭi parataḥ saṃhitāyāṃ viṣaye  / saṃskartā  / saṃskartum  /
    saṃskartavyam  / saṃsskartā  / saṃsskartum  / saṃsskartavyam  / atra rorvisarjanīye
    kṛte vā śari (*8,3.66) iti pakṣe visarjanīya eva prāpnoti  / vyavasthitavibhāṣā
    draṣṭavyā  / tena atra nityaṃ sakāra eva bhavati  / asminneva sūtre sakārādeśo
    vā nirdiśyate, samaḥ suṭi iti dvisakārako nirdeśaḥ  / [#939] samaḥ iti kim ? upaskartā  /
    suṭi iti kim ? saṃkṛtiḥ  / kaścidāha - saṃpuṃkānāṃ so vaktavyaḥ  / ruvidhau hy
    aniṣṭaprasaṅgaḥ, saṃsskartā, puṃsskāmā, kāṃsskān iti // pumaḥ khayyampare (*8,3.6)  /
    pum ity etasya ruḥ bhavati ampare khayi parataḥ  / puṃskāmā, puṃskāmā  / puṃsputraḥ,
    puṃsputraḥ  / puṃsphalam puṃsphalam  / puṃścalī, puṃścalī  / puṃskāmā ity atra
    visarjanīyasya kupvoḥ ḥkaḥpau ca (*8,3.37) iti prāpnoti  / tasmād atra sakāra
    ebādeśo vaktavyaḥ  / dvisakārakanirdeśapakṣe tu pūrvasmād eva sūtrāt saḥ ity anuvartate  /
    rutvam tu anuvartamānam api nātrābhisambadhyate, sambandhānuvṛttistasya iti  /
    khayi iti kim ? puṃdāsaḥ  / puṃgavaḥ  / ampare iti kim ? puṃkṣīram  / puṃkṣuram  /
    paragrahaṇaṃ kim ? pumākhyāḥ  / pumācāraḥ // naś chavy apraśān (*8,3.7)  / ampare
    iti vartate  / nakārāntasya padasya praśānvarjitasya ruḥ bhavati ampare chavi
    parataḥ  / bhavāṃśchādayati, bhavāṃśchādayati  / bhavāṃścinoti, bhavāṃścinoti  /
    bhavāṃṣṭīkate, bhavāṃṣṭīkate  / bhavāṃstarati, bhavāṃstarati  / chavi iti kim
    ? bhavān karoti  / apraśān iti kim ? praśān chāvyati  / praśān cinoti  / ampare
    ity eva, bhavāntsarukaḥ //
