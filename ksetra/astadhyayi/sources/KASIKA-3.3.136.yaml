source_id: KASIKA-3.3.136
locator:
  sutra: 3.3.136
witness_text:
  sutra: bhaviṣyati maryādā-vacane 'varasmin
  commentary: nānadyatanavat iti vartate  / akriya-prabandha-artham, asāmīpyārthaṃ
    ca vacanam  / bhaviṣyati kāle maryādā-vacane satyavarasmin pravibhāge 'nadyatanavat
    pratyaya-vidhir na bhavati  / yo 'yamadhvā gantavya āpāṭaliputrāt, tasya yadavaraṃ
    kauśāmbyāḥ, tatra dvirodanaṃ bhokṣyāmahe, tatra saktūn pāsyāmaḥ  / bhaviṣyati
    iti kim ? yo 'yamadhvā gataḥ āpāṭaliputrāt, tasya yadavaraṃ kauśāmbyāḥ, tatra
    yuktā adhyaimahi, tatra dvirodanam abhuñjmahi, tatra saktūnapibāma  / maryādāvacane
    iti kim ? yo 'yamadhvā niravadhiko gantavyaḥ, tasya yadavaraṃ kauśāmbyāḥ, tatra
    dvirodanaṃ bhoktāsmahe, saktūn pātā smaḥ  / avarasmin iti kim ? yo 'yamadhvā gantavyaḥ
    āpāṭaliputrāt, tasya yatparam kauśāmbyāḥ, tatra dvirodanaṃ bhoktāsmahe, tatra
    saktūn pātāsmaḥ  / iha sūtre deśakṛtā maryādā, uttaratra kālakṛtā  / tatra ca
    viśeṣaṃ vakṣyati //
