source_id: KASIKA-8.1.35
locator:
  sutra: 8.1.35
witness_text:
  sutra: chandasy anekam api sākāṅkṣam
  commentary: hi ca iti vartate  / chandasi viṣaye hiyuktaṃ tiṅantaṃ sākāṅkṣaṃane
    kam api nānudāttaṃ bhavati, ekam api  / kadācid ekaṃ kadācid anekam ity arthaḥ  /
    tatra anekaṃ tāvat - anṛtaṃ hi matto vadati, pāpmā enaṃ vipunāti  / tiṅantadvayam
    apy etan na nihanyate  / ekaṃ khalv api - agnir hi pūrvamudajayat tamindro 'nūdajayat
    tiṅantadvayam api hiśabdayuktam etat  / tatra ekam udajayat ity ādyudāttam, aparam
    anudāttam  / ajā hy agner ajaniṣṭa garbhāt sā vā apaśyaj janitāram agne  / ajaniṣṭa
    ityādyudāttam, apaśyat ity anudāttam //
