source_id: KASIKA-6.1.86
locator:
  sutra: 6.1.86
witness_text:
  sutra: ṣatva-tukor asiddhaḥ
  commentary: ṣatve tuki ca kartavye ekadeśo 'siddho bhavati, siddhakāryaṃ na karoti
    ity arthaḥ  / asiddhavacanam ādeśalakṣaṇapratiṣedhartham, utsargalakṣaṇabhāvārthaṃ
    ca  / ko 'sicat ity atra eṅaḥ padāntādati (*6,1.109) iti ekādeśasya paraṃ pratyādivadbhāvāt
    apadāder iṇa uttarasya ādeśasya sakārasya ṣatvaṃ prāpnoti, tadasiddhatvān na bhavati  /
    ko 'sya, yo 'sya, ko 'smai, yo 'smai ity ekādeśasya asiddhatvāt iṇaḥ iti ṣatvaṃ
    na bhavati  / tugvidhau - adhītya, preta ity atra+ekādeśasya asiddhatvāt hrasvasya
    piti kṛti tuk (*6,1.71) iti tug bhavati  / samprasāranaṅīṭsu pratiṣedho vaktavyaḥ  /
    [#619] samprasāraṇe - brahmahūṣu  / samprasāraṇapūrvatvasya asiddhatvāt ṣatvaṃ
    na prāpnoti  / ṅau - vṛkṣe cchatram, vṛkṣe chatram  / iṭi - apace cchatram, apace
    chatram  / ādguṇasya asiddhatvād hrasvalakṣaṇo nityo 'tra tuk prāpnoti, dīrghāt,
    padāntād vā (*6,1.76) iti tugnikalpa iṣyate //
