source_id: KASIKA-2.3.29
locator:
  sutra: 2.3.29
witness_text:
  sutra: anya-ārād-itara-rte-dik-śabda-añcu-uttarapada-aj-āhi-yukte
  commentary: anya ārāt itara ṛte dik-śabda añcu-uttarapada āc āhi ity etair yoge
    pañcamī vibhaktir bhavati  / anya ity artha-grahanam  / tena paryāya-prayoge 'pi
    bhavati  / anyodevadattāt  / bhinno devadattāt  / artha-antaraṃ devadattāt  /
    [#140] vilakṣaṇe devadattāt  / ārāc-chabdo dūrāntika-arthe vartate  / tatra dūrāntikārthaiḥ
    ṣaṣthy-anyatarasyām (*2,3.34)  / iti prāpte pañcamī vidhīyate  / ārād devadattāt  /
    ārād yajñadattāt  / itara iti nirdiśyamāna-pratiyogī padārtha ucyate  / itaro
    devadattāt  / ṛte iti avyayaṃ varjana-arthe  / ṛte devadattāt  / ṛte yajñadattāt  /
    dik-śabdaḥ -- pūrvo grāmāt parvataḥ  / uttaro grāmāt  / pūrvo grīṣmāt vasantaḥ  /
    uttaro grīṣmo vasantāt  / dvik-śabda ity atra śabda-grahanaṃ deśakālavṛttinā 'pi
    dik-śabdena yoge yathā syāt, itarathā hi dig-vṛttinaiva syāt, ityamasyāḥ pūrvā
    iti  / iha tu na syāt, ayam asmāt pūrvaḥ kālaḥ iti  / añcu-uttarapada -- prāg
    grāmāt  / pratyag grāmāt  / nanu cāyam api dik-śabda eva  / ṣaṣṭhy-atasartha-prayayena
    (*2,3.30) iti vakṣyati, tasya ayaṃ purastādapakarṣaḥ  / āc -- dakṣiṇā grāmāt  /
    uttarā grāmāt  / āhi - dakṣiṇāhi grāmāt  / uttarāhi grāmāt //
