locator:
  sutra: 8.2.89
witness_text:
  sutra: praṇavaṣ ṭeḥ
  commentary: yajñakarmaṇi iti vartate  / yajñakarmaṇi teḥ praṇavaḥ ādeśo bhavati  /
    ka eṣa praṇavo nāma ? pādasya vā ardharcasya vā antyam akṣaram upasaṃgṛhya tadādyakṣaraśeṣasya
    sthāne trimātramokāram oṅkāraṃ vā vidadhati taṃ praṇava ity ācakṣate  / apāṃ retāṃsi
    jinvato3m  / devān jigāti sumnyo3m  / ṭigrahaṇaṃ sarvadeśartham  / okāraḥ sarvādeśo
    yathā syāt, vyañjanānte antyasya mā bhūt iti  / yajñakarmaṇi ity eva, āpaṃ retāṃsi
    jinvati // [#932]
