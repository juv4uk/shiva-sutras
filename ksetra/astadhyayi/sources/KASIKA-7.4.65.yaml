source_id: KASIKA-7.4.65
locator:
  sutra: 7.4.65
witness_text:
  sutra: dādharti-dardharti-dardharṣi-bobhūtu-tetikte 'larṣy-āpanīphaṇat-saṃsaniṣyadat-karikrat-kanikradat-bharibhrad-davidhvato-davidyutat-taritrataḥ-sarīsṛpataṃ-varīvṛjan-marmṛjya-āganīganti
    iti ca
  commentary: dādharti dardharti dardharṣi bobhūtu tetikate alarṣi āpanīphaṇat saṃsaniṣyadat
    karikrat kanikradat bharibhrat davidhvataḥ davidyutat taritrataḥ sarisṛpatam varīvṛjat
    marmṛjya āganīganti ity etāni aṣṭādaśa chandasi viṣaye nipātyante  / dādharti
    dardharti dardharṣi iti dhārayateḥ, dhṛṅo vā ślau yaṅluki vā abhyāsasya dīrghatvaṃ
    ṇilopaś ca  / dādharti  / evaṃ dardharti  / ślau ruk abhyāsasya nipātyate  / tathā
    dardharṣi iti  / atra ca yallakṣaṇena anupapannaṃ tat sarvaṃ nipātanāt siddham  /
    bobhūtu iti bhavateḥ yaṅlugantasya loṭi guṇābhāvo nipātyate  / naitad asti prayojanam,
    atra bhūsuvostiṅi (*7,3.88) iti guṇābhāvaḥ siddhaḥ ? jñāpanārthaṃ tarhi nipātanam
    etat  / jñāpayati, anyatra yaṅlugantasya guṇapratiṣedho na bhavati iti  / bobhoti,
    bobhavīti  / tetikte - tijeḥ yaṅlugantasya ātmanepadaṃ nipātyate  / yaṅo ṅittvāt
    pratyayalakṣaṇena ātmanepadaṃ siddham eva ? jñāpanārthaṃ tu ātmanepadanipātanam,
    anyatra yaṅlugantād ātmanepadaṃ na bhavati  / alarṣi iti - iyarteḥ laṭi sipi abhyāsasya
    halādiḥ śeṣāpavādo rephasya latvaṃ nipātyate  / sipā nirdeśo 'tantram, tipyapi
    dṛśyate alarti dakṣaḥ  / āpanīphaṇat iti - phaṇater āṅpūrvasya yaṅlugantasya śatari
    abhyāsasya nīk nipātyate  / saṃsaniṣyadat iti - syandeḥ saṃpūrvasya yaṅluk, śataryeva
    abhyāsasya nik, dhātusakārasya ṣatvaṃ nipātyate  / na cāsya sampūrvatā tantram,
    anyatra api hi dṛśyate, āsaniṣyadat iti  / karikrat iti - karoteḥ yaṅlugantasya
    śatari cutvabhyāvaḥ, abhyāsakakārasya rigāgamo nipātyate  / kanikradat iti - krandeḥ
    luṅi cleḥ aṅādeśaḥ, dvirvacanam abhyāsasya, cutvābhāvaḥ, nigāgamaś ca nipātyate  /
    tathā cāsya hi vivaraṇaṃ kṛtam  / akrandīt iti bhāṣāyām  / bharibhrat iti - bibharteḥ
    yaṅlugantasya śatari bhṛñām it (*7,4.76) iti itvābhāvo jaśtvābhāvo 'bhyāsasya
    rigāgamaḥ nipātyate  / davidhvataḥ iti - dhvarateḥ yaṅlugantasya śatari jasi rūpam
    etat  / atra abhyāsasya vigāgamaḥ ṛkāralopaś ca nipātyate  / davidhvato raśmayaḥ
    sūryasya  / [#874] davidyutat iti - dyuteḥ yaṅlugantasya śatari abhyāsasya amprasāraṇābhāvaḥ
    attvam, vigāgamaś ca nipātyate  / taritrataḥ iti - tarateḥ śatari ślau ṣaṣṭhyekavacane
    abhyāsasya rigāgamaḥ nipātyate  / sarīsṛpatam iti - sṛpeḥ śatari ślau dvitīyaikavacane
    abhyāsasya rīgāgamaḥ nipātyate  / varīvṛjat iti - vṛjeḥ śatari ślau rīgāgamaḥ
    nipātyate abhyāsasya  / marmṛjya iti - mṛjeḥ liṭi ṇali abhyāsasya rugāgamaḥ dhātoś
    ca yugāgamo nipātyate  / tato mṛjer vṛddhiḥ (*7,2.114) na bhavati, alaghūpadhatvāt  /
    laghūpadhaguṇe prāpte vṛddhir ārabhyate  / āganīganti iti - āṅpūrvasya gamerlati
    ślau abhyāsasya cutvābhāvaḥ nīgāgamaś ca nipātyate  / vakṣyantī vedāganīganti
    karṇam  / itikaraṇam evaṃ prakāraṇām anyeṣām apy upasaṅgrahārtham //
