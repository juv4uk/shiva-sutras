locator:
  sutra: 4.3.88
witness_text:
  sutra: śiśukranda-yamasabha-dvandva-indrajanana-ādibhyaś chaḥ
  commentary: tad ity eva, adhikṛtya kṛte granthe iti ca  / śiśukranda-ādibhyo dvitiyā-samarthebhyaḥ
    chaḥ pratyayo bhavati adhikṛtya kṛte granthe  / aṇo 'pavādaḥ  / śiśūnāṃ krandanaṃ
    śiśukrandaḥ, tam adhikṛtya kṛto granthaḥ śiśukrandīyaḥ  / yamasya sabhā yamasabham,
    yamasabhīyaḥ  / dvandvāt - indrajananīyam  / pradyumnāgamanīyam  / indrajananādirākṛtigaṇaḥ
    prayogato 'nusartavyaḥ, prātipadikeṣu na paṭhyate  / dvandve devāsurādibhyaḥ pratiṣedhaḥ  /
    daivāsuram  / rākṣo 'suram  / gauṇamukhyam  / indrajanāder ākṛtigaṇatvāt śiśukrandādayo
    'pi tatra+eva draṣṭavyāḥ  / prapañca-artham eṣāṃ grahaṇam  / evaṃ sati devāsurādi-pratiṣedho
    'pi na vaktavyaḥ, tataś cha-pratyayasya adarśanāt // [#419]
