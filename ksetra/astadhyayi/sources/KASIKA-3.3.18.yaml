source_id: KASIKA-3.3.18
locator:
  sutra: 3.3.18
witness_text:
  sutra: bhāve
  commentary: bhāve vācye dhātoḥ ghañ pratyayo bhavati  / pākaḥ  / tyāgaḥ  / rāgaḥ  /
    kriyāsāmānyavācī bhavatiḥ  / tena artha-nirdeśaḥ kriyamāṇaḥ sarvadhātu-viṣayaḥ
    kṛto bhavati  / dhātv-arthaś ca dhātunā+eva+ucyate  / yastasya siddhatā nāma dharmaḥ
    tatra ghañ-ādayaḥ pratyayāḥ vidhīyante  / puṃliṅga-ekavacanaṃ ca atra na tantraṃ,
    liṅgāntare vacanāntare 'pi ca atra pratyayā bhavanty eva  / paktiḥ, pacanam, pākau,
    pākāḥ iti //
