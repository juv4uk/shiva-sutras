  sutra: 2.2.22
witness_text:
  sutra: ktvā ca
  commentary: amā+eva iti pūrvayoge 'nuvṛttam  / tena anyatra na prāpnoti iti vacanam
    ārabhyate  / ktvāpratyayena saha tṛtīyā-prabhṛtīni upapadāny anyatarasyāṃ samasyante,
    tatpuruṣaś ca samāso bhavati  / uccaiḥ kṛtya  / uccaiḥ kṛtvā  / avyaye 'yathābhipreta-ākhyāne
    (*3,4.59) iti ktvāpratyayaḥ  / samāsapakṣe lyab eva  / tṛtīyā-prabhṛtīnīty eva,
    alaṃ kṛtvā  / khalu kṛtvā // [#125]
