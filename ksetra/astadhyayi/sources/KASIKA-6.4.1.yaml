source_id: KASIKA-6.4.1
locator:
  sutra: 6.4.1
witness_text:
  sutra: aṅgasya
  commentary: adhikāro 'yam āsaptamādhyāyaparisamāpteḥ  / yad ita ūrdhvam anukramiṣyāmaḥ
    aṅgasya ity evaṃ tad veditavyam  / vakṣyati - halaḥ (*6,4.2) - hūtaḥ  / jīnaḥ  /
    saṃvītaḥ  / aṅgasya iti kim ? nirutam  / durutam  / nāmi dīrghaḥ (*6,4.6) - agnīnām  /
    vāyūnām  / aṅgasya iti kim ? krimiṇāṃ paśya  / pāmanāṃ paśya  / ato bhisa ais
    (*7,1.9) - vṛkṣaiḥ  / plakṣaiḥ  / aṅgasya iti kim ? brāhmaṇabhissā  / odanabhissiṭā  /
    aṅgādhikāraḥ kṛto 'nyārtho nāmi dīrghatvādyapi vyavasthāpayati iti tadartham arthavadgrahaṇaparibhāṣā
    nāśrayitavyā bhavati  / aṅgasya iti sambandhasāmānye eṣā ṣaṣṭhī yathāyogaṃ viśeṣeṣu
    avatiṣṭhate  / atha vā prātipadikārthamātram avivakṣitavibhaktyartham adhikriyate  /
    tat uttaratra yathāyogaṃ vipariṇamyate  / tato 'kārāntād aṅgāt bhisa ais ity evam
    ādy api samyak sampannaṃ bhavati //
