source_id: KASIKA-6.4.24
locator:
  sutra: 6.4.24
witness_text:
  sutra: aniditāṃ hala upadhāyāḥ kṅiti
  commentary: aniditām aṅgānāṃ halantānām upadhāyāḥ nakārasya lopo bhavati kṅiti pratyaye
    parataḥ  / srastaḥ  / dhvastaḥ  / srasyate  / dhvasyate  / sanīsrasyate  / danīdhvasyate  /
    aniditām iti kim ? nandyate  / nānandyate  / halaḥ iti kim ? nīyate  / nenīyate  /
    upadhāyāḥ iti kim ? nahyate  / nānahyate  / kṅiti iti kim ? sraṃsitā  / dhvaṃsitā  /
    aniditāṃ nalope laṅgikampyor upatāpaśarīravikārayor upasaṅkhyānaṃ kartavyam  /
    vilagitaḥ  / vikapitaḥ  / upatāpaśarīravikārayoḥ iti kim ? vilaṅgitaḥ  / vikampitaḥ  /
    rañjerṇau mṛgaramaṇa upasaṅkhyānaṃ kartavyam  / rajayati mṛgān  / janījṝṣknasurañjo
    'mantāś ca iti mittvād upadhāhrasvatvam  / mṛgaramaṇa iti kim ? rañjayati vastrāṇi  /
    ghinuṇi ca rañjer upasaṅkhyānaṃ kartavyam  / rāgī  / tyajarajabhaja iti nipātanād
    vā siddham  / rajakarajanarajaḥsūpasaṅkhyānaṃ kartavyam  / rajakaḥ  / rajanam  /
    rajaḥ // [#738]
