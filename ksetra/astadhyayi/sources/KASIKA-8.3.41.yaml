source_id: KASIKA-8.3.41
locator:
  sutra: 8.3.41
witness_text:
  sutra: id-ud-upadhasya ca apratyayasya
  commentary: ikāropadhasya ukāropadhasya ca apratyayasya visarjanīyasya ṣakāra ādeśo
    bhavati kupvoḥ parataḥ  / nirdurbahirāviścaturprādus  / nis - niṣkṛtam  / niṣpītam  /
    dus - duṣkṛtam  / duṣpītam  / vahis - bahiṣkṛtam  / bahiṣpītam  / āvis - āviṣkṛtam  /
    āviṣpītam  / catur - catuṣkṛtam  / catuṣkapālam  / catuṣkalam  / catuṣkaṇṭakam  /
    prādus - prāduṣkṛtam  / prāudṣpītam  / apratyayasya iti kim ? agniḥ karoti  /
    vāyuḥ karoti  / mātuḥ karoti, pituḥ karoti, atra rāt sasya (*8,2.24) iti sakāralope
    kṛte rephasya yo visarjanīyaḥ, tasya apratyayavisarjanīyatvāt ṣatvaṃ prāpnoti
    ? kaskādiṣu tu mrātuṣputragrahaṇaṃ jñāpakam ekādeśanimittatvāt ṣatvapratiṣedhasya  /
    pummuhusoḥ pratiṣedho vaktavyaḥ  / puṃskāmā  / muhuḥ kāmā  / naiṣkulyam  / dauṣkulyam  /
    dauṣpuruṣyam  / ni3ṣkulam  / du3ṣkulam  / du3ṣpuruṣaḥ  / bahiraṅgalakṣaṇayor vṛddhiplutayor
    asiddhatvāt ṣatvaṃ pravartate //
