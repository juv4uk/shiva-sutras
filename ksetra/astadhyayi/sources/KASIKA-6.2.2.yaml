source_id: KASIKA-6.2.2
locator:
  sutra: 6.2.2
witness_text:
  sutra: tatpuruṣe tulyārtha-tṛtīyā-saptamy-upamāna-avyaya-dvitīyā-kṛtyāḥ
  commentary: tatpuruṣe samāse tulyārthaṃ tṛtīyāntaṃ saptamyantam upamānavāci avyayaṃ
    dvitīyāntaṃ kṛtyāntaṃ ca yat pūrvapadaṃ tat prakṛtisvaraṃ bhavati  / tulyārtha
    - tulyārtha - tulyaśvetaḥ  / tulyalohitaḥ  / tulyamahān  / sadṛkśvetaḥ  / sadṛśamahān  /
    ete kṛtya-tulya-ākhyā ajātyā (*2,1.68) iti karmadharayāḥ  / tatra tulyaśabdaḥ
    yato 'nāvaḥ (*6,1.213) ity ādyudāttaḥ  / sadṛkśabdaḥ samānānyayoś ca iti kvinpratyayāntaḥ,
    kṛduttarapadaprakṛtisvareṇa antodāttaḥ  / sadṛśaśabdo 'pi kañanto madhyodāttaḥ  /
    tulyārtha  / tṛtīyā - śaṅkulayā khaṇḍaḥ śaṅkulākhaṇḍaḥ  / kiriṇā kāṇaḥ kirikāṇaḥ  /
    śaṅkupūrvāl lāteḥ ghañarthe kavidhānam iti vā kapratyayāntaḥ śaṅkulāśabdo 'ntodāttaḥ  /
    kiriśabdo 'pi kirateḥ kṝgṝśṝpṝkuṭi bhidicchidibhyaś ca iti ikārapratyayaḥ kidauṇādikaḥ,
    tena asāvantodāttaḥ  / tṛtīyā  / saptamī - akṣeṣu śauṇḍaḥ akṣaśauṇḍaḥ  / pānaśauṇḍaḥ  /
    aśerdevane iti sapratyayānto 'kṣaśabdo 'ntodāttaḥ  / pānaśabdo lyuḍanto litsvareṇa
    ādyudāttaḥ  / saptamī  / [#653] upamāna - śastrīśyāmā  / kumudaśyenī  / haṃsagadgadā  /
    nyagrodhaparimaṇḍalā  / dūrvākāṇḍaśyāmā  / śarakāṇḍagaurī  / upamānāni sāmānyavacanaiḥ
    (*2,1.55) iti samāsaḥ  / śastrīśabdo ṅīṣpratyayānto 'ntodāttaḥ  / kumudaśabdo
    'pi kau modate iti mūlavibhujāditvāt kapratyayāntaḥ, nabviṣayasya anisantasya
    iti vā ādyudāttaḥ  / haṃsaśabdo vṝtṝvidihanikamikaśibhyaḥ saḥ iti sapratyayantaḥ  /
    nyagrohati iti nyagrodhaḥ, pacāditvād acpratyayāntaḥ tasya nyagrodhasya ca kevalasya
    (*7,3.5) iti nipātanād hakārasya dhakāro madhyodāttatvaṃ ca  / dūrvākāṇḍaśarakāṇḍaśabdau
    ṣaṣṭhītatpuruṣāv uttarapadādyudātau  / upamāna  / avyaya - abrāhmaṇaḥ  / avṛṣalaḥ  /
    kubrāhmaṇaḥ  / kuvṛṣalaḥ  / niṣkauśāmbiḥ  / nirvārāṇasiḥ  / atikhaṭvaḥ  / atimālaḥ  /
    etāny avyayāny ādyudāttāni  / avyaye nañkunipātānām iti vaktavyam  / iha mā bhūt,
    snatvākālakaḥ iti  / avyaya  / dvitīyā - muhūrtasukham  / muhūrtaramaṇīyam  /
    sarvarātrakalyāṇī  / sarvarātraśībhanā  / atyantasaṃyoge ca (*2,2.21) iti dvitīyāsamasaḥ  /
    muhūrtaśabdaḥ pṛṣodarādir antodāttaḥ  / sarvarātraśabdo 'py acpratyayāntaḥ  /
    dvitīyā  / kṛtya - bhojyoṣṇam  / bhojyalavaṇam  / pānīyaśītam  / haraṇīyacūrṇam  /
    bhojyaśabdo ṇyadanto 'ntasvaritaḥ  / pāṇīyaharaṇīyaśabdayoḥ upottamaṃ riti (*6,1.217)
    iti īkāra udāttaḥ //
