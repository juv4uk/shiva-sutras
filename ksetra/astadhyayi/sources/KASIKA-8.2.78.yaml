source_id: KASIKA-8.2.78
locator:
  sutra: 8.2.78
witness_text:
  sutra: upadhāyāṃ ca
  commentary: hali iti anuvartate  / dhātoḥ upadhābhūtau yau rephavakārau halparau
    tayoḥ upadhāyāḥ iko dīrgho bhavati hurcchā - hūrcchitā  / murcchā - mūrchitā  /
    urvī - ūrvitā  / dhurvī - dhūrvitā  / hali ity eva, ciri, jiri - ciriṇoti  / jiriṇoti  /
    iha kasmān na bhavati, rī gatau riryatuḥ, riryuḥ, vī gatyādiṣu vivyatuḥ vivyuḥ
    iti ? yaṇādeśasya sthānivattvāt asiddhatvāc ca bahiraṅgalakṣaṇatvena halparau
    rephavakārau na bhavataḥ  / caturyitā ity atra api bahiraṅgalakṣaṇatvāt ato lopasya
    dhātoḥ upadhābhūto repho na bhavati  / pratidīvnā ity atra tu hali ca (*8,2.77)
    iti dīrghatvam, dīrghavidhau lopājādeśasya sthānivad bhāvapratiṣedhāt  / asiddhaṃ
    bahiraṅgamantaraṅge ity etat tu nāśrayitavyam  / uṇādayo 'vyutpannāni prātipadikāni
    iti jivriḥ, karyoḥ, giryoḥ ity evam ādiṣu dīrgho na bhavati // [#929]
