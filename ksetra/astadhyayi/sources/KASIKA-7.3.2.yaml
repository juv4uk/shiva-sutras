locator:
  sutra: 7.3.2
witness_text:
  sutra: kekaya-mitrayu-pralayānāṃ ya-āder iyaḥ
  commentary: kekaya mitrayu pralaya ity eteṣāṃ yakārādeḥ iya ity ayam ādeśo bhavati
    taddhite ñiti, ṇiti, kiti ca parataḥ  / kekayasya apatyam kaikeyaḥ  / janapadaśabdāt
    kṣatriyād añ (*4,1.168) iti añ pratyayaḥ  / mitrayubhāvena ślāghate maitreyikayā
    ślāghate  / gotra-caraṇāc chlāghā-atyākāra-tadaveteṣu (*5,1.134) iti vuñ  / laukikaṃ
    hi tatra gotraṃ gṛhyate  / loke ca ṛṣiśabdo gotram ity abhidhīyate  / pralaya
    - pralayāt āgatam prāleyam udakam //
