source_id: KASIKA-2.4.12
locator:
  sutra: 2.4.12
witness_text:
  sutra: vibhāṣā vṛkṣa-mṛga-tṛṇa-dhānya-vyañjana-paśu-śakuny-aśvavaḍava-pūrvāpara-adharottarāṇām
  commentary: vṛkṣa mṛga tṛṇa dhanya vyañjana paśu śakuni aśvavaḍava pūrvāpara adharottara
    ity eteṣām dvandvo vibhāṣā ekavad bhavati  / plakṣanyagrodham, plakṣanyagrodhāḥ  /
    rurupṛṣatam, rurupṛṣatāḥ  / kuśakāśam, kuśakāśāḥ  / vrīhiyavam, vrīhiyavāḥ  /
    dadhighṛtam, dadhighṛte  / gomahiṣam, gomahiṣāḥ  / tittirikapiñjalam, tittirikapiñjalāḥ  /
    aśvavaḍavam, aśvavaḍavau  / pūrvāparam, pūrvāpre  / adharottaram, adharottare  /
    bahuprakṛtiḥ phalasenāvanaspatimṛgaśakunikṣudrajantudhānyatṛṇānām  / eṣāṃ bahuprakṛtir
    eva dvandva ekavad bhavati, na dviprakṛtiḥ  / badarāmalake  / rathikāśvārohau  /
    plakṣanyagrodhau  / rurupṛṣatau  / haṃsacakravākau  / yūkālikṣe vrīhiyavau  /
    kuśakāśau //
