source_id: KASIKA-4.3.105
locator:
  sutra: 4.3.105
witness_text:
  sutra: purāṇa-prokteṣu brāhmaṇa-kalpeṣu
  commentary: pratyayārtha-viśeṣaṇam etat  / tṛtīyā-samarthāt prokte ṇiniḥ pratyayo
    bhavati yat proktaṃ purāṇa-proktāś ced brāhmaṇa-kalpās te bhavanti  / purāṇena
    cirantanena muninā proktāḥ  / brāhmaṇeṣu tāvat - bhāllavinaḥ  / śāṭyāyaninaḥ  /
    aitareyiṇaḥ  / kalpeṣu - paiṅgī kalpaḥ  / āruṇaparājī  / purāṇa-prokteṣu iti kim
    ? yājñavalkāni brāhmaṇāni  / āśmarathaḥ kalpaḥ yājñavalkyādayo 'cirakālā ity ākhyāneṣu
    vārtā  / tathā vyavaharati sūtrakāraḥ  / tadviṣayatā kasmān na bhavati ? pratipadaṃ
    brāhmaṇesu yaḥ pratyayas tasya tadviṣayatā vidhīyate ṇineḥ  / ayaṃ tu yājñavalkya-śabdasya
    kaṇvādiṣu pāṭhādaṇ  / na vā 'yaṃ yogaś chando 'dhikāram anuvartayati, tena kalpeṣv
    api na bhavati  / purāṇa iti nipātanāt tuḍ abhāvaḥ  / na vā+atyantabādhaiva, tena
    purātanam ity api bhavati //
