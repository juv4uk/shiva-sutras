source_id: KASIKA-3.1.123
locator:
  sutra: 3.1.123
witness_text:
  sutra: chandasi niṣṭarkya-devahūya-praṇīya-unnīya-ucchiṣya-marya-starya-dhvarya-khanya-khānya-devayajyā-āpṛcchya-pratiṣīvya-brahmavādya-bhāvya-stāvya-upacāyyapṛḍāni
  commentary: niṣṭarkya-ādayaḥ śabdāś chandasi viṣaye nipātyante  / yad iha lakṣaṇena
    anupapannaṃ tat sarvaṃ nipātanāt siddham  / niṣṭarkyaḥ iti kṛtī chedane ity asmān
    nispūrvāt kyapi prāpte ṇyat, ādyanta-viparyayaś ca, nisaś ca ṣatvaṃ nipātyate  /
    niṣṭarkyaṃ cinvīta paśukāmaḥ  / devaśabde upapade hvayater juhoter vā kyap, dīrghastugabhāvaś
    ca  / deva-hūyaḥ  / prapūrvād utpūrvāc ca nayateḥ kyap  / [#204] praṇīyaḥ  / unnīyaḥ  /
    utpūrvāc chiṣeḥ kyap  / ucchiṣyaḥ  / mṛṅ prāṇatyāge, stṛñ ācchandane, dhvṛ hūrcchane,
    etebhyo yat pratyayaḥ  / maryaḥ  / staryā  / striyām eva nipātanam  / dhvaryaḥ  /
    khaneryat  / khanyā  / etasmād eva ṇyat  / khānyaḥ  / devaśabde upapade yajeryat  /
    devayajyā  / strīliṅga-nipātanam  / āṅpūrvāt pṛccheḥ kyap  / āpṛcchyaḥ  / pratipūrvat
    sīvyateḥ kyap ṣatvam ca  / pratiṣīvyaḥ  / brahmaṇyupapade vader ṇyat  / brahamavādyam  /
    bhavateḥ stauteś ca ṇyat, āvadeśaś ca bhavati  / bhāvyam  / stāvyaḥ  / upapūrvasya
    cinoteḥ ṇyadāyādeśau  / upacāyyapṛḍam  / pṛḍe cottarapade nipātanametat  / hiraṇya
    iti vaktavyam  / hiraṇyād anyatra upaceyapṛḍam eva  / niṣṭarkye vyatyayaṃ vidyān
    nisaḥ ṣatvaṃ nipātanāt  / ṇyadāyādeśa ity etāv upacāyye nipātatau // ṇyadekasmāc
    caturghyaḥ kyap caturbhyaś ca yato vidhiḥ  / ṇyadekasmād ya-śabdaś ca dvau kyapau
    ṇyadvidhiś catuḥ //
