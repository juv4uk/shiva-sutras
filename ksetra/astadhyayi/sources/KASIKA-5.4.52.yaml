source_id: KASIKA-5.4.52
locator:
  sutra: 5.4.52
witness_text:
  sutra: vibhāṣā sāti kārtsnye
  commentary: abhūtatadbhāve kṛbhvastiyoge sampadyakartari iti sarvam anuvartate  /
    asmin viṣaye vibhāṣa sātiḥ prayayo bhavati kārtsnye gamyamāne  / yadi prakrtiḥ
    kṛtsnāṃ vikārātmatāmāpadyate ity arthaḥ  / agnisādbhavati śastram, agnībhavati
    śastram  / udakasādbhavati, udakībhavati lavaṇam  / kārtsnye iti kim ? ekadeśena
    paṭaḥ śuklībhavati  / vibhāṣāgrahaṇam cveḥ prāpakam  / pratyayavikalpas tu mahāvibhāṣaya+eva
    siddhaḥ //
