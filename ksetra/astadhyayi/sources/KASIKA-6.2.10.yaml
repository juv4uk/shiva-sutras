source_id: KASIKA-6.2.10
locator:
  sutra: 6.2.10
witness_text:
  sutra: adhvaryu-kaṣāyayor jātau
  commentary: adhvaryu kaṣāya ity etayoḥ jātivācini tatpuruṣe samāse pūrvapadaṃ prakṛtisvaraṃ
    bhavati  / prācyādhvaryuḥ  / kaṭhādvaryuḥ  / kalāpādhvaryuḥ  / ete samānādhikaraṇasamāsāḥ
    jātivācino niyataviṣayāḥ  / tatra prācyaśabdaḥ yatpratyayānta ādyudāttaḥ  / kaṭhaśabdaḥ
    pacādyaci vyutpāditaḥ  / tataḥ kaṭhena proktam iti vaiśampāyana-antevāsibhyaś
    ca (*4,3.104) iti ṇiniḥ, tasya kaṭha-carakāl luk (*4,3.107) iti luk  / kalāpinā
    proktam iti kalāpino 'ṇ (*4,3.108), tasmin in aṇy anapatye (*6,4.164) iti prakṛtibhāve
    prāpte nāntasya ṭilope sabrahmacāripīṭhasarpikalāpikauthumitaitilijājalila. aṅgaliśilāliśikhaṇḍisūkarasadmasuparvaṇām
    upasaṅkhyānam iti ṭilopaḥ  / tad evaṃ kalāpaśabdo 'ntodāttaḥ  / sarpirmaṇḍakaṣāyam  /
    umāpuṣpakaṣāyam  / dauvārikakaṣāyam  / ṣaṣṭhīsamāsavyutpāditā rūḍhiśabdā ete  /
    tatra sarpirmaṇḍaśabdaḥ umāpuṣpaśabdaś ca ṣaṣṭhīsamāsābandodāttau  / dauvārikaśabdo
    'pi dvāri niyuktaḥ iti ṭhaki satyantodāttaḥ eva  / jātau iti kim ? paramādhvaryuḥ  /
    paramakaṣāyaḥ //
