witness_text:
  sutra: vyan sapatne
  commentary: sapatna-śabdaḥ śatruparyāyaḥ śabda-antara-vyutpannam eva  / saptnī-śabdād
    apare 'kāram iva arthe nipātayanti  / saptnīva sapatnaḥ  / bhrātṛ-śabdād vyan
    pratyayo bhavati samudāyena ca+idam itraḥ sapatna ucyate  / apatya-artho 'tra
    na asty eva  / pāpmanā bhrātṛvyeṇa  / bhrātṛvyaḥ kaṇṭakaḥ //
