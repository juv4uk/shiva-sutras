source_id: KASIKA-1.2.21
locator:
  sutra: 1.2.21
witness_text:
  sutra: udupadhād bhāva-ādikarmaṇor anyatarasyām
  commentary: niṣṭhā seṇ na kit iti vartate  / udupadhād dhātoḥ paro bhāve ādikarmaṇi
    ca vartamāno niṣṭhā-pratyayaḥ seḍ-anyatarasyāṃ na kid bhavati  / dyutitatmanena,
    dyotitamanena  / pradyutitaḥ, pradyotitaḥ muditamanena, moditamanena  / pramuditaḥ,
    pramoditaḥ  / udupadhāt iti kim ? likhitamanena  / bhāva-ādikarmaṇoḥ iti kim?
    rucitaṃ kārṣāpaṇaṃ dadāti  / seṭ ity eva  / prabhukta odanaḥ  / vyavasthita-vibhāṣā
    ca-iyam  / tena śab-vikaraṇānām eva bhavati  / gudha pariveṣṭane, gudhitam ity
    atra na bhavati //
