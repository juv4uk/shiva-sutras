source_id: KASIKA-5.1.9
locator:
  sutra: 5.1.9
witness_text:
  sutra: ātman-viśvajana-bhoga-uttarapadāt khaḥ
  commentary: ātman viśvajana ity etābhyāṃ bhogottarapadāc ca prātipadikāt khaḥ pratyayo
    bhavati tasmai hitam ity etasmin viṣaye  / chasya apavādaḥ  / ātmann iti nalopo
    na kṛtaḥ prakṛti-parimāṇa-jñāpana-artham  / tena+uttarapada-grahaṇam bhoga-śabdena+eva
    sambadhyate, na tu pratyekam  / ātmane hitam ātmanīnam  / ātma-adhvānau khe (*6,4.169)
    iti prakṛtibhāvaḥ  / viśvajanebhyo hitam viśvajanīnam  / karmadhārayād eva+iṣyate  /
    ṣaṣṭhī-samāsād bahuvrīheś ca cha eva bhavati  / viśvajanāya hitam viśvajanīyam  /
    pañcajanādupasaṅkhyānam  / pañcajanāc ca khaḥ  / atra api karmadhārayād iṣyate  /
    pañcajanīnam  / anyatra pañcajanīyam  / sarvajānāṭ ṭhañ khaś ca  / sārvajanikam,
    sarvajanīnam  / atra api karmadhārayād eva  / sarvajanīyam anyatra  / mahājanānnityaṃ
    ṭhañ vaktavyaḥ  / mahājanāya hitam māhājanikam  / tatpuruṣād eva  / bahuvrīhes
    tu cha eva bhavati  / mahājanīyam  / bhogottarapadāt khalv api - mātṛbhogīṇaḥ  /
    pitṛbhogīṇaḥ  / bhoga-śabdaḥ śarīra-vācī  / kevalebhyo mātrādibhyaḥ cha eva bhavati  /
    mātrīyam  / pitiriyam  / rājācāryābhyāṃ tu nityam  / bhogottarapadābhyam eva khaḥ
    pratyayaḥ iṣyate, na kevalābhyām  / rājabhogīnaḥ  / ācāryādaṇatvaṃ ca  / ācāryabhogīnaḥ  /
    kevalābhyāṃ vākyam eva bhavati, rājñe hitam, ācāryāya hitam iti // [#468]
