source_id: KASIKA-6.1.37
locator:
  sutra: 6.1.37
witness_text:
  sutra: na samprasāraṇe samprasāraṇam
  commentary: samprasārane parataḥ pūrvasya yaṇaḥ samprasāraṇaṃ na bhavati  / vyadha
    - viddhaḥ  / vyaca - vicitaḥ  / vyeñ - saṃvītaḥ  / ekayogalakṣanam api samprasāraṇam
    ata eva vacanāt prathamaṃ parasya yaṇaḥ kriyate, pūrvasya ca prasaktaṃ pratiṣidhyate  /
    samprasāraṇam iti vartamāne punaḥ samprasāranagrahaṇaṃ videśasthasya api samprasāraṇasya
    pratiṣedho yathā syāt iti  / śva-yuva-maghonām ataddhite (*6,4.133) - yūnaḥ  /
    yūnā  / samprasāraṇagrahaṇasāmarthyāt eva pūrvasya pratiṣedhe vaktavye svarṇadīrghatvam
    ekādeśo na sthānivad bhavati  / sati vā sthānivattve vyavadhānametāvadāśrayiṣyate  /
    ṛci trer uttarapadād ilopaś chandasi  / ṛci parataḥ treḥ samprasāraṇam bhavati
    uttarapadād ilopaś ca chandasi viṣaye  / tisra ṛcaḥ yasmin tat tṛcaṃ sūktam  /
    tṛcaṃ sāma  / ṛkpūrabdhūḥpathāmānakṣe (*5,4.74) iti samāsāntaḥ  / chandasi ti
    kim ? tyṛcaṃ karma  / rayermatau bahulam  / rayiśabdasya chandasi viṣaye matau
    parato bahulaṃ samprasāraṇaṃ bhavati  / ā revānetu no viśaḥ  / na ca bhavati  /
    rayimān puṣṭivardhanaḥ // [#607]
