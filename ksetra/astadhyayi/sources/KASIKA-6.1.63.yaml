source_id: KASIKA-6.1.63
locator:
  sutra: 6.1.63
witness_text:
  sutra: pad-dan-no-mās-hṛn-niś-asan-yūṣan-doṣan-yakañ-chakann-udann-āsañ chasprabhṛtiṣu
  commentary: pāda danta nāsikā māsa hṛdaya niśā asṛj yūṣa doṣa yakṛt śakṛt udaka
    āsana ity eteṣāṃ śabdānāṃ sthāne śasprabhṛtipratyayeṣu parataḥ pad dat nas mās
    hṛd niś asan yūṣan doṣan yakan śakan udan āsan ity ete ādeśāḥ yathāsaṅkhyaṃ bhavanti  /
    pad - nipadaścaturo jahi  / padā vartaya goduham  / pādaḥ pat (*6,4.130)  / dat
    - yā dato dhāvate tasyai śyāvadan  / nas - sūkarastvā khanannasā  / mās - māsi
    tvā paśyāmi cakṣuṣā  / hṛd - hṛdā pūtaṃ manasā jātavedo  / niś - amāvāsyāyāṃ niśi
    yajet  / asan - asikto 'snā 'varohati  / yūṣan - yā pātrāṇi yūṣṇa āsecanāni  /
    doṣan - yatte doṣṇo daurbhāgyam  / yakan - yakno 'vadyati  / śakan - śakno 'vadyati  /
    udan - udno divyasya no dehi  / āsan - āsani kiṃ labhe madhūni  / śasprabhṛtiṣu
    iti kim ? pādau te pratipīḍyau  / nāsike te kṛśe  / kecid atra chandasi ity anuvartayanti  /
    apare punar aviśeṣeṇa+icchanti  / tathā hi bhāṣāyām api padādayaḥ śabdāḥ prayujyante  /
    vyāyāmakṣuṇṇagātrasya padbhyāmudvartitasya ca  / vyādhayo na+upasarpanti vainateryāmavoragāḥ
    // ity evam ādayaḥ  / anyatarasyām ity etad anuvartayanti  / tena pādādayo 'pi
    prayujyante  / śasprabhṛtiṣu iti prakārārthe prabhṛtiśabda iti śalā doṣaṇī ity
    atra api doṣannādeśo bhavati  / padādiṣu māṃspṛtsnūnām upasaṅkhyānam  / māṃsa
    pṛtanā sānu ity eteṣāṃ sthāne yathāsaṅkhyam māṃs pṛt snu ity ete ādeśāḥ bhavanti  /
    māṃspacanyā ukhāyāḥ  / māṃsapacanyā iti prāpte  / pṛtsu martyam  / pṛtanāsu martyam
    iti prāpte  / na te divo na pṛthivyā adhisnuṣu  / adhisānuṣu iti prāpte  / [#613]
    nas nāsikāyā yattaskṣudreṣu  / nāsikāyā nasbhāvo vaktavyaḥ yat tas kṣudra ity
    eteṣu parataḥ  / nasyam  / nastaḥ  / naḥkṣuḥ  / yati varṇanagarayor na+iti vaktavyam  /
    nāsikyo varṇaḥ  / nāsikyaṃ nagaraṃ //
