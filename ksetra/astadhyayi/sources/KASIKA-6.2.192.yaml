witness_text:
  sutra: ner anidhāne
  commentary: neḥ paramuttarapadam antodāttaṃ bhavati anidhāne  / nidhānam aprakāśatā  /
    animūlam nyakṣam  / nitṛṇam  / bahuvrīhir ayaṃ prādisamāso vā  / avyayībhāve tu
    samāsāntodāttatvena+eva siddham  / anidhāne iti kim ? nivāgvṛṣalaḥ  / nidaṇḍaḥ  /
    nihitavāk, nihitadaṇḍaḥ ity arthaḥ  / niśabdo 'tra nidhānārthaṃ bravīti  / pradayo
    hi vṛttiviṣaye sasādhanāṃ kriyāmāhuḥ // [#698]
