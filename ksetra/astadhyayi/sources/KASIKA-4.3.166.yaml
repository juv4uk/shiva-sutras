source_id: KASIKA-4.3.166
locator:
  sutra: 4.3.166
witness_text:
  sutra: lup ca
  commentary: vā ity eva  / jambvāḥ phale 'bhidheye pratyayasya vā lup bhavati  /
    yuktavadbhāve viśeṣaḥ  / jambvāḥ phalam jambūḥ phalam, jambu phalam, jāmbavam
    iti vā  / lup-prakaraṇe pahla-pākaśuṣām upasaṅkhyānam  / vrīhayaḥ  / yavāḥ  /
    māṣāḥ  / mudgāḥ  / tilāḥ  / puṣpamūlesu bahulam  / mallikāyāḥ puṣpam mallikā  /
    navamallikā jātiḥ  / bidāryāḥ mūlaṃ bidārī  / aṃśumatī  / bṛhatī  / na ca bhavati  /
    pāṭalāni puṣpāṇi  / śālvāni mūlani  / bahulavacanāt kvacid anyad api bhavati,
    kadambaṃ puṣpam, aśokam, karavīram, bailvāni phalāni iti //
