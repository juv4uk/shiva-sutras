source_id: KASIKA-2.3.73
locator:
  sutra: 2.3.73
witness_text:
  sutra: caturthī ca āśiṣy āyuṣya-madra-bhadra-kuśala-sukha-artha-hitaiḥ
  commentary: āśiṣi gayamānāyām āyuṣya madra bhadra kuśala sukha artha hita ity etair
    yoge caturthī vibhaktir bhavati  / cakāro vikalpa-anukarṣaṇa-arthaḥ  / śeṣe caturthī-vidhānāt
    tayā mukte ṣaṣṭhī vibhaktir bhavati  / atra āyuṣya-ādīnāṃ paryāya-grahaṇaṃ kartavyam  /
    āyuṣyaṃ devadattāya bhūyāt, āyuṣyaṃ devadattasya bhūyāt  / ciraṃ jīvitaṃ devadattāya
    devadattasya vā bhuyāt  / [#152] madraṃ devadattāya devadattasya vā bhūyāt  /
    bhadraṃ devadattāya, bhadraṃ devadattasya  / kuśalaṃ devadattāya, kuśalaṃ devadattasya  /
    nirāmayaṃ devadatāya, nirāmayaṃ devadattasya  / sukhaṃ devadattāya, sukhaṃ devadattasya  /
    śaṃ devadattāya, śaṃ devadattasya  / artho devadattāya, artho devadattasya  /
    prayojanaṃ devadattāya, prayojanaṃ devadattasya  / hitaṃ devadatāya, hitaṃ devadattasya  /
    pathyaṃ devadattāya, pathyaṃ devadattasya  / āśiṣi iti kim ? āyuṣyaṃ devadattasya
    tapaḥ // iti śrījayādityaviracitāyāṃ kāśikāyāṃ vṛttau dvitīyādhyāyasya tṛtīyaḥ
    pādaḥ // dvitīyādhyāyasya caturthaḥ pādaḥ  / [#153]
