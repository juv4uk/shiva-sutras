witness_text:
  sutra: ay ām-anta-ālv-āyya-itnv-iṣṇuṣu
  commentary: ām anta ālu āyya itnu iṣṇu ity eteṣu parataḥ ṇeḥ ayādeśo bhavati  /
    kārayañcakāra  / hārayājcakāra  / anta - gaṇḍayantaḥ  / maṇḍayantaḥ  / ālu - spṛhayāluḥ  /
    gṛhayāluḥ  / āyya - spṛhayāyyaḥ  / gṛhayāyyaḥ  / itnu - stanayitnuḥ  / iṣṇu -
    poṣayiṣṇuḥ  / pārayiṣṇavaḥ  / na iti vaktavye ayādeśavacanam uttarārtham //
