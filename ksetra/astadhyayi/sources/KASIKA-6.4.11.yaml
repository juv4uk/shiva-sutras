source_id: KASIKA-6.4.11
locator:
  sutra: 6.4.11
witness_text:
  sutra: ap-tṛn-tṛc-svasṛ-naptṛ-neṣṭṛ-tvaṣṭṛ-kṣattṛ-hotṛ-potṛ-praśāstṝṇām
  commentary: ap ity etasya, tṛnantasya, tṛjantasya, svasṛ naptṛ neṣṭṛ tvaṣtṛ kṣattṛ
    hotṛ potṛ paśāstṛ ity eteṣāṃ cāṅgānām upadhāyā dīrgho bhavati sarvanāmasthāne
    parato 'sambuddhau  / ap - āpaḥ  / bahvāmpi taḍāgāni iti kecid icchanti, tatra
    samāsānto vidhiranityaḥ iti samāsānto na kriyate  / nityam api ca numamakṛtva
    dīrghatvam iṣyate  / tṛn - kartārau kaṭān  / vaditārau janāpavādān  / kartāraḥ  /
    tṛc - kartārau kaṭasya  / kartāraḥ  / hartārau bhārasya  / hartāraḥ  / svasṛ -
    svasā, svasārau, svasāraḥ  / naptṛ - naptā, naptārau, naptāraḥ  / neṣṭṛ - neṣṭā,
    neṣṭārau, neṣṭāraḥ  / tvaṣṭṛ - tvaṣṭā, tvaṣṭārau, tvaṣṭāraḥ  / kṣattṛ - kṣattā,
    kṣattārau, kṣattāraḥ  / hotṛ - hotā, hotārau, hotāraḥ  / potṛ - potā, potārau,
    potāraḥ  / praśāstṛ - praśāstā, praśāstārau, praśāstāraḥ  / naptrādināṃ grahaṇamavyutpattipakṣe
    vidhyartham  / vyutpattipakṣe niyamārtham, evam bhūtānām anyeṣāṃ sañjñāśabdānāṃ
    dīrgho mā bhūt iti  / pitarau, pitaraḥ  / mātarau,mātaraḥ  / asambuddhau iti kim
    ? he kartaḥ  / he svasaḥ //
