source_id: KASIKA-1.2.57
locator:
  sutra: 1.2.57
witness_text:
  sutra: kāla-upasarjane ca tulyam
  commentary: aśiṣyam iti vartate  / kāla-upasarjane ca aśiṣye  / kasmāt ? arthasya
    anyapramāṇatvāt  / tulya-śabdo hetv-anukarṣaṇa-arthaḥ  / aśiṣya-viśeṣaṇaṃ ca-itat  /
    kāla-upasarjane ca tulyam aśiṣye bhavataḥ  / iha anye vaiyākaraṇāḥ kāla-upasarjanayoḥ
    paribhāṣāṃ kurvanti  / ānyāyyād utthānād ānyāyyāc ca saṃveśanāt, eṣo 'dyatanaḥ
    kālaḥ  / apare punar āhuḥ  / aharubhayato 'rdharātram , eṣo 'dyatanaḥ kālaḥ iti  /
    tathā+upasarjana-paribhāṣāṃ kurvanti apradhānam upasarjanam iti  / tat pāṇinir
    ācāryaḥ pratyācaṣṭe lokato 'rthavagateḥ  / yairapi vyākaraṇam na śrutaṃ te 'py
    āhur idam asmābhir adya kartavyam idaṃ śvaḥ kartavyam idam hayaḥ kṛtam iti  /
    na-ivaṃ vyutpādyante  / tathā-upasarjanam, vayamatra gṛhe grāme vā upasarjanam
    apradhānam iti gamyate  / yśca lokato 'rthaḥ siddhaḥ kiṃ tatra yatnena  / yady
    evaṃ pūrvasūtra eva kāla-upasarjana-grahaṇam kasmān na kriyate ? kimartho yogavibhāgaḥ
    ? pradarśanārthaḥ  / anyad apy evaṃ jātīyakamaśiṣyam iti  / tathā ca pūrvācāryāḥ
    paribhaṣante matvarthe bahuvrīhiḥ, pūrvapada-artha-pradhāno 'vyayībhāvaḥ, uttarapada-artha-pradhānas
    tatpuruṣah, ubhayapadārtha-pradhāno dvandvaḥ ity evam ādi, tad-aśiṣyam iti //
    [#47]
