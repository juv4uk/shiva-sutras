source_id: KASIKA-4.1.89
locator:
  sutra: 4.1.89
witness_text:
  sutra: gotre 'lug-aci
  commentary: prāgdīvyataḥ ity eva  / yaskādibhyo gotre (*2,4.63)  / ity ādinā yeṣāṃ
    gotrapratyayānāṃ lug uktaḥ, teṣāmajādau prāgdīvyatīye viśayabhūte pratiṣidhyate  /
    gargāṇām chātrāḥ gārgīyāḥ  / vātsīyāḥ  / ātreyīyāḥ  / khārapāyaṇīyāḥ  / gotre
    iti kim ? kaubalam  / bādaram  / aci iti kim ? gargebhya āgatam gargarūpyam  /
    gargamayam  / prāgdīvyataḥ ity eva, gargebhyo hi tam gārgīyam  / gotrasya bahuṣu
    lopino bahuvacanāntasya pravṛttau dvyekayor aluk  / bidānām apatyaṃ yuvā, yuvānau
    baidaḥ, baidau  / vaida-śabdāt ataḥ iñ kṛte tasya ca iñaḥ ṇya-kṣatriya-ārṣa-ñito
    yūni lug-aṇ-iñoḥ (*2,4.58) iti luki rūpam  / ekavacana-dvivacana-antasya pravṛttau
    bahuṣu lopo yūni, baidasya baidayor vā apatyaṃ bahavo māṇavakāḥ bidāḥ  / nahyatrāṇ
    bahuṣūtpannaḥ //
