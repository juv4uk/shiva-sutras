witness_text:
  sutra: bilva-ādibhyo 'ṇ
  commentary: bilva ity evam ādibhyo 'ṇ pratyayo bhavati vikāra-avayavayor arthayoḥ  /
    yathāyogam añmayaṭor apavādaḥ  / bilvasya vikāro 'vayavo vā bailvaḥ  / gavedhukā-śabdo
    'tra paṭhyate, tataḥ kopadhāt eva siddhe mayaḍbādhanārthaṃ grahaṇam  / vilva  /
    vrīhi  / kāṇḍa  / mudag  / masūra  / godhūma  / ikṣu  / veṇu  / gavedhukā  / karpāsī  /
    pāṭalī  / karkandhū  / kuṭīra  / bilvādiḥ // [#430]
