source_id: KASIKA-4.3.66
locator:
  sutra: 4.3.66
witness_text:
  sutra: tasya vyākhyāna iti ca vyākhyātavyanāmnaḥ
  commentary: vyākhyāyate 'nena iti vyākhyānaṃ, vyākhyātavyasya nāma vyākhyātavyanāma  /
    tasya iti ṣaṣṭhīsamarthāt vyākhayātavyanāmnaḥ prātipadikād vyākhyāne 'bhidheye
    yathāvihitaṃ pratyayo bhavati tatra bhave ca  / vākyārthasamīpe cakāraḥ śrūyamāṇaḥ
    pūrvavākhya-artham eva samuccinoti tatra bhava (*4,3.53) iti  / [#414] supāṃ vyākhyānaḥ
    saupo granthaḥ  / taiṅaḥ  / kārttaḥ  / supsu bhavaṃ saupam  / taiṅam  / kārtam  /
    vyākhyātavyanāmnaḥ iti kim ? pātaliputrasya vyākhyānī sukośalā, pāṭaliputraḥ sukośalayā
    vyākhyāyate, evaṃ saṃniveśaṃ pāṭaliputram iti, na tu pāṭaliputro vyākhyātavyanāma  /
    bhavavyākhyānayor yugapadadhikāro 'pavādavidhānārthaḥ  / kṛta-nirdeśau hi tau
    //
