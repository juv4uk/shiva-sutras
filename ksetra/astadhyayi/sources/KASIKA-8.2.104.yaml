source_id: KASIKA-8.2.104
locator:
  sutra: 8.2.104
witness_text:
  sutra: kṣiyā-āśīḥ-praiṣeṣu tiṅ ākāṅkṣam
  commentary: svaritaḥ iti vartate  / kṣiyā ācarabhedaḥ, āśīḥ prārthanāviśeṣaḥ, śabdena
    vyāpāraṇam praiṣaḥ, eteṣu gamyamāneṣu tiṅantam ākāṅkṣaṇaṃ yat tasya svaritaḥ pluto
    bhavati  / ākāṅkṣati iti ākāṅkṣam, tiṅantam uttarapadam ākāṅkṣati ity arthaḥ  /
    kṣiyāyāṃ tāvat - svayaṃ rathena yāti3, upādhyāyaṃ padātiṃ gamayati iti  / svayam
    odanaṃ ha bhuṅkte3, upādhyāyaṃ saktūn pāyayati  / pūrvam atra tiṅantam uttarapadam
    ākāṅkṣati iti sākāṅkṣaṃ bhavati  / āśiṣi - sutāṃś ca lapsīṣṭa3 dhanaṃ ca tāta  /
    chando 'dhyeṣīṣṭa3 vyākaraṇam ca bhadra  / praiṣe - kaṭaṃ kuru3 grāmaṃ ca gaccha  /
    yavān lunīhi3 saktūṃś ca piba  / ākāṅkṣam iti kim ? dīrghaṃ te āyurastu  / agnīn
    vihara //
