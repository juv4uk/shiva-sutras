source_id: KASIKA-5.4.139
locator:
  sutra: 5.4.139
witness_text:
  sutra: kumbhapadīṣu ca
  commentary: kumbhapadīprabhṛtayaḥ kṛtapādalopāḥ samudāyā eva paṭhyante  / tatra
    evaṃ sūtram jñeyam  / pādasya lopo bhavati kumbhapadyādiviṣaye yathā kumbhapadyādayaḥ  /
    sidhyanti  / samudāyapāṭhasya ca prayojanaṃ viṣayaniyamaḥ - striyām eva, tatra
    ṅīppratyaye eva, na anyadā  / kumbhapadī  / śatapadī  / yac ca iha upamānapūrvaṃ
    saṅkhyāpūrvaṃ ca paṭhyate, tasya siddhe lope nityaṅībarthaṃ vacanam  / pādo 'nyatarasyām
    (*4,1.8) iti vikaopo na bhavati  / [#590] kumbhapadī  / śatapadī  / aṣṭāpadī  /
    jālapadī  / ekapadī  / mālāpadī  / munipadī  / godhāpadī  / gopadī  / kalaśīpadī  /
    ghṛtapadī  / dāsīpadī  / niṣpadī  / ārdrapadī  / kuṇapadī  / kṛṣṇapadī  / droṇapadī  /
    drupadī  / śakṛtpadī  / sūpapadī  / pajcapadī  / arvapadī  / stanapadī  / kumbhapadyādiḥ
    //
