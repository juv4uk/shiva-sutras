source_id: KASIKA-7.2.18
locator:
  sutra: 7.2.18
witness_text:
  sutra: kṣubdha-svānta-dhvānta-lagna-mliṣṭa-viribdha-phāṇṭa-bāḍhāni mantha-manas-tamaḥ-sakta-avispaṣṭa-svara-anāyāsa-bhṛśeṣu
  commentary: kṣubdha svānta dhvānta lagan mliṣṭa viribdha phāṇṭa bāḍha ity ete nipātyante
    yathāsaṅkhyaṃ mantha manaḥ tamaḥ sakta avispaṣṭa svaraḥ anāyāsa bhṛśa ity eteṣv
    artheṣu  / kṣubdha iti bhavati manthābhidhānaṃ cet  / kṣubdho manthaḥ  / kṣubhitam
    anyat  / [#805] kṣubhitaṃ manthena  / kṣubdhā girinadī ity evam ādyupamānāt bhaviṣyati  /
    svāntam iti mano 'bhidhānaṃ cet  / svanitam anyata  / svanito mṛdaṅgaḥ  / svanitaṃ
    manasā  / dhvāntam iti bhavati tamo 'bhidhānaṃ cet  / dhvanitam anyat  / dhvanito
    mṛdaṅgaḥ  / dhvanitaṃ tamasā  / lagnam iti bhavati saktaṃ cet  / lagitamanyat  /
    mliṣṭam iti bhavati avispaṣṭaṃ cet  / mlecchitam anyat  / itvam apy ekārasya nipātanād
    eva viribdham iti svaraś cet  / virebhitam anyat  / rebhṛ śabde ity asya+etan
    nipātanam  / anye tu viribhitam anyat iti paṭhanti  / rabhiṃ sautraṃ dhātuṃ paṭhanti,
    te viribhitam iti pratyudāharanti  / phāṇṭam iti bhavati anāyāsaś cet  / phāṇitam
    anyat  / yadaśṛtamapiṣṭaṃ ca kaṣāyamudakasamparkamātrāt vibhaktarasamīṣaduṣṇaṃ
    tat phāṇṭam  / tadalpaprayatnasādhyatvādanāyāsena lakṣyate  / bāḍham iti bhavati
    bhṛśaṃ cet  / bāhitam anyat  / bāhṛ prayatne ity asya dhātor etan nipātanam  /
    atiśayaś ca bhṛśam iha+ucyate //
