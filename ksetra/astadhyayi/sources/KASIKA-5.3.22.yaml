source_id: KASIKA-5.3.22
locator:
  sutra: 5.3.22
witness_text:
  sutra: sadyaḥ parut parāry-auṣamaḥ paredyavy-adya-pūrvedyur-anyedyur-anyataredyur-itaredyur-aparedyur-adharedyur-ubhayedyur-uttaredyuḥ
  commentary: sptamyāḥ iti kāle iti ca vartate  / sadyaḥ-prabhṛtayaḥ śabdāḥ nipātyante  /
    prakṛtiḥ, pratyayaḥ, ādeśaḥ, kālaviśeṣaḥ iti sarvam etan nipātanāl labhyate  /
    samānasya sabhāvo nipātyate dyaś ca pratyayaḥ ahany abhidheye  / samāne 'hani
    sadyaḥ  / pūrvapūrvatarayoḥ parabhāvo nipātyate udārī ca pratyayau saṃvatsare
    'bhidheye  / pūrvasmin saṃvatsare parut  / pūrvatare saṃvatsare parārī  / idama
    iśbhāvaḥ samasaṇ pratyayaḥ nipātyate saṃvatsare 'bhidheye  / asmin saṃvatsare
    aiṣamaḥ  / parasmād edyavi pratyayo 'hani  / parasminn ahani paredyavi  / idamo
    'śbhāvo dyaś ca pratyayo 'hani  / asminn ahani adya  / pūrva-anya. anyatara-itara-apara-addhara-ubhaya-uttarebhya
    edyus pratyayo nipātyate ahanyabhidheye  / pūrvasminn ahani pūrvedyuḥ  / anyasminn
    ahani anyedyuḥ  / anyatarasminn ahani anyataredyuḥ  / itarasminn ahani itaredyuḥ  /
    aparasminn ahani aparedyuḥ  / adharasminn ahani adharedyuḥ  / ubhayor ahnoḥ ubhayedyuḥ  /
    uttarasminn ahani uttaredyuḥ  / dyuś ca+ubhayād vaktavyaḥ  / ubhayadyuḥ // [#536]
