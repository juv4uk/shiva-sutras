source_id: KASIKA-4.1.22
locator:
  sutra: 4.1.22
witness_text:
  sutra: aparimāṇa-bista-ācita-kambalyebhyo na taddhitaluki
  commentary: pūrveṇa ṅīp prāptaḥ pratiṣidhyate  / aparimāṇa-antāt dvigoḥ bista-ācitakambaly-āntāc
    ca taddhitaluki sati ṅīp pratyayo na bhavati  / bastādīnāṃ parimāṇa-arthaṃ grahaṇam  /
    sarvato mānaṃ parimāṇam  / aparimāṇa-antāt tāvat - pañcabhir aśvaiḥ krītā pañcāśvā  /
    daśāśvā  / kālaḥ ca saṅkhyā na parimāṇam  / dvivarṣā trivarṣā  / dvābhyāṃ śatābhyāṃ
    krītā dviśatā  / triśatā  / bistādibhyaḥ - dvibastā  / tribastā  / dvyācitā  /
    tryācitā  / dvikambalyā  / trikambalyā  / aparimāṇa+iti kim ? dvyāḍhakī  / tryāḍhakī  /
    taddhitaluki iti kim ? samāhāre - pañcāśvī  / daśāśvī // [#324]
