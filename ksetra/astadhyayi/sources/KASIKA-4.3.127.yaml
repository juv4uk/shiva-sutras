source_id: KASIKA-4.3.127
locator:
  sutra: 4.3.127
witness_text:
  sutra: saṅgha-aṅka-lakṣaṇeṣv añ-yañ-iñām aṇ
  commentary: saṅgha-ādiṣu pratayārtha-viśeṣaṇeṣu añanatād, yañantād, iñantāc ca prātipadikād
    aṇ pratyayo bhavati tasya+idam ity etasmin viṣaye  / pūrvasya vuño 'pavādaḥ  /
    ghoṣa-grahaṇam atra kartavyam  / tena vaiṣamyād yathāsaṅkhyaṃ na bhavati  / añanatāt
    baidaḥ saṅghaḥ  / baidā 'ṅkaḥ  / baidam lakṣaṇam  / baido ghoṣaḥ  / yañantāt gārgaḥ
    saṅghaḥ  / gārgo 'ṅkaḥ  / gārgaṃ lakṣaṇam  / gārgo ghoṣaḥ  / iñantāt dākṣaḥ saṅghaḥ  /
    dākṣo 'ṅakaḥ  / dākṣaṃ lakṣaṇam  / dākṣo ghoṣaḥ  / aṅkalakṣaṇayoḥ ko viśeṣaḥ ?
    lakṣaṇaṃ lakṣyabhūtasya+eva cihnabhūtaṃ svaṃ yathā vidyā bidānām, aṅkastu gavādistho
    'pi gavādīnāṃ svaṃ na bhavati  / ṇitkaraṇaṃ ṅībarthaṃ puṃvadbhāva-pratiṣedha-arthaṃ
    ca  / vaidī vidyā asya vaidīvidyaḥ //
