    chāndasa  / chātra  / medhāvin  / abhirūpa  / āḍhya  / kulaputra  / śrotriya  /
    cora  / dhūrta  / vaiśvadeva  / yuvan  / grāmaputra  / grāmakhaṇḍa  / grāmakumāra  /
    amuṣyaputra  / amuṣyakula  / śatapatra  / kuśala  / manojñādiḥ //
