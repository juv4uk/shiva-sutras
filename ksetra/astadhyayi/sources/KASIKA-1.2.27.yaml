source_id: KASIKA-1.2.27
locator:
  sutra: 1.2.27
witness_text:
  sutra: ūkālo 'j-jhrasva-dīrgha-plutaḥ
  commentary: ū iti trayāṇām ayaṃ mātrika-dvimātrika-trimātrikāṇāṃ praśliṣṭa-nirdeśaḥ  /
    hrasva-dīrgha-plutaḥ iti dvandva-ikavad bhāve puṃlliṅga-nirdeśaḥ  / u ū ū3 ity
    evaṃ kālo aj yathā-kramaṃ hrasva-dīrgha-plutaḥ ity evaṃ sañjño bhavati  / ukālo
    hrasvaḥ - dadhi  / madhu  / ūkālo dīrghaḥ - kumārī  / gaurī  / ū3kālaḥ plutaḥ
    - devadatta3 atra nv-asi  / kāla-grahaṇaṃ parimāṇa-artham  / dīrgha-plutayoḥ hrasva-sañjñā
    mā bhūt  / ālūya, pralūya, hrasvasya piti kṛti tuk (*6,1.71) iti tuṅ na bhavati  /
    [#38] aj-grahaṇaṃ saṃyoga-ac-samudāya-nivṛtty-artham  / pratakṣya, prarakṣya,
    hrasvāśrayas tuṅ mā bhūt  / titaucchātram, dīrghāt (*6,1.75), padāntād vā (*6,1.76)
    iti vibhāṣā tuṅ mā bhūt  / hrasva-dīrgha-pluta-pradeśāḥ -- hrasvo napuṃsake prātipadikasya
    (*1,2.47)  / akṛt-sarvadhātukayor dīrghaḥ (*7,4.25)  / vākyasya ṭeḥ pluta udāttaḥ
    (*8,2.82) //
