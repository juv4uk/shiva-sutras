source_id: KASIKA-4.1.14
locator:
  sutra: 4.1.14
witness_text:
  sutra: anupasarjanāt
  commentary: adhikāro 'yam  / uttarasūtreṣu upasarjane pratiṣedhaṃ karoti  / yad
    iti ūrdhvam anukramiṣyāmo 'nupasarjanāt ity evaṃ tad veditavyam  / ṭiḍ-ḍha-aṇ-añ
    iti ṅīp  / kurucarī  / madracarī  / anupasarjanāt iti kim ? bahukurucarā, bahumadracarā
    madhurā  / jāteḥ iti ṅīṣ  / kukkuṭīi  / śūkarī  / anupasarjanāt iti kim ? bahukukkuṭā,
    bahuśūkarā madhurā  / kathaṃ punar upasarjanāt pratyayaprasṅgaḥ ? tad antavidhinā  /
    jñāpitaṃ ca+etad asty atra prakaraṇe tadantavidhiḥ iti  / tathā ca pradhānena
    tadanatavidhir bhavati  / kumbhakārī  / nagarakārī  / na ca aṇ iti kṛd-grahaṇaṃ,
    taddhito 'py aṇ asti //
