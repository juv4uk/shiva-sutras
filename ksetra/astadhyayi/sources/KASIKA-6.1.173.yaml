source_id: KASIKA-6.1.173
locator:
  sutra: 6.1.173
witness_text:
  sutra: śatur anumo nady-aj-ādī
  commentary: adntodāttāt iti vartate  / anum yaḥ śatṛpratyayas tadantāt parā nadī
    ajādir vibhaktir asarvanāmasthānam udāttā bhavati  / tudatī  / nudatī  / lunatī  /
    punatī  / tudatā  / lunatā  / punatā  / anumaḥ  / iti kim ? tudantī  / nudantī  /
    atra apy upadeśāt iti lasārvadhātukād anudāttatve ekādeśaḥ, tasya ekādeśa udāttena+udāttaḥ
    (*8,2.5) ity udāttatvam , tasya pūrvatra asiddhatvam na+iṣyate iti śatrantam antodāttaṃ
    bhavati  / nadyajādī iti kim ? tudadbhyām  / nudadbhyām  / tudadbhiḥ  / antodāttāt
    ity eva, dadatī  / dadhataḥ  / abhyastānām ādiḥ (*6,1.189) ity ādyudāttav etau  /
    bṛhanmahator upasaṅkhyānam  / bṛhatī  / mahatī  / bṛhatā  / mahatā //
