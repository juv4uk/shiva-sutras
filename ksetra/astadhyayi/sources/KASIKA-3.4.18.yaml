source_id: KASIKA-3.4.18
locator:
  sutra: 3.4.18
witness_text:
  sutra: alaṃ-khalvoḥ pratiṣedhayoḥ prācāṃ ktvā
  commentary: chandasi bhāva-lakṣaṇe iti sarvaṃ nivṛttam  / alam khalu ity etayoḥ
    pratiṣedha-vācinor upapadayoḥ dhātoḥ ktvā pratyayo bhavati prācām ācāryāṇāṃ matena  /
    alaṃ kṛtvā  / khalu kṛtvā  / alaṃ bāle ruditvā  / alaṃ-khalvoḥ iti kim ? mā kārṣīḥ  /
    pratiṣedhayoḥ iti kim ? alaṅkāraḥ  / prācāṃ-grahaṇaṃ vikalpa-artham  / alaṃ rodanena  /
    vāsarūpavidhiś cet pūja-artham //
