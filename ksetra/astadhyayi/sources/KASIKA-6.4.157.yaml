source_id: KASIKA-6.4.157
locator:
  sutra: 6.4.157
witness_text:
  sutra: priya-sthira-sphira-uru-bahula-guru-vṛddha-tṛpra-dīrgha-vṛndārakāṇāṃ pra-stha-spha-var-baṃhi-gar-varṣi-trab-drāghi-vṛndāḥ
  commentary: priya sthira sphira uru bahula guru vṛddha tṛpra dīrgha vṛndāraka ity
    eteṣāṃ pra stha spha var baṃhi gar varṣi trap drādhi vṛnda ity ete yathāsaṅkhyam
    ādeśā bhavanti iṣṭhemeyassu parataḥ  / priya - preṣṭhaḥ  / premā  / preyān  /
    sthira - stheṣṭhaḥ  / stheyān  / sphira - spheṣṭhaḥ  / spheyān  / uru - variṣṭhaḥ  /
    varimā  / varīyān  / bahula - baṃhiṣṭhaḥ  / baṃhimā  / baṃhīyān  / guru - gariṣthaḥ  /
    garimā  / garīyān  / vṛddha - yarṣiṣṭhaḥ  / varṣīyān  / tṛpra - trapiṣṭhaḥ  /
    trapīyān  / dīrgha - drādhiṣṭhaḥ  / drādhimā  / drādhīyān  / vṛndāraka - vṛndiṣṭhaḥ  /
    vṛndīyān  / priyorugurubahuladīrghāḥ pṛthvādiṣu paṭhyante, tena anyeṣāmimanij
    na bhavati iti nodāhriyate // [#768]
