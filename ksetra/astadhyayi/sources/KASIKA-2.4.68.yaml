source_id: KASIKA-2.4.68
locator:
  sutra: 2.4.68
witness_text:
  sutra: tika-kitava-ādibhyo dvandve
  commentary: tika-ādibhyaḥ kitava-ādibhyaś ca dvandve gotrapratyayasya bahuṣu lug
    bhavati  / taikāyanayaś ca kaitavāyanayaś ca, tika-ādibhyaḥ phiñ (*4,1.158), tasya
    luk, tika-kitavāḥ  / vāṅkharayaś ca bhānḍīrathayaś ca, ata iñ (*4,1.95), tasya
    luk, vaṅkharabhaṇḍīrathāḥ  / aupakāyanāś ca lāmakāyanāś ca, naḍādibhyaḥ phak (*4,1.99),
    tasya luk, upakalamakāḥ  / pāphakayaś ca nārakayaś ca, ata iñ (*4,1.95), tasya
    luk, paphakanarakāḥ  / bākanakhayaś ca śvāgudapariṇaddhayaś ca, ata iñ (*4,1.95),
    tasya luk, bakanakhaśvagudapariṇaddhāḥ  / ubja-śabdāt ata iñ (*4,1.95), kakubha-śabdāt
    śivādibhyo 'n (*4,1.112) tayor luk, aubjayaś ca kākubhāś ca ubjakakubhāḥ  / lāṅkayaś
    ca śāntamukhayaś ca, ata iñ (*4,1.95) tasya luk, laṅkaśāntamukhāḥ  / urasaśabdastikādiṣu
    paṭhyate, tataḥ phiñ, laṅkaṭaśabdād iñ, tayor luk, aurasāyanaś ca lāṅkaṭayaś ca
    urasalaṅkaṭāḥ  / bhrāṣṭakayaś ca kāpiṣṭhalayaś ca, ata iñ (*4,1.95), tasya luk,
    bhraṣṭakakpiṣṭhalāḥ  / kārṣṇājinayaś ca kārṣṇasundarayaś ca, ata iñ (*4,1.95),
    tasya luk, kṛṣṇājinakṛṣṇasunadarāḥ  / āgniveśyaś ca dāserakayaś ca, agniveśaśabdāt
    gargādibhyo yañ (*4,1.105), dāserakaśabdāt ata iñ (*4,1.95), tayorluk, agniveśadāserakāḥ
    // [#171]
