source_id: KASIKA-8.2.12
locator:
  sutra: 8.2.12
witness_text:
  sutra: āsandīvad-aṣṭhīvac-cakrīvat-kakṣīvad-rumaṇvac-carmaṇvatī
  commentary: āsandīvat aṣṭhīvat cakrīvat kakṣīvat carmaṇvatī ity etāni sañjñāyāṃ
    nipātyante  / vattvaṃ pūrveṇa+eva siddham, ādeśāthāni nipātanāni  / āsandīvat
    iti āsanaśabdasya āsandībhāvo nipātyate  / āsandīvān grāmaḥ  / āsandīvadahisthalam  /
    āsanavān ity eva anyatra  / apare tu āhuḥ, āsandīśabdo 'pi prakṛtyantaram eva
    asti, tathā coktam, audumbarī rājāsandī bhavati iti  / tasya sañjñāyām (*8,2.11)
    iti vattvena siddham  / āsandīvat ity eta prapañcārtham iha paṭhyate  / aṣṭhīvat
    iti asthno 'ṣṭhībhāvaḥ  / aṣṭhīvān iti śarīraikadeśasañjñā  / asthimān ity eva
    anyatra  / cakrīvat iti cakraśabdasya cakrībhāvo nipātyate  / cakrīvān rājā  /
    cakravān ity eva anyatra  / cakrīvanti sado havirdhānāni bhavanti ity etat tu
    chāndasatvād anugantavyam  / kakṣīvat iti kakṣyāyāḥ samprasāraṇaṃ nipātyate  /
    kakṣīvān nāma ṛṣiḥ  / kakṣyāvān ity eva anyatra  / rumaṇvat iti lavaṇaśabdasya
    rumaṇbhāvo nipātyate  / lavaṇavān ity eva anyatra  / apare tu āhuḥ, ruman iti
    prakṛtyantaram asti, tasya etan nipātanaṃ nakāralopābhāvārtham, ṇatvārthaṃ ca  /
    mator vā nuḍartham iti  / carmaṇvatī iti carmaṇo nalopābhāvo ṇatvaṃ ca nipātyate  /
    mator vā nuḍāgamaḥ  / carmaṇvatī nāma nadī  / carmavatī ity eva anyatra //
