source_id: KASIKA-4.3.167
locator:
  sutra: 4.3.167
witness_text:
  sutra: harītaky-ādibhya śca
  commentary: harītakī ity evam ādibhyaḥ śabdebhyaḥ phale pratyayasya lub bhavati  /
    luki prāpte lupo vidhāne yuktavadbhāve strī-pratyayaśravaṇe ca viśeṣaḥ  / harītakyāḥ
    phalaṃ harītakī  / kośātakī  / nakharajanī  / atra ca vyaktir yuktavadbhāvena+iṣyate,
    vacanaṃ tv abhidheyavad eva bhavati  / harītakyāḥ phalāni harītakyaḥ  / harītakī  /
    kośātakī  / nakharajanī  / śaṣkaṇḍī  / dāḍī  / doḍī  / dīḍī  / śvetapākī  / arjunapākī  /
    kālā  / drākṣā  / dhvaṅkṣā  / gargarikā  / kaṇṭakārikā  / śephālikā  / yeṣāṃ ca
    phalapāka-nimittaḥ śoṣaḥ  / puṣpamuleṣu bahulam  / harītakyādiḥ //
