locator:
  sutra: 1.2.66
witness_text:
  sutra: ' strī puṃvac-ca'
  commentary: śeṣaḥ iti vartate, vṛddho yūnā iti ca sarvam strī vṛddhā yūnā sahavacane
    śiṣyate, tal-lakṣaṇaś ced-eva viśeṣo bhavati  / puṃsaḥ iva asyāḥ kāryaṃ bhavati  /
    stry-arthaḥ pum-arthavad bhavati  / gargī ca gargyāyaṇaś ca gārgyau  / vātsī ca
    vātsyāyanaś ca vātsyau  / dākṣī ca dākṣāyāṇaś ca dākṣī //
