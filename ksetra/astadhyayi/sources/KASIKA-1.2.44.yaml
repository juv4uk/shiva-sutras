source_id: KASIKA-1.2.44
locator:
  sutra: 1.2.44
witness_text:
  sutra: eka-vibhākti ca apūrva-nipāte
  commentary: eka vibhāktir yasya tad idam eka-vibhākti  / samāse vidhīyamāne yan
    niyata-vibhaktikaṃ, dvitīye sambandhini bahubhir-vibhaktibhir yujyamāne 'py ekayaiva
    vibhaktyā yujyate tad-upasarjana-sañjñaṃ bhavati apūrva-nipāte, pūrva-nipataṃ
    pūrva-nipāta-ākhyam upasarjana-kāryaṃ varjayitvā  / [#43] nirādayaḥ krānt-āady-arthe
    pañcamyā  / pūrva-pade nānāvibhaktike 'py uttarapadaṃ pañcmyantam eva bhavati  /
    niṣkrāntaḥ kauśāmbyā niṣkauśāmbiḥ  / niṣtrāntaṃ kauśāmbyā niṣkauśāmbim  / niṣkrāntena
    kauśāmbyā niṣkauśāmbinā  / niṣkrāntāya kauśāmbyā niṣkauśāmbaye  / niṣkrāntāt kauśāmbyā
    niṣkauśāmbeḥ  / niṣkrāntasya kauśāmbyā niṣkauśāmbeḥ  / niṣkrānte kauśāmbyā niṣkauśāmbau  /
    evaṃ nirvārāṇasiḥ  / ekavibhakti iti kim ? rājakumārī  / apūrva-nipāte iti kim
    ? na hi bhavati kauśāmbīniḥ iti //
