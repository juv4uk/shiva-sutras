source_id: KASIKA-6.1.13
locator:
  sutra: 6.1.13
witness_text:
  sutra: ṣyaṅaḥ samprasāraṇaṃ putra-patyos tatpuruṣe
  commentary: putra pati ity etasyor uttarapadayos tatpuruṣe samāse ṣyaṅaḥ saṃprasāraṇaṃ
    bhavati  / yaṇaḥ sthāne ig bhavati ity arthaḥ  / kārīṣagandhīputraḥ  / kāriṣagandhīpati  /
    kaumudagandhīputraḥ  / kaumudagandhīpatiḥ  / karīṣasya+iva gandho 'sya, kumudasya+iva
    gandho 'sya iti bahuvrīhiḥ, tatra upamānāc ca (*5,4.137) iti gandhasya+idantādeśaḥ  /
    karīṣagandheḥ apatyam ity aṇ, tadantāt striyām aṇ-iñor annarṣayor gurūpattamayoḥ
    ṣyaṅ gotre (*4,1.78) iti ṣyaṅ, tataś ca api vihite ṣaṣṭhīsamāsaḥ, samprasāraṇasya
    (*6,3.139) iti dīrghatvam  / ṣyaṅaḥ iti im ? bhyāputraḥ  / kṣatriyāputraḥ  / putrapatyoḥ
    iti kim ? kārīṣagandhyākulam  / kaumudagandhyākulam  / tatpuruṣe iti kim ? kārīṣagandhyā
    patir asya grāmasya kārīṣagandhyāpatiḥ ayaṃ grāmaḥ  / [#599] ṣyaṅaḥ iti strīpratyayagrahaṇaṃ
    na strīpratyaye cānupasarjane iti pratyayagrahaṇaparibhāṣayā yasmāt sa vihitaḥ
    tadādeḥ ity eṣa niyamo na asti, tena paramakārīṣagandhyāyāḥ putraḥ paramakārīṣagandhīputraḥ,
    paramakārīṣagandhīpatiḥ ity api bhavati  / [#598] upasarjane tu ṣyaṅi na bhavati  /
    atikrāntā kārīṣagandhyām atikārīṣagandhyā, tasya putraḥ atikārīṣagandhyāputraḥ  /
    atikārīṣagandhyāpati  / putrapatyoḥ kevalayoḥ uttarapadayoḥ idaṃ samprasāraṇaṃ,
    tadādau tadante ca na bhavati, kārīṣagandhyāputrakulam, kāriṣagandhyāparamaputraḥ
    iti  / ṣyaṅante ca yady apy anye yaṇaḥ santi, tathāpi ṣyaṅaḥ eva samprasāraṇaṃ,
    nirdiśyamānasya ādeśā bhavanti iti  / samprasāraṇam iti cādhikriyate vibhāṣā pareḥ
    (*6,1.44) iti yāvat // [#599]
