source_id: KASIKA-6.1.132
locator:
  sutra: 6.1.132
witness_text:
  sutra: etat-tadoḥ sulopo 'kor anañsamāse hali
  commentary: etattadau yāvakakārau nañsamāse na vartate tayor yaḥ suśabdaḥ, kaś ca
    tayoḥ suśabdaḥ ? yaḥ tadarthena sambaddhaḥ, tasya saṃhitāyāṃ viṣaye hali parato
    lopo bhavati  / eṣa dadāti  / sa dadāti  / eṣa bhuṅkte  / sa bhuṅkte  / etattadoḥ
    iti kiṃ ? yo dadāti  / yo bhuṅkte  / sugrahaṇaṃ kim ? etau gāvau carataḥ  / akoḥ
    iti kim ? eṣako dadāti  / sako dadāti  / tanmadhyapatitastadgrahaṇena gṛhyate
    iti rūpabhede 'pi sākackāvetattadāv eva bhavataḥ  / anañsamāse iti kim ? aneṣo
    dadāti  / aso dadāti  / uttarapadārthapradhānatvānnañsamāsasya etattador eva atra
    sambaddhaḥ suśabdaḥ  / hali iti kim ? eṣo 'tra so 'tra //
