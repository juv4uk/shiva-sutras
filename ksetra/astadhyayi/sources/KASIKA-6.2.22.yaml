source_id: KASIKA-6.2.22
locator:
  sutra: 6.2.22
witness_text:
  sutra: pūrve bhūtapūrve
  commentary: pūrvaśade uttarapade bhūtapūrvavācini tatpuruṣe samāse pūrvapadaṃ prakṛtisvaraṃ
    bhavati  / āḍhyo bhūtapūrvaḥ āḍhyapūrvaḥ  / pūrvaśabdo vṛttiviṣaye bhūtapūrve
    vartate, tatra viśeṣaṇaṃ viśeṣyeṇa iti samāsaḥ, mayūravyaṃsakādirvā draṣṭavyaḥ  /
    darśanīyapūrvaḥ  / sukumārapūrvaḥ  / bhūtapūrve iti kim ? paramapūrvaḥ  / uttamapūrvaḥ  /
    atra pramaścāsau pūrvaś ca iti samāso, na tu paramo bhūtapūrvaḥ iti  / tathā hi
    sati udāharaṇam eva bhavati //
