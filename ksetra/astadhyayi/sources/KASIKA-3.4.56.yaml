source_id: KASIKA-3.4.56
locator:
  sutra: 3.4.56
witness_text:
  sutra: viśi-pati-padi-skandām vyāpyamāna-āsevyamānayoḥ
  commentary: dvitīyāyām ity eva  / dvitīyānte upapade viśyādibhyo dhātubhyo ṇamul
    pratyayo bhavati, vyāpyamāne āsevyamāne ca arthe gamyamāne  / viśyādibhiḥ kriyābhir
    anavayavena padārthānāṃ sambandho vyāptiḥ  / tātparyam āsevā / dravye vyāptiḥ,
    kriyāyāmāsevā  / geha-anupraviśam āste  / samāsena vyāptyāsevayor uktatvāt nitya-vīpsayoḥ
    (*8,1.4) iti dvirvacanaṃ na bhavati  / asamāsapakṣe tu vyāpyamānatāyāṃ dravya-vacanasya
    dvirvacanam, āsevyamānatāyāṃ tu kriyā-vacanasya  / tathā ca vakṣyati - supsu vīpsa,
    tiṅkṣu nityatā iti  / gehaṃ geham anupraveśam āste  / āsevāyām - geham anupraveśam
    anupraveśam āste  / pati - geha-anuprapātam āste gehaṃ  geham anuprapātam āste,
    geham anuprapātam anuprapātam  āste  / padi - geha-anuprapādam āste, gehaṃ geham  anuprapādam,
    geham anuprapādam anuprapādam  / skandi -  geha-avaskandam āste, gehaṃ geham avaskandam,
    geham  avaskandam avaskandam  / vyāpyam ānāsevyamānayoḥ iti  kim ? geham anupraviśya
    bhuṅkte  / nanu ābhīkṣṇye ṇamul  vihita eva, āsevā ābhīkṣṇyam eva, kim arthaṃ
    punar  āsevāyāṃ ṇamul ucyate ? ktvānivṛtty-artham iti cet, na,  iṣṭatvāt tasya  /
    dvitīyopapada-arthaṃ tarhi vacanam,  upapadasamāsaḥ pakṣe yathā syāt  / tena hi
    sati  upapadābhāvaḥ //
