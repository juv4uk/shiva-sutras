source_id: KASIKA-6.4.149
locator:
  sutra: 6.4.149
witness_text:
  sutra: sūrya-tiṣya-agastya-matsyānāṃ ya upadhāyāḥ
  commentary: sūrya tisya agastya matsya ity eteṣāṃ yakārasya upadhāyāḥ bhasya lopo
    bhavati īti paratastaddhite ca  / sūryeṇaikadik saurī balākā  / aṇi yo yasya+iti
    lopaḥ tasya asiddhatvaṃ na asti, vyāśrayatvāt  / īkāre tu yastasyā - siddhatvād
    upadhāyakāro bhasyāṇantasya sūryasya sambandhī iti lupyate  / tiṣya taiṣmahaḥ  /
    taiṣī rātriḥ  / agastya - agastyasya apatyaṃ strī, ṛṣitvādaṇi kṛte āgastī  / āgastīyaḥ  /
    matsya - gaurāditvāt ṅīṣ, matsī  / upadhāyāḥ iti kim ? matsyacarī  / yagrahaṇam
    uttarārtham  / viṣayaparigaṇanam atra kartavyam  / [#765] matsyasya ṅyām iti vaktavyam  /
    iha mā bhūt, matsyasya+idaṃ māṃsaṃ mātsyam  / sūryāgastyayośche ca gyāṃ ca  /
    saurīyaḥ  / saurī  / āgastīyaḥ  / āgastī  / iha mā bhūt, sauryam caruṃ nirvapet  /
    āgastyaḥ  / tiṣyapuṣyayor nakṣatrāṇi  / tiṣyeṇa nakṣatreṇa yuktaḥ kālaḥ taiṣaḥ  /
    pauṣaḥ  / antikasya tasi kādilopa ādyudāttaṃ ca  / antikaśabdasya tasipratyaye
    parataḥ kakāradeḥ śabdasya lopaḥ, ādyudāttatvam ca  / antito na dūrāt  / tame
    tādeś ca  / tamapratyaye antikaśabdasya takārādeḥ kakārādeś ca lopo vaktavyaḥ  /
    tatra tādilope - antamaḥ  / kādilope - antitamaḥ  / kādilope bahulam iti vaktavyam  /
    anyatra api hi vṛśyate, antike sīdati iti antiṣat  / pūrvapadāt (*8,3.106) iti
    ṣatvam  / ye ca  / antiyaḥ //
