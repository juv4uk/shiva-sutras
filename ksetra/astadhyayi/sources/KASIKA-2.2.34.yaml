source_id: KASIKA-2.2.34
locator:
  sutra: 2.2.34
witness_text:
  sutra: alpa-ac-taram
  commentary: dvandve iti vartate  / alpāctaraṃ śabdarūpaṃ dvandve samāse pūrvaṃ prayoktavyam  /
    plakṣaś ca nyagrodhś ca plakṣa-nyagrodhau  / dhavakhadirapalāśāḥ  / bahuṣv aniyamaḥ
    - śaṅkhadundubhivīṇāḥ, vīṇāśaṅkhadundubhayaḥ  / ṛtunakṣtrāṇāmānupūrvyeṇa samānakṣarānāṃ
    pūrvanipāto vaktavyaḥ  / hemantaśiśiravasantāḥ  / citrāsvātī  / kṛttikārohiṇyau  /
    samānākṣarāṇām iti kim ? grīṣmavasantau  / laghv-akṣaraṃ pūrvaṃ nipatati iti vaktavyam  /
    kuśakāśam  / śaraśādam  / abhyarhitaṃ ca pūrvaṃ nipatati iti vaktavyam  / mātāpitarau  /
    śraddhamedhe  / dīkṣātapasī  / varṇānāmānupūrvyeṇa pūrvanipātaḥ  / brāhmaṇakṣatriyaviṭśūdrāḥ  /
    samānākṣarāṇām ity atra na asti  / bhrātuś ca jyāyasaḥ pūrvanipāto vaktavyaḥ  /
    yudhaṣṭhirārjunau  / saṅkhyāyā alpīyasyāḥ pūrvanipāto vaktavyaḥ  / dvitrāḥ  /
    tricaturāḥ  / navatiśatam //
