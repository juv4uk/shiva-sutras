witness_text:
  sutra: grāma-kauṭābhyāṃ ca takṣṇaḥ
  commentary: jātisañjñayoḥ iti na anuvartate  / grāmakauṭābhyāṃ paro yaḥ takṣanśabdaḥ
    tadantāt tatpuruṣāt ṭac pratyayo bhavati  / grāmasya takṣa grāmatakṣaḥ  / bahūnaṃ
    sādhāraṇaḥ ity arthaḥ  / kuṭyāṃ bhavaḥ kauṭaḥ, tasya takṣā kauṭatakṣaḥ  / svatantraḥ
    karmajīvī, na kasya cit pratibaddhaḥ ity arthaḥ  / grāmakāuṭābhyām iti kim ? rājatakṣā
    // [#581]
