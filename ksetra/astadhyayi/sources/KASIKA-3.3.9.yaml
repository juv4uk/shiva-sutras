source_id: KASIKA-3.3.9
locator:
  sutra: 3.3.9
witness_text:
  sutra: liṅ ca+ūrdhva-mauhūrtike
  commentary: bhaviṣyati, vibhāṣā, loḍ-arthalakṣaṇe iti sarvam anuvartate  / ūrdhva-mauhūrtike
    bhaviṣyati kāle loḍ-arthalakṣaṇa-arthe vartamānāt dhātor vibhāṣā liṅ-pratyayo
    bhavati, cakārāl laṭ ca  / ūrdhvaṃ muhūrtād bhavaḥ ūrdhvamauhūrtikaḥ  / nipātanāta
    samāsaḥ, uttarapada-vṛddhiś ca  / bhavisyataś ca+etad viśeṣaṇam  / ūrdhvaṃ muhūrtāt
    upari muhūrtasya upādhyāyaś ced āgacchet, upādhyāyaś ced āgacchati, upādhyāyaś
    ced āgamiṣyati, upādhyāyaś ced āgantā, atha tvaṃ chando 'dhīṣva, atha tvaṃ vyākaraṇam
    adhīṣva // [#255]
