source_id: KASIKA-8.3.37
locator:
  sutra: 8.3.37
witness_text:
  sutra: kupvoḥ ḥkaḥpau ca
  commentary: kavargapavargayoḥ parato visarjanīyasya yathāsaṅkhyam ḥkaḥpa ity etāv
    ādeśau bhavataḥ, cakārād visarjanīyaś ca  / vṛkṣaḥ karoti, vṛkṣaḥ karoti  / vṛkṣaḥ
    khanati, vṛkṣaḥ khanati  / vṛkṣaḥ pacati, vṛkṣaḥ pacati  / vṛkṣaḥ phalati, vṛkṣaḥ
    phalati  / kapau uccāraṇārthau  / jihvāmūlīyopadhmānīyau etāv ādeśau  / visarjanīyasya
    saḥ (*8,3.34) ity etasminnāprāpte idam ārabhyate iti etasya bādhakam, śarpare
    visarjanīyaḥ (*8,3.35) ity etat tu na bādhyate, vāsaḥ kṣaumam, adbhiḥ psātam  /
    pūrvatrāsiddhe nāsti vipratiṣedho 'bhāvād uttarasya iti śarpare visarjanīyaḥ (*8,3.35)
    ity etad eva bhavati  / kecit tu etad arthaṃ yogavibhāgaṃ kurvanti  / kupvoḥ śarparayoḥ
    visarjanīyasya visarjanīyaḥ ādeśo bhavati, kimartham idam, ḥkaḥpau ca iti vakṣyati,
    tadvādhanārtham iti // [#946]
