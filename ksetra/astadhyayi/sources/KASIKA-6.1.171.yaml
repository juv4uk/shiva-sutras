source_id: KASIKA-6.1.171
locator:
  sutra: 6.1.171
witness_text:
  sutra: ūḍ-idaṃ-padādy-ap-pum-rai-dyubhyaḥ
  commentary: ūṭḥ idam padādi ap pum rai div ity etebhyo 'sarvanāmasthānavibhaktir
    udāttā bhavati  / ūṭḥ - praṣṭauhaḥ  / praṣṭhauhā  / ūṭhyupadhāgrahaṇaṃ kartavyam  /
    iha mā bhūt, akṣadyuvā  / akṣadyuve  / idam - ābhyām  / ebhiḥ  / antodāttāt ity
    adhikārād anvādeśe na bhavati, atho ābhyāṃ nipuṇamadhītam iti  / padādayaḥ paddannomāsa
    (*6,1.63) ity evam ādayo niśparyantā iha gṛhyante  / ni padaścaturo jahi  / yā
    dato dhāvate  / asanprabhṛtibhyo vibhaktir anudāttaiva bhavati  / grīvāyāṃ baddho
    api kakṣa āsani  / matsyaṃ na dīna udani kṣiyantam  / ap - apaḥ paśya  / adbhiḥ  /
    adbhyaḥ  / pum - puṃsaḥ  / pumbhyām  / pumbhyaḥ  / puṃsā  / puṃse  / rai - rāyaḥ
    paśya  / rābhyām  / rābhiḥ  / div - divaḥ paśya  / divā  / dive //
