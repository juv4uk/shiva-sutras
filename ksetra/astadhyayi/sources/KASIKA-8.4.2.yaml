source_id: KASIKA-8.4.2
locator:
  sutra: 8.4.2
witness_text:
  sutra: aṭ-ku-pv-āṅ-num-vyavāye 'pi
  commentary: aṭ ku pu āṅ num ity etair vyavāye 'pi rephaṣākārabhyām uttarasya nakārasya
    ṇakārādeśo bhavati  / aḍvyavāye tāvat - karaṇam  / haraṇam kiriṇā  / giriṇā  /
    kuruṇā  / guruṇā  / kavargavyavāye - arkeṇa  / mūrkheṇa  / gargeṇa  / argheṇa  /
    pavargavyavāye - darpeṇa  / repheṇa  / garbheṇa  / carmaṇā  / varmaṇā  / āṅvyavāye
    - paryāṇaddham  / nirāṇaddham  / aḍvyavāye iti siddhe āṅgrahaṇaṃ padavyavāye ity
    asya pratiṣedhasya bādhanārtham  / nuṃvyavāye - bṛṃhaṇam  / bṛṃhaṇīyam  / nuṃgrahaṇam
    anusvāropalakṣaṇārthaṃ draṣṭavyam  / tena tṛṃhaṇam, tṛṃhaṇīyam ity atra anusvāravyavāye
    numabhāve 'pi ṇatvaṃ bhavati  / saty api ca numi yatra anusvāro na śrūyate tatra
    na bhavati, prenvanam, prenvanīyam iti  / vyavāyopalakṣaṇārthatvād aḍādīnām iha
    vyastaiḥ samastair vyavāye 'pi ṇatvaṃ bhavati //
