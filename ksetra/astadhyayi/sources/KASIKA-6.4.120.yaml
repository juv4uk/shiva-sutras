source_id: KASIKA-6.4.120
locator:
  sutra: 6.4.120
witness_text:
  sutra: ata ekahalmadhye 'nādeśāder liṭi
  commentary: liṭi parata ādeśaḥ ādir yasya aṅgasya na asti tasya ekahalmadhye asahāyayor
    halor madhye yo 'kāras tasya ekārādeśo bhavati, abhyāsalopaḥ ca liṭi kṅiti parataḥ  /
    reṇatuḥ  / reṇuḥ  / yematuḥ  / yemuḥ  / pecatuḥ  / pecuḥ  / dematuḥ  / demuḥ  /
    ataḥ iti kim ? didivatuḥ  / didivuḥ  / taparakaraṇaṃ kim ? rarāse, rarāsāte, rarāsire  /
    ekahalmadhye iti kim ? śaśramatuḥ  / śaśramuḥ  / tatsaratuḥ  / tatsaruḥ  / anādeśādeḥ
    iti kim ? cakaṇatuḥ  / cakaṇuḥ  / jagaṇatuḥ  / jagaṇuḥ  / babhaṇatuḥ  / babhaṇuḥ  /
    liṭaḥ ādeśaviśeṣaṇaṃ kim ? iha api yathā syāt, nematuḥ  / nemuḥ  / sehe, sehāte,
    sehire  / anaimittike natvasatve, tadādir liṭi ādeśādirna bhavati  / iha abhyāsajaśtvacartvayor
    asiddhatvaṃ nāsti, tena tadādir apy ādeśādir bhavati  / tathā ca phalibhajoretvaṃ
    vidhīyate  / rūpābhede cādeśādir na aśrīyate iti śasidadyoḥ pratiṣedhavacanaṃ
    jñāpakam  / anyathā hi pecatuḥ, pecuḥ, dematuḥ, demuḥ ity evam ādīnām api prakṛtijaścarādīnām
    etvaṃ na syāt  / kṅiti ity eva, ahaṃ papaca  / ahaṃ papaṭha  / dambheretvaṃ vaktavyam  /
    debhatuḥ  / debhuḥ  / nalopasya asiddhatvān na prāpnoti  / naśimanyor aliṭyetvaṃ
    vaktavyam  / aneśam  / menakā  / aneśam iti naśeḥ luṅi puṣāditvād aṅ  / menakā
    iti maneḥ āśiṣi ca (*3,1.150) iti vun  / kṣipakādiṣu prakṣepāditvaṃ na kriyate  /
    [#758] chandasyamipacorapyaliṭyetvaṃ vaktavyam  / vyemānam  / amervipūrvasya cānaśi
    muk na kriyate  / liṅi-peciran  / paceran ity etasya chāndasaṃ hrasvatvam  / yajivapyoś
    ca  / āyeje  / āvepe  / laṅi iṭi chandasyapi dṛśyate (*6,4.73) iti anajāder api
    iḍāgamaḥ //
