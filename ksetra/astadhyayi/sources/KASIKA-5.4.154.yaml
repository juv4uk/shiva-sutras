source_id: KASIKA-5.4.154
locator:
  sutra: 5.4.154
witness_text:
  sutra: śeṣād vibhāṣā
  commentary: yasmād bahuvrīheḥ samāsānto na vihitaḥ sa śeṣaḥ tasmād vibhāṣā kap pratyayo
    bhavati  / bahvyaḥ khaṭvāḥ asmin bahukhaṭvakaḥ  / bahumālakaḥ  / bahuvīṇakaḥ  /
    bahukhaṭvākaḥ  / bahumālākaḥ  / bahuvīṇākaḥ  / bahukhaṭvaḥ  / bahumālaḥ  / bahuvīṇaḥ  /
    katham anṛkkaṃ sāma, bahvṛkkaṃ sūktam iti, yāvatā vihito 'tra sāmānyena samāsāntaḥ
    ṛṣpūḥ iti  / na+etad asti  / viśeṣe sa iṣyate, anṛco māṇadako jñeyo bahvṛcaś caraṇākhyāyām
    iti  / śeṣāt iti kim ? priyapathaḥ  / priyadhuraḥ // [#593]
