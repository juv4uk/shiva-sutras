source_id: KASIKA-1.2.30
locator:
  sutra: 1.2.30
witness_text:
  sutra: nīcair anudāttaḥ
  commentary: ac iti vartate  / nīcair upalabhyamāno yo 'c so 'nudātta-sañjño bhavati  /
    samāne sthāne nīca-bhāge niṣpanno 'c anudāttaḥ  / yasminn uccāryamāṇe gātrāṇām
    anvavasargo mārdavaṃ bhavati, svarasya mṛdutā snigdhatā, kaṇṭha-vivarasya urutā
    mahattā  / tva sama sima ity anuccāni  / namaste rudra nīlakaṇṭha sahasrākṣa  /
    anudāttapradeśāḥ- anudāttau sup-pitau (*3,1.4) ity evam ādyaḥ // [#39]
