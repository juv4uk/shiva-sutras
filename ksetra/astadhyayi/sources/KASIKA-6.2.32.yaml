source_id: KASIKA-6.2.32
locator:
  sutra: 6.2.32
witness_text:
  sutra: saptamī siddha-śuṣka-pakva-bandheṣv akālāt
  commentary: saptamyantaṃ pūrvapadaṃ siddha śuṣka pakva bandha ity eteṣu uttarapadeṣu
    rakṛtisvaraṃ bhavati sā cet saptamī kālān na bhavati  / sāṃkaśyasiddhaḥ, sāṃkāśyasiddhaḥ  /
    kāmpilyasiddhaḥ, kāmpilyasiddhaḥ  / sāṃkāśyakāmpilyaśabdau ṇyapratyayāntau antodāttau  /
    phiṣi tu sāṃkāśyakāmpilyanasikyadārvāghāṭānām antaḥ pūrvaṃ vā iti paṭhyate, tatra
    pakṣe madhyodāttāv api bhavataḥ  / śuṣka - ūkaśuṣkaḥ  / nidhanaśuṣkaḥ  / ūkaśabdo
    bahulavacanādavateḥ kakpratyayānto 'ntodāttaḥ  / nidhanaśabdaḥ nidhāñaḥ kyapratyaye
    madhyodāttaḥ  / pakva - kumbhīpakvaḥ  / kalasīpakvaḥ  / bhrāṣṭrapakvaḥ  / kumbhīkalasīśabdau
    ṅīṣantāv antodāttau  / bhrāṣṭraśabdaḥ ṣṭranpratyayāntaḥ ādyudāttaḥ  / bandha -
    cakrabandhaḥ  / cārakabandhaḥ  / cakraśabdo 'ntodāttaḥ  / cārakaśabdo ṇvalanta
    ādyudāttaḥ  / akālāt iti kim ? pūrvāhṇasiddhaḥ  / aparāhṇasiddhaḥ  / saptamīsvaraḥ
    kṛtsvareṇa bādhitaḥ punar ayaṃ vidhīyate //
