  sutra: 4.2.23
witness_text:
  sutra: vibhāṣā phālgunī-śravaṇā-kārtikī-caitrībhyaḥ
  commentary: phalguny-ādayaḥ paurṇamāsī-śabdāḥ tebhyo vibhāṣā ṭhak pratyayo bhavati,
    sā 'smin paurṇamāsī iti sajñāyām (*4,2.21) ity etasmin viṣaye  / nityam aṇi prāpte
    pakṣe ṭhag vidhīyate  / phālguno māsaḥ, phālgunikaḥ  / śrāvaṇaḥ, śrāvaṇikaḥ  /
    kārtikaḥ, kārtikikaḥ  / caitraḥ, caitrikaḥ //
