source_id: KASIKA-8.2.32
locator:
  sutra: 8.2.32
witness_text:
  sutra: dāder dhātor ghaḥ
  commentary: dakārādeḥ dhātoḥ hakārasya ghakārādeśo bhavati jhali parataḥ padānte
    ca  / dagdhā  / dagdhum  / dagdhavyam  / kāṣṭhadhak  / dogdhā  / dogdhum  / dogdhavyam  /
    godhuk  / dādeḥ iti kim ? leḍhā  / leḍhum  / leḍhavyam  / guḍaliṭ  / dhātoḥ iti
    dādisamānādhikaraṇam etan na, kiṃ tarhi, tadviśeṣaṇam avayavaṣaṣṭhyantam, dhātor
    avayavo yo dādiḥ śabdas tad avayavasya hakārasya iti  / [#918] kiṃ kṛtaṃ bhavati
    ? adhok ity atra api ghakāraḥ siddho bhavati  / kathaṃ dogdhā, dogdhum iti ? vyapadeśivadbhāvāt  /
    atha vā dhātūpadeśe yo dādiḥ ity evaṃ vijñāyate  / tathā ca dāmalihamicchati dāmalihyati,
    dāmalihyateḥ kvip pratyayaḥ dāmaliṭ ity atra api na bhavati //
