witness_text:
  sutra: dvigau kratau
  commentary: dvigau uttarapade kratuvācini samāse pūrvapadam antodāttaṃ bhavati  /
    gargatrirātraḥ  / carakatrirātraḥ  / kusuravindasaptarātraḥ  / gargāṇāṃ trirātraḥ
    gargatrirātraḥ  / dvigau iti kim ? atirātraḥ  / acaścitvā dantodāttaḥ  / kratau
    iti kim ? bilvasaptarātraḥ  / bilvaśatasya bilvahomasya vā saptarātraḥ bilvasaptarātraḥ
    //
