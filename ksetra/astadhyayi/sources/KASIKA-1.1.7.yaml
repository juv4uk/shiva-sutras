source_id: KASIKA-1.1.7
locator:
  sutra: 1.1.7
witness_text:
  sutra: halo 'nantarāḥ saṃyogaḥ
  commentary: bhinna-jātīyair ajbhir avyavahitaḥ śliṣṭa-uccāritā halaḥ saṃyoga-sañjñā
    bhavanti  / samudāyaḥ sañjñī  / jātau cedaṃ bahuvacanam  / tena dvayor bahūnāṃ
    ca saṃyogasañjñā siddhā bhavati  / agniḥ iti ga-nau  / aśvaḥ iti śa-vau  / karṇaḥ
    iti ra-ṇau  / indraḥ, candraḥ mandraḥ iti na-da-rāḥ  / uṣṭraḥ, rāṣṭram, bhrāṣṭram
    iti ṣa-ṭa-rāḥ  / tilānstryāvapati iti na-sata-ra-yāḥ, na-ta-sa-ta-ra-yā vā  /
    halaḥ iti kim ? titaucchatram - saṃyogāntasya lopaḥ (*8,2.23) iti lopaḥ syāt  /
    anantarāḥ iti kim ? pacati panasam - skoḥ saṃyoga-ādyor ante ca (*8,2.29) iti
    lopaḥ syāt  / saṃyoga-pradeśāḥ - samyogāntasya lopaḥ (*8,2.23) ity evam ādayaḥ
    //
