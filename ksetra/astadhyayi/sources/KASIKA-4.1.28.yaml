source_id: KASIKA-4.1.28
locator:
  sutra: 4.1.28
witness_text:
  sutra: ana upadhālopino 'nyatarasyām
  commentary: bahuvrīher ity eva  / ann-anto yo bahuvrīhiḥ upadhālopī, tasmād anyatarasyāṃ
    ṅīp pratyayo bhavati  / ṅīpā mukte ṅāp-pratiṣedhau bhavataḥ  / kimarthaṃ tarhi
    idam ucyate, nanu siddhā eva ḍāp-pratiṣedhaṅīpaḥ ? anupadhālopinaḥ ṅīp-pratiṣedha-arthaṃ
    vacanam  / bahurājā, bahurājñī, bahurāje  / bahutakṣā, bahutakṣṇī, bahutakṣe  /
    anaḥ iti kim ? bahumatsyā  / upadhālopinaḥ iti kim ? suparvā, suparve, suparvāḥ  /
    suparvāṇau, suparvāṇaḥ  / ḍāp-pratiṣedhāv eva atra bhavataḥ //
