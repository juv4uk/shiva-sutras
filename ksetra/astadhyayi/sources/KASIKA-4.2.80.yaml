source_id: KASIKA-4.2.80
locator:
  sutra: 4.2.80
witness_text:
  sutra: vuñ-chaṇ-ka-ṭhaj-ila-sa-ini-ra-ḍha ṇya-ya-phak-phiñ-iñ-ñya-kak-ṭhako 'rīhaṇa-kṛśāśva-rśya-kumuda-kāśa-tṛṇa-prekṣā-aśma-sakhi-saṅkāśa-bala-pakṣa-karṇa-sutaṅgama-pragadin-varāha-kumuda-ādibhyaḥ
  commentary: vuñādayaḥ spatadaśa pratyayāḥ, arīhaṇādayo 'pi saptadaśa+eva prātipadikagaṇāḥ  /
    ādi-śabdaḥ pratyekam abhisambadhyate  / tatra yathāsaṅkhyaṃ saptadaśabhyaḥ prātipadikagaṇebhyaḥ
    saptadaśa pratyayāḥ bhavanti cāturarthikāḥ  / aṇo 'pavādaḥ  / yathāsambhavamarthasambandhaḥ  /
    arīhaṇādibhyo vuñ pratyayo bhavati  / ārīhaṇakam  / draughaṇakam  / arīhaṇa  /
    drughaṇa  / khadira  / sāra  / bhagala  / ulanda  / sāmparāyaṇa  / krauṣṭrāyaṇa  /
    bhāstrayaṇa  / maitrāyaṇa  / traigartāyana  / rāyaspoṣa  / vipatha  / uddaṇḍa  /
    udañcana  / khāḍāyana  / khaṇḍa  / vīraṇa  / kāśakṛtsna  / jāmbavanta  / śiṃśipā  /
    kiraṇa  / raivata  / bailva  / vaimatāyana  / sausāyana  / śāṇdilyāyana  / śirīṣa  /
    badhira  / arīhaṇādiḥ  / kṛśāśvādibhyaḥ chaṇ pratyayo bhavati  / kārśāśvīyaḥ  /
    āriṣṭīyaḥ  / kṛśāśva  / ariṣṭa  / arīśva  / veśman  / viśāla  / romaka  / śabala  /
    kūṭa  / roman  / varvara  / sukara  / sūkara  / pratara  / sudṛśa  / puraga  /
    sukha  / dhūma  / ajina  / vinatā  / avanata  / vikughāsa  / arus  / avayāsa  /
    maudgalya  / kṛśāśvādiḥ  / ṛśyādibhyaḥ kaḥ pratyayo bhavati  / ṛśyakaḥ  / nyagrodhakaḥ  /
    ṛśya  / nyagrodha  / śirā  / nilīna  / nivāsa  / nidhāna  / nivāta  / nibaddha  /
    vibaddha  / parigūḍha  / upagūḍha  / uttarāśman  / sthūlabāhu  / khadira  / śarkarā  /
    anaḍuḥ  / parivaṃśa  / veṇu  / vīraṇa  / ṛśyādiḥ  / kumudādibhyaḥ ṭhac pratyayo
    bhavati  / kumudikam  / śarkarikam  / kumuda  / śarkarā  / nyagrodha  / itkaṭa  /
    garta  / bīja  / aśvattha  / balvaja  / parivāpa  / śirīṣa  / yavāṣa  / kūpa  /
    vikaṅkata  / kumudādiḥ  / [#384] kāśādibhya ilaḥ pratyayo bhavati  / kāśilam  /
    vāśilam  / kāśa  / vāśa  / aśvattha palāśa  / pīyūṣa  / viśa  / tṛṇa  / nara  /
    caraṇa  / kardama  / karpūra  / kaṇṭaka  / gṛha  / kāśādiḥ  / tṛṇādibhyaḥ śaḥ
    pratyayo bhavati  / tṛṇaśaḥ  / naḍaśaḥ  / tṛṇa  / naḍa  / busa  / parṇa  / varṇa  /
    caraṇa  / arṇa  / jana  / bala  / lava  / vana  / tṛṇādiḥ  / prekṣādibhya ini-pratyayo
    bhavati  / prekṣī  / halakī  / prekṣā  / halakā  / bandhukā  / dhruvakā  / kṣipakā  /
    nyagrodha  / irkuṭa  / prekṣādiḥ  / aśmādibhyo rapratyayo bhavati  / aśmaraḥ  /
    aśman  / yūṣa  / rūṣa  / mīna  / darbha  / vṛnda  / guḍa  / khaṇḍa  / naga  /
    śikhā  / aśmādiḥ / sakhyādibhyo ḍhañ pratyayo bhavati  / sākheyam  / sākhidatteyam  /
    sakhi  / sakhidatta  / vāyudatta  / gohita  / bhalla  / pāla  / cakrapāla  / cakravāla  /
    chaṅgala  / aśoka  / karavīra  / sīkara  / sakara  / sarasa  / samala  / sakhyādiḥ  /
    saṃkāśādibhyo ṇyapratyayo bhavati  / sāṃkāśyam  / kampilyam  / saṃkāśa  / kāmpilya  /
    samīra  / kaśmara  / śūrasena  / supathin  / sakthaca  / yūpa  / aṃśa  / ega  /
    aśman  / kūṭa  / malina  / tīrtha  / agasti  / virata  / cikāra  / viraha  / nāsikā  /
    saṃkāśādiḥ  / balādibhyo yaḥ pratyayo bhavati  / balyaḥ  / kulyam  / bala  / vula  /
    tula  / ula  / ḍula  / kavala  / vana  / kula  / balādiḥ  / pakṣādibhyaḥ phak
    pratyayo bhavati  / pākṣāyaṇaḥ  / tauṣāyanaḥ  / pakṣa  / tuṣa  / aṇḍa  / kambalika  /
    citra  / aśman  / atisvan  / pathin pantha ca  / pakṣādiḥ  / karṇādibhyaḥ phiñ
    pratyayo bhavati  / kārṇāyaniḥ  / vāsiṣṭhāyaniḥ  / [#385] karṇa  / vasiṣṭha  /
    aluśa  / śala  / ḍupada  / anaḍuhya  / pāñcajanya  / sthirā  / kuliśa  / kumbhī  /
    jīvantī  / jitva  / aṇḍīvat  / karṇādiḥ  / sutaṅgamādibhya iñ pratyayo bhavati  /
    sautaṅgamiḥ  / maunicittiḥ  / sutaṅgama  / municitta  / vipracitta  / mahāputra  /
    śveta  / gaḍika  / śukra  / vigra  / bījavāpin  / śvan  / arjuna  / ajira  / jīva  /
    sutaṅgamādiḥ  / pragadinnādibhyaḥ jyaḥ pratyayo bhavati  / prāgadyam  / pragadin  /
    magadin  / śaradin  / kaliva  / khaḍiva  / gaḍiva  / cūḍāra  / mārjāra  / kovidāra  /
    pragadyādiḥ  / varāhādibhyaḥ kak pratyayo bhavati  / vārāhakam  / pālāśakam  /
    varāha  / palāśa  / śirīṣa  / pinaddha  / sthūṇa  / vidagdha  / vijagdha  / vibhagna  /
    bāhu  / khadira  / śarkarā  / varāhādiḥ  / kumudādibhyaḥ ṭhak pratyayo bhavati  /
    kaumudikam  / kumuda  / gomatha  / rathakāra  / daśagrāma  / aśvattha  / śālmalī  /
    kuṇḍala  / munisthūla  / kūṭa  / mucukarṇa  / kumudādiḥ  / śirīṣa-śabdo 'rīhaṇādiṣu,
    kumudādiṣu, varāhādiṣu ca paṭhyate, autsargiko 'pi tata iṣyate, tasya ca varaṇādiṣu
    darśanāl lub bhavati  / tathā ca+uktam, śirīṣāṇāmadūrabhavo grāmaḥ śirīṣāḥ, tasya
    vanaṃ śirīṣavanam iti //
