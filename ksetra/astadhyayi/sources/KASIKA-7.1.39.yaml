source_id: KASIKA-7.1.39
locator:
  sutra: 7.1.39
witness_text:
  sutra: supāṃ su-luk-pūrvasavarna-ā-āc-che-yā-ḍā-ḍyā-yāj-ālaḥ
  commentary: chandasi viṣaye supāṃ sthāne su luk pūrvasavarṇa ā āt śe yā ḍā ḍyā yāc
    āl ity ete ādeśāḥ bhavanti  / su - anṛkṣarā ṛjavaḥ santu panthāḥ  / panthānaḥ
    iti prāpte  / supāṃ supo bhavanti iti vaktavyam  / dhuri dakṣiṇāyāḥ  / dakṣiṇāyām
    iti prāpte  / tiṅāṃ tiṅo bhavandi iti vaktavyam  / caṣālaṃ ye aśvayūpāya takṣati  /
    takṣanti iti prāpte  / luk - ārdre carman  / rohite carman  / carmaṇi iti prāpte  /
    havirdhāne yat sanvanti tatsāmidhenīranvāha  / yasmin sunvanti tasmin sāmidhenīḥ
    iti prāpte  / [#782] pūrvasavarṇaḥ - dhītī  / matī  / suṣṭutī  / dhītyā, matyā,
    suṣṭutyā iti prāpte  / ā - dvā yantārā  / dvau yantārau iti prāpte  / āt - na
    tād brāhmaṇād nindāmi  / tān brāhmaṇān iti prāpte  / śe - na yuṣme vājabandhavaḥ  /
    asme indrābṛhaspatī  / yūyaṃ vayam iti prāpte  / yuyādeśo vayādeśaś ca chandasatvān
    na bhavati  / yā - uruyā  / dhṛṣṇuyā  / uruṇā, dhṛṣṇunā iti prāpte  / ḍā - nābhā
    pṛthivyām  / nābhau pṛthivyām iti prāpte  / ḍyā - anuṣṭuyoccyāvayatāt  / anuṣṭubhā
    iti prāpte  / yāc - sādhuyā  / sādhu iti sorluki prāpte  / āl - vasantā yajeta  /
    vasante iti prāpte  / iyāḍiyājīkārāṇām upasaṅkhyānam  / iyā - urviyā pari khyan  /
    dārviyā parijman  / uruṇā, dāruṇā iti prāpte  / ḍiyāc sukṣetriyā sugātuyā  / sukṣetriṇā,
    sugātriṇā iti prāpte  / īkāraḥ - dṛtiṃ na śuṣkaṃ sarasī śayānam  / sarasi śayānam
    iti prāpte  / āṅayājayārāṃ ca+upasaṅkhyānam  / āṅ - pra bāhavā  / pravahunā iti
    prāpte  / ayāc - svapnayā sacase janam  / svapnena iti prāpte  / ayār - sa naḥ
    sindhumiva nāvayā  / nāvā iti prāpte //
