source_id: KASIKA-1.1.37
locator:
  sutra: 1.1.37
witness_text:
  sutra: svarādi-nipātam avyayam
  commentary: svarādīni śabda-rūpāṇi nipātāśca avyaya-sañjñāni bhavanti  / svar, antar,
    prātar, ete anta-udāttāḥ paṭhyante  / punar ādy-udāttaḥ  / sanutar, uccais, nīcais,
    śanais, ṛdhak, ārāt, ṛte, yugapat, pṛthak, ete 'pi sanutarprabhṛtayo 'ntodāttāḥ
    paṭhyante  / hyas, śvas, divā, rātrau, sāyam, ciram, manāk, īṣat, joṣam, tūṣṇīm,
    bahis, āvis, avas, adhas, samayā, nikaṣā, svayam, mṛṣā, naktam, nañ, hetau, addhā,
    iddhā, sāmi, ete 'pi hyasprabhṛtayo 'ntodāttāḥ paṭhyante  / vat-vadantam avyaya-sañjñaṃ
    bhavati  / brāhmaṇavat  / kṣatriyavat  / san, sanāt, sanat, tiras, ete ādy-udāttāḥ
    paṭhyante  / antarā-ayamantodāttaḥ  / antareṇa, jyok, kam, śam, sanā, sahasā,
    vinā, nānā, svasti, svadhā, alam, vaṣaṭ, anyat, asti, upāṃśu, kṣamā, vihāyasā,
    doṣā, mudhā, mithyā  / ktvātosuṅkasunaḥ, kṛnma-kārāntaḥ, sandhy-akṣarāntaḥ, avyayībhāvaś
    ca  / purā, mitho, mithas, prabāhukam, āryahalam, abhīkṣṇam, sākam, sārdham, samama,
    namas, hiruk, tasilādiḥ taddhita edhācparyantaḥ, śastasī, kṛtvasuc, suc, ās-thālau,
    cvyarthāśca, am, ām, pratān, praṣān, svarādiḥ  / nipātā vakṣyante--prāg-rīśvarān-nipātāḥ
    (*1,4.56) iti  / ca, vā, ha, aha, eva, evam ity-ādayaḥ  / avyaya-pradeśāḥ-- avyayād
    āp-supaḥ (*2,4.82) ity evam ādayaḥ  / avyayam ity anvartha-sañjñā  / [#18] sadṛśaṃ
    triṣu liṅgeṣu sarvāsu ca vibhaktiṣu  / vacaneṣu ca sarveṣu yanna vyeti tad-avyayam
    //
