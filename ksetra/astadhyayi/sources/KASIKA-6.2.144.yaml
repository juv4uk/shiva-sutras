source_id: KASIKA-6.2.144
locator:
  sutra: 6.2.144
witness_text:
  sutra: tha-atha-ghañ-kta-aj-ab-itra-kāṇām
  commentary: tha atha ghañ kta ac ap itra ka ity evam antānām uttarapadānāṃ gatikārakopapadāt
    pareṣām antaḥ udātto bhavati  / sunīthaḥ  / avabhṛthaḥ  / hanikuṣinīramikāśibhyaḥ
    kthan iti ave bhṛñaḥ iti ca kthanpratyayāntāv etau  / tatra kṛduttarapadaprakṛtisvaratvena
    ādyudāttam uttarapadaṃ syāt  / atha - āvasathaḥ upavasathaḥ  / upasarge vaseḥ
    iti athanpratyayaḥ ghañ - prabhedaḥ  / kāṣṭhabhedaḥ  / rajjubhedaḥ  / kta - dūrādāgataḥ  /
    ātapaśuṣkaḥ  / viśuṣkaḥ  / ac - prakṣayaḥ  / prajayaḥ  / kṣayo nivāse (*6,1.201)
    jayaḥ karaṇam (*6,1.202) iti ca ādyudāttau kṣayajayaśabdau prayojayataḥ  / ap
    - pralavaḥ  / prasavaḥ  / itra - pralavitram  / prasavitram  / ka - govṛṣaḥ  /
    kharīvṛṣaḥ  / gāṃ varṣati, kharīṃ varṣati iti mūlavibhujāditvāt kapratyayaḥ  /
    pravṛṣaḥ  / prahṛṣaḥ  / igupadha iti kapratyayaḥ  / vṛṣādīnāṃ ca (*6,1.203) iti
    vṛṣaśabdaḥ ādyudāttaḥ  / gatikārakopapadāt ity eva, sustutaṃ bhavatā  / karmapravacanīye
    avyayasvaraḥ eva bhavati //
