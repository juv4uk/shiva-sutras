locator:
  sutra: 3.4.34
witness_text:
  sutra: nimūla-samūlayoḥ kaṣaḥ
  commentary: karmaṇi ity eva  / nimūla-samūla-śabdayoḥ karmavācinor upapadayoḥ kaṣeḥ
    dhātoḥ ṇamul pratyayo bhavati  / nimūlakāṣaṃ kaṣati  / samūlakāṣaṃ kaṣati  / nimūlaṃ
    samūlaṃ kaṣati ity arthaḥ  / itaḥ prabhṛti kaṣādīn yān vakṣyati tatra kaṣādiṣu
    yathā-vidhy-anuprayogaḥ (*3,4.46) iti //
