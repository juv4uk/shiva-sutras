source_id: KASIKA-7.1.21
locator:
  sutra: 7.1.21
witness_text:
  sutra: aṣṭābhya auś
  commentary: aśṭābhyaḥ iti kṛtākāro 'ṣṭanśabdo gṛhyate  / tasmād uttarayoḥ jaśśasoḥ
    auś ity ādeśo bhavati  / aṣṭau tiṣṭhanti  / aṣṭau paśya  / kṛtākārasya grahaṇaṃ
    kim ? aṣṭa tiṣṭhanti  / aṣṭa paśya  / etad eva kṛtātvasya grahaṇaṃ jñāpakam aṣṭana
    ā vibhaktau (*7,2.84) ity ātvavikalpasya  / ṣaḍbhyo luk (*7,1.22) ity asya ayam
    apavādaḥ, nāprāpte tasminn idam ārabhyate  / yas tu supo dhātuprātipadikayoḥ (*2,4.71)
    iti, tasmin prāpte ca aprāpte ca iti sa na bādhyate, aṣṭaputraḥ, aṣṭabhāryaḥ iti  /
    tadantagrahaṇam atra+iṣyate  / paramāṣṭau  / uttaramāṣṭau  / priyāṣṭanaḥ ity atrātvasya
    abhāvād auśtvaṃ na bhavati //
