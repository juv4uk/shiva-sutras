locator:
  sutra: 6.2.193
witness_text:
  sutra: prater aṃśv-ādayas tatpuruṣe
  commentary: prater aṃśvādayas tatpuruṣe samāse 'ntodāttāḥ bhavanti  / pratigataḥ
    aṃśuḥ pratyaṃśuḥ  / pratijanaḥ  / pratirājā  / rājaśabdaḥ samāsāntasya anityatvād
    yadā ṭaj na asti tadā prayojayati  / tasmin hi sati cittvād eva antodāttatvaṃ
    siddham  / tatpuruṣe iti kim ? pratigatāḥ aṃśavaḥ asya pratyaṃśuḥ ayam uṣṭraḥ  /
    aṃśu  / jana  / rājan  / uṣṭra  / kheṭaka  / ajira  / ārdrā  / śravaṇa  / kṛttikā  /
    ardha  / pura //
