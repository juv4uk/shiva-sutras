source_id: KASIKA-5.1.50
locator:
  sutra: 5.1.50
witness_text:
  sutra: tad dharati vahavty āvahati bhārād vaṃśādibhyaḥ
  commentary: tad iti dvitīyāsamarthād dharaty-ādiṣv artheṣu yathāvihitaṃ pratyayo
    bhavati  / prakṛti-viśeṣaṇaṃ bhārād vaṃśādibhyaḥ iti  / vaṃśādibhyaḥ paro yo bhāra-śabdaḥ
    tadantāt prātipadikāt iti  / vaṃśabhāraṃ harati vahati āvahati vā vāṃśabhārikaḥ  /
    kauṭajabhārikaḥ  / bālvajabhārikaḥ  / bhārāt iti kim ? vaṃśaṃ harati  / vaṃśādibhyaḥ
    iti kim ? vrīhibhāraṃ harati  / aparā vṛttiḥ - bhārād vaṃśādibhyaḥ iti, bhārabhūtebhyo
    vaṃśādibhyaḥ ity arthaḥ  / bhāra-śabdo 'rthadvāreṇa vaṃśādīnāṃ viśeṣaṇam  / bhārabhūtān
    vaṃśān harati vāṃśikaḥ  / kauṭajikaḥ  / bālvajikaḥ  / bhārāt iti kim ? vaṃśaṃ
    harati  / vaṃśādibhyāḥ iti kim ? bhārabhūtān vrīhīn vahati  / sūtrārthadvayam
    api ca+etad ācāryeṇa śiṣyāḥ pratipāditāḥ  / tadubhayam api grāhyam  / harati deśāntaraṃ
    prāpayati corayati vā  / vahaty utkṣipya dhārayati ity arthaḥ  / āvahati utpādayati
    ity arthaḥ  / vaṃśa  / kuṭaja  / balvaja  / mūla  / akṣa  / sthūṇā  / aśman  /
    aśva  / ikṣu  / khaṭvā  / vaṃśādiḥ //
