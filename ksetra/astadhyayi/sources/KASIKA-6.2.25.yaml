source_id: KASIKA-6.2.25
locator:
  sutra: 6.2.25
witness_text:
  sutra: śra-jya-avama-kan-pāpa-vatsu bhāve karmadhāraye
  commentary: śra jya avama kan ity eteṣu pāpaśabdavati ca+uttarapade karmadhārye
    samāse bhāvavāci pūrvapadaṃ prakṛtisvaraṃ bhavati  / gamanaśreṣṭham  / gamanaśreyaḥ  /
    jya - vacanajyeṣṭham  / vacanajyāyaḥ  / avama - gamanāvamam  / vacanāvamam  /
    kan - gamanakaniṣṭham  / gamanakanīyaḥ  / pāpavat - gamanapāpiṣṭham  / gamanapāpīyaḥ  /
    lyuḍantāny etāni pūrvapadāni litsvareṇa ādyudāttāni  / śrajyakanām ādeśānāṃ grahaṇam
    iti sāmarthyāttadvaduttarapadaṃ gṛhyate  / ādiṣv iti kim ? gamanaśobhanam  / bhāve
    iti kim ? gamyate 'nena iti gamanaṃ tat śreyaḥ, gamanaśreyaḥ  / karmadhāraye iti
    kim ? gamanaṃ śreyaḥ gamanaśreyaḥ //
