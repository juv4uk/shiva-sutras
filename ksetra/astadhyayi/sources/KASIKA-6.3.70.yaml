source_id: KASIKA-6.3.70
locator:
  sutra: 6.3.70
witness_text:
  sutra: kāre satya-agadasya
  commentary: kāraśabda uttarapade satya agada ity etayor mumāgamo bhavati  / satyaṃ
    karoti, satyasya va kāraḥ satyaṅkāraḥ  / evam - agadaṅkāraḥ  / astusatyāgādasya
    kāra iti vaktavyam  / astuṅkāraḥ  / bhakṣasya chandasi kāre mum vaktavyaḥ  / bhakṣaṃ
    karoti, bhakṣasya vā karaḥ bhakṣaṅkāraḥ  / chandasi iti kim ? bhakṣakāraḥ  / dhenor
    bhavyāyāṃ mum vaktavyaḥ  / dhenumbhavyā  / lokasya pṛṇe mum vaktavyaḥ  / lokampṛṇaḥ  /
    itye 'nabhyāśasya mum vaktavyaḥ  / anabhyāśamityaḥ  / bhrāṣṭrāgnyorindhe mum vaktavyaḥ  /
    bhṛāṣṭramindhaḥ  / agnimindhaḥ  / gile 'gilasya mum vaktavyaḥ  / timiṅgilaḥ  /
    agilasya iti kim ? gilagilaḥ  / gilagile ceti vaktavyam  / timiṅgilagilaḥ  / uṣṇabhadrayoḥ
    karaṇe mum vaktavyaḥ  / uṣṇaṅkaraṇam  / bhadraṅkaraṇam  / sūtograrājabhojamervityetebhya
    uttarasya duhitṛśabdasya putraḍādeśo vā vaktavyaḥ  / sūtaputrī, sūtaduhitā  /
    ugraputrī, ugraduhitā  / rājaputrī, rājaduhitā  / bhojaputrī, bhojaduhitā  / meruputrī,
    meruduhitā  / kecit tu śārṅgaravādiṣu putraśabdaṃ paṭhanti, teṣāṃ putrī iti bhavati  /
    anyatra api hi dṛśyate śailaputrī iti // [#717]
