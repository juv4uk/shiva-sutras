source_id: KASIKA-8.3.61
locator:
  sutra: 8.3.61
witness_text:
  sutra: stauti-ṇyor eva ṣaṇy abhyāsāt
  commentary: stauteḥ ṇyantānāṃ ca ṣabhūte sani parataḥ abhyāsāt iṇaḥ uttarasya ādeśasakārasya
    mūrdhanyādeśo bhavati  / tuṣṭūṣati  / ṇyantānām - siṣevayiṣati  / siṣañjayiṣati  /
    suṣvāpayiṣati  / siddhe satyārambho niyamārthaḥ, stautiṇyoḥ eva ṣaṇi abhyāsād
    yathā syāt, anyasya mā bhūt  / sisikṣati  / susūṣati  / evakārakaraṇamiṣtato 'vadhāraṇārtham  /
    stautiṇyoḥ ṣaṇi eva iti hi vijñāyamāne tuṣṭāva ity atra na syāt, iha ca syād eva
    sisikṣati iti  / ṣaṇi iti kim ? anyatra niyamo mā bhūt, siṣeca  / ko vinate 'nurodhaḥ
    ? avinate niyamo mā bhūt, suṣupsati  / tiṣṭhāsati  / kaḥ sānubandhe 'nurodhaḥ
    ? ṣaśabdamātre niyamo mā bhūt, suṣupiṣa indram  / abhyāsāt iti kim ? abhyāsāt
    yā prāptiḥ tasyā niyamo yathā syāt, dhātoḥ yā prāptis tasyā niyamo mā bhūt, pratīṣiṣati  /
    adhīṣiṣati // [#953]
