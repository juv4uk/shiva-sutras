source_id: KASIKA-7.3.107
locator:
  sutra: 7.3.107
witness_text:
  sutra: ambārthanadyor hrasvaḥ
  commentary: sambuddhau iti vartate  / ambārthanām aṅgānāṃ nadyantānāṃ hrasvo bhavati
    sambuddhau parataḥ  / he amba  / he akka  / he alla  / nadyāḥ khalv api - he kumāri  /
    he śārṅgaravi  / he brahmabandhu  / he vīrabandhu  / ḍalakavatīnāṃ pratiṣedho
    vaktavyaḥ  / he ambāḍe  / he ambāle  / he ambike  / chandasi veti vaktavyam  /
    he ambāḍa, he ambāḍe  / he ambāla, he ambāle  / he ambika, he ambike  / talo hrasvo
    bā ṅisambuddhyor iti vaktavyam  / devate bhaktiḥ, devatāyāṃ bhaktiḥ  / he devata,
    he devate  / chandasyeva hrasvatvam iṣyate  / mātṝṇāṃ mātac putrārtham arhate  /
    mātṝṇāṃ mātajādeśo vaktavyaḥ sambuddhau, putrāya putram abhidhātum  / kīdṛśāya
    ? arhate  / mātrā vyapadeśam arhati ślāghanīyatvād yaḥ putras tadartham  / he
    gārgīmāta  / nadyṛtaś ca (*5,4.153) iti samāsāntāpavādo mātajādeśaḥ  / citkaraṇam
    antodāttārtham //
