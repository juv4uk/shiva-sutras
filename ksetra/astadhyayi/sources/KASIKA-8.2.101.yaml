witness_text:
  sutra: cid iti ca+upamārthe prayujyamāne
  commentary: anudāttam iti vartate  / cit ity etasmin nipāte upamārthe prayujyamāne
    vākyasya ṭeḥ anudāttaḥ pluto bhavati  / pluto 'py atra vidhīyate, na guṇamātram
    agnicid bhāyā3t  / rājacid bhāyā3t  / agniriva bhāyāt, rājeva bhāyāt ity arthaḥ  /
    upamārthe iti kim ? kathañcid āhuḥ  / prayujyamāne iti kim ? agnirmāṇavako bhāyāt
    //
