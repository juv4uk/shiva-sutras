source_id: KASIKA-1.3.57
locator:
  sutra: 1.3.57
witness_text:
  sutra: jñā-śru-smṛ-dṛśāṃ sanaḥ
  commentary: jñā śru samṛ dṛś ity eteṣāṃ sannantānām ātmanepdaṃ bhavati  / tatra
    jānāteḥ apahnave jñaḥ (*1,3.44) iti tribhiḥ sūtrair ātmanepadaṃ vihitam, śru-dṛśor
    api samo gamyṛcchi (*1,3.29) ity atra vihitam  / tasmin viṣaye pūrvavat sanaḥ
    (*1,3.62) ity eva siddham ātmanepadam  / tato 'nyatra anena vidhīyate  / smarate
    punar aprāpta eva vidhānam  / dharmaṃ jijñāsate  / guruṃ śuśrūṣate  / naṣṭaṃ susmūrṣate  /
    nṛpaṃ didṛkṣate  / sanaḥ iti kim ? jānāti, śṛṇoti, smarati, paṣyati //
