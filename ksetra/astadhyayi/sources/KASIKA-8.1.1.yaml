source_id: KASIKA-8.1.1
locator:
  sutra: 8.1.1
witness_text:
  sutra: sarvasya dve
  commentary: sarvasya iti ca dve iti ca+etad adhikṛtaṃ veditavyam  / ita uttaraṃ
    yad vakṣyāmaḥ padasya (*8,1.16) ity ataḥ prāk, sarvasya dve bhavataḥ ity evaṃ
    tad veditavyam  / vakṣyati - nityavīpsayoḥ (*8,1.4) iti, tatra sarvasya sthāne
    dve bhavataḥ  / ke dve bhavataḥ ? ye śabdataś ca arthataś ca ubhayathāntaratame  /
    ekasya pacatiśabdasya dvau pacatiśabdau havataḥ  / pacati pacati  / grāmo grāmo
    ramaṇīyaḥ  / yadā tu dviḥ prayogo dvirvacanam tadā sa eva pacatiśabdo dvirāvartate,
    tasya dve āvṛttī bhavataḥ  / sarvasya iti kim ? vispaṣṭārtham  / atha padasya
    ity eva kasmān na+ucyate ? na+evaṃ śakyam, iha hi na syāt prapacati prapacati
    iti  / iha drogdhā, droḍhā iti ghatvaḍhatvayoḥ asiddhatvād akṛtayor eva tayor
    dvivacanaṃ prāpnoti, tatra paścād vikalpe satyaniṣtam api syāt drogdhā droḍhā,
    droḍhā drogdhā iti  / tasmād vaktavyam etat pūrvatra asiddhīyam advirvacane iti  /
    sarvasya ity etad eva vā kṛtaṃ sarvakāryapratipattyarthaṃ draṣṭavyam //
