source_id: KASIKA-8.1.24
locator:
  sutra: 8.1.24
witness_text:
  sutra: na ca-vā-ha-aha-evayukte
  commentary: ca vā ha aha eva ebhir yukte yuṣmadasmadoḥ vānnāvādayoḥ na bhavanti  /
    purveṇa prakāreṇa prāptāḥ pratiṣidhyante  / grāmastava ca svam, grāmo mama ca
    svam, yuvayoś ca svam, āvayoś ca svam, yuṣmākaṃ ca svam, asmākaṃ ca svam  / grāmas
    tubhyāṃ ca dīyate, grāmo mahyaṃ ca dīyate, yuvābhyāṃ ca dīyate, āvābhyām ca dīyate,
    yuṣmabhyaṃ ca dīyate, asmabhyaṃ ca dīyate  / grāmastvāṃ ca paśayati, grāmo māṃ
    ca pśayati, yuvāṃ ca paśyati, āvāṃ ca paśyati, yuṣmāṃś ca paśyati, yuṣmān vā paśyati,
    asmān vā paśyati  / vā - grāmastava vā svam, grāmo mama vā svam, yuvayor vā svam,
    āvayor vā svam, yuṣmākaṃ vā svam, asmākaṃ vā svam  / grāmastubhyaṃ vā dīyate,
    grāmo mahyaṃ vā dīyate, yuvābhyāṃ vā dīyate, āvābhyāṃ vā dīyate, yuṣmabhyaṃ vā
    dīyate, asmabhyaṃ vā dīyate  / grāmastvāṃ vā paśyati, grāmo māṃ vā paśyati, yuvāṃ
    vā paśyati, āvāṃ vā paśyati, yuṣmān vā paśyati, asmān vā paśyati  / [#890] ha
    - grāmastava ha svam, grāmo mama ha svam, yuvayor ha svam, āvayor ha svam, yuṣmākaṃ
    ha svam, asmākaṃ ha svam  / grāmastubhyaṃ ha dīyate, grāmo mahyaṃ ha dīyate, yuvābhyāṃ
    ha dīyate, āvābhyāṃ ha dīyate, yuṣmabhyāṃ ha dīyate, asmabhyaṃ ha dīyate  / grāmastvāṃ
    ha paśyati, grāmo māṃ ha paśyati, yuvāṃ ha paśyati, āvāṃ ha paśyati, yuṣmān ha
    paśyati, asmān ha paśyati  / aha - grāmastava aha svam, grāmo mama aha svam, yuvayor
    aha svam, āvayor aha svam, yuṣmākam aha svam, asmākamaha svam  / grāmastubhyamaha
    dīyate, grāmo mahyam aha dīyate, yuvābhyām aha dīyate, āvābhyām aha dīyate, yuṣmabhyam
    aha dīyate, asmabhyam aha dīyate  / grāmastvām aha paśyati, grāmo mām aha paśyati,
    yuvām aha paśyati, āvām aha paśyati, yuṣmān aha paśyati, asmān aha paśyati  /
    eva - grāmastava+eva svam, grāmo mama+eva svam, yuvayor eva svam, āvayor eva svam,
    yuṣmākam eva svam asmākam eva svam  / grāmastubhyam eva dīyate, grāmo mahyam eva
    dīyate, yuvābhyām eva dīyate, āvābhyām eva dīyate, yuṣmabhyam eva dīyate, asmabhyam
    eva dīyate  / grāṃstvām eva paśyati, grāmo mām eva paśyati, yuvām eva paśyati,
    āvām eva paśyati, yuṣmān eva paśyati, asmān eva paśyati  / yuktagrahaṇaṃ sākṣādyogapratipattyartham  /
    yuktayukte pratiṣedho na bhavati  / grāmaś ca te svam, nagaraṃ ca me svam //
