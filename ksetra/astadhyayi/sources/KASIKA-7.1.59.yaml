source_id: KASIKA-7.1.59
locator:
  sutra: 7.1.59
witness_text:
  sutra: śe mucādīnām
  commentary: śe pratyaye parato mucādīnam numāgamo bhavati  / muclṛ - muñcati  /
    luplṛ - lumpati  / vidlṛ - vindati  / lipi - limpati  / sic - siñcati  / kṛtī
    - kṛntati  / khida - khindati  / piśa - piṃśati  / śe iti kim ? moktā  / moktum  /
    [#787] moktavyam  / mucādīnām iti kim ? tudati  / nudati  / śe tṛmphādīnām upasaṅkhyānaṃ
    kartavyam  / ke punaḥ tṛmphādayaḥ ? tṛpha tṛmpha tṛptau dṛpha ḍrmpha utkleśe,
    gupha gumpha granthe, ubha umbha pūraṇe, śubha śumbha śobhārthe ity atra ye sānuṣaṅgāḥ
    tṛmphādayaḥ teṣām aniditāṃ hala upadhāyāḥ kṅiti (*6,4.24) iti anunāsikalope kṛte
    num vidhīyate, sa ca vidhānasāmarthyāt na lupyate  / tṛmphati  / dṛmphati  / gumphati  /
    umbhati  / śumbhati  / ye tu niranuṣaṅgāḥ teṣāṃ tṛphati, dṛphati, guphati, ubhati,
    śubhati ity evaṃ bhavati //
