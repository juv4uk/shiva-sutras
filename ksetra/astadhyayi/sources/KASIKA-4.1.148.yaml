source_id: KASIKA-4.1.148
locator:
  sutra: 4.1.148
witness_text:
  sutra: vṛddhāṭ ṭhak sauvīreṣu bahulam
  commentary: kutsane ity eva  / sauvīreṣu iti prakṛti-viśeṣaṇam  / vṛddhāt sauvīragotrād
    apatye bahulaṃ ṭhak pratyayo bhavati kutsane gamyamane  / bhāgavitteḥ bhāgavittikaḥ  /
    tārṇabindavasya tārṇabindavikaḥ  / pakṣe yathāprāptaṃ phak, bhāgavittāyanaḥ  /
    pakṣe tārṇabindaviḥ  / akaśāpaḥ śubhrādiḥ, ākaśāpeyaḥ  / tasya apatyam ākaśāpeyikaḥ  /
    pakṣe ākaśāpeyiḥ  / bhāgapūrvapado vittir dvitīyas tārṇabindavaḥ  / tṛtīyas tvākaśāpeyo
    gotrāṭ ṭhag bahulaṃ tataḥ // vṛddha-grahaṇaṃ strī-nivṛtty-artham  / sauvīreṣu
    iti kim ? aupagavirjālmaḥ  / kutsane ity eva, bhāgavittāyano māṇavakaḥ  / bahula-grahaṇam
    upādhivaicitrya-artham  / gotrastriyāḥ ity ārabhya catvāro yogās teṣu prathamaḥ
    kutsana eva, antyaḥ sauvīragotra eva, madhyamau dvayor api  / tad etad bahula-grahaṇāl
    labhyate //
