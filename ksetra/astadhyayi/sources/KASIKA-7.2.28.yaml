source_id: KASIKA-7.2.28
locator:
  sutra: 7.2.28
witness_text:
  sutra: ruṣy-ama-tvara-saṅghuṣa-āsvanām
  commentary: vā iti vartate  / ruṣi ama tvara saṅghuṣa āsvana ity eteṣāṃ niṣṭhāyāṃ
    vā iḍāgamo na bhavati  / ruṣṭaḥ ruṣitaḥ  / ti-iṣa-saha-lubha-ruṣa. riṣaḥ (*4,2.48)
    iti vikalpavidhānāt yasya vibhāṣā (*7,2.15) iti pratiṣedhe prāpte vikalpārthaṃ
    vacanam  / ama - abhyāntaḥ, abhyamitaḥ  / tvara - tūrṇaḥ, tvaritaḥ  / āditaś ca
    (*7,2.16) iti pratiṣedhe prāpte vacanam  / saṅghuṣa - saṅghuṣṭau pādau, saṅghuṣitau
    pādau  / saṅghuṣṭaṃ vākyamāha, saṅghuṣitaṃ vākyamāha  / saṅghuṣṭau damyau, saṅghuṣitau
    damyau  / sampūrvasya ghuṣer aviśaddane 'pi paratvād ayam eva vikalpo bhavati  /
    āsvana - āsvānto devadattaḥ, āsvanito devadattaḥ  / āsvāntaṃ manaḥ, āsvanitaṃ
    manaḥ  / āṅpūrvasya svaner mano 'bhidhāne 'pi paratvādayaṃ vikalpaḥ kṣubdhasvānta
    iti nipātanaṃ bādhate //
