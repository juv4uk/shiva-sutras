witness_text:
  sutra: aplutavad-upasthite
  commentary: upasthitaṃ nāma anārṣaḥ atikaraṇaḥ, samudāyād avacchidya padaṃ yena
    svarūpe 'vasthāpyate  / tasmin parataḥ plutaḥ aplutavad bhavati  / plutakāryaṃ
    prakṛtibhāvaṃ na karoti  / suśloka3 iti suśloketi  / sumaṅgala3 iti sumaṅgaleti  /
    vatkaraṇaṃ kim ? apluta iti ucyamāne pluta eva pratiṣidyate  / tatra ko doṣaḥ
    ? pragṛhyāśraye prakṛtibhāve plutasya śravaṇaṃ na syāt, agnī3 iti, vāyū3 iti //
    [#630]
