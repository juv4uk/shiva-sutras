source_id: KASIKA-4.1.178
locator:
  sutra: 4.1.178
witness_text:
  sutra: na prācya-bharga-ādi-yaudheya-ādibhyaḥ
  commentary: prācyebhyaḥ bhargādibhyaḥ yaudheyādibhyaś ca utpannasya lugna bhavati  /
    ataś ca (*4,1.177) ity anena striyāṃ luk prāptaḥ pratiṣidhyate  / prācyebhyaḥ
    kṣatriyebhyas tāvat - pāñcālī  / vaidehī  / āṅgī  / vāṅgī  / magadhī  / bhargādibhyaḥ
    - bhārgī  / kārūṣī  / kaikeyī  / yaudheyādibhyaḥ - yaudheyī  / śaubhreyī  / śaukreyī  /
    kasya punar akārasya pratyayasya yaudheyādibhyo luk prāptaḥ pratiṣidhyate ? pāñcamikasyañaḥ,
    parśvādiyaudheyādibhyām anañau ity etasya  / kathaṃ punas tasya bhinnaprakaraṇasthasya
    anena luk prāpnoti ? etad eva vijñāpayati pāścamikasya api tadrājasya ataś ca
    ity anena lug bhavati iti  / kim etasya jñāpanena prayojanam ? parśvādyāṇaḥ striyāṃ
    luk siddho bhavati  / parśūḥ  / rakṣāḥ  / asurī  / tathā ca+uktaṃ yaudheyādi-pratiṣedho
    jñāpakaḥ parśvādyaṇo luk iti  / [#362] bharga  / karūṣa  / kekaya  / kaśmīra  /
    sālva  / susthāla  / uraśa  / kauravya  / iti bhargādiḥ  / yaudheya  / śaubhreya  /
    śaukreya  / jyābāneya  / dhārteya  / dhārteya  / trigarta  / bharata  / uśīnara  /
    yaudheyādiḥ // iti śrījayādityaviracitāyām kāśikāyāṃ vṛttau caturthādhyāyasya
    prathamaḥ pādaḥ // caturthādhyāyasya dvitīyaḥ pādaḥ  / [#363]
