source_id: KASIKA-1.3.10
locator:
  sutra: 1.3.10
witness_text:
  sutra: yathā-saṅkhyam anudeśaḥ samānām
  commentary: saṅkhyā-śabdena kramo lakṣyate  / yathā-saṅkhyaṃ yathā-kramam anudeśo
    bhavati  / anudiśyate iti anudeśaḥ  / paścād uccāryate ity arthaḥ  / samānāṃ samasaṅkhyānaṃ
    samaparipahitānām uddeśinām anudeśināṃ ca yathā-kramamauddeśibhir anudeśinaḥ sambadhyante  /
    tūdī-śalātura-varmatī-kūcavārāḍ ḍhak-chaṇ-ḍhañ-yakḥ (*4,3.94)  / prathamāt prathamaḥ,
    dvitīyād dvitīyaḥ ity ādi  / taudeyaḥ  / śālāturīyaḥ  / vārmateyaḥ  / kaucavāryaḥ  /
    samānām iti kim ? lakṣaṇa-ittham-bhūta-ākhyāna-bhāga. vīpsāsu prati-pary-anavaḥ
    (*1,4.90)  / lakṣaṇādayaś catvāro 'rthāḥ, pratyādayas trayaḥ, sarveṣaṃ sarvatra
    karmapravacanīya-sañjñā bhavati  / iha kasmān na bhavati veśo-yaśa-āder bhagād
    yal (*4,4.131) kha ca (*4,4.132) iti ? svaritena liṅgena yathā-saṅkhyam  / yatra
    eṣyate, tatra svaritatvaṃ na pratijñāyate  / svaritena adhikāraḥ (*1,3.11) iti
    svarita-grhaṇaṃ pūrveṇa api sambadhyate //
