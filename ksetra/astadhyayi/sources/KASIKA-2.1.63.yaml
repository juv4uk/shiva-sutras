witness_text:
  sutra: katara-katamau jātiparipraśne
  commentary: katara-katamau jātiparipraśne vṛtamānau samarthena supā saha samasyete,
    tatpuruṣaś ca samāso bhavati  / katarakaṭhaḥ  / katarakālāpaḥ  / katamakaṭhaḥ  /
    katamakālāpaḥ  / nanu katama-śabdastāvaj jātiparipraśna eva vyutpāditaḥ, katara-śabdo
    'pi sāhacaryāt tadartha-vṛttir eva grahīṣyate, kiṃ jātiparipraśna-grahaṇena ?
    evaṃ tarhy etaj jñāpayati katama-śabdo 'nyatra api vartate iti  / tathā ca pratyudāharanam
    - kataro bhavator devadattaḥ, katamo bhavatāṃ devadattaḥ //
