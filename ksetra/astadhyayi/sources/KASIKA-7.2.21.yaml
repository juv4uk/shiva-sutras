source_id: KASIKA-7.2.21
locator:
  sutra: 7.2.21
witness_text:
  sutra: prabhau parivṛḍhaḥ
  commentary: parivṛḍha iti nipātyate prabhuś ced bhavati  / parivṛḍhaḥ kuṭumbī  /
    pūrveṇa tulyam etat  / vṛṃher nipātanam  / vṛhiśca yadi prakṛtiyantaram asti tasya
    api tad eva sarvam  / halopanipātanasya ca tad eva prayojanam  / parivraḍhayati  /
    parivraḍhyya gataḥ  / pārivṛḍhī kanyā  / parivṛḍhamācaṣṭe iti vigṛhya vṛḍhaśabdād
    eva ṇijutypadyate  / saṃgrāmayater eva sopasargāṇ ṇijutpattir iṣyate na anyasmāt
    iti  / tathā sati parivraḍhayati iti tiṅṅatiṅaḥ (*8,2.28) iti nighātaḥ  / parivraḍhayya
    ity atra pariśabdasya ktvāpratyayāntena samāse sati lyabādeśaḥ siddho bhavati  /
    prabhau iti kim ? parivṛṃhitam  / parivṛhitam // [#806]
