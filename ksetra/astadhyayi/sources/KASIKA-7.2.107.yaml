locator:
  sutra: 7.2.107
witness_text:
  sutra: adasa au sulopaś ca
  commentary: adasaḥ sau parataḥ sakārasya aukārādeśo bhavati sośca lopo bhavati  /
    asau  / [#828] autvapratiṣedhaḥ sākackād vā vaktavyaḥ sādutvaṃ ca  / yadā ca autvapratiṣedhaḥ
    tadā sakārād uttarasya utvaṃ bhavati  / asukaḥ  / asukau  / uttarapadabhūtānāṃ
    tyadādīnām akṛtasandhīnām ādeśā vaktavyāḥ  / paramāham  / paramāyam  / paramānena  /
    adasaḥ sorbhavedautvaṃ kiṃ sulopo vidhīyate  / hrasvāl lupyeta sambuddhir na halaḥ
    prakṛtaṃ hi tat // āpa etvaṃ bhavet tasmin na jhalītyanuvartanāt  / pratyayasthācca
    kāditvaṃ śībhāvaś ca prasajyate //
