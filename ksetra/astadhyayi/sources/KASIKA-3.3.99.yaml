locator:
  sutra: 3.3.99
witness_text:
  sutra: sañjñāyāṃ sam-aja-niṣada-nipata-mana-vida-ṣuñ-śīṅ-bhṛñ-iṇaḥ
  commentary: bhāve iti na svaryate  / pūrva eva atra arthādhikāraḥ  / samajādibhyo
    dhātubhyaḥ striyāṃ kyap pratyayo bhavati udāttaḥ sañjñāyāṃ viṣaye  / samajanti
    asyāmiti samajyā  / [#273] niṣadyā  / nipatyā  / manyā  / vidyā  / sutyā  / śayyā  /
    bhṛtyā  / ityā  / kathaṃ taduktam striyāṃ bhāvādhikāro 'sti tena bhāryā prasidhyati
    iti ? bhāvādhikāro bhāvavyāpāraḥ vācyatvena vivakṣitaḥ, na tu śāstrīyo 'dhikāraḥ
    //
