witness_text:
  sutra: śaradvac-chunaka-darbhād bhṛgu-vatsa-āgrāyaṇeṣu
  commentary: gotre ity eva  / śaradvat śunaka darbha ity etebhyo gotrāpatye phak
    pratyayo bhavati yathāsaṅkhyaṃ bhṛguvatsāgrāyaṇeṣu artheṣu apatya-viśeṣeṣu  /
    śāradvatāyano bhavati bhārgavaś cet  / śāradvato 'nyaḥ  / śaunakāyano bhavati
    vātsyaś cet  / śaunako 'nyaḥ  / dārbhāyaṇo bhavati āgrāyaṇaś cet  / dārbhiranyaḥ  /
    śaradvac-chunaka-śabdau bidādī  / tābhyām año 'pavādaḥ phak //
