source_id: KASIKA-5.2.68
locator:
  sutra: 5.2.68
witness_text:
  sutra: sasyena parijātaḥ
  commentary: kan pratyayaḥ ity eva svaryate, na ṭhak  / nirdeśād eva tṛtīyāsamarthavibhaktiḥ  /
    sasya-śabdāt tṛtīyāsamarthāt parijātaḥ ity asminn arthe kan pratyayo bhavati  /
    sasyaśabdo 'yam guṇavāci  / pariḥ sarvato bhāve vartate  / yo guṇaiḥ sambaddho
    jāyate, yasya kiñcid api vaiguṇyaṃ na asti, tasya+idam abhidhānam  / sasyena parijātaḥ
    sasyakaḥ śālika  / sasyakaḥ sādhuḥ  / sasyako maṇiḥ  / ākaraśuddha ity arthaḥ
    //
