source_id: KASIKA-6.3.42
locator:
  sutra: 6.3.42
witness_text:
  sutra: puṃvat karmadhāraya-jātīya-deśīyeṣu
  commentary: karmadharaye samāse jātīya deśīya ity etayoś ca pratyayayoḥ bhāṣitapuṃskādanūṅ
    striyāḥ puṃvad bhavati  / pratiṣedhartho 'yam ārambhaḥ  / na kopadhāyāḥ (*6,3.37)
    ity uktam, tatra api bhavati  / pācakavṛndārikā  / pācakajātīyā  / pācakadeśīyā  /
    sañjñāpūraṇyoś ca (*6,3.38) ity uktam, tatra api bhavati  / dattavṛndārikā  /
    dattajātīyā  / dattadeśīyā  / pūraṇyāḥ - pañcamavṛndārikā  / pañcamajātīyā  /
    pañcamadeśīyā  / vṛddhinimittasya ca taddhitasyāraktavikare (*6,3.39) ity uktam,
    tatra api bhavati  / sraughnajātīyā  / sraughnadeśīyā  / svāṅgāc ca+ito 'mānini
    (*6,3.40) ity uktam, tatra api bhavati  / ślakṣṇamukhavṛndārikā  / ślakṣṇamukhajātīyā  /
    ślakṣṇamukhadeśīyā  / jāteś ca (*6,3.41) ity uktam, tatra api bhavati  / kaṭhavṛndārikā  /
    kaṭhajātīyā  / kaṭhadeśīyā  / bhāṣitapuṃskkāt ity eva, khaṭvāvṛndārikā  / anūg
    ity eva, brahmabandhūvṛndārikā  / [#710] kukkuṭyādīnāmaṇḍādiṣu puṃvadbhāvo vaktavyaḥ  /
    kukkuṭyāḥ aṇḍam kukkuṭāṇḍam  / mṛgyāḥ padam mṛgapadam  / mṛgyāḥ kṣīram mṛgakṣīram  /
    kākyāḥ śāvaḥ kākaśāvaḥ  / na vā astrīpūrvapadasya vivakṣitatvāt  / strītvena vinā
    pūrvapadārtho 'tra jatiḥ sāmānyena vivakṣitaḥ  / puṃvadbhāvāt hrasvatvam khidghādiṣu
    bhavati vipratiṣedhena  / khit - kālimmanyā  / hariṇimmanyā  / ghādi - paṭvitarā  /
    paṭvitamā  / paṭvirūpā  / paṭvikalpā  / ka - paṭvikā  / mṛdvikā  / iha iḍabiḍ,
    darad, pṛthu, uśij ity ete janapadaśabdāḥ kṣatriyavācinaḥ, tatra tadrājapratyayasya
    striyamataśca iti luki kṛte iḍabiḍvṛndārikā iti vigṛhya samāsaḥ kriyate  / tataḥ
    puṃvadbhavena aiḍabiḍādayaḥ puṃśabdāḥ kriyante  / aiḍabiḍavṛndārikā  / auśijavṛndārikā
    //
