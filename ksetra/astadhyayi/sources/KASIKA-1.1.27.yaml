source_id: KASIKA-1.1.27
locator:
  sutra: 1.1.27
witness_text:
  sutra: sarva-ādīni sarvanāmāni
  commentary: sarva-śabdaḥ ādir yeṣāṃ tāni-imāni sarva-adīni sarvanāma-sañjñāni bhavanti  /
    sarvaḥ, sarvau, sarve  / sarvasmai  / sarvasmāt  / sarveṣām  / sarvasmin  / sarvakaḥ  /
    viśvaḥ, viśvau, visve  / viśvasmai  / viśvasmāt  / viśveṣām  / viśvasmin  / viśvakaḥ  /
    [#14] ubha  / ubhaya  / ubha-śabdasya sarvanāmatve prayojanam-- sarvanāmnas-tṛtīya
    ca (*2,3.27) iti  / ubhābhyāṃ hetubhyāṃ vasati, ubhayoḥ hetvoḥ vasati  / ubhaye  /
    ubhayasmai  / ubhayasmāt  / ubhyeṣām  / ubhayasmin  / ḍatara, ḍatama  / katara,
    katama  / katarasmai, katamasmai  / itara  / anya  / anyatara  / itarasmai  /
    anyasmai  / anyatarasamai  / tva-śabdo 'nya-vācī svara-bhedād dviḥ paṭhitaḥ  /
    ekaḥ udāttaḥ  / dvitīyo 'nudāttaḥ  / kecit takārāntamekaṃ paṭhanti  / tva tvat
    iti dvāv api ca anudātāu iti smaranti  / nema--nemasmai  / vakṣyamāṇena jasi vibhāṣā
    bhavati  / neme, nemāḥ iti  / sama--samasmai  / kathaṃ yathā-saṅkhyam anudeśaḥ
    samānām (*1,3.10), same deśe yajeta iti  / samasya sarva-śabda-paryāyasya sarvanāma-sñjñā
    iṣyte, na sarvatra  / sima--simasmai  / pūrva-para-avara-dakṣiṇa-uttara-apara-adharāṇi
    vyavasthāyām asañjñāyām (*1,1.34)  / svam añjñāti-dhana-ākhyām (*1,1.35)  / antaraṃ
    bahiryogopsaṃvyānayoḥ (*1,1.36)  / tyad, tad, yad, etad, idam, adas, eka, dvi,
    yuṣmad, asmad, bhavatu, kim  / sarvādiḥ  / sarvanāma-pradeśāḥ-- sarvanāmnaḥ smai
    (*7,1.14) ity evam ādayaḥ //
