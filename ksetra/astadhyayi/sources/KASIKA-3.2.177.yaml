locator:
  sutra: 3.2.177
witness_text:
  sutra: bhrāja-bhāsa-dhurvi-dyuta-urji-pṝ-jugrāvastuvaḥ kvip
  commentary: bhrājādibhyaḥ dhātubhyas tacchīlādiṣu kartṛṣu kvip pratyayo bhavati  /
    vibhrāṭ, vibhrājau, vibhrājaḥ  / bhāḥ, bhāsau, bhasaḥ  / dhūḥ, dhurau, dhuraḥ  /
    vidyut, vidyutau, vidyutaḥ  / ūrk, ūrjau, ūrjaḥ  / pūḥ, purau, puraḥ  / javater
    dīrghaś ca nipātyate  / jūḥ juvau, juvaḥ  / grāvastut, grāvastutau, grāvastutaḥ  /
    kimartham idam ucyate, yāvatā anyebhyo 'pi dṛśyante (*3,2.75), kvip ca (*3,2.76)
    iti kvip siddha eva ? tācchīlikair bādhyate  / vā 'sarūpavidhir na asti ity uktam  /
    atha tu prāyikam etat  / tatas tasya+eva ayaṃ prapñcaḥ //
