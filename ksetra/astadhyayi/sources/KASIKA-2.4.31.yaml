witness_text:
  sutra: ardharcāḥ puṃsi ca
  commentary: ardharcādayaḥ śabdāḥ puṃsi napuṃsake ca bhāṣyante  / ardharcaḥ  / ardharcam  /
    gomayaḥ  / gomayam  / [#161] śabda-rūpa-āśrayā ca+iyaṃ dvi-liṅgatā kvacid arthabhedena
    api vyavatiṣṭhate, yathā - paḍmaśaṅkha-śabdau nidhi-vacanau puṃliṅgau, jalaje
    ubhaya-liṅgau  / bhūta-śabdaḥ piśāce ubhaya-liṅgaḥ, kriyā-śabdasya abhidheyavalliṅgam  /
    saindhava-śabdo lavaṇe ubhayaliṅgaḥ, yaugikasya abhidheyavalliṅgam  / sāra-śabda
    utkarṣe puṃliṅgaḥ, nyāyādanapete napuṃsakam, naitat sāram iti  / dharmaḥ ity apūrve
    puṃliṅgaḥ, tatsādhane napuṃsakam  / tāni dharmāṇi prathamānyāsan  / ardharca  /
    gomaya  / kaṣāya  / kārṣāpaṇa  / kutapa  / kapāṭa  / śaṅkha  / cakra  / gūtha  /
