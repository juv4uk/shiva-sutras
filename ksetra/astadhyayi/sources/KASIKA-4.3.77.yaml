witness_text:
  sutra: vidyā-yoni-sambandhebhyo vuñ
  commentary: vidyā-yoni-kṛtaḥ sambandho yeṣāṃ te vidyā-yoni-sambandhāḥ  / tadvācibhyaḥ
    śabdebhyo vuñ pratyayo bhavati tata āgataḥ ity etasmin viṣaye  / aṇo 'pavādaḥ  /
    chaṃ tu paratvād bādhate  / vidyā-sambandhebhyas tāvat - upādhyāyād āgataṃ aupādhyāyakam  /
    śauṣyakam  / ācāryakam  / yoni-sambandhebhyaḥ - mātāmahakaḥ  / paitāmahakaḥ  /
    mātulakaḥ //
