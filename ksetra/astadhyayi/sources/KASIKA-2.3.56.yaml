source_id: KASIKA-2.3.56
locator:
  sutra: 2.3.56
witness_text:
  sutra: jāsi-niprahaṇa-nāṭa-krātha-piṣāṃ hiṃsāyām
  commentary: jāsi niprahaṇa nāṭa krātha piṣ ity eteṣāṃ dhātūnāṃ hiṃsā-kriyāṇāṃ karmaṇi
    kārake ṣaṣṭhī vibhaktir bhavati  / jasu hiṃsāyām, jasu tāḍane iti ca curādau paṭhyate,
    tasya+idaṃ grahaṇaṃ, na daivādikasya jasu mokṣaṇe ity asya  / caurasya+ujjāsayati  /
    vṛṣalasya+ujjāsayati  / niprahaṇa iti sagghātavigṛhītaviparyastasya grahaṇam  /
    caurasya niprahati  / caurasya nihanti  / caurasya prahanti  / caurasya praṇihanti  /
    caurasya+unnāṭayati  / vṛṣalasya+unnāṭayati  / caurasya+utkrāthāyati  / vṛṣalasya
    krāthayati  / nipātanād vṛddhiḥ  / ayaṃ hi ghaṭādau paṭhyate, śratha knatha kratha
    klatha hiṃsa-arthāḥ iti  / tatra ghaṭādayo mitaḥ iti mitsañjñāyāṃ mitāṃ hrasvaḥ
    (*6,4.92) iti hrasvatvaṃ syāt  / caurasya pitaṣṭi  / vṛṣalasya pinaṣṭi  / hiṃsāyām
    iti kim ? dhānāḥ pinaṣṭi  / śeṣe ity eva, cauram ujjāsayati  / eśām iti kim ?
    cauraṃ hinasti  / niprahaṇa iti kim ? cauraṃ vihanti // [#147]
