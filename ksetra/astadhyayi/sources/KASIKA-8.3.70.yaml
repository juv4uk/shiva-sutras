source_id: KASIKA-8.3.70
locator:
  sutra: 8.3.70
witness_text:
  sutra: parinivibhyaḥ seva-sita-saya-sivu-saha-suṭ-stu-svañjām
  commentary: pari ni vi ity etebhyāḥ upasargebhyaḥ uttareṣām seva sita saya sivu
    saha suṭ stu svañja ity eteṣām sakārasya mūrdhanya ādeśaḥ bhavati  / pariṣevate  /
    niṣevate  / viṣevate  / paryaṣevata  / nyaṣevata  / vyaṣevata  / pariṣiṣeviṣate  /
    niṣiṣeviṣate  / viṣiṣeviṣate  / sita - pariṣitaḥ  / niṣitaḥ  / viṣitaḥ  / saya
    - pariṣayaḥ  / niṣayaḥ  / viṣayaḥ  / siv - pariṣīvyati  / niṣīvyati  / viṣīvyati  /
    paryaṣīvyat  / nyaṣīvyat  / vyaṣīvyat  / paryasīvyat  / nyasīvyat  / vyasīvyat  /
    saha - pariṣahate  / niṣahate  / viṣahate  / paryaṣahata  / nyaṣahata  / vyaṣahata  /
    paryasahata  / nyasahata  / vyasahata  / suṭ - pariṣkaroti  / paryaṣkarot  / paryaskarot  /
    stu - pariṣṭauti  / niṣṭauti  / viṣṭauti  / paryaṣṭaut  / nyaṣṭaut  / vyaṣṭaut  /
    paryastaut  / nyastaut  / vyastaut  / svañja - daṃśasañjasvañjām iti nalopaḥ  /
    pariṣvajate  / niṣvajate  / viṣvajate  / paryaṣvajata, paryasvajata  / pūrveṇa+eva
    siddhe stusvañjigrahaṇam uttarārtham, aḍvyavāye vibhāṣā yathā syāt //
