source_id: KASIKA-5.2.66
locator:
  sutra: 5.2.66
witness_text:
  sutra: svāṅgebhyaḥ prasite
  commentary: tatra ity eva, kan iti ca  / svāṅgavācibhyaḥ śabdebhyaḥ tatra iti saptamīsamarthebhyaḥ
    prasite ity etasminn arthe kan pratyayo bhavati  / prasitaḥ prasaktas tatparaḥ
    ity arthaḥ  / keśeṣu prasitaḥ keśakaḥ  / keśādiracanāyāṃ prasakta evam ucyate  /
    bahuvacanaṃ svāṅga-samudāya-śabdād api yathā syāt  / dantauṣṭhakaḥ  / keśanakhakaḥ
    //
