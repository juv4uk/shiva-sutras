source_id: KASIKA-8.2.37
locator:
  sutra: 8.2.37
witness_text:
  sutra: ekāco baśo bhaṣ jhaṣantasya s-dhvoḥ
  commentary: dhātor avayavo ya ekāc jhaṣantaḥ tadavayavasya baśaḥ sthāne bhaṣ ādeśo
    bhavati jhali sakāre dhvaśabde ca parataḥ padānte ca  / atra catvaro baśaḥ sthānino
    bhaṣādeśāścatvāra eva, tatra saṅkhyātānudeśe prāpte ḍakārasya sthānino 'bhāvāt
    ḍhakārādeśo na bhavati ? āntaryato vyavasthā vijñāsyate  / budha - bhotsyante  /
    abhuddhvam  / arthabhut  / guha - nighokṣyate  / nyaghūḍhvam  / parṇaghuṭ  / duha
    - dhokṣyate  / adhugdhvam  / godhuk  / ajarghāḥ - gudheḥ yaṅlugantasya laṅi sipi
    labhūpadhaguṇe kṛte sipo halṅyādilope ca dhātoḥ avayavasya ekāco baśaḥ sthāne
    bhaṣbhāvaḥ, tato dhakārasya jaśtvam, daś ca (*8,2.75) iti rutvam, ro ri (*8,3.14)
    iti pūrvarephasya lopaḥ, ḍhralope pūrvasya dīrgho 'ṇaḥ (*6,3.111) iti dīrghatvam  /
    gadarbhayateḥ apratyayaḥ - gardhap  / ekācaḥ iti kim ? dāmaliham icchati dāmalihyati,
    dāmalihyater apratyayaḥ, dāmaliṭ  / asati hy ekājgrahaṇe dhātoḥ ity etad baśo
    viśeṣaṇaṃ syāt  / baśaḥ iti kim ? krudha - krotsyati  / jhaṣantasya iti kim ?
    dāsyati  / sdhvoḥ iti kim ? boddhā  / voddhum  / boddhavyam  / dhakārasya bakāropasṛṣṭasya
    grahaṇaṃ kim ? dādaddhi  / dadha dhāraṇe ity etasya yaṅluki loṭi hujhalbhyo herdhiḥ
    (*6,4.101) iti dhibhāve saty etad bhavati //
