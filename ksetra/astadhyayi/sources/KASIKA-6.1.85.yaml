source_id: KASIKA-6.1.85
locator:
  sutra: 6.1.85
witness_text:
  sutra: antādivac ca
  commentary: ekaḥ iti vartate, pūrvaparayoḥ iti ca  / ekaḥ pūrvaparayoḥ (*6,1.84)
    iti yo 'yam ekādeśo vidhīyate sa pūrvasya antavad bhavati, parasyādivad bhavati  /
    yathā tasyāntaḥ ādir vā tadantarbhūtaḥ tadgrahaṇena gṛhyate, tadvadekādeśo 'pi
    tadgrahaṇena grhyate ity eṣo 'tideśārthaḥ  / brahmabandhūḥ ity atra brahmabandhu
    iti prātipadikam, ūṅ iti aprātipadikam, tayoḥ prātipadikāprātipadikayor yaḥ ekādeśaḥ
    sa prātipadikasya antavad bhavati, yathā śakyate kartuṃ ṅyāp prātipadikāt (*4,1.1)
    iti svādividhiḥ  / vṛkṣau ity atra subaukāraḥ asubakāraḥ, tayoḥ subasupor ekādeśaḥ
    supaḥ ādivad bhavati, yathā śakyate vaktuṃ subantaṃ padam iti  / varṇāśrayavidhau
    ayam anatādivadbhāvo nisyate  / tathā hi khaṭvābhiḥ ity atra antavadbhāvābhāvāt
    ato bhisa ais (*7,1.9) iti na bhavati  / hvayateḥ juhāva iti samprasāraṇapūrvatvasya
    ādivadbhāvāhāvāt āta au ṇalaḥ (*7,1.34) iti na bharvāta  / asyai aśvaḥ, asyā aśvaḥ
    iti vṛddhir eci (*6,1.88) iti vṛddhiḥ, eṅaḥ padāntādati (*6,1.109) ity atra vidhau
    ādivan na bhavati  / pūrvaparasamudāya ekādeśasya sthānī, sa hi tena nivartayate  /
    tatra avayavayor ānumānikaṃ sthānitvam iti tadāśrayaṃ kāryaṃ sthānivadbhāvād aprāptam
    ity antādivadbhāvo vidhīyate //
