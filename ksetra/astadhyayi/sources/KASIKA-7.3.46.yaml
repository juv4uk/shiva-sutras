source_id: KASIKA-7.3.46
locator:
  sutra: 7.3.46
witness_text:
  sutra: udīcāmātaḥ sthāne yakapūrvāyāḥ
  commentary: udīcām ācāryāṇāṃ matena yakārapūrvāyāḥ kakārapūrvāyāś ca ātaḥ sthāne
    yo 'kāraḥ, tasyātaḥ sthāne ikarādeśo bhavati  / udīcāṃ grahaṇaṃ vikalpārtham  /
    ibhyikā, ibhyakā  / kṣatriyikā, kṣatriyakā  / kakārapūrvāyāḥ - caṭakikā, caṭakakā  /
    mūṣikikā, mūṣikakā  / ātaḥ iti kim ? sāṅkāśye bhavā sāṅkāśyikā  / sthānagrahaṇam
    anuvāde 'pi sthānasambandhapratipattyartham  / ātaḥ ity anena hy ataḥ iti sthānī
    viśiṣyate  / yakapūrvāyāḥ iti kim ? aśvā - aśvikā  / yakapūrvāyāḥ iti strīliṅganirdeśaḥ
    ātaḥ strīpratyayasya pratipattyartham  / iha na bhavati, śubhaṃ yāti iti śubhaṃyāḥ
    - śubhaṃyikā  / bhadraṃ yāti iti bhadraṃyā - bhadraṃyikā  / [#844] yakapūrvāyā
    dhātvantapratiṣedhaḥ  / dhātvantayoḥ yakārakakārayor asya pratiṣedhasya pratiṣedho
    vaktavyaḥ  / sunayikā  / suśayikā  / supākikā  / aśokikā //
