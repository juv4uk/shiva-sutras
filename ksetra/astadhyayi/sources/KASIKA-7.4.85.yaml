source_id: KASIKA-7.4.85
locator:
  sutra: 7.4.85
witness_text:
  sutra: nug ato 'nunāsikāntasya
  commentary: anunāsikāntasya aṅgasya yo 'bhyāsaḥ tasya akārāntasya nugāgamo bhavati
    yaṅyaṅlukoḥ parataḥ  / tantanyate  / tantanīti  / jaṅgamyate  / jaṅgamīti  / yaṃyamyate  /
    yaṃyamīti  / raṃramyate  / raṃramīti  / nuk ity etad anusvāropalakṣaṇārthaṃ draṣṭavyam  /
    sthāninā hi ādeśo lakṣyate  / tena yaṃyamyate ity evam ādau ajhalparatve 'pi anusvāro
    bhavati  / padāntavacceti vaktavyam  / vā padāntasya (*8,4.59) iti parasavarnavikalpo
    yathā syāt iti  / ataḥ iti kim ? tetimyate  / taparakaraṇaṃ tu bhūtapūrvasya api
    dīrghasya nivṛttyartham, bābhamyate  / anunāsikāntasya iti kim ? pāpacyate //
