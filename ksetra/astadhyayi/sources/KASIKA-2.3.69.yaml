source_id: KASIKA-2.3.69
locator:
  sutra: 2.3.69
witness_text:
  sutra: na la-u-uka-avyaya-niṣṭhā-khalartha-tṛnām
  commentary: kartṛ-karmaṇoḥ kṛti (*2,3.65) iti prāptā ṣaṣṭhī pratiṣidhyate  / la
    u uka avyaya niṣṭhā khalartha tṛn ity eteṣāṃ prayoge ṣaṣṭhī vibhaktir na bhavati  /
    la iti śatṛśānacau, kānac-kvasū, kikinau ca gṛhyante  / odanaṃ pacan  / odanaṃ
    pacamānaḥ  / odanaṃ pecānaḥ  / odanaṃ pecivān  / papiḥ somaṃ dadirgāḥ  / u - kaṭaṃ
    cikīrṣuḥ  / odanaṃ bubhukṣuḥ  / kanyāmalaṅkariṣṇuḥ  / iṣṇuco 'pi prayoge niṣedhaḥ  /
    uka - āgāmukaṃ vārāṇasīṃ rakṣa ahuḥ  / ukapratiṣedhe kamer bhāṣāyām apratiṣedhaḥ  /
    dāsyāḥ kāmukaḥ  / avyaya - kaṭaṃ kṛtvā  / odanaṃ bhuktvā  / avyaya-pratiṣedhe
    tosuṅkasunorapratiṣedhaḥ  / vyuṣṭāyāṃ purā sūryasyodetoradheyaḥ  / purā krūrasya
    visṛpo virapśin  / niṣṭhā - odanaṃ buktavān  / devadattena kṛtam  / khalartha
    - īṣatkaraḥ kaṭo bhavatā  / īṣatpānaḥ somo bhavatā  / tṛn iti prayāhāra-grahaṇam  /
    laṭaḥ śatṛ-śānacāv aprathamā. samānādhikaraṇe (*3,2.124) ity ārabhya ā tṛno nakārāt  /
    tena śānañcānaśśatṛtṛnām api pratiṣedho bhavati  / somaṃ pavamānaḥ  / naḍamāghnānaḥ  /
    adhīyan pārāyanam  / kartā kaṭān  / vaditā janāpavādān  / dviṣaḥ śaturvāvcanam  /
    cauraṃ dviṣan, caurasya dviṣan // [#151]
