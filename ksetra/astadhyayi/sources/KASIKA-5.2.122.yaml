source_id: KASIKA-5.2.122
locator:
  sutra: 5.2.122
witness_text:
  sutra: bahulaṃ chandasi
  commentary: chandasi viṣaye bahulaṃ viniḥ pratyayo bhavati matvarthe  / agne tejasvin  /
    na bhavati  / sūryo varcasvān  / chandasi viniprakaraṇe 'ṣṭrāmekhalādvayobhayarujāhṛdayānāṃ
    dīrghatvaṃ veti vaktavyam  / aṣṭrāvī  / mekhalāvī  / dvayāvī  / ubhayāvī  / rujāvī  /
    hṛdayāvī  / dvayobhayagṛdayāni dīrghatvaṃ prayojayanti  / marmaṇaś ca+iti vaktavyam  /
    marmāvī  / sarvatrāmayasya+upasaṅkhyānam  / chandasi bhāṣāyāṃ ca  / āmayāvī  /
    śṛṅgavṛndābhyāmārakan vaktavyaḥ  / śṛṅgārakaḥ  / vṛndārakaḥ  / phalabarhābhyāminac
    vaktavyaḥ  / phalinaḥ  / barhiṇaḥ  / [#527] hṛdayāccālur anyatarasyām  / hṛdayāluḥ,
    hṛdayī, hṛdayikaḥ, hṛdayavān  / śītoṣṇatṛprebhyastanna sahata ity āluc vaktavyaḥ  /
    śītaṃ na sahate śītāluḥ  / uṣṇāluḥ  / tṛprāluḥ  / tanna sahata iti himācceluḥ  /
    himaṃ na sahate himeluḥ  / balādūlac  / balaṃ na sahate balūlaḥ  / vātāt samūhe
    ca  / vātaṃ na sahata iti ca  / vātānāṃ samūhaḥ, vātaṃ na sahate iti vā vātūlaḥ  /
    parvamarudbhyāṃ tan vaktavyaḥ  / parvataḥ  / maruttaḥ  / arthāttadabhāva inirvaktavyaḥ  /
    arthī  / tadabhāve ity eva, arthavān  / tad etat sarvaṃ bahulagrahaṇena sampadyate
    //
