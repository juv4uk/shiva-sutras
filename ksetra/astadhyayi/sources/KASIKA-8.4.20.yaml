source_id: KASIKA-8.4.20
locator:
  sutra: 8.4.20
witness_text:
  sutra: antaḥ
  commentary: aniteḥ iti vartate  / upasargasthānnimittāt uttarasya anitinakārasya
    padānte vartamānasya ṇakārādeśo bhavati  / he prāṇ  / he parāṇ  / padāntasya iti
    pratiṣedhasya apavādo 'yam  / antaś ca padāpekṣo gṛhayate  / kecit tu pūrvasūtre
    eva etad antagrahaṇaṃ sāmīpyārtham abhisambadhnanti  / nimittasamīpasthaikavarṇavyavahitasya
    anitinakārasya padānte vartamānasya ṇakārādeśo yathā syāt  / iha mā bhūt, paryaniti
    iti  / tair dvitīyam api padāntasya ṇatvārtham antagrahaṇam āśrayitavyam eva  /
    yeṣāṃ tu paryaṇiti iti bhavitavyam iti darśanam, teṣāṃ pūrvasūtre na artho 'ntagrahaṇena
    //
