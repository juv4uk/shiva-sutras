source_id: KASIKA-8.2.107
locator:
  sutra: 8.2.107
witness_text:
  sutra: eco 'pragṛhyasya adūrādhdūte pūrvasya ardhasya ad uttarasya+idutau
  commentary: eco 'pragṛhyasya adūrād dhūte plutaviṣayasya ardhasya akāraḥ ādeśo bhavati,
    sa ca plutaḥ, uttarasye - kārokārāvādeśau bhavataḥ  / viṣayaparigaṇanaṃ kartavyam
    -- praśnāntābhipūjitavicāryamāṇapratyabhivadayājyānteṣv iti vaktavyam  / [#936]
    praśnānte - agama3ḥ pūrvā3n grāmā3n agnibhūtā3i, paṭā3u  / abhipūjite - bhadraṃ
    karoṣi māṇavaka3 agnibhūtā3i, paṭā3u  / vicāryamāṇe - hotavyaṃ dīkṣitasya gṛhā3i
    pratyabhivāde - āyuṣmān edhi agnibhūtā3i, paṭā3u  / yājyānte - ukṣannāya vaśānnāya
    somapṛṣṭhāya vedhase  / stovairvidhemāgnayā3i  / so 'yam ākaraḥ pluto yathāviṣayam
    udātto 'nudāttaḥ svarito veditavyaḥ  / idutau punar udāttāv eva bhavataḥ  / parigaṇanaṃ
    kim ? viṣṇubhūte viṣṇubhūte3 ghātayiṣyāmi tvā  / āgaccha bho māṇavaka viṣṇubhūte  /
    parigaṇane ca sati adūrād dhūte iti na vaktavyam  / padāntagrahaṇaṃ tu kartavyam  /
    iha mā bhūt, bhadraṃ karoṣi gauḥ iti  / apragṛhyasya iti kim ? śobhane khalu staḥ
    khaṭve3  / āmantrite chandasi plutavikaro 'yaṃ vaktavyaḥ  / agnā3i patnī vā3i
    //
