source_id: KASIKA-1.1.3
locator:
  sutra: 1.1.3
witness_text:
  sutra: iko guṇa-vṛddhī
  commentary: paribhāṣā iyaṃ sthāni-niyama-arthā  / aniyama-prasaṅge niyamo vidhīyate  /
    vṛddhi-guṇau svasañjñayā śiṣyamāṇau ikaḥ eva sthāne veditavyau  / vakṣyati --
    sārvadhātuka-ardhadhātukayoḥ (*7,3.84) aṅgasya guṇa iti  / sa iko eva sthāne viditavyaḥ  /
    nayati  / bhavati  / vṛddhiḥ khalv api -- akārṣīt  / [#7] ahārṣīt  / acaiṣīt  /
    anaiṣīt  / alāvīt  / astāvīt  / guṇa-vṛddhī svasañjñayā vidhīyete, tatra ikaḥ
    iti etad-upasthitaṃ draṣṭavyam  / kiṃ kṛtaṃ bhavati ? dvitīyayā ṣaṣṭhī prādurbhāvyate  /
    midimṛjipugantalaghaūpardhācchidṛśikṣiprakṣudreṣvaṅgena ig viśeṣyate  / jusi sārvadhātuka-ādi-guṇeṣu
    ika-aṅgaṃ viśeṣyate  / medyate  / abighayuḥ  / ikaḥ iti kim? ātsandhy-akṣara-vyañjanānāṃ
    mā bhūt  / yānam  / glāyati  / umbhitā  / punar guṇa-vṛddhi-grahaṇaṃ svasañjñyā
    vidhāne niyama-artham  / iha mā bhūt -- dyauḥ, panthāḥ, saḥ, imam iti //
