source_id: KASIKA-2.1.10
locator:
  sutra: 2.1.10
witness_text:
  sutra: akṣa-śalākā-saṅkhyāḥ pariṇā
  commentary: akṣa-śabdaḥ, śalākā-śabdaḥ, saṅkhyā-śabdaś ca pariṇā saha samasyante,
    avyayībhāvaś ca samāso bhavati  / kitavavyavahāre samāso 'yam iṣyate  / pañcikā
    nāma dyūtaṃ pañcabhir akṣaiḥ śalākābhir vā bhavati  / tatra yadā sarve uttānāḥ
    patanti avāñco vā, tadā pātyitā jyati, tasya+eva asya vipāto 'nyathā pāte sati
    jāyate  / akṣeṇa+idaṃ na tathā vṛttaṃ yathā pūrvaṃ jaye akṣapari  / śalākāpari  /
    ekapari  / dvipari  / tripari  / parameṇa catuṣpari  / pañcasutvekarūpāsu jaya
    eva bhaviṣyati  / akṣādayas tṛtīyāntāḥ pūrvoktasya yathā na tat  / kitavavyavahāre
    ca ekatve 'kṣaśalākayoḥ //
