source_id: KASIKA-4.1.78
locator:
  sutra: 4.1.78
witness_text:
  sutra: aṇ-iñor anārṣayor guru-upottamayoḥ ṣyaṅ gotre
  commentary: gotre yāv aṇiñau vihitāv anārṣau tadantayoḥ prātipadikayor gurūpottamayoḥ
    striyāṃ ṣyaṅ ādeśo bhavati  / nirdiṣyamānasya ādeśā bhavanti ity aṇiñor eva vijñāyate,
    na tu samudāyasya  / ṅakāraḥ sāmānya-grahaṇa-arthaḥ  / ṣakāras tadavighātārthaḥ,
    yaṅaś cāp (*4,1.74) iti  / uttama-śabdaḥ svabhāvāt triprabhṛtīnāmantyamakṣaramāha  /
    uttamasya samīpam upottamam  / guru upottamaṃ yasya tad gurūpottamaṃ prātipadikam  /
    karīṣasya+iva gandho 'sya karīṣagandhiḥ  / kumudagandhiḥ  / tasyāpatyam ityaṇ  /
    tasya ṣyaṅ ādeśaḥ  / kārīṣagandhyā  / kaumudagandhyā  / varāhasyāpatyam  / ata
    iñ (*4,1.95)  / vārāhiḥ  / tasya ṣyaṅ ādeśaḥ  / vārāhyā  / bālākyā  / aṇiñoḥ iti
    kim ? ṛtabhāgasyāpatyaṃ, badāditvādañ, ārtabhāgī  / gurūpottamādikaṃ sarvam asti
    iti na staṇiñau  / ṭiḍḍhāṇañ (*4,1.15) iti ṅīb eva bhavati  / anārṣayoḥ iti kim
    ? vāsiṣṭhī  / vaiśvāmitrī  / gurūpottamayoḥ iti kim ? aupagavī  / kāpaṭavī  /
    gotre iti kim ? tatra jātāḥ (*4,3.25) - āhicchatrī  / kānyakubjī //
