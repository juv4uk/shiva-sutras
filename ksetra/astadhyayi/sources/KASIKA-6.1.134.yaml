source_id: KASIKA-6.1.134
locator:
  sutra: 6.1.134
witness_text:
  sutra: so 'ci lope cet pādapūraṇam
  commentary: saḥ ity etasya aci parataḥ sulopo bhavati, lope sati cet pādaḥ pūryate  /
    sedu rājā kṣayate carṣaṇīnām  / sauṣadhīr anurudhyase  / lope cet pādapūraṇam
    iti kim ? sa iva vyāghro bhavet  / aci iti vaspaṣṭārtham  / pādagrahaṇena atra
    ślokapādasya api grahaṇaṃ kecid icchanti, tena+idaṃ siddhaṃ bhavati  / saiṣa dāśarathī
    rāmaḥ saiṣa rājā yudhiṣṭhiraḥ  / saiṣa karṇo mahātyāgī saiṣā bhīmo mahābalaḥ //
