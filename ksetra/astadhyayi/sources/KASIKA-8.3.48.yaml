source_id: KASIKA-8.3.48
locator:
  sutra: 8.3.48
witness_text:
  sutra: kaskādiṣu ca
  commentary: kaska ity evam ādisu ca visarjanīyasya sakāraḥ vā yathāyogamādeśo bhavati
    kupvoḥ parataḥ  / kaskaḥ  / kautaskutaḥ  / kuta āgataḥ ityaṇ  / bhrātuṣputraḥ  /
    śunaskarṇaḥ  / sadyaskālaḥ  / sadyaskrīḥ  / krīṇāter ayaṃ sampadāditvāt kvip pratyayaḥ,
    tatra bhavaḥ kratuḥ sādyaskraḥ  / kāṃskān, kānāmreḍite (*8,3.12) iti rutvamatra
    sarpiṣkuṇḍikā, dhanuṣkapālam, varhiṣpūlam, yajuṣpātram ity eṣāṃ pāṭhaḥ uttarapadasthasya
    api ṣatvaṃ yathā syād iti  / paramasrpiḥphalam ity evam ādi pratyudāharaṇāt iti
    pārāyaṇikā āhuḥ  / bhāṣye vṛttau ca nityaṃ samāse 'nuttarapadasthasya (*8,3.45)
    ity atra praramasarpiḥkuṇdikā ity etad eva pratyudāharaṇam  / ayaskāṇḍaḥ  / medaspiṇḍaḥ  /
    avihitalakṣaṇa upacāraḥ kaskādiṣu draṣṭavyaḥ // [#950]
