source_id: KASIKA-6.4.41
locator:
  sutra: 6.4.41
witness_text:
  sutra: viḍ-vanor anunāsikasya āt
  commentary: viṭi vani ca pratyaye parataḥ anunāsikāntasya aṅgasya ākāra ādeśo bhavati  /
    abjā gojā ṛtajā adrijā  / goṣā indo nṛṣā asi  / kūpakhāḥ  / śatakhāḥ  / sahasrakhāḥ  /
    dadhikrāḥ  / agregā unnetṝṇām  / jana-sana-khana-krama-gamo viṭ (*3,2.67) iti
    viṭ pratyayaḥ  / sanoter anaḥ (*8,3.108) iti ṣatvam goṣā indo nṛṣā asi ity atra  /
    vana - vijāvā  / agrejāvā  / anyebhyo 'pi dṛśyante (*4,3.75) iti vanip pratyayaḥ  /
    anunāsikasya iti vartamāne punar anunāsikagrahaṇam anunāsikāmātraparigrahārtham,
    anyathā hi anudāttopadeśavanatitanotyādīnām eva syāt //
