source_id: KASIKA-5.3.92
locator:
  sutra: 5.3.92
witness_text:
  sutra: kiṃ-yat-tado nirdhāraṇe dvayor ekasya ḍatarac
  commentary: kim yat tat ity etebhyaḥ prātipadikebhya dvayor ekasya nirdhāraṇe ḍataracpratyayo
    bhavati  / nirdhāryamāṇavācibhyaḥ svārthe pratyayaḥ  / jātyā, kriyayā, gunena,
    sañjñayā vā samudāyād ekadeśasya pṛthakkaraṇaṃ nirdhāraṇam  / kataro bhavatoḥ
    kaṭhaḥ  / kataro bhavatoḥ kārakaḥ  / kataro bhavatoḥ paṭuḥ  / kataro bhavator
    devadattaḥ  / yataro bhavatoḥ kārakaḥ  / yataro bhavatoḥ patuḥ  / yataro bhavatordevadattaḥ,
    tatara āgacchatu  / mahāvibhāṣayā cātra pratyayo vikalpyate  / ko bhavator devadattaḥ,
    sa āgacchatu  / nirdhāraṇe iti visayasaptamīnirdeśaḥ  / dvayoḥ iti samudāyān nirdhāraṇavibhaktiḥ  /
    ekasya iti nirdeśaḥ nirdharyamāṇanirdeśaḥ //
