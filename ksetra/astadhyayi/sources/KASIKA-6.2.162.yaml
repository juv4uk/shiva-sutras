source_id: KASIKA-6.2.162
locator:
  sutra: 6.2.162
witness_text:
  sutra: bahuvrīhāv idam-etat-tadbhyaḥ prathama-pūranayoḥ kriyāgaṇane
  commentary: bahuvrīhau samāse idam etad tad ity etebhyaḥ uttarasya prathamaśabdasya
    pūraṇapratyayāntasya ca kriyāgaṇane vartamānasya anataḥ udāttaḥ bhavati  / idaṃ
    prathamaṃ gamanaṃ bhojanaṃ vā yasya sa idaṃprathamaḥ  / idaṃdvitīyaḥ  / idaṃtṛtīyaḥ  /
    etatprathamaḥ  / etaddvitīyaḥ  / etattṛtīyaḥ  / tatprathamaḥ  / taddvitīyaḥ  /
    tattṛtīyaḥ  / bahuvrīhau iti kim  / anena prathamaḥ idaṃprathamaḥ  / tṛtīyā iti
    yogavibhāgāt samāsaḥ  / idametattadbhyaḥ iti kim ? yatprathamaḥ  / prathamapūraṇayoḥ
    iti kim ? tāni bahūnyasya tadbahuḥ  / kriyāgaṇane iti kim ? ayaṃ prathama eṣāṃ
    te idaṃprathamāḥ  / dravyagaṇanam etat  / gaṇane iti kim ? ayaṃ prathama eṣām
    te idaṃprathamāḥ  / idampradhānā ity arthaḥ  / uttarapadasya kāryitvāt kapi pūrvam
    antodāttaṃ bhavati  / idamprathamakāḥ  / bahuvrīhau ity etat vanaṃ samāse (*6,2.178)
    iti prāgetasmād adhikṛtam veditavyam // [#692]
