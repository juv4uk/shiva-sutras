source_id: KASIKA-2.2.28
locator:
  sutra: 2.2.28
witness_text:
  sutra: tena saha+iti tulyayoge
  commentary: saha ity etac chābdarūpaṃ tulyayoge vartamānaṃ tena iti tṛtīyāntena
    saha samasyate, bahuvrīhiś ca samāso bhavati  / saha putreṇāgataḥ saputraḥ  /
    sacchātraḥ  / sakarmakaraḥ  / tulyayoge iti kim ? sahaiva daśabhiḥ putrairbhāraṃ
    bahati gardabhī  / vidyamātair eva daśabhiḥ putrairbhāraṃ vahati ity arthaḥ  /
    kathaṃ sakarmakaḥ, salomakaḥ, sapakṣakaḥ iti ? na hy atra tulyayogo gamyate  /
    kiṃ tarhi ? vidyamānatā  / prāyikaṃ tulyayoge iti viśeṣanam  / anyatra api samāso
    dṛśyate //
