source_id: KASIKA-6.1.68
locator:
  sutra: 6.1.68
witness_text:
  sutra: hal-ṅy-ābbhyo dīrghāt su-ti-sy-apṛktaṃ hal
  commentary: lopa iti vartate  / tad iha laukikena arthavat karmasādhanaṃ draṣṭavyam  /
    lupyate iti lopaḥ  / halantād, ṅyantād ābantāc ca dīrghāt paraṃ su ti si ity etad
    apṛktaṃ hal lupyate  / halantāt sulopaḥ - rājā  / takṣā  / ukhāsrat  / parṇadhvat  /
    ṅyantāt - kumārī  / gaurī  / śārṅgaravī  / ābantāt - khaṭvā  / bahurājā  / kārīṣagandhyā  /
    halantād eva tilopaḥ silopaś ca  / tatra tilopastāvat - abibhar bhavāt  / bhṛño
    laṅi tipi ślau bhṛñāmit ity abhyāsasya ittvam  / ajāgar bhabān  / silopaḥ-abhino
    'tra acchino 'tra  / dasya rephaḥ  / halṅyābbhyaḥ iti kim ? grāmaṇīḥ  / senanīḥ  /
    dīrghāt iti kim ? niṣkauśāmbiḥ  / atikhaṭvaḥ  / sutisi iti kim ? abhaitsīt  /
    tipā sahacaritasya siśabdasya grahaṇāt sico grahaṇaṃ na asti  / apṛktam iti kim
    ? bhinatti  / chinatti  / hali iti kim ? bibheda  / ciccheda  / atha kimarthaṃ
    halantāt sutisināṃ lopo vidhīyate, saṃyogāntalopena+eva siddham ? na sidhyati  /
    rājā, takṣā ity atra saṃyogāntalopasya asiddhatvān nalopo na syāt  / ukhāsrat,
    parṇadhvat ity atra apadantatvād dattvaṃ ca na syāt  / abhino 'tra ity atra ato
    roraplutādaplute (*6,1.113) ity uttvaṃ na syāt  / abibhar bhavān ity atra tu rāt
    sasya (*8,3.24) iti niyamāl lopa eva na syāt  / saṃyogāntasya lope hi nalopādir
    na sidhyati  / rāttu te na+eva lopaḥ syād dhalas tasmād vidhīyate //
