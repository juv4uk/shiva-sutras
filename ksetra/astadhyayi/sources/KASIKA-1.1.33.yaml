locator:
  sutra: 1.1.33
witness_text:
  sutra: prathama-carama-taya-alpa-ardha-katipaya-nemāś ca
  commentary: vibhāṣā jasi (*1,1.32) iti vartate  / dvandve iti nivṛttam  / prathama
    carama taya alpa ardha katipaya nema ity ete jasi vibhāṣā sarvanāma-sañjñā bhavanti  /
    prathame, prathamāḥ  / carame, caramāḥ  / dvitaye, dvitayāḥ  / alpe, alpāḥ  /
    ardhe, ardhāḥ  / katipaye, katipayaḥ  / neme, nemāḥ  / taya iti tayap pratyayaḥ  /
    śiṣṭāni prātipadikāni  / tatra nema iti sarvādiṣu paṭhyate, tasya prāpte vibhaṣā,
    anyeṣām aprāpte  / ubhaya-śabdasya tayap-pratyaya-antasya gane pāṭhān nityā sarvanāma-sañjñā
    iha api jaskāryaṃ prati vibhāṣā  / kākacoryathā-yogaṃ vṛttiḥ //
