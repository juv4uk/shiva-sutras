source_id: KASIKA-6.3.109
locator:
  sutra: 6.3.109
witness_text:
  sutra: pṛṣodara-ādīni yathopadiṣṭam
  commentary: pṛṣodaraprakārāṇi śabdarūpāṇi, yeṣu lopāgamavarnavikārāḥ śāstreṇa na
    vihitāḥ dṛśyante ca, tāni yathopadiṣṭāni sādhūni bhavanti  / yāni yāni yathopadiṣṭāni,
    śaṣṭair uccāritāni prayuktāni, tāni tathā+eva anugantavyāni  / pṛṣad udaraṃ yasya
    pṛṣodaram  / pṛṣad udvānaṃ yasya pṛṣodvānam  / atra takāralopo bhavati  / vārivāhakaḥ
    balāhakaḥ  / pūrvaśabdasya baśabda ādeśaḥ, uttarapadādeś ca latvam  / jīvanasya
    mūtaḥ jīmūtaḥ  / vanaśabdasya lopaḥ  / śavānāṃ śayanam śmaśānam  / śavaśabdasya
    śmādeśaḥ, śayanaśabdasya api śānaśabda ādeśaḥ  / ūrdhvaṃ khamasya iti ulūkhalam  /
    ūrdhvakhaśabdayoḥ ulū khala ity etāv ādeśau bhavataḥ  / piśitāśaḥ piśācaḥ  / piśitāśaśabdayor
    yathāyogaṃ piśācaśabdau ādeśau  / bruvanto 'syāṃ sīdanti iti bṛsī  / sader adhikaraṇe
    ḍaṭ pratyayaḥ  / bruvacchabdasya copapadasya bṛśabda ādeśo bhavati  / mahyāṃ rauti
    iti mayūraḥ  / rauter aci ṭilopaḥ  / mahīśabdasya mayūbhāvaḥ  / evamanye 'pi aśvatthakapitthaprabhṛtayo
    yathāyogam anugantavyāḥ  / dikśabdebhya uttarasya tīrasya tārabhāvo vā bhavati  /
    dakṣiṇatīram, dakṣiṇatāram  / uttaratīram, uttaratāram  / vāco vāde ḍatvaṃ ca
    labhāvaś ca+uttarapadasya+iñi pratyaye bhavati  / vācaṃ vadati iti vāgvādaḥ  /
    tasyāpatyaṃ vaḍvāliḥ  / ṣaṣa utvaṃ datṛdaśadhāsūttarapadādeṣṭutvaṃ ca bhavati  /
    ṣaḍ dantā asya ṣoḍan  / ṣaṭ ca daśa ca ṣoḍaśa  / dhāsu vā ṣaṣa utvaṃ bhavaty uttarapadādeśca
    ṣṭutvam  / ṣoḍhā, ṣaḍdhā kuru  / bahuvacananirdeśo nānādhikaraṇavācino dhāśabdasya
    pratipattyarthaḥ  / iha mā bhūt, ṣaṭ dadhāti dhayati vā ṣaḍdhā iti  / duro dāśanāśadabhadhyeṣūtvaṃ
    vaktavyam uttarapadādeśca ṣṭutvam  / kucchreṇa dāśyate nāśyate dabhyate ca yaḥ
    sa dūḍāśaḥ  / dūṇāśaḥ  / dūḍabhyaḥ  / dambheḥ khalbanunāsikalopo nipātanāt  /
    duṣṭaṃ dhyāyati iti dūḍhyaḥ  / duḥśabdopapadasya dhyāyateḥ ātaścopasarge (*6,1.136)
    iti kapratyayaḥ  / [#725] svaro rohatau chandasyutvaṃ vaktavyam  / jāya ehi suvo
    rohāva  / pīvopavasanādīnāṃ ca lopo vaktavyaḥ  / pīvopavasanānām  / payopavasanānām  /
    varṇāgamo varṇaviparyayaś ca dvau cāparau varṇavikāranāśau  / dhātostadarthātiśayena
    yogastaducyate pañcavidhaṃ niruktam //
