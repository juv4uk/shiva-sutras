source_id: KASIKA-5.2.45
locator:
  sutra: 5.2.45
witness_text:
  sutra: tad asminn adhikam iti daśāntāḍ ḍaḥ
  commentary: tat iti prathamāsamarthāt asmin iti saptamyarthe daśāntāt prātipadikāt
    ḍaḥ pratyayo bhavati yat tatprathamāsamartham adhikaṃ cet tad bhavati  / itikaraṇas
    tataś ced vivakṣā  / ekādaśa adhikā asminaśate ekādaśam śatam  / ekādaśaṃ sahastram  /
    dvādaśaṃ śatam  / dvādaśaṃ sahasram  / daśāntāt iti kim ? pañca adhikā asmin śate  /
    anta-grahaṇaṃ kim ? daśādhikā asmin śate  / [#509] pratyayārthena ca samānajātīye
    prakṛtyarthe sati pratyaya iṣyate  / ekādaśa kārṣāpaṇā adhikā asmin kārṣāpaṇaśate
    ekādaśaṃ kārṣāpanaśatam iti  / iha tu na bhavati, ekādaśa māṣā adhikā asmin kārṣāpaṇaśate
    iti  / śatasahasrayoś ca+iṣyate  / iha na bhavati, ekādaśādhikā asyāṃ triṃśati
    iti  / itikaraṇo vivakṣārtha ity uktaṃ, tata idaṃ sarvaṃ labhyate  / katham ekādaśam
    śatasahasram iti ? śatānāṃ sahasraṃ, sahasrāṇām vā śatam iti śatasahasram ity
    ucyate  / tatra śatasahasrayoḥ ity eva siddham  / adhike samānajātāviṣṭaṃ śatasahasrayoḥ  /
    yasya saṅkhyā tadādhikye ḍaḥ kartavyo mato mama //
