source_id: KASIKA-1.2.41
locator:
  sutra: 1.2.41
witness_text:
  sutra: apṛkta eka-al pratyayaḥ
  commentary: apṛktaḥ iti iyaṃ sañjñā bhavati eka-al yaḥ pratyayas tasya  / asahāya-vācī
    eka-śabdaḥ  / spśo 'nudake kvin (*3,2.58) - dhṛtaspṛk  / bhajo ṇviḥ (*3,2.62)
    - ardhabhak  / pādabhāk  / eka-al iti kim ? darviḥ  / jāgṛviḥ  / pratyaya iti
    kim ? surāḥ  / apṛkta-pradeśāḥ -- ver apṛktasya (*6,1.67) ity evam ādyaḥ //
