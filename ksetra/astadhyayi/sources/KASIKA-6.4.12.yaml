source_id: KASIKA-6.4.12
locator:
  sutra: 6.4.12
witness_text:
  sutra: in-han-pūṣa-aryamṇāṃ śau
  commentary: in han pūṣan aryaman ity evam antānām aṅgānāṃ śau parata upadhāyā dīrgho
    bhavati  / bahudaṇḍīni  / bahucchatrīṇi  / bahuvṛtrahāṇi  / bahubhrūṇahāni  /
    bahupūṣāṇi  / bahvaryamāṇi  / siddhe satyārambho niyamārthaḥ, inhanpūṣāryamṇām
    upadhāyaḥ śāv eva dīrgho bhavati na anyatra  / daṇḍinau  / chatriṇau  / vṛtrahaṇau  /
    pūṣaṇau  / aryamaṇau  / dīrghavidhirya ihenprabhṛtīnāṃ taṃ viniyamya suṭīti suvidvān  /
    śau niyamaṃ punar eva vidadhyāt bhrūṇahanīti tathāsya na duṣyet // śāsmi nivartya
    suṭītyaviśeṣe śau niyamaṃ kuru vāpyasamīkṣya  / dīrghavidherupadhāniyamānme hanta
    yi dīrghavidhau ca na doṣaḥ // suṭyapi vā prakṛte 'navakāśaḥ śau niyamo 'prakṛtapratiṣedhe  /
    yasya hi śau niyamaḥ suṭi naitattena na tatra bhavedviniyamyam // hanteḥ anunāsikasya
    kvijhaloḥ kṅiti (*2,4.15) iti dīrghatvaṃ yat tad api niyamena bādhyate vṛtrahaṇi,
    bhrūṇahani iti  / katham ? yogavibhāgaḥ kriyate  / inhanpūṣāryamṇām sarvanāmasthāne
    eva dīrgho bhavati, na anyatra iti  / tataḥ śau iti dvitīyo niyamaḥ  / [#734]
    śau eva sarvanāmasthāne dīrgho bhavati na anyatra iti  / sarvasya+upadhālakṣaṇasya
    dīrghasya niyamena nivṛttiḥ kriyate  / yas tu na upadhālakṣaṇaḥ sa bhavaty eva  /
    vṛtrahāyate  / bhrūṇahāyate  / atha va anuvartamāne 'pi sarvanāmasthānagrahaṇe
    sāmarthyādayam aviśeṣeṇa niyamaḥ  / śiśabdo hi sarvanāmasthāaṃ napuṃsakasya, na
    ca tasya anyat sarvanāmasthānam asti ity aviśeṣeṇa niyamaḥ  / tatra tu napuṃsakasya
    ity etan na aśrīyate  / tena anapuṃsakasya api dīrgho na bhavati  / sarvanāmasthānasañjñāvidhāne
    tu napuṃsakasya vyāpāro 'sti iti tatra niyamaḥ kriyamaṇo napuṃsakasya syāt //
