locator:
  sutra: 6.1.204
witness_text:
  sutra: sañjñāyām upamānam
  commentary: upamānaśabdaḥ sañjñāyām ādyudāto bhavati  / cañcā  / vadhrikā  / kharakuṭī  /
    dāsī  / upamānaśabdā ete upameyasya sañjñāḥ  / tatra ive pratikṛtau (*5,3.96)
    iti yaḥ kan, tasya lummanuṣye (*5,3.98) iti lup  / yady evaṃ kim artham idam ucyate
    pratyayalakṣaṇena siddham ādyudāttatvam ? etad eva jñāpayati kvacid iha svaravidhau
    pratyayalakṣaṇaṃ na bhavati iti  / tathā ca pūrvatra+udāhṛtam  / sañjñāyām iti
    kim ? agnir māṇavakaḥ  / upamānam iti kim ? devadattaḥ //
