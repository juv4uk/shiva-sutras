source_id: KASIKA-3.2.142
locator:
  sutra: 3.2.142
witness_text:
  sutra: saṃpṛca-anurudha-āṅyama-āṅyasa-parisṛ-saṃsṛja-paridevi-saṃjvara-parikṣipa-pariraṭa-parivada-paridaha-parimuha-duṣa-dviṣa-druha-duha-yuja-ākrīḍa-vivica-tyaja-raja-bhaja-aticara-apacara-āmuṣa-abhyāhanaś
    ca
  commentary: ghinuṇ anuvartate  / saṃpṛcādibhyo dhātubhyo ghinuṇ bhavati tacchīlādiṣu  /
    pṛcī samparke iti rudhādir gṛhyate natvadādir lug-vikaraṇatvāt  / paridevirbhvādirgṛhyate
    devṛ devane iti  / kṣipa preraṇe divādistudādiśca sāmānena gṛhyate  / yuja samādhau
    divādiḥ, yujir yoge rudhādiḥ dvayor api grahaṇam  / rañja rāge ity asya nipātanād
    anunāsika-lopaḥ  / saṃparkī  / anurodhī  / āyāmī  / āyāsī  / parisārī  / saṃsargī  /
    paridevī  / saṃjvārī  / parikṣepī  / parirāṭī  / parivādī  / paridāhī  / parimohī  /
    doṣī  / dveṣī  / drohī  / dohī  / yogī  / ākrīḍī  / vivekī  / tyāgī  / rāgī  /
    bhāgī  / aticārī  / apacārī  / āmoṣī  / abhyāghātī //
