locator:
  sutra: 4.4.131
witness_text:
  sutra: veśo-yaśa-āder bhagād yal
  commentary: matvarthe ity eva veśoyaśasī ādau yasya prātipadikasya tasmād veśoyaśāader
    bhagāntāt prātipadikāt matvarthe yal pratyayo bhavati  / lakāraḥ svarārthaḥ veśobhago
    vidyate yasya sa veśobhagyaḥ  / yaśobhagyaḥ  / veśaḥ iti valam ucyate  / śrīkāmaprayatnamāhātmyavīryayaśassu
    bhagaśabdaḥ  / veśaś ca asau bhagaś ca śrīprabhṛtir veśobhagaḥ, so 'sya asti iti
    veśobhagyaḥ // [#462]
