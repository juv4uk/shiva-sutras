source_id: KASIKA-1.1.11
locator:
  sutra: 1.1.11
witness_text:
  sutra: īd-ūd-ed-dvivacanaṃ pragṛhyam
  commentary: īt ūt et ity evam-antaṃ dvivacanaṃ śabda-rūpaṃ pragrhya-sañjñaṃ bhavati  /
    agnī iti  / vāyu iti  / māle iti  / pacete iti  / īd-ūdet iti kim ? vṛkṣāv atra  /
    plakṣāv atra  / dvivacanam iti kim ? kumāry-atra  / kiśory-atra  / taparakaraṇam
    asaṃdeha-artham  / pragṛhya-pradeśāḥ - pluta-pragṛhyā aci nityam (*6,1.125) ity
    evam ādayaḥ  / īd-ādīnāṃ pragṛhyatve maṇīvādīnāṃ pratiṣedho vaktavyaḥ  / maṇīvoṣṭrasya
    lambete priyau vatsatarau mama  / dampatīva  / jampatīva  / rodasīva //
