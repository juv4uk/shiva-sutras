source_id: KASIKA-6.3.47
locator:
  sutra: 6.3.47
witness_text:
  sutra: dvyaṣṭanaḥ saṅkhyāyām abahuvrīhy-aśītyoḥ
  commentary: dvi aṣṭan ity etayoḥ ākārādeśo bhavati saṅkhyāyām uttarapade abahuvrīhyaśītyoḥ  /
    dvādaśa  / dvāviṃśatiḥ  / dvātriṃśat  / aṣṭādaśa  / aṣṭāviṃśatiḥ  / aṣṭātriṃśat  /
    dvyaṣṭanaḥ iti kim ? pañcadaśa  / saṅkhyāyām iti kim ? dvaimāturaḥ  / āṣṭamāturaḥ  /
    abahuvrīhyaśityoḥ iti kim ? dvitrāḥ  / tridaśāḥ  / dvyaśītiḥ  / prāk śatād iti
    vaktavyam  / iha mā bhūt, dviśatam  / dvisahasram  / aśṭaśatam  / aṣṭasahasram
    //
