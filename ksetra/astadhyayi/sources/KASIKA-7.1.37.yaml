source_id: KASIKA-7.1.37
locator:
  sutra: 7.1.37
witness_text:
  sutra: samāse 'nañ-pūrve ktvo lyap
  commentary: samāse 'nañpūrve ktvā ity etasya lyap ity ayam ādeśo bhavati  / prakṛtya  /
    prahṛtya  / pārśvataḥkṛtya  / nānākṛtya  / dvidhākṛtya  / samāse iti kim ? kṛtvā  /
    hṛtvā  / anañpūrve iti kim ? akṛtvā  / ahṛtvā  / paramakṛtvā  / uttamakṛtvā  /
    anañ iti nañā anyadanañ nañsadṛśam avyayaṃ parigṛhyate  / tena nañ anavyayaṃ canañ
    na bhavati  / snātvākālakādiṣu mayūravyaṃsakādiṣu nipātanāl lyabādeśo na bhavati  /
    athavā samāse iti nirdhāraṇe saptamī  / tena ktvāntaḥ samāsa eva parigṛhyate  /
    sa ca yena vidhis tadantasya ity anena tadantavidhinā, na tu kṛdgrahaṇe gatikārakapūrvasya
    api iti  / tathā ca anañpūrve ity ucyate  / gatikārakapūrvasy eva tu grahaṇe sati
    nañpūrvasya prasaṅga eva na asti, nañ na gatir na kārakam iti  / pradhāya, prasthāya
    ity ādiṣu hiprabhṛtīn antaraṅgan api vidhīn bahiraṅgo lyab bādhate eva iti jñāpitam
    etat //
