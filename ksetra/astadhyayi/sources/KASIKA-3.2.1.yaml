source_id: KASIKA-3.2.1
locator:
  sutra: 3.2.1
witness_text:
  sutra: karmaṇy aṇ
  commentary: trividhaṃ karma, nirvartyaṃ, vikāryaṃ, prāpyaṃ ca+iti  / sarvatra karmaṇi
    upapade dhātoḥ aṇ pratyayo bhavati  / nirvartyaṃ tāvat -- kumbhakāraḥ  / nagarakāraḥ  /
    vikāryam -- kāṇḍalāvaḥ  / śaralāvaḥ  / prāpyam - vedādhyāyaḥ  / carcāpāraḥ  /
    grāmaṃ gacchati, ādityaṃ paśyati, himavantaṃ śṛṇoti ity atra na bhavati, anabhidhānāt  /
    śīlikāmibhakṣyācaribhyo ṇaḥ pūrvapada-prakṛtisvaratvaṃ ca vaktavyam  / māṃsaśīlaḥ,
    māṃsaśīlā  / māṃsakāmaḥ, māṃsakāmā  / māṃsabhakṣaḥ, māṃsabhakṣā  / kalyāṇācāraḥ,
    kalyāṇācārā  / īkṣakṣamibhyāṃ ca+iti vaktavyam  / sukhapratīkṣaḥ, sukhapratīkṣā  /
    bahukṣamaḥ, bahukṣamā //
