source_id: KASIKA-7.3.34
locator:
  sutra: 7.3.34
witness_text:
  sutra: na+udātta-upadeśasya ma-antasya anācameḥ
  commentary: udāttopadeśasya māntasya anācameḥ (*7,3.34)  / udātopadeśasya māntasya
    aṅgasya ācamivarjitasya ciṇi kṛti ca ñṇiti yad uktaṃ tan na bhavati  / kiṃ ca
    uktam ? ata upadhāyāḥ (*7,2.116) iti vṛddhiḥ  / aśami  / atami  / adami  / kṛti
    khalv api - śamakaḥ  / tamakaḥ  / damakaḥ  / śamaḥ  / tamaḥ  / damaḥ  / udāttopadeśasya
    iti kim ? yāmakaḥ  / rāmakaḥ  / katham udyamoparamau ? aḍa udyame, yama uparame
    iti nipātanād anugantavyau  / upadeśagrahaṇam kim ? śamī, damī, tamī ity atra
    yathā syāt, iha mā bhūt, yāmakaḥ, rāmakaḥ iti  / māntasya iti kim ? cārakaḥ  /
    pāṭhakaḥ  / anācameḥ iti kim ? ācāmakaḥ  / anācamikamivamīnām iti vaktavyam  /
    ācāmaḥ  / kāmaḥ  / vāmaḥ  / āmaḥ iti caurādikasya ṇici vṛddhau satyāṃ bhavati  /
    tatra hi mittvaṃ na asti na anye mito 'hetau iti  / sūryaviśrāmā bhūmiḥ ity evam
    ādikaṃ prayogamanyāyyam eva manyante  / ciṇkṛtoḥ ity eva, śaśāma  / tatāma //
