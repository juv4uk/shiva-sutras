source_id: KASIKA-7.4.12
locator:
  sutra: 7.4.12
witness_text:
  sutra: śṝ-dṝ-prāṃ hrasvo vā
  commentary: śṝ dṝ pṝ ity eteṣāṃ aṅgānāṃ liṭi parato vā hrasvo bhavati  / śṝ - viśaśratuḥ,
    viśaśruḥ  / viśaśaratuḥ, viśaśaruḥ  / dṝ - vidadratuḥ, vidadruḥ  / vidadaratuḥ,
    vidadaruḥ  / pṝ - nipapratuḥ, nipapruḥ  / nipaparatuḥ, nipaparuḥ  / hrasvavacanam
    itvotvanivṛttyartham  / kecid etat sūtraṃ pratyācakṣate  / śrā pāke, drā kutsāyāṃ
    gatau, prā pūraṇe ity eteṣām anekārthā dhātavaḥ iti śṝdṝprāmarthe vartamānānāṃ
    viśaśratuḥ, viśaśruḥ, vidadratuḥ, vidadruḥ, nipapratuḥ, nipapruḥ ity etāni rūpāṇi
    sādhayanti  / tathā ca sati kvasau viśaśṛvān ity etad rūpaṃ na syāt // [#863]
