source_id: KASIKA-3.1.7
locator:
  sutra: 3.1.7
witness_text:
  sutra: dhātoḥ karmaṇaḥ samāna-kartṛkād icchāyāṃ vā
  commentary: iṣikarma yo dhatur iṣiṇaiva samānakartṛkaḥ, tasmād icchāyām arthe vā
    san pratyayo bhavati  / karmatvaṃ samānakartṛkatvaṃ ca dhātor arthadvārakam  /
    karṭum icchati  / cikīrṣati  / jihīrṣati  / dhātu-grahanaṃ kim ? sopasargād utpattir
    mā bhūt  / prakaṛtum aicchat prācikīrṣat  / karmaṇaḥ iti kim ? karaṇān mā bhūt  /
    gamanena+icchati  / samānakartṛkat iti kim ? devadattasya bhojanam icchati yajñadattaḥ  /
    icchāyām iti kim ? kartuṃ jānāti  / vāvacanād vākyam api bhavati  / dhātoḥ iti
    vidhānād atra sanaḥ ārdhadhātuka-sañjñā bhavati, na pūrvatra  / āśaṅkāyām upasaṃkhyānam  /
    āśaṅke patiṣyati kūlam, pipatiṣati kūlam  / śvā mumūrṣati  / icchāsannantāt pratiṣedho
    vaktavyaḥ  / cikīrṣitum icchati  / viśeṣaṇaṃ kim ? jugupsiṣate  / mīmāṃsiṣate  /
    śaiṣikānmatubarthīyācchaiṣiko matubarthikaḥ  / sarūpaḥ pratyayo neṣṭaḥ sanantān
    na saniṣyate //
