source_id: KASIKA-4.4.20
locator:
  sutra: 4.4.20
witness_text:
  sutra: trermam nityam
  commentary: nirvṛtta ity eva  / ḍvitaḥ ktriḥ (*3,3.88) ity ayaṃ triśabdo gṛhyate  /
    tryantān nityaṃ map pratyayo bhavati tena virvṛtte ity etasminn arthe  / ḍupacaṣ
    pāke - paktrimam  / ḍuvap - uptrimam  / ḍukṛñ - kṛtrimam  / nitya-grahaṇaṃ svātantryanivṛtty-artham,
    tena tryantaṃ nityaṃ map-pratyayāntam eva bhavati, viṣayāntare na prayoktavyam
    iti  / bhāva-pratyayāntādim abvaktavyaḥ  / pākena nirvṛttam pākimam  / tyāgimam  /
    sekimam  / kuṭṭimam //
