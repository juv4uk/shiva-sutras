source_id: KASIKA-8.4.48
locator:
  sutra: 8.4.48
witness_text:
  sutra: na ādiny-ākrośe putrasya
  commentary: ādini parataḥ ākrośe gamyamāne putraśabdasya na dva bhavataḥ  / anaci
    ca (*8,4.47) iti prāptiḥ pratiṣidhyate  / putrādinītvam asi pāpe  / ākrośe iti
    kim ? tattvakathane dvirvacanaṃ bhavaty eva, puatrānatti iti puttrādinī  / śiśumārī
    vyāghrī  / tatpare ceti vaktavyam  / putraputrādinī tvamasi pāpe  / vā hatajagdhapara
    iti vaktavyam  / puttrahatī, putrahati  / puttrajagdhī, putrajagdhī  / cayo dvitīyāḥ
    śari pauṣkarasādeḥ  / cayo dvitīyā bhavanti śari parataḥ pauṣkarasāder ācāryasya
    matena  / takārasya thakāraḥ - vathsaḥ  / kakārasya khakāraḥ - khṣīram  / pakārasya
    phakāraḥ - aphsarāḥ // [#978]
