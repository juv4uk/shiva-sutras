source_id: KASIKA-4.1.93
locator:
  sutra: 4.1.93
witness_text:
  sutra: eko gotre
  commentary: apatyaṃ pautra-prabhṛti gotram (*4,1.162)  / tasman vivakṣite bhedena
    pratyapatyaṃ pratyayotpatti-prasṅge niyamaḥ kriyate, gotre eka eva pratyayo bhavati,
    sarve 'patyena yujyante  / apatanād apatyam  / yo 'pi vyavahitena janitaḥ, so
    'pi prathamaprakṛter apatyaṃ bhavaty eva  / gargasya apatyaṃ gārgiḥ  / gārger
    apatyaṃ gārgyaḥ  / tatputro 'pi vyavahitena janitaḥ, so 'pi prathamaprakṛter apatyaṃ
    bhavaty eva  / gargasya apatyaṃ gārgiḥ  / gārger apatyaṃ gārgyaḥ  / tatputro 'pi
    gārgyaḥ  / sarvasmin vyavahitajanite 'pi gotrāpatye garga-śabdād yañ eva bhavati
    iti pratyayo niyamyate  / athavā gotrāpatye vivakṣite eka eva śabdaḥ prathamā
    prakṛtiḥ pratyayam utpādayati iti prakṛtir niyamyate  / gārgyaḥ  / nāḍāyanaḥ //
