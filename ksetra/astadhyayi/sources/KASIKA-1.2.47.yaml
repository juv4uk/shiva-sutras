source_id: KASIKA-1.2.47
locator:
  sutra: 1.2.47
witness_text:
  sutra: hrasvo napuṃsake prātipadikasya
  commentary: napuṃsaka-liṅge 'rthe yat prātipadikaṃ vartate tasya hrasvo bhavati
    ādeśaḥ alo 'nyasya acaḥ  / atiri kulam  / atinu kulam  / napuṃsake iti kim ? grāmaṇīḥ  /
    senānīḥ  / prātipadikasya iti kim ? kāṇḍe tiṣṭhataḥ  / kuḍye tiṣṭhataḥ  / prātipadika-grahaṇa-sāmarthyat
    eka-ādeśaḥ pūrvasya antavan-na bhavati //
