source_id: KASIKA-6.1.195
locator:
  sutra: 6.1.195
witness_text:
  sutra: acaḥ kartṛyaki
  commentary: upadeśe iti vartate  / ajantā ye upadeśe dhātavaḥ teṣāṃ kartṛyaki anyatarasyām
    ādir udātto bhavati  / lūyate kedāraḥ svayam eva, lūyate kedāraḥ svayam eva  /
    stīryate kedāraḥ svayam eva, stīryate kedaraḥ svayam eva  / yadā ādyudāttatvaṃ
    na bhavati tadā lasarvadhātukanighāte kṛte yaka eva svaro bhavati  / janādīnām
    upadeśe evātvaṃ draṣṭavyam  / tatra apy ayaṃ svara iṣyate  / jāyate svayam eva  /
    sāyate svayam eva  / khāyate svayam eva  / acaḥ iti kim ? bhidyate svayam eva  /
    kartṛgrahaṇaṃ kim ? lūyate kedāro devadattena //
