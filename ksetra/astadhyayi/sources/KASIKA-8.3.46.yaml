source_id: KASIKA-8.3.46
locator:
  sutra: 8.3.46
witness_text:
  sutra: ataḥ kṛ-kami-kaṃsa-kumbha-pātra-kuśā-karṇīṣv anavyayasya
  commentary: akārād uttarasya anavyayavisarjanīyasya samāse anuttarapadasthasya nityaṃ
    sakārādeśo bhavati kṛ kami kaṃsa kumbha pātra kuśā karṇī ity eteṣu parataḥ  /
    kṛ - ayaskāraḥ  / payaskāraḥ  / kami - ayaskāmaḥ  / payaskāmaḥ  / kaṃsa - ayaskaṃsaḥ  /
    payaskaṃsaḥ  / kumbha - ayaskumbhaḥ  / payaskumbhaḥ  / ayaskumbhī, payaskumbhī
    ity atra api bhavati, prātipadikagrahaṇe liṅgaviśiṣṭasya api grahaṇam bhavati
    iti  / pātra - ayaspātram  / payaspātram  / ayapātrī payaspātrī  / kuśā - ayaskuśā  /
    payakuśā  / karṇī - ayaskarṇī  / apayskarṇī  / śunaskarṇaḥ ity ayaṃ tu kaskādiṣu
    draṣṭavyaḥ  / ataḥ iti kim ? goḥkāraḥ  / dhūḥkāraḥ  / taparakaraṇaṃ kim ? bhāḥkaraṇam  /
    bhāskaraḥ ity ayaṃ tu kaskādiṣu draṣtavyaḥ  / anavyayasya iti kim ? śvaḥkāraḥ  /
    punaḥkāraḥ  / samāse ity eva, yaśaḥ karoti  / payaḥ karoti  / yaśaḥ kāmayate  /
    anuttarapadasthasya ity eva, paramapayaḥkāraḥ  / paramapayaḥkāmaḥ //
