source_id: KASIKA-6.4.22
locator:
  sutra: 6.4.22
witness_text:
  sutra: asiddhavatra-ā bhāt
  commentary: asiddhavat ity ayam adhikāraḥ  / yad ita ūrdhvam anukramiṣyāmaḥ ā adhyāyaparisamāpteḥ
    tad asiddhavat bhavati ity evaṃ veditavyam  / ā bhāt iti viṣayanirdeśaḥ  / ābhasaṃśabdanād
    yad ucyate tatra kartavye  / atra it samānāśrayatvapratipattyarthaṃ  / tac ced
    atra yatra bhavati tadā bhāt śāstrīyaṃ vidhīyate tadāśrayam eva bhavati  / vyāśrayaṃ
    tu nāsiddhavad bhavati ity arthaḥ  / asiddhavacanam utsargalakṣaṇabhāvārtham,
    ādeśalakaṣaṇapratiṣedhārthaṃ ca  / edhi, śādhi ity atra etvaśābhāvayoḥ kṛtayoḥ
    jhallakṣaṇaṃ dhitvaṃ na prāpnoti, asiddhatvād bhavati  / āgahi, jahi ity atra
    anunāsika lope jabhāve ca ato heḥ (*6,4.105) iti luk prāpnoti, asiddhatvān na
    bhavati  / ā bhāt iti kim ? abhāji  / rāgaḥ  / ata upadhāyāḥ (*7,2.116) iti vṛddhau
    kartavyāyāṃ nalopo nāsiddho bhavati  / atragrahaṇaṃ kim ? papuṣaḥ paśya  / cicyuṣaḥ
    paśya  / luluvuṣaḥ paśya  / vasusaṃprasāraṇam āllope yaṇādeśe uvaṅādeśe ca kartavye
    nāsiddhaṃ bhavati  / āllopādīni vasau, vasantasya vibhaktau saṃprasāraṇam iti
    samānāśrayatvaṃ na asti  / asiddhaṃ bahiraṅgamantaraṅge iti ? etad apy atra na
    bhavati  / [#737] kiṃ kāraṇam ? eṣā hi paribhāṣā ābhācchāstrīyā  / tasyāṃ pravartamānāyāṃ
    vasusaṃprasāraṇādīnāmābhācchāstrīyāṇām eva asiddhatvād antaraṅgabahiraṅgayoḥ yugapat
    samupasthāpanaṃ na asti iti paribhāṣa na pravartate  / vugyuṭāvuvaṅyaṇoḥ siddhau
    bhavata iti vaktavyam  / vug uvaṅādeśe - babhūva, bahūvatuḥ, bavhūvuḥ  / yuṭ yaṇādeśe
    - upadidīye, upadidīyāte, upadedīyire  / ābhāt ity ayam abhividhāvāṅ  / tena bhādhikāre
    'py asiddhavad bhavati //
