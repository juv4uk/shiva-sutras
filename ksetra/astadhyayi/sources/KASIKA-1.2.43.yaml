source_id: KASIKA-1.2.43
locator:
  sutra: 1.2.43
witness_text:
  sutra: prathamā-nirdiṣṭaṃ samāsa upasarjanam
  commentary: prathamayā vibhāktyā yan nirdiśyate samāsa-śāstre tadupasarjana-sañjñaṃ
    bhavati  / samāse iti samāsa-vidhāyi śāstraṃ gṛhyate  / vakṣyati - dvitīyā śrita-atīta-patita-gata-atyasta-prāpta-āpannaiḥ
    (*2,1.24) iti  / dvidīyā-samāse dvitīyā ity etat prathamā-nirdiṣṭaṃ, tṛtīyā-samāse
    tṛtīyā iti, caturthī-samāse caturthī iti, pañcamī-samāse pañcamī iti, ṣaṣṭhī-samāse
    ṣaṣṭhī iti, saptamī-samāse saptamī iti  / kaṣṭa-śritaḥ  / śaṅkulā-khaṇḍaḥ  / yūpa-dāru  /
    vṛka-bhayam  / rāja-puruṣaḥ  / akṣa-śauṇḍaḥ  / upasarjana-pradeśāḥ - upasarjanaṃ
    pūrvam (*2,2.30) ity evam ādayaḥ //
