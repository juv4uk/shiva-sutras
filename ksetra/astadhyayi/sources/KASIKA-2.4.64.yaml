source_id: KASIKA-2.4.64
locator:
  sutra: 2.4.64
witness_text:
  sutra: yañ-añoś ca
  commentary: bahuṣu tena+eva astriyām, gotre iti ca anuvartate  / yaño 'jś ca gotrapratyayasya
    bahuṣu vartamānasya astrīliṅgasya luṅ bhavati  / garga-ādibhyo jañ (*4,1.105)
    - gargāḥ  / vatsāḥ  / añaḥ khalv api, anṛṣy-ānantarye bida-ādibhyo 'ñ (*4,1.104)
    -- bidāḥ  / urvāḥ  / bahuṣv ity eva, gārgyaḥ  / baidaḥ  / tenaiva ity eva, priyagārgyāḥ  /
    priyabaidāḥ  / astriyām ity eva, gārgyaḥ striyaḥ  / baidyaḥ striyaḥ  / gotre ity
    eva, dvīpādanusamudraṃ yañ (*4,3.10) -- dvaipyāḥ  / utsādibhyo 'ñ - autsāśchātrāḥ  /
    yañādīnām ekadvayor vā tatpuruṣe ṣaṣṭhyā upasaṅkhyānam  / gārgyasya kulam gārgyakulaṃ
    gargakulaṃ vā  / gārgyayoḥ kulaṃ gārgyakulaṃ gargakulaṃ vā  / evaṃ baidasya kulaṃ
    baidakulaṃ bidakulaṃ vā  / baidayoḥ kulaṃ baidakulaṃ bidakulaṃ vā  / yañādīnām
    iti kim ? āṅgakulam  / ekadvayoḥ iti kim ? gārgāṇāṃ kulaṃ gargakulam  / tatpuruṣe
    iti kim ? gārgasya samīpam upagārgyam  / ṣaṣṭhyā iti kim ? paramagārgyaḥ //
