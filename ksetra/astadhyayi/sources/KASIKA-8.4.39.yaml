source_id: KASIKA-8.4.39
locator:
  sutra: 8.4.39
witness_text:
  sutra: kṣubhnādiṣu ca
  commentary: na iti vartate  / kṣubhnā ity evam ādiṣu śabdeṣu nakārasya ṇakāradeśo
    na bhavati  / kṣubhnāti  / ajādeśasya sthānivadbhāvād iha api pratiṣedho bhavati  /
    kṣubhnītaḥ  / kṣubhnanti  / nṛnamanaḥ - pūrvapadāta sañjñāyām iti prāptiḥ  / chandasy
    ṛdavagrahāt (*8,4.26) iti ca prāpnoti  / nandin, nandana, nagara, etāny uttarapadāni
    sañjñāyāṃ prayojayanti - harinandī  / [#975] harinandanaḥ  / girinagaram  / nṛtiṃ
    yaṅi prayojayanti - narīnṛyate  / tṛpnu - tṛpnoti  / nartana, gahana, nandana,
    niveśa, nivāsa, agni, anūpa, etāni uttarapadāni prayojayanti  / parinartanam,
    parigahanam iti sañjñāyām pūrvapadāt sañjñāyām iti prāpnoti  / parinandanam ity
    atra upasargād asamāse 'pi iti prāpnoti  / śaraniveśaḥ, śaranivāsaḥ, śarāgniḥ,
    darbhānūpaḥ ity etāḥ sañjñāḥ  / ācāryādaṇatvaṃ ca  / ācāryabhojīnaḥ  / ācāryānī  /
    irikādibhyo vanottarapadebhyaḥ sañjñayām  / irikā, timira, samīra, kubera, hari,
    karmāra ity uttarapadavanaśabdasthasya sañjñāyām  / kṣubhnādir ākṛtigaṇaḥ  / avihitalakṣaṇo
    ṇatvapratiṣedhaḥ kṣubhnādiṣu draṣṭavyaḥ //
