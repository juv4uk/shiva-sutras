source_id: KASIKA-6.4.37
locator:
  sutra: 6.4.37
witness_text:
  sutra: anudātta-upadeśa-vanati-tanoty-ādīnām anunāsikalopo jhali kṅiti
  commentary: anudāttopadeśānām aṅgānāṃ vanateḥ tanotyādīnāṃ ca anunāsikalopo bhavati
    jhalādau kṅiti pratyaye parataḥ  / yamu - yatvā  / yataḥ  / yatavān  / yatiḥ  /
    ramu - ratvā  / rataḥ  / ratavān  / ratiḥ  / anudāttopadeśā anunāsikāntā yamiraminamigamihanimanyatayaḥ  /
    vanati - vatiḥ  / ktino rūpam etat  / ktici tu na ktici dīrghaśca (*6,4.39) iti
    bhavati  / anyatra jhalādāviṭā bhavitavyam  / tanotyādayaḥ - tataḥ  / tatavān  /
    sanoterātvaṃ vakṣyati  / kṣaṇu - kṣataḥ  / kṣatavān  / ṛṇu - ṛtaḥ  / ṛtavān  /
    tṛṇu - tṛtaḥ  / tṛtavān  / ghṛṇu - ghṛtaḥ  / ghṛtavān  / vanu - vataḥ  / vatavān  /
    manu - mataḥ  / matavān  / ṅiti - atata  / atathāḥ  / anudāttopadeśavanatitanotyādīnām
    iti kim ? śāntaḥ  / śāntavān  / tāntaḥ  / tāntavān  / dāntaḥ  / dāntavān  / anunāsikasya
    iti kim ? pakvaḥ  / pakvavān  / jhali iti kim ? gamyate  / ramyate  / kṅiti iti
    kim ? yantā  / yantavyam  / upadeśagrahaṇaṃ kim ? iha vayathā syāt, gatiḥ  / iha
    ca mā bhūt, śāntaḥ, śāntavān iti //
