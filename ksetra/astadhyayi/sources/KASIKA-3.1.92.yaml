source_id: KASIKA-3.1.92
locator:
  sutra: 3.1.92
witness_text:
  sutra: tatra+upapadaṃ saptamīstham
  commentary: tatra+etasmin dhātv-adhikāre tṛtīye yat saptamī-nirdiṣṭaṃ tad upapada-sañjñaṃ
    bhavati  / vakṣyati - karmaṇy-aṇ (*3,2.1)  / kumbhakāraḥ  / stha-grahaṇaṃ sūtreṣu
    saptamī-nirdeśa-pratipatty-artham  / itarathā hi saptamī śrūyate yatra tatra+eva
    syāt, stamberamaḥ, karṇejapaḥ iti  / yatra vā saptamī-śrutir asti saptamyāṃ janer
    ḍaḥ (*3,2.97) iti, upasarajaḥ, mandurajaḥ iti  / stha-grahaṇāt tu sarvatra bhavati  /
    gurusañjñā-karaṇam anvarthasañjñā-vijñāne sati samartha-paribhāṣāvyāpāra-artham  /
    paṣya kumbhaṃ, karoti kaṭam iti pratyayo na bhavati  / upapada-pradeśāḥ - upapadam
    atiṅ (*2,2.19) ity evam ādayaḥ // [#197]
