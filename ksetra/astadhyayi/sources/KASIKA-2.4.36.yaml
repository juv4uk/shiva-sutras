source_id: KASIKA-2.4.36
locator:
  sutra: 2.4.36
witness_text:
  sutra: ado jagdhir lyap ti kiti
  commentary: ado jagdhiḥ ādeśo bhavati lyapi parataḥ, takārādau ca kiti pratyaye  /
    prajagdhya  / vijagdhya  / jagdhaḥ  / jagdhavān  / ikāra uccāraṇa-arthaḥ, na anubandhaḥ  /
    tena num na bhavati  / evaṃ vacyādīnām api  / iha kasmān na bhavati, annam ? annāṇṇaḥ
    (*4,4.85) iti nipātanāt  / [#163] jagdhau siddhe 'ntaraṅgatvātti kitīti lyab ucyate  /
    jñāpayaty-antaraṅgāṇāṃ lyapā bhavati bādhanam // ti iti kim ? adyate  / kiti iti
    kim ? attavyam //
