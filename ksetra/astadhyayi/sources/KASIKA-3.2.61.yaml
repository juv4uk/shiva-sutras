source_id: KASIKA-3.2.61
locator:
  sutra: 3.2.61
witness_text:
  sutra: sat-sū-dviṣa-druha-duha-yuja-vida-bhidac-chida-ji-nī-rājām uasarge 'pi kvip
  commentary: supi ity anuvartate  / karma-grahaṇaṃ tu spṛśo 'nudake kvin (*3,2.58)
    ity ataḥ prabhṛti na vyāpriyate  / sadādibhyaḥ dhātubhyaḥ subante upapade upasarge
    'pi anupasarge 'pi kvip pratyayo bhavati  / upasarga-grahaṇam jñāpanārtham, anyatra
    sub-grahaṇe upasarga-grahaṇaṃ na bhavati iti, vadaḥ supi kyap ca (*3,1.106) iti  /
    sū iti dviṣā sāhacaryāt sūteḥ ādādikasya grahaṇaṃ, na suvateḥ taudādikasya  /
    yujir yoge, yuja samādhau, dvayor api grahaṇam  / vida jñāne, vida sattāyām, vida
    vicāraṇe, trayāṇām api grahaṇam  / na lābha-arthasya videḥ, akārasya vivakṣatatvāt  /
    sad - śuciṣat  / antarikṣasat  / upasat  / sū - aṇḍasūḥ  / śatasūḥ  / prasūḥ  /
    dviṣa - mitradviṭ  / pradviṭ  / druha - mitradhruk  / pradhruk  / duha - godhuk  /
    pradhuk  / yuja - aśvayuk  / prayuk  / vida - vedavit  / pravit  / brahmavit  /
    bhida - kāṣṭhabhit  / prabhit  / chida - rajjucchid  / pracchid  / ji - śatrujit  /
    prajit  / nī - senānīḥ  / praṇīḥ  / grāmaṇīḥ  / agraṇīḥ  / katham atra ṇatvam
    ? sa eṣāṃ grāmaṇīḥ (*5,2.78) iti nipātanāt, nayateḥ pūrvapadāt sajñāyām agaḥ (*8,4.3)
    iti ṇatvam  / rāja - rāṭ  / virāṭ  / samrāṭ  / mo rāji samaḥ kvau (*8,2.35) iti
    matvam  / anyebhyo 'pi dṛśyate (*3,2.178), kvip ca (*3,2.76) iti sāmānyena vakṣyati,
    tasya+eva ayaṃ prapañcaḥ //
