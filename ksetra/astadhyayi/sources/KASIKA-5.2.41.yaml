source_id: KASIKA-5.2.41
locator:
  sutra: 5.2.41
witness_text:
  sutra: kimaḥ saṅkhyāparimāṇe ḍati ca
  commentary: saṅkhyāyāḥ parimāṇaṃ saṅkhyāparicchedaḥ ity arthaḥ  / saṅkhyāparimāṇe
    vartamānāt kimaḥ prathamāsamarthād asya iti ṣaṣṭhyarthe ḍatiḥ pratyayo bhavati,
    cakārād vatup  / tasya ca vakārasya ghādeśo bhavati  / pṛcchyamānatvāt paricchedopādhikāyāṃ
    saṅkhyāyāṃ vartamānāt kimaḥ pratyayo vijñāyate  / [#508] kā saṅkhyā parimāṇam
    eṣāṃ brāhmaṇānām kati brāhmaṇāḥ, kiyanto brāhmaṇāḥ  / atha vā saṅkhyā+eva parimāṇātmikā
    paricchedasvabhāvā gṛhyate, kā saṅkhyā parimāṇaṃ yeṣāṃ iti  / nanu ca saṅkhyā
    evamātmikaiva paricchedasvabhāvā, sā kimarthaṃ parimāṇena viśeṣyate ? yatra aparicchedakatvena
    vivakṣyate tatra mā bhūd iti  / kṣepe hi paricchedo na asti, keyam eṣāṃ saṅkhyā
    daśānām iti //
