source_id: KASIKA-8.3.1
locator:
  sutra: 8.3.1
witness_text:
  sutra: matu-vaso ru sambuddhau chandasi
  commentary: saṃhitāyām iti vartate  / matvantasya vasvantasya ca padasya ruḥ ity
    ayam ādeśo bhavati sambuddhau parataḥ chandasi viṣaye  / matvantasya tāvat - indra
    marutva iha pāhi somam  / harivo medinaṃ tvā  / maruto 'sya santi, harayo 'sya
    santi iti matup  / suptakārayoḥ halṅyādilope saṃyogāntasya lope ca kṛte nakārasya
    ruḥ bhavati  / vasvantasya khalv api - mīḍhvastokāya tanayāya mṛla  / indra sāhvaḥ  /
    kvasor nipātanam dāśvānsāhvānmīḍhvāṃś ca iti  / matuvasoḥ iti kim ? brahman stoṣyāmaḥ  /
    sambuddhau iti kim ? ya evaṃ vidvān agnim upatiṣṭhate  / chandasi iti kim ? he
    goman  / he papivan  / vana upasaṅkhyānaṃ kartavyam  / yastvāyantaṃ vasunā prātaritvaḥ  /
    iṇaḥ prātaḥpūrvasya chandasi kvanip  / vibhāṣā bhavadbhagavadaghavatāmoccāvasya  /
    chandasi bhāṣāyāṃ ca bhavat bhagavat aghavat ity eteṣāṃ vibhāṣa ruḥ vaktavyaḥ,
    avaśabdasya ca okārādeśaḥ  / sāmānyena chandasi bhāṣāyāṃ ca+idaṃ vacanam  / bhavat
    - he bhoḥ, he bhavan  / bhagavat - he bhagoḥ, he bhagavan  / aghavan - he aghoḥ,
    he aghavan  / nipātanavijñānād vā siddham  / atha vā bho ity evam ādayo nipātā
    draṣṭavyāḥ  / asambuddhau api dvivacanabahuvacanayor api dṛśyante  / bho devadattayajñadattau  /
    bho devadattayajñadattaviṣṇumitrāḥ  / tathā striyām api ca dṛśyante, bho brāhmaṇi
    ityādi  / saṃhitādhikāra uttaratra upayujyate, yatra bhinnapadasthau nimittanimittinau
    naśchavyapraśān (*8,3.7) iti // [#938]
