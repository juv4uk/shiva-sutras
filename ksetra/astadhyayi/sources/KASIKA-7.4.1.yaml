source_id: KASIKA-7.4.1
locator:
  sutra: 7.4.1
witness_text:
  sutra: ṇau caṅy upadhāyā hrasvaḥ
  commentary: aṅgasya iti vartate  / caṅpare ṇau yadaṅgam, tasya upadhāyā hrasvo bhavati  /
    acīkarat  / ajīharat  / alīlavat  / apīpavat  / atra dvirvacanopadhāhrasvatvayoḥ
    prāptayoḥ paratvād upadhāhrasvatvam, tatra kṛte dvirvacanam  / iha tu mā bhavānaṭiṭat
    iti nityatvād dvitīyasya dvirvacanaṃ prāpnoti, tathā sati hrasvabhāvino 'ṅgasya
    akārasya upadhātvaṃ vihitam iti hrasvo na syāt ? naiṣa doṣaḥ  / oṇeḥ ṛdit - karaṇaṃ
    jñāpakaṃ nityam api dvirvacanam upadhāhrasvatvena bādhyate iti  / ṇau iti kim
    ? caṅyupadhāyā hrasvaḥ ity ucyamāne alīlavat ity atra vacanasāmarthyāt antaraṅgām
    api vṛddhim ādeśaṃ ca bādhitvā hrasvaḥ syāt  / adīdapat ity atra hrasvatvena puko
    bādhaḥ syāt  / apīpacat ity evam ādautu naiva syāt  / caṅi iti kim ? kārayati  /
    hārayati  / upadhāyā iti kim ? acakāṅkṣat  / avavāñchat  / tadedadupadhāgrahaṇam
    uttarārtham avaśyaṃ kartavyaṃ tad iha api hrasvatvaṃ nivartayati ity evam arthaṃ
    yena na avyavadhānam ity etannāśrayitavyam iti  / upadhāhrasvatve ṇerṇicyupasaṅkhyānam  /
    vaditvantaṃ prayojitavān avīvadat vīṇāṃ parivādakena  / yo 'sau ṇau ṇilopastasya
    sthānivadbhāvena aglopitvāt aṅgasya hrasvo na prāpnoti  / ṇyākṛtinirdeśāt siddham
    //
