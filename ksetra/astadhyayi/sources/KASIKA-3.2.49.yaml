source_id: KASIKA-3.2.49
locator:
  sutra: 3.2.49
witness_text:
  sutra: āśiṣi hanaḥ
  commentary: ḍa iti vartate  / āśiṣi gamyamānāyāṃ hanter dhātoḥ karmaṇy-upapade ḍaprayayo
    bhavati  / timiṃ vadhyāt timihaḥ  / śatruhaḥ  / āśiṣi iti kim ? śatrughātaḥ  /
    dārāvāhano 'ṇantasya ca ṭaḥ sañjñāyām  / dārāv upapade āṅpūrvād hanteḥ aṇ pratyayo
    bhavati, antasya ca ṭa kārādeśo bhavati, sañjñāyāṃ viṣaye  / dāru āhanti dārvāghāṭaḥ  /
    cārau vā  / āṅpūrvāt hanteś cārāv upapade aṇ, antasya vā ṭakārādeśaḥ  / cārvāghāṭaḥ,
    cārvādghātaḥ  / karmaṇi sami ca  / karmaṇy-upapade sampūrvāt hanteḥ dhātoḥ aṇ
    pratyayo bhavati, antasya ca vā ṭakāradeśaḥ  / varṇān saṃhanti varṇasaṅghāṭaḥ,
    varṇasaṅghātaḥ  / padāni saṃhanti padasaṅghāṭaḥ, padasaṅghātaḥ // [#222]
