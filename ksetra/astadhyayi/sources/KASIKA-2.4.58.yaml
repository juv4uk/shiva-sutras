source_id: KASIKA-2.4.58
locator:
  sutra: 2.4.58
witness_text:
  sutra: ṇya-kṣatriya-ārṣa-ñito yūni lug aṇ-iñoḥ
  commentary: ṇya-ādayo gotra-pratyayāḥ  / ṇyāntāt kṣatriyagotrād ārṣād ñitaś ca prayoḥ
    aṇḍañoryūni lug bhavati  / ṇyāntāt tāvat -- kurv-ādibhyo ṇyaḥ (*4,1.151) , tasmād
    yūni iñ, tasya luk  / kauravyaḥ pitā  / kauravyaḥ putraḥ  / nanu ca kauravya-śabdaḥ
    tikādiṣu paṭhyate, tataḥ phiñā bhavitavyam, kauravyāyaṇiḥ iti ? kṣatriyagotrasya
    tatra grahaṇam, kuru-n-ādibhyo ṇyaḥ (*4,1.172) ity anena vihitasya, idaṃ tu brāhmaṇagotram,
    kurv-ādibhyo ṇyaḥ (*4,1.151) iti  / kṣatriya -- ṛṣy-andhaka-vṛṣṇi-kurubhyaś ca
    (*4,1.114) it yaṇ, tasmād yūni iñ, tasya luk  / śvāphalkaḥ pitā  / śvāphalkaḥ
    putraḥ  / ārṣa -- ṛṣyaṇ (*4,1.114), tasmād yūni iñ, tasya luk  / vāsiṣṭhaḥ pitā  /
    vāsiṣṭhaḥ putraḥ  / ñit - anṛṣy-ānantarye vida-ādibhyo 'ñ (*4,1.104), tasmād yūni
    iñ, tasya luk  / baidaḥ pitā  / vaidaḥ putraḥ  / aṇaḥ khalv api -- tika-ādibhyaḥ
    phiñ (*4,1.154), tasmād yūni prāg dīvyato 'ṇ (*4,1.83), tasya luk  / taikāyaniḥ
    pitā  / taikāyaniḥ putraḥ  / etebhyaḥ iti kim ? śiva-ādibhyo 'ṇ (*4,1.112), tasmād
    yūni ata iñ (*4,1.95), tasya lug na bhavati  / kauhaḍaḥ pitā  / kauhaḍi putraḥ  /
    yūni iti kim ? vāmarathyasya chātrāḥ vāmarathāḥ  / kurv-ādibhyo ṇyaḥ (*4,1.151)
    iti ṇyaḥ, tasmāt kaṇva-ādibhyo gotre (*4,2.111) iti śaiṣiko 'ṇ  / tasya lug na
    bhavati  / aṇiñoḥ iti kim ? dākṣerapatyaṃ yuvā dākṣāyaṇaḥ  / abrāhmaṇagotramātramātrādyuvapratyayastopasaṅhyānam  /
    baudhiḥ pitā  / baudhiḥ putraḥ  / jābāliḥ pitā  / jābāliḥ putraḥ  / audumbariḥ
    pitā  / audumbariḥ putraḥ  / bhāṇḍījaṅghiḥ pitā  / bhāṇḍījaṅghiḥ putraḥ  / śālva-avayava-lakṣana
    iñ, tasmāt phak, tasya luk  / pailādi-darśanāt siddham //
