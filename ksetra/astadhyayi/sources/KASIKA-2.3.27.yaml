source_id: KASIKA-2.3.27
locator:
  sutra: 2.3.27
witness_text:
  sutra: sarvanāmnas tṛtīyā ca
  commentary: sarvanāmno hetu-śabda-prayoge hetau dyotye tṛtīyā vibhaktir bhavati,
    ṣaṣṭhī ca  / pūrveṇa ṣaṣṭhyām eva prāptāyām idam ucyate  / kena hetunā vasati,
    kasya hetor vasati  / yena hetunā vasati, yasya hetor vasati  / nimittakāraṇa-hetuṣu
    sarvāsāṃ prāyadarśanam  / [#139] kiṃnimittaṃ vasati, kena nimittena vasati, kasmai
    nimittāya vasati, kasmān nimittād vasati, kasya nimittasya vasati, kasmin nimitte
    vasati  / evaṃ kāraṇahetvor apy udahāryam  / artha-grahanaṃ ca+etat  / paryāyopādānaṃ
    tu svarūpa-vidhirmā vijñāyi iti  / tena+iha api bhavati - kiṃ prpayojanaṃ vasati,
    kena prayojanena vasati, kasmai prayojanāya vasati, kasmāt prayojanād vasati,
    kasya prayojanasya vasati, kasmin prayojane vasati //
