source_id: KASIKA-5.3.114
locator:
  sutra: 5.3.114
witness_text:
  sutra: āyudha-jīvisaṅkghāññyaḍ-vāhīkeṣv abrāhmaṇa-rājanyāt
  commentary: āyudhajīvināṃ saṅghaḥ āyudhajīvisaṅghaḥ  / sa vāhīkair viśeṣyate  /
    vāhīkeṣu ya āyudhajīvisaṅghaḥ, tadvācinaḥ prātipadikāt brāhmaṇarājanyavarjitāt
    svārthe ñyaṭ pratyayo bhavati  / brāhmaṇe tadviśeṣagrahaṇam  / rājanye tu svarūpagrahaṇam
    eva  / ṭakāro ṅībarthaḥ, tena astriyām iti na anuvartate  / kauṇḍibṛsyaḥ, kauṇḍīvṛsyau,
    kauṇḍīvṛsāḥ  / kṣaudrakyaḥ, kṣaudrakyau, kṣudrakāḥ  / mālavyaḥ, mālavyau, mālavāḥ  /
    striyām - kauṇdivṛsī  / kṣaudrakī  / mālavī  / āyudhajīvigrahaṇaṃ kim ? mallāḥ  /
    śayaṇḍāḥ  / saṅghagrahaṇaṃ kim ? samrāṭ  / vāhīkesu iti kim ? śabarāḥ  / pulindāḥ  /
    abrāhmaṇarājanyāt iti kim ? gopālavā brāhmaṇāḥ  / śālaṅkāyanā rājanyāḥ // [#556]
