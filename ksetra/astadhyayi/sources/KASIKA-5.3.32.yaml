locator:
  sutra: 5.3.32
witness_text:
  sutra: paścāt
  commentary: paścād ity ayaṃ śabdo nipātyate 'stāterarthe  / aparasya paścabhāvaḥ
    ātiś ca pratyayaḥ  / aparasyāṃ diśi vasati paścād diśi vasati  / paścād āgataḥ  /
    paścād ramaṇīyam  / dikpūrvapadasya aparasya paścabhāvo vaktavya ātiś ca pratyayaḥ  /
    dakṣiṇāpaścāt  / uttarapaścāt  / ardhottarapadasya dikpūrvasya paścabhāvo vaktavyaḥ  /
    dakṣiṇapaścārdhaḥ  / uttarapaścārdhaḥ  / vinā 'pi pūrvapadena paścabhāvo vaktavyaḥ  /
    paścārdhaḥ //
