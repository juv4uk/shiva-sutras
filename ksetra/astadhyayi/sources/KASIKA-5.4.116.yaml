source_id: KASIKA-5.4.116
locator:
  sutra: 5.4.116
witness_text:
  sutra: ap pūraṇī-pramāṇyoḥ
  commentary: pūraṇapratyāantāḥ strīliṅgāḥ śabdāḥ pūraṇīgrahaṇena gṛhyante  / pramāṇī
    iti svarūpagrahaṇam  / pūraṇyanatāt pramāṇyantāt ca bhuvrīheḥ ap pratyayo bhavati
    samāsāntaḥ  / kalyāṇī pañcamī āsāṃ rātrīṇāṃ tāḥ kalyāṇīpañcamā rātrayaḥ  / kalyāṇīdaśamā
    rātrayaḥ  / strī pramāṇī eśām strīpramāṇāḥ kuṭumbinaḥ  / bhāryāpradhānāḥ ity arthaḥ  /
    api pradhānapūraṇīgrahaṇam kartavyam  / yatra anyapadārthe pūraṇī anupraviśati
    na kevalaṃ vartipadārtha eva, tatra pūraṇyāḥ prādhānyam  / puṃbadbhāvapratiṣedhe
    'pi pradhānapūraṇy eva gṛhyate  / iha na bhavati, kalyāṇī pañcamī asmin pakṣe
    kalyāṇapañcamīkaḥ pakṣaḥ iti  / neturnakṣatra upasaṅhyānam  / [#585] mṛgo netā
    āsāṃ rātrīṇām mṛganetrā rātrayaḥ  / puṣyanetrāḥ  / nakṣatre iti kim ? devadattanetṛkāḥ  /
    chandasi ca neturupasaṅkhyānam  / vṛhaspatinetrā devāḥ  / somanetrāḥ  / māsād
    bhṛtipratyayapūrvapadāṭ ṭhajvidhiḥ  / pañcako māso 'sya pañcakamāsikaḥ karmakaraḥ  /
    daśakamāsikaḥ  / so 'syāṃśavasnabhuṛtayaḥ (*5,1.56) iti saṅkhyāyā atiśadantāyāḥ
    kan (*5,1.52) //
