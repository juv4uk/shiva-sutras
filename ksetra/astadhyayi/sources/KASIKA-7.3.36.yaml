source_id: KASIKA-7.3.36
locator:
  sutra: 7.3.36
witness_text:
  sutra: arti-hvī-vlī-rī-knūyī-kṣmāyy-ātāṃ pug ṇau
  commentary: sarvaṃ nivṛttam, aṅgasya iti vartate  / arti hrī vlī rī knūyī kṣmāyī
    ity eteṣām aṅgānām ākārāntānāṃ ca pugāgamo bhavati ṇau parataḥ  / arti - arpayati  /
    hrī - hrepayati  / vlī - vlepayati  / rī - repayati  / knūyī - knopayati  / kṣmāyī
    - kṣmāpyati  / ākārāntānām - dāpayati  / dhāpayati  / arti iti ṛ gatiprāpaṇayoḥ,
    ṛ gatau iti dvayor api dhātvor grahaṇam  / rī ity api rī gatireṣaṇayoḥ, rīṅ śravaṇe
    iti  / pukaḥ pūrvāntakaraṇam adīdapat ity atra upadhāhrasvo yathā syāt iti //
