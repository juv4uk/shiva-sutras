source_id: KASIKA-3.4.26
locator:
  sutra: 3.4.26
witness_text:
  sutra: svādumi ṇamul
  commentary: samānakartṛkayoḥ pūrvakāle kṛñaḥ iti ca anuvartate  / svādumi ity artha-grahaṇam  /
    svādvartheṣu upapadeṣu kṛño ṇamul pratyayo bhavati  / svāduṅkāraṃ bhuṅkte  / sampannaṅkāraṃ
    bhuṅkte  / lavaṇaṅkāram  / svādumi iti makārānta-nipātanam īkārābhāva-artham,
    cvyantasya api makāra-arthaṃ dīrghābhāva-arthaṃ ca  / asvādvīṃ svādvīṃ kṛtvā bhuṅkte
    svāduṅ-kāraṃ bhuṅkte  / vāsarūpeṇa ktvā api bhavati, svāduṃ kṛtvā bhuṅkte  / tumartha-adhikārāc
    ca sarva ete bhāve pratyayāḥ  / yady evam, svāduṅkāraṃ bhuṅkte devadattaḥ iti
    ṇamulā kartur anabhihitatvāt kartari kasmāt tṛtīyā na bhavati ? bhujipratyayena
    abhihitaḥ kartā, na ca asmin prakaraṇe śaktiśaktimatorbhedo vivakṣyte, samānakartṛkatvaṃ
    hi virudhyate  / pradhānaśakty-abhidhāne vā guṇaśaktir abhihitavat prakāśate //
