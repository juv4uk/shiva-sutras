source_id: KASIKA-7.1.62
locator:
  sutra: 7.1.62
witness_text:
  sutra: neṭyaliṭi radheḥ
  commentary: iḍādau aliṭi pratyaye pare radher numāgamo na bhavati  / radhitā  /
    radhitum  / radhitavyam  / iṭi iti kim ? randhanam  / randhakaḥ  / aliṭi iti kim
    ? rarandhiva  / rarandhima  / numi kṛte saṃyogāntatvāt asaṃyogalliṭ kit (*1,2.5)
    iti kittvaṃ na asti iti nalopo na bhavati  / atha kvasau kathaṃ bhavitavyam ?
    redhivān iti  / katham ? etvabhyāsalopayoḥ kṛtayoḥ iḍāgamaḥ kriyate, tato numāgamaḥ,
    tasya aupadeśikakittvaśrayo lopaḥ  / atha iṭi liṭi ity evaṃ niyamaḥ kasmān na
    kriyate, liṭy eva iṭi na anyatra iti ? viparītam apy avadhāraṇaṃ sambhāvyeta,
    iṭy eva liṭi na anyatra iti  / tathā hi sati rarandha ity atra na syāt, radhitā
    ity atra ca syād eva //
