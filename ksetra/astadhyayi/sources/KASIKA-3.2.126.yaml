locator:
  sutra: 3.2.126
witness_text:
  sutra: lakṣaṇa-hetvoḥ kriyāyāḥ
  commentary: lakṣyate cihnyate tal lakṣaṇam  / janako hetuḥ  / dhātv-artha-viśeṣaṇaṃ
    caitat  / l akṣaṇe hetau ca arthe vartamanāda dhātoḥ parasya laṭaḥ śatṛśānacau
    ādeśau bhavataḥ, tau cel lakṣaṇa-hetū kriyā-viṣayau bhavataḥ  / lakṣaṇe - śayānā
    bhuñjate yavanāḥ  / tiṣṭhanto 'nuśāsati gaṇakāḥ  / hetau - arjayan vasati  / adhīyāno
    vasati  / laṣaṇahetvoḥ iti kim ? pacati, paṭhati  / kriyāyāḥ iti kim ? dravya-guṇayor
    mā bhūt  / yaḥ kampate so 'śvatthaḥ  / yad utplavate tal laghu  / yan niṣīdati
    tad guru  / lakṣaṇa-hetvoḥ iti nirdeśaḥ pūrva-nipāta-vyabhicāra-liṅgam // [#239]
