source_id: KASIKA-6.2.36
locator:
  sutra: 6.2.36
witness_text:
  sutra: ācārya-upasarjanaś ca antevāsī
  commentary: ācāryopasarjanāntevāsināṃ yo dvandvaḥ, tatra pūrvapadaṃ prakṛtisvaraṃ
    bhavati  / āpiśalapāṇinīyāḥ  / pāṇinīyarauḍhīyāḥ  / rauḍhīyakāśakṛtsnāḥ  / apiśalasyāpatyamāpiśalirācaryaḥ,
    ata iñ (*4,1.95)  / tena proktam āpiśalam, iñaś ca (*4,2.112) ityaṇ  / tad adhīyate
    ye 'ntevāsinaḥ te 'py āpiśalāḥ, proktāl luk (*4,2.64) iti tasya taddhitasyādhyetari
    vihitasya luk kriyate  / āpiśaler vā chātrāḥ āpiśalāḥ, ity ubhayathāpyācaryopasarjanaścāntevāsī
    bhavati  / ācāryopasarjanagrahaṇaṃ dvandvaviśeṣaṇārtham, sakalo dvandvaḥ ācāryopasarjano
    yathā vijñāyeta  / iha mā bhūt, pāṇiniyadevadattau  / ācāryopasarjane iti kim
    ? chāndasavaiyākaraṇāḥ  / antevāsī iti kim ? āpiśalapāṇinīye śāstre //
