source_id: KASIKA-5.2.36
locator:
  sutra: 5.2.36
witness_text:
  sutra: tad asya sañjātaṃ tārakā-ādibhya itac
  commentary: tad iti prathamāsamarthebhyas tārakā-ādibhyaḥ śabdebhyaḥ asya iti ṣaṣṭhyarthe
    itac pratyayo bhavati  / sañjāta-grahaṇaṃ prakṛti-viśeṣaṇam  / tārakāḥ sañjātā
    asya nabhasaḥ tārakitaṃ nabhaḥ  / puṣpito vṛkṣaḥ  / tārakā  / puṣpa  / mukula  /
    kaṇṭaka  / pipāsā  / sukha  / duḥkha  / ṛjīṣa  / kuḍmala  / sūcaka  / roga  /
    vicāra  / vyādhi  / niṣkramaṇa  / mūtra  / purīṣa  / kisalaya  / kusuma  / pracāra  /
    tandrā  / vega  / pukṣā  / śraddhā  / utkaṇṭhā  / bhara  / droha  / garbhādaprāṇini  /
    tārakādirākṛtigaṇaḥ // [#506]
