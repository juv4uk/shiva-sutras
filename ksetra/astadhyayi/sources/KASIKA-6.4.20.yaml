locator:
  sutra: 6.4.20
witness_text:
  sutra: jvara-tvara-srivy-avi-mavām upadhāyāś ca
  commentary: jvara tvara srivi ava mava ity eteṣām aṅgānāṃ vakārasya upadhāyāś ca
    sthāne ūṭḥ ity ayam ādeśo bhavati kvau parato 'nunāsike jhalādau ca kṅiti  / jūḥ,
    jūrau, jūraḥ  / jūrtiḥ  / tvara - tūḥ, tūrau, tūraḥ  / tūrtiḥ  / srivisrūḥ, sruvau,
    sruvaḥ  / srūtaḥ  / srūtavān  / srūtiḥ  / ava - ūḥ, uvau, uvaḥ  / ūtiḥ  / mava
    - mūḥ, muvau, muvaḥ  / mūtaḥ  / mūtavān  / mūtiḥ  / jvaratvaropadhā vakārāt parā,
    srivyavamavāṃ pūrvā //
