source_id: KASIKA-6.1.91
locator:
  sutra: 6.1.91
witness_text:
  sutra: upasargād ṛti dhātau
  commentary: āt ity eva  / avarṇāntād upasargāt ṛkārādau dhātau parataḥ pūrvaparayoḥ
    sthāne vṛddhir ekādeśo bhavati  / ādguṇāpavādaḥ  / upārcchati  / prārcchati  /
    upārdhnoti  / upasargāt iti kim ? khaṭvarcchati  / mālarcchati  / pragatā ṛ cchakā
    asmād deśāt prarcchako deśaḥ  / yatkriyāyuktāḥ prādayaḥ taṃ prati gatyupasargasañjñakāḥ
    iti  / ṛti iti kim ? upa itaḥ upetaḥ  / taparakaraṇam kim ? upa ṛkarīyati uparkārīyati  /
    vā supyāpiśaleḥ (*6,1.92) iti vikalpaḥ syāt  / upasargagrahaṇād eva dhātugrahaṇe
    siddhe dhātugrahaṇaṃ śākalanivṛttyartham  / ṛtyakaḥ (*6,1.128) iti hi śākalyasya
    prakrtibhāvaḥ prāpnoti //
