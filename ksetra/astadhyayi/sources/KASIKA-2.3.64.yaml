locator:
  sutra: 2.3.64
witness_text:
  sutra: kṛtvo 'rthaprayoge kāle 'dhikaraṇe
  commentary: chandasi bahulam iti nivṛttam  / kṛtvo 'rthānāṃ prayoge kāle 'dhikaraṇe
    ṣaṣṭhī vibhaktir bhavati  / pañca-kṛtvo 'hno bhuṅkte  / dvir ahno 'dhīte  / kṛtvo
    'rtha-grahaṇaṃ kim ? āhni śete  / rātrau śete  / prayoga-grahaṇaṃ kim ? ahani
    bhuktam  / gamyate hi dvis traś catur veti, na tv aprayujyamāne bhavati  / kāla-grahaṇam
    kim ? dviḥ kāṃsyapātryāṃ bhuṅkte  / adhikaraṇe iti kim ? dvir ahno bhuṅkte  /
    śeṣe ity eva, dvir ahany adhīte //
