source_id: KASIKA-2.2.9
locator:
  sutra: 2.2.9
witness_text:
  sutra: yājaka-ādibhiś ca
  commentary: pūrveṇa samāsaḥ siddha eva, tasya kartari ca (*2,2.16) iti pratiṣedhe
    prāpte vacanam idam ārabhyate pratiprasavārtham  / yājakādibhiḥ saha ṣaṣṭhī samasyate,
    tatpuruṣaś ca samāso bhavati  / brāhmaṇayājakaḥ  / kṣatriyayājakaḥ  / yājaka  /
    pūjaka  / paricāraka  / pariṣecaka  / snātaka  / adhyāpaka  / utsādaka  / udvartaka  /
    hotṛ  / potṛ  / bhartṛ  / rathaganaka  / pattigaṇaka  / tatsthaiś ca guṇaiḥ ṣaṣṭhī
    samasyate iti vaktavyam  / candanagandhaḥ  / kapittharasaḥ  / guṇāttareṇa taralopaś
    cea+ii vaktavyam  / sarveṣāṃ śvetataraḥ sarvaśvetaḥ  / sarveṣāṃ sahattaraḥ sarvamahān  /
    na nirdhāraṇe (*2,2.10) iti pratiṣedhe prāpte vacanam idam  / sarvaśuklā gauḥ
    //
