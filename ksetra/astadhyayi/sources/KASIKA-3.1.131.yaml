witness_text:
  sutra: agnau paricāyya-upacāyya-samūhyāḥ
  commentary: paricāyya upacāyya samūhya ity ete śabdā nipātyante agnāv abhidheye  /
    paripūrvat upapūrvāc ca cinoter ṇya dāyādeśau nipātyete  / paricāyyam  / upacāyyaḥ  /
    sampūrvād vaheḥ samprasāraṇaṃ dīrghatvaṃ ca nipātyate  / samūhyaṃ cinvīta paśukāmaḥ  /
    agnau iti kim ? pariceyam  / upaceyam  / saṃvāhyam //
