source_id: KASIKA-5.4.56
locator:
  sutra: 5.4.56
witness_text:
  sutra: deva-manuṣya-puruṣa-puru-martyebhyo dvitīyāsaptamyor bahulam
  commentary: sātir nivṛttaḥ, trā pratyayo 'nuvartate  / devādibhyaḥ prātipadikebhyaḥ
    dvitīyāsaptamyantebhyaḥ trā pratyayo bhavati bahulam  / kṛbhvastibhiḥ iti na atra
    sambadhyate  / sāmānyena vidhānam  / devān gacchati devatrā gacchati  / deveṣu
    vasti devatrā vasati  / manuṣyān gacchati manuṣyatrā gacchati  / manuṣyeṣu vasati
    manuṣyatrā vasati  / evam anyeṣv apy udāhāryam  / puruṣān gacchati purutrā gacchati  /
    martyān gacchati martyatrā gacchati  / martyeṣu vasati martyatrā vasati  / bahulavacanād
    anyatra api bhavati, bahutrā jīvato manaḥ iti //
