locator:
  sutra: 4.1.79
witness_text:
  sutra: gora-avayavāt
  commentary: aṇ-iñoḥ ity eva  / gotra-avayavāḥ gotrābhimatāḥ kulākhyāḥ puṇikabhuṇikamukharaprabhṛtayaḥ  /
    tato gotre vihitayor aṇiñoḥ striyāṃ ṣyaṅ ādeśo bhavati  / agurūpottamārtha ārambhaḥ  /
    pauṇikyā  / bhauṇikyā  / maukharyā  / yeṣāṃ svanantarāpatye 'pi iṣyate daivadattyā,
    yājñādattyā iti , te krauḍyādiṣu draṣṭavyāḥ //
