source_id: KASIKA-5.3.93
locator:
  sutra: 5.3.93
witness_text:
  sutra: vā bahūnāṃ jātiparipraśno ḍatamac
  commentary: kiṃyattadaḥ iti vartate nirdhārane, ekasya iti ca  / bahūnām iti nirdhārane
    ṣaṣṭhī  / bahunāṃ madhye ekasya nirdhārane gamyamāne jātiparipraśnaviṣayebhyaḥ
    kimādibhyaḥ vā ḍatamac pratyayo bhavati  / katamo bhavatāṃ kaṭhaḥ  / yatamo bhavatām
    kaṭhaḥ, tatama āgacchatu  / vāvacanam akajartham  / yako bhavatāṃ kaṭhaḥ, saka
    āgacchatu  / mahāvibhāṣā ca pratyayavikalopārthā anuvartate eva  / ko bhavatāṃ
    kaṭhaḥ  / yo bhavatāṃ kaṭhaḥ, sa āgacchatu  / jātiparipraśne iti kim ? ko bhavatām
    devadattaḥ  / paripraśnagrahaṇaṃ ca kima eva viśeṣaṇaṃ, na yattadoḥ, asambhavāt  /
    jātigrahaṇaṃ tu sarvair eva sambadyate  / kimo 'smin viṣaye ḍataram api icchanti
    kecit, kataro bhavatāṃ kālāpaḥ iti  / tatra katarakatamau jātiaparipraśne (*2,1.63)
    iti vacanāt siddham //
