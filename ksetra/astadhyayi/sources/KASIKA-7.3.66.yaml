source_id: KASIKA-7.3.66
locator:
  sutra: 7.3.66
witness_text:
  sutra: yaja-yāca-ruca-pravaca-rcaś ca
  commentary: yaja yāca ruca pravaca ṛca ity eteṣāṃ ṇye parataḥ kavargādeśo na bhavati  /
    yaja - yājyam  / yāca - yācyam  / ruca rocyam  / pravaca - pravācyam  / ṛca -
    arcyam  / ṛdupadhād api ṛcer ata eva nipātanāt ṇyat bhavati  / pravacagrahaṇaṃ
    śabdasañjñārtham  / pravācyo nāma pāṭhaviśeṣopalakṣito grantho 'sti  / apare punar
    āhuḥ, upasargapūrvasya niyamārtham, prapūrvasya+eva vacer aśabdasañjñāyāṃ kutvapratiṣedho
    yathā syāt, anyopasargapūrvasya mā bhūt iti  / avivākyamahaḥ iti paṭhanti  / etat
    tu viśeṣa eva+iṣyate, daśarātrasya yad daśamamahaḥ  / anyatra avivācyam eva bhavati  /
    ṇyati pratiṣedhe tyajer upasaṅkhyānam  / tyājyam //
