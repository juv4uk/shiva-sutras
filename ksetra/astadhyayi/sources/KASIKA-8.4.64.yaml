source_id: KASIKA-8.4.64
locator:
  sutra: 8.4.64
witness_text:
  sutra: halo yamāṃ yami lopaḥ
  commentary: anyatarasyām iti vartate  / hala uttareṣāṃ yamāṃ yami parato lopo bhavati
    anyatarasyām  / śayyyā ity atra dvau yakārau, kramajastṛtīyaḥ, tatra madhyamasya
    vā lopo bhavati  / śayyā, śayyyā  / aditer apatyamādityyaḥ ity atra takārāt paraḥ
    ekaḥ yakāraḥ, [#981] yaṇo mayaḥ iti kramajo dvitīyaḥ, tatra madhyamasya vā lopo
    bhavati  / ādityaḥ, ādityyaḥ  / ādityo devatā asya sthālīpākasya iti ādityyaḥ
    ity atra api dvau yakārau kramajastṛtīyaḥ  / tatra madhyamasya madhyamayor vā
    lopo bhavati  / halaḥ iti kim ? ānnam  / yamām iti kim ? agniḥ  / ardhyam  / yami
    iti kim ? śārṅgam //
