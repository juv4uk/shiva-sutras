source_id: KASIKA-8.1.44
locator:
  sutra: 8.1.44
witness_text:
  sutra: kiṃ kriyāpraśne 'nupasargam apratiṣiddham
  commentary: kim ity etat kriyāpraśne yadā vartate tadānena yuktaṃ tiṅantaṃ anupasargam
    apratiṣiddhaṃ nānudāttaṃ bhavati  / kiṃ devadattaḥ pacati, āhosvid bhuṅkte  /
    kiṃ devadattaḥ śete, āhosvid adhīte  / atra kecid āhuḥ, pūrvaṃ kiṃyuktam iti tan
    na nihanyate, uttaraṃ tu na kiṃyuktam iti tannihanyata eva iti  / apare tvāhuḥ,
    yady apy ekasya ākhyātasya samīpe kiṃśabdaḥ śrūyate, tathāpi sarvasya saṃśayaviṣayasya
    tena yogaḥ iti ubhayatra pratiṣedhena bhavitavyam iti  / kriyāgrahaṇaṃ kim ? sādhanapraśne
    mā bhūt, kiṃ devadattaḥ odanaṃ pacati, āhosvicchākam iti  / praśna iti kim ? kim
    adhīte devadattaḥ  / kṣepe kiṃśabdo 'yam, na praśne  / anupasargam iti kim ? kiṃ
    devadattaḥ prapacati, āhosvit prakaroti  / apratiṣiddham iti kim ? kiṃ devadatto
    na paṭhati, āhosvin na karoti //
