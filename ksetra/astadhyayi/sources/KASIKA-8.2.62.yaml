source_id: KASIKA-8.2.62
locator:
  sutra: 8.2.62
witness_text:
  sutra: kvinpratyayasya kuḥ
  commentary: padasya iti vartate  / kvinpratyayasya sarvatra padānte kutvam iṣyate  /
    kvin pratyayo yasmād dhātoḥ sa kvinpratyayaḥ, tasya padasyālo 'ntyasya kavargādeśo
    bhavati  / spṛśo 'nudake kvin (*3,2.58)  / ghṛtaspṛk  / halaspṛk  / mantraspṛk  /
    kvinaḥ kuḥ iti vaktavye pratyayagrahaṇaṃ kṛtaṃ bahuvrīhivijñānārtham  / kvin pratyayo
    yasmād vihitas tasmād anyasminn api pratyaye kutvaṃ yathā syāt  / mā no asrāk  /
    mā no adrāk  / sṛjidṛśibhyāṃ hi kvin vihitaḥ, tayor luṅi kutvam etat  / māṅyoge
    'pi chandasatvād aḍāgamaḥ  / īṭ ca na bhavati, bahulaṃ chandasi (*7.3.97) iti  /
    tathā dṛgbhyām, dṛgbhiḥ iti kvibantasya api dṛśeḥ kutvaṃ bhavati  / evaṃ ca sati
    rajjusṛḍbhyām ity atra api kutvaṃ prāpnoti  / atha tu na+iṣyate, pratividhānaṃ
    kartavyam iti //
