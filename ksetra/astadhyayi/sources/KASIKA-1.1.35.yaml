source_id: KASIKA-1.1.35
locator:
  sutra: 1.1.35
witness_text:
  sutra: svam ajñāti-dhana-ākhyāyām
  commentary: atra api nityā sarvanāma-sañjñā prāptā jasi vibhāṣyate  / svam ity etac-chabda-rūpaṃ
    jasi vibhāṣā sarvanāma-sañjñaṃ bhavati , na cej jñātidhanayoḥ sañjñārūpeṇa vartate  /
    sve putrāḥ, svāḥ putrāḥ  / sve gāvaḥ, svā gāvaḥ  / ātmīyāḥ ity arthaḥ  / jñāti-pratiṣedhaḥ
    iti kim ? dhūmāyanta iva aśliṣṭāḥ prajvalanti iva saṃhatāḥ  / ulmukāni iva me
    'mī svā jñātayo bharatar ṣabha  // adhanākhyāyām iti kim ? prabhūtāḥ svā na dīyante,
    prabhūtaḥ svā na bhujyante  / prabhūtāni dhanāni ity arthaḥ //
