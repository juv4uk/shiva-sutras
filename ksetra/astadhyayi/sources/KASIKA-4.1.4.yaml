source_id: KASIKA-4.1.4
locator:
  sutra: 4.1.4
witness_text:
  sutra: ajādy-ataṣ ṭāp
  commentary: ajā  / devadattā  / striyām iti kim ? ajaḥ  / devadattaḥ // ajādy-ataṣ
    ṭāp (*4,1.4)  / ajādibhyaḥ prātipadikebhyaḥ akārāntāc ca prātipadikāt striyāṃ
    ṭāp pratyayo bhavati  / pakāraḥ sāmānyagrahaṇa-arthaḥ  / ṭakāraḥ sāmānyagrahaṇa-avighātārthaḥ  /
    ajā eḍakā  / kokilā  / caṭakā  / aśvā  / khaṭvā  / devadattā  / taparakaraṇaṃ
    t atkāla-artham  / śubhaṃyāḥ  / kīlālapāḥ brāhmaṇī  / hal-ṅy-ābbhyo dīrghāt su-ti-sy-apṛktaṃ
    hal (*6,1.68) iti su-lopaḥ syāt  / ajādi-grahaṇaṃ tu kvacij jāti-lakṣaṇe ṅīṣi
    prāpte, kvacit tu puṃyoga-lakṣaṇe, kvacit tu puṣpa-phala-uttaralakṣaṇe, kvacit
    tu vayo-lakṣaṇe ṅīpi, kvaciṭ ṭillakṣaṇe  / halantānāṃ tavaprāpta eva kasmiṃścid
    āb vidhīyate  / śūdrā ca amahatpūrvā jātiḥ iti paṭhyate  / tasya ayam arthaḥ  /
    śūdra-śabdaṣ ṭāpam utpādayati jātiś ced bhavati  / śūdrā  / puṃyoge ṅīṣaiva bhavitavyam  /
    śūdrasya bhāryā śūdrī  / mahatpūrvasya pratiṣedhaḥ  / mahāśūdrī  / mahāśūdra-śabdo
    hy ābhīrajātivacanaḥ, tatra tadanta-vidhinā ṭāp prāptaḥ pratiṣidhyate  / grahaṇavatā
    prātipadikena tadanta-vidhir na iti kathaṃ tadanta-vidhiḥ ? etad eva jñāpakaṃ
    bhavati asmin prakaraṇe tadanta-vidhiḥ iti  / tena atidhīvarī, atipīvarī, atibhavatī,
    atimahatī iti bhavati  / [#319] ajā, eḍakā, caṭakā, aśvā, mūsikā iti jātiḥ  /
    bālā, hoḍhā, pākā, vatsā, mandā, vilātā iti vayaḥ  / pūrvāpahāṇā, aparāpahāṇā  /
    ṭit, nipatanāṇ ṇatvam  / saṃbhastrājīnaśaṇapiṇḍebhyaḥ phalāt  / samphalā  / bhastraphalā  /
    ajinaphalā  / śaṇaphalā  / piṇḍaphalā  / triphalā dvigau  / bahuvrīhau triphalī
    saṃhatiḥ  / sadacprākkāṇḍaprāntaśtaikebhyaḥ puṣpāt  / satpuṣpā  / prākpuṣpā  /
    kānḍapuṣpā  / prāntapuṣpā  / śatapuṣpā  / ekapuṣpā  / pākakarṇa iti ṅīṣo 'pavādaḥ  /
    śūdrā ca amahatpūrvā jātiḥ  / kruñcā, uṣṇihā, devaviśā halantāḥ  / jyeṣṭā, kaniṣtā,
    madhyamā puṃyogaḥ  / kokilā jātiḥ  / mūlānnañaḥ  / amūlā //
