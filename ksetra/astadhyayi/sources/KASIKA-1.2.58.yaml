source_id: KASIKA-1.2.58
locator:
  sutra: 1.2.58
witness_text:
  sutra: jāty-ākhyāyam ekasmin bahuvacanam anyatarasyām
  commentary: aśiṣyam iti nivṛtam  / jātir nāma ayam eko 'rthaḥ  / tad-abhidhāne ekavacanam
    eva prāptam ata idam udyate  / jāter ākhyā jāty-ākhyā  / jāty-ākhyāyām ekasminn
    arthe vahuvacanam anyatarasyāṃ bhavati  / jāty-artho bahuvad bhavati iti yāvat  /
    tena tadviśeṣaṇānām ajāti-śabdānām api sampannādīnāṃ bahuvacanam upapadyate  /
    sampanno yavaḥ, sampannā yavāḥ  / sampanno vrīhiḥ, sampannā vrīhayaḥ  / pūrvavayā
    brāhmaṇaḥ pratyuttheyaḥ, pūrvavayaso brāhmaṇāḥ pratyuttheyāḥ  / jāti-grahaṇaṃ
    kim ? devadattaḥ  / yajñadattaḥ  / ākhyāyām iti kim ? kāśyapa-pratikṛtiḥ kāśyapaḥ  /
    bhavatyayaṃ jāti-śabdo na tvanena jātir ākhyāyate  / kiṃ tarhi ? pratikṛtiḥ  /
    ekasmin iti kim ? vrīhiyavau  / saṅkhyāprayoge pratiṣedho vaktavyaḥ  / eko brīhiḥ
    sampannaḥ subhikṣaṃ karoti //
