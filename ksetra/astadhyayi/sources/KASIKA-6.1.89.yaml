source_id: KASIKA-6.1.89
locator:
  sutra: 6.1.89
witness_text:
  sutra: ety-edhaty-ūṭhsu
  commentary: vṛddhir eci iti vartate, āt iti ca  / tad etat ejgrahaṇam eter eva viśeṣaṇaṃ
    , na punar edhateḥ, avyabhicārāt, ūṭhaś ca sambhavāt  / iṇ gatau ity etasmin dhātau
    eci, edha vṛddhau ity etasmin ūṭhi ca pūrvaṃ yad avarṇaṃ tataś ca paro yo 'c,
    tayoḥ pūrvaparyoḥ avarṇācoḥ sthāne vṛddhir ekādeśo bhavati  / upaiti  / upaiṣi  /
    upaimi  / upaidhate  / praidhate  / praṣṭhauhaḥ  / praṣṭhauhā  / praṣṭhauhe  /
    ūṭhi ādguṇāpavādo vṛddhir vidhīyate  / etyedhatyoḥ tu eṅi pararūpāpavādaḥ  / om-āṅoś
    ca (*6,1.95) ity etat tu pararūpaṃ na bādhyate, yena na aprāpte yo vidhir ārabhyate
    sa tasya bādhako bhavati iti, purastād apavādā anantarān vidhīn badhante iti vā  /
    tena+iha na bhavati, upa ā itaḥ upetaḥ iti  / eci iteva, upa itaḥ upetaḥ  / akṣādūhinyāṃ
    vṛddhir vaktavyā  / akṣauhiṇī  / svādīreriṇyor vṛddhir vaktavyā  / svairam  /
    svairiṇī  / prādūḍhoḍhyeṣaiṣyeṣu vṛddhir vaktavyā  / prauḍhaḥ  / prauḍhiḥ  / praiṣaḥ  /
    praiṣyaḥ  / [#620] ṛte ca tṛtīyāsamāse 'varṇād vṛddhir vaktavyā  / sukhena ṛtaḥ
    sukhārtaḥ  / duḥkhena ṛtaḥ duḥkhārtaḥ  / ṛtaḥ iti kim ? sukhena itaḥ sukhetaḥ  /
    tṛtīyā iti kim ? paramartaḥ  / samāse iti kim ? sukhenartaḥ  / pravatsatarakambalavasanānāmrṇe
    vṛddhir vaktavyā  / pra - prārṇam  / vatsatara - vatsatarārṇam  / kambala - kambalārṇam  /
    vasana - vasanārṇam  / ṛṇadaśābhyāṃ vṛddhir vaktavyā  / ṛṇārṇam  / daśārṇam //
