source_id: KASIKA-1.4.1
locator:
  sutra: 1.4.1
witness_text:
  sutra: ā kaḍārādekā sañjñā
  commentary: kāḍarāḥ karmadhāraye (*2,2.38) iti vakṣyati  / ā etasmāt sūtrāvadheryadita
    ūrdhvam anukramiṣyāmaḥ, tatra ekā sañjñā bhavati iti veditavyam  / kā punar asau
    ? yā parā anavakāśā ca  / anyatra sañjāsamāveśān niyama-arthaṃ vacanam ekaiva
    sañjñā bhavati iti  / vakṣyati - hrasvaṃ laghu (*1,4.10), bhidi, chidi - bhettā,
    chettā  / saṃyoge guru (*1,4.11), śikṣi, bhikṣi - śikṣā, bhikṣā  / saṃyoga-parasya
    hrasvasya laghusañjñā prāpnoti, gurusañjñā ca  / ekā sañjñā iti vacanād gurusañjñā
    eva bhavati  / atatakṣat, ararakṣat, sanvallaghuni caṅpare 'naglope (*7,4.93)
    ity eṣa vidhir na bhavati //
