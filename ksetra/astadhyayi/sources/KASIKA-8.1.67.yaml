source_id: KASIKA-8.1.67
locator:
  sutra: 8.1.67
witness_text:
  sutra: pūjanāt pūjitam anudāttaṃ kāṣṭhādibhyaḥ
  commentary: pūjanebhyaḥ kāṣṭhādibhyaḥ uttarapadaṃ pūjitam anudāttaṃ bhavati  / kāṣṭha
    - kāṣṭhādhyāpakaḥ  / kāṣṭhābhirūpakaḥ  / dāruṇa - dāruṇādhyāpakaḥ  / dāruṇābhirūpakaḥ  /
    amātāputra - amātāputrādhyāpakaḥ  / ayuta - ayutābhirūpakaḥ  / ayutādhyāpakaḥ  /
    adbhuta - adbhutādhyāpakaḥ  / anukta - anuktādhyāpakaḥ  / bhṛśa - bhṛśādhyāpakaḥ  /
    ghora - ghorādhyāpakaḥ  / parama - paramādhyāpakaḥ  / su - svadhyāpakaḥ  / ati
    - atyadhyāpakaḥ  / malopaśca  / iti vārtikakāramatam  / mayūravyaṃsakāditvāt samāsaḥ  /
    samāse ca+etad anudāttatvam  / samāsāntodāttatvāpavāda iṣyate  / dāruṇam adhyāpakaḥ
    ity evam ādiṣu na bhavati  / malopaś ca ity anena apy ayam eva viṣaya ākhyāyate,
    yatra vibhakter abhāvāt makāro na śrūyate tatra audāttatvam iti  / asamāse hi
    malopo na+eva+iṣyate  / dāruṇaṃdhīte dāruṇamadhyāyakaḥ iti  / pūjanāt ity eva
    pūjitaparigrahe siddhe pūjitagrahaṇam anantarapūjitapratipattyarthaṃ  / etad eva
    jñāpakam iha prakaraṇe pañcamīnirdeśe 'pi nānantaryamāśrīyate iti  / tathā ca
    yadvṛttān nityam (*8,1.66) ity atra udāhṛtam  / anudāttam iti vartamāne punar
    anudāttagrahaṇam pratiṣedhanivṛttyartham //
