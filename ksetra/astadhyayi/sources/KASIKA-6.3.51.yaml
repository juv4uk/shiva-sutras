source_id: KASIKA-6.3.51
locator:
  sutra: 6.3.51
witness_text:
  sutra: vā śoka-ṣyañ-rogeṣu
  commentary: śoka syañ roga ity eteṣu parataḥ hṛdayasya vā hṛdādeśo bhavati  / hṛcchokaḥ,
    hṛdayaśokaḥ  / ṣyañ - sauhārdyam, sauhṛdayam  / brāhmaṇāditvāt ṣyañ  / hṛdādeśapakṣe
    hṛdbhagasindhvante pūrvapadasya ca (*7,3.19) ity ubhayapadavṛddhiḥ  / roge - hṛdrogaḥ,
    hṛdayarogaḥ  / hṛdayaśabdena samānārtho hṛcchabdaḥ prakṛtyantaram asti, tena+eva
    siddhe vikalpavidhānaṃ prapañcārtham //
