locator:
  sutra: 2.3.32
witness_text:
  sutra: pṛthag-vinā-nānābhis tṛtīyā 'nyatarasyām
  commentary: pañcamī-grahaṇam anuvartate  / pṛthak vinā nānā ity etair yoge tṛtīyā
    vibhaktir bhavati, anyatarasyāṃ pañcamī ca  / pṛthag devadattena, pṛthag devadattāt  /
    vinā devadattena, vinā devadattāt  / nānā devadattena, nānā devadattāt  / pṛthag-vinā-nānābhiḥ
    iti yoga-vibhāgo dvitīyā-arthaḥ  / vinā vātaṃ vinā varṣaṃ vidyut-prapatanaṃ vinā  /
    vinā hastikṛtān doṣān kenemau pātitau drumau // [#141]
