witness_text:
  sutra: nivyabhibhyo 'ḍvyavāye vā chandasi
  commentary: ni vi abhi ity etebhyaḥ upasargebhyaḥ uttarasya sakārasya aḍvyavāye
    chandasi viṣaye mūrdahnyādeśo na bhavati vā  / nyaṣīdat pitā naḥ, nyasīdat  /
    vyaṣīdat pitā naḥ, vyasīdat  / abhyaṣīdat, abhyasīdat  / sadiṣvañjor iti tad iha
    na anuvartate  / sāmānyena+eva tadvacanam  / vyaṣṭaut, vyastaut, abhyaṣṭaut, abhyastaut
    ity etad api siddhaṃ bhavati // iti vāmanakāśikāyāṃ vṛttau aṣṭamādhyāyasya tṛtīyaḥ
    pādaḥ  / aṣṭamādhyāyasya caturthaḥ pādaḥ  / [#966]
