source_id: KASIKA-4.1.49
locator:
  sutra: 4.1.49
witness_text:
  sutra: indra-varuṇa-bhava-śarva-rudra-mṛḍa-hima-araṇya-yava-yavana-mātula-ācāryāṇāmānuk
  commentary: indrādibhyaḥ prātipadikebhyaḥ striyām ṅīṣ pratyayo bhavati, ānuk ca
    āgamaḥ  / yeṣām atra puṃyoga eva iṣyate, teṣām ānugāgamamātraṃ vidhīyate  / ratyayas
    tu pūrveṇa+eva siddhaḥ  / anyeṣāṃ tūbhayaṃ vidhīyate  / indrāṇī  / varuṇānī  /
    bhavānī  / śarvāṇī  / rudrāṇī  / mṛḍānī  / himāraṇyayor mahattve  / mahaddhimaṃ
    himānī  / mahadaraṇyam araṇyānī  / [#331] yavād doṣe  / duṣṭo yavaḥ yavānī  /
    yavanāllipyām  / yavanānī lipiḥ  / upādhyāyamātulābhyāṃ vā  / upādhyāyānī, upādhyāyī  /
    matulānī, matulī  / ācāryādaṇatvaṃ ca  / ācāryānī, ācāryā  / aryakṣatriyābhyāṃ
    vā  / aryāṇī, aryā  / kṣatriyāṇī, kṣatriyā  / vinā puṃyogena svārtha eva ayaṃ
    vidhiḥ  / puṃyoge tu ṅīṣā eva bhavitavyam  / aryī  / kṣatriyī  / mudgalācchandasi
    licca  / rathīrabhūnmudgalānī gaviṣṭau //
