source_id: KASIKA-7.2.16
locator:
  sutra: 7.2.16
witness_text:
  sutra: āditaś ca
  commentary: āditaś ca dhator niṣthāyam iḍāgamo na bhavati  / ñimidā - minnaḥ  /
    minnavān  / ñikṣvidā - kṣviṇṇaḥ  / kṣviṇṇavān  / ñiṣvidā - svinnaḥ  / svannavān  /
    kāro 'nuktasamuccayārthaḥ  / āśvastaḥ  / vāntaḥ  / yogavibhāgakaraṇaṃ kimartham,
    āditaś ca vibhāṣā bhāvādikarmaṇoḥ ity evaṃ paṭhitavyam, anyatra hi bhāvādikarmabhyām
    yasya vibhāṣā (*7,2.15) iti pratiṣedho bhaviṣyati ? jñāpanārtham etat  / jñāpayati
    - yad upādher vibhāṣā tad upādheḥ pratiṣedhaḥ iti  / tena vibhāṣā gamahanavidaviśām
    (*7,2.68) ity atra viderlābhārthasya vibhāṣā iti jñānārthasya pratiṣedho na bhavati  /
    viditaḥ  / viditavān //
