source_id: KASIKA-4.1.90
locator:
  sutra: 4.1.90
witness_text:
  sutra: yūni luk
  commentary: prāg dīvyataḥ iti vartate, aci ca  / prāgdīvyatīye ajādau pratyaye vivakṣite
    buddhisthe 'nutpanna eva yuva-pratyayasya lug bhavati  / tasman nivṛtte sati yo
    yataḥ prāpnoti sa tato bhavati  / phāṇṭāhṛtasya apatyaṃ phāṇṭāhṛtiḥ  / tasya apatyaṃ
    yuvā, phāṇṭāhṛti-mimatābhyāṃ ṇa-phiñau (*4,1.150), phāṇṭāgṛtaḥ  / tasya chāatrāḥ
    iti vivakṣite 'rthe buddhisthe yuva-pratyaysya lug bhavati  / tasmin nivṛtte iñantaṃ
    prakṛti-rūpaṃ sampannam  / tasmāt iñaś ca (*4,2.112) ity aṇ bhavati, phāṇṭāhṛtāḥ  /
    bhāgavittasya apatyaṃ bhāgavittiḥ  / tasya apatyaṃ yuvā, vṛddhāṭ ṭhak sauvīreṣu
    bahulam (*4,1.148) iti ṭhak, bhāgavittikaḥ  / tasya chātrāḥ, pūrvavad yuvapratyaye
    nivṛtte, iñaś ca (*4,2.112) ity aṇ, bhāgavittāḥ  / tikasya apatyaṃ, tikādibhyaḥ
    phiñ (*4,1.154), taikāyaniḥ  / tasya apatyaṃ yuvā, pheś cha ca (*4,1.149) iti
    chaḥ, taikāyanīyaḥ  / tasya chātraḥ, yuva-pratyaye nivṛtte vṛddhāc chaḥ (*4,2.114),
    taikāyanīyāḥ  / kapiñjalādasya apatyaṃ kāpiñjalādiḥ  / tasya apatyaṃ yuvā, kurvādibhyo
    ṇyaḥ (*4,1.151), kāpiñjalādyaḥ  / tasya chātrāḥ, ṇye nivṛtte iñaś ca (*4,2.112)
    ity aṇ, kāpiñjalādāḥ  / glucukasya apatyaṃ, prācām avṛddhāt phin bahulam (*4,1.160)
    iti glucukāyaniḥ  / tasya apatyaṃ yuvā, prāgdīvyato 'ṇ (*4,1.83), glaucukāyanaḥ  /
    tasya chātrāḥ, yuva-pratyaye nivṛtte sa eva aṇ, glaucukāyanāḥ  / aci ity eva,
    phāṇṭāhṛtarūpyam  / phāṇṭāhṛtamayam  / prāgdīvyataḥ ity eva, bhāgavittikāya hitaṃ
    bhāgavittikīyam // [#343]
