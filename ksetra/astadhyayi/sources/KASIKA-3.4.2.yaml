source_id: KASIKA-3.4.2
locator:
  sutra: 3.4.2
witness_text:
  sutra: kriyāsam-abhihāre loṭ loṭo hi-svau vā ca ta-dhvamoḥ
  commentary: dhātu-sambadhe iti vartate  / paunaḥpunyaṃ bhṛśārtho vā kriyā-samabhihāraḥ  /
    prakṛtyartha-viśeṣaṇaṃ ca+etat  / samabhihāra-viśiṣṭa-kriyāvacanād dhātoḥ loṭ
    pratyayo bhavati sarveṣu kāleṣu  / sarvalakārāṇām apavādaḥ tasya ca loṭo hi sva
    ity etāv ādeśau bhavataḥ  / tadhvaṃbhāvinastu vā bhavataḥ  / yoga-vibhāgo 'tra
    kartavyaḥ  / kriyā-samabhihāre loḍ bhavati, tato loṭo hisvau  / loṭ ity eva, loḍ-dharmāṇau
    hisvau bhavataḥ ity arthaḥ  / tena ātmanepada-parasmaipadatvaṃ bhedena avatiṣṭhate,
    tiṅtvaṃ ca dvayor api bhavati  / lunīhi lunīhi ity eva ayaṃ lunāti, imau lunītaḥ,
    ime lunanti  / lunīhi lunīhi ity eva tvaṃ lunāsi, yuvāṃ lunīthaḥ, yūyaṃ lunītha  /
    atha vā, lunīta lunīta+ity eva yūyaṃ lunītha  / lunīhi lunīhi ity eva ahaṃ lunāmi,
    āvāṃ lunīvaḥ, vayaṃ lunīmaḥ  / bhūte - lunīhi lunīhi ity eva ayam alāvīt, alāviṣṭām,
    alāviṣuḥ  / evaṃ madhyama-uttamayor udāhāryam  / bhaviṣyati - lunīhi lunihi ity
    eva ayaṃ laviṣyati, laviṣyataḥ, laviṣyanti  / evaṃ madhyama-uttamayo rudāhāryam  /
    adhīṣvādhīṣvety eva ayam adhīte, imāvadhīyate, ime 'dhīyate  / adhīṣvādhīṣvety
    eva tvam adhīṣe, yuvām adhīyāthe, yūyam adhīdhve  / atha vā, adhīdhvam adhīdhvam
    ity eva yūyam adhīdhve  / adhīṣvādhīṣvety eva aham adhīye, āvām adhīvahe, vayam
    adhīmahe  / evaṃ sarveṣv eva lakāreṣu udāhāryam  / kriyā-samabhihārābhivyaktau
    dvirvacanam ayaṃ loḍ apekṣate, kriyā-samabhihāre dve bhavataḥ iti  / yaṅ-pratyayaḥ
    punar asminn eva arthe vidhīyamānaḥ svayam eva śaktatvān na apekṣate dvirvacanam
    // [#293]
