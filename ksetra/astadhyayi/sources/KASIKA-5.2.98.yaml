locator:
  sutra: 5.2.98
witness_text:
  sutra: vatsāṃsābhyāṃ kāmabale
  commentary: vatsāṃsaśabdābhyām lac pratyayo bhavati yathāsaṅkhyaṃ kāmavati balavati
    ca arthe  / vatsalaḥ  / aṃsalaḥ  / vṛttiviṣaye vatsāṃsaśabdau svabhāvāt kāmabalayor
    vartamānau tadvati pratyayam utpādayataḥ  / na hy atra vatsārthaḥ aṃsārtho vā
    vidyate  / vatsalaḥ iti snehavānucyate, vatsalaḥ svāmī, vatsalaḥ pitā iti  / aṃsalaḥ
    iti ca upacitamāṃso balavānucyate  / na ca ayam artho matupi sambhavati iti nityaṃ
    lajeva bhavati  / anyatra aṃsavatī gauḥ, aṃsavān durbalaḥ //
