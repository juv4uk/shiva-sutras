source_id: KASIKA-1.2.52
locator:
  sutra: 1.2.52
witness_text:
  sutra: viśeṣaṇānāṃ ca ajāteḥ
  commentary: lupi iti vartate  / lub-arthasya yāni viśeṣaṇāni teṣām api ca yuktavad
    vyakti-vacane bhavataḥ jātiṃ varjayitvā  / pañcālāḥ ramaṇīyāḥ, bahvannāḥ, bahukṣīraghṛtāḥ,
    bahumālyaphalāḥ  / godau ramaṇīyau, bahvannau, bahukṣīraghṛtau, bahumālyaphalau  /
    ajāteḥ iti kim ? pañcālāḥ janapadaḥ  / godau grāmaḥ  / jāty-arthasya cāyaṃ yuktavadbhāva-pratiṣedhaḥ  /
    tena jāt-idvāreṇa yāni viśeṣaṇāni teṣām api yuktavadbhāvo na bhavati  / pañcālāḥ
    janapado ramaṇīyo, bahvannaḥ  / godau grāmo ramaṇīyo, bahvannaḥ iti  / manuṣyalupi
    pratiṣedho vaktavyaḥ  / cañcā abhirūpaḥ  / vardhrikā darśanīyaṃ //
