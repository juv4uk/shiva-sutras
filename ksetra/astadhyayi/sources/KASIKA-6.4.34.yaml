source_id: KASIKA-6.4.34
locator:
  sutra: 6.4.34
witness_text:
  sutra: śāsa idaṅhaloḥ
  commentary: śāsa upadhāyā ikārādeśo bhavati aṅi parato halādau ca kṅiti  / anvaśiṣat,
    anvaśiṣatām, anvaśiṣan  / halādau kiti-śiṣṭaḥ  / śiṣṭavān  / ṅiti - āvāṃ śiṣvaḥ  /
    vayaṃ śiṣmaḥ  / ittve kṛte śāsivasighasīnāṃ ca (*8,3.60) iti ṣatvam  / aṅhaloḥ
    iti kim ? śāsati  / śaśāsatuḥ  / śaśāsuḥ  / kvau ca śāsa ittvaṃ bhavati iti vaktavyam  /
    āryān śāsti iti āryaśīḥ  / mitraśīḥ  / yasmāt śāseḥ aṅ vihitaḥ śāsu anuśiṣṭau
    iti, tasya+eva+idaṃ grahaṇam iṣyate  / āṅaḥ śāsu icchāyām iti asya na bhavati  /
    āśāste  / āśāsyamānaḥ  / kvippratyaye tu tasya api bhavati iti vaktavyam  / āśīḥ,
    āśiṣau, āśiṣaḥ  / kṣiyāśīḥpraiṣeṣu tiṅākāṅkṣam (*8,2.104) iti nipātanād vā siddham
    // [#740]
