witness_text:
  sutra: amāvasyad-anyatarasyām
  commentary: amā-śabdaḥ sahārthe vartate  / tasminn upapade vaser dhātoḥ kāle 'dhikaraṇe
    ṇyat pratyayo bhavati, tatra anyatarasyāṃ vṛddhyabhāvo nipātyate  / saha vasato
    'smin kāle sūryācandramasau iti amāvāsya, amāvasyā  / ekadeśavikṛtasya ananyatvād
    amāvāsyāyā vā (*4,3.30) ity atra amāvasyā-śabdasya api grahaṇaṃ bhavati  / amāvasorahaṃ
    ṇyator nipātayāmyavṛddhitām  / tathaikavṛttitā tayoḥ svaraś ca me prasidhyati
    //
