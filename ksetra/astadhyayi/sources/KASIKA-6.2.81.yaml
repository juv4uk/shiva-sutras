source_id: KASIKA-6.2.81
locator:
  sutra: 6.2.81
witness_text:
  sutra: yuktārohy-ādayaś ca
  commentary: yuktārohyādayaḥ samāsāḥ ādyudāttā bhavanti  / yuktārohī  / āgatarohī  /
    āgatayodhī  / āgatavañcī  / āgatanardī  / āgataprahārī  / ete ṇinantāḥ ṇini (*6,2.79)
    ity asya+eva+udāharanārthaṃ pathyante purvottarapadaniyamārthā iti kecit  / iha
    mā bhūt, vṛkṣārohi, yuktādhyāyī iti  / āgatamatsyā  / kṣīrahotā  / bhaginībhartā  /
    yājakāditvāt ṣaṣṭhīsamāsāvetau  / grāmagodhuk  / aśvatrirātraḥ  / gargatrirātraḥ  /
    vyuṣṭatrirātraḥ  / śaṇapādaḥ  / samapādaḥ  / ṣaṣṭhīsamāsā ete  / ekaśitipat  /
    ekaḥ śitiḥ pādo 'sya iti tripado bahuvrīhiḥ  / tatra ekaśitiśabdas taddhitārthottarapadaḥ
    iti tatpuruṣasañjñaḥ, tasya nimittisvarabalīyastvād antodāttatvaṃ prāptam ity
    ādyudāttatvaṃ vidhīyate  / [#674] evam api na artha etena, iganta dvigau (*6,2.29)
    iti siddhatvāt ? evaṃ tarhi jñāpanārtham  / etaj jñāpayati śityantasya+uttarapade
    dvigusvaro na bhavati iti  / tena dviśitipād ity atra tiśabda udātto bhavati  /
    nimittisvarabalīyastvasya apy ekaśitipātsvaravacanam eva jñāpakaṃ varṇayanti  /
    pātresamitādayaś ca yuktārohyādayas tatas te 'py ādyudāttā bhavanti //
