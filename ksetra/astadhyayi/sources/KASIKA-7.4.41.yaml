locator:
  sutra: 7.4.41
witness_text:
  sutra: śā-chor anyatarasyām
  commentary: śā chā ity etayoḥ anyatarasyām ikārādeśo bhavati takārādau kiti  / śā
    niśitam, niśātam  / niśitavān, niśātavān  / chā - avacchitam, avacchātam  / avacchitavān,
    avacchātavān  / śyaterittvaṃ vrate nityam iti vaktavyam  / śaṃśito brahmaṇaḥ  /
    saṃśitavrataḥ ity arthaḥ  / vyavasthitavibhāṣavijñānāt siddham  / devatrāto galo
    grāha iti yoge ca sadvidhiḥ  / mithaste na vibhāṣyante gavākṣaḥ saṃśitavrataḥ
    // [#868]
