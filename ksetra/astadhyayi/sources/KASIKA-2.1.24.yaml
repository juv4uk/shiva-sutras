source_id: KASIKA-2.1.24
locator:
  sutra: 2.1.24
witness_text:
  sutra: dvidīyā śrita-atīta-patita-gata-atyasta-prāpta-āpanaiḥ
  commentary: sup spā iti vartate  / tasya viśeṣaṇam etad dvitīyā  / dvitīyāntaṃ subantam
    śrita-adibhiḥ saha samasyate, tatpuruṣaś ca samāso bhavati  / kaṣṭaṃ śritaḥ kaṣṭaśritaḥ  /
    narakaśritaḥ  / atīta -- kāntāram atītaḥ kāntārātitaḥ  / patita -- narakam patitaḥ
    narakapatitaḥ  / gata -- grāmam gataḥ grāmagataḥ  / atyasta -- taraṅganatyastaḥ
    taraṅgātyastaḥ  / tuhinātyastaḥ  / prāpta -- sukhaṃ prāptaḥ sukhaprāptaḥ  / āpanna
    -- sukham āpannaḥ sukhāpannaḥ  / duḥkhāpannaḥ  / śritta-adiṣu gamigāmyādinām upasaṅkhyanam  /
    grāmaṃ gamī grāmagamī  / grāmam gāmī grāmāgāmī  / odnaṃ bubhukṣuḥ odanabubhukṣuḥ
    //
