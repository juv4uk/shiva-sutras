source_id: KASIKA-4.1.113
locator:
  sutra: 4.1.113
witness_text:
  sutra: avṛddhābhyo nadī-mānuṣībhyas tannāmikābhyaḥ
  commentary: vṛddhir yasya acām ādis tad vṛddham (*1,1.73)  / avṛddhābhyaḥ iti śabda-dharmaḥ,
    nadī-mānuṣībhyaḥ iti arthadharmaḥ, tena abhedāt prakṛtayo nirdiśyante  / tannāmikābhyaḥ
    iti sarvanāmnā pratyaya-prakṛteḥ parāmarśaḥ  / avṛddhāni yāni nadīnāṃ mānuṣīṇāṃ
    ca nāmadheyāni, tebhyo 'patye aṇ pratyayo bhavati  / ḍhako 'pavādaḥ  / yamunāyā
    apatyaṃ yāmunaḥ  / irāvatyāḥ apatyam airāvataḥ  / vaitastaḥ  / nārmadaḥ  / mānuṣībhyaḥ
    khalv api - śikṣitāyāḥ apatyaṃ śaikṣitaḥ  / cintitāyāḥ apatya caintitaḥ  / avṛddhābhyaḥ
    iti kim ? candrabhāgāyāḥ apatyaṃ cāndrabhāgeyaḥ  / vāsavadtteyaḥ  / nadīmānuṣībhyaḥ
    iti kim ? sauparṇeyaḥ  / vainateyaḥ  / tannāmikābhyaḥ iti kim ? śobhanāyāḥ, śaubhaneyaḥ
    //
