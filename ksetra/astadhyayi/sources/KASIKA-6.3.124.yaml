locator:
  sutra: 6.3.124
witness_text:
  sutra: das ti
  commentary: dā ity etasya yaḥ takārādir ādeśaḥ tasmin parataḥ igantasya+upasargasya
    dīrgho bhavati  / nīttam  / vīttam  / parīttam  / aca upasargāt taḥ (*7,4.47)
    ity antasya yady api takāraḥ kriyate tathāpi cartvasyāśrayāt siddhatvam iti takārādir
    bhavati  / ikaḥ ity eva, prattam  / avattam  / daḥ iti kim ? vitīrṇam  / nitīrṇam  /
    ti iti kim ? sudattam //
