locator:
  sutra: 3.3.163
witness_text:
  sutra: praiṣa-atisarga-prāptakāleṣu kaṛtyāś ca
  commentary: preṣaṇaṃ praiṣaḥ  / kāmacāra-abhyanujñānam atisargaḥ  / nimitta-bhūtasya
    kālasya avasaraḥ prāpta-kālatā  / eteṣv artheṣu dhātoḥ kṛtya-sañjñakāḥ pratyayāḥ
    bhavanti, cakārāl loṭ ca  / bhavatā kaṭaḥ karaṇīyaḥ, kartavyaḥ, kṛtyaḥ, kāryaḥ  /
    loṭ khalv api - karotu kaṭaṃ bhavān iha preṣitaḥ, bhavān atisṛṣṭah, bhavataḥ prāpta-kālaḥ
    kaṭakaraṇe  / kimarthaṃ praiṣādiṣu kṛtyā vidhīyante na sāmānyena, bhāva-karmaṇor
    vihitā eva te praiṣādiṣv anyatra ca bhaviṣyanti ? viśeṣa-vihitena anena loṭā bādyante  /
    vāsarūpa-vidhinā bhavisyanti ? evaṃ tarhi jñāpayati, stry-adhikārāt pareṇa vāsarūpa-vidhir
    nāvaṣyaṃ bhavati iti  / vidhipraiṣayoḥ ko viśeṣa ? kecid āhuḥ, ajñātajñāpanaṃ
    vidhiḥ, preṣaṇaṃ praiṣaḥ iti //
