source_id: KASIKA-6.2.148
locator:
  sutra: 6.2.148
witness_text:
  sutra: kārakād datta-śrutayor eva āśiṣi
  commentary: sañjñāyām iti vartate, ktaḥ iti ca  / sañjñāyāṃ viṣaye āśiṣi gamyamānāyāṃ
    kārakād uttarayoḥ dattaśrutayor eva ktāntayor anta udātto bhavati  / devā enaṃ
    deyāsuḥ devadattaḥ  / viṣṇurenaṃ śrūyāt viṣṇuśrutaḥ  / kārakāt iti kim ? kārakān
    niyamo mā bhūt  / sambhūto rāmāyaṇaḥ  / dattaśrutayoḥ iti kim ? devapālitaḥ  /
    etasmān niyamād atra sañjñāyām anācitādīnām (*6,2.146) ity antodāttatvaṃ na bhavati  /
    tṛtīyā karmaṇi (*6,2.48) ity eva atra bhavati  / evakārakaraṇaṃ kim ? kārakāvadhāraṇaṃ
    yathā syat, dattaśrutāvadhāraṇaṃ mā bhūt  / akārakād api dattaśrutayor anta udātto
    bhavati  / saṃśrutaḥ  / viśrutaḥ  / āśiṣi iti kim ? anāaśiṣi niyamo mā bhūt  /
    devaiḥ khātā devakhātā  / kārakād dattaśrutayor āśisyeva ity evam atra niyama
    iṣyate  / tena āhato nadati devadattaḥ ity atra na bhavati  / devadatta iti kasyacicchaṅkhasya
    nāma  / tatra tṛtīyā karmaṇi (*6,2.48) iti pūrvapadaprakṛtisvaratvam eva bhavati
    //
