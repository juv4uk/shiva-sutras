source_id: KASIKA-8.1.52
locator:
  sutra: 8.1.52
witness_text:
  sutra: loṭ ca
  commentary: loḍantaṃ tiṅantaṃ gatyarthaloṭā yuktaṃ nānudāttaṃ bhavati, na cet kārakaṃ
    sarvānyad bhavati  / loḍantayor ekaṃ kārakaṃ yadi bhavati ity arthaḥ  / āgaccha
    devadatta, grāmaṃ paśya  / āgaccha viṣṇumitra, grāmaṃ śādhi  / āgamyatāṃ devadattena,
    grāmo dṛśyatāṃ yajñadattena  / gatyarthānām ity eva, paca devadattaudanam, bhuṅkṣva
    enam  / loṭā ity eva, āgaccheḥ devadatta grāmam, paśya enam  / na cet kārakaṃ
    sarvānyat ity eva, āgaccha devadatta grāmam, paśyatu enam yajñadattaḥ  / sarvagrahaṇānuvṛttestu
    iha bhavaty eva, āgaccha devadatta grāmam tvaṃ cāhaṃ ca paśyāva  / pṛthagyogakaraṇam
    uttarārtham //
