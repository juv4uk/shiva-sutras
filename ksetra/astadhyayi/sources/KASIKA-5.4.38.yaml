source_id: KASIKA-5.4.38
locator:
  sutra: 5.4.38
witness_text:
  sutra: prajñādibhyaś ca
  commentary: prajānāti iti prajñaḥ  / prajña ity evam ādibhyaḥ prātipadikebhyaḥ svārthe
    aṇpratyayo bhavati  / prajña eva prājñaḥ  / prājñī strī  / yasya astu prajñā vidyate
    sā prājñā prajñā-śraddhā-arcā-vṛttibhyo ṇaḥ (*5,2.101) iti  / vidannityatra paṭhyate  /
    videḥ śatrantasya grahaṇaṃ, videḥ śaturvasuḥ (*7,2.36) ity ata eva jñāpakāt pākṣiko
    vasvādeśaḥ  / anyatarasyāṃgrahaṇaṃ vā tatra anuvartate, tu-hyos tātaṅ āśiṣy-anyatarasyām
    (*7,1.35) iti  / prajña  / vaṇij  / uśij  / uṣṇij  / pratyakṣa  / vidvas  / vidan  /
    ṣoḍan  / ṣoḍaśa  / vidyā  / manas  / śrotra śarīre - śrautram  / juhvat kṛṣṇamṛge  /
    cikīrṣat  / cora  / śatru  / yodha  / cakṣus  / vakṣas  / dhūrta  / vas  / et  /
    marut  / kruṅ  / rājā  / satvantu  / daśārha  / vayas  / ātura  / rakṣas  / piśāca  /
    aśani  / kārṣāpaṇa  / devatā  / bandhu  / prajñādiḥ //
