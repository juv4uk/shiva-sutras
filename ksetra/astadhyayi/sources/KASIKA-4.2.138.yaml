source_id: KASIKA-4.2.138
locator:
  sutra: 4.2.138
witness_text:
  sutra: gaha-ādibhyaś ca
  commentary: gaha ity evam ādibhyaḥ prātipadikebhyaḥ chaḥ pratyayo bhavati śaisikaḥ  /
    aṇāder apavādaḥ  / gahīyaḥ  / antaḥsthīyaḥ  / deśādhikāre 'pi saṃbhava-apekṣaṃ
    viśeṣaṇaṃ, na sarveṣām  / madhyamadhyamaṃ cāṇ caraṇe iti paṭhyate, tasyāyamarthaḥ  /
    madhya-śabdaḥ pratyayasaṃniyogena madhyamam āpadyate  / madhyamīyāḥ  / caraṇe
    tu pratyayarthe aṇ bhavati, mādhyamāḥ iti  / tad etad viśeṣa eva smaryate  / pṛthivīmadhyasya
    madhyamabhāvaḥ  / caraṇasambandhena nivāsalakṣaṇo 'ṇ iti ca  / mukhapārśvatasor
    lopaś ca  / mukhatīyam  / pārśvatīyam  / kugjanasya parasya ca  / janakīyam  /
    parakīyam  / devasya ca+iti vaktavyam  / devakīyam  / veṇukādibhyaś chaṇ vaktavyaḥ  /
    ākṛtigaṇo 'yam  / vaiṇukīyam  / vaitrakīyam  / auttarapadakīyam  / prāsthakīyam  /
    mādhyamakīyam  / gaha  / antaḥstha  / sama  / viṣama  / madhyamadhyamaṃ cāṇ caraṇe  /
    uttama  / aṅga  / vaṅga  / magadha  / pūrvapkṣa  / aparapakṣa  / adhamaśākha  /
    uttamaśākha  / samānaśākha  / ekagrāma  / ekavṛkṣa  / ekapalāśa  / eṣvagra  /
    iṣvanī  / avasyandī  / kāmaprastha  / khāḍāyani  / kāveraṇi śaiśiri  / śauṅgi  /
    āsuri  / āhiṃsi  / āmitri  / vyāḍi  / vaidaji  / bhauji  / āḍhyaśvi  / ānṛśaṃsi  /
    sauvi  / pāraki  / agniśarman  / devaśarman  / śrauti  / āraṭaki  / vālmīki  /
    kṣemavṛddhin  / uttara  / antara  / mukhapārśvatasorlopaḥ  / janaparayoḥ kukca  /
    devasya ca  / veṇukādibhyaś chaṇ  / gahādiḥ //
