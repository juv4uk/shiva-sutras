locator:
  sutra: 4.1.150
witness_text:
  sutra: phāṇḍāhṛti-mimatābhyāṃ ṇa-phiñau
  commentary: sauvīreṣu ity eva  / kutsane iti nivṛttam  / phāṇṭāhṛtimimataśabdābhyāṃ
    sauvīra-viṣayābhyām apatye ṇa-phiñau pratyayu bhavataḥ  / phako 'pavādaḥ  / alpāctarasya
    apūrvanipāto lakṣaṇa-vyabhicāra-cihnaṃ, tena yathāsaṅkhyam iha na bhavati iti  /
    phāṇṭāhṛtaḥ, phāṇṭāhṛtāyaniḥ  / maimataḥ, maimatāyaniḥ  / sauvīreṣu ity eva, phāṇṭāhṛtāyanaḥ  /
    maimatāyanaḥ / phāṇṭāhṛteḥ yañ-iñoś ca (*4,1.101) iti phak  / mimata-śabdo 'pi
    naḍādiṣu paṭhyate //
