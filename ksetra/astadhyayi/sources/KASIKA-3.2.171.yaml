source_id: KASIKA-3.2.171
locator:
  sutra: 3.2.171
witness_text:
  sutra: ād-ṛ-gama-hana-janaḥ ki-kinau liṭ ca
  commentary: ā-kārāntebhyaḥ ṛ-varṇāntebhyaḥ gama hana jana ity etebhyaś ca chandasi
    viṣaye tacchīlādiṣu ki-kinau pratayau bhavataḥ  / liṅvac ca tau bhavataḥ  / āt
    iti takāro mukha-sukha-arthaḥ, na tvayaṃ aparaḥ, mā bhūttād api paraḥ taparaḥ
    iti ṛkāre tatkāla-grahaṇam  / papiḥ somaṃ dadirgāḥ  / dadathuḥ mitrāvaruṇā taturim
    mitrāvaruṇau taturiḥ  / dūre hy adhvā jaguriḥ  / jagmiryuvā  / jaghnirvṛtra  /
    jajñi bijam  / atha kimarthaṃ kittvam, yāvatā asaṃyogāl liṭ kit (*1,2.5) iti kittvaṃ
    siddham eva ? ṛcchaty-ṛ-ṛtām (*7,4.11) iti liṭi guṇaḥ pratiṣedha-viṣaya ārabhyate,
    tasya api bādhana-arthaṃ kittvam  / ki-kināv utsargaś chandasi sadādibhyo darśanāt  /
    sediḥ  / nemiḥ  / bhāṣāyāṃ dhañkṛñsṛjanigaminamibhyaḥ ki-kinau vaktavyau  / didhiḥ  /
    cakriḥ  / sastriḥ  / jajñiḥ  / jagmiḥ  / nemiḥ  / sahivahicalipatibhyo yaṅ-antebhyaḥ
    ki-kinau vaktavyau  / dīrgho 'kitaḥ (*7,4.83) sāsahiḥ  / vāvahiḥ  / cācaliḥ  /
    pāpatiḥ //
