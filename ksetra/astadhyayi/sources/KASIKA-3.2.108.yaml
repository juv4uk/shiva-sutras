locator:
  sutra: 3.2.108
witness_text:
  sutra: bhāṣāyāṃ sada-vasa-śruvaḥ
  commentary: sada vasa śru ity etebhyaḥ parasya liṭo bhāṣāyāṃ viṣaye vā kvasur ādeśo
    bhavati  / ādeśa-vidhānād eva liḍ api tadviṣayo 'numīyate  / upasedivān kautsaḥ
    pāṇinim  / tena mukte yathāprāptaṃ pratyayā bhavanti  / upāsadat  / upāsīdat  /
    upasasāda  / anūṣīvān kautsaḥ pāṇinim  / anvavātsīt  / anvavasat  / anūvāsa  /
    upaśuśruvān kautsaḥ pāṇinim  / upāśrauṣīt  / upāśṛṇot  / upaśuśrāva  / luṅ-laṅ-viṣaye
    parastād anuvṛtteḥ kvasur bhavati // [#235]
