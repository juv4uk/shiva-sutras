source_id: KASIKA-3.3.131
locator:
  sutra: 3.3.131
witness_text:
  sutra: vartamāna-sāmīpye vartamānavad vā
  commentary: samīpam eva sāmīpyam  / ṣyañaḥ svārthikatvaṃ jñāpyate cāturvarṇyādi-siddhy-artham  /
    vartamāna-samīpe bhūte bhaviṣyati ca vartamānād dhātoḥ vartamānavat pratyayā vā
    bhavanti  / vartamane laṭ (*3,2.123) ity ārabhya yāvad uṇādayo bahulam (*3,3.1)
    iti vartāmāne pratyayā uktāḥ, te bhūta-bhaviṣyator vidhīyante  / [#281] kadā devadatta
    āgato 'si ? ayam āgacchāmi  / āgacchantam eva māṃ viddhi  / ayam āgamam  / eṣo
    'smi āgataḥ  / kadā devadatta gamiṣyasi ? eṣa gacchāmi  / gacchantam eva mā viddhi  /
    eṣa gamiṣyāmi  / gantāsmi  / vatkaraṇaṃ sarvasādṝśya-artham  / yena viśeṣaṇena
    vartamāne pratyayāḥ vihitāḥ prakṛtyopapadopādhinā tathā+eva atra bhavanti  / pavamānaḥ  /
    yajamānaḥ  / alaṅkariṣṇuḥ  / sāmīpya-grahaṇaṃ kim ? viprakarṣa-vivakṣāyāṃ mā bhūt,
    parudagacchat pāṭaliputram  / varṣeṇa gamiṣyati  / yo manyate gacchāmi iti padaṃ
    vartamāne kāle eva vartate, kālāntaragatis tu vākyād bhavati, na ca vākyagamyaḥ
    kālaḥ padasaṃskāravelāyām upayujyate iti tādṛśaṃ vākyārtha-pratipattāraṃ prati
    prakaraṇam idaṃ nārabhyate  / tathā ca śvaḥ kariṣyati, varṣeṇa gamiṣyati iti sarvam
    upapadyate //
