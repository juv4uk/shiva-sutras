source_id: KASIKA-2.3.66
locator:
  sutra: 2.3.66
witness_text:
  sutra: ubhaya-prāptau karmaṇi
  commentary: pūrvaṇa ṣaṣṭhī prāptā niyamyate  / ubhayaprāptau iti bahuvrīhiḥ  / ubhayoḥ
    prāptir yasmin kṛti, so 'yam ubhayaprāptiḥ  / tatra karmaṇy eva ṣaṣthī vibhaktir
    bhavati, na kartari  / āścaryo gavāṃ doho 'gopālakena  / rocate me odanasya bhojanaṃ
    devadattena  / sādhu khalu payasaḥ pānaṃ yajñadattena  / bahuvrīhivijñānād iha
    niyamo na bhavati, āścaryam idam odanasya nāma pāko brāhmaṇānaṃ ca prādurbhāvaḥ
    iti  / akākārayoḥ strī-pratyayayoḥ prayoge na+iti vaktavyam  / bhedikā devadattasya
    kāṣṭhānām  / cikirṣā devadattasya kaṭasya  / śeṣe vibhāṣā  / akākārayoḥ strīpratyayayorgrahanāt
    tadapekṣayā śeṣaḥ strīpratyaya eva gṛhyate  / śobhanā hi sūtrasya kṛtiḥ pāṇineḥ
    pāṇininā vā  / kecid aviśeṣeṇaiva vibhāṣām icchanti, śabdānām anuśāsanam ācāryaṇa
    ācāryasya iti vā //
