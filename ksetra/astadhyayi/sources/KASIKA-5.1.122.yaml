source_id: KASIKA-5.1.122
locator:
  sutra: 5.1.122
witness_text:
  sutra: pṛthv-ādibhya imanij vā
  commentary: pṛthu ity evam ādibhyaḥ prātipadikebhyaḥ imanic pratyayo bhavati vā
    tasya bhāvaḥ ity etasminn arthe  / vāvacanam aṇādeḥ samāveśa-artham  / pṛthor
    bhāvaḥ prathimā, pārthavam  / mradimā, mārdavam  / tur iṣṭha-ima-īyaḥsu (*6,4.154),
    ṭeḥ (*6,4.155) iti ṭilopaḥ  / ra ṛto halader laghoḥ (*6,4.161) iti rephādeśaḥ  /
    tvatalau sarvatra bhavata eva  / pṛthutvam, pṛthutā  / mṛdutvam, mudutā  / pṛthu  /
    mṛdu  / mahat  / paṭu  / tanu  / lghu  / bahu  / sādhu  / veṇu  / āśu  / bahula  /
    guru  / daṇḍa  / ūru  / khaṇḍa  / caṇḍa  / bāla  / akiṃcana  / hoḍa  / pāka  /
    vatsa  / manda  / svādu  / hrasva  / dīrgha  / priya  / vṛṣa  / ṛju  / kṣipra  /
    kṣupra  / kṣudra  / pṛthvādiḥ //
