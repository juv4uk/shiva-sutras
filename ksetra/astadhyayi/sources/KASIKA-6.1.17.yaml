source_id: KASIKA-6.1.17
locator:
  sutra: 6.1.17
witness_text:
  sutra: liṭy abhyāsasya+ubhayeṣām
  commentary: ubhayeṣāṃ vacyādīnāṃ grahyādīnāṃ ca liṭi parato 'bhyāsasya samprasāraṇaṃ
    bhavati  / vaci - uvāca  / uvacitha  / svapi - suṣvāpa  / suṣvapitha  / yaja iyāja  /
    iyajitha  / ḍuvap - uvāpa  / uavapitha  / grahyādīnām - tatra graher aviśeṣaḥ  /
    jagrāha  / jagrahitha  / jyā - jijyau  / jijyitha  / vayi - uvāya  / uvayitha  /
    vyadha - vivyādha  / vivyadhitha  / vaśa - uvāśa  / uvaśitha  / vyaca - vivyāca  /
    vivyacitha  / vṛścateḥ satyasati vā yoge na asti viśeṣaḥ  / yogārambhe tu sati
    yadi samprasāraṇam akṛtvā halādiśeṣeṇa repho nivartyate, tadā vakārasya samprasāraṇaṃ
    prāpnoti  / atha rephasya samprasāraṇaṃ kṛtvā uradatvaṃ raparatvaṃ ca kriyate,
    tadānī - muradatvasya sthānivadbhāvāt na samprasāraṇe samprasāraṇam (*6,1.37)
    iti pratiṣedho bhavati ity asti viśeṣaḥ  / vavraśca  / vavraścitha  / pṛcchati
    bhṛjjatyor aviśeṣaḥ  / akidarthaṃ ca+idam abhyāsasya samprasāraṇaṃ vidhīyate  /
    kiti hi paratvād dhātoḥ samprasāraṇe kṛte punaḥ prasaṅgavijñānād dvirvacanam,
    ūcatuḥ, ūcuḥ iti  / adhikārād eva+ubhayeṣāṃ grahaṇe siddhe punar ubhayeṣām iti
    vacanaṃ halādiḥ śeṣam api bādhitvā samprasāraṇam eva yathā syāt iti  / vivyādha
    //
