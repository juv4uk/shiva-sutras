source_id: KASIKA-4.3.154
locator:
  sutra: 4.3.154
witness_text:
  sutra: prāṇi-rajata-ādibhyo 'ñ
  commentary: prāṇi-vācibhyaḥ prātipadikebhyo rajatadibhyaś ca añ pratyayo bhavati
    vikārāvayavayor arthayoḥ  / aṇādinām apavādaḥ  / anudāttādeḥ añ vihita eva pariśiṣṭam
    iha+udāharaṇam  / prāṇibhyastāvat - kāpotam  / māyūram  / taittiram  / rajatādibhyaḥ
    - rājatam  / saisam  / lauham  / rajatādiṣu ye 'nudāttādayaḥ paṭyante rajatakaṇḍakaraprabhṛtayastebhyo
    'ñi siddhe punarvacanaṃ mayaḍvādhanārtham  / rajata  / sīsa  / loha  / udumbara  /
    nīladāru  / rohitaka  / bibhītaka  / pītadāsa  / tīvradāru  / trikaṇṭaka  / kaṇṭakāra  /
    rajatādiḥ //
