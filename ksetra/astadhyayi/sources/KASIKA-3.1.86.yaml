source_id: KASIKA-3.1.86
locator:
  sutra: 3.1.86
witness_text:
  sutra: liṅy āśiṣy aṅ
  commentary: āśiṣi viṣaye yo liṅ tasmin parataḥ chandasi viṣaye aṅ pratyayo bhavati  /
    śapo 'pavādaḥ  / chandasy ubhayathā (*3,4.117) iti liṅaḥ sārvadhātuka-sañjñāpyasti  /
    sthāgāgamivacividiśakiruhayaḥ prayojanam  / sthā - upastheṣaṃ vṛṣabhaṃ tugriyāṇām  /
    gā - satyam upageṣam  / gami - gṛhaṃ gamema  / vaci - mantraṃ vocemāgnaye  / vidi
    - videyamenāṃ manasi praviṣṭām  / śaki - vrataṃ cariṣyāmi tacchakeyam  / ruhi
    - svargaṃ lokam āruheyam  / dṛśerag vaktavyaḥ  / pitaraṃ dṛśeyaṃ mātaraṃ ca //
    [#195]
