source_id: KASIKA-4.3.116
locator:
  sutra: 4.3.116
witness_text:
  sutra: kṛte granthe
  commentary: tena ity eva  / tṛtīyā-samarthāt kṛte ity etasminn arthe yathāvihitaṃ
    pratyayo bhavati, yat tatkṛtaṃ granthaś cet sa bhavati  / vararucinā kṛtāḥ vārarucāḥ
    ślokāḥ  / haikupādo granthaḥ  / bhaikurāṭo granthaḥ  / jālūkaḥ  / granthe iti
    kim ? takṣakṛtaḥ prāsādaḥ  / utpāditaṃ kṛtaṃ, vidyāmānām eva jñātam aupajñātam
    ity ayam anayor viśeṣaḥ //
