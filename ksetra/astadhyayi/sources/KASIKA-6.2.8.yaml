source_id: KASIKA-6.2.8
locator:
  sutra: 6.2.8
witness_text:
  sutra: nivāte vātatrāṇe
  commentary: nivātaśabde uttarapade vātatrāṇavācini tatpuruṣe samāse pūrvapadaṃ prakṛtisvaraṃ
    bhavati  / kuṭyeva nivātam kuṭīnivātam  / śamīnivātam  / kuḍyanivātam  / vātasyābhāvo
    nivātam, arthābhāvaḥ ity avyayībhāvaḥ  / niruddho vāto 'smin iti vā nivātam iti
    bahuvrīhiḥ  / tatra kuḍyādihetuke nivāte kuḍyādayo vartamānāḥ samānādhikaraṇena
    nivātaśabdena saha samasyante  / kuṭīśamīśabdau gaurādiṅoṣantāvantodātau  / kuḍyaśabdo
    'pi kavater yat ḍakkicca iti yatpratyayānta ādyudātta ity eke  / ḍyakpratyayānto
    'ntodāttaḥ ityapare  / vātatrāne iti kim ? rājanivāte vasati  / sukhaṃ mātṛnivātam  /
    nivātaśabdo 'yaṃ pārśvavācī rūḍhiśabdas tatrobhayatra ṣaṣṭhīsamāsaḥ //
