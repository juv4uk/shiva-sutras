witness_text:
  sutra: adhyāyeṣv eva rṣeḥ
  commentary: ṛṣi-śabdāḥ pravarnāmadheyāni, tebhyaḥ ṛṣi-śabdebhyo bhavavyākhyānayoḥ
    arthayoḥ ṭhañ pratayo bhavati aṇo 'pavādaḥ adhyāyeṣveva pratyayārthe viśeṣaṇeṣu  /
    vyākhyātavyanāmnaḥ ityanuvartate, tatsāhacaryād ṛṣiśabdair grantha ucyate  / vasiṣṭhasya
    vyākhyānaḥ tatra bhavo vā vāsiṣṭhiko 'dhyāyaḥ  / vaiśvāmitrikaḥ  / adhyāyeṣu iti
    kim ? vāsiṣṭhī ṛk //
