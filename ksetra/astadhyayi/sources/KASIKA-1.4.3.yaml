source_id: KASIKA-1.4.3
locator:
  sutra: 1.4.3
witness_text:
  sutra: yū stry-ākhyau nadī
  commentary: ī ca ū ca yū  / avibhaktiko nirdeśaḥ  / striyam ācakṣate stryākhyau  /
    [#76] mūlavibhujādi-darśanāt ka-pratyayaḥ  / īkāra-antam ūkara-antaṃ ca stryākhyaṃ
    śabda-rūpaṃ nadīsañjñaṃ bhavati  / [#75] īkara-antam - kumārī  / gaurī  / lakṣmīḥ  /
    śārṅgaravī  / ūkāra-antam - brahmavandhūḥ  / yavāgūḥ  / yū iti kim ? mātre  /
    duhitre  / stryākhyau iti kim ? grāmaṇīḥ  / senānīḥ  / khalapūḥ  / ākhyā-grahaṇaṃ
    kim ? śabda-arthe strītva eva yathā syāt, padāntarākhye mā bhūt, grāmanye striyai  /
    khalapve striyai  / nadīpradeśāḥ - āṇnadyāḥ (*7,3.112) ity evam ādayaḥ // [#76]
