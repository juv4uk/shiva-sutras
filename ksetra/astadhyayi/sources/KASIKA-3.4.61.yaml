source_id: KASIKA-3.4.61
locator:
  sutra: 3.4.61
witness_text:
  sutra: svāṅge tas-pratyaye kṛbhvoḥ
  commentary: tas-pratyayo yataḥ sva-aṅgāt tad evam ucyate  / tas-pratyaye svāṅga-vācini
    upapade karoteḥ bhavateś ca dhātvoḥ ktvāṇamulau pratyayau bhavataḥ  / yathā-saṅkhyam
    atra neṣyate, asvaritatvāt  / mukhataḥ-kṛtya gataḥ, mukhataḥ kṛtvā gataḥ, mukhataḥ-kāraṃ
    gataḥ  / mukhatobhūya tiṣṭhati, mukhato bhūtvā tiṣṭhati, mukhatobhāvaṃ tiṣṭhati  /
    pṛṣṭhataḥkṛtya gataḥ, pṛṣṭhataḥ kṛtvā gataḥ, pṛṣṭhataḥ kāraṃ gataḥ  / pṛṣṭhatobhūya
    gataḥ, pṛṣṭhato bhūtvā, pṛṣṭhatobhāvam  / svāṅge iti kim ? sarvataḥ kṛtvā gataḥ  /
    tas-grahaṇaṃ kim ? mukhīkṛtya gataḥ  / mukhībhūya gataḥ  / pratyaya-grahaṇaṃ kim
    ? mukhe tasyati iti mukhataḥ, mukhataḥ kṛtvā gataḥ //
