source_id: KASIKA-7.4.47
locator:
  sutra: 7.4.47
witness_text:
  sutra: aca upasargāt taḥ
  commentary: ajantād upasargāduttarasya dā ity etasya ghusaṃjñakasya ta ity ayam
    ādeśo bhavati takārādau kiti  / prattam  / avattam  / nīttam  / parīttam  / acaḥ
    iti kim ? nirdattam  / durdattam  / upasargāt iti kim ? dadhi dattam  / madhu
    dattam  / ghoḥ ity eva, avadātam mukham  / upasargāt iti paccamīnirdeśād āder
    alaḥ prāpnoti ? tatra samādhimāhuḥ  / acaḥ ity etad dvirāvartayitavyam, tatra
    ekaṃ paccamyantaṃ upasargaviśeṣaṇārtham, aparam api ṣaṣṭhyantaṃ sthāninirdeśartham
    ity ākārasya sthāne takāro bhavati  / dvitakāro vā saṃyogo 'yam ādiśyate, so 'nekāltvāt
    sarvasya bhaviṣyati  / apo bhi (*7,4.48) ity atra pañcamyantam acaḥ ity anuvartate  /
    tena pakāramātrasya bhavisyati  / dyater ittvād acasta ity etad bhavati vipratiṣedhena  /
    avattam  / prattaṃ juhoti //
