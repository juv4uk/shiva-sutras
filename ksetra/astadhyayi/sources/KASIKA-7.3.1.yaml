source_id: KASIKA-7.3.1
locator:
  sutra: 7.3.1
witness_text:
  sutra: devikā-śiṃśapā-dityavāḍ-dīrghasatra-śreyasām āt
  commentary: devikā śiṃśapā dityavāṭ dīrghasatra śreyas ity etaṣām aṅgānām acāmādeḥ
    acaḥ sthane vṛddhiprasaṅge ākāro bhavati ñiti, ṇiti, kiti taddhite parataḥ  /
    devikāyāṃ bhavamudakaṃ dāvikamudakam  / devikākūle bhavāḥ śālayaḥ dāvikākūlāḥ
    śālayaḥ  / pūrvadevikā nāma prācāṃ grāmaḥ, tatra bhavaḥ pūrvadāvikaḥ  / prācāṃ
    grāma-nagarāṇām (*7,3.14) iti uttarapadavṛddhiḥ, sāpi ākāra eva bhavati  / śiṃśapā
    - śiṃśapāyāḥ vikāraḥ camasaḥ śāṃśapaḥ camasaḥ  / palāśādirayam, tena pakṣe aṇ,
    anudāttādilakṣaṇo vā añ  / śiṃśapāsthale bhavāḥ śāṃśapāsthalāḥ devāḥ  / pūrvaśiṃśapā
    nāma prācāṃ grāmaḥ, tatra bhavaḥ pūrvaśāṃśapaḥ  / dityavāṭ - dityauhaḥ idam dātyauham  /
    dīrghasatra - dīrghasatre bhavam dārghasatram  / śreyas - śreyasi bhavam śrāyasam  /
    vahīnarasyedvacanaṃ kartavyam  / vṛddhiviṣaye 'cāmādeḥ acaḥ sthāne vahīnarasya
    ikārādeśo bhavati  / vahīnarasya apatyam vaihīnariḥ  / kecit tu vihīnarasya+eva
    vaihīnarim icchanti //
