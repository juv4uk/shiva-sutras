source_id: KASIKA-8.3.108
locator:
  sutra: 8.3.108
witness_text:
  sutra: na rapara-sṛpi-sṛji-spṛśi-spṛhi-savana-ādīnām
  commentary: rephaparasya sakārasya sṛpi sṛji spṛśi spṛhi savanādīnāṃ ca mūrdhanyo
    na bhavati  / rapara - visraṃsikāyāḥ kāṇḍābhyāṃ juhoti  / visrabdhaḥ kathayati  /
    spṛpi - purā krūrasya visṛpaḥ sṛji - vāco visarjanāt  / spṛśi - divispṛśam  /
    spṛhi- nispṛhaṃ kathayati  / savanādīnām - savane savane  / sūte sūte  / sāme
    sāme  / savanamukhe savanamukhe  / kiṃ syati kiṃsaṃkiṃsam  / anusavanamanusavanam  /
    gosaniṃ gosanim  / aśvasanimaśvasanim  / pūrvapadāt iti prāpte pratiṣedhaḥ  /
    aśvasanigrahaṇam aniṇo 'pi ṣatvam asti iti jñāpanārtham  / tena jalāṣāham, aśvaṣāham
    ity etat siddhaṃ bhavati  / kvacid evaṃ gaṇapāṭhaḥ - savane savane  / anusavane
    'nusavane  / sañjñāyāṃ bṛhaspatisavaḥ  / śakunisavanam  / some some  / sūte sūte  /
    saṃvatsare saṃvatsare  / kiṃsaṃkiṃsam  / bisaṃbisam  / musalaṃmusalam  / gosanimaśvasanim  /
    savanādiḥ //
