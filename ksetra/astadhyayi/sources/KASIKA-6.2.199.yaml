source_id: KASIKA-6.2.199
locator:
  sutra: 6.2.199
witness_text:
  sutra: parādiś chandasi bahulam
  commentary: chandasi visaye parādiḥ udātto bhavati bahulam  / paraśabdena atra sakthaśabda
    eva gṛhyate  / añjisaktham ālabheta  / tvāṣṭrau lomaśasakthau  / ṛjubāhuḥ  / vākpatiḥ  /
    citpatiḥ // parādiś ca prāntaś ca pūrvāntaś ca api dṛśyate  / pūrvādayaś ca dṛśyante
    vyatyayo bahulaṃ smṛtaḥ // parādirudāhṛtaḥ  / parāntaś ca -- antodāttaprakaraṇe
    tricakrādīnāṃ chandasy upasaṅkhyānam  / tribandhureṇa trivṛtā rathena tricakreṇa  /
    pūrvāntaḥ -- pūrvapadāntodāttaprakaraṇe marudvṛddhādīnāṃ chandasy upasaṅkhyānam  /
    marudvṛddhaḥ  / pūrvādiḥ -- pūrvapadādyudāttaprakaraṇe divodāsādīnāṃ chandasy
    upasaṅkhyānam  / divodāsāya samagāya te ity evam ādi sarvaṃ saṅgṛhītaṃ bhavati
    // iti kāśikāyāṃ vṛttau ṣaṣṭhādhyāyasya dvitīyaḥ pādaḥ // [#700] ṣaṣṭhādhyāyasya
    tṛtīyaḥ pādaḥ  /
