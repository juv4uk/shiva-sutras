source_id: KASIKA-3.3.169
locator:
  sutra: 3.3.169
witness_text:
  sutra: arhe kṛtya-tṛcaś ca
  commentary: arhati iti arhaḥ, tadyogyaḥ  / arhe kartari vācye gamyamāne vā dhātoḥ
    kṛtya-tṛcaḥ pratyayā bhavanti, cakārāl liṅ ca  / bhavatā khalu kanyā voḍhavyā,
    vāhyā, vahanīyā  / bhavān khalu kanyāyā voḍhā  / bhavān khalu kanyāṃ vahet  /
    bhavān etad arhet iti  / atha kasmād arhe kṛtyatṛco vidhīyante, yāvatā sāmānena
    vihitatvād arhe 'pi bhavisyanti ? yo 'yam iha liṅ vidhīyate, tena bādhā mā bhūt
    iti  / vāsarūpavidhiś ca anityaḥ //
