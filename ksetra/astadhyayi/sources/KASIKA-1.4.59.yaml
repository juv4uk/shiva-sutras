source_id: KASIKA-1.4.59
locator:
  sutra: 1.4.59
witness_text:
  sutra: upasargāḥ kriyā-yoge
  commentary: pra-ādayaḥ kriyā-yoge upasargas-añjñā bhavanti  / praṇayati  / pariṇayati  /
    praṇāyakaḥ  / pariṇāyakaḥ  / kriyā-yoge iti kim ? pragato nāyako 'smād deśāt,
    pranāyako deśaḥ  / maruc-chābdasya ca+upasaṅkhyānam kartavyam  / marudbhir datto
    marutaḥ  / sañjñāvidhānasāmarthyādanajantatve 'pi aca upasargāt taḥ (*7,4.47)
    iti tattvaṃ bhavati  / śrac-chabdasya+upasaṅkhyānam  / āt-aś-ca-upasarge (*3,3.106)
    iti aṅ bhavati - śraddhā  / upasarga. pradeśāḥ -- upasarge ghoḥ kiḥ (*3,3.93)
    ity evam ādayaḥ //
