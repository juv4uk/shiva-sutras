witness_text:
  sutra: āpo-juṣaṇo-vṛṣṇo-varṣiṣṭhe 'mbe 'mbāle 'mbikepūrve
  commentary: yajuṣi ity eva  / āpo juṣāṇo vṛṣṇo varṣiṣṭhe ity ete śabdāḥ ambe ambāle
    ity etau ca yāvambike śabdāt pūrvau yajuṣi paṭhitau te ati parataḥ prakṛtyā bhavanti  /
    āpo asmān mātaraḥ śundhayantu  / juṣaṇo apturājyasya  / vṛṣṇo aṃśubhyāṃ gabhastipūtaḥ  /
    vaṣiṣṭhe adhi nāke  / ambe ambālyambike yajuṣīdamīdṛśam eva paṭhyate  / asmād
    eva nipātanāt ambārthanadyor hrasvaḥ (*7,6.107) iti hrasvatvaṃ na bhavati //
