source_id: KASIKA-4.2.116
locator:
  sutra: 4.2.116
witness_text:
  sutra: kāśyādibhyaṣ ṭhañ-ñiṭhau
  commentary: kāśi ity evam ādibhyaḥ ṭhañ ñiṭha ity etau pratyayau bhavataḥ śaiṣikau  /
    ikāra uccāranārthaḥ  / ñakāra evobhayatra viparyastadeśo 'nubandhaḥ  / strīpratyaye
    viśeṣaḥ  / kāśikī  / kāśikā  / baidikī  / baidikā  / vṛddhāt ity atra anuvartate  /
    ye tu avṛddhāḥ paṭhyante, vacanaprāmāṇyāt tebhyaḥ pratyaya-vidhiḥ  / devadatta-śabdaḥ
    paṭhyate, tasya eṅ prācāṃ deśe (*1,1.75) iti vṛddhasañjñā  / daivadattikaḥ  /
    vāhīkagrāmasya tu na asti vṛddhasañjñā  / daivadattaḥ  / kathaṃ bhāṣye udāhṛtaṃ
    vā nāmadheyasya vṛddhasañjñā veditavyā devadattīyāḥ, daivadattāḥ iti, yāvatā vṛddhasañjñā-apakṣe
    kāśyāditvāt ṭhaññiṭhābhyāṃ bhavitavyam ? tatra+evaṃ varṇayanti, vā nāmadheyasya
    iti vyavasthita-vibhāṣeyam, sā che kartavye bhavati, ṭhaññiṭhayor na bhavati iti  /
    kāśi  / ceti  / sañjñā  / saṃvāha  / acyuta  / mohamāna  / śakulāda  / hastikarṣū  /
    kudāman  / hiraṇya  / karaṇa  / godhāśana  / bhauriki  / bhauliṅgi  / arindama  /
    sarvamitra  / devadatta  / sādhumitra  / dāsamitra  / dāsagrāma  / saudhāvatāna  /
    yuvarāja  / uparāja  / sindhumitra  / devarāja  / āpadādipūrvapadāt kālāt  / āpatkālikī,
    āpatkālikā  / aurdhvakālikī, aurdhvakālikā  / tātkālikī, tātkālikā //
