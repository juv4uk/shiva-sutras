source_id: KASIKA-6.2.151
locator:
  sutra: 6.2.151
witness_text:
  sutra: man-ktin-vyākhyāna-śayana-āsana-sthāna-yājaka-ādi-krītāḥ
  commentary: mannantaṃ ktinnantaṃ vyākhyāna śayana sthāna ity etāni yājakādayaḥ krītaśabdaś
    ca+uttarapadam anatodāttaṃ bhavati  / man - rathavartma  / śakaṭavartma  / ktin
    - pāṇinikṛtiḥ  / āpiśalikṛtiḥ  / vyākhyāna - ṛgayanavyākhyānam  / chandovyākhyānam  /
    śayana - rājaśayanam  / brāhmaṇaśayanam  / āsana - rājāsanam  / brāhmaṇāsanam  /
    sthāna - gosthānam  / aśvasthānam  / yājakādiḥ - brāhmaṇayājakaḥ  / kṣatriyayājakaḥ  /
    brāhmaṇapūjakaḥ  / kṣatriyapūjakaḥ  / yājakādayo ye yājakadibhiś ca (*2,2.9) iti
    ṣaṣṭhīsamāsārthāḥ paṭhyante ta eva+iha gṛhyante  / krīta - gotrītaḥ  / aśvakrītaḥ  /
    kṛtsvarāpavādo 'yaṃ yogaḥ  / krītaśabde tu tṛtīyā karmaṇi (*6,2.48) ity asya apavādaḥ  /
    vyākhyānaśayanāsanasthānānām abhāvakarmārthaṃ grahaṇam  / kārakāt ity eva, prakṛtiḥ  /
    prahṛtiḥ //
