source_id: KASIKA-6.1.49
locator:
  sutra: 6.1.49
witness_text:
  sutra: sidhyater apāralaukike
  commentary: ṇau ity anuvartate  / ṣidhu hiṃsāsamrādhyoḥ ity asya dhātoḥ apāralaukike
    'rthe vartamānasya ecaḥ sthāne ṇau parataḥ ākārādeśo bhavati  / annaṃ sādhayati  /
    grāmaṃ sādhayati  / apāralaukike iti kim ? tapastāpasaṃ sedhayati  / svānyevainaṃ
    karmāṇi sedhayanti  / atra hi sidhyatiḥ pāralaukike jñānaviśeṣe vartate  / tāpasaḥ
    sidhyati jñānaviśeṣamāsādayati, taṃ tapaḥ prayuṅkte  / sa ca jñānaviśeṣaḥ utpannaḥ
    paraloke janmāntare phalam abhyudayalakṣaṇam upasaṃharan paralokaprayojano bhavati  /
    iha kasmān na bhavati, annaṃ sādhayati brāhmanebhyo dāsyāmi iti ? sidhyate - ratrārtho
    niṣpattiḥ  / tasyāḥ prayojanam annam  / tasya yad dānaṃ tat pāralaukikam, na punaḥ
    siddhir eva iti na ātvaṃ paryudasyate  / sakṣāt paralokaprayojane ca sidhyarthe
    kṛtavakāśaṃ vacanam evaṃ viṣayaṃ na avagāhate  / sidhyateḥ iti śyanā nirdeśaḥ,
    ṣidha gatyām ity asya bhauvādikasya nivṛttyarthaḥ //
