source_id: KASIKA-4.1.15
locator:
  sutra: 4.1.15
witness_text:
  sutra: ṭiḍ-ḍha-aṇ-añ-dvayasaj-daghnañ-mātrac-tayap-ṭhak-ṭhañ-kañ-kvarapkhyunām
  commentary: ataḥ iti sarvatra anuvaratate  / tat sati sambhave viśeṣaṇaṃ bhavati  /
    ṭid-ādibhyaḥ prātipadikebhyaḥ striyāṃ ṅīp pratyayo bhavati  / ṭāpo 'pavādaḥ  /
    ṭitastāvat - kurucarī  / madracarī  / iha kasmān na bhavati, pacamānā, yajamānā
    ? dvy-anubandhakatvāl laṭaḥ  / lyuḍ-ādiṣu katham ? ṭit-karaṇa-sāmarthyāt  / itaratra
    tu ṭeretvaṃ phalam  / paṭhitā vidyā iti ? āgamaṭittvam animittaṃ, ṭyuṭyulau tuṭ
    ca iti liṅgāt  / ḍha - sauparṇeyī  / vainateyī  / niranubandhako ḍha-śabdaḥ striyāṃ
    na asti iti niranubandhaka-paribhāṣā na pravartate  / aṇ - kumbhakārī  / nagarakārī  /
    aupagavī  / ṇe 'pi kvacidaṇkṛtaṃ kāryaṃ bhavati  / caurī, tāpasī  / dāṇḍā, mauṣṭā
    ity atra na bhavati  / añ - autsī  / audapānī  / śārṅgarava-ādy-año ṅīn (*4,1.73)
    iti punar año grahaṇaṃ jātilakṣaṇaṃ ṅīṣaṃ bādhitum  / dvayasac - ūrudvayasī  /
    jānudvayasī  / daghnac - ūrudaghnī  / jānudaghnī  / [#322] mātrac - ūrumātrī  /
    jānumātrī  / tayap - pañcatayī  / daśatayī  / ṭhak - ākṣikī  / śālākikī  / ṭhañ
    - lāvaṇikī  / ṭhakṭhañor bhedena grahaṇaṃ ṭhanādi-nivṛtty-artham  / kañ - yādṛśī  /
    tādṛśī  / kvarap - itvarī  / naśvarī  / khyun - āḍhyaṅkaraṇī  / subhagaṃkaraṇī  /
    nañsnañīkaktaruṇatalunānām upasaṅkhyānam  / straiṇī  / pauṃsnī  / śāktīkī  / yāṣṭīkī  /
    taruṇī  / talunī //
