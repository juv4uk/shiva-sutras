source_id: KASIKA-6.4.170
locator:
  sutra: 6.4.170
witness_text:
  sutra: na mapūrvo 'patye 'varmaṇaḥ
  commentary: mapūrvaḥ an avarmaṇo 'ṇi parato 'patye 'rthe na prakṛtyā bhavati  /
    suṣāmṇo 'patyaṃ sauṣāmaḥ  / cāndrasāmaḥ  / mapūrvaḥ iti kim ? sautvanaḥ  / apatye
    iti kim ? carmaṇā parivṛto rathaḥ cārmaṇaḥ  / avarmanaḥ iti kim ? cakravarmaṇo
    'patyaṃ cākravarmaṇaḥ  / mapūrvapratiṣedhe vā hitanāmna iti vaktavyam  / hitanāmno
    'patyaṃ haitanāmaḥ, haitanāmanaḥ //
