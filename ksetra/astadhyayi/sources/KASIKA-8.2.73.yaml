locator:
  sutra: 8.2.73
witness_text:
  sutra: tipy anasteḥ
  commentary: tipi parataḥ sakārāntasya padasya anasteḥ dakāra ādeśo bhavati  / acakād
    bhavān  / anvaśād bhavān  / tipi iti kim ? cakāsteḥ kvip, cakāḥ  / anasteḥ iti
    kim ? āpa eva+idaṃ salilaṃ sarvamāḥ  / āḥ ity asteḥ laṅi tipi bahulaṃ chandasi
    (*7,3.97) iti īḍ na kṛtaḥ // [#928]
