witness_text:
  sutra: alaṅ-kṛñ-nirākṛñ-prajana-utpaca-utpata-unmada-rucy-apatrapa-vṛtu-vṛdhu-saha-cara
    iṣṇuc
  commentary: alaṅ-kṛñ-ādibhyo dhātubhyaḥ tacchīlādiṣu kartṛṣu iṣṇuc pratyayo bhavati  /
    alaṅkariṣṇuḥ  / nirākariṣṇuḥ  / prajaniṣṇuḥ  / utpaciṣṇuḥ  / utpatiṣṇuḥ  / unmadiṣṇuḥ  /
    rociṣṇuḥ  / apatrapiṣṇuḥ  / vartiṣṇuḥ  / vardhiṣṇuḥ  / sahiṣṇuḥ  / cariṣṇuḥ  /
    alaṅakṛño maṇḍanārthād yucaḥ pūrvavipratiṣedheneṣṇuj vaktavyaḥ  /
