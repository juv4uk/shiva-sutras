source_id: KASIKA-8.4.47
locator:
  sutra: 8.4.47
witness_text:
  sutra: anaci ca
  commentary: acaḥ iti vartate, yaraḥ iti ca  / anacparasya aca uttarasya yaro dve
    vā bhavataḥ  / daddhyatra  / maddhvatra  / acaḥ ity eva, smitam  / dhmātam  /
    yaṇo mayo dve bhavata iti vaktavyam  / kecid atra yaṇaḥ iti pañcamī, mayaḥ iti
    ṣaṣṭhī iti vyācakṣate  / teṣām ulkkā, valmmīkaḥ ity udāharaṇam  / apare tu mayaḥ
    iti pañcamī, yaṇaḥ iti ṣaṣṭhī iti  / teṣām dadhyyatra, madhvvatra ity udāharaṇam  /
    śaraḥ khayo dve bhavata iti vaktavyam  / atra api yadi śaraḥ iti pañcamī, khayaḥ
    iti ṣaṣṭhī, tadā stthālī, stthātā iti udāharaṇam  / athavā khaya uttarasya śaro
    dve bhavataḥ  / vatssaḥ  / ikṣṣuḥ  / kṣṣīram  / apssarāḥ  / avasāne ca yaro dve
    bhavata iti vaktavyam  / vākka, vāk  / tvakk, tvak  / ṣaṭṭ, ṣaṭ  / tatt, tat //
