source_id: KASIKA-5.1.12
locator:
  sutra: 5.1.12
witness_text:
  sutra: tad-arthaṃ vikṛteḥ prakṛtau
  commentary: prakṛtiḥ upādānakāraṇaṃ, tasya+eva uttaram avasthāntaraṃ vikṛtiḥ  /
    vikṛti-vācinaḥ prātipādikāt prakṛtāv abhidheyāyāṃ yathāvihitaṃ pratyayo bhavati  /
    tadartham iti pratyayārtha-viśeṣaṇam  / tad iti sarvanāmnā vikṛtiḥ parāmṛśyate  /
    vikṛtyarthāyāṃ prakṛtau pratyayaḥ  / tadartha-grahaṇena prakṛter ananyārthatā
    ākhyāyate  / na prakṛtivikāra-sambhavam ātre pratyayaḥ, kiṃ tarhi, prakṛter ananyārthatve
    vivakṣite  / pratyayārthasya ca tadarthatve sati sāmarthyāl labhyā caturthī samarthavibhaktiḥ  /
    kecit tu tasmai hitam (*5,1.5) ity anuvartayanti  / aṅgārebhyo hitāni etāni kāṣṭhāni
    aṅgārīyāṇi kāṣṭhāni  / prākārīyā iṣṭakāḥ  / śaṅkavyaṃ dāru  / picavyaḥ kārpāsaḥ  /
    tadartham iti kim ? yavānāṃ dhānāḥ  / dhānānāṃ saktavaḥ  / prakṛtyantar anivṛttir
    atra vivakṣitā na tādarthyam dhānānāṃ saktavaḥ, na lājānām iti  / vikṛteḥ iti
    kim ? udakārthaḥ kūpaḥ  / vikṛti-grahaṇe 'kriyamāṇe yā kācit prakrtir gṛhyate,
    na+upādānakāraṇam eva  / bhavati ca kūpa udakasya prakṛtiḥ, tatra+utpādanāt  /
    na tu udakaṃ tasyaḥ vikṛtiḥ, atyantabhedāt prakṛtau iti kim ? asyarthā kośī  /
    asirayaso vikṛtir bhavati, na tu kośī tasya prakṛtir bhavati  / dvayor api prakṛti-vikṛtyor
    grahaṇe vivakṣitaḥ prakṛtivikārabhāvo labhyate // [#469]
