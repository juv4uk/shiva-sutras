source_id: KASIKA-4.1.154
locator:
  sutra: 4.1.154
witness_text:
  sutra: tikādibhyaḥ phiñ
  commentary: tika ity evam ādibhyaḥ śabdebhyo 'patye phiñ pratyayo bhavati  / taikāyaniḥ  /
    kaitavāyaniḥ  / vṛṣa-śabdo 'tra paṭhyate, tasya pratyaya-sanniyogena yakārantatvam
    iṣyate  / vārṣyāyaṇiḥ  / kauravya-śabdaḥ paṭhyate, sa ca kṣatraya-vacanaḥ, aurasa-śabdena
    kṣtriya-pratyayāntena sāhacaryāt  / yas tu kurv-ādihyo ṇyaḥ (*4,1.151) , tadantād
    iñaiva bhavitavyam  / tathā ca ṇyakṣatriyārṣañito yūni lugaṇiñoḥ (*2,4.58) ity
    atra udāhṛtaṃ kauravyaḥ pita, kauravyaḥ putraḥ iti  / tika  / kitava  / sañjñā  /
    bāla  / śikhā  / uras  / śāṭya  / saindhava  / yamunda  / rūpya  / grāmya  / nīla  /
    amitra  / gaukakṣya  / kuru  / devaratha  / taitila  / aurasa  / kuaravya  / bhairiki  /
    bhauliki  / caupayata  / caitayata  / caiṭayata  / śaikayata  / kṣaitayata  /
    dhvājavata  / candramas  / ṣubha  / gaṅgā  / vareṇya  / suyāman  / ārada  / vahyakā  /
    khalyā  / vṛṣa  / lomakā  / udanya  / yajña // [#357]
