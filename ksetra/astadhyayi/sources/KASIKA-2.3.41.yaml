source_id: KASIKA-2.3.41
locator:
  sutra: 2.3.41
witness_text:
  sutra: yataś ca nirdhāranam
  commentary: ṣaṣṭhī-saptamyau vartate  / jāti-guṇa-kriyābhiḥ samudāyād ekadeśasya
    pṛthak karanaṃ nirdhāranam  / yato nirdhāranaṃ tataḥ ṣaṣṭhī saptamyau vibhaktī
    bhavataḥ  / manuṣyāṇām kṣatriyaḥ śūratamaḥ, manuṣyeṣu kṣatriyaḥ śūratamaḥ  / gavaṃ
    kṛṣṇā sampanna-kṣīratamā, goṣu kṛṣṇā sampanna-kṣīratamā adhvagānāṃ dhavantaḥ śīghratamā,
    adhvageṣu dhāvantaḥ śīghratamāḥ //
