source_id: KASIKA-4.1.88
locator:
  sutra: 4.1.88
witness_text:
  sutra: dvigor lug-anapatye
  commentary: prāgdīvyataḥ iti vartate, na bhavanāt iti  / dvigoḥ iti ṣaṣṭhī  / dvigor
    yaḥ sambandhī nimittatvena taddhitaḥ prāgdīvyatīyo 'patya-pratyayaṃ varjayitvā
    tasya lug bhavati  / pajcasu kapāleṣu saṃskṛtaḥ pajcakapālaḥ  / daśakapālaḥ  /
    dvau devādadhīte dvivedaḥ  / trivedaḥ  / anapatye iti kim ? dvaidevadattiḥ  /
    traidevadattiḥ  / prāgdivyataḥ ity eva, dvaipārāyaṇikaḥ  / dvigu-nimittavijñānād
    iha na bhavati, pañcakapālasya+idaṃ pāñcakapālam  / atha vā dvigor eva ayaṃ lug
    vidhīyate  / dvigoḥ iti sthāna-ṣaṣṭhī  / nanu ca pratyayādarśanasya+eṣā sañjñā
    ? satyam etat  / upacāreṇa tu lakṣaṇayā dvigu-nimitta-bhūtaḥ pratyaya eva dviguḥ,
    tasya lug bhavati  / dvigu-nimittako 'pi tarhi guṇakalpanayā kasmān na dvigur
    ucyate pājcakapālam iti ? na tasya dvigutvam nimittam  / itaras tu dvigutvasya+eva
    nimittam ity asti viśeṣaḥ  / yady evam iha kathaṃ pañcakapālyāṃ saṃskṛtaḥ pañcakapālaḥ
    iti ? na+eva atra taddhita utpadyate  / [#342] vākyam eva bhavati  / traiśabdyaṃ
    hi sādhyaṃ, pañcasu kapāleṣu saṃskṛtaḥ, pañcakapālyāṃ saṃskṛtaḥ pañcakapālaḥ iti  /
    tatra dvayoḥ śabdayoḥ samānārthayor ekena vigrahaḥ  / aparasmād utpattir bhaviṣyati  /
    atha+iha kasmān na bhavati, pañcabhyo gargebhya āgataṃ pajcagargarūpayam, pañcagargam
    ayam iti vā ity anuvartate  / sā ca vyavasthita-vibhāṣā vijñāyate //
