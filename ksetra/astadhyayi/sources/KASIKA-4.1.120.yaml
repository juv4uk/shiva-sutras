locator:
  sutra: 4.1.120
witness_text:
  sutra: strībhyo ḍhak
  commentary: strī-grahaṇena ṭābādi-pratyayāntāḥ śabdā gṛhyante  / strībhyo 'patye
    ḍhak pratyayo bhavati  / sauparṇeyaḥ  / vainateyaḥ  / strīpratyaya-vijñāpanād
    asatyartha-grahaṇe iha na bhavati, iḍabiḍo 'patyam aiḍaviḍaḥ, darado 'patyam dāradaḥ
    iti  / vaḍavāyā vṛṣe vācye  / vāḍaveyo vṛṣaḥ smṛtaḥ  / apatye prāptaḥ tato 'pakṛṣya
    vidhīyate  / tena apatye vāḍavaḥ iti  / aṇ kruñcākokilāt smṛtaḥ  / kruñcāyā apatyaṃ
    krauñcaḥ  / kaukilaḥ //
