witness_text:
  sutra: kṅiti ca
  commentary: 'nimitta-saptamy eṣā  / kṅin-nimitte ye guṇa-vṛddhī prāpnutaḥ, te na
    bhavataḥ  / citaḥ, citavān  / stutaḥ, stutavān  / bhinnaḥ, bhinnavān  / mṛṣṭaḥ,
    mṛṣṭavān  / ṅiti khalv api - cinutaḥ, cinvanti  / mṛṣṭaḥ, mṛjanti  / gakāro ''pi
    atra cartva-bhūto nirdiśyate  / glā-ji-sthaś ca gstuḥ (*3,2.139) jiṣṇuḥ  / bhūṣṇuḥ  /
    ikaḥ itym eva - kāmayate, laigavāyanaḥ  / mṛjerajādau saṅtrame vibhāṣā vṛddhir
    iṣyate  / saṅ-kramo nāma guṇa-vṛddhi-pratiṣedha-viṣayaḥ  / parimṛjanti, [#8] parimārjanti  /
    parimṛjantu, parimārjantu  / laghu-upadha-guṇasya  apy-atra pratiṣedhaḥ  / acinavam,
    asunavam ity ādau lakārasya saty api ṅittve yāsuṭo ṅid-vacanaṃ jñāpakam ṅiti yat-kāryaṃ
    tal-lakāre ṅiti na bhavati iti // START JKv_1,1.6:'
