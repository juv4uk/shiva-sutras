source_id: KASIKA-5.1.37
locator:
  sutra: 5.1.37
witness_text:
  sutra: tena krītam
  commentary: ṭhañādayas trayodaśa pratyayāḥ prakṛtāḥ  / teṣām itaḥ prabhṛti samartha-vibhaktayaḥ
    pratyayārthāś ca nirdiśyante tena iti tṛtīyāsamarthāt krītam ity etasminn arthe
    yathāvihitaṃ pratyayo bhavati  / saptatyā krītam sāptatikam  / āśītikam  / naiṣkikam  /
    pāṇikam  / pādikam  / māṣikam  / śatyam  / śatikam  / dvikam  / trikam  / tena
    iti mūlyāt karaṇe tṛtīyā samartha-vibhaktiḥ  / anyatrān abhidhānān na bhavati,
    devadattena krītam, pāṇinā krītam iti  / dvivacana-bahuvacana-antāt pratayayo
    na bhavati, prasthābhyāṃ krītam, prasthaiḥ krītam iti, anabhidhānād eva  / yatra
    tu prakṛtyarthasya saṅkhyābhedāvagame pramāṇam asti tatra dvivacana-bahuvacana-antād
    api pratyayo bhavati  / dvābhyāṃ krītam dvikam  / trikam  / pañcakam  / tathā
    mudgaiḥ krītam maudgikam  / māṣikam  / na hy ekena mudgena krayaḥ sambhavati //
