source_id: KASIKA-3.3.34
locator:
  sutra: 3.3.34
witness_text:
  sutra: chandonāmni ca
  commentary: vau straḥ iti vartate  / vipūrvāt stṛnāteḥ chandonāmni ghañ pratyayo
    bhavati  / vṛttam atra chando gṛhyate yasya gāyatryādayo viśeṣāḥ, na mantrabrahmaṇam
    , nāma-grahaṇāt  / viṣṭārapaṅktiḥ chandaḥ  / viṣṭārabṛhatī chandaḥ  / viṣṭārapaṅkti-śabdo
    'tra chandonāma, na ghañanataṃ śabda-rūpam  / tatra tv avayavatvena tad vartate  /
    chandonāmni ity adhikaraṇa-saptamy eṣā //
