source_id: KASIKA-3.1.26
locator:
  sutra: 3.1.26
witness_text:
  sutra: hetumati ca
  commentary: hetuḥ svatantraya kartuḥ prayojakaḥ, tadīyo vyāpāraḥ preṣanādi-lakṣaṇo
    hetumān, tasminn abhidheye dhātoḥ ṇic pratyayo bhavati  / kaṭaṃ kārayati  / odanaṃ
    pācayati  / tat karoti ity upasaṅkhyānaṃ sūtrayati ity ādyartham  / sūtraṃ karoti
    sūtrayati  / ākhyānāt kṛtas tad ācaṣṭa iti ṇic kṛlluk prakṛtipratyāpattiḥ prakṛtivac
    ca kārakam  / ākhyānāt kṛdanttaṇ ṇic vaktavyaḥ tad ācaṣṭe ity etasminn arthe,
    kṛl-luk, prakṛtipratyāpattiḥ, prakṛtivac ca kārakaṃ bhavati  / kaṃsavadham ācaṣṭe
    kaṃsaṃ ghātayati  / balibandham ācaṣṭe baliṃ bandhayati  / rājāgamanam ācaṣṭe
    rājānam āgamayati  / [#183] āṅ-lopaś ca kāla-atyantasaṃyoge maryādāyām  / ārātri
    vivāsam ācaśṭe rātriṃ vivāsayati  / citrīkaraṇe prāpi  / ujjayinyāḥ prasthito
    māhiṣmatyāṃ sūryodgamanaṃ sambhāvayate sūryam udgamayati  / nakṣatrayoge jñi  /
    puṣyayogaṃ jānāti puṣyeṇa yojayati  / maghabhir yojayati //
