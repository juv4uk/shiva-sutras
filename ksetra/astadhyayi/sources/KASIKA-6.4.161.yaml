source_id: KASIKA-6.4.161
locator:
  sutra: 6.4.161
witness_text:
  sutra: ra ṛto halāder laghoḥ
  commentary: raśabda ādeśo bhavati ṛkārasya halāder laghoḥ iṣṭhemeyassu parataḥ  /
    prathiṣṭhaḥ  / prathimā  / prathīyān  / mradiṣṭhaḥ  / mradimā  / mradīyān  / ṛtaḥ
    iti kim ? paṭiṣṭhaḥ s / paṭimā  / paṭīyān  / halādeḥ iti kim ? ṛjiṣṭhaḥ  / ṛjimā  /
    ṛjīyān  / laghoḥ iti kim ? kṛṣṇā - kṛṣṇiṣṭhaḥ  / kṛṣṇimā  / kṛṣṇīyān  / parigaṇanam
    atra kartavyam  / pṛthuṃ mṛduṃ bhṛśaṃ ca+eva kṛśaṃ ca dṛḍham eva ca  / paripūrvaṃ
    vṛḍhaṃ ca+eva ṣaḍetān ravidhau smaret // tataḥ iha na bhavati, kṛtamācaṣṭe kṛtayati  /
    mātaramācaṣṭe mātayati  / bhrātayati //
