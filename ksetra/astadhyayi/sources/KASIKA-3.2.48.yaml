source_id: KASIKA-3.2.48
locator:
  sutra: 3.2.48
witness_text:
  sutra: anta-atyanta-adhva-dūra-pāra-sarva-ananteṣu ḍaḥ
  commentary: sañjñāyām iti na anuvartate  / anta atyanta adhvan dura pāra sarva ananta
    ity eteṣu karmasu upapadeṣu gameḥ ḍapratyayo bhavati  / antagaḥ atyantagaḥ  /
    adhvagaḥ  / dūragaḥ  / pāragaḥ  / sarvagaḥ  / anantagaḥ  / anantagaḥ  / ḍakaraḥ
    ṭilopārthaḥ, ḍityabhasya apy anubandhakaraṇa-sāmarthyāt iti // [#221] ḍaprakaraṇe
    sarvatrapannayor upasaṅkhyānam  / sarvatragaḥ  / pannagaḥ  / uraso lopaś ca  /
    urasā gacchati iti uragaḥ  / suduror adhikaraṇe  / sukhena gacchaty asmin iti
    sugaḥ  / durgaḥ  / niro deśe  / nirgo deśaḥ  / apra āha - ḍaprakaraṇe 'nyeṣv api
    dṛśyate iti  / stryagāragaḥ  / grāmagaḥ  / gurutalpagaḥ //
