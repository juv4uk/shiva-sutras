source_id: KASIKA-5.4.49
locator:
  sutra: 5.4.49
witness_text:
  sutra: rogāc ca apanayane
  commentary: rogo vyādhiḥ  / tad vācinaḥ śabdād yā ṣaṣthī vibhaktiḥ, tadantād vā
    tasiḥ pratyayo bhavati apanayane gamyamāne  / apanayanaṃ pratīkāraḥ  / cikitsā
    ity arthaḥ  / pravāhikātaḥ kuru  / kāsataḥ kuru  / chardikātaḥ kuru  / pratīkāramasyāḥ
    kuru ity arthaḥ  / apanayane iti kim ? pravāhikāyāḥ prakopanaṃ kuru // [#570]
