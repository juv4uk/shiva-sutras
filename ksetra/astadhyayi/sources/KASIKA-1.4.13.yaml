source_id: KASIKA-1.4.13
locator:
  sutra: 1.4.13
witness_text:
  sutra: yasmāt pratyaya-vidhis tad-ādi pratyaye 'ṅgam
  commentary: yasmāt pratyayo vidhīyate dhātor vā prātipadikād vā tad-ādi śabda-rūpaṃ
    pratyaye parato 'ṅgasañjñaṃ bhavati  / kartā  / hartā  / kariṣyati hariṣyati  /
    akariṣyat  / aupagavaḥ  / kāpaṭavaḥ  / yasmāt iti sañjñi-nirdeśa-artham, tad-ādi
    iti sambandhāt  / pratyaya-grahaṇaṃ kim ? nyaviśata  / vyakrīṇīta  / ner biśaḥ
    (*1,3.17) ity upasargād vidhir asti, tad-āder aṅgasañjñā syāt  / vidhi-grahaṇaṃ
    kim ? pratyaya-paratvam ātre mā bhūt  / strī iyatī  / tad-ādi-vacanaṃ syādinum
    artham  / [#78] kariṣyāvaḥ  / kariṣyāmaḥ  / kuṇḍāni  / punaḥ pratyaya-grahaṇaṃ
    kim artham ? lupta-pratyaye mā bhūt  / śrya-rtham  / bhrv-artham  / aṅga-pradeśāḥ
    - aṅgasya (*6,4.1) ity evam ādayaḥ //
