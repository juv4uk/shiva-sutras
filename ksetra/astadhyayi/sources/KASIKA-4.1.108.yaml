locator:
  sutra: 4.1.108
witness_text:
  sutra: vataṇḍāc ca
  commentary: āṅgirase ity eva  / vataṇḍa-śabdād āṅgirase 'patyaviśeṣe gotre yañ pratyayo
    bhavati  / vātaṇḍyaḥ  / āṅgirase iti kim ? vātaṇḍaḥ  / kim artham idaṃ yāvatā
    gargādiṣv ayaṃ paṭhyate ? śivādiṣu api ayaṃ paṭhyate  / tatra āṅgirase śivādyaṇo
    'pavāda-arthaṃ punar vacanam  / anāṅgirase tu ubhayatra pāṭhasāmarthyāt pratyayadvayam
    api bhavati  / vātaṇḍyaḥ, vātaṇḍaḥ // [#348]
