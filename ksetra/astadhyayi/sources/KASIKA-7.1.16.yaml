witness_text:
  sutra: pūrva-ādibhyo navabhyo vā
  commentary: pūrvādibhyo navabhyaḥ sarvanāmnaḥ uttarayoḥ ṅasiṅyoḥ smāt smin ity etāv
    ādeśau vā bhavataḥ  / pūrvasmāt, pūrvāt  / pūrvasmin, pūrve  / parasmāt, parāt  /
    parasmin, pare  / avarasmāt, avarāt  / avarasmin, avare  / dakṣiṇasmāt, dakṣiṇāt  /
    dakṣiṇasmin, dakṣiṇe  / uttarasmāt, uttarāt  / uttarasmin, uttare  / aparasmāt,
    aparāt  / aparasmin, apare  / adharasmāt, adharāt  / adharasmin, adhare  / svasmāt,
    svāt  / svasmin, sve  / antarasmāt, antarāt  / antarasmin, antare  / navabhyaḥ
    iti kim ? tyasmāt  / tyasmin //
