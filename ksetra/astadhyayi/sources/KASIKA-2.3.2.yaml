source_id: KASIKA-2.3.2
locator:
  sutra: 2.3.2
witness_text:
  sutra: karmaṇi dvitīyā
  commentary: dvitīyādayaḥ śabdāḥ pūrvācāryaiḥ supāṃ trikeṣu samaryante, tair eva
    atra vyavahāraḥ  / karmaṇi kārake yā saṅkhyā tatra dvitīyā vibhaktirbhavati  /
    kaṭaṃ karoti  / grāmaṃ gacchati  / ubhasarvatasoḥ kāryā dhiguparyādiṣu kriṣu  /
    dvitīyā+āmreḍitānteṣu tato 'nyatra api dṛśyate // ubhayato grāmam  / sarvato grāmam  /
    dhig devadattam  / uparyupari grāmam  / adhyadhi grāmam  / adho 'dho grāmam  /
    abhitaḥparitaḥsamayānikaṣāhāpratiyogeṣu ca dṛśyate  / abhito grāmam  / parito
    grāmam  / samayā grāmam  / nikāṣā grāmam  / hā devadattam  / bubhukṣitaṃ na prati
    bhāti kiñcit //
