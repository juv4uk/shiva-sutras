source_id: KASIKA-1.3.63
locator:
  sutra: 1.3.63
witness_text:
  sutra: ām-pratyayavat kṛño 'nuprayogasya
  commentary: akartr-abhiprāya-artho 'yam-ārambhaḥ  / ām-pratyayo yasmāt so 'yam-ām-pratyayaḥ  /
    ām-pratyayasya+iva dhātoḥ kṛño 'nuprayogasya ātmanepadaṃ bhavati  / īkṣāñcakre  /
    īhāñcakre  / yadi vidhy-artham etat, tarhi udubjāñcakāra, udumbhāñcakāra iti kartr-abhiprāye
    kriyāphale atmanepadaṃ prāpnoti  / na+eṣa doṣaḥ  / ubhayam anena kriyate, vidhiḥ
    niyamaś ca  / katham ? pūrvavat iti vartate  / sa dvitīyo yatno niyama-artho bhaviṣyati  /
    kṛñaḥ iti kim ? īkṣāmāsa  / īkṣāmbabhūva  / kathaṃ punar asya anuprayogaḥ yāvatā
    kṛñ ca anuprayujyate liti (*3,1.40) ity ucyate ? kṛñ iti pratyāhāra-grahaṇaṃ tatra
    vijñāyate  / kva saṃniviṣṭānāṃ pratyāhāraḥ ? abhūtatadbhāve kṛ-bhv-astiyoge sampadyakartari
    cviḥ (*5,4.50) iti kṛ-śabdād ārabhya yāvat kṛño dvitīya-tṛtīya-śamba-bījāt kṛṣau
    (*5,4.58) iti ñakaram //
