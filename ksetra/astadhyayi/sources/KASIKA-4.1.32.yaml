source_id: KASIKA-4.1.32
locator:
  sutra: 4.1.32
witness_text:
  sutra: antarvat-pativator nuk
  commentary: prakṛtir nipātyate, nugāgam astu vidhīyate  / antarvat-pativator nuk
    bhavati ṅīp ca pratyayaḥ, sa tu nakārāntatvād eva siddhaḥ  / nipātana-sāmarthyāc
    ca viśeṣe vṛttir bhavati  / antarvat pativat iti garbha-bhartṛ-saṃyoge  / iha
    na bhavati, antarasyāṃ śālāyāṃ vidyate  / patimatī pṝthīvī  / antarvat iti matub
    nipātyate, vatvaṃ siddham  / pativat iti vatvaṃ nipātyate, matup siddhaḥ  / antarvatnī
    garbhiṇī  / pativatnī jīvapatiḥ  / antarvat-pativatos tu matubvatve nipātanāt  /
    garbhiṇyāṃ jīvapatyāṃ ca vā chandasi tu nug-vidhiḥ // sāntarvatnī devānupait  /
    sāntarvatī devānupaita  / pativatnī taruṇavatsā  / pativatī taruṇavatsā //
