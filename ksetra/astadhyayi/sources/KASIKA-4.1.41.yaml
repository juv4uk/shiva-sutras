witness_text:
  sutra: ṣid-gaurādibhyaś ca
  commentary: ṅīṣ anuvartate  / ṣidbhyaḥ prātipadikebhyo gaurādibhyaś ca striyām ṅīṣ
    pratyayo bhavati  / śilpini ṣvun (*3,1.145) - nartakī  / khanakī  / rajakī  /
    gaurādibhyaḥ - gaurī  / matsī  / gaura  / matsya  / manuṣya  / śṛṅga  / haya  /
    gavaya  / mukaya  / ṛṣya  / puṭa  / druṇa  / droṇa  / hariṇa  / kaṇa  / paṭara  /
    ukaṇa  / āmalaka  / kuvala  / badara  / bamba  / tarkāra  / śarkāra  / puṣkara  /
    śikhaṇḍa  / suṣama  / salanda  / gaḍuja  / ānanda  / sṛpāṭa  / sṛgeṭha  / āḍhaka  /
    śaṣkula  / sūrma  / suba  / sūrya  / pūṣa  / mūṣa  / ghātaka  / sakalūka  / sallaka  /
    mālaka  / mālata  / sālvaka  / vetasa  / atasa  / pṛsa  / maha  / maṭha  / cheda  /
    śvan  / takṣan  / anaḍuhī  / anaḍvāhī  / eṣaṇaḥ karaṇe  / deha  / kākādana  /
    gavādana  / tejana  / rajana  / lavaṇa  / pāna  / medha  / gautama  / āyasthūṇa  /
    bhauri  / bhauliki  / bhauliṅgi  / audgāhamāni  / āliṅgi  / āpicchika  / āraṭa  /
    ṭoṭa  / naṭa  / nāṭa  / malāṭa  / śātana  / pātana  / savana  / āstarana  / ādhikaraṇa  /
    eta  / adhikāra  / āgrahāyaṇī  / pratyavarohiṇī  / sevana  / sumaṅgalāt sañjñāyām  /
    sundara  / maṇḍala  / piṇḍa  / viṭaka  / kurda  / gūrda  / paṭa  / pāṇṭa  / lophāṇṭa  /
    kandara  / kandala  / taruṇa  / taluna  / bṛhat  / mahat  / saudharma  / rohiṇī
    nakṣatre  / revatī nakṣatre  / vikala  / niṣphala  / puṣkala  / kaṭācchroṇivacane  /
    pippalyādayaśca  / pippalī  / harītakī  / kośātakī  / śamī  / karīrī  / pṛthivī  /
    kroṣṭrī  / mātāmaha  / pitāmaha  / mātāmaha-pitāmahayoḥ mātari ṣic ca (*4,2.36)
    iti ṣittvād eva siddhe jñāpana-arthaṃ vacanam, anityaḥ ṣil-lakṣaṇo ṅīṣ iti, tena
    daṃṣṭrā ity upapannaṃ bhavati //
