source_id: KASIKA-7.2.67
locator:
  sutra: 7.2.67
witness_text:
  sutra: vasv ekāj-ād-ghasām
  commentary: kṛtadvirvacanānāṃ dhātūnām ekācām, ākārāntānām, ghaseś ca vasau iḍāgamo
    bhavati  / ādivān  / āśivān  / pecivān  / śekivān  / dhātvabhyāsayoḥ ekādeśe kṛte
    etvābhyāsalopayoś ca kṛtayoḥ kṛtadvirvacanā ete ekāco bhavanti āt - yayivān  /
    tasthivān  / ghas - jakṣivān  / siddhe satyārambho niyamārthaḥ, ekājād ghasām
    eva vasāviḍāgamo bhavati na anayeṣām  / bibhidvān  / cicchidvān  / babhūvān  /
    śiśrivān  / krādiniyamāt pratiṣedhābhāvāc ca ya iṭ prasaktaḥ sa niyamyate  / ādgrahaṇam
    anekājgrahaṇārtham  / dvirvacane hi kṛte iṭi hi sati āto lopena bhavitavyam  /
    daridrātes tu kāsyanekājgrahaṇaṃ culumpādyartham ityāmā bhavitavyam  / daridrāñcakāra  /
    athāpyām na kriyate tathāpi ca daridrāteḥ ārdhadhātuke lopaḥ siddhaś ca pratyayavidhau
    iti prāg eva pratyayotpatter ākāre lupte iḍāgamasya nimittaṃ vihataṃ iti na iḍāgamo
    bhavati, dadaridrvān iti bhavitavyam  / ghaser api yadi grahaṇam iha na kriyate
    tadā dvirvacanāt paratvād ghasibhasorhali ca (*6,4.100) iti upadhālope kṛte dvirvacanam
    eva na syāt, anackatvāt  / iha tu ghasigrahaṇād upadhālopam api paratvāt iḍāgamo
    bādhate  / tatra kṛte gamahanajanakhanaghasām (*6,4.98) iti upadhālopaḥ  / sa
    ca dvirvacane 'ci (*1,1.59) iti dvirvacane kartavye sthānivad bhavati, tena jakṣivān
    iti sidhyati // [#818]
