source_id: KASIKA-3.2.73
locator:
  sutra: 3.2.73
witness_text:
  sutra: vij upe chandasi
  commentary: upe upapade yajeḥ chandasi viṣaye vic pratyayo bhavati  / upayaḍbhir
    ūrdhvaṃ vahanti  / upayaṭtvam  / chando-grahaṇaṃ brāhmaṇa-artham  / vicaḥ citkaraṇaṃ
    sāmānya-grahaṇa-avighāta-artham ver apṛktasya (*6,1.67) iti  / kim artham idam
    ucyate, yāvata anyebhyo 'pi dṛśyante (*3,2.75) iti yajer api vic siddha eva ?
    yajer niyama-artham etat, upayajeḥ chandasya+iva, na bhāṣāyām iti // [#228]
