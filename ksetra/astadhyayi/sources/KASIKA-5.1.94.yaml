source_id: KASIKA-5.1.94
locator:
  sutra: 5.1.94
witness_text:
  sutra: tad asya brahmacaryam
  commentary: tad iti dvitiyāsamartha-vibhaktiḥ  / sā ca atyantasaṃyoge  / asya iti
    pratyayārthaḥ  / brahamacaryam iti dvābhyām api sambadhyate  / kālasya vyāpakaṃ,
    pratyayārthasya ca svam iti  / tad iti dvitīyāsamarthāt kālavācinaḥ prātipadikād
    asya iti ṣaṣṭhyarthe ṭhañ pratyayo bhavati, brahmacaryaṃ ced gamyate  / māsaṃ
    brahmacaryamasya māsikaḥ brahmacārī  / ārdhamāsikaḥ  / sāṃvatsarikaḥ  / aparā
    vṛttiḥ - tad iti prathamāsamarthād asya iti ṣaṣṭhyarthe ṭhañ pratyayo bhavati,
    yat tad asya iti nirdiṣṭaṃ brahmacaryaṃ ced tad bhavati  / māso 'sya brahamacaryasay
    māsikaṃ brahamacaryam  / ārdhamāsikam  / sāṃvatsarikam  / pūrvatra brahamacārī
    pratyayārthaḥ, uttaratra brahamacaryam eva  / ubhayam api pramāṇam, ubhayathā
    sūtrapraṇayanāt  / mahānāmnyādibhyaḥ ṣaṣṭhīsamarthebhya upasaṅkhyānam  / māhānāmikam  /
    gaudānikam  / ādityavratikam  / [#488] tac carati iti ca  / mahānāmnya ṛcaḥ, tat
    sahacaritaṃ vrataṃ tacchabdena+ucyate  / mahānāmnīścarati māhānāmikaḥ  / ādityavratikaḥ  /
    gaudānikaḥ  / bhasyāḍhe iti puṃbadbhāvena ṅīpi nivṛtte nas taddhite (*6,4.144)
    iti ṭilopaḥ  / avāntaradīkṣādibhyo ḍinirvaktavyaḥ  / avāntaradīkṣāṃ carati avāntaradīkṣī  /
    tilavratī  / aṣṭācatvāriṃśato ḍvuṃś ca ḍiniś ca vaktavyaḥ  / aṣṭācatvāriṃśad varṣāṇi
    vrataṃ carati aṣṭācatvāriṃśakaḥ, aṣṭācatvariṃśī  / cāturmāsyānāṃ yalopaś ca ḍvuṃś
    ca ḍiniś ca vaktavyaḥ  / cāturmāsyāni carati cāturmāsakaḥ, cāturamāsī  / caturmāsyāṇ
    ṇyo yajñe tatra bhave  / caturṣu māseṣu bhavāni cāturmāsyāni  / sañjñāyāmaṇ vaktavyaḥ  /
    caturṣu māseṣu bhavā cāturmāsī paurṇamāsī  / āṣāḍhī  / kārtikī  / phālgunī //
