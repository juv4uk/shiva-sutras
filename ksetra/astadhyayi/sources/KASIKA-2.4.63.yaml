source_id: KASIKA-2.4.63
locator:
  sutra: 2.4.63
witness_text:
  sutra: yaska-ādibhyo gotre
  commentary: bahuṣu tena+eva astriyām iti sarvam anuvartate  / yaska ity evam ādibhyaḥ
    parasya gotra-pratyayasya bahuṣu vartamānasya astrīliṅgasya lug bhavati, tena+eva
    ced gotra-pratyayena kṛtaṃ bahutvaṃ bhavati  / pratyaya-vidheś ca anyatra laukikasya
    gotrasya grahaṇam ity anantarāpatye 'pi lug bhavaty eva  / yaskāḥ  / labhyāḥ  /
    bahuṣu ity eva, yāskāḥ  / tena+eva ity eva, priyayāskāḥ  / astriyām ity eva, yāskyaḥ
    striyaḥ  / gotre iti kim ? yāskāśchātrāḥ  / [#169] yaska  / labhya  / duhya  /
    ayaḥsthūṇa  / tṛṇakarṇa  / ete pañca śivādisu paṭhyante  / tataḥ parebhyaḥ ṣaḍbhyaḥ
    iñ  / sadāmatta  / kambalabhāra  / bahiryoga  / karṇāṭaka  / piṇḍījaṅgha  / bakasaktha  /
    tataḥ parebhyaś caturbhyaḥ gṛṣṭy-ādibhyaś ca (*4,1.136) iti ḍhañ  / basti  / kudri  /
    ajabasti  / mitrayu  / tataḥ parebhyo dvādaśabhya iñ  / rakṣomukha  / jaṅghāratha  /
    utkāsa  / kaṭukamanthaka  / puṣkarasat  / viṣapuṭa  / uparimekhala  / kroṣtumān  /
    kroṣṭupāda  / kroṣṭumāya  / śīrṣamāya  / puṣkarasacchabdād bāhvādipāṭhād iñ  /
    kharapaśabdo naḍādiṣu pathyate, tataḥ phak  / padaka  / varmaka  / etābhyām ata
    iñ (*4,1.95)  / bhalandanaśabdāt śivādibhyo 'ṇ (*4,1.112)  / bhaḍila  / bhaṇḍila  /
    bhadita  / bhaṇḍita  / etebhyaś caturbhyaḥ aśva-ādibhyaḥ phañ (*4,1.110) //
