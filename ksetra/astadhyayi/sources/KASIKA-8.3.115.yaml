source_id: KASIKA-8.3.115
locator:
  sutra: 8.3.115
witness_text:
  sutra: sanoteḥ sya-sanoḥ
  commentary: sunoteḥ sakārasya mūrdhanyadeśo na bhavati sye sani ca parataḥ  / abhisoṣyati  /
    parisoṣyati  / abhyasoṣyat  / paryasoṣyat  / sani kim udāharanam ? abhisusūṣati  /
    na+etad asti prayojanam, tatra stautiṇyor eva ṣaṇyabhyāsāt (*8,3.71) iti niyamāt
    na bhaviṣyati  / idaṃ tarhi, abhisusūṣate ? etad api na asti, sthādiṣv abhyāsena
    ca abhyāsasya (*8,3.64) iti niyamāt  / idaṃ tarhi, abhisusūṣateḥ apratyayaḥ abhisusūḥ
    ity udāharanam iti ? atra hi sanṣabhūto na bhavati ity abhyāsāt prāptir asti  /
    syasanoḥ iti kim ? suṣāva //
