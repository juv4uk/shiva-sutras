source_id: KASIKA-7.2.81
locator:
  sutra: 7.2.81
witness_text:
  sutra: āto ṅitaḥ
  commentary: ākārasya ṅidavayavasya ākārāntād aṅgād uttarasya sārvadhātukasya iy
    ity ayam ādeśo bhavati  / pacete pacethe  / pacetām  / pacethām  / yajete  / yajethe  /
    yajetām  / yajethām  / sārvadhātukam apit (*1,2.4) ity atra na ṅitīva ṅidvat ity
    evam aṅgīkriyate, api tu ṅita iva ṅidvat iti  / pūrvasūtra eva uccukuṭiṣati iti
    prasiddhaye tathāṅgīkaraṇam  / yadi gāṅkuṭādisūtre ṅita iva ṅidvad bhavati ity
    evam aṅgīkriyate, tadā anudāttaṅiti ātmanepadam (*1,3.12) ity ātmanepadaṃ prapnoti
    iti  / ātaḥ iti kim ? pacanti  / yajanti  / pacante  / yajante  / ṅitaḥ iti kim
    ? pacāvahai  / pacāmahai  / ataḥ ity eva, cinvāte  / sunvāte  / taparakaraṇam
    kim ? mimāte  / mimāthe //
