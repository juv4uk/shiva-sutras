source_id: KASIKA-6.1.27
locator:
  sutra: 6.1.27
witness_text:
  sutra: śṛtaṃ pāke
  commentary: vibhāṣā ity anuvartate  / śrā pāke ity etasya dhātoḥ ṇyantasya aṇyantasya
    ca pāke 'bhidheye ktapratyaye parataḥ śṛbhāvo nipātyate vibhāṣā  / śṛtaṃ kṣīram  /
    śṛtaṃ haviḥ  / vyavasthitavibhāṣā ca+iyam, tena kṣīrahaviṣor nityaṃ śṛbhāvo bhavati,
    anyatra na bhavati śrāṇā yavāgūḥ śrapitā yavāgūḥ iti  / yadā api bāhye prayojake
    dvitīyo ṇic utpadyate tadā api niṣyate, śrapitaṃ kṣīraṃ devadattena yajñadattena
    iti  / śrātir ayam akarmakaḥ karmakartṛviṣayasya pacer arthe vartate, sa ṇyantaḥ
    api prākṛtaṃ pacyarthamāhuḥ  / tad atra dvayor api śṛtam iti iṣyate  / śṛtaṃ kṣīraṃ
    svayam eva  / śṛtaṃ kṣīraṃ devadattena  / pākagrahaṇaṃ nipātanaviṣayapradarśanārtham,
    tena kṣīrahaviṣor eva // [#604]
