source_id: KASIKA-4.1.85
locator:
  sutra: 4.1.85
witness_text:
  sutra: dity-adity-āditya-paty-uttarapadāṇ ṇyaḥ
  commentary: prāgdīvyataḥ ity eva  / diti aditi āditya ity etebhyaḥ, patyuttarapadāt
    ca prātipadikāt prāgdīvyatīyeṣv artheṣu ṇyaḥ pratyayo bhavati  / daityaḥ  / ādityaḥ  /
    ādityam  / patyuttarapadāt - prājāpatyam  / saināpatyam  / yamācceti vaktavyam  /
    yāmyam  / vāṅmatipitṛmatāṃ chandasy upasaṃkhyānam  / vācyaḥ  / mātyā  / paitṛmatyam  /
    pṛthivyā ñāñau  / pārthivā  / pārthivī  / devād yañañau  / daivyam  / daivam  /
    bahiṣaṣṭilopaś ca  / bāhyāḥ  / īkak ca  / vāhīkaḥ  / īkañ chandasi  / bāhīkaḥ  /
    svare viśeṣaḥ  / ṭilopavacanam avyayānāṃ bhamātre ṭilopasya anityatvajñāpanārtham  /
    ārātīyaḥ  / sthāmno 'kāraḥ  / aśvatthāmaḥ  / lomno 'patyeṣu bahuṣu  / uḍulomāḥ  /
    śaralomāḥ  / bahuṣu iti kim ? auḍulomiḥ  / śāralomiḥ  / sarvatra gorajādipratyayaprasaṅge
    yat  / gavyam  / ajādi-pratyaya-prasaṅge iti kim ? gobhyo hetubhya āgataṃ gorūpyam  /
    gomayam  / ṇyādayo 'rthaviśeṣalakṣaṇād apavādāt pūrvavipratiṣedhena  / diterapatyaṃ
    daityaḥ  / vanaspatīnāṃ samūhaḥ vānaspatyam  / kathaṃ daiteyaḥ ? diti-śabdāt kṛdikārād
    aktinaḥ, sarvato 'ktinn-arthād ity eke iti ṅīṣaṃ kṛtvā strībhyo ḍhak kriyate  /
    liṅgaviśiṣṭa-paribhāṣā ca anityā // [#341]
