source_id: KASIKA-5.3.106
locator:
  sutra: 5.3.106
witness_text:
  sutra: samāsāc ca tadviṣayāt
  commentary: tad ity anena prakṛta ivārtho nirdeśyate  / ivārthaviṣayāt samāsād aparasminn
    ivārthe eva chanḥ pratyayo bhavati  / kālatālīyam  / ajākṛpāṇīyam  / andhakavartakīyam  /
    atarkitopanataṃ citrīkaraṇamucyate  / tat katham ? kākasyāgamanaṃ yādṛcchikam,
    tālasya patanaṃ ca  / tena talena patatā kākasya vadhaḥkṛtaḥ  / evam eva devadattasya
    tatrāgamanaṃ, dasyūnāṃ ca upanipātaḥ  / taiśca tasya vadhaḥ kṛtaḥ  / tatra yo
    devadattasya dasyūnāṃ ca samāgamaḥ, sa kākatālasamāgamasadṛśaḥ ity ekaḥ upamārthaḥ,
    ataśca devadattasya vadhaḥ, sa kālatālavadhasadṛśaḥ iti dvitīyaḥ upamārthaḥ  /
    tatra prathame samāsaḥ, dvitīye pratyayaḥ  / samāsaś ca ayam asmād eva jñāpakāt,
    na hy asya aparaṃ sakṣaṇam asti  / supsupeti vā samāsaḥ  / sa ca+evam viṣaya eva
    //
