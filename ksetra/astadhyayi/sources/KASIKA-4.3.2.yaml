source_id: KASIKA-4.3.2
locator:
  sutra: 4.3.2
witness_text:
  sutra: tasminn aṇi ca yuṣmāka-asmākau
  commentary: tasmin iti sākṣād vihitaḥ khañ nirdiṣyate, na cakāra-anukṛṣṭaḥ chaḥ  /
    tasmin khañi aṇi ca yuṣmad-asmador yathāsaṅkhyaṃ yuṣmāka asmāka ity etāv ādeśau
    bhavataḥ  / nimittayor ādeśau prati yathāsaṅkhaṃ kasmān na bhavati ? yogavibhāgaḥ
    kariṣyate, tasmin khañi yuṣmad-asmadoḥ yuṣmāka-asmākau bhavataḥ, tato 'ṇi ca iti  /
    yauṣmākīṇaḥ  / āsmākīnaḥ  / yauṣmākaḥ  / āsmākaḥ  / tasmin aṇi ca iti kim ? yuṣmadīyaḥ  /
    asmadīyaḥ //
