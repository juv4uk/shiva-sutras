source_id: KASIKA-3.4.111
locator:
  sutra: 3.4.111
witness_text:
  sutra: laṅaḥ śākaṭāyanasya+eva
  commentary: ātaḥ ity eva  / ākārāntād uttarasya laṅādeśasya jheḥ jus ādeśo bhavati
    śākaṭāyanasya ācāryasya matena  / ayuḥ  / avuḥ  / anyeṣāṃ mate - ayān  / nanu
    ṅitaḥ ity anuvartate  / atra laṅ eva akārāntād anantaro ṅit sambhavati na anyaḥ,
    tat kiṃ laṅ-grahaṇena ? evaṃ tarthi laṅ eva yo laṅ vihitaḥ tasya yathā syāt, laṅvad-bhāvena
    yas tasya mā bhūt, loṭo laṅvat (*3,4.85) iti  / yāntu  / vāntu  / sija-bhyasta-vidibhyaś
    ca (*3,4.109) ity ayam api jher jus loṭo na bhavati  / bibhyatu  / jāgratu  /
    vidantu  / jusbhāvamātraṃ hi mukhyena laṅā viśeṣyate  / eva-kāra uttara-arthaḥ
    //
