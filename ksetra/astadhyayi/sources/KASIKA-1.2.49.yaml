witness_text:
  sutra: luk taddhita-luki
  commentary: strī-grahaṇam anuvartate upasarjanasya+iti ca  / pūrveṇa hrasvatve prāpte
    lug vidhīyate  / taddhita-luki sati strī-pratyayasya upasrjanasya lug bhavati  /
    pañcendrāṇyo devatā asya pañcendraḥ  / daśendraḥ  / pañcabhiḥ śaṣkulībhiḥ krītaḥ
    pañcaśaṣkulaḥ  / āmalakyāḥ phalamāmalakam  / badaram  / kuvalam  / taddhita-grahaṇaṃ
    kim ? gārgyāḥ kulaṃ gārgī-kulam  / luki iti kim ? gārgītvam  / upasarjanasya ity
    eva  / avantī  / kuntī  / kurūḥ //
