  sutra: 3.2.150
witness_text:
  sutra: ju-caṅkramya-dandramya-sṛ-gṛdhi-jvala-śuca-laṣa-pata-padaḥ
  commentary: ju-praghṛtibhyo dhatubhyo yuc pratyayo bhavati tacchīlādiṣu kartṛṣu  /
    ju iti sautro dhatuḥ  / javanaḥ  / caṅkramaṇaḥ  / dandramaṇaḥ  / saraṇaḥ  / gardhanaḥ  /
    jvalanaḥ  / śocanaḥ  / laṣaṇaḥ  / patanaḥ  / padanaḥ  / calanārthānāṃ padeś ca
    grahaṇaṃ sakarmaka-artham iha  / jñāpana-arthaṃ ca padi-grahaṇam anye varṇayanti,
    tācchīlikeṣu mitho vā+asarūpa-vidhir na asti iti  / tena alaṅkṛñaḥ tṛn na bhavati
    alaṅkartā iti  / tathā hi paderukañā viśeṣa-vihitena sāmānya-vihitasya yuco 'sarūpatvāt
    samāveśo bhavedeva, kim anena vidhānena ? jñāpana-arthaṃ punar vidhīyate  / prāyikaṃ
    ca+etad jñāpakam  / kvacit samāveśa iṣyata eva, gantā kheṭaṃ vikatthanaḥ //
