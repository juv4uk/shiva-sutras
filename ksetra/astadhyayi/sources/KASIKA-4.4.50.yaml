locator:
  sutra: 4.4.50
witness_text:
  sutra: avakrayaḥ
  commentary: tasya ity eva  / ṣaṣṭhīsamarthāt avakraya ity etasminn arthe ṭhak pratyayo
    bhavati  / avakrīṇite 'nena iti avakrayaḥ piṇḍakaḥ ucyate  / śulkaśālāyāḥ avakrayaḥ
    aulkaśālikaḥ  / ākarikaḥ  / āpaṇikaḥ  / gaulmikaḥ  / nanu avakrayo 'pi dharmyam
    eva ? na+etad asti  / lokapīḍayā dharmatikrameṇa apy avakrayo bhavati // [#447]
