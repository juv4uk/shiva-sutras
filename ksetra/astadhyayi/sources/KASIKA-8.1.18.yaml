source_id: KASIKA-8.1.18
locator:
  sutra: 8.1.18
witness_text:
  sutra: anudāttaṃ sarvam apādādau
  commentary: anudāttam iti ca, sarvam iti ca, apādādau iti ca, apādādau iti ca etat
    trayam adhikṛtaṃ veditavyam ā pādaparisamāpteḥ  / ita uttaraṃ yad vakṣyāmaḥ anudāttaṃ
    sarvam apādādau ity evaṃ tad veditavyam  / vakṣyati - āmantritasya ca (*7,1.19)
    iti  / pacasi devadatta  / apādādau iti kim ? yat te niyānaṃ rajasaṃ mṛtyo anavadharṣyam  /
    bahuvacanasya vasnasau (*8,1.21)  / grāmo vaḥ svam, janapado naḥ svam  / apādādau
    iti kim ? rudro viśveśvaro devo yaṣmākaṃ kuladevatā  / sa eva nātho bhagavānasmākaṃ
    śatrumardanaḥ // pādagrahaṇenātra ṛkpādaḥ ślokapādaś ca gṛhyate  / sarvagrahaṇam
    sarvam anūdyamānaṃ vidhīyamānaṃ ca anudāttaṃ yathā syāt iti  / tena yuṣmadasmadādeśānām
    api vākyabhedena anudāttatvaṃ vidhīyate  / yuṣmadasmadādeśāś ca sarvasya subantasya
    padasya yathā syuḥ, yatra api svādipadaṃ padasañjñaṃ bhavati  / grāmo vāṃ dīyate  /
    janapado nau dīyate //
