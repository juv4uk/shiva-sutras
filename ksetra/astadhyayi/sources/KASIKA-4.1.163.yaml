source_id: KASIKA-4.1.163
locator:
  sutra: 4.1.163
witness_text:
  sutra: jīvati tu vaṃśye yuvā
  commentary: abhijanaprabandho vaṃśaḥ  / tatra bhavo vaṃśyaḥ pitrādiḥ  / tasmin jīvati
    sati pautraprabhṛty-apatyaṃ yuva-sañjñaṃ bhavati  / pautraprabhṛti iti ca na sāmānāadhikaraṇyena
    apatyaṃ viśeṣayati, kiṃ tarhi, ṣaṣṭhyā vipariṇamyate pautra-prabhṛter yad apatyam
    iti  / tena caturthādārabhya yuva / sañjñā vidhīyate  / gārgyāyaṇaḥ  / vātsyāyanaḥ  /
    tu-śabdo 'vadhāraṇa-artho yuva+eva na gotram iti //
