source_id: KASIKA-3.1.127
locator:
  sutra: 3.1.127
witness_text:
  sutra: ānāyyo 'nitye
  commentary: ānāyyaḥ iti nipātyate anitye 'bhidheye  / nayater āṅpūrvāṇ ṇyadāyādeśau
    nipātyete  / ānāyyo dakṣiṇāgniḥ  / rūḍhireṣā  / tasmād nitya-viśeṣe dakṣiṇa-agnāv
    eva avatiṣṭhate  / tasya ca anityatvaṃ nityam ajāgaraṇāt  / yaśca gārhapatyād
    ānīyate dakṣiṇāgnir āhavanīyena saha ekayoniḥ, tatra tan nipātanaṃ, na dakṣiṇāgnim
    ātre  / tasya hi yonir vikalpyate vaiśyakulād vittavato bhrāṣṭrādvā gārhapatyād
    vā iti  / ānāyyo 'nitya iti ced dakṣiṇāgnau kṛtaṃ bhavet  / ekayonau tu taṃ vidyād
    āneyo hy anyathā bhavet //
