source_id: KASIKA-6.1.113
locator:
  sutra: 6.1.113
witness_text:
  sutra: ato ror aplutād aplute
  commentary: ati, ut iti vartate  / akārād aplutād uttarasya ro rephasya ukārānubandhaviśiṣṭasya
    akāre 'plute parata ukārādeśo bhavati  / vṛkṣo 'tra  / plakṣo 'tra  / bho-bhago-agho-apūrvasya
    yo 'śi (*8,3.17) ity asmin prāpte utvaṃ vidhīyate  / rutvam api āśrayāt pūrvatra
    asiddham (*8,2.1) iti asiddhaṃ na bhavati  / ataḥ iti kim ? agnir atra  / taparakaraṇaṃ
    kim ? vṛkṣā atra  / sānubandhagrahaṇaṃ kim ? svaratra  / prātaratra  / ati ity
    eva, vṛkṣa iha  / tasya api taparatvād atra na bhavati  / vṛkṣa āśritaḥ  / alutāt
    iti kim ? susrotā3atra nvasi  / aplute iti kim ? tiṣṭhatu paya a3cśvin  / atra
    plutasya asiddhatvāt utvaṃ prāpnoti iti aplutād aplute iti ucyate //
