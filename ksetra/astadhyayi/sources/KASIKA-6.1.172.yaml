source_id: KASIKA-6.1.172
locator:
  sutra: 6.1.172
witness_text:
  sutra: aṣṭano dīrghāt
  commentary: aṣṭano dīrghāntād asarvanāmasthānavibhaktir udāttā bhavati  / aṣṭābhiḥ  /
    aṣṭābhyaḥ  / aṣṭāsu  / ghṛtādipāṭhāt aṣṭanśabdo 'ntodāttaḥ, tatra jñaly upottamam
    (*6,1.180) ity asya apavādo vibhaktir eva+udāttatvaṃ vidhīyate  / dīrghāt iti
    kim ? aṣṭasu prakrameṣu brāhmaṇo 'gnīnādadhīta  / idam eva dīrghagrahaṇam aṣṭana
    āttvavikalpaṃ jñāpayati, kṛtātvasya ca ṣaṭsañjñāṃ jñāpayati  / anyathā hy ātvapakṣe
    sāvakāśo 'ṣṭanaḥ  / svaraḥ paratvādanātvapakṣe ṣaṭsvareṇa bādhiṣyate iti kim dīrghagrahaṇena
    // [#641]
