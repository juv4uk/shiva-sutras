locator:
  sutra: 8.1.66
witness_text:
  sutra: yadvṛttān nityam
  commentary: prathamā, chandasi iti nivṛttam  / nighātapratiṣedha ity eva  / yado
    vṛttaṃ yadvṛttam  / yatra pade yacchabdo vartate tatsarvaṃ yadvṛttam  / iha vṛttagrahaṇena
    tadvibhaktyantaṃ pratīyāt  / ḍataraḍatamau ca pratyayau ity etan na aśrīyate  /
    tasmād yad vṛttād uttaraṃ tiṅantaṃ nānudāttam bhavati nityam  / yo bhuṅkte  /
    yaṃ bhojayati  / yena bhuṅkte  / yasmai dadāti  / yatkāmāste juhumaḥ  / yadriyaṅ
    vāyurvāti yad vāyuḥ pavate  / pañcamīnirdeśe 'py atra vyavahite kāryamiṣyate  /
    yāthākāmye veti vaktavyam  / yatra kvacana yajante // [#901]
