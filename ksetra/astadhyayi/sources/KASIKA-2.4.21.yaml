source_id: KASIKA-2.4.21
locator:
  sutra: 2.4.21
witness_text:
  sutra: upajñā-upakramam tad-ādy-ācikhyāsāyām
  commentary: upjñāyate ity upajñā  / upakramyate ity upakramaḥ  / upajjā ca upakramaś
    ca upajñopakramam  / tadantas tatpuruṣo napuṃsaka-liṅgo bhavati tad-ādy-ācikhyāsāyām,
    tayor upajñopakramayor āder ācikhyāsāyāṃ gamyamānāyām  / ākhyātum icchā ācikhyāsā  /
    yady upajñeyasya+upakramyasya ca arthasya ādir ākhyātum iṣyate tata etad bhavati  /
    pāṇiny-upajñamakālakaṃ vyākaraṇam  / pāṇiner upajñānena pratham ataḥ praṇītam
    akālakaṃ vyākaraṇam  / vyāḍyupajñaṃ daśahuṣkaraṇam  / ādyopakramaṃ prāsādaḥ  /
    nandopakramāṇi mānāni  / darśanīyopakramaṃ sukumāram  / upajñā-upakramam iti kim
    ? vālmīkiślokāḥ  / tad-ādy-ācikhyāsāyām iti kim ? devadattopajño rathaḥ  / yajñadattopakramo
    rathaḥ // [#159]
