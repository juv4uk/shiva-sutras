source_id: KASIKA-2.3.7
locator:
  sutra: 2.3.7
witness_text:
  sutra: saptamī-pañcamyau kāraka-madhye
  commentary: kāla-adhvanoḥ iti vartate  / kārakayor madhye yau kāla-adhvānau tābhyāṃ
    saptamī-pañcamyau vibhaktī bhavataḥ  / adya bhuktavā devadatto dvyahe bhoktā dvyahād
    vā bhoktā  / tryahe tryahād vā bhoktā  / kartṛ-śaktyor madhye kalaḥ  / iha stho
    'yam iṣvāsaḥ krośe lakṣyaṃ vidhyati  / krośāl lakṣyaṃ vidhiyati  / kartṛ-karmaṇoḥ
    kārakayoḥ karma-apādānayoḥ karma-adhikaraṇayor vā madhye krośaḥ  / saṅkhyāta-anudeśo
    na bhavati, asvaritatvāt //
