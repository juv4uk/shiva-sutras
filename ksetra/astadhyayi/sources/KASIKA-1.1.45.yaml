source_id: KASIKA-1.1.45
locator:
  sutra: 1.1.45
witness_text:
  sutra: ig-yaṇaḥ samprasāraṇam
  commentary: ik yo yaṇaḥ sthāne bhūto bhāvī vā tasya saṃprasāraṇam ity eṣā sañjñā
    bhavati  / yaj --i ṣṭam  / vap -- uptam  / graha -- gṛhītam  / kecid ubhayathā
    sūtram idaṃ vyācakṣate vākya-arthaḥ sañjñī, varṇaś ca iti  / ig-yaṇaḥ yo vākya-arthaḥ
    sthāny-ādeśa-sambandha-lakṣaṇaḥ sa samprasāraṇa-sañjño bhavati, yaṇ-sthānika ig-varṇaḥ
    sa samprasāraṇa-sañjño bhavati iti  / tatra vidhau vākya-artha upatiṣṭhate ṣyaṅaḥ
    samprasāraṇaṃ putra-patyos tatpuruṣe (*6,1.13) vasoḥ samprasāraṇam (*6,4.131)
    iti  / [#20] anuvāde varṇaḥ samprasāraṇāc ca (*6,1.108) iti  / saṅkhyāta-anudeśād
    iha na bhavati - adhitarām iti  / dyubhyām ity atra diva ut (*6,1.131) iti taparakaraṇād
    dīrgho na bhavati  / samprasāraṇa-pradeśāḥ - vasoḥ samprasāraṇam (*6,4.131) ity
    evam ādayaḥ // ādyantau ṭa-kitau (*1,1.46) ādiḥ ṭit bhavati, antaḥ kit bhavati
    ṣasṭhī-nirdiṣṭasya  / lavitā  / muṇḍo bhīṣayate  / ṭitpradeśāḥ - ārdhadhātukasya+iḍ
    val-ādeḥ (*7,2.35) ity evam ādayaḥ  / kit-pradeśāḥ - bhiyo hetubhaye śuk (*7,3.40)
    ity evam ādayaḥ // midaco 'ntyāt paraḥ (*1,1.47)  / acaḥ iti nirdhārane ṣaṣṭhī  /
    jātau ca+idam ekavacanam  / acāṃ saṃniviṣṭānām antyād acaḥ paro mit bhavati  /
    sthāneyoga - pratyaya paratvasya ayam apavādaḥ  / viruṇaddhi  / muñcati  / payāṃsi  /
    mitpradeśāḥ - rudḥ-ādibhyaḥ śnam (*3,1.78) ity evam ādayaḥ  / masjer antyāt pūrvaṃ
    num-am-icchanty anuṣaṅga-saṃyoga-ādi-lopa-artham  / magnaḥ  / magnavān  / maṅktā  /
    maṅktum // eca ig-ghrasva-ādeśe (*1,1.48)  / eco hrasva-ādeśe kartavye ik eva
    hrasvo bhavati, na anyaḥ  / rai-atiri  / nau-atinu  / go-upa gu  / ecaḥ iti kim
    ? atikhaṭvaḥ  / atimālaḥ  / hrasva-ādeśe iti kim ? de3vadatta  / devada3tta //
    ṣaṣṭhī sthāne-yogā (*1,1.49)  / paribhāśā iyaṃ yoga-niyama-arthā  / iha śāstre
    yā ṣaṣṭhī aniyata-yogā śrūyate, sā sthāne-yogā-iva bhavati, na-anya-yogā  / sthāne-yogasya
    nimitta-bhūte sati sā pratipattavyā  / sthāna-śabdaś ca prasaṅga-vācī  / yathā-darbhāṇāṃ
    sthāne śaraiḥ prastaritavyam iti darbhāṇāṃ prasaṅge iti gamyate  / evam iha api
    asteḥ sthāne prasaṅge bhūr bhavati  / bhavitā  / bhavitum  / bhavitavyam  / bruvaḥ
    prasaṅge vacirbhavati  / vaktā  / vaktum  / vaktavyam  / prasaṅge sambandhasya
    nimitta-bhūte bruva iti ṣasṭhī  / [#21] bahavo hi ṣaṣṭhy-arthāḥ- sva-svāmy-anantara-samīpa-samūha-vikāra-avayava-adyāḥ  /
    tatra yāvantaḥ śabde sambhavanti teṣu sarveṣu prapteṣu niyamaḥ kriyate ṣaṣṭhī
    sthāne-yogā iti  / sthāne yogo 'syāḥ iti vyadhikaraṇo bahuvrīhiḥ  / ata eva nipātanāc
    ca saptamyā aluk // sthāne 'ntaratamaḥ (*1,1.50)  / sthāne prāpyamāṇānām antaratam
    ādeśo bhavati sadṛśatamaḥ  / kutaś ca śabdasya antaryam ? sthāna-artha-guṇa-pramāṇataḥ  /
    sthānataḥ - akaḥ savarṇe dīrghaḥ (*6,1.101)  / daṇḍāgram  / yūpāgram  / dvayor
    akārayoḥ kaṇṭhya eva dīrgha a-akāro bhavati  / arthataḥ - vataṇḍī ca asau yuvatiś
    ca vātaṇḍya-yuvatiḥ  / puṃvad-bhāvena antaratamaḥ puṃśabdo 'tidiśyate  / guṇataḥ-pākaḥ  /
    tyāgaḥ  / rāgaḥ  / cajoḥ ku ghiṇyatoḥ (*7,3.52) iti ca-kārasya alpa-prāṇasya aghoṣasya
    tādṛśa eva ka-kāro bhavati  / ja-kārasya ghoṣavato 'lpa-prāṇasya tādṛśa eva ga-kāraḥ  /
    pramāṇataḥ - anuṣmai  / amūbhyām  / adaso 'ser dād u do maḥ (*8,2.80) iti hrasvasya
    hrasvaḥ, dīrghasya dīrghaḥ  / sthāne iti vartamāne punaḥ sthāne grahaṇaṃ kim ?
    yatra anekam āntaryaṃ sambhavati tatra sthānata eva āntaryaṃ balīyo yathā syāt  /
    cetā, stotā  / [#21] pramāṇato '-kāro guṇaḥ prāptaḥ, tatra sthānata āntaryād ekāraukārau
    bhavataḥ  / tamb-grahaṇaṃ kim ? vāg ghasati  / triṣṭub bhasati  / jhayo ho 'nyatarasyām
    (*8,4.62) iti ha-kārasya pūrva-savarṇe kriyamāṇe soṣmaṇaḥ soṣmāṇaḥ iti dvitīyāḥ
    prasaktāḥ, nādavato nādavantaḥ iti tṛtīyāḥ, tamab-grahaṇād  ye soṣmāṇo nādavantaś
    ca te bhavanti caturthāḥ // uraṇ raparaḥ (*1,1.51)  / uḥ sthāne aṇ prasajyamāna
    eva raparo veditavyaḥ  / kartā  / hartā  / kirati  / girati  / dvaimāturaḥ  /
    traimāturaḥ  / uḥ iti kim ? kheyam  / geyam  / an-grahaṇaṃ kim ? su-dhātur akaṅ
    ca (*4,1.97) - saudhātakiḥ // alo 'ntyasya (*1,1.52)  / ṣaṣṭhī-nirdiṣṭasya ya
    ucyate ādeśaḥ, so 'ntyasya alaḥ sthāne veditavyaḥ  / id goṇyāḥ (*1,2.50) - pañca-goṇiḥ  /
    daśa-goṇiḥ // [#22] ṅic ca (*1,1.53)  / ṅit ca ya ādeśaḥ so 'neka-al api alo 'ntyasya
    sthāne bhavati  / ānaṅ ṛto dvanve (*6,3.25) - hotā-potārau  / mātā-pitarau  /
    tātaṅi ṅit-karaṇasya guṇa-vṛddhi-pratiṣedha-arthatvāt sarva-ādeśaḥ tātaṅ bhavati  /
    jīvatād bhavān  / jīvatāt tvam // ādeḥ parasya (*1,1.54)  / parasya kāryaṃ śiṣyamāṇam
    āder alaḥ pratyetavyam  / kva ca parasya kāryam śiṣyate ? yatra pañcamī-nirdeśaḥ  /
    tad yathā-īdāsaḥ (*7,2.83) - āsīno yajate  / dvy-antar-upasargebho 'pa īt (*6,3.97)
    - dvīpam  / antarīpam  / pratīpam  / samīpam // aneka-al śit sarvasya (*1,1.55)  /
    aneka-al ya ādeśaḥ śit ca, sa sarvasya ṣaṣṭhī-nirdiṣṭasya sthāne bhavati  / aster
    bhūḥ (*2,4.52)-bhavitā  / bhavitum  / bhavitavyam  / śit khalv api - jaś-śasoḥ
    śiḥ (*7,1.20) -kuṇḍāni tiṣṭhanti  / kuṇḍāni pasya // sthānivad-ādeśo 'n-al-vidhau
    (*1,1.56)  / sthāny-ādeśayoḥ pṛthaktvāt sthāny-āśrayaṃ kāryam ādeśe na prāpnoti
    ity ayam-atideśa ārabhyate  / sthāninā tulyaṃ vartate iti sthānivat  / sthānivad-ādeśo
    bhavati sthāny-āśrayeṣu kāryeṣv anal-āśrayeṣu, sthāny-alāśrayāṇi kāryāṇi varjayitvā  /
    na alvidhir analvidhiḥ ity arthaḥ  / kim udāharaṇam ? dhātv-aṅga-kṛt-taddhita-avyaya-sup-tiṅ-padā-adeśāḥ  /
    dhātv-ādeśo dhātuvad bhavati  / aster bhūḥ (*2,4.52)  / bruvo vaciḥ (*2,4.53)  /
    ārdhadhātuka-viśaye prāg eva-ādeśeṣu kṛteṣu dhātoḥ (*3,1.91) iti tavya-ādayo bhavanti  /
    bhavitā  / bhavitum  / bhavitavyam  / vaktā  / vaktum  / vaktavyam  / aṅga-ādeśo
    'ṅgavad bhavati - kena  / kābhyām  / kaiḥ  / kimaḥ kaḥ (*7,2.103) iti ka-ādeśe
    kṛte 'ṅga-āśrayā ina-dīrghatva-aisbhāvāḥ bhavanti  / kṛd-ādeśaḥ kṛdvad bhavati
    - prakṛtya  / prahṛtya  / ktvo lyab-ādeśe kṛte hrasvasya piti kṛti tuk (*6,1.71)
    iti tug bhavati  / [#23] taddhita-ādeśaḥ taddhitavad bhavati - dādhikam  / adyatanam  /
    kṛt-taddhita-samāsāś ca (*1,2.46) iti prātipadika-sañjñā bhavati  / avyaya-ādeśo
    'vyayavad bhavati - prastutya  / prahṛtya  / upahṛtya  / upastutya  / avyayādāpsupaḥ
    (*2,4.82) iti sublug bhavati  / subādeśaḥ subvad bhavati - vṛkṣāya  / plakṣāya  /
    supi ca (*7,3.102) iti dīrghatvaṃ bhavati  / tiṅ-ādeśaḥ tiṅvad bhavati--akurutām  /
    akurutam  / sup-tiṅ-anataṃ padam (*1,4.14) iti pada-sañjñā bhavati  / pada-ādeśaḥ
    padavad bhavati -- grāmo vaḥ svaṃ  / jana-pado naḥ svam  / padasya (*8,1.16) iti
    rutvaṃ bhavati  / vat-karanaṃ kim ? sthānī ādeśasya sañjñā mā vijñāyi iti  / sva-āśrayam
    api yathā syāt  / āṅo yama-hanaḥ (*1,3.28) - āhata, āvadhiṣṭa iti ātmanepadam
    ubhayatra api bhavati  / ādeśa-grahaṇaṃ kim ? ānumānikasya apy ādeśasya sthānivadbhāvo
    yathā syāt  / pacatu - eruḥ (*3,4.86)  / anal-vidhau iti kim ? dyupathitad-ādeśā
    na sthānivad bhavanti  / dyauḥ, panthāḥ, saḥ iti  / hal-ṅy-ābbho dīrghāt su-ti-sy-apṛktaṃ
    hal (*6,1.68) iti su-lopo na bhavati // acaḥ parasmin pūrva-vidhau (*1,1.57)  /
    pūrvaṇān al-vidhau sthānivad-bhāva uktaḥ  / al-vidhy-artham-idam-ārabhyate  /
    ādeśaḥ sthānivat iti vartate  / acaḥ iti sthāni-nirdeśaḥ  / parasmin iti nimitta-saptamī  /
    pūrva-vidhau iti viṣaya-saptamī  / aj-ādeśaḥ paranimittakaḥ pūrvavidau kartavye
    sthānivad bhavati  / paṭayati  / avadhīt  / bahukhaṭvakaḥ  / paṭumācaṣṭe iti ṇiciṭi-lope
    kṛte tasya sthānivad-bhāvāt ata upadhāyāḥ (*7,2.116) iti vṛddhir na bhavati  /
    avadhīt -- ato lopasya sthānivad-bhāvad ato hal-āder laghoḥ (*7,2.7) iti halanta-lakṣaṇā
    vṛddhir na bhavati  / bahukhaṭvakaḥ iti āpo 'nyatarasyām (*7,4.15) iti hrasvasya
    sthānivad-bhāvād hrasvānte 'ntyāt pūrvam (*6,2.174) iti svaro na bhavati  / acaḥ
    iti kim ? praśnaḥ  / ākrāṣṭām  / āgatya  / praśnaḥ iti praccheḥ naṅpratyaye c-cḥ-v-oḥ
    śūḍ-anunāsike ca (*6,4.19) iti cha-kārasya śa-kāraḥ paranimittakas tuki kartavye
    na sthānivad bhavati  / ākrāṣṭām iti jhalo jhali (*8,2.26) iti sico lopaḥ paranimittakaḥ
    kṛṣeḥ ṣa-kārasya ṣaḍhoḥ kaḥ si (*8,2.41) iti ka-kāre kartavye na sthānivad bhavati  /
    āgatya iti vā lyapi (*6,4.38) ity anunāsika-lopaḥ paranimittakaḥ tuki kartavye
    na sthānivad bhavati  / parasmin iti kim ? yuvajāniḥ vadhūṭījāniḥ  / vaiyāghrapadyaḥ  /
    ādīdhye  / yuvajāniḥ iti jāyāyāḥ niṅ (*5,4.134) na paranimittakaḥ, tena ya-lope
    na sthānivad bhavati  / vaiyāghrapadyaḥ iti na paranimittakaḥ pādasya antalopaḥ
    padbhāvaṃ na pratibadhnāti  / ādīdhye iti dīdhīṅa uttamapuruṣa-ikavacane ṭeretvasya-aparanimittakatvād
    yi-i-varṇayor dīdhī-vevyoḥ (*7,4.53) iti lopo na bhavati  / [#24] pūrva-vidhau
    iti kim ? he gauḥ  / bābhravīyāḥ  / naidheyaḥ  / he gauḥ iti vṛddhir aj-ādeśaḥ
    sambuddhi-lope kartavye na sthānivad bhavati  / bābhravīyāḥ iti bābravyasya amī
    cchātrāḥ iti vṛddhāc chaḥ (*4,2.114) iti chaḥ  / halas taddhitasya (*6,4.150)
    iti ya-kāral-ope kartavye av-ādeśo na sthānivad bhavati  / naidheyaḥ -- āto lopa
    iṭi ca (*6,4.64) ity ā-kāra-lopaḥ, itaś ca aniñaḥ (*4,1.122) iti dvy-aj-lakṣaṇe
    pratyaya-vidhau na sthānivad bhavati // na padānta-dvirvacana-vare-ya-lopa-svara-savarṇa.
    anusvāra-dīrgha-jaś-car-vidhiṣu (*1,1.58)  / pūrveṇa atiprasaktaḥ sthānivad-bhāva
    eteṣu vidhiṣu pratiṣidhyate  / padānta-vidhiṃ praty-aj-ādeśo na sthānivad bhavati  /
    kau staḥ  / yau staḥ  / tāni santi  / yani santi  / śna-sor al-lopaḥ kṅiti sārvadhātuke
    iti paranimittakaḥ, sa pūrva-vidhāv āv-ādeśe yaṇ-ādeśe ca kartavye sthānivat syāt,
    asmād vacanān na bhavati  / dvirvacana-vidhiḥ -- dvirvacana-vidhiṃ prati na sthānivad
    bhavati  / daddhyatra  / maddhvatra  / yaṇ-ādeśaḥ paranimittakaḥ, tasya sthānivad-bhāvāt
    anaci ca (*8,4.47) iti dha-kārasya dvirvacanaṃ na syād asmād vacanād bhavati  /
    varevidhiḥ -- vare yo 'j-ādeśaḥ sa pūrva-vidhiṃ prati na sthānivad bhavati  /
    apsu yāyāvaraḥ pravapeta piṇḍān  / yāteḥ yaṅ-antāt yaś ca yaṅaḥ (*3,2.176) iti
    varaci kṛte ato lopaḥ (*6,4.48) para-nimittakaḥ, tasya sthānivattvād ato lopa
    iṭi ca (*6,4.64) ity ā-kāra-lopaḥ syād, asmād vacanān na bhavati  / ya-lopa-vidhiḥ
    -- ya-lopa-vidhiṃ pratyaj-ādeśo na sthānivad bhavati  / kaṇḍūtiḥ  / kaṇḍūyateḥ
    ktini kṛte, ato lopaḥ paranimittakaḥ, lopo v-yor vali (*6,1.66) iti yalope sthānivat
    syād asmād vacanān na bhavati  / svara-vidhiḥ -- svara-vidhiṃ prati aj-ādeśo na
    sthānivad bhavati  / cikīrṣakaḥ  / jihīrṣakaḥ ṇvuli kṛte ato lopaḥ paranimittakaḥ,
    liti (*6,1.193) pratyayāt pūrvam udāttam, iti svare kartavye na sthānivad bhavati
    iti  / savarṇa-vidhiḥ -- savarṇa-vidhiṃ prati ajādeśo na sthānivad bhavati  /
    śiṇḍhi  / piṇḍhi  / śiṣeḥ piṣeśca loṇ-madhyama-puruṣa-ikavacane rudḥ-ādibhyaḥ
    śnam (*3,1.78)  / hitvadhitvaṣṭutvajaśtveṣu kṛteṣu, śnasor al-lopaḥ kṅiti sārvadhātuke
    paranimittakaḥ, anusvārasya yayi parasavarṇe kartavye na sthānivad bhavati  /
    [#25] anusvāra-vidhiḥ -- anusvāra-vidhiṃ prati aj-ādeśo na sthānivad bhavati  /
    śiṃṣanti  / piṃṣanti  / naś ca apadāntasya jhali (*8,3.24) iti anusvāre kartavye
    śnasorallopaḥ na sthānivad bhavati  / dīrgha-vidhiḥ -- dīrgha-vidhiṃ prati ajādeśo
    na sthānivad bhavati  / pratidīvnā  / pratidīvne  / pratidivan ity etasya bhasya
    (*6,4.129) ity adhikṛtya tṛtīya-ikavacane caturthy-ekavacane ca allopo 'naḥ (*6,4.134)
    ity a-kāra-lopaḥ paranimittakaḥ, tasya sthānivadb-hāvād hali ca (*8,2.77) iti
    dīrghatvaṃ na syāt, na hy ayaṃ va-kāro hal-paraḥ iti, asmād vacanād bhavati  /
    jaś-vidhiḥ -- jaś-vidhiṃ praty-aj-ādeśo na sthānivad bhavati  / sagdhiś ca me
    sapītiś ca me  / babdhāṃ te harī dhānāḥ  / adeḥ ktini bahulaṃ chandasi (*2,4.39)
    iti ghas-la-ādeśaḥ  / ghasi-bhasor hali ca (*6,4.100) ity upadhal-opaḥ  / jhalo
    jahli (*8,2.26) iti sa-kāra-lopaḥ  / jhaṣas ta-thor dho 'dhaḥ (*8,2.40) iti dhatvam  /
    upadhā-lopasya sthānivattavāt jhalāṃ jas jhasi (*8,4.53) iti gha-kārasya jaśtvaṃ
    na syāt, asmād vacanād bhavati  / samanā gdhiḥ  / samānasya sabhāvaḥ  / sagdhiḥ  /
    babdhām iti bhaser-loḍ-dvivacane śapaḥ sluḥ, dvirvacanam, abhyāsa-kāryam, ghasi-bhasor
    hali ca (*6,4.100) iti upadhā-lopaḥ, jhalo jhali (*8,2.26) it sa-kāra-lopaḥ, jhaṣas
    ta-thor dho 'dhaḥ (*8,2.40) iti dhatvam  / upadha-lopasya sthānivattvāt jhalām
    jaś jhaśi (*8,4.53) iti jaśtvaṃ na syāt, asmād vacanād bhavati  / carvidhiḥ --
    carvidhiṃ prati aj-ādeśo na sthānivad bhavati  / jakṣatuḥ  / jakṣuḥ  / akṣan pitaro
    'mīmadanta pitaraḥ  / liḍ-dvivacana-bahuvacanayor ader ghas-la-ādeśaḥ  / gama-hana-jana-khana-ghasāṃ
    lopaḥ k-ṅity anaṅi (*6,4.98) iti upadhā-lopaḥ, dvirvacanam, abhyāsa-kāryam  /
    tatra upadhā-lopasya sthānivattvāt khari ca (*8,4.55) iti gha-kārasya cartvaṃ
    na syād, asmād vacanād bhavati  / śāsi-vasi-ghasīnāṃ ca (*8,3.60) iti śatvam  /
    akṣan iti adeḥ luṅ bahuvacane ghas-la-ādeśaḥ, clerāgatasya mantre ghasa-hvara
    (*2,4.80) iti luk  / gama-hana-jana-khana-ghasāṃ lopaḥ k-ṅity anaṅi (*6,4.98)
    ity upadhā-lopaḥ, tasya sthānivattvāt khari ca (*8,4.55) iti cartvaṃ na syāt,
    asmād vacanād bhavati  / svara-dīrghaya-lopeśu lopa-aj-ādeśo na sthānivad bhavati  /
    anyatra sthānivad eva  / tena bahukhaṭvakah, kiryoḥ, giryoḥ, vāyvoḥ iti sthānivattvāt
    svara-dīrghaya-lopā na bhavanti // [#26] dvirvacane 'ci (*1,1.59)  / dvirvacana-nimitte
    'ci aj-ādeśaḥ sthānivad bhavati , dvirvacana eva kartavye  / rūpa-atideśaś ca
    ayaṃ niyata-kālaḥ  / tena kṛte dvirvacane punar ādeśa rūpam eva avatiṣṭhate  /
    āl-lopa-upadhālopa-ṇilopayaṇ-ay-av-āy-āv-ādeśāḥ prayojanam  / āl-lopaḥ--papatuḥ  /
    papuḥ  / āto lopa iṭi ca (*6,4.64) iti ā-kāra-lope kṛte tasya sthānivad-bhāvāt
    eka-aco dve prathamasya (*6,1.1) iti dvirvacanaṃ bhavati  / upadhā-lopaḥ--jaghnatuḥ  /
    jaghnuḥ  / gama-hana-jana-khana-ghasāṃ lopaḥ k-ṅity anaṅi (*6,4.98) ity aupadhā-lope
    kṛte anackatvād dvirvacanaṃ na syāt, asmād vacanād bhavati  / ṇi-lopaḥ -- āṭ-iṭat  /
    aṭateḥ ṇici luṅi caṅi ṇilope kṛte tasya sthānivattvād aj-āder dvitīyasya (*6,1.2)
    iti ṭi-śabdasya dvirvacanam bhavati  / yaṇ -- cakratuḥ  / cakruḥ  / karoteḥ atusi
    usi ca yaṇ-ādeśe kṛte anackatvād dvirvacanaṃ na syāt, sthānivattvād bhavati  /
    ayavāyāvādeśāḥ -- ninaya, nināya  / lulava, lulāva  / nayateḥ lunāteś ca uttame
    ṇali guṇe kṛte vṛddhau ca ay-av-āy-āv-ādeśāḥ, teṣāṃ sthānivattvān ne nai lo lau
    iti dvirvacanaṃ bhavati  / dvirvacane kaṛtavya iti kim ? jagle, mamle  / śravaṇam
    ā-kārasya na bhavati  / dvirvacana-nimitte iti kim ? dudyūṣati  / ūṭhi yaṇ-ādeśo
    na sthānivad bhavati  / aci iti kim ? jeghrīyate, dedhmīyate  / ī ghrā-dhmoḥ (*7,4.31)
    yaṅi ca (*7,4.30) iti ī-kāra-ādeśaḥ, tasya sthānivadbhāvād ā-kārasya dvirvacanaṃ
    syāt, aj-grahaṇān na bhavati // adarśanaṃ lopaḥ (*1,1.60)  / adarśanam, aśravaṇam,
    anuccāranam, anupalabdhiḥ, abhāvo, varṇavināśaḥ ity anartha-antaram  / etaiḥ śabdairyo
    'rtho 'bhidhīyate, tasya lopaḥ iti iyaṃ sañjñā bhavati  / arthasya-iyaṃ sañjñā,
    na śabdasya  / prasaktasya adarśanaṃ lopa-sañjñaṃ bhavati  / godhāyā ḍhrak (*4,1.129)-gaudheraḥ  /
    paceran  / jīve radānuk jīradānuḥ  / strivermanin āsremāṇam  / ya-kāra-vakārayor
    adarśanam iha udāharaṇam  / aparasya anubandhādeḥ prasaktasya  / lopa-pradeśāḥ-lopo
    vyor vali (*6,1.66) ity evam ādayaḥ // [#27] pratyayasya luk-ślu-lupaḥ (*1,1.61)  /
    adarśanam iti vartate  / pratyaya. adarśanasya luk, ślu, lup ity etāḥ sañjñā bhavanti  /
    aneka-sañjñā-vidhanāc-ca tad-bhāvita-grahaṇam iha vijñāyate  / luk-sañjñā-bhāvitaṃ
    pratyaya-adarśanaṃ luk-sañjñam bhavati, ślu-sañjñā-bhāvitaṃ ślu-sañjñaṃ bhavati,
    lup-sañjñā bhāvitaṃ lup-sañjñaṃ bhavati  / tena sañjñānāṃ saṅkaro na bhavati  /
    vidhi-pradeśeṣu ca bhāvinī sañjñā vijñāyate  / atti  / juhoti  / varaṇāḥ  / pratyaya-grahaṇam
    kim ? agastayaḥ  / kuṇḍināḥ  / luk-ślu-lup-pradeśāḥ - luk-taddhita-luki (*1,2.49),
    juhoty-ādibhyaḥ śluḥ (*2,4.75),  janapade lup (*4,2.71) ity evam ādayaḥ // pratyaya-lope
    pratyaya-lakṣaṇam (*1,1.62)  / pratyaya-nimittaṃ kāryam asaty api pratyaye kathaṃ
    nu nāma syāt it sūtram idam ārabhyate  / pratyaya-lope kṛte pratyaya-lakṣaṇaṃ
    pratyaya-hetukaṃ karyaṃ bhavati  / agnicit, somasut, adhok, ity atra sup-tiṅoḥ
    luptayoḥ sup-tiṅ-antaṃ padam (*1,4.14) iti pada-sañjñā bhavati  / adhok iti duheḥ
    laṅi tipi śabluki tilope ghatva-bhaṣbhāva-jaśtva-cartveṣu kṛteṣu rūpam  / pratyaya
    iti vartamāne punaḥ pratyaya-grahaṇaṃ kim ? kṛtsna-pratyaya-lope yathā syāt  /
    iha mā bhūt -- āghnīya  / saṅgmīya  / hanigamyor liṅ-ātmanepade liṅaḥ sa-lopo
    'nantyasya (*7,2.79) iti sīyuṭ-sa-kāra-lopaḥ pratyaya-ikadeśa-lopaḥ, tatra pratyaya-lakṣaṇena
    jhali ity anunāsikalopo na bhavati (*6,4.37)  / pratyaya-lakṣaṇam iti kim ? rāyaḥ
    kulaṃ raikulam  / gave hitam gohitam  / āyav-ādeśau na bhavataḥ varṇa-āśrayatvāt
    // na lumatā 'ṅgasya (*1,1.63)  / pūrveṇa atiprasaktaṃ pratyaya-lakṣaṇam iti viśeṣe
    pratiṣedhaḥ ucyate  / lumatā śabdena lupte pratyaye yad-aṅgaṃ, tasya pratyaya-lakṣaṇaṃ
    kāryaṃ na bhavati  / gargāḥ  / mṛṣṭaḥ  / juhutaḥ  / yañ-śapor lumatā luptayor
    aṅgasya vṛddhi-guṇau na bhavataḥ  / lumatā iti kim ? kāryate  / hāryate  / aṅgasya
    iti kim ? pañca  / sapta payaḥ  / sāma // aco 'ntya-ādi ṭi (*1,1.64)  / acaḥ iti
    nirdhāraṇe ṣaṣṭhī  / jātāv-ekavacanam  / acāṃ sanniviṣṭāmāṃ, yo 'ntyo 'c tad-ādi
    śabda-rūpaṃ ṭi-sañjñaṃ bhavati  / agnicit-icchabdaḥ  / somasut-uc-chabdaḥ  / ātām,
    āthām-ām-śabdaḥ  / pacete, pacethe  / ṭi-pradeśāḥ--ṭita ātmanepadānaṃ ṭere (*3,4.79)
    ity evam ādayaḥ // [#28] alo 'ntyāt pūrva upadhā (*1,1.65)  / dhātv-ādau varṇa-samudāye
    'ntyād alaḥ pūrvo yo varṇaḥ so 'l eva upadhā-sañjñao bhavati  / pac, paṭh--a-karaḥ  /
    bhid, chid--i-kāraḥ  / budh, yudh--ukāraḥ  / vṛt, vṛdh--ṛkāraḥ  / alaḥ iti kim
    ? śiṣṭaḥ, śiṣṭavān  / samudāyāt pūrvasya mā bhūt  / upadhā-pradeśāḥ--ata upadhāyāḥ
    (*7,2.115) ity evam ādayaḥ // tasminn iti nirdiṣṭe pūrvasya (*1,1.66)  / tasmin
    iti saptamy-artha-nirdeśe pūrvasya-iva kāryaṃ bhavati, na-uttarasya  / iko yaṇ-aci
    (*6,1.77)--dadhyudakam  / madhvidam  / pacatyodanam  / nirdiṣṭa-grahaṇam ānantarya-artham  /
    agnicidatra iti vyavahitasya mā bhūt // tasmād ity uttarasya (*1,1.67)  / nirdiṣṭa-grahanam
    anuvartate  / tasmāt iti pañcamy-artha-nirdeśa uttarasya-iva kāryaṃ bhavati, na
    pūrvasya  / tiṅṅ-atiṅaḥ (*8,1.28) -- odanaṃ pacati  / iha na bhavati -- pacaty
    odanam iti // svaṃ rūpaṃ śabdasya aśabda-sañjñā (*1,1.68)  / śāstre svam eva rūpaṃ
    śabdasya grāhyaṃ bodhyaṃ pratyāyyaṃ bhavati, na bāhyo 'rthaḥ, śabda-sañjñāṃ varjayitvā  /
    śabdena artha-avagater arthe kāryasya asambhavāt tad-vācinām śabdānām sampratyayo
    mā bhūt iti sūtram idam ārabhyate  / agner ḍhak (*4,2.33) -- āgneyam aṣṭā-kapālaṃ
    nirvapet  / agni-śabdo 'gni-śabdasya-iva grāhako bhavati, na jvalanaḥ, pāvakaḥ,
    dhūma-ketuḥ iti  / na ataḥ pratyayo bhavati  / udaśvito 'nyatarasyām (*4,2.19)--audaśvitkam  /
    audaśvitam  / takram, ariṣṭaṃ, kālaśeyaṃ, daṇḍāhataṃ, mathitam, iti na ataḥ pratyayo
    bhavati  / aśabda-sañjñā iti kim ? dā-dhā ghv-adāp (*1,1.20) tarap-tamapau ghaḥ
    (*1,1.23), ghu-grahaṇeṣu gha-grahaneṣu ca sañjñināṃ grahanam, na sañjñāyāḥ  /
    sit-tad-viśeṣāṇāṃ vṛkṣādy-artham  / sin-nirdeśaḥ kartavyaḥ  / tato vaktavyam tad-viśeṣāṇāṃ
    grahaṇaṃ bhavati iti  / kiṃ prayojanam ? vṛkṣādy-artham  / vibhāṣā vṛkṣa-mṛga-tṛṇa-dhānya-vyañjana-paśu.
    śakuny-aśva-vaḍava-pūrvāpara-adharottarāṇām (*2,4.12) iti -- plakṣanyagrodham,
    plakṣanyagrodhāḥ  / [#29] pit-paryāya-vacanasya ca sva-ādy-artham  / pin-nirdeśaḥ
    kartavyaḥ  / tato vaktavyam paryāya-vacanasya grahaṇaṃ bhavati, ca-kārāt svasya
    rūpasya tad-viśeṣāṇāṃ ca iti  / kiṃ prayojanam ? sva-ādy-artham  / sve puśaḥ (*3,4.40)  /
    svapoṣaṃ puṣṭaḥ  / raipośam  / dhanapośam  / aśvapoṣam  / gopośam  / jitparyāya-vacanasya-iva
    rāja-ādy-artham  / jin-nirdeśaḥ kartavyaḥ  / tato vaktavyam paryāya-vacanasya-iva
    grahanaṃ bhavati iti, na svarūpasya, na api tad-viśeṣāṇām  / kiṃ prayojanam ?
    rāja-ādy-artham  / sabhā rājā+amanuṣya-pūrvā (*2,4.23) -- inasabham  / īśvarasabham  /
    tasya-iva na bhavati--rāja-sabhā  / tad-viśeṣāṇāṃ ca na bhavati -- puṣyamitra-sabhā  /
    candragupta-sabhā  / jhaittad-viśeṣāṇāṃ ca matsya-ādy-artham  / jhin-nirdeśaḥ
    kartavyaḥ  / tato vaktavyam tasya ca grahaṇaṃ bhavati tad-viśaṣāṇāṃ ca iti  /
    kiṃ prayojanam ? matsya-ādy-artham  / pakṣi-matsya-mṛgān hanti (*4,4.35) iti ṭhak--pākṣikaḥ  /
    mātsiyakaḥ  / tad-viśeṣāṇām -- śākunikaḥ  / paryāyāṇāṃ na bhavati--ajihmān hanti,
    animiṣān hanti iti  / atha-ikasya-iśyate, mīnān, hanti iti mainikaḥ // aṇudit
    savarṇasya ca-apratyayaḥ (*1,1.69)  / pareṇa ṇa-kāreṇa pratyāhāra-grahaṇam  /
    aṇ gṛhyamāṇa udic ca savarṇānāṃ grāhako bhavati, svasya ca rūpasya, pratyayaṃ
    varjayitvā  / ād guṇaḥ (*6,1.87), asya cvau (*7,4.32), yasya-īti ca (*6,4.148)  /
    svara-anunāsikya-kāla-bhinnasya grahanaṃ bhavati  / udit khalv api  / cu-ṭū (*1,3.7),
    laśakva-taddhite (*1,3.8)  / ca-varga-ṭa-vargayoḥ ka-vargasya ca grahanam bhavati  /
    apratyayaḥ iti kim ? san-āśaṃsa-bhikṣa uḥ (*3,2.168), a sāmpratike (*4,3.9), dīrgho
    na bhavati // ta-paras tat-kālasya (*1,1.70)  / taḥ paro yasmāt so 'yaṃ taparaḥ,
    tād api paraḥ taparaḥ  / tapro varṇas tat-kālasya, ātmanā tulya-kālasya guṇa-antara-yuktasya
    savarṇasya grāhako bhavati, svasya ca rūpasya  / vidḥ-yartham idam  / aṇ iti na
    anuvartate  / aṇāmanyeṣāṃ ca taparāṇām idam eva grahaṇaka-śāstram  / [#30] ato
    bhisa ais (*7,1.9) ity evam ādiṣu pūrva-grahaṇaka-śāstraṃ na pravartata eva  /
    ataparā aṇastasya avakāśaḥ  / kim udāharaṇam ? ato bhisa ais (*7,1.9)-- vṛkṣaiḥ  /
    plakṣaiḥ  / viḍ-vanor anunāsikasya āt (*6,4.41)-- abjāh, gojāḥ  / tatkālasya iti
    kim ? khaṭvābhiḥ  / mālābhiḥ // ādir antyena saha-itā (*1,1.71)  / ādir antyena
    it-sañjñakena saha gṛhyamāṇas tan-madyapatitānāṃ varṇānāṃ grāhako bhavati, svasya
    ca rūpasya  / aṇ  / ak  / ac  / hal  / sup  / tiṅ  / antyena iti kim ? suṭ iti
    tṛtīya-ikavacanena ṭā ity anena grahaṇaṃ mā bhūt // yena vidhis tad-antasya (*1,1.72)  /
    yena viśeṣaṇena vidhir-vidhīyate sa tad-antasya ātmān tasya samudāyasay grāhako
    bhavati , svasya ca rūpasya  / erac (*3,3.56), i-varṇa-antād ac-pratyayo bhavati--cayaḥ  /
    jayaḥ  / ayaḥ  / or āvaśyake (*3,1.125), u-varṇa-antād ṇyad bhavati-- avaśyalāvyam  /
    avaśyapāvyam  / samāsa-pratyaya-vidhau tad-anta-vidheḥ pratiṣedho vaktavyaḥ  /
    dvitīya-antaṃ śritādibhiḥ saha samasyate (*2,1.24) -- kaṣṭaśritaḥ  / iha mā bhūt
    -- kaṣṭaṃ paramaśrita iti  / pratyaya-vidhau -- naḍa-ādibhyaḥ phak (*4,1.99),
    naḍasya apatyaṃ nāḍāyanaḥ  / iha mā bhūt-- sūtra-naḍasya apatyaṃ sautranāḍiḥ  /
    kim aviśeṣeṇa ? na ity āha  / ugid-varṇa-grahaṇa-varjam iti vācyam  / ugitaś ca
    (*4,1.6) iti ṅīp-pratyayaḥ tad-antād api bhavati -- bhavatī, atibhavatī  / varṇagrahanam--ata
    iñ (*4,1.95), dākṣiḥ  / plākṣiḥ  / yasmin vidhis tad-ādāv algrahaṇe  / al-grahaṇeṣu
    yasmin vidhistad ādau iti vaktavyam  / aci śnu-dhātu-bhruvāṃ yvor iyaṅ-uvaṅau
    (*6,4.77) iti-- śriyaḥ  / bhruvaḥ // [#31] vṛddhir yasya acām ādis tad vṛddham
    (*1,1.73)  / yasya iti samudāya ucyate  / acāṃ madye yasya vṛddhi-sañjñaka ādi-bhūtaḥ,
    tac-chabda-rūpaṃ vṛddha-sajñjaṃ bhavati  / acām iti jātau bahuvacanam  / śālīyaḥ  /
    mālīyaḥ  / aupagavīyaḥ  / kāpaṭavīyaḥ  / ādiḥ iti kim ? sabhāsannayate bhavaḥ
    sābhāsannayanaḥ  / vā nāmadheyasya vṛddha-sañjñā vaktavyā  / devadattīyāḥ  / daivadattāḥ  /
    gotrāntād asamastavat-pratytyo bhavatīti vaktavyam  / ghṛta-pradhano rauḍhiḥ ghṛtarauḍhiḥ  /
    tasya chātrā ghṛtarauḍhīyāḥ  / odana-pradhānaḥ pāṇiniḥ odana-pāṇiniḥ  / tasya
    chātrā odana-pāṇinīyāḥ  / vṛddhāmbhīyāḥ  / vṛddhakāśyapīyāḥ  / jihvākātya-haritakāya-varjam  /
    jaihvākātāḥ  / hāritakātāḥ // tyad-ādīni ca (*1,1.74)  / yasya acām ādi-grahaṇam
    uttara-artham anuvartate  / iha tu na sambadhyate  / tyad-ādīni śabda-rūpāṇi vṛddha-sañjñāni
    bhavanti  / tyadīyam  / tadīyam  / etadīyam  / idamīyam  / adasīyam  / tvadīyam  /
    tvādāyaniḥ  / madīyam  / mādāyaniḥ  / bhavatīyam  / kimīyam // eṅ prācām deśe
    (*1,1.75)  / yasya acām ādi-grahaṇam anuvartate  / eṅ yasya acām ādiḥ tat prācāṃ
    deśābhidhāne vṛddha-saṃjñaṃ bhavati  / eṇīpacanīyaḥ  / bhojakaṭīyaḥ  / gonardīyaḥ  /
    eṅ iti kim ? āhicchatraḥ  / kānya-kubjaḥ  / prācām iti kim ? devadatto nāma bāhīkeṣu
    grāmah, tatra bhavaḥ daivadattaḥ  / deśe iti kim ? gomatyāṃ bhavā matsyāḥ gaumatāḥ
    // prāg udañcau vibhajate haṃsaḥ kṣīrodake yathā  / viduṣāṃ śabda-siddhy-arthaṃ
    sā naḥ pātu śarāvatī // iti śrījayādityaviracitāyāṃ kāśikāyām vṛttau prathamādhyāyasay
    prathamaḥ pādaḥ // [#32]
