source_id: KASIKA-2.2.24
locator:
  sutra: 2.2.24
witness_text:
  sutra: anekam anyapadārthe
  commentary: anekaṃ subantamanyapdārthe vartamānaṃ supā saha samasyate, bahuvrīhiś
    ca samāso bhavati  / prathamārtham ekaṃ varjayitvā sarveṣu vibhakty-artheṣu bahuvrīhir
    bhavati  / prāptam udakaṃ yaṃ grāmaṃ prāptodako grāmaḥ  / ūḍharatho 'naḍvān  /
    upagṛtapaśū rudraḥ  / udghṛtaudanā sthālī  / citragurdevadattaḥ  / vīrapuruṣako
    grāmaḥ  / prathama-arthe tu na bhavati  / vṛṣṭe deve gataḥ  / aneka-grahanaṃ kim
    ? bahūnām api yathā syāt, susūkṣmajaṭakeśena sugajājinavāsasā  / samantaśitir
    andhreṇa dvayor vṛttau na sidhyati // bahuvrīhiḥ samānādhikaraṇānam iti vaktavyam  /
    vyadhikaraṇānāṃ mā bhūt, pañcabhir bhuktamasya  / avyayānāṃ ca bahuvrīhir vaktavyaḥ  /
    uccair mukhaḥ  / nīcair mukhaḥ  / saptamy-upamāna-pūrvapadasya+uttarapada-lopa
    śca vaktavyaḥ  / kaṇṭhe sthitaḥ kālo 'sya kaṇṭhekalaḥ  / urasilomā  / uṣṭrasya
    mukham iva mukhaṃ yasya sa uṣṭramukhaḥ  / kharamukhaḥ  / samudāya-vikāraṣaṣṭhyāś
    ca bahuvrīhir uttarapada-lopaś ca+iti vaktavyam  / keśānāṃ saṅghātaḥ keśasaṅghātaḥ,
    keśasaṅghātaḥ cūḍā 'sya keśacūḍaḥ  / suvarṇasya vikāro 'laṅkāro 'sya subarṇālaṅkāraḥ  /
    [#126] prādibhyo dhatujasya+uttarapadasya lopaś ca vā bahuvrīhir vaktavyaḥ  /
    prapatitaṃ parṇamasya praparṇaḥ, prapatitaparṇaḥ  / pratitaṃ palāśamasya prapalāśaḥ,
    prapatitapalāśaḥ  / naño 'styarthānāṃ bahuvrīhir vācottarapadalopaś ca  vaktavyaḥ  /
    āvidyamānaḥ putro yasya aputraḥ, avidyamānaputraḥ  / abhāryaḥ, avidyamānabhāryaḥ  /
    subadhikāre 'stikṣīrādīnāṃ bahuvrīhir vaktavyaḥ  / astikṣīrā brāhmaṇī  / astyādayo
    nipātāḥ //
