source_id: KASIKA-5.1.134
locator:
  sutra: 5.1.134
witness_text:
  sutra: gotracaraṇāc chlāghā-atyākāra-tadaveteṣu
  commentary: gotravācinaḥ caranavācinaḥ ca prātipadikāt vuñ pratyayo bhavati, pratyekaṃ
    bhāvakarmaṇor arthayoḥ ślāghādiṣu viṣayabhūteṣu  / tatra ślāghā vikatthanam  /
    atyākāraḥ parādhikṣepaḥ  / tadavetaḥ tatprāptaḥ tajjño vā  / tad iti gotracaraṇayoḥ
    bhāvakarmaṇī nirdiśyete  / tatprāptaḥ tadavagatavān daveta ity ucyate  / ślāghāyāṃ
    tāvat - gārgikayā ślāghate  / kāṭhikayā ślāghate  / gārgyatvena kaṭhatvena ca
    vikatthate ity arthaḥ  / atyākāre - gārgikayā atyākurute  / kāṭhikayā atyākurute  /
    gārgyatvena kaṭhatvena ca parānadhikṣipati ity arthaḥ  / tadvetaḥ - gārgikāmavetaḥ  /
    kāṭhikāmavetaḥ  / gārgyatvaṃ kaṭhatvaṃ ca prāptaḥ ity arthaḥ  / tad vā avagatavān
    ity arthaḥ  / ślāghādiṣu iti kim ? gārgyatvam  / kaṭhatvam //
