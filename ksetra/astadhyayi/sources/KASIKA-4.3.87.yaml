source_id: KASIKA-4.3.87
locator:
  sutra: 4.3.87
witness_text:
  sutra: adhikṛtya kṛte granthe
  commentary: tad ity eva  / adhikṛtya+etad apekṣya dvitīyā  / adhikṛtya prastutya,
    āgūrya ity arthaḥ  / taditi dvitīyāsamarthād adhikṛtya kṛte ity etasminn arthe
    yathāvihitaṃ pratyayo bhavati yat tat kṛtaṃ granthaś cet sa bhavati  / subhadrāmadhitya
    kṛto granthaḥ saubhadraḥ  / gairimitraḥ  / yāyātaḥ  / granthe iti kim ? subhdrām
    adhikṛtya kṛtaḥ prāsādaḥ  / lubākhyāyikārthasya pratyayasya bahulam  / vāsavadattām
    adhikṛtya kṛtā ākhyāyikā vāsavadattā  / sumanottarā  / urvaśī  / na ca bhavati  /
    bhimarathī //
