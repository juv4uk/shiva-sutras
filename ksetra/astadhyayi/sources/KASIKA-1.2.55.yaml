locator:
  sutra: 1.2.55
witness_text:
  sutra: yoga-pramāṇe ca tad-abhāve 'darśanam syāt
  commentary: pañcāla-ādayaḥ sañjñā-śabdāḥ, na yoga-nimittāḥ ity uktam  / tac-cāvaśyam
    eva abhyupagantavyam  / yoga-pramāṇe hi tad-abhāve 'darśanaṃ syāt  / yadi pañcālādi-śabdo
    yogasya pramāṇaṃ yogasya vācakaḥ syāt tatas tadabhāve 'darśanam aprayogaḥ syāt  /
    dṛśyate ca samprati vanaiva kṣatriya-sambandhena janapadeṣu pañcālādi-śabdāḥ,
    tato 'vasīyate nāyaṃ yoga-nimittakaḥ  / kiṃ tarhi ? rūḍhirūpeṇaiva tatra pravṛttaḥ
    iti //
