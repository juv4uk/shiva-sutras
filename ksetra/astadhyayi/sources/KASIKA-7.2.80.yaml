source_id: KASIKA-7.2.80
locator:
  sutra: 7.2.80
witness_text:
  sutra: ato yeyaḥ
  commentary: akārāntāt aṅgād uttarasya yā ity etasya sārvadhātukasya iy ity ayam
    ādeśo bhavati, pacet, pacetām, paceyuḥ iti  / atra usyapadāntāt (*6,1.96) iti
    pararūpaṃ bādhitam  / ataḥ iti kim ? cinuyāt  / sunuyāt  / taparakaraṇam kim ?
    yāyāt  / sārvadhātuka ity eva, cikīrṣyāt  / nanu ca ato lopaḥ (*6,4.48) ity anena
    atra bhavitavyam, pacet ity atra api hi tarhi ato dīrgho yañi (*7,3.101) iti dīrghatvena
    bhavitavyam, tad anena avaśyaṃ vidhyantaraṃ bādhitavyam, sa yathaiva dīrghasya
    bādhakaḥ evam ato lopasya api bādhakaḥ syāt ? syād etad evaṃ yadi dīrghaḥ sārvadhātuke
    vidhīyate  / atha tu tiṅi vidhīyate, tadā yena nāprāptinyāyena dīrghasyaiva bādhakaḥ
    syān na punar ato lopasya  / yeyaḥ ity avibhaktiko nirdeśaḥ  / yaḥ iti vā ṣaṣṭhīnirdeśe
    yalopasya asiddhatvamanāśritya ādguṇaḥ kṛtaḥ, sautratvān nirdeśasya iti  / kecit
    atra ato yāsiyaḥ iti sūtraṃ pathanti  / teṣāṃ sakārāntaḥ sthānī, ṣaṣṭhīsamāsaś
    ca // [#821]
