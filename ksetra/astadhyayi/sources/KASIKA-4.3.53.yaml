source_id: KASIKA-4.3.53
locator:
  sutra: 4.3.53
witness_text:
  sutra: tatra bhavaḥ
  commentary: kālāt iti nivṛttam  / tatra iti saptamī-samarthāt ṅy-āp-prātipadikāt
    bhavaḥ ity etasminn arthe yathāvihitaṃ pratyayo bhavati  / sattā bhavatyartho
    gṛhyate, na janma, tatra jātaḥ (*4,3.25) iti gatārthatvāt  / srughne bhavaḥ sraughnaḥ  /
    māthuraḥ  / rāṣṭriyaḥ  / punas tatra-grahaṇaṃ tad asya iti nivṛtty-artham //
