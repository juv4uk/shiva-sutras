source_id: KASIKA-6.1.202
locator:
  sutra: 6.1.202
witness_text:
  sutra: jayaḥ karaṇam
  commentary: jayaśabdaḥ karaṇavācī ādyudātto bhavati  / jayanti tena iti jayaḥ  /
    puṃsi sañjñāyāṃ ghaḥ prāyeṇa (*3,3.118) iti ghaḥ, tasya pratyayasvaraḥ prāptaḥ  /
    jayo 'śvaḥ  / karaṇam iti kim ? jayo vartate brāhmaṇānām  / atra api erac (*3,3.56)
    ity ayam ajantaḥ //
