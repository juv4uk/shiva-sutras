locator:
  sutra: 5.4.54
witness_text:
  sutra: tadadhīnavacane
  commentary: abhūtatadbhāve iti nivṛttam, arthāntaropādānāt  / kṛbhvastiyoge sampadā
    ca iti vartate  / tadadhīnaṃ tadāyattaṃ, tatsvāmikam ity arthaḥ  / svāmisāmānyam,
    īśitavyasāmānyam ca tadadhīnaśabdena nirdiśyate  / svāmiviśeṣavācinaḥ prātipadikāt
    īśitavye 'bhidheye sātiḥ pratyayo bhavati kṛbhvastibhiḥ sampadā ca yoge  / rājādhīnaṃ
    karoti rājasātkaroti  / rājasādbhavati  / rājasatsyāt  / rājasātsampadyate  /
    brāhmaṇasatkaroti  / brāhmaṇasādbhavati  / brāhmaṇasātsyāt  / brāhmaṇasātsampadyate
    //
