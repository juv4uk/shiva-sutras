source_id: KASIKA-8.4.65
locator:
  sutra: 8.4.65
witness_text:
  sutra: jharo jhari savarṇe
  commentary: halaḥ iti vartate, anyatarasyām iti ca  / hala uttarasya jharo jhari
    savarṇe parato lopo bhavati anyatarasyām  / pratttam, avatttam ity atra trayastakārāḥ,
    kramajaścaturthaḥ  / tatra madhyamasya madhyamayor vā lopo bhavati  / maruttttaḥ
    ity atra catvārastakārāḥ kramajaḥ pañcamaḥ  / tatra madhyamasya madhyamayoḥ madhyamānāṃ
    vā lopo bhavati  / marucchabdasya hi upasaṅkhyānasāmarthyāt aca upasargāttaḥ (*7,4.47)
    iti tatvaṃ bhavati  / jharaḥ iti kim ? śārṅgam  / jhari iti kim ? priyapañcñā  /
    allopasya ca pūrvatra asiddhe na sthānivat iti sthānivadbhāvapratiṣedhāt cakārasya
    ñakāre lopaḥ syāt  / savarṇe iti kim ? tarptā taptum  / tarptavyam  / savarṇagrahaṇasāmarthyāt
    iha saṅkhyātānudeśo na bhavati, savarṇamātre lopo vijñāyate  / tena śiṇḍhi, piṇḍhi
    iti ḍhakāre ḍakārasya lopo bhavati //
