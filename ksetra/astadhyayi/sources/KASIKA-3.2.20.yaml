locator:
  sutra: 3.2.20
witness_text:
  sutra: kṛño hetu-tācchīlya-ānulomyeṣu
  commentary: karmaṇi upapade karoteḥ dhātoḥ ṭapratyayo bhavati hetau tācchīlye ānulomye
    ca gamyamāne  / hetuḥ aikāntikaṃ karaṇam  / tācchīlyaṃ tatsvabhāvatā  / ānulomyam
    anukūlatā  / hetau tāvat - śokakarī kanyā  / yaśaskarī vidyā  / kulakaraṃ dhanam  /
    tācchīlye - śrāddhakaraḥ  / arthakaraḥ  / ānulomye - praiṣakaraḥ  / vacanakaraḥ  /
    etesu iti kim ? kumbhakāraḥ  / nagarakāraḥ //
