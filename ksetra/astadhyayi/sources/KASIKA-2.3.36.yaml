source_id: KASIKA-2.3.36
locator:
  sutra: 2.3.36
witness_text:
  sutra: saptamy-adhikarane ca
  commentary: saptamī vibhaktir bhavaty adhikaraṇe kārake, cakārād dūra-antika-arthebhyaś
    ca  / kaṭe āste  / śakaṭe āste  / sthālyāṃ pacati  / dūra-antika-arthebhyaḥ khalv
    api - dūre grāmasya  / antike grāmasya  / abhyāśe grāmasya  / dūranti - kārthebhyaścatasro
    vibhaktayo bhavanti, dvitīyā-tṛtīyā-pañcamī-saptamyaḥ  / saptamī-vidhāne ktasyenviṣayasya
    karmaṇy-upasaṅkhyānam  / adhītī vyākaraṇe  / parigaṇitī yājñike  / āmnātī chandasi  /
    [#142] sādhvasādhuprayoge ca saptamī vaktavyā  / sādhurdevadatto mātari  / asādhuḥ
    pitari  / kārakārhāṇāṃ ca kārakatve saptamī vaktavyā  / ṛddheṣu bhuñjāneṣu daridrā
    āsate  / brāhmaṇeṣu taratsu vṛṣalā āsate  / akārakārhāṇāṃ cākarakatve saptamī
    vaktavyā  / daridreṣvāsīneṣu ṛddhā bhuñjate  / vṛṣaleṣvāsīneṣu brāhmaṇās taranti  /
    taddhiparyāse ca saptamī vaktavyā  / ṛddheṣvāsīneṣu daridrā bhuñjate  / brāhmaṇeṣv
    āsīneṣu vṛṣalās tarānti  / nimittāt karmasaṃyoge saptamī vaktavyā  / carmaṇi dvīpinaṃ
    hanti dantayor hanti kuñjaram  / keśeṣu camarīṃ hanti sīmni puṣkalako hataḥ //
