source_id: KASIKA-1.4.51
locator:
  sutra: 1.4.51
witness_text:
  sutra: akathitaṃ ca
  commentary: akathitaṃ ca yat kārakaṃ tat karmasañjñaṃ bhavati  / kena akathitam
    ? apādānādiviśeṣakathābhiḥ  / parigaṇanaṃ kartavyam -- duhiyācirudhipracchibhikṣiciñām
    upayoganimittam apūrvavidhau  / bruviśāsiguṇena ca yat sacate tad akīrtitam ācaritaṃ
    kavinā // upayujyate ity upayogaḥ payaḥprabhṛti  / tasya nimittaṃ gavādi  / tasya+upayujyamāna-payaḥprabhṛti-nimittasya
    gavādeḥ karmasañjñā vidhīyate  / pāṇinā kāṃsyapātryāṃ gāṃ dogdhi payaḥ  / pāṇyādikam
    apy upayoga-nimittaṃ, tasya 86 kasmān na bhavati ? na+etad asti  / [#86] vihitā
    hi tatra karaṇādisañjñā  / tad-artham āha - apūrvavidhau iti  / bruviśāsi-guṇena
    ca yat sacate  / bruviśāsyor guṇaḥ sādhanam, pradhānaṃ, pradhānaṃ karma, dharma-adikam,
    tena yat sambadhyate, tadakīrtitam ācaritaṃ kavinā, tadakathitam auktaṃ sūtrakāreṇa  /
    duhi - gāṃ dogdhi payaḥ  / yāci - pauravaṃ gāṃ yācate  / rudhi - gāmavaruṇaddhi
    vrajam  / pracchi - māṇāvakaṃ panthānaṃ pṛcchati  / bhikṣi - pauravam gāṃ bhikṣate  /
    ciñ - vṛkṣamavicinoti phalāni  / bruvi - māṇavakaṃ dharmaṃ brūte  / śāsi - māṇavakaṃ
    dharmam anuśāsti //
