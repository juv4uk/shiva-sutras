source_id: KASIKA-2.1.17
locator:
  sutra: 2.1.17
witness_text:
  sutra: tiṣṭhadgu-prabhṛtīni ca
  commentary: tiṣṭhadgv-ādayaḥ samudāyā eva nipātyante  / tiṣṭhadgu-prabhṛtīni śabdarūpāṇi
    avyayībhāvas-añjñāni bhavanti  / tiṣṭhadgu kālaviśeṣaḥ  / tiṣṭhanti gāvo yasmin
    kāle dohanāya sa tiṣṭhadgu kālaḥ  / khaleyavādīni prathamānatāni vibhaktyanatarenṇa
    na+eva sambadhyante 'nyapadārthe ca kāle vartante  / cakāro 'vadhāraṇa-arthaḥ  /
    aparaḥ samāso na bhavati, paramatiṣṭhadgu iti  / tiṣṭhadgu  / vahadgu  / āyatīgavam  /
    khalebusam  / khaleyavam  / lūnayavam  / lūyamānayavam  / pūtayavam  / pūyamānayavam  /
    saṃhṛtayavam  / saṃhriyamāṇāyavam  / saṃhṛtabusam  / saṃhriyamāṇābusam  / ete
    kālaśabdāḥ  / samabhūmi  / samapadāti  / suṣamam  / viṣamam  / niṣṣamam  / duṣṣamam  /
    aparasamam  / āyatīsamam ḥ prāhṇam  / praratham  / pramaṛgam  / pradakṣiṇam  /
    aparadakṣiṇam  / saṃprati  / asaṃprati  / pāpasamam  / puṇyasamam  / ic karmavyatihāre
    (*5,4.127) -- daṇḍādaṇḍi  / musalāmusali //
