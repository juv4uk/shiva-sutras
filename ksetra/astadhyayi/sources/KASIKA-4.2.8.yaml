source_id: KASIKA-4.2.8
locator:
  sutra: 4.2.8
witness_text:
  sutra: kaler ḍhak
  commentary: kali-śabdāt tṛtīyāsamarthād dṛṣṭaṃ sāma ity etasminn arthe ḍhak pratyayo
    bhavati  / aṇo 'pavādaḥ  / kalinā dṛṣṭaṃ sāma kāleyam  / sarvatra agnikalibhyāṃ
    ḍhag vaktavyaḥ  / agninā dṛṣṭam āgneyam  / evam agnau bhavam, agner āgatam, agneḥ
    svam iti sarvatra ḍhag eva bhavati  / āgneyam  / tathā kāleyam api pratipattavyam  /
    dṛṣṭe sāmani aṇ vā ḍid bhavati iti vaktavyam  / uśanasā dṛṣṭaṃ sāma auśanasam,
    auśanam  / jāte ca arthe yo 'nyena bādhitaḥ punar aṇ vidhīyate sa vā ḍid bhavati
    iti vaktavyam  / [#365] prāgdīvyato 'ṇ prāptaḥ kālaṭhañā bādhitaḥ saṃdhivelādy-ṛtu-nakṣatrebhyaḥ
    iti punar vidhiyate sa vā ḍid bhavati iti vaktavyam  / śatabhiṣaji jātaḥ  / śātabhiṣajaḥ,
    śātabhiṣaḥ  / tīyādīkak svārthe vā vaktavyaḥ  / dvaitīyīkam  / tārtīyīkam  / dvitīyakam  /
    tṛtīyakam  / na vidyāyaḥ  / dvitīyā, tṛtīyā vidyā  / gotrādaṅkavadiṣyate  / dṛṣṭaṃ
    sāma ity etasminn arthe  / aupagavena dṛṣṭaṃ sāma aupagavakam  / kāpaṭavakam  /
    gotracaraṇād vuñ bhavati  / dṛṣṭe sāmani jāte ca dviraṇ ḍidvā vidhīyate  / tīyādīkak
    na vidyāyā gotrādaṅkavadiṣyate //
