source_id: KASIKA-4.1.54
locator:
  sutra: 4.1.54
witness_text:
  sutra: svāṅgāc ca+upasarjanād asaṃyoga-upadhāt
  commentary: bahuvrīheḥ ktāntād antodāttāt iti sarvaṃ nivṛttam  / vā-grahaṇam anuvartate  /
    svāṅgaṃ yad upasarjanam asaṃyogopadhaṃ tad antāt prātipadikāt striyāṃ vā ṅīṣ pratyayo
    bhavati  / candramukhī, candramukhā  / atikrāntā keśān atikeśī, atikeśā mālā  /
    svāṅgāt iti kim ? bahuyavā  / upasarjanāt iti kim ? aśikhā  / asaṃyogopadhāt iti
    kim ? sugulphā  / supārśvā  / [#333] aṅgagātrakaṇṭhebhya iti vaktavyam  / mṛdvaṅgī,
    mṛdvaṅgā  / sugātrī, sugātrā  / snigdhakaṇṭhī, snigdhakaṇṭhā  / adravaṃ mūrtimat
    svāṅgaṃ prāṇisthamavikārajam  / atatsthaṃ tatra dṛṣṭaṃ cet tena cettattathāyutam
    //
