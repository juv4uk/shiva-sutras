witness_text:
  sutra: bhūte ca
  commentary: liṅ-nimitte lṛṅ kriya-atipattau iti sarvam anuvartate  / pūrvena bhaviṣyati
    vihitaḥ samprati bhūte vidhīyate  / bhūte ca kāle liṅ-nimitte kriya-atipattau
    satyāṃ lṛṅ pratyayo bhavati  / uta-apyoḥ samarthayor liṅ (*3,3.152) ity ārabhya
    liṅ-nimitteṣu vidhānam etat  / prāk tato vikalpaṃ vakṣyati  / dṛṣṭo mayā bhavatputro
    'nnārthī caṅkramyamāṇaḥ, aparaś ca dvijo brāhmaṇārthī, yadi sa tena dṛṣṭo 'bhaviṣyat,
    tadā abhikṣyata  / na tu bhuktavān, anyena pathā sa gataḥ // [#284]
