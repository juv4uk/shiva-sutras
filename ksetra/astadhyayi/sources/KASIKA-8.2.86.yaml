source_id: KASIKA-8.2.86
locator:
  sutra: 8.2.86
witness_text:
  sutra: guror anṛto 'nantyasya apy ekaikasya prācām
  commentary: pratyabhivāde 'śūdre (*8,2.83) ity evam ādinā yaḥ pluto vihitaḥ, tasya+eva
    ayaṃ sthāniviśeṣaḥ ucyate  / ṛkāravarjitasya guroḥ anantyasya, apiśabdād antyasya
    api ṭeḥ ekaikasya sambodhane vartamānasya pluto bhavati prācām ācāryāṇāṃ matena  /
    des3vadatta, devada3tta, devadatta3  / ya3jñadatta, yajñada3tta, yajñadatta3  /
    guroḥ iti kim ? vakārāt parasya mā bhūt  / anṛtaḥ iti kim ? kṛṣṇami3tra, kṛṣṇamitra3  /
    ekaikagrahaṇaṃ paryāyārtham  / prācām iti grahaṇaṃ vikalpārtham  / āyuṣmānedhi
    devadatta  / tad anena yad etad ucyate, sarva eva plutaḥ sāhasamanicchatā vibhāṣā
    kartavyaḥ iti tadupapannaṃ bhavati //
