source_id: KASIKA-6.1.26
locator:
  sutra: 6.1.26
witness_text:
  sutra: vibhāṣā 'bhy-ava-pūrvasya
  commentary: śyaḥ iti vartate  / abhi ava ity evaṃ pūrvasya śyāyater niṣthāyāṃ vibhāṣā
    samprasāraṇam bhavati  / abhiśīnam abhiśyānam  / avaśīnam, avaśyānam  / dravamūrtisparśavivakṣāyām
    api vikalpo bhavati  / abhiśīnaṃ ghṛtam, abhiśyānaṃ ghṛtam  / avaśīnaṃ medaḥ,
    avaśyānaṃ medaḥ  / abhiśīto vāyuḥ, abhiśyānaḥ  / avaśītamudakam , avaśyānamudakam  /
    seyamubhayatravibhāṣā draṣṭavyā  / pūrvagrahaṇasya ca prayojanam, sambhiśyānaṃ,
    samavaśyānam ity atra mā bhūt iti kecid vyacakṣate , nakilāyam abhyavapūrvaḥ samudāyaḥ
    iti yo 'tra abhyavapūrvaḥ samudāyastadāśrayo viklapaḥ kasmān na bhavati ? tasmāt
    atra bhavitavyam eva  / yadi tu na+iṣyate tato yatnānataramāstheyam asmād vihbāṣāvijñānāt  /
    vyavastheyam  / pūrvagrahaṇasya ca anyat prayojanaṃ vaktavyam //
