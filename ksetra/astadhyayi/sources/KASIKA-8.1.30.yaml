source_id: KASIKA-8.1.30
locator:
  sutra: 8.1.30
witness_text:
  sutra: nipātair yad-yadi-hanta-kuvin-nec-cec-caṇ-kaccid-yatrayutam
  commentary: na iti vartate  / yat yadi hanta kuvit net cet caṇ kaccit yatra ity
    etair nipātair yuktaṃ tiṅantaṃ nānudāttaṃ bhavati  / yat - yat karoti  / yat pacati  /
    yadi - yadi karoti  / yadi pacati  / hanta - hanta karoti  / net - nej jihmāyantyo
    narakaṃ patām  / cet - sa ced bhuṅkte  / sa ced adhīte  / caṇ - ṇidviśiṣṭo 'yaṃ
    cedarthe vartate  / ayaṃ ca mariṣyati  / ayaṃ cenmariṣyati ity arthaḥ  / samuccayādiṣu
    tu yaḥ caśabdaḥ, tena yogena vidhir ayaṃ na bhavati  / kaccit -kaccid bhuṅkte  /
    kaccid adhīte  / yatra - yatra bhuṅkte  / yatra adhīte  / nipātaiḥ iti kim ? yat
    kūjati śakaṭam  / gacchat kūjati śakaṭam ity arthaḥ  / iṇaḥ śatari rūpam etat  /
    yuktam iti kim ? yatra kva ca te mano dakṣaṃ dadhasa uttaram //
