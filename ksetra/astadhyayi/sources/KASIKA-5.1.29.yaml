source_id: KASIKA-5.1.29
locator:
  sutra: 5.1.29
witness_text:
  sutra: vibhāṣā kārṣāpaṇa-sahasrābhyām
  commentary: adhyardhapūrvād dvigoś ca kārṣāpaṇa-sahasrāntāt uttarasya ārhīya-pratyayasya
    vibhāṣā lug bhavati  / pūrveṇa luki nitya prāpte vikalpyate  / adhyardhakārṣāpaṇam,
    adhyardhakārśāpaṇikam  / dvikārṣāpaṇam, dvikārṣāpaṇikam  / aupasaṅkhyānikasya
    ṭiṭhano luk  / alukpakṣe ca pratirādeśo vikalpitaḥ  / adhyardhapratikam  / dvipratikam  /
    tripratikam  / sahasrāt - adhyardhasahasram, adhyardhasāhasram  / dvisahasram,
    dvisāhasram  / alukpakṣe saṅkhyāyāḥ saṃvatsara-saṅkhyasya ca ity uttarapadavṛddhiḥ  /
    sauvarṇaśatamānayor upasaṅkhyānam  / adhyardhasuvarṇam, adhyardhasauvarṇikam  /
    dvisuvarṇam, dvisauvarṇikam  / adhyardhaśatamānam, adhyardhaśātamānam  / dviśatamānam,
    dviśātamānam  / parimāṇāntasya ity uttarapadavṛddhiḥ //
