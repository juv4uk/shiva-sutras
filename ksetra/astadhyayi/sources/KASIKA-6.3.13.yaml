source_id: KASIKA-6.3.13
locator:
  sutra: 6.3.13
witness_text:
  sutra: bhandhe ca vibhāṣā
  commentary: bandhaḥ iti ghañanto gṛhyate  / tasminn uttarapade haladanttad uttarasyāḥ
    saptamyāḥ vibhāṣā alug bhavati  / hastebandhaḥ, hastabandhaḥ  / cakrebandhaḥ,
    cakrabandhaḥ  / ubhayatra vibhāṣeyam  / svaṅgād dhi bahuvrihau pūrveṇa nityam
    aluk prāpnoti, tatpuruṣe tu svaṅgād asvāṅgāc ca na-in-siddha-badhnātisu ca (*6,3.19)
    iti pratiṣedhaḥ prāpnoti  / haladantād ity eva, guptibandhaḥ //
