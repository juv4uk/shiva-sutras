source_id: KASIKA-4.4.125
locator:
  sutra: 4.4.125
witness_text:
  sutra: tadvān āsām upadhāno mantra iti iṣṭakāsu luk ca matoḥ
  commentary: tadvān iti nirdeśād eva samarthavibhaktiḥ  / matub-antāt prātipadikāt
    prathamāsamarthād āsām iti ṣaṣṭhyarthe yat pratyayo bhavati, yat prathamāsamartham
    upadhāno mantraś cet sa bhavati, yat tad āsām iti nirdiṣṭam iṣṭakāś cet tā bhavanti  /
    luk ca matoḥ iti prakṛtinirhṛāsaḥ  / itikaraṇas tataś ced vivakṣā  / tadvān ity
    avayavena samudāyo vyapadiśyate  / varcaḥ-śabdo yasmin mantre 'sti sa varcasvān  /
    upadhīyate yena sa upadhānaḥ  / cayanavacanaḥ ity arthaḥ  / varcasvānupadhānamantraḥ
    āsām iṣṭakānām iti vigṛhya yati vihite mator luki kṛte, varcasyā upadadhāti, tejasyā
    upadadhāti  / payasyāḥ  / retasyāḥ  / tadvān iti kim ? mantrasamudāyād eva mā
    bhūt  / upadhānaḥ iti kim ? varcasvān upasthānamantraḥ āsām ity atra mā bhūt  /
    mantraḥ iti kim ? aṅgulimānupadhāno hastaḥ āsām ity atra mā bhūt  / iṣṭakāsu iti
    kim ? aṅgulimānupadhāno hasta āsām ity atra mā bhūt  / iti-karaṇo niyamārthaḥ  /
    anekapadasambhave 'pi kenacid eva padena tadvān mantro gṛhyate, na sarveṇa //
