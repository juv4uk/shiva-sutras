source_id: KASIKA-5.2.96
locator:
  sutra: 5.2.96
witness_text:
  sutra: prāṇisthād āto laj anyatarasyām
  commentary: prāṇisthavācinaḥ śabdāt ākārāntāt lac pratyayo bhavaty anyatarasyāṃ
    matvarthe  / cūḍālaḥ, cūḍāvān  / karṇikālaḥ, karṇikāvān  / prāṇisthāt iti kim
    ? śikhāvān pradīpaḥ  / āt iti kim ? hastavān  / pādavān  / prāṇyaṅgād iti vaktavyam  /
    iha mā bhūt, cikīrṣā 'sya asti cikīrṣāvān, jihīrṣā 'sya asti jihīrṣāvān  / pratyayasvareṇa+eva
    antodāttatve siddhe, cakāraś cūḍālo 'sti ity atra svarito vānudatte padādau (*8,2.6)
    iti svaritabādhanārthaḥ //
