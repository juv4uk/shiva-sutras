source_id: KASIKA-6.4.132
locator:
  sutra: 6.4.132
witness_text:
  sutra: vāha ūṭḥ
  commentary: vāhaḥ ity evam antasya bhasya ūṭḥ ity etat samprasāraṇaṃ bhavati  /
    praṣṭhauhaḥ  / praṣṭhauhā  / praṣṭhauhe  / dityauhaḥ  / dityauhā  / dityauhe  /
    ety-edhaty-ūṭhsu (*6,1.89) iti vṛddhiḥ  / atha kimarthamūṭḥ kriyate, samprasāraṇe
    eva kṛte guṇe ca vṛddhir eci (*6,1.88) iti vṛddhau satyām siddhaṃ rūpaṃ bhavati
    praṣṭhauhaḥ iti, anakārānte copapade vaherṇvirna dṛśyate ? jhāpanārtham  / etaj
    jñāpayati, bhavatyeṣā paribhāṣā asiddhaṃ bahiraṅgam antaraṅge iti  / tasyāṃ hi
    satyāṃ bahiraṅgasya samprasāraṇasya asiddhatvāt antaraṅgo guṇo na syāt //
