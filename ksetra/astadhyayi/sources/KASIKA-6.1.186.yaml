source_id: KASIKA-6.1.186
locator:
  sutra: 6.1.186
witness_text:
  sutra: tāsy-anudāten-ṅid-ad-upadeśāl la-sārvadhātukam anudāttam ahnviṅoḥ
  commentary: tāser anudātteto ṅito 'kārāntopadeśāc ca śabdāt paraṃ lasārvadhātukam
    anudāttaṃ ca bhavati hnuṅ iṅ ity etābhyāṃ paraṃ varjayitvā  / tāsestāvat - kartā,
    kartārau, kartāraḥ  / pratyayasvarāpavādo 'yam  / anudāttetaḥ - āsa - āste  /
    vasa - vaste  / ṅit - ṣūṅ - sūte  / śīṅ - śete  / adupadeśāt - tudataḥ  / nudataḥ  /
    pacataḥ  / paṭhataḥ  / anubandhasya anaikāntikatvād akārāntopadeśa eva śap  /
    pacamānaḥ  / yajamānaḥ  / yady atra muk akāramātrasya syāt tadā lasārvadhātukam
    adupadeśād anantaram iti siddho nighātaḥ  / athākārāntasya aṅgasya, tathā api
    lasārvadhātukānudāttatve kartavye bahiraṅgatvāt asiddhaḥ iti siddham  / citsvaro
    'py anena lasārvadhātukānudāttatvena paratvād bādhyate  / tāsyādibhyaḥ iti kim
    ? cinutaḥ  / cinvanti  / ṅidayaṃ śnuḥ pūrvasya kāryaṃ prati na tu parasya  / upadeśagrahaṇaṃ
    kim ? iha ca yathā syāt, pacāvaḥ, pacāmaḥ iti  / iha ca mā bhūt, hato, hathaḥ
    iti  / lagrahaṇaṃ kim ? katīhapacamānāḥ  / sārvadhātukam iti kim ? śiśye, śiśyāte,
    śiśiyare  / ahnviṅoḥ iti kim ? hnute  / yadadhīte //
