source_id: KASIKA-6.4.72
locator:
  sutra: 6.4.72
witness_text:
  sutra: āḍ aj-ādīnām
  commentary: āḍāgamo bhavati ajādīnāṃ luṅ-laṅ-lṛṅ-kṣu parataḥ, udāttaś ca sa bhavati  /
    aikṣiṣṭa  / aihiṣṭa  / aubjīt  / aumbhīt  / laṅ - aikṣata  / aihata  / aubjat  /
    aumbhat  / lṛṅ - aikṣiṣyata  / aihiṣyata  / aubjiṣyat  / aumbhiṣyat  / iha aijyata,
    aupyata, auhyata iti laṅi kṛte lāvasthāyām aḍāgamād antaraṅgatvāl lādeśaḥ kriyate,
    tatra kṛte vikaraṇo nityatvād aḍāgamaṃ bādhate  / śabdāntaraprāpter aḍāgamasya
    anityatvam, kṛte hi vikaraṇāntasya aṅgasya tena bhavitavyam, akṛte tu dhātumātrasya
    śabdāntarasya prāpnuvan vidhiranityo bhavati  / nanu śabdāntarād iti vikaraṇo
    'nityaḥ ? vikaraṇe kṛte samprasāraṇam aḍāgamān nityatvād eva bhavati, samprasāraṇe
    ca kṛte 'jādyaṅgaṃ jātam iti āḍajādīnām ity āḍāgamaḥ //
