source_id: KASIKA-6.1.94
locator:
  sutra: 6.1.94
witness_text:
  sutra: eṅi pararūpam
  commentary: āt ity eva, upasargād dhātau iti ca  / avarṇāntāt upasargāt eṅādau dhātau
    pūrvaparayoḥ pararūpam ekādeśo bhavati  / vṛddhir eci (*6,1.88) ity asya apavādaḥ  /
    upelayati  / prelayati  / upoṣati  / proṣati  / kecit vā supyāpiśaleḥ (*6,1.92)
    ity anuvartyanti, tac ca vākyabhedena subdhātau vikalpaṃ karoti  / upeḍakīyati,
    upaiḍakīyati  / upodanīyati, upaudanīyati  / śakandhvādiṣu pararūpaṃ vācyam  /
    śaka andhuḥ śakandhuḥ  / kula aṭā kulaṭā  / sīmantaḥ keśeṣu  / sīmno 'ntaḥ sīmantaḥ  /
    anyatra sīmāntaḥ  / eve cāniyoge pararūpaṃ vaktavyam  / iha eva iheva  / adya
    eva adyeva  / aniyoge iti kim ? ihaia bhava, mā anyatra gāḥ  / otvoṣṭhayoḥ samāse
    vā pararūpaṃ vaktavyam  / sthūla otuḥ sthūlautuḥ, sthūlotuḥ  / bimbauṣṭhī, bimboṣṭhī  /
    samāse iti kim ? tiṣṭha devadattauṣṭhaṃ paśya  / emannādiṣu chandasi pararūpaṃ
    vaktavyam  / apāṃ tvā eman apāṃ tveman  / apāṃ tvā odman apāṃ tvodman // [#622]
