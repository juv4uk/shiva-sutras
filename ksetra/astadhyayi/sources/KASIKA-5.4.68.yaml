source_id: KASIKA-5.4.68
locator:
  sutra: 5.4.68
witness_text:
  sutra: samāsāntāḥ
  commentary: adhikāro 'yam  / āpādaparisamāpteḥ ye pratyayāḥ vihitās te samāsāntāvayavā
    ekadeśāḥ bhavanti, tadgrahaṇena gṛhyante iti veditavyam  / prayojanam - avyayībhāva-dvigu-dvandva-tatpuruṣa-bahuvrīhi-sañjñāḥ  /
    uparājam  / adhirājam  / na avyayībhāvāt ity eṣa vidhir bhavati, anaś ca (*5,4.108)
    iti ṭac  / dvipurī, tirpurī iti  / dvigoḥ (*4,1.21) iti ṅīp bhavati  / kaṭakavalayinī  /
    śaṅkhanūpuriṇī  / kośaniṣadinī  / sraktvacinī  / dvandvopatāpagarhyāt iti inir
    bhavati  / vidhuraḥ  / pradhuraḥ  / tatpuruṣe tulyārtha ity eṣa svaro bhavati  /
    uccair dhuraḥ  / nīcair dhuraḥ  / bahuvrīhau prakṛtyā pūrvapadam (*6,2.1) ity
    etad bhavati //
