locator:
  sutra: 2.1.43
witness_text:
  sutra: krtyair ṛṇe
  commentary: suptamī iti vartate  / kṛtya-pratyayāntaiḥ saha saptamyantaṃ samasyate,
    tatpuruṣaś ca samāso bhavati ṛṇe gamyamāne  / yatpratyayena+eva+iṣyate  / māse
    deyamṛṇam māsadeyam  / saṃvatsaradeyam  / vyahadeyam  / ṛṇagrahaṇaṃ niyogopalakṣaṇa-arthaṃ,
    tena+iha api samāso bhavati, pūrvāhṇe geyaṃ sāma pūrvāhṇageyam  / prātaradhyeyo
    'nuvākaḥ  / ṛṇe iti kim ? māse deyā bhikṣā //
