locator:
  sutra: 4.2.34
witness_text:
  sutra: kālebhyo bhavavat
  commentary: kālaviśeṣa-vācibhyaḥ śabdebhyo bhavavat pratyayā bhavanti sā 'sya devatā
    ity asmin viṣaye  / kālāṭ ṭhañ (*4,3.11) iti prakaraṇe bhave pratyayā vidhāsyante
    te sā 'sya devatā ity asmin arthe tathā+eva+iṣyante, tadartham idam ucyate  /
    vat-karaṇaṃ sarvasādṛśya-parigraha-artham  / māse bhavam māsikam  / ārdhamāsikam  /
    sāṃvatsarikam  / vāsantam  / prāvṛṣeṇyam  / tathā māso devatā 'sya māsikam  /
    ārdhamāsikam  / sāṃvatsarikam  / vāsantam  / prāvṛṣeṇyam //
