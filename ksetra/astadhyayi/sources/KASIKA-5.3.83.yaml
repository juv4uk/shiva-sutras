source_id: KASIKA-5.3.83
locator:
  sutra: 5.3.83
witness_text:
  sutra: ṭha-aj-ādāv ūrdhvaṃ dvitīyād acaḥ
  commentary: lopaḥ ity anuvartate  / asmin prakaraṇe yaḥ ṭhaḥ ajādiś ca pratyayaḥ,
    tasmin parataḥ prakṛter dvitīyād aca ūrdhvaṃ yac chabdarūpaṃ tasya lopo bhavati  /
    ūrdhva-grahaṇaṃ sarvalopārtham  / anukampito devadattaḥ devikaḥ, deviyaḥ, devilaḥ  /
    yajñikaḥ, yajñikyaḥ, yajñilaḥ  / upaḍaḥ, upaka, upiyaḥ, upilaḥ, upikaḥ  / ṭhagrahaṇamuko
    dvitīyātve kavidhānārtham  / ajādilakṣaṇe hi māthitikādivat prasaṅgaḥ  / vāyudattaḥ
    vāyukaḥ  / pitṛdattaḥ pitṛkaḥ  / caturthād aca ūrdhvasya lopo vaktavyaḥ  / anukampito
    bṛhaspatidattaḥ bṛhaspatikaḥ bṛhaspatiyaḥ bṛhaspatilaḥ  / [#549] anajādau vibhāṣā
    lopo vaktavyaḥ  / devadattakaḥ, devakaḥ  / yajñadattakaḥ, yajñakaḥ  / lopaḥ pūrvapadasya
    ca ṭhājādāvanajādau ca vaktavyaḥ  / dattikaḥ, dattilaḥ, dattiyaḥ, dattakaḥ  /
    vinā 'pi pratyayena pūrvottarapadayoḥ vibhāṣā lopo vaktavyaḥ  / devadatto dattaḥ,
    deva iti vā  / uvarṇāl la ilasya ca  / bhānudatto bhānulaḥ  / vasudatto vasulaḥ  /
    caturthādanajādau ca lopaḥ pūrvapadasya ca  / apratyaye tathā+eva+iṣṭa uvarṇāl
    la ilasya ca // dvitīyād aco lope sandhyakṣaradvitīyatve tadāder lopavacanam  /
    lahoḍaḥ lahikaḥ  / kahoḍaḥ kahikaḥ  / ekākṣarapūrvapadānām uttarapadalopo vaktavyaḥ  /
    vāgāśīḥ vācikaḥ  / srucikaḥ  / tvacikaḥ  / kathaṃ ṣaḍaṅgulidattaḥ ṣaḍikaḥ iti
    ? ṣaṣaṣṭhājādivacanāt siddham //
