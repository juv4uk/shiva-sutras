source_id: KASIKA-2.2.18
locator:
  sutra: 2.2.18
witness_text:
  sutra: ku-gati-pra-ādayaḥ
  commentary: nityam iti vartate  / ku-śabdo 'vyayaṃ gṛhyate gatyādi-sāhacaryāt, na
    dravyavacanaḥ  / ku-gati-prādayaḥ samarthena śabdāntareṇa saha nityaṃ samasyante,
    tatpuruṣaś ca samāso bhavati  / kuḥ pāpārthe - kupuruṣaḥ  / gati - urarīkṛtam  /
    yadūrīkaroti  / prādayaḥ - durnindāyām - duṣpuruṣaḥ  / svatī pūjāyām - supuruṣaḥ  /
    atipuruṣaḥ  / āṅ īṣādarthe - āpiṅgalaḥ  / prāyikaṃ ca+etad upādhivacanam  / anyatra
    api hi samāso dṛśyate  / koṣṇam  / kaduṣṇam  / kavoṣṇam  / duṣkṛtam  / atistutam  /
    ābaddham iti  / pradayo gatādyarthe prathamayā  / pragata ācāryaḥ prācāryaḥ  /
    prāntevāsī  / atyādayaḥ krāntādyarthe dvitīyayā  / atikrāntaḥ khaṭvām atikhaṭvaḥ  /
    atimālaḥ  / avādayaḥ kruṣṭādyarthe tṛtīyayā  / avakruṣṭaḥ kokilayā avakokilaḥ  /
    paryādayo glānādyarthe caturthyā  / pariglāno 'dhyayanāya paryadhyayanaḥ  / alaṃ
    kumāryai alaṃkumāriḥ  / nirādayaḥ krāntādyarthe pañcamyā  / niṣkrāntaḥ kauśāmbyāḥ
    niṣkauśāmbiḥ  / nirvārāṇasiḥ  / ivena saha samāso vibhaktya-lopaḥ pūrvapada-prakṛtisvaratvaṃ
    ca vaktavyam  / vāsasī iva  / vastre iva  / prādi-prasaṅge karmapravacanīyānāṃ
    pratiṣedho vaktavyaḥ  / vṛkṣaṃ prati vidyut  / sādhurdevacatto mātaraṃ prati //
    [#124]
