locator:
  sutra: 2.4.26
witness_text:
  sutra: paraval-liṅgaṃ dvandva-tatpuruṣayoḥ
  commentary: samāhāra-dvandve napuṃsaka-liṅgasya vihitatvād itaretarayoga-dvandvasya+idaṃ
    grahaṇam  / parasya yal liṅgaṃ tat bhavati dvandvasya tatpuruṣasya ca  / uttarapada-liṅgaṃ
    dvandva-tatpuruṣayor vidhīyate  / kukkuṭamayūryāvime  / mayūrīkukkuṭāvimau  /
    tatpuruṣasya - ardhaṃ pippalyāḥ ardhapippalī  / ardhakośātakī  / ardhanakharañjanī  /
    dviguprāptāpannālaṃpūrvagatisamāseṣu pratiṣedho vaktavyaḥ  / dviguḥ - pañcasu
    kapālesu saṃskṛtaḥ puroḍāśaḥ pañcakapālaḥ  / [#160] prāpto jīvikām prāptajīvikaḥ  /
    āpanno jīvikām āpannajīvikaḥ  / alaṃ jīvikāyai alaṃjīvikaḥ  / gatisamāsaḥ - niṣkrāntaḥ
    kauśāmbyāḥ niṣkauśāmbiḥ //
