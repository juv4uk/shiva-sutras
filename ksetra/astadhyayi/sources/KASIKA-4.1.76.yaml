witness_text:
  sutra: taddhitāḥ
  commentary: adhikāro 'yam  / āpañcamādhyāyaparisamāpteḥ yānita ūrdhvam anukramisyāmaḥ
    taddhitasañjñāste veditavyāḥ  / vakṣyati, yūnastiḥ (*4,1.77) - yuvatiḥ  / bahuvacanam
    anukta-taddhita-parigraha-artham  / pṛthivyā ñāñau (*4,1.85), agrādipaścāḍ ḍimac
    (*4,3.23) ity evam ādi labdhaṃ bhavati  / taddhita-pradeśāḥ - kṛt-taddhita-samāsāś
    ca (*1,2.46) ity evam ādayaḥ // [#338]
