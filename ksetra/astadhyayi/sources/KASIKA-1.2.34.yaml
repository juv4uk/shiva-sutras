locator:
  sutra: 1.2.34
witness_text:
  sutra: yajña-karmaṇy-ajapa-nyūṅkha-sāmasu
  commentary: traisvaryeṇa vede mantrāḥ paṭhyante  / teṣāṃ yajña-kriyāyām api tatha-iva
    prayoge prāpte eka-śrutir vidhīyate japa-nyūṅkha-sāmāni varjayitvā  / yajña-karmaṇi
    mantrāṇām aikaśrutyaṃ bhavati  / agnir mūrdhā divaḥ kakut patiḥ pṛthivyā ayam  /
    apāṃ retaṃsi jinvato3m  / yajña-karmaṇi iti kim ? sampāṭhe mā bhūt  / ajapeṣv-iti
    kim ? mamāgne varco vihaveṣv astu  / japo 'nukaraṇa-mantra upāṃśu-prayogaḥ  /
    anyūṅkhā-iti kim ? nyūṅkhā okārāḥ ṣoḍaśa  / teṣu kecid udāttāḥ kecid anudāttāḥ  /
    [#40] asāmasu iti kim ? viśvaṃ samatriṇaṃ daha  / sāmāni vākya-viśeṣa-sthagītaya
    ucyante  / tatra-ikaśrutir na bhavati //
