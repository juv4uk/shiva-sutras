source_id: KASIKA-4.1.73
locator:
  sutra: 4.1.73
witness_text:
  sutra: śārṅgarava-ādy-año ṅīn
  commentary: śārṅgaravādibhyo 'ñantebhyaś ca prātipadikebhyaḥ striyāṃ ṅīn pratyayo
    bhavati  / śārṅgaravī  / kāpaṭavī  / añanatebhyaḥ - baidī  / aurvī  / jātigrahaṇam
    atra anuvartate  / tena jāti-lakṣaṇo ṅīṣ anena bādhyate, na puṃyoga-lakṣaṇaḥ,
    baidasya strī baidī  / śārṅgarava  / kāpaṭava  / gaugulava  / brāhmaṇa  / gautama  /
    ete 'ṇantāḥ  / kāmaṇḍaleya  / brāhamakṛteya  / āniceya  / ānidheya  / āśokeya  /
    ete ḍhagantā  / vātsyāyana  / mauñjāyana  / etau phagantau jātiḥ  / kaikaseyo
    ḍhagantaḥ  / kāvyaśaivyau yañantau  / ehi, paryehi kṛdikārāntau  / āśmarathyo
    yañantaḥ  / audapānaḥ  / udapānaśabdaḥ śuṇḍikādyaṇantaḥ prayojayati  / arāla  /
    caṇḍāla  / vataṇḍa  / jātiḥ  / bhogavadgaurimatoḥ sañjñāyām ghādiṣu nityaṃ hrasvārtham  /
    nṛnarayor vṛddhiś ca  / atra yathāyogaṃ ṅībādiṣu prāpteṣu ṅīn vidhīyate //
