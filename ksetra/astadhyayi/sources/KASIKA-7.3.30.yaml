source_id: KASIKA-7.3.30
locator:
  sutra: 7.3.30
witness_text:
  sutra: nañaḥ śuci-īśvara-kṣetrajña-kuśala-nipuṇānām
  commentary: nañaḥ uttareṣāṃ śuci īśvara kṣetrajña kuśala nipuṇa ity eteṣām acāmāder
    acaḥ vṛddhir bhavati, pūrvapadasya vā bhavati taddhite ñiti, ṇiti, kiti ca parataḥ  /
    śuci - aśaucam, āśaucam  / īśvara - anaiśvaryam, ānaiśvaryam  / kṣetrajña - akṣaitrajñyam,
    ākṣaitrajñayam  / kuśala - akauśalam, ākauśalam  / nipuṇa - anaipuṇam, ānaipuṇam  /
    atra kecid āhuḥ iyaṃ pūrvapadasya vṛddhir aprāptaiva vibhāṣā vidhīyate  / na nañpūrvāt
    tatpuruṣāt ity uttaro bhāvapratyayaḥ pratiṣidhyate  / tatra śucyādibhyaḥ eva pratyaye
    kṛte paścānnañsamāse sati vṛddhiranaṅgasyāpi vacanāt bhavati iti  / tadapare na
    mṛṣyante  / bhāvavacanādanyopi hi taddhito vṛddhinimittamapatyādiṣu artheṣu nañsamāsād
    eva vidyate  / bahuvrīheś ca nañsamāsāt bhāvavacano 'pi asti, tatra aṅgādhikāropamardanaṃ
    na yujyate iti  / akṣetrajñānīśvarau tatpuruṣau eva brāhmaṇādiṣu paṭhyete, tataḥ
    tābhyāṃ bhāve ṣyañ bhavati //
