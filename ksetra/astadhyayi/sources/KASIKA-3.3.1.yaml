source_id: KASIKA-3.3.1
locator:
  sutra: 3.3.1
witness_text:
  sutra: uṇādayo bahulam
  commentary: vartamāna ity eva, sañjñāyām iti ca  / uṇādayaḥ pratyayāḥ vartamāne
    'rthe sañjñāyāṃ viṣaye bahulaṃ bhavanti  / yato vihitās tato 'nyatra api bhavanti  /
    kecid avihitā eva prayogata unnīyante  / kṛvāpājimisvadisādhyaśūbhya uṇ  / kāruḥ  /
    vāyuḥ  / pāyuḥ  / jāyuḥ  / māyuḥ  / svāduḥ  / sādhuḥ  / āśuḥ  / bāhulakaṃ prakṛtes
    tanudṛṣṭeḥ prāya-samuccayanād api teṣām  / kāryasaśeṣavidheś ca taduktaṃ naigamarūḍhibhavaṃ
    hi susādhu  //1// nāma ca dhātujamāha nirukte vyākaraṇe śakaṭasya ca tokam  /
    yan na padārtha-viśeṣa-samutthaṃ pratyayataḥ prakṛteś ca tad ūhyam  //2// sañjñāsu
    dhāturūpāṇi pratyayāś ca tataḥ pare  / kāryād vidyād anubandham etac chāstram
    uṇādiṣu  //3//
