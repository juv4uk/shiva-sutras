source_id: KASIKA-7.4.10
locator:
  sutra: 7.4.10
witness_text:
  sutra: ṛtaś ca saṃyogāder guṇaḥ
  commentary: ṛkārāntasya aṅgasya saṃyogādeḥ guṇo bhavati liṭi parataḥ  / svṛ - sasvaratuḥ  /
    sasvaruḥ  / dhvṛ - dadhvaratuḥ  / dadhvaruḥ  / smṛ - sasmaratuḥ  / sasmaruḥ  /
    ṛtaḥ iti kim ? cikṣiyatuḥ  / cikṣiyuḥ  / saṃyogādeḥ iti kim ? cakratuḥ  / cakṛuḥ  /
    pratiṣedhaviṣaye 'pi guṇo yathā syāt ity ayam ārambhaḥ  / vṛddhiviṣaye tu pūrvavipratiṣedhena
    vṛddhir eva+iṣyate  / sasvāra  / sasmāra  / liṭi ity eva, smṛtaḥ  / smṛtavān  /
    saṃyogāder guṇavidhāne saṃyogopadhagrahaṇaṃ kṛñarthaṃ kartavyam  / sañcaskaratuḥ,
    sañcaskaruḥ iti  / atra hi pūrvaṃ dhātuḥ sādhanena yujyate paścād upasargeṇa ity
    atra darśane liti kṛte, tadāśraye ca dvirvacane, paścād upasargayoge sati, aḍabhyāsavyavāye
    'pi (*6,1.136) iti sut kriyate  / evaṃ ca kṛtvā saṃskṛṣīṣṭa, upaskṛṣīṣṭa ity atra
    suṭo bahiraṅgalakṣaṇasya asiddhatvāt ṛtaś ca saṃyogādeḥ iti iḍāgamo na bhavati
    //
