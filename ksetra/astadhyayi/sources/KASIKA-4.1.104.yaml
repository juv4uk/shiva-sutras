source_id: KASIKA-4.1.104
locator:
  sutra: 4.1.104
witness_text:
  sutra: anṛṣy-ānantarye bida-ādibhyo 'ñ
  commentary: gotre ity eva  / bidādibhyo gotrāpatye añ pratyayo bhavati  / baidaḥ  /
    aurvaḥ  / ye punar atra anṛṣi-śabdāḥ putrādayastebhyo 'nantarāpatye eva bhavati  /
    pautraḥ  / dauhitraḥ  / anṛṣyānantaryasya ayam arthaḥ, anṛṣibhyo 'nantare bhavati
    iti  / yady ayam arthaḥ, ṛṣyapatye nairantarya-pratiṣedho na kṛtaḥ syāt ? tatra+idaṃ
    na sidhyati, indrabhūḥ saptamaḥ kāśyapānām  / anantarāpatyarūpeṇa+eva ṛṣyaṇābhidhānaṃ
    bhaviṣyati  / avaśyaṃ ca+etad evaṃ vijñeyam  / ṛṣyapatye nairantaryaviṣaye pratiṣedhe
    vijñāyamāne kauśiko viśvāmitraḥ iti duṣyati  / gotre ity eva, baidiḥ  / nanu ca
    ṛṣyaṇā bhavitavyam ? bāhvādiḥ ākṛtigaṇaḥ, tena iñ eva bhavati  / bida  / urva  /
    kaśyapa  / kuśika  / bharadvāja  / upamanyu  / kilālapa  / kidarbha  / viśvānara
    ṛṣṭiṣeṇa  / ṛtabhāga  / haryaśva  / priyaka  / āpastamba  / kūcavāra  / śaradvat  /
    śunaka  / dhenu  / gopavana  / śigru  / bindu  / bhājana  / aśvāvatāna  / śyāmāka  /
    śyamāka  / śyāparṇa  / harita  / kindāsa  / vahyaska  / arkalūṣa  / vadhyoṣa  /
    viṣṇuvṛddha  / pratibodha  / rathāntara  / rathītara  / gaviṣṭhira  / niṣāda  /
    maṭhara  / mṛda  / punarbhū  / putra  / duhitṛ  / nanāndṛ  / parastrī paraśuṃ
    ca // [#347]
