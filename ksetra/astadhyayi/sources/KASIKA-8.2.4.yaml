source_id: KASIKA-8.2.4
locator:
  sutra: 8.2.4
witness_text:
  sutra: udātta-svaritayor yaṇaḥ svarito 'nudāttasya
  commentary: udāttayaṇaḥ svaritayaṇaś ca parasya anudāttasya svaritaḥ ādeśo bhavati  /
    udāttayaṇaḥ - kumāryau  / kumāryaḥ  / udāttanivṛttisvareṇa ayam īkāraḥ udāttaḥ,
    tasya sthāne yaṇādeśaḥ sa udāttayaṇ, tasmāt parasya anudāttasya svaritaḥ ādeśo
    bhavati  / svaritayaṇaḥ - sakṛllvyāśā  / khalapvyāśā  / sakṛllūḥ, khalapūḥ iti
    kṛtsvareṇa antodātau, tayoḥ roḥ supi (*8,3.16) iti yaṇādeśaḥ, sa udāttayaṇ, tataḥ
    parasya saptamyekavacanasya svaritatvam, tasya yaṇādeśaḥ svaritayaṇ, tasmāt svaritayaṇaḥ
    parasya āśāśabdākārasya anudāttasya svarito bhavati  / nanu ca saptamyekavacanasya
    yadudāttayaṇaḥ iti svaritatvam, tadasiddhaṃ yaṇādeśe, tat kathamayaṃ svaritayaṇ
    bhavati ? āśrayāt siddhatvaṃ bhaviṣyati  / [#909] yadi evam, udāttād anudāttasya
    svaritaḥ (*8,4.66) ity etasya api āśrayāt siddhatvaṃ prāpnoti, tataś ca dadhyaśā
    ity atra api svaritaḥ syāt ? tasmād ayam eva yaṇsvaro yaṇādeśe siddho vaktavyaḥ  /
    kecit tu bruvate, udāttāt svaritayaṇo 'pi parasya anudāttasya svaritatvaṃ dṛśyate  /
    tathā ca taittirīyake śākhāntare paṭhyate - yāste viśvāḥ samidhaḥ santyagne iti  /
    agne ity ayam akāraḥ svaritaḥ paṭhyate  / tathā brāhmaṇe 'pi dadhyāśayati ity
    ākāraḥ svaritaḥ paṭhyate iti  / yathā tu vārtikaṃ bhāśyaṃ ca, tathā udāttāt svaritayaṇaḥ
    parasya anudāttasya anena svaritatvaṃ na bhavati iti sthitam  / tathā ca bhāṣye
    svaritayaṇgrahaṇam idaṃ pratyākhyāyate  / sakṛllvyāśā ity evam ādau udāttayaṇaḥ
    ity eva svaritasya siddhatvāt  / svaritayaṇvyavadhānam avyavadhānam eva, svarividhau
    vyañjanam avidyamānavat iti  / tat tu kriyate, pūrvasmād api vidhau sthānivadbhāvāt
    vyavadhānam asti, svaradīrghayalopeṣu ca lopājādeśasya sthānivadbhāvaḥ pratiṣidhyate
    iti  / udāttasvaritayoḥ iti kim ? vaidī āśā vaidyāśā  / śārṅgaravyāśā  / anudāttayaṇādeśo
    'yam  / anudāttasya iti kim ? kumāryatra  / kiśoryatra  / atra ity ayam ādyudātto
    litsvareṇa //
