locator:
  sutra: 5.2.81
witness_text:
  sutra: kāla-prayojanād roge
  commentary: arthalabhyā samarthavibhaktiḥ  / kālāt prayojanāc ca yathāyogaṃ samarthavibhaktiyuktāt
    roge 'bhidheye kan pratyayo bhavati  / kālo devas ādiḥ  / prayojanaṃ kāraṇaṃ rogasya
    phalaṃ vā  / dvitīye 'hni bhavo dvitīyako jvaraḥ  / caturthakaḥ  / prayojanāt
    - viṣapuṣpair janito viṣapuṣpako jvaraḥ  / kāśapuṣpakaḥ  / uṣṇaṃ kāryam asya uṣṇako
    jvaraḥ  / śītako jvaraḥ  / uttarasūtrāt iha sañjñāgrahaṇam apakṛṣyate  / tena
    ayaṃ prakāraniyamaḥ sarvo labhyate // [#517]
