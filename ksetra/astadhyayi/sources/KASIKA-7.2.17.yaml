source_id: KASIKA-7.2.17
locator:
  sutra: 7.2.17
witness_text:
  sutra: vibhāṣā bhāva-ādikarmaṇoḥ
  commentary: bhave ādikarmaṇi ca ādito dhātoḥ vibhāṣā niṣṭhāyām iḍāgamo na bhavati  /
    minnamanena, meditamanena praminnaḥ, prameditaḥ  / saunāgāḥ karmaṇi niṣṭhāyāṃ
    śakeriṭamicchanti vikalpena  / śakito ghaṭaḥ kartum, śakto ghaṭaḥ kartum  / bhāve
    na bhavaty eva, śaktamanena  / asyaterbhāve, asitamanena  / ādikarmaṇi ca na bhavaty
    eva, astaḥ kāṇḍaḥ //
