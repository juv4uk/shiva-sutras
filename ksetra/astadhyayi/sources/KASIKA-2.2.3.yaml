source_id: KASIKA-2.2.3
locator:
  sutra: 2.2.3
witness_text:
  sutra: dvitiya-tṛtīya-caturtha-turyāṇy anytarasyām
  commentary: ekadeśinā ekādhikarane iti vartate  / ṣasṭhīsamāsa-apavādo 'yaṃ yogaḥ  /
    anyatarasyāṃ grahaṇāt so 'pi ṣaṣṭhīsamāso bhavati  / pūraṇa-guṇa (*2,2.11) iti
    pratiṣedhaś ca ata eva anyatarasyāṃ grahaṇa-sāmarthyān na pravartate  / dvitīyaṃ
    bhikṣāyāḥ caturthabhikṣā, bhikṣācaturthaṃ vā  / turyaṃ bhikṣāyāḥ turyabhikṣā,
    bhikṣāturyaṃ vā  / turīya-śabdasya apīṣyate  / turīyaṃ bhikṣāyāḥ turīyabhikṣā,
    bhikṣāturīyaṃ vā  / ekadeśinā ity eva, dvitīyaṃ bhikṣāyā bhikṣukasya  / ekādhikaraṇe
    ity eva, dvitīyāṃ bhikṣāṇām // [#120]
