source_id: KASIKA-8.3.32
locator:
  sutra: 8.3.32
witness_text:
  sutra: ṅamo hrasvād aci ṅamuṇ nityam
  commentary: hrasvāt paraḥ yo ṅam tadantāt padāt uttarasya acaḥ ṅamuḍāgamo bhavati
    nityam  / ṅaṇanebhyo yathāsaṅkhyaṃ ṅaṇanā bhavanti  / ṅakārāntāt ṅuṭ - pratyaṅṅāste  /
    ṇakārāntāt ṇuṭ - vaṇṇāste  / vaṇṇavocat  / nakārāntāt nuṭ - kurvannāste  / kurvannavocat  /
    kṛṣannāste  / kṛṣannavocat  / ṅamaḥ iti kim ? tvamāsse  / hrasvāt iti kim ? prāṅāste  /
    bhavānāste  / aci iti kim ? pratyaṅ karoti  / iha paramadaṇḍinau, paramadaṇdinā
    iti uttarapadatve cāpadādividhau iti pratyayalakṣaṇapratiṣedhād uttarapadasya
    padatvaṃ na asti iti ṅamuṭ na bhavati  / atha vā, uñi ca pade (*8,3.21) ity ataḥ
    saptamyantaṃ pade ity anuvarvate  / tena ajādau pade ṅamuṭ bhavati //
