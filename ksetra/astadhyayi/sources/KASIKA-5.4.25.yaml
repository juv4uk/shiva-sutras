source_id: KASIKA-5.4.25
locator:
  sutra: 5.4.25
witness_text:
  sutra: pāda-arghābhyāṃ ca
  commentary: tādarthye ity eva  / pādārghaśabdābhyāṃ caturthīsamarthābhyāṃ tādarthye
    abhidheye yatpratyayo bhavati  / pādarthamudakaṃ pādyam  / arghyam  / anuktasamuccayārthaś
    cakāraḥ  / yathādarśanam anyatra api pratyayo bhavati  / eṣa vai chandasyaḥ prajāpatiḥ  /
    vasu, apas, oka, kavi, kṣema, udaka, varcas, niṣkevala, uktha, jana, pūrva, nava,
    sūra, marta, yaviṣṭha ity etebhyaḥ chandasi svārthe yatpratyayo bhavati  / agnirīśe
    vasavyasya  / apasyo vasānāḥ  / dvitīyābahuvacanasya aluk  / apo vasānāḥ ity arthaḥ  /
    sva okye  / kavyo 'si kavyavāhanaḥ  / kṣemyamadhyavasyati  / vāyur varcasyaḥ  /
    niṣkevalyaṃ śaṃsanti  / ukthyaṃ śaṃsati  / janyaṃ tābhiḥ  / pūrvyā viduḥ  / stomaṃ
    janayāmi navyam  / sūryaḥ  / matyaḥ  / yaviṣṭhyaḥ  / āmuṣyāyaṇāmuṣyaputriketyupasaṅkhyānam  /
    [#564] samaśabdādāvatupratyayo vaktavyaḥ  / samāvad vasati  / navasya nū ādeśastnaptanapkhāś
    ca pratyayāḥ  / nūtnam, nūtanam, navīnam  / naśca purāṇe prāt  / purāne vartamānāt
    praśabdān napratyayo bhavati  / cakārān naptanapkhāśca  / praṇam, pratnam, pratanam,
    prīṇam  / bhāgarūpanāmabhyo dheyaḥ pratyayo vaktavyaḥ  / bhāgadheyam  / rūpadheyam  /
    nāmadheyam  / mitrācchandasi  / mitradheye yatasva  / āgnīghrāsādharaṇādañ  /
    āgnīghram  / sādhāraṇam  / striyāṃ ṅīp - āgnīghrī sādhāraṇī  / vāprakaranāc ca
    vikalpante etāny upasaṃkhyānāni, tena yathāprāptam api bhavati, āgnīghrā śālā,
    sādhāraṇā bhūḥ iti  / ayavasamarudbhyāṃ chandasyañ vaktavyaḥ  / āyavase ramante  /
    mārutaṃ śardhāḥ //
