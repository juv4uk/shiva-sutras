source_id: KASIKA-3.2.71
locator:
  sutra: 3.2.71
witness_text:
  sutra: mantre śveta-vaha-ukthaśas-puroḍāśo ṇvin
  commentary: śvetavaha ukthaśas puroḍāś ity etebhyo ṇvin pratyayo bhavati mantre
    viṣaye  / dhātu-upapada-samudāyā nipātyante alākṣaṇikakārya-siddhy-artham  / pratyayas
    tu vidhīyata eva  / śveta-śabde kartṛ-vācini upapade vaher dhātoḥ karaṇi kārake
    ṇvin pratyayo bhavati  / śvetā enaṃ vahanti śvetavā indraḥ  / uktha-śabde karmaṇi
    karaṇe vā upapade śaṃsater dhātoḥ ṇvin pratyayo bhavati, nalopaś ca nipātyate  /
    ukthāni śaṃsati, ukthair vā śaṃsati, ukthaśā yajamānaḥ  / dāśṛ dāne ity etasya
    puraḥpūrvasya ḍatvam, karmaṇi ca pratyayaḥ  / puro dāśanta enaṃ proḍāḥ  / śvetavahādīnāṃ
    ḍaspadasya+iti vaktavyam  / śvetavobhyām  / śvetavobhiḥ  / padasya iti kim ? śvetavāhau  /
    śvetavāhaḥ //
