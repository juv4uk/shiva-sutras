witness_text:
  sutra: pūrva-apara-prathama-carama-jaghanya-samāna-madhya-madhyama-vīrāś ca
  commentary: pūrva apara prathama carama jaghanya samāna madhya madhyama vīra ity
    ete subantāḥ samānādhikaraṇena supā saha samasyante, tatpuruṣaś ca samāso bhavati  /
    pūrvapuruṣaḥ  / aparapuruṣaḥ  / prathamapuruṣaḥ  / caramapuruṣaḥ  / jaghanyapuruṣaḥ  /
    samānapuruṣaḥ  / madhyapuruṣaḥ  / madhyamapuruṣaḥ  / vīrapuruṣaḥ  / pūrvasya+eva
    ayaṃ prapañcaḥ //
