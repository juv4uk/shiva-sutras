source_id: KASIKA-3.1.12
locator:
  sutra: 3.1.12
witness_text:
  sutra: bhṛśādibhyo bhuvy-acver lopaś ca halaḥ
  commentary: bhṛśa ity evam ādibhyaḥ prātipadikebhyo 'cvyantebhyo bhuvi bhavaty arthe
    kyaṅ pratyayo bhavati, halantānāṃ ca lopaḥ  / acveḥ iti pratyekam abhisambadhyate  /
    kim arthaṃ puna ridam ucyate, yāvatā bhavati yoge cvir vidhīyate, tenoktārthatvāc
    cvyantebhyo na kyaṅ bhaviṣyati ? tatsādṛśyapratipattyarthaṃ tarhi cvi-pratiṣedhaḥ
    kriyate  / abhūta-tadbhāva-viṣayebhyo bhṛśādibhyaḥ kyaṅ pratyayaḥ  / abhṛśo bhṛśo
    bhavati bhṛśāyate  / śīghrāyate  / bhṛśa  / śīghra  / manda  / capala  / paṇḍita  /
    utsuka  / unmanas  / abhimanas  / sumanas  / durmanas  / rahas  / rehas  / śaśvat  /
    bṛhat  / vehat  / nṛṣat  / śudhi  / adhara  / ojas  / varcas  / bhṛśādiḥ  / acveḥ
    iti kim ? bhṛśībhavati //
