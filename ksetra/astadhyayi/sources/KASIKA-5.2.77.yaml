source_id: KASIKA-5.2.77
locator:
  sutra: 5.2.77
witness_text:
  sutra: tāvatithaṃ grahaṇam iti lug vā
  commentary: tāvatāṃ pūraṇaṃ tāvatithām  / gṛhyate 'nena iti grahaṇam  / prakṛtiviśeṣaṇaṃ
    ca+etat  / pūraṇapratyayāntāt prātipadikāt grahaṇopādhikāt svārthe kan pratyayo
    bhavati  / pūraṇasya pratyayasya vā luk  / dvitīyena rūpeṇa granthaṃ gṛhṇāti dvikaṃ
    grahaṇam, dvitīyakam  / trikam, tṛtīyakam  / catuṣkam, caturthakam  / tāvatithena
    gṛhṇāti iti kan vaktavyaḥ, pūraṇapratyayasya ca nityaṃ luk  / ṣaṣṭhena rūpeṇa
    granthaṃ gṛhṇāti ṣaṭko devadattaḥ  / pañcakaḥ  / catuṣkaḥ  / itikaraṇo vivakṣārthaḥ  /
    tena granthaviṣayam eva grahaṇam vijñāyate, na anyaviṣayam //
