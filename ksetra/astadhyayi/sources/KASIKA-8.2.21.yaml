source_id: KASIKA-8.2.21
locator:
  sutra: 8.2.21
witness_text:
  sutra: aci vibhāṣā
  commentary: ajādau pratyaye parato gro rephasya vibhāṣā lakārādeśo bhavati  / nigirati,
    nigilati  / nigaraṇam, nigalanam  / nigārakaḥ, nigālakaḥ  / iyaṃ tu vyavasthitavibhāṣā  /
    tena galaḥ iti prāṇyaṅge nityaṃ latvaṃ bhavati, garaḥ iti viṣe nityaṃ na bhavati  /
    nigāryate, [#915] nigālyate iti ṇilopasya sthānivadbhāvāt aci vibhāṣā iti latvavikalpaḥ  /
    pūrvatra asiddhe na sthānivat iti etad api sāpavādam eva, tasya doṣaḥ saṃyogādilopalatvaṇatveṣu
    iti  / antaraṅgatvād vā kṛte latvavikalpe ṇilopo bhaviṣyati  / girau, giraḥ ity
    atra dhātoḥ svarūpagrahaṇe tatpratyaye kāryavijñānam iti latvaṃ na bhavati  /
    giratir vā latvavidhāv adhikṛtaḥ, gṛṇāter etad rūpam //
