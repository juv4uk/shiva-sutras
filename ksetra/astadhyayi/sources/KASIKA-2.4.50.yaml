witness_text:
  sutra: vibhāṣā luṅḷṅoḥ
  commentary: lugi ḷṅi ca parata iṅo vibhāṣā gāṅ-ādeśo bhavati  / ādeśa-pakṣe gāṅ
    kuṭādibhyo 'ñṇin ḍit (*1,2.1) iti ṅittvam, ghu-mā-sthā-gā-pā-jahāti-sāṃ hali (*6,4.66)
    iti ītvam  / adhyagīṣṭa, adhyagīṣātām, adhyagīṣata  / na ca bhavati  / adhyaiṣṭa,
    adhyaiṣātām, adhyaiṣata  / ḷṅi khalv api - adhyagīṣyata, adhyagīṣyetām, adhyagīṣyanta  /
    na ca bhavati  / adhyaiṣyata, adhyaiṣyetām, adhyaiṣyanta //
