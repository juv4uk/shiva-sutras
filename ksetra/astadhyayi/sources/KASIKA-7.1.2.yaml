source_id: KASIKA-7.1.2
locator:
  sutra: 7.1.2
witness_text:
  sutra: āyan-ey-īn-īy-iyaḥ pha-ḍha-kha-cha-ghāṃ pratyayāadīnām
  commentary: āyan ey īn īy iy ity ete ādeśāḥ bhavanti yathāsaṅkhyaṃ pha ḍha kha cha
    gha ity eteṣā pratyayādīnām  / pha ity etasya āyanādeśo bhavati  / naḍa-ādibhyaḥ
    phak (*4,1.99) - nāḍāyanaḥ  / cārāyaṇaḥ  / ḍhasya eyādeśo bhavati  / strībhyo
    ḍhak (*4,1.130) - sauparṇeyaḥ  / vainateyaḥ  / khasya īnādeśo bhavati kulāt khaḥ
    (*4,1.139) - āḍhyakulīnaḥ  / śrotriyakulīnaḥ  / chasya īyādeśo bhavati  / vṛddhāc
    chaḥ (*4,2.114) - gārgīyaḥ  / vātsīyaḥ  / gha ity etasya iyādeśo bhavati  / kṣatrād
    dhaḥ (*4,1.138) - kṣatriyaḥ  / pratyayagrahaṇaṃ kim ? phakkati  / ḍhaukate  /
    khanati  / chinatti  / ghūrṇate  / ādigrahaṇam kim ? ūrudaghnam  / jānudaghnam  /
    ete āyannādayaḥ pratyayopadeśakāla eva bhavanti  / kṛteṣv eteṣu pratyayādyudāttatvaṃ
    bhavati, tathā ca ghacchau ca (*4,4.117) iti ghacaścitkaranamarthavad bhavati  /
    śaṅkhaḥ, ṣaṇḍhaḥ ity evam ādīnāṃ hi uṇādayo bahulam iti bahulavacanād ādeśā na
    bhavanti  / ṛter īyaṅ (*3,1.29) iti vāvacanaṃ jñāpakaṃ dhātupratyayānāmādeśābhāvasya  /
    ejeḥ khaś (*3,2.28), padarujaviśaspṛśo ghañ (*3,3.16) ity evam ādiṣu tu itsañjñayā
    bhavitavyam  / taddhiteṣu hi khakāraghakārayor ādeśavacanam avakāśavaditi itsañjñāṃ
    bādhituṃ na+utsahate  / āyannīnoḥ nakārasya itsañjñāyāṃ prāptāyāṃ pratividhātavyam,
    nitkāryaṃ hi sambhavati // [#774]
