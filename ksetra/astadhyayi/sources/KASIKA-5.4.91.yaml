source_id: KASIKA-5.4.91
locator:
  sutra: 5.4.91
witness_text:
  sutra: rāja-ahaḥ-sakhibhyaṣ ṭac
  commentary: rājan ahan sakhi ity evam antāt prātipadikāt ṭac pratyayo bhavati  /
    mahārājaḥ  / madrarājaḥ  / paramāhaḥ  / uttamāhaḥ  / rājñaḥ sakhā rājasakhaḥ  /
    brāhmaṇasakhaḥ  / iha kasmān na bhavati, madrāṇām rājñī madrarājñī ? liṅgaviśiṣṭaparibhāṣayā
    prāpnoti ? laghvakṣarasya pūrvanipāte prāpte rājaśabdasya savarṇadīrghārthaṃ prathamaṃ
    prayogaṃ kurvann etad jñāpayati yasya akāreṇa savarṇadīrghatvaṃ sambhavati tasya+idaṃ
    grahaṇam iti //
