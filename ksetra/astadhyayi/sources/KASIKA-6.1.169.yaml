source_id: KASIKA-6.1.169
locator:
  sutra: 6.1.169
witness_text:
  sutra: anta-udāttād uttarapadādanyatarasyām anityasamāse
  commentary: ekācaḥ iti vartate, tṛtīyādir vibhaktir iti ca  / nityaśabdaḥ svaryate,
    tena nityādhikāravihitaḥ samāsaḥ paryudasyate  / nityasamāsād anyatrānityasamāse
    yad uttarapadam antodāttam ekācca tasmāt parā tṛtīyādir vibhaktir anyatarasyām
    udāttā bhavati  / paramavāca, paramavācā  / paramavāce, paramavāce  / paramatvacā,
    parmatvacā  / paramatvace, paramatvace  / yadā vibhaktir udāttā na bhavati, tadā
    samāsāntodāttatvam eva  / antodāttāt iti kim ? avācā  / suvācā  / sutvacā  / tatpuruṣo
    'yam  / tatra tatpuruṣe tulyārtha-tṛtīyā-saptamy-upamāna. avyayaya (*6,-2.2.)
    iti pūrvapadaprakṛtisvaraḥ  / uttarapadagrahaṇam ekāctvena+uttarapadaṃ viśeṣayitum,
    anyathā hi samāsaviśeṣaṇam etat syāt  / tatra śunaḥ ūrka, śvorjā ity atra+eva
    ayaṃ vidhiḥ syāt  / anityasamāse iti kim  / agnicitā  / somasutā upapadam atiṅ
    (*2,2.19) ity ayaṃ nityādhikāre samāso vidhīyate  / tatra gatikāraka-upapadāt
    kṛt (*6,2.139) ity uttarapadaprakṛtisvarena citśabdaḥ udāttaḥ  / yas tu vigrahābhāvena
    nityasamāsas tatra bhavaty eva vikalpaḥ, avācā brāhmaṇena, subācā brāhmaṇena iti  /
    bahuvrīhau nañsubhyām (*6,2.172) ity uttarapadānta-udāttatvaṃ bhavati // [#640]
