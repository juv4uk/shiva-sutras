source_id: KASIKA-5.1.4
locator:
  sutra: 5.1.4
witness_text:
  sutra: vibhāṣā havir-apūpa-ādibhyaḥ
  commentary: havir-viśeṣa-vācibhyo 'pūpa-ādibhyaś ca prātipadikebhyaḥ prakkrītīyeṣv
    artheṣu vibhāṣā yat pratyayo bhavati  / āmikṣyaṃ dadhi, āmikṣīyaṃ dadhi  / puroḍāśyāstaṇḍulāḥ,
    pūroḍāśīyāḥ  / haviśśabdāt tu gavādiṣu paṭhān nityam eva bhavati  / apūpādibhyaḥ
    - apūpyam, apūpīyam  / taṇḍulyam, taṇḍulīyam  / apūpa  / taṇḍula  / abhyūṣa  /
    abhyoṣa  / pṛthuka  / abhyeṣa  / argala  / musala  / sūpa  / kaṭaka  / karṇaveṣṭaka  /
    kiṇva  / annavikārebhyaḥ  / pūpa  / sthūṇā  / pīpa  / aśva  / patra  / apūpādiḥ
    //
