witness_text:
  sutra: mātur ut saṅkhyā-saṃ-bhadra-pūrvāyāḥ
  commentary: matṛ-śabdāt saṅkhyā-pūrvāt saṃ-pūrvāt bhadra-pūrvāc ca apatye aṇ pratyayo
    bhavati, ukāraś ca antādeśaḥ  / dvayor mātror apatyaṃ dvaimāturaḥ  / ṣāṇmāturaḥ  /
    sāṃmāturaḥ  / bhādramāturaḥ  / ukāra-adeśa-arthaṃ vacanaṃ, pratyayaḥ punar utsargeṇa+eva
    siddhaḥ  / strīliṅga-nirdeśo 'rtha-apekṣaḥ, tena dhānyamātur grahaṇaṃ na bhavati  /
    saṅkhyā-saṃ-bhadra-pūrvāyāḥ iti kim ? saumātraḥ //
