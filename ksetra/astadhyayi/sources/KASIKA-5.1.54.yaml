source_id: KASIKA-5.1.54
locator:
  sutra: 5.1.54
witness_text:
  sutra: dvigoḥ ṣṭhaṃś ca
  commentary: āḍhakācitapātrāt ity eva  / āḍhaka-ācita-pātra-antād dvigoḥ saṃbhavatyādiṣv
    artheṣu ṣṭhan pratyayo bhavati, cakārāt khaḥ, anyatarasyām  / vidhānasāmarthyād
    eva anayor luk na bhavati  / ṭhañas tu pakṣe 'nujñātasya adhyardha-pūrva-dvigoḥ
    iti lug bhavaty eva  / nakāraḥ svarārthaḥ  / ṣakāro ṅīṣ-arthaḥ  / dvyāḍhakikī,
    dvyāḍhakīnā, dvyāḍhakī  / dvyācitikī, dvyācitīnā, dvyācitā  / aparimāṇa-vibsta-āciteti
    ṅīpaḥ pratiṣedhaḥ  / dvipātrikī, dvipātrīṇā, dvipātrī //
