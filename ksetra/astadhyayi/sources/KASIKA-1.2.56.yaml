source_id: KASIKA-1.2.56
locator:
  sutra: 1.2.56
witness_text:
  sutra: pradhāna-pratyaya-arthavacanam arthasya anya-pramāṇātvāt
  commentary: aśiṣyam iti vartate  / pradhānaṃ samāse kiṃcit padaṃ, pratyayastavyadādiḥ  /
    tābhyām artha-vacanam artha-abhidhānam anena prakāreṇa bhavati iti pūrva-ācāryaiḥ
    paribhāṣitam  / pradhāna-upasarjane ca pradhāna-arthaṃ saha brūtaḥ, prakrti-pratyayau
    sahārthaṃ brūtaḥ iti  / tat pāṇinir ācaryaḥ pratyācaṣṭe, aśiṣyam etat arthasya
    anyapramāṇatvāt iti  / anyaḥ iti śāstra-apekṣayā loko vyapadiśyate  / śabdair
    artha-abhidhānam svābhāvikaṃ na pāribhaṣākam aśakyatvāt  / lokata eva artha-avagateḥ  /
    yair api vyākaraṇaṃ na śrutaṃ te 'pi rāja-puruṣam ānaya ity ukte rājaviśiṣṭaṃ
    puruṣam ānayanti na rājanam na api puruṣa-mātram  / aupagavam ānaya ity ukte upaguviśiṣṭam
    apatyam ānayanti, na+upaguṃ na apy apatya-mātraṃ, na+ubhau  / yaś ca lokato 'rthaḥ
    siddhaḥ kiṃ tatra yatnena //
