source_id: KASIKA-8.2.83
locator:
  sutra: 8.2.83
witness_text:
  sutra: vakṣyati - pratyabhivāde 'śūdre
  commentary: abhivādaye devadatto 'ham, bho āyuṣmānedhi devadatta3  / padādhikāro
    'nuvartate eva  / vākyagrahaṇam anantyasya padasya plutanivṛttyartham  / ṭigrahaṇaṃ
    vyañjanāntyasya api ṭeracaḥ pluto yathā syāt, agnici3t iti // pratyabhivāde 'śūdre
    (*8,2.83)  / pratyabhivādo nāma yadabhivādyamāno gururāśiṣaṃ prayuṅkte, tatra
    aśūdraviṣaye yad vākyaṃ vartate tasya ṭeḥ pluta udātto bhavati  / abhivādaye devadatto
    'ham, bho āyuṣmānedhi devadatta3  / aśūdre iti kim ? abhivādaye tuṣajako 'han,
    bho ayuṣmān edhi tuṣajaka  / striyām api pratiṣedho vaktavyaḥ  / abhivādaye gārgyaham,
    bho āyuṣmatī bhava gārgi  / asūyake 'pi kecit pratiṣedham icchanti, abhivādaye
    sthālyahaṃ bhoḥ, āyuṣmān edhi sthālin  / yāvac ca tasya asūyakatvaṃ na jñāyate
    tāvad eva pratyabhivādavākyam  / tasmiṃstvasūyakatvena nirjñāte pratyabhivādaḥ
    eva na asti, kutaḥ plutaḥ  / tathā hy uktam - asūyakastvaṃ jālma, na tvaṃ pratyabhivādanam
    arhasi, bhidyasva vṛṣala sthālin iti  / abhivādanavākye yat saṅkīrtitaṃ nāma gotraṃ
    vā, tad yatra pratyabhivādavākyānte prayujyate tatra plutiḥ iṣyate  / iha na bhavati,
    devadatta kuśalyasi, devadatta āyuṣmān edhi iti  / bho rājanyaviśāḥ veti vaktavyam  /
    bho abhivādaye devadatto 'ham, āyuṣmānedhi devadatta bhoḥ3, āyuṣmanedhi devadatta
    bhoḥ  / rājanya - abhivādaye indravarmā ahaṃ bhoḥ, āyuṣmānedhi indravarma3n, āyuṣmānedhi
    indravarman  / viś - abhivādaye indrapālito 'ham bhoḥ, āyusmānedhi indrapālita3,
    āyuṣmānedhi indrapālita //
