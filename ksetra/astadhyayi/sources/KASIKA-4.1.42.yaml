source_id: KASIKA-4.1.42
locator:
  sutra: 4.1.42
witness_text:
  sutra: jānapada-kuṇḍa-goṇa-sthala-bhāja-nāga-kāla-nīla-kuśa-kāmuka-kabarād vṛtty-amatra-āvapana-akṛtrimā-śrāṇā-sthaulya-varṇa-anācchādana-ayovikāra-maithunecchā-keśaveśeṣu
  commentary: jānapada-ādibhya ekādaśabhyaḥ prātipadikebhya ekādaśasu vṛttyādiṣv artheṣu
    yathāsaṅkhyaṃ ṅīṣ pratyayo bhavati  / jānapadī bhavati, [#329] vṛttiś cet  / jānapadī
    anyā  / svare viśesaḥ  / utsādipāṭhādañi kṛte ṅīpādy-udāttatvaṃ bhavati  / kuṇḍī
    bhavati, amatraṃ cet  / kuṇḍā 'nyā  / goṇī bhavati, āvapanaṃ cet  / goṇā anyā  /
    sthalī bhavati, akṛtrimā cet  / sthalā anyā  / bhājī bhavati, śrāṇā cet  / pakvā
    ityarthaḥ  / bhājā anyā  / nāgī bhavati, sthaulyaṃ cet  / nāgā anyā  / nāgaśabdo
    guṇavacanaḥ sthaulye ṅīṣamutpādayati, anyatra guṇa eva ṭāpam  / jātivacanāttu
    jātilakṣaṇo ṅīṣ eva bhavati  / nāgī  / kālī bhavati, varṇaś cet  / kālā anyā  /
    nīlī bhavati, anācchādanaṃ cet  / nīlā anyā  / na ca sarvasminnanācchādana iṣyate  /
    kiṃ tarhi ? nīlādoṣadhau prāṇini ca  / nīlī oṣadhiḥ  / nīlī gauḥ  / nīlī vaḍavā  /
    sañjñāyāṃ vā  / nīlī, nīlā  / kuśī bhavati, ayovikāraś cet  / kuśā anyā  / kāmukī
    bhavati maithunecchā cet  / kāmukā anyā  / maithunecchāvatī bhaṇyate, necchāmātram  /
    kabarī bhavati, keśaveśaś cet  / kabarā anyā //
