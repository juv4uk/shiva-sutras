source_id: KASIKA-4.1.48
locator:
  sutra: 4.1.48
witness_text:
  sutra: puṃyogād ākhyāyām
  commentary: puṃsā yogaḥ puṃyogaḥ  / puṃyogād dhetor yat prātipadikaṃ striyāṃ vartate
    puṃsa ākhyābhūtaṃ tasmād ṅīṣ pratyayo bhavati  / gaṇakasya strī gaṇakī  / mahāmātrī  /
    praṣṭhī  / pracarī  / puṃsi śabdapravṛtti-nimittasya sambhavāt puṃśabdā ete, tadyogāt
    striyāṃ vartante  / puṃyogāt iti kim ? devadattā  / yajñadattā  / ākhyā-grahaṇāt
    kim ? parisṛṣṭā  / prajātā  / puṃyogād ete śabdāḥ striyāṃ vartante, na tu pumāṃsamācakṣate  /
    gopālikādīnāṃ pratiṣedhaḥ  / gopālakasya strī gopālikā  / sūryād devatāyāṃ cāb
    vaktavyaḥ  / sūryasya strī devatā sūryā  / devatāyām iti kim ? surī //
