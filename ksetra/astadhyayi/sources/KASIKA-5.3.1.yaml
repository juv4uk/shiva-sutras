source_id: KASIKA-5.3.1
locator:
  sutra: 5.3.1
witness_text:
  sutra: prāg-diśo vibhaktiḥ
  commentary: dik-śabdebhyaḥ saptamī-pañcamī-prathamābhyo dig-deśa-kāleṣv astātiḥ
    (*5,3.27) iti vakṣyati  / prāg etasmād dikṣaṃ śabdanād yān ita ūrdhvam anukramiṣyāmo
    vibhaktisañjñās te veditavyāḥ  / vakṣyati - pañcamyās tasil (*5,3.7)  / tataḥ  /
    yataḥ  / kutaḥ  / tasilādīnāṃ vibhaktitve prayojanaṃ tyadādividhayaḥ idamo vibhaktisvaraś
    ca  / iha  / ūḍidam iti vibhaktyudāttatvaṃ siddhaṃ bhavati  / ataḥ paraṃ svārthikāḥ
    pratyayāḥ, teṣu samarthādhikāraḥ prathamagrahaṇaṃ ca pratiyogyapekṣatvān na+upayujyate
    iti nivṛttam  / vāvacanaṃ tu vartata eva  / tena vikalpena tasilādayo bhavanti,
    kutaḥ , kasmāt, kutra, kasmin iti //
