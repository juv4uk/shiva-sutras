source_id: KASIKA-6.2.140
locator:
  sutra: 6.2.140
witness_text:
  sutra: ubhe vanaspatyādiṣu yugapat
  commentary: prakṛtyā iti vartate  / vanaspatyādiṣu samāseṣu ubhe pūrvottarapade
    yugapat prakṛtisvare bhavataḥ  / vanaspatiḥ  / vanapatiśabdāv ādyudāttau, pāraskaraprabhṛtitvāt
    suṭ  / bṛhaspatiḥ  / bṛhatāṃ patiḥ  / tadbṛhatoḥ karapatyoś coradevatayoḥ suṭ
    talopaś ca iti suṭ takāralopaś ca  / bṛhad ity etad antodāttaṃ nipātayanti  /
    tasya kecid ādyudāttatvaṃ varṇayanti  / śacīpatiḥ  / śacīśabdaḥ kṛdikārādaktinaḥ
    iti ṅīṣantatvād antodāttaḥ  / kecit tu śārṅgaravādisu paṭhanti teṣām ādyudāttaḥ  /
    tanūnapāt  / tanoterauṇādikaḥ ūpratyayaḥ, tena tanūśabdo 'ntodāttaḥ  / na pāti
    na pālayati vā napāt kvibantaḥ  / nabhrāṇnapād (*6,3.75) ity ādinā ādyudātto nipātitaḥ  /
    tanvā napāt tanūnapāt  / narāśaṃsaḥ  / narā asmin āsīnāḥ śaṃsanti, narā evaṃ śaṃsanti
    iti vā narāśaṃsaḥ  / nṝ naye  / abanto naraśabdaḥ ādyudāttaḥ  / śaṃsaśabdo 'pi
    ghañantaḥ  / anyeṣām api dṛśyate (*6,3.167) iti dīrghatvam  / śunaḥśepaḥ  / śuna
    itva śepaḥ asya iti bahuvrīhiḥ  / tatra śepapucchalāṅgūleṣu śunaḥ sañjñāyām (*6,3.21)
    iti ṣaṣṭhyā aluk  / ubhāv ādyudāttau  / śaṇḍāmarkau  / śaṇḍamarkaśabdau ghañantatvād
    ādyudāttau  / tayor dvandve anyeṣām api dṛśyate (*6,3.167) iti dīrghatvam  / [#686]
    tṛṣṇāvarūtrī  / tṛṣṇāśabda ādyudāttaḥ  / varūtrīśabdo grasitādisūtre nipātito
    'ntodāttaḥ  / tatra dvandve dīrghatvaṃ pūrvavat  / bambāviśvavayasau  / bambaśabdo
    'ntodāttaḥ  / viśvavayaḥśabdo 'pi bahuvrīhau viśvaṃ sañjñāyām (*6,2.106) iti viśvaśado
    'ntodāttaḥ  / tayor dvandve dīrghatvaṃ pūrvavat  / marmṛtyuḥ  / mar iti mṛño vicpratyayaḥ  /
    mṛtyuśabdo 'ntodāttaḥ  / dvandvānāmadevatādvandvārtho 'nudāttādyuttarapadārthaś
    ca vanaspatyādiṣu pāṭhaḥ //
