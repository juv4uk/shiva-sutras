source_id: KASIKA-2.1.52
locator:
  sutra: 2.1.52
witness_text:
  sutra: saṅkhyā-pūrvo dviguḥ
  commentary: taddhita-artha-uttarapada-samāhāre ca (*2,1.51) ity atra yaḥ saṅkhyā-pūrvaḥ
    samāsaḥ sa dvigu-sañjño bhavati  / taddhita-arthe tāvat - pañcasu kapāleśu saṃskṛtaḥ
    pañcakapālaḥ  / daśakapālaḥ  / saṃskṛtaṃ bhakṣāḥ (*4,2.16) iti iha aṇ, tasya dvigor
    lug-anapatye (*4,1.88) iti luk  / uttarapade - pañcanāvapriyaḥ  / nāvo dvigoḥ
    (*5,4.99) iti samāsānto bhavati  / samāhāre - pañcapūlī  / dvigoḥ (*4,1.21) iti
    ṅīb bhavati  / dvigupradeśāḥ - dvigoḥ (*4,1.21) ity evam ādayaḥ //
