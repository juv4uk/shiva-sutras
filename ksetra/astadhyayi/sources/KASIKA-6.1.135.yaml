source_id: KASIKA-6.1.135
locator:
  sutra: 6.1.135
witness_text:
  sutra: suṭ kāt pūrvaḥ
  commentary: adhikāro 'yam pāraskaraprabhṛtīnāṃ ca sañjñāyām (*6,1.175) iti yāvat  /
    ita uttaraṃ yad vakṣyāmastatra suṭ iti , kāt pūrvaḥ iti ca+etad adhikṛtaṃ veditavyam  /
    vakṣyati - samparyupebhyaḥ karotaubhūṣaṇe (*6,1.137)  / saṃskartā  / saṃskartum  /
    saṃskartavyam  / kāt pūrvagrahaṇaṃ suṭo 'bhaktatvajñāpanārtham  / tathā hi saṃskṛṣīṣṭa,
    saṃskriyate iti saṃyogādilakṣaṇau iḍguṇau na bhavataḥ  / tiṅṅatiṅaḥ (*8,1.18)
    iti nighāto 'pi tarhi na prāpnoti, suṭā vyavahitatvāt ? svaravidhau vyañjanam
    avidyamānavat iti vacanān na asti vyavadhānam saṃcaskaratuḥ, saṃcaskaruḥ iti guṇaḥ
    katham ? tanmadhyapatitastadgrahaṇena gṛhyate iti  / saṃyogopadhagrahaṇaṃ ca ṛtaśca
    saṃyogāder guṇaḥ (*7,4.10) ity atra kartavyam  / ṭitkaraṇaṃ suṭstusvañjām ity
    atra viśeṣaṇārtham //
