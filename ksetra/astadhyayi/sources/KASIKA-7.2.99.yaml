source_id: KASIKA-7.2.99
locator:
  sutra: 7.2.99
witness_text:
  sutra: tri-caturoḥ striyāṃ tisṛ-catasṛ
  commentary: tri catur ity etayoḥ striyāṃ vartamānayoḥ tisṛ catasṛ ity etāv ādeśau
    bhavato vibhaktau parataḥ  / tisraḥ  / catasraḥ  / tisṛbhiḥ  / catasṛbhiḥ  / striyām
    iti kim ? trayaḥ  / catvāraḥ  / trīṇiṃ  / catvāri  / striyām iti ca+etat tricaturor
    eva viśeṣaṇaṃ na aṅgasya  / tena yadā tricatuḥśabdau striyām, aṅgaṃ tu liṅgāntare,
    tadā apy ādeśau bhavata eva  / priyāḥ tisro brāhmaṇyo 'sya brāhmaṇasya priyatisā
    brāhmaṇaḥ  / priyatisrau, priyatisraḥ  / priyatisṛ brāhmaṇakulam, priyatisṛṇī,
    priyatisṝṇi  / priyacatasā, priyacatasrau, priyacatasraḥ  / priyacatasṛ, priyacatasṛṇī,
    priyacatasṝṇi  / nadyṛtaś ca (*5,4.153) iti samāsānto na bhavati, vibhaktyāśrayatvena
    tisṛbhāvasya bahiraṅgalakṣaṇatvāt  / yadā tu tricatuḥśabdau liṅgāntare, striyām
    aṅgam, tadā ādeśau na bhavataḥ  / priyāḥ trayo 'syāḥ, priyāṇi trīṇi vā asyāḥ brāhmaṇyāḥ
    sā priyatriḥ  / [#826] priyatrī, priyatrayaḥ  / priyacatvā, priyacatvārau, priyacatvāraḥ  /
    tisṛbhāve sañjñāyāṃ kanyupasaṅkhyānaṃ kartavyam  / tisṛkā nāma grāmaḥ  / catasaryādyudāttanipātanaṃ
    kartavyam  / catastraḥ paśya ity atra caturaḥ śasi (*6,1.137) ity eṣa svaro mā
    bhūt  / catasṛṇām ity atra tu ṣaṭtricaturbhyo halādiḥ (*6,1.179) ity eva svaro
    bhavati  / halādigrahaṇasāmarthyān nipātanasvaro bādhyate //
