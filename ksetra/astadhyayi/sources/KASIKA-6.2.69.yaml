source_id: KASIKA-6.2.69
locator:
  sutra: 6.2.69
witness_text:
  sutra: gotra-antevāsi-mānava-brāhmaṇesu kṣepe
  commentary: gotravācini antevāsivācini ca+uttarapade mānavabrāhmanayoś ca kṣepavācini
    samāse pūrvapadam ādyudāttaṃ bhavati  / jaṅghāvātsyaḥ  / yo jaṅghādānaṃ dadānyaham
    iti vātsyaḥ sampadyate sa jaṅghāvātsyaḥ iti kṣipyate  / bhāryāsauśrutaḥ  / suśrutāpatyasya
    bāryāpradhānatayā kṣepaḥ  / vāśābrāhmakṛteyaḥ  / brahmakṛtaśadaḥ śubhrādisu paṭhyate  /
    gotra  / antevāsi - kumārīdākṣāḥ  / kambalacārāyaṇīyāḥ  / ghṛtarauḍhīyāḥ  / odanapāṇinīyāḥ  /
    kumāryādilābhakāmā ye dākṣādibhiḥ proktāni śāstrāṇy adhīyate tacchiṣyatāṃ vā pratipadyante
    ta evaṃ kṣipyante  / antevāsi  / māṇava - bhikṣāmāṇavaḥ  / bhikṣāṃ lapsye 'hamiti
    māṇavo bhavati  / māṇava  / brāhmaṇa - dāsībrāhmaṇaḥ  / vṛṣalībrāhmaṇaḥ  / bhayabrāhmaṇaḥ  /
    yo bhayena brāhmaṇaḥ sampadyate  / atra yasya anyat samāsalakṣaṇaṃ na asti, supsupā
    ity eva tatra samāsaḥ kartavyaḥ  / gotrādiṣu iti kim ? dāsīśrotriyaḥ  / kṣepe
    iti kim ? mahābrāhmaṇaḥ //
