locator:
  sutra: 7.4.81
witness_text:
  sutra: stravati-śṛṇoti-dravati-pravati-plavati-cyavatīnāṃ vā
  commentary: sravati śṛṇoti dravati pravati plavati cyavati ity eteṣām abhyāsasya
    oḥ avarnapare yaṇi vā ikārādeśo bhavati sani parataḥ  / sisrāvayiṣati, susrāvayiṣati  /
    śṛṇoti - śiśrāvayiṣati, śuśrāvayiṣati  / dravati - didrāvayiṣati, dudrāvayiṣati  /
    pravati - piprāvayiṣati, puprāvayiṣati  / plavati - piplāvayiṣati, puplāvayiṣati  /
    cyavati - cicyāvayiṣati, cucyāvayiṣati  / vacanasāmarthyād ekena varṇena yaṇo
    vyavadhānamāśrīyate  / pūrvasūtrena tu anantara eva yaṇi bhavitavyam iti aprāptabibhāṣeyam  /
    apare ity eva, susrūṣati  / śuśrūṣate //
