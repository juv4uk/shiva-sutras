locator:
  sutra: 7.4.25
witness_text:
  sutra: akṛt-sārvadhātukayor dīrghaḥ
  commentary: akṛdyakāre asārvadhātukayakāre ca kṅiti parato 'jantasya aṅgasya dīrgho
    bhavati  / bhṛśāyate  / sukhāyate  / duḥkhāyate  / cīyate  / cecīyate  / stūyate  /
    toṣṭūyate  / cīyāt  / stūyāt  / akṛt iti kim ? prakṛtya  / prahṛtya  / paratvāt
    dīrghatvena tuko bādhaḥ syāt  / asārvadhātuke iti kim ? cinuyāt  / sunuyāt  /
    kṅiti ity eva, uruyā  / dhṛṣṇuyā //
