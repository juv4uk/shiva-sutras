source_id: KASIKA-8.1.12
locator:
  sutra: 8.1.12
witness_text:
  sutra: prakāre guṇavacanasya
  commentary: prakāro bhedaḥ sādṛśyaṃ ca  / tad iha sādṛśyaṃ prakāro gṛhyate  / prakāre
    vartamānasya guṇavacanasya dve bhavataḥ  / paṭupaṭuḥ  / mṛdumṛduḥ  / paṇḍitapaṇḍitaḥ  /
    aparipūrṇaguṇaḥ ity arthaḥ  / paripūrṇaguṇena nyūnaguṇasya+upamāne satyevaṃ prayujyate  /
    jātīyaro 'nena dvirvacanena bādhanaṃ neṣyate  / paṭujātīyaḥ, mṛdujātīyaḥ ity api
    hi bhavati  / tat katham ? vakṣyamāṇam anyatarasyāṃgrahaṇam ubhayoḥ śeṣo vijāyate  /
    prakāre iti kim ? paṭurdevadattaḥ  / muṇavacanasya iti kim ? agnir māṇavakaḥ  /
    gaurvāhīkaḥ  / yadyapyatra agniśabdo gośabdaś ca mukhyārthasambandhādavabhṛtabhedaṃ
    taikṣṇyajāḍyādikamarthāntare gunaviśeṣam eva pratipādayituṃ pravṛttaḥ, tathāpi
    sarvadā guṇavacano na bhavati iti na dvirucyate  / ānupūrvye dve bhavata iti vaktavyam  /
    mūle mūle sthūlāḥ  / agre 'gre sūkṣmāḥ  / jyeṣṭhaṃ jyeṣṭhaṃ praveśaya  / svārthe
    'vadhāryamāṇe 'nekasmin dve bhavata iti vaktavyam  / asmāt kārṣāpaṇād iha bhavadbhyām
    māṣaṃ māṣaṃ dehi  / svārthe etad dvirvacanam, na vīpsāyām  / atra hi dvāv eva
    māṣau dīyete, na sarve kārṣāpaṇasambandhino māṣāḥ, tena vīpsā na vidyate  / avadhāryamāṇe
    iti kim ? asmāt kārṣāpaṇād iha bhavadbhyāṃ māṣamekaṃ dehi, dvau māṣau dehi, trīn
    vā māṣān dehi  / anekasmin iti kim ? asmāt kārṣāpaṇād iha bhavadbhyāṃ māṣamekaṃ
    dehi  / cāpale dve bhavata iti vaktavyam  / sambhrameṇa pravṛttiścāpalam  / ahirahiḥ,
    vudhyasva budhyasva  / nāvaśyaṃ dvāveva śabdau prayoktavyau, kiṃ tarhi, yāvadbhiḥ
    śabdaiḥ so 'tho 'vagamyate tāvantaḥ prayoktavyāḥ  / ahirahirahiḥ, budhyasva budhyasva
    budhyasva iti  / kriyāsamabhihāre dve bhavata iti vaktavyam  / sa bhavān lunīhi
    lunīhi ity eva ayaṃ lunāti  / [#886] ābhīkṣṇye dve bhavata iti vaktavyam  / bhuktvā
    bhuktvā vrajati  / bhojaṃ bhojaṃ vrajati  / nitya ity eva siddha iti tatra+uktam  /
    ḍāci dve bhavata iti vaktavyam  / paṭapaṭākaroti  / paṭapaṭāyate  / avyaktānukaraṇe
    ḍājantasya dvirvacanam iṣyate  / iha na bhavati, dvitīyākaroti, tṛtīyākaroti  /
    tadarthaṃ kecit ḍāci bahulam iti paṭhanti  / pūrvaprathamayorarthātiśayavivakṣāyāṃ
    dve bhavata iti vaktavyam  / pūrvaṃ pūrvaṃ puṣpyanti  / prathamaṃ prathamaṃ pacyante  /
    ātiśayiko 'pi dṛśyate, pūrvataraṃ puṣpyanti, prathamataraṃ pacyante iti  / ḍataraḍatamayoḥ
    samasampradhāraṇayoḥ strīnigade bhave dve bhavata iti vaktavyam  / ubhāvimāvāḍhyau  /
    katarā katarā anayorāḍhyatā  / sarva ime āḍhyāḥ  / katamā katamā eṣām āḍhyatā  /
    ḍataraḍatamābhyāmanyatra api hi dṛśyate  / ubhāvimāu āḍhyau  / kīdṛśī kīdṛśi anayorāḍhyatā  /
    tathā strīnigadādbhāvāt anyatra api hi dṛśyate, ubhāvimāvāḍhyau, kataraḥ kataro
    'nyorvibhavaḥ iti  / karmavyatihāre sarvanāmno dve bhavata iti vaktavyaṃ samāsavacca
    bahulam  / yadā na samāsavat prathamaikavacanaṃ tadā pūrvapadasya anyamanyamime
    brāhmaṇā bhojayanti, anyonyamime brāhmaṇā bhojayanti  / anyonyasya brāhmaṇā bhojayanti  /
    itaretaraṃ bhojayanti  / itaretarasya bhojayanti  / strīnapuṃsakayor uttarapadasya
    ca ambhāvo vaktavyaḥ  / anyo 'nyāmime brāhmaṇyau bhojayataḥ  / anyonyaṃ bhojayataḥ  /
    itaretarāṃ bhojayataḥ  / itaretaraṃ bhojayataḥ  / anyonyāmime brāhmaṇakule bhojayataḥ  /
    itarāmime brāhmaṇakule bhojayataḥ  / itaretaramime brāhmaṇakule bhojayataḥ //
    [#887]
