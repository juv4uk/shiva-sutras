source_id: KASIKA-8.4.6
locator:
  sutra: 8.4.6
witness_text:
  sutra: vibhāṣauṣadhivanaspatibhyaḥ
  commentary: vanam ity eva  / oṣadhivāci yat pūrvapadaṃ vanaspativāci ca tatsthān
    nimittād uttarasya vananakārasya ṇakāra ādeśo bhavati vibhāṣā  / oṣadhivācibhyas
    tāvat - dūrvāvaṇam, dūrvāvanam  / mūrvāvaṇam, mūrvāvanam  / vanspatibhyaḥ - śirīṣavaṇam,
    śirīṣavanam  / badarīvaṇam, badarīvanam  / dvyakṣaratryakṣarebhya iti vaktavyam  /
    iha mā bhūt, devadāruvanam  / bhadradāruvanam  / irikādibhyaḥ pratiṣedho vaktavyaḥ  /
    irikāvanam  / mirikāvanam  / phalī vanspatirjñeyo vṛkṣāḥ puṣpaphalopagāḥ  / oṣadhyaḥ
    phalapākāntā latāgulmāś ca vīrudhaḥ // satyapi bhede vṛkṣavanaspatyor iha bhedena
    grahaṇaṃ draṣtavyam // [#968]
