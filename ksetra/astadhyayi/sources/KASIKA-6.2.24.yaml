source_id: KASIKA-6.2.24
locator:
  sutra: 6.2.24
witness_text:
  sutra: vispaṣṭa-ādīni guṇavacaneṣu
  commentary: vispaṣṭādini pūrvapadāni gunavāneṣu uttarapadeṣu prakṛtisvarāṇi bhavanti  /
    vispaṣṭakaṭukam  / vicitrakaṭukam  / vyaktakaṭukam  / vispaṣṭalavaṇam  / vicitralavaṇam  /
    vyaktalavaṇam  / vispaṣṭaṃ kaṭukam iti vigṛhya supsupā iti samāsaḥ  / vispaṣṭādayo
    hy atra pravṛttinimittasya viśeṣaṇam  / kaṭukādibhiś ca śabdair gunavad dravyam
    abhidhīyate ity asāmānādhikaranyam ato na asti karmadhārayaḥ  / vispaṣṭaśabdo
    gatiranantaraḥ (*6,2.49) ity ādyudāttaḥ  / vicitraśabdo 'pi avyayasvareṇa  / vicittaśabdamanye
    ahanti  / so 'pi bahuvrīhisvareṇa ādyudātta eva  / vyaktaśabdaḥ udāttasvaritayor
    yaṇaḥ svarito 'nudāttasya (*8,2.4) ity ādisvaritaḥ  / ye ca atra apare paṭhyante
    tatra sampannaśabdasthāthādisvareṇa antodāttaḥ  / paṭupaṇḍitaśabdau pratyayasvareṇa  /
    kuśalaśabdaḥ kṛtsvareṇa antodattaḥ  / capalaśabdaścitsvareṇa antodāttaḥ, cuperaccopadhāyāḥ
    ity atra hi ciditi vartate  / nipuṇaśabdasthāthādisvareṇa antodattaḥ, puṇerigupadhalakṣaṇaḥ
    kapratyayo 'yam  / vispaṣṭādīni iti kim ? paramalavaṇam  / uttamalavaṇam  / guṇavacaneṣu
    iti kim ? vispaṣṭabrāhmaṇaḥ  / vispaṣṭa  / vicitra  / vyakta  / sampanna  / paṭu  /
    paṇḍita  / kuśala  / capala  / nipuṇa  / vispaṣṭādiḥ //
