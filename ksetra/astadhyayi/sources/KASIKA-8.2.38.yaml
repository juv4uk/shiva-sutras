source_id: KASIKA-8.2.38
locator:
  sutra: 8.2.38
witness_text:
  sutra: dadhas ta-thoś ca
  commentary: dadhaḥ iti dadhatiḥ kṛtadvirvacano nirdiśyate  / tasya jhalantasya baśaḥ
    sthāne bhaṣ ādeśo bhavati takārathakārayoḥ parataḥ, cakārāt sdhvoś ca parataḥ  /
    dhattaḥ  / dhatthaḥ  / dhatse  / dhaddhvam  / vacanasāmarthyādāto lopasya sthānivadbhāvo
    na bhavati  / abhyāsajaśtvasya ca asiddhatvam  / tathoḥ iti kim ? ānantaryāt sdhvor
    eva vijñāyeta  / cakāraḥ tayor anuvṛttyarthaḥ  / jhaṣantasya ity eva, dadhāti
    //
