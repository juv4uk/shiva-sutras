source_id: KASIKA-7.3.53
locator:
  sutra: 7.3.53
witness_text:
  sutra: nyaṅkv-ādīnāṃ ca
  commentary: nyaṅku ity evam ādīnāṃ kavargādeśo bhavati  / nyaṅkuḥ - nāvañceḥ iti
    upratyayaḥ  / madguḥ - mimasjibhya uḥ iti masjeḥ upratyayaḥ  / bhṛguḥ - prathimadibhrasjāṃ
    samprasāraṇaṃ salopaś ca iti upratyayaḥ  / dūrepākaḥ, phalepākaḥ - dūre pacyate
    svayam eva, phale pacyate svayam eva  / pacādyac  / nipātanād vṛddhiḥ  / tatpuruṣe
    iṛti bahulam (*6,3.14) iti saptamyā aluk  / kṣaṇepākaḥ ity api hi kecit paṭhanti  /
    dūrepākā, phalepākā it ṭābantamapre 'dhīyate  / ukārāntāvapare dūrepākuḥ phalepākuḥ
    iti  / [#846] teṣām upratyayaḥ nipātanād eva  / takram vakram iti pañcater vañcateś
    ca sphāyitañcivañci ity ādinā sūtreṇa rak  / vyatiṣaṅgaḥ - vyatiṣajati iti pacādyac  /
    anuṣaṅgaḥ  / avasargaḥ  / upasargaḥ  / śvapākaḥ, māṃsapākaḥ, kapotapākaḥ, ulūkapākaḥ
    iti karmopadādaṇ pratyayaḥ  / sañjñāyā anyatra arhaḥ, avadāhaḥ, nidāhaḥ  / nyagrodhaḥ,
    vīrud ity atra nyakpūrvasya ruheḥ pacādyaci, vipūrvasya kvipi dhakāro vidhīyate  /
    nyagrohayati nyagrodhaḥ  / virohayati iti vīrut  //
