locator:
  sutra: 4.4.121
witness_text:
  sutra: rakṣo-yātūnāṃ hananī
  commentary: nirdeśād eva samarthavibhaktiḥ  / rakṣaḥ-śabdād yātu-śabdāc ca ṣaṣṭhīsamarthād
    hananī ity etasminn arthe yat pratyayo bhavati  / hanyate 'nyā iti hananī  / yā
    vāṃ mitrāvaruṇau rakṣasyā tanū yātavyā  / rakṣasāṃ hananī  / yātūnāṃ hananī  /
    bahuvacanaṃ stutivaiśiṣṭyajñāpanārtham  / bahunāṃ rakṣasāṃ hananena tanūḥ stūyate
    //
