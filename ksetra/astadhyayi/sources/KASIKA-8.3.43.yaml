source_id: KASIKA-8.3.43
locator:
  sutra: 8.3.43
witness_text:
  sutra: dvis-triś-catur iti kṛtvo 'rthe
  commentary: ṣaḥ iti sambadhyate  / dvis tris catur ity eteṣāṃ kṛtvo 'rthe vartamanānāṃ
    visarjanīyasya ṣakāra ādeśo bhavati anyatarasyāṃ kupvoḥ parataḥ  / dviṣkaroti,
    dviḥ karoti  / triṣkaroti, triḥ karoti  / catuṣkaroti, catuḥ karoti  / dviṣpacati,
    dviḥ pacati  / triṣpacati, triḥ pacati  / catuspacati, catuḥ pacati  / kṛtvo 'rthe
    iti kim ? catuskapālam  / catuskaṇṭakam  / pūrveṇa nityaṃ ṣatvaṃ bhavati  / idudupadhasya
    ity etasya anuvṛttau satyāṃ krtvo 'rthaviṣayeṇa ca padena visarjanīye viśeṣyamāṇe
    dvistriścatur iti śakyamakartum  / krtvasujarthe ṣatvaṃ bravīti kasmāccatuskapāle
    mā  / ṣatvaṃ vibhāṣayā bhūnnanu siddhaṃ tatra pūrveṇa // siddhe hy ayaṃ vidhatte
    caturaḥ satvaṃ yadāpi kṛtvo 'rthe  / pulte kṛtvo 'rthīye rephasya visarjanīyo
    hi // [#948] evaṃ sati tvidānīṃ dvistriścatur ity anena kiṃ kāryam  / [#947] anyo
    hi nedudupadhaḥ kṛtvo 'rthaḥ kaścid apy asti // akriyamāṇe grahaṇe visarjanīyas
    tadā viśeṣyeta  / caturo na sidhyati tadā rephasya visarjanīyo hi // tasmiṃs tu
    kriyamāṇe yuktaṃ caturo viśeṣaṇaṃ bhavati  / prakṛtaṃ padaṃ tadantaṃ tasya api
    viśeṣaṇaṃ nyāyyam // evaṃ tu kriyamāṇe dvistriścaturgrahaṇe catuḥśabdasya kṛtvo
    'rthe 'pi vartamanasya pūrveṇa+eva nityaṃ ṣatvaṃ syāt  / pūrvatra siddhe na asti
    vipratiṣedho 'bhāvād uttarasya // [#948]
