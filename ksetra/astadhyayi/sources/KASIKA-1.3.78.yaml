source_id: KASIKA-1.3.78
locator:
  sutra: 1.3.78
witness_text:
  sutra: śeṣāt kartari parasmaipadam
  commentary: pūrveṇa prakaraṇena ātmanepada-niyamaḥ kṛtaḥ, na prasmaipada-niyamaḥ  /
    tat sarvataḥ prāpnoti, tad-artham idam ucyate  / yebhyo dhātubhyo yena viśeṣaṇena
    ātmanepadam uktaṃ tato yad-anyat sa śeṣaḥ  / śeṣāt kartari parasmaipadaṃ bhavati  /
    śeṣād eva na anyasmāt  / anudāttaṅita ātmanepadam uktam -- aste  / śete  / tato
    'nyatra parasmaipadam bhavati -- yāti  / vāti  / nerviśaḥ ātmanepadam uktam --
    niviśate  / tato 'nyatra parasmaipadam -- āviśati  / praviśati  / kartari iti
    kim ? pacyate  / gamyate  / karmakartari kasmāt parasmaipadaṃ na bhavati, pacyate
    odanaḥ svayam eva ? kartari karma-vyatihāre (*1,3.14) iti dvitīyaṃ kartṛ-grahaṇam
    anuvartate, tena kartā-eva yaḥ kartā tatra prasmaipadam bhavati, karmakartari
    na bhavati //
