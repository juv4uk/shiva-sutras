source_id: KASIKA-7.2.58
locator:
  sutra: 7.2.58
witness_text:
  sutra: gamer iṭ parasmaipadeṣu
  commentary: gamer dhātoḥ sakārāder ārdhadhātukasya parasmaipadesu iḍāgamo bhavati  /
    gamiṣyati  / agamiṣyat  / jigamiṣati  / gameḥ iti kim ? ceṣyati  / iḍgrahaṇaṃ
    nityārtham  / parasmaipadeṣu iti kim ? saṃgaṃsīṣṭa  / saṃgaṃsyate  / saṃjigaṃsate  /
    saṃjigaṃsiṣyate  / adhijigāṃsate  / adhijigāṃsiṣyate  / gamer iṅādeśasya ajjhanagamāṃ
    sani (*6,4.16) iti dīrghatvam  / se ity eva, gantāsmi, gantāsvaḥ, gantāsmaḥ  /
    ātmanepadena samānapadasthasya gameḥ ayam iḍāgamo neṣyate  / anyatra sarvatraiveṣyate  /
    kṛtyapi hi bhavati, parasmaipadaluki ca, saṃjigamiṣitā, adhijigamiṣitā vyākaraṇasya,
    jigamiṣa tvam iti  / padaśeṣakārasya punar idaṃ darśanam - gamyupalakṣaṇārthaṃ
    parasmaipadagrahaṇam, parasmaipadeṣu yo gamir upalakṣitas tasmāt sakārāder ārdhadhātukasya
    iḍ bhavati  / tanmatena saṃjigaṃsitā, adhijigaṃsitā vyākaraṇasya ity eva bhavitavyam
    //
