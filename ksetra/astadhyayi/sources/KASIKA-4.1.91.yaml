source_id: KASIKA-4.1.91
locator:
  sutra: 4.1.91
witness_text:
  sutra: phak-phiñor anyatarasyām
  commentary: yūni ity eva  / pūrvasūtreṇa nitye luki prāpte vikalpa ucyate  / phakphiñor
    yuva-pratyayayoḥ prāgdīvyatīye 'jādau pratyaye vivakṣite 'nyatarasyāṃ lug bhavati  /
    gargādibhyo yañi kṛte yañiñoś ca (*4,1.101) iti phak, gārgyāyaṇaḥ  / tasya chātrāḥ
    gārgīyāḥ, gārgyāyaṇīyāḥ  / vātsīyāḥ, vātsyāyanīyāḥ  / phiñaḥ khalv api yaskasya
    apatyaṃ, śivādibhyo 'ṇ (*4,1.112), yāskaḥ  / tasya apatyaṃ yuvā, aṇo dvyacaḥ (*4,1.156)
    iti phiñ, yāskāyaniḥ  / tasya chātrāḥ yāskīyāḥ, yāskāyanīyāḥ //
