source_id: KASIKA-6.1.23
locator:
  sutra: 6.1.23
witness_text:
  sutra: styaḥ prapūrvasya
  commentary: niṣṭhāyām iti vartate, saṃprasāraṇam iti ca  / sphī ity etan na svaryate  /
    styai ṣṭyai śabdasaṃghātayoḥ  / dvayor apy etayoḥ dhātvoḥ styārūpamāpannayoḥ sāmānyena
    grahaṇam  / styā ity asya prapūrvasya dhātor niṣṭhāyāṃ parataḥ samprasāraṇaṃ bhavati  /
    prastītaḥ  / prastītavān  / samprasāraṇe kṛte yaṇvattvaṃ vihatam iti  / niṣṭhānatvaṃ
    na bhavati  / prastyo 'nyatarasyām (*8,2.54) iti tu pakṣe makāraḥ kriyate  / prastīmaḥ
    prastīmavān  / prapūrvasya iti kim ? saṃstyānaḥ  / saṃstyānavān  / prastyaḥ ity
    eva siddhe pūrvagrahaṇam iha api ythā syāt, prasaṃstītaḥ, prasṃstītavān  / tat
    kathaṃ prapūrvasya iti ṣaṣṭhyarthe bahuvrīhiḥ ? praḥ pūrvo yasya dhātūpasargasamudāyasya
    sa prapūrvaḥ tadavayavasya styaḥ iti vyadhikaraṇe ṣaṣṭhyau  / tatra prasaṃstītaḥ
    ity atra api prapūrvasamudāyāvayavaḥ styāśabdo bhavati // [#603]
