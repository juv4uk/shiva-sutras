source_id: KASIKA-6.4.19
locator:
  sutra: 6.4.19
witness_text:
  sutra: ccḥ-voḥ ś-ūḍḥ-anunāsike ca
  commentary: cha ity etasya satukkasya, vakārasya ca sthāne yathāsaṅkhyam ś ūṭḥ ity
    etāv ādeśau bhavataḥ, anunāsikādau pratyayai parataḥ kvau jhalādau ca kṅiti  /
    praśnaḥ  / viśnaḥ  / antaraṅgatvāt che ca (*6,1.73) iti tuki kṛte satukkasya śādeśaḥ  /
    vakārasya ūṭḥ - syonaḥ  / siverauṇādike na pratyaye laghūpadhaguṇāt pūrvamūṭḥ
    kriyate  / tatra kṛte 'ntaraṅgatvād yaṇādeśo nānāśrayatvāt ca na vārṇādāṅgaṃ balīyaḥ
    bhavati  / kvau chasya śabdaprāṭ  / kvabvaci ityādinauṇādikaḥ kvip dīrghaś ca  /
    goviṭ  / vakārasya - akṣadyūḥ  / hiraṇyaṣṭhyūḥ  / [#736] asiddhaṃ bahiraṅgamantaraṅge
    iti nājānantarye iti pratiṣidhyate  / jhalādau chasya - pṛṣṭaḥ  / pṛṣṭavān  /
    pṛṣṭvā  / vakārasya - dyūtaḥ  / dyūtavān  / dyūtvā  / kṅiti ity eva, dyubhyās  /
    dyubhiḥ  / kecid atra kṅiti iti na anuvartayanti  / kathaṃ dyubhyām, dyubhiḥ iti
    ūṭhi kṛte ? diva ut (*6,1.131) iti taparatvān mātrākālo bhaviṣyati  / chaśāṃ ṣaḥ
    ity atra chagrahaṇaṃ na kartavyam  / anena+eva hi sarvatra śakāro vidhīyate  /
    ūṭhaṣṭhitkaraṇam etyadhatyūṭhsu (*6,1.189) iti viśeṣaṇārtham  / vāha ūṭḥ (*6,4.139)
    ity ayam api ṭhideva //
