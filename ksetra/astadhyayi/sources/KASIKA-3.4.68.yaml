source_id: KASIKA-3.4.68
locator:
  sutra: 3.4.68
witness_text:
  sutra: bhavya-geya-pravacanīya-upasthānīya-janya-āplāvya-āpātyā vā
  commentary: bhavyādayaḥ śabdāḥ kartari vā nipātyante  / tayor eva kṛtya-kta-khal-arthaḥ
    (*3,4.70)  / iti bhāva-karmaṇoḥ prāptayoḥ kartā ca vācyaḥ pakṣe ucyate  / bhavaty
    asau bhavyaḥ, bhavyam anena iti vā  / geyo māṇavakaḥ sāmnām, geyāni māṇavakena
    sāmāni iti vā  / pravacanīyo guruḥ svādhyāyasya, pravacanīyo guruṇā svādhyāya
    iti vā  / upasthānīyo 'ntevāsī guroḥ, upasthānīyaḥ śiṣyeṇa vā guruḥ  / jāyate
    'sau janyaḥ, janyamanena iti vā  / āplavate 'sāvāplāvyaḥ, āplāvyam anena iti vā  /
    āpatati asāvāpātyaḥ, āpātyam anena iti vā //
