witness_text:
  sutra: nīg vañcu-sraṃsu-dhvaṃsu-bhraṃsu-kasa-pata-pada-skandām
  commentary: vañcu sraṃsu dhvaṃsu bhraṃsu kasa pata pada skanda ity eteṣām abhyāsasya
    nīgāgamo bhavati yaṅi yaṅluki ca  / vañcu - vanīvacyate  / vanīvañcīti  / sraṃsu
    - sanīsrasyate  / sanīsraṃsīti  / dhvaṃsu - danīdhvasyate  / danīdhvaṃsīti  /
    bhraṃsu - banībhrasyate  / banībhraṃsīti  / kasa - canīikasyate  / canīkasīti  /
    pata - panīpatyate  / panīpatīti  / pada - panīpadyate  / panīpadīti  / skanda
    - canīskadyate  / canīskandīti // [#878]
