source_id: KASIKA-8.2.2
locator:
  sutra: 8.2.2
witness_text:
  sutra: nalopaḥ sup-svara-sañjñā-tug-vidhiṣu kṛti
  commentary: nalopaḥ pūrvatra asiddho bhavati subvidhau, svaravidhau, sajñāvidhau,
    tugvidhau ca kṛti  / vidhiśabdo 'yaṃ pratyekam abhisambadhyamānaḥ svarasañjñātukāṃ
    vidheyatvāt taiḥ karmaṣaṣṭhīyuktaiḥ bhāvasādhano 'bhisambadhyate  / supā tu sambandhasāmānyavacanaṣaṣṭhyantena
    karmasādhanaḥ  / tena supaḥ sthāne yo vidhiḥ, supi ca parabhūte, sarvo 'sau subvidhiḥ
    iti sarvatrāsiddhatvaṃ bhavati  / subvidhau tāvat rājabhiḥ, takṣabhiḥ ity atra
    nalopasya asiddhatvāt ato bhisa ais (*7,1.9) iti na bhavati  / rājabhyām, takṣabhyām,
    rājasu, takṣasu iti supi ca (*7,3.102) iti, bahuvacane jhalyet (*7,3.103) iti
    dīrghatvametvaṃ ca na bhavati  / svaravidhau - rājavatī ity atra nalopasya asiddhatvāt
    anto 'vatyāḥ (*6,1.220) iti na bhavati  / pañcārmam, daśārmam, ity atra nalopasya
    asiddhatvāt arme cāvarṇaṃ dvyac tryac (*6,2.90) iti pūrvapadasya ādyudāttatvaṃ
    na bhavati  / pañcadaṇḍī ity atra nalopasya asiddhatvād igante dvigau iti pūrvapadaprakṛtisvaro
    na bhavati  / sañjñāvidhau - pañca brāhmaṇyaḥ, daśa brāhmaṇyaḥ iti nalopasya asiddhatvāt
    ṣṇāntā ṣaṭ (*1,1.24) iti ṣaṭsañjñā bhavati, tataś ca na ṣaṭsvasrādibhyaḥ (*4,1.10)
    iti ṭāpaḥ pratiṣedho bhavati  / tad etat prayojanaṃ kathaṃ bhavati ? yadi pratikāryaṃ
    sañjñāpravṛttiḥ ity etad darśanam  / yā hi jaśśasorlugarthā ṣaṭsañjñā pravṛttā,
    tayā strīpratyayapratiṣedho na kriyate iti sā punaḥ pravartayitavyā iti  / tugvidhau
    - vṛtrahabhyām, vṛtrahabhiḥ iti nalopasya asiddhatvāt hrasvasya piti kṛti tuk
    (*6,1.71) iti tug na bhavati  / atra kecit sannipātalakṣaṇo vidhir animittaṃ tadvighātasya
    iti tukaṃ prati nalopasya animittatvāt, bahiraṅgalakṣaṇena vā asiddhatvāt, tugvidhigrahaṇam
    anarthakam iti pratipannāḥ  / tat tu kriyate paribhāṣadvayasya anityatvaṃ jñāpayitum  /
    [#906] kṛti iti kim ? vṛtrahacchatram, vṛtrahacchāyā, che ca (*6,1.73) iti tug
    bhavati  / atra siddhe satyārambho niyamārthaḥ, eteṣv eva nalopo asiddho bhavati,
    na anyatra  / tena rājīyati, rājāyate, rājāśvaḥ iti ītvam, dīrghatvam, ekadeśaś
    ca siddho bhavati //
