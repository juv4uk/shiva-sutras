source_id: KASIKA-1.2.39
locator:
  sutra: 1.2.39
witness_text:
  sutra: svaritāt saṃhitāyām anudāttānām
  commentary: eka-śrutiḥ iti vartate  / saṃhitāyaṃ viśaye svaritāt pareṣām anudāttānām
    ekaśrutir bhavati  / imaṃ me gaṅge yamune sarasvati śutudri  / māṇavaka jaṭilakādhyāpaka
    kva gamiṣyasi  / imam ity anta-udāttaṃ, me iti anudāttaṃ vidhi-kāla eva nighāta-vidhānāt  /
    tat punaḥ udāttād anudātasya svaritaḥ (*8,4.66) iti svaritaṃ sampadyate  / tasmāt
    svaritāt pareṣām anudāttānāṃ gaṅgeprabhṛtīnām ekaśrutir bhavati  / sarva ete āmantrita-nighātena
    anudāttāḥ  / māṇavaka jaṭilaka iti prathamam āmantritamādyudāttaṃ, tasya dvitīyam
    akṣaram svaritaṃ, tataḥ pareṣām anudāttānām ekaśrutir bhavati  / saṃhitā-grahaṇaṃ
    kim ? avagrahe mā bhūt  / imam me gaṅge yamune sarsvati //
