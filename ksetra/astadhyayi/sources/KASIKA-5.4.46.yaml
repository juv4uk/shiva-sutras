witness_text:
  sutra: atigraha-avyathana-kṣepeṣv akartari tṛtīyāyāḥ
  commentary: atikramya grahaḥ atigrahaḥ  / acalanam avyathanam  / kṣepo nindā  /
    atigrahādiviṣaye yā tṛtīyā tadantād vā tasiḥ pratyayo bhavati, sā cet kartari
    na bhavati  / vṛttena atigṛhyate vṛttato 'tigṛhyate  / cāritreṇa atigṛhyate cāritrato
    'tigṛhyate  / suṣṭhuvṛttavān anyān atikramya vṛttena gṛhyate ity arthaḥ  / avyathane
    - vṛttena na vyathate vṛttato na vyathate  / cāritreṇa na vyathate cāritrato na
    vyathate  / vṛttena na calati ity arthaḥ  / kṣepe - vṛttena kṣipto vṛttataḥ kṣiptaḥ  /
    cāritreṇa kṣiptaḥ cāritrataḥ kṣiptaḥ  / vṛttena ninditaḥ ity arthaḥ  / akartari
    iti kim ? devadattena kṣiptaḥ //
