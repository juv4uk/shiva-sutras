witness_text:
  sutra: atri-bhṛgu-kutsa-vasiṣṭha-gotama-aṅgirobhyaś ca
  commentary: atry-ādibhyaḥ parasya gotrapratyayasya bahuṣu lug bhavati  / atri-śabdāt
    itaś ca aniñaḥ (*4,1.122) iti ḍhak  / itarebhyaḥ ṛṣyaṇ  / atrayaḥ bhṛgavaḥ  /
    kutsāḥ  / vasiṣṭhāḥ  / gotamāḥ  / aṅgirasaḥ  / bahuṣu ity eva, ātreyaḥ  / bhargavaḥ
    / tena+eva ity eva, priyātreyāḥ  / priyabhārgavāḥ  / astriyām iti kim ? ātreyyaḥ
    striyaḥ // [#170]
