source_id: KASIKA-2.2.1
locator:
  sutra: 2.2.1
witness_text:
  sutra: pūrva-apara-adhara-uttaram ekadeśinā-ekādhikaraṇe
  commentary: ekadeśo 'sya asti ity ekadeśī, avayavī, tadvācinā subantena saha pūrva
    apara adhara uttara ity ete śabdāḥ sāmarthyād ekadeśabacanāḥ samasyante, tatpuruṣaś
    ca samāso bhavati  / ekādhikaraṇa-grahanam ekadeśino viśeṣaṇam  / ekaṃ ced adhikaraṇam
    ekadravyam ekadeśi bhavati  / ṣaṣṭhīsamāsa-apavado 'yaṃ yogaḥ  / pūrvaṃ kāyasya
    pūrvakāyaḥ  / aparakāyaḥ  / adharakāyaḥ  / uttarakāyaḥ  / ekadeśinā iti kim ?
    pūrvaṃ na abheḥ kāyasya  / ekādhikaraṇe iti kim ? pūrvaṃ chātrāṇām āmantraya  /
    kathaṃ madhyāhnaḥ, sāyāhnaḥ iti ? saṅkhyā-vi-sāy-apūrvasya ahnasya ahann anyatarasyāṃ
    ṅau (*6,3.110) iti jñāpakāt sarvaṇaikadeśa-śabdena ahnaḥ samāso bhavati //
