source_id: KASIKA-6.2.33
locator:
  sutra: 6.2.33
witness_text:
  sutra: pari-praty-upa-apā varjyamāna-ahorātra-avayaveṣu
  commentary: pari prati upa apa ity ete pūrvapadabhūtā varjyamānavācini aharavayavavācini
    rātryavayavavācini ca+uttarapade prakṛtisvarā bhavanti  / paritrigartaṃ vṛṣṭo
    devaḥ  / parisauvīram  / parisārvaseni  / prati - pratipūrvāhṇam  / pratyaparāhṇam  /
    pratipūrvarātram  / pratyapararātram  / upa - upapūrvāhṇam  / upāparāhṇam  / upapūrvarātram  /
    upāpararātram  / apa - apatrigartaṃ vṛṣṭo devaḥ  / apasauvīram  / apasārvaseni  /
    nipātā ādyudāttā upasargāś ca abhivarjam iti ādyudāttāni pūrvapadāni  / tatpuruṣe
    bahuvrīhau ca siddhatvāt avyayaībhāvārtho 'yam ārambhaḥ  / tatra apaparīvarjane
    vartete, iti tayor eva varjyamānam uttarapadaṃ, netarayoḥ  / ahorātrāvayavā api
    varjyamānā eva tayor bhavanti iti na pṛthagudāhriyate  / varjyamānāhorātrāvayaveṣu
    iti kim ? pratyagni śalabhāḥ patanti  / parivanam ity atra vanaṃ samāse (*6,2.178)
    ity etad bhavati //
