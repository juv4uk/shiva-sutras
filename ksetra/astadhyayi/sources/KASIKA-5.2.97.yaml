source_id: KASIKA-5.2.97
locator:
  sutra: 5.2.97
witness_text:
  sutra: sidhma-ādibhyaś ca
  commentary: lajanyatarasyām iti vartate  / sidhmādibhyaḥ prātipadikebhyo lac pratyayo
    bhavaty anyatarasyāṃ matvarthe  / sidhmalaḥ, sidhmavān  / gaḍulaḥ, gaḍumān  /
    anyatarasyāṃ grahaṇena matup samuccīyate, na tu pratyayo vikalpyate  / tasmāt
    akārāntebhyaḥ iniṭhanau pratyayau na bhavataḥ  / sidhma  / gaḍu  / maṇi  / nābhi  /
    jīva  / niṣpāva  / pāṃsu  / saktu  / hanu  / māṃsa  / paraśu  / pārṣṇidhamanyor
    dīrghaś ca  / pārṣṇīlaḥ  / dhamanīlaḥ  / parṇa  / udaka  / prajñā  / maṇḍa  /
    pārśva  / gaṇḍa  / granthi  / vātadantabalalalāṭānāmūṅ ca  / [#521] vātūlaḥ  /
    dantūlaḥ  / balūlaḥ  / lalāṭūlaḥ  / jaṭāghaṭākalāḥ kṣepe  / jaṭālaḥ  / ghaṭālaḥ  /
    kalālaḥ  / sakthi  / karṇa  / sneha  / śīta  / śyāma  / piṅga  / pitta  / śuṣka  /
    pṛthu  / mṛdu  / mañju  / patra  / caṭu  / kapi  / kaṇḍu  / sañjñā  / kṣudrajantūpatāpāc
    ca+iṣyate  / kṣudrajantu - yūkālaḥ  / makṣikālaḥ  / upatāpa - vicarcikālaḥ  /
    vipādikālaḥ  / mūrcchālaḥ  / sidhmādiḥ //
