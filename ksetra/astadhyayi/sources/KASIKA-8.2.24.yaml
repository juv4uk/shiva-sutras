locator:
  sutra: 8.2.24
witness_text:
  sutra: rāt sasya
  commentary: saṃyogāntapadasya yo rephaḥ tasmād uttarasya antasya sakārasya lopo
    bhavati  / gobhirakṣāḥ  / pratyañcamatsāḥ  / kṣarateḥ tsarateś ca luṅi sicaḥ chāndasatvād
    īḍabhāvaḥ bahulaṃ chandasi (*7,3.97) iti vacanāt  / dīrghe sati rūpam etat  /
    mātuḥ, pituḥ iti ṛta ut (*6,1.111) iti uttve kṛte raparatve ca sati rāt sasya
    iti salopaḥ  / siddhe satyārambho niyamārthaḥ, rāt sasya eva lopo bhavati, na
    anyasya iti  / ūrjeḥ kvip - ūrk  / mṛjeḥ laṅi - amārṭ //
