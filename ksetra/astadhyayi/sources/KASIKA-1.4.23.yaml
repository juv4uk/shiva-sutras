source_id: KASIKA-1.4.23
locator:
  sutra: 1.4.23
witness_text:
  sutra: kārake
  commentary: kārake iti vaśeṣaṇam apādānādisañjñāviṣayam adhikriyate  / kārake ity
    adhikāro veditavyaḥ  / yad ita ūrdhvam anukramiṣyāmaḥ kārake ity evaṃ tad veditavyam  /
    kāraka-śabdaś ca nimitta-paryāyaḥ  / karakam hetuḥ ity anartha-antaram  / kasya
    hetuḥ ? kriyāyāḥ  / vakṣyati, ghruvamapāye 'pādānam (*1,4.24) - grāmādāgacchati  /
    parvatādavarohati  / kārake iti kim ? vṛkṣasya parṇaṃ patati  / kuḍyasya piṇḍaḥ
    patati  / akathitaṃ ca (*1,3.51), akathitaṃ ca kārakaṃ karmasañjñaṃ bhavati -
    māṇavakaṃ panthānaṃ pṛcchati  / karake iti kim ? māṇavakasya pitaraṃ panthānaṃ
    pṛcchati  / kārakasaṃśabdaneṣu ca anena eva viśeṣaṇena vyavahāro vijñāyate //
