source_id: KASIKA-4.1.2
locator:
  sutra: 4.1.2
witness_text:
  sutra: sv-au-jas-am-auṭ-chaṣ-ṭā-bhyāṃ-bhis-ṅebhyām-bhyas-ṅasi-bhyāṃ-bhyas-ṅas-os-ām-ṅy-os-sup
  commentary: ṅy-āp-prātipadikāt (*4,1.1) ity adhikṛtam  / ṅy-āp-prātipadikāt svādayaḥ
    pratyayā bhavanti  / ukārādayo 'nubandhā yathāyogam uccāraṇa-viśeṣaṇa-arthāḥ  /
    auṭaḥ ṭakāraḥ suṭ iti pratyāhāra-grahaṇa-arthaḥ  / pakāraḥ sup iti pratyāhāra-arthaḥ  /
    saṅkhyākarmādayaś ca svādīnām arthāḥ śāstrāntareṇa vihitās tena saha asya+ekavākyatā  /
    ṅy-antāt tāvat - kumārī  / gaurī  / śārṅgaravī  / ṅīb-ṅīṣ-ṅīnāṃ krameṇa udāharaṇam  /
    kumārī, kumāryau, kumāryaḥ  / kumārīm, kumāryau, kumārīḥ  / kumāryā, kumārībhyām,
    kumārībhiḥ  / kumāryai, kumārībhyām, kumārībhyaḥ  / kumāryāḥ, kumārībhyām, kumārībhyaḥ  /
    kumāryāḥ, kumāryoḥ, kumārīṇām  / kumāryām, kumāryoḥ, kumārīṣu  / evaṃ gaurī, śārṅgaravī
    codāhārye  / āpaḥ khalv api - khaṭvā  / bahurājā  / kārīṣagandhyā  / ṭāb-ḍāpc-āpāṃ
    krameṇa+udāharaṇam  / [#318] khaṭvā, khaṭve, khaṭvāḥ  / khaṭvām, khaṭve, khaṭvāḥ  /
    khaṭvayā, khaṭvābhyām, khaṭvābhiḥ  / khaṭvāyai, khaṭvābhyām, khaṭvābhyaḥ  / khaṭvāyāḥ,
    khaṭvābhyām, khaṭvābhyaḥ  / khaṭvāyāḥ khaṭvayoḥ, khaṭvānām  / khaṭvāyām, khaṭvayoḥ,
    khaṭvāsu  / evaṃ bahurājākārīṣagandhye ca+udāhārye  / evaṃ prātipadikāt - dṛṣad,
    dṛṣadau, dṛṣadaḥ  / dṛṣadam, dṛṣadau, dṛṣadaḥ  / dṛṣadā, dṛṣadbhyām, dṛṣadbhiḥ  /
    dṛsade, dṛṣadbhyām, dṛṣadbhyaḥ  / dṛṣadaḥ, dṛṣadbhyām, dṛṣadbhyaḥ  / dṛṣadaḥ,
    dṛṣadoḥ, dṛṣadām  / dṛṣadi, dṛṣadoḥ, dṛṣatsu //
