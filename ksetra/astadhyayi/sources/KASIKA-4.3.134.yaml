source_id: KASIKA-4.3.134
locator:
  sutra: 4.3.134
witness_text:
  sutra: tasya vikāraḥ
  commentary: tasya iti ṣaṣṭhī-samarthād vikāraḥ ity etasmin viṣaye yathāvihitaṃ pratyayo
    bhavati  / prakṛter avasthāntaraṃ vikāraḥ  / kim iha+udāharaṇam ? aprāṇyādy-udāttam
    avṛddhaṃ, yasya ca na anyat pratipadaṃ vidhānam  / aśmano vikāraḥ āśmanaḥ, āśmaḥ  /
    aśmano vikāre  / iti ṭilopaḥ pākṣikaḥ  / bhāsmanaḥ  / mārttikaḥ  / nitsvareṇādyudāttā
    ete  / tasya prakaraṇe tasya iti punar vacanaṃ śaiṣika-nivṛtty-artham  / vikārāvayavayordhādayo
    na bhavanti  / hālaḥ  / sairaḥ //
