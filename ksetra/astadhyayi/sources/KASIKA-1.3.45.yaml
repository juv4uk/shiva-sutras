locator:
  sutra: 1.3.45
witness_text:
  sutra: akarmakāc ca
  commentary: akartr-abhiprāya-artham idam  / kartr-abhiprāye hi anupasargāj jñaḥ
    (*1,3.76) iti vakṣyati  / jānāter akarmakād akarmaka-kriyāvacanād ātmanepadaṃ
    bhavati  / sarpiśo jānīte  / madhuno jānīte  / kathaṃ ca ayam akarmakaḥ ? na atra
    sarpir-ādi jñeyatvena vivakṣitam  / kiṃ tarhi ? jñāna-pūrvikāyāṃ pravṛttau karaṇatvena  /
    tathā ca jño 'vid-arthasya karaṇe (*2,3.51) iti ṣaṣṭhī vidhīyate -- sarpiṣo jānīte,
    madhuno jānīte  / sarpiśā upāyena pravartate ity arthaḥ  / akarmakāt iti kim ?
    svareṇa putraṃ jānāti //
