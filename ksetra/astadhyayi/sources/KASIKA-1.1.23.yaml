source_id: KASIKA-1.1.23
locator:
  sutra: 1.1.23
witness_text:
  sutra: bahu-gaṇa-vatu-ḍati saṅkhyā
  commentary: bahu gaṇa vatu ity eta saṅkhyā-sañjñā bhavanti  / bahukṛtvaḥ  / bahudhā  /
    bahukaḥ  / bahuśaḥ  / gaṇakṛtvaḥ  / gaṇadhā  / gaṇakaḥ  / gaṇaśaḥ  / tāvatkṛtvaḥ  /
    tāvaddhā  / tāvatkaḥ  / tāvacchaḥ  / katikṛtvaḥ  / katidhā  / katikaḥ  / katiśaḥ  /
    bahu-gaṇa-śabdayor vaipulye saṅghe ca vartamānayor iha grahaṇaṃ nāsti, saṅkhyā-vācinor
    eva  / bhūryādīnāṃ nivṛtty-arthaṃ saṅkhyā-sañjñā vidhīyate  / [#13] ardha-pūrva-padaśca
    pūraṇa-pratyayāntaḥ saṅkhyā-sañjño bhavati iti vaktavyaṃ samāsakan vidhy-artham  /
    ardha-pañcama-śūrpaḥ  / ardhaṃ pañcamaṃ yeśām iti bahuvrīhau kṛte ardha-pañcamaiḥ
    śūrpaiḥ krītaḥ  / taddhita-artha-iti samāsaḥ  / tatra dik-saṅkhye sañjñāyām (*2,1.50)
    ity anuvṛttes tataḥ saṅkhyā-pūrvasya dvigu-sañjñāyāṃ śūrpād añ anyatarasyām (*5,1.26)
    iti añ ṭhañ ca  / adhyardha-pūrva-dvigor lug-asañjñāyām (*5,1.28) iti luk  / ardha-pañcamakaḥ  /
    saṅkhyā-pradeśāḥ-saṅkhyā vaṃśyena (*2,1.19) ity evam ādayaḥ // [#12]
