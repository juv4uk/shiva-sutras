source_id: KASIKA-8.4.11
locator:
  sutra: 8.4.11
witness_text:
  sutra: prātipadikānta-num-vibhaktiṣu ca
  commentary: vā iti vartate  / prātipadikānte numi vibhaktau ca yo nakāraḥ tasya
    pūrvapadasthānnimittād uttarasy vā ṇakāra ādeśo bhavati  / prātipadikānte tāvat
    - māṣavāpiṇau, māṣavāpinau  / numi - māṣavāpāṇi, māṣavāpāni  / vrīhivāpāṇi, vrīhivāpāni  /
    vibhaktau - māṣavāpeṇa, māṣavāpena  / vrīhivāpeṇa, vrīhivāpena  / pūrvapadādhikārād
    uttarapadasya prātipadikastho yo 'ntyo nakāraḥ tasya+idaṃ ṇatvam iṣyati  / iha
    hina bhavati, gargāṇāṃ bhaginī gargabhaginī  / [#969] yadā tv evaṃ bhavati, gargāṇāṃ
    bhago gargabhagaḥ, gargabhago 'syā asti iti gargabhagiṇī iti, tadā mātṛbhogīṇavannityam
    eva ṇatvena bhavitavyam  / māṣavāpiṇī, māṣavāpinī ity atra tu gatikārakopapadānāṃ
    kṛdbhiḥ saha samāsavacanaṃ prākṣubutpatteḥ iti kṛdantena+eva samāse sati prātipadikasya
    uttarapadasya+eva sato nakāro bhavati  / tathā ca atra nuṃgrahaṇam kṛtam  / sa
    hi samudāyabhaktatvād uttarapadasya anto na bhavati  / yuvādīnāṃ pratiṣedho vaktavyaḥ  /
    āryayūnā  / kṣatriyayūnā  / prapakvāni  / dīrghāhnī śarad //
