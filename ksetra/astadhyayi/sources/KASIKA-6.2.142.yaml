source_id: KASIKA-6.2.142
locator:
  sutra: 6.2.142
witness_text:
  sutra: na+uttarapade 'nudāttādāv apṛthivī-rudra-pūṣa-manthiṣu
  commentary: uttarapade 'nudāttādau pṛthivī rudra pūṣamanthivarjite devatādvandve
    na+ubhe yugapat prakṛtisvare bhavataḥ  / indrāgnī  / indravāyū  / agnivāyuśabdau
    antodāttau  / uttarapadagrahaṇam anudāttādau ity uttarapadaviśeṣaṇaṃ yathā syāt,
    dvandvaviśeṣaṇaṃ mā bhūt iti  / anudāttādau iti vidhipratiṣedhayoḥ viṣayavibhāgārtham  /
    apṛthivyādiṣu iti kim ? dyāvāpṛthivyau  / dyāvāśabda ādyudātto nipātitaḥ  / pṛthivīśabdo
    ṅīṣpratyayāntatvād antodāttaḥ  / rudra - somārudrau  / roderṇiluk ca iti rudraśabdo
    rakpratyayānto 'ntodāttaḥ  / pūṣan - indrāpūṣaṇau  / svannukṣanpūṣan iti pūṣāntodātto
    nipātyate  / manthin - śukrāmanthinau mantho 'sya asti iti manthī  / innatatvād
    antodāttaḥ  / pṛthivyādiṣu tu ubhe yugapat prakṛtisvare bhavata eva //
