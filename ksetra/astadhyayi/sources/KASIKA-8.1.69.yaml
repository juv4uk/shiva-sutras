source_id: KASIKA-8.1.69
locator:
  sutra: 8.1.69
witness_text:
  sutra: kutsane ca supy agotrādau
  commentary: padāt iti nivṛttam  / sagatir api tiṅ iti vartate  / kutsane ca subante
    gotrādivarjite parataḥ sagatir api tiṅ agatir api anudātto bhavati  / pacati pūti  /
    prapacati pūti  / pacati mithyā  / prapacati mithyā  / kutsane iti kim ? pacati
    śobhanam  / supi iti kim ? pacati kliśnāti  / agotrādau iti kim ? pacati gotram  /
    pacati bruvam  / pacati pravacanam  / kriyākutsana iti vaktavyam  / kartuḥ kutsane
    mā bhūt, pacati pūtir devadattaḥ  / prapacatipūtiḥ  / pūtiś cānubandho bhavati
    iti vaktavyam  / tena ayaṃ cakārānubandhakatvādantodātto bhavati  / [#902] vibhāṣitaṃ
    ca api bahvartham anudāttam bhavati iti vaktavyam  / pacanti pūtiḥ, pacanti pūtiḥ  /
    prapacanti pūtiḥ, prapacanti pūtiḥ  / supi kutsane kriyāyā malopa iṣṭo 'tiṅi iti
    coktārtham  / pūtiś ca cānubandho vibhāṣitaṃ ca api bahvartham //
