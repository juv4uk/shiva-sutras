locator:
  sutra: 1.2.54
witness_text:
  sutra: lub yoga-aprakhyānāt
  commentary: lub apy aśiṣyaḥ  / yo 'yaṃ janapade lup (*4,2.81), varaṇā-ādibhyaś ca
    (*4,2.82) iti lub ucyate, [#46] ayaṃ na vaktavyaḥ  / kiṃ kāraṇam ? yoga-aprakhyānāt  /
    na hi pañcāla varaṇāḥ iti yogaḥ sambadhaḥ prakhyāyate  / na-etad upalabhāmahe
    vṛkṣayogānnagare varaṇāḥ iti  / kiṃ tarhi ? sañjñā etāḥ  / tasmād atra tasya nivāsaḥ
    (*4,2 69), adūra-bhavaś ca (*4,2.70) iti taddhito na+eva+utpadyate, kiṃ lupo vidhānena
    //
