source_id: KASIKA-5.4.47
locator:
  sutra: 5.4.47
witness_text:
  sutra: hīyamāna-pāpayogāc ca
  commentary: akartari tṛtīyāyāḥ (*5,4.46) ity eva  / hīyamānena pāpena ca yogo yasya
    tad vācinaḥ śabdāt parā yā tṛtīyā vibhaktir akartari tadantād vā tasiḥ pratyayo
    bhavati  / vṛttena hīyate vṛttato hīyate  / cāritreṇa hīyate cāritrato hīyate  /
    pāpayogāt - vṛttena pāpaḥ vṛttataḥ pāpaḥ  / cāritreṇa pāpaḥ cāritrataḥ pāpaḥ  /
    kṣepasya ca avivakṣāyāṃ tat tv ākhyāyām idam udāharaṇam  / kṣepe hi pūrveṇa+eva
    siddham  / akartari ity eva, devadattena hīyate //
