source_id: KASIKA-4.3.60
locator:
  sutra: 4.3.60
witness_text:
  sutra: antaḥ-pūrvapadāṭ ṭhañ
  commentary: avyayībhāvāt ity eva  / anytaḥ-śabdo vibhakty-arthe samasyate  / atapūrvapadāt
    avyayībhāvāṭ ṭhañ pratyayo bhavati tatra bhavaḥ ity etasmin viṣaye  / aṇo 'pavādaḥ  /
    āntarveśmikam  / āntargehikam  / [#412] samānaśabdād ṭhañ vaktavyaḥ  / samāne
    bhavaṃ sāmānikam  / tadādeś ca  / sāmānagrāmikam  / sāmānadeśikam  / adhyātmādibhyaś
    ca  / ādhyātmikam  / ādhidaivikam  / ādhibhautikam  / adhyātmādir ākṛtigaṇaḥ  /
    ūrdhvandamāc ca ṭhañ vaktavyaḥ  / aurdhvandamikaḥ  / ūrdhva-śabdena samānārtha
    ūrdhvandama-śabdaḥ  / ūrdhvadehāc ca  / aurdhvadehitkam  / lokottarapadāc ca  /
    aihalaukikam  / pāralaukikam  / mukhapārśva-śabdābhyāṃ tasantābhyāmīyaḥ pratyayo
    vaktavyaḥ  / mukhatīyam  / pārśvatīyam  / janaparayoḥ kuk ca  / janakīyam  / parakīyam  /
    madhyaśabdādīyaḥ  / madhyīyaḥ maṇmīyau ca pratyayau vaktavyau  / mādhyamam  /
    ṃdhyamīyam  / madhyo madhyaṃ dinaṇ ca asmāt  / madhye bhavaṃ mādhyandinam  / sthamno
    lug vaktavyaḥ  / aśvatthāmā  / ajināntāc ca  / vṛkājinaḥ  / siṃhājihaḥ  / [#413]
    samānasya tadādeś ca adhyātmādiṣu ca+iṣyate  / ūrdhvandamācca dehācca lokottarapadasya
    ca // mukhapārśvatasorīyaḥ kugjanasya parasya ca  / īyaḥ kāryo 'tha madhyasya
    maṇmīyau pratyayau tathā // madhyo madhyaṃ dinaṇ ca asmāt sthāmno lugajināt tathā
    //
