locator:
  sutra: 7.1.15
witness_text:
  sutra: ṅasi-ṅyoḥ samāt-sminau
  commentary: ṅasi ṅi ity etayor akārāntāt sarvanāmnaḥ uttarayoḥ smāt smin ity etāv
    ādeśau bhavataḥ  / ṅasi ity etasya smāt  / sarvasmāt  / viśvasmāt  / yasmāt  /
    tasmāt  / karmāt  / ṅi ity etasya smin  / sarvasmin  / viśvasmin  / yasmin  /
    tasmin  / anyasmin  / ataḥ ity eva, bhavataḥ  / bhavati  / sarvanāmnaḥ ity eva,
    vṛkṣāt  / vṛkṣe //
