locator:
  sutra: 4.3.11
witness_text:
  sutra: kālāṭ ṭhañ
  commentary: kāla-viśeṣa-vācinaḥ prātipadikāt ṭhañ pratyayo bhavati śaiṣikaḥ  / aṇo
    'pavādaḥ  / vṛddhāt tu chaṃ paratvād bādhate  / māsikaḥ  / ārdhamāsikaḥ  / sāṃvatsarikaḥ  /
    yathākathañcid guṇa-vṛttyā api kāle vartamānāt pratyaya iṣyate  / kādambapuṣpikam  /
    vraihipalālikam  / tatra jātaḥ (*4,3.25) iti prāgataḥ kālādhikāraḥ //
