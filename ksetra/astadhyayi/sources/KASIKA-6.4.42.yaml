source_id: KASIKA-6.4.42
locator:
  sutra: 6.4.42
witness_text:
  sutra: jana-sana-khanāṃ sañ-jhaloḥ
  commentary: jhali kṅiti iti ca anuvartate  / jana sana khana ity eteṣām aṅgānāṃ
    sani jhalādau kṅiti jhalādau pratyaye parataḥ ākāra ādeśo bhavati  / jan - jātaḥ  /
    jātavān  / jātiḥ  / san - sani siṣāsati  / sātaḥ  / sātavān  / sātiḥ  / khan -
    khātaḥ  / khātavān  / khātiḥ  / jhalgrahaṇaṃ sanviśeṣaṇārthaṃ kimartham anuvartyate
    ? iha mā bhūt, jijaniṣati  / sisaniṣati  / cikhaniṣati  / sanoteḥ sanīvantardha
    iti pakṣe iḍāgamaḥ  / tad iha sanotyartham eva saṅgrahaṇam  / atra jhalādau kṅiti
    sanoter vipratiṣedhād ātvam anunāsikalopaṃ bādhate  / ghumasthāgāpājahātisāṃ hali
    (*6,4.66) iti halgrahaṇam jñāpakam asminnasiddhaprakaraṇe vipratiṣedho bhavati
    iti // [#742]
