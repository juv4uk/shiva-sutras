source_id: KASIKA-3.4.70
locator:
  sutra: 3.4.70
witness_text:
  sutra: tayor eva kṛtya-kta-khal-arthāḥ
  commentary: tayor eva bhāvakarmaṇoḥ kṛtya-sañjñākāḥ kta-khal-arthāś ca pratyayā
    bhavanti  / eva-kāraḥ kartur apakarśaṇa-arthaḥ  / kṛtyāḥ karmaṇi - kartavyaḥ kaṭo
    bhavatā  / bhoktavya odano bhavatā  / bhāve - āśitavyaṃ bhavatā  / śayitavyaṃ
    bhavatā  / ktaḥ karmaṇi - kṛtaḥ kaṭo bhavatā  / bhukta odano bhavatā  / bhāve
    - āsitaṃ bhavatā  / śayitaṃ bhavatā  / khal-arthāḥ karmaṇi īṣatkaraḥ kaṭo bhavatā  /
    sukaraḥ  / duṣkaraḥ  / bhāve - īṣadāḍhyaṃbhavaṃ bhavatā  / svāḍhyaṃbhavaṃ bhavatā  /
    bhāvo cākramakebhyaḥ ity anuvṛtteḥ sakarmakebhyo bhāve na bhavanti //
