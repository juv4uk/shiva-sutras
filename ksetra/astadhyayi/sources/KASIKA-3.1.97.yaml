locator:
  sutra: 3.1.97
witness_text:
  sutra: aco yat
  commentary: ajantād dhātoḥ yat pratyayo bhavati  / takāro yato 'nāvaḥ (*6,1.213)
    iti svarārthaḥ  / geyam  / peyam  / ceyam  / jeyam  / aj-grahaṇaṃ kiṃ yāvatā halantāṇ
    ṇyataṃ vakṣyati ? ajantabhūta-pūrvād api yathā syāt, ditsyam, dhitsyam  / takiśasicatiyatijanīnām
    upasaṅkhyānam taki -- takyam  / śasi -- śasyam  / cati -- catyam  / yati -- yatyam  /
    jani -- janyam  / hano vā vadha ca  / vadhyam, ghātyam //
