source_id: KASIKA-8.1.20
locator:
  sutra: 8.1.20
witness_text:
  sutra: yuṣmad-asmadoḥ ṣaṣṭhī-caturthī-dvitīyāsthayor vān-nāvau
  commentary: yuṣmad asmad ity etayoḥ ṣaṣṭhīcaturthīdvitīyāsthayoḥ yathāsaṅkhyaṃ vām
    nau ity etāv ādeśau bhavataḥ, tau cānudāttau  / padasya, padāt, anudāttaṃ sarvamapādādau
    iti sarvam iha sambadhyate  / grāmo vāṃ svam  / janapado nau svam  / grāmo vāṃ
    dīyate  / [#889] janapado nau dīyate  / grāmo vāṃ paśyati  / janapado nau paśyati  /
    ekavacanabahuvacanāntayor ādeśāntar avidhānād dvivacanāntayoḥ etāv ādeśau vijñāyete  /
    ṣaṣṭhīcaturthīdvitīyāsthayoḥ iti kim ? grāme yuvābhyāṃ kṛtam  / sthagrahaṇaṃ śrūyamāṇavibhaktyartham  /
    iha mā bhūt, ayaṃ yuṣmatputraḥ ayam asmatputraḥ iti //
