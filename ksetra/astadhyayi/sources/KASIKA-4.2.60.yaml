source_id: KASIKA-4.2.60
locator:
  sutra: 4.2.60
witness_text:
  sutra: kratu-ukthādi-sūtrāntāṭ ṭhak
  commentary: kratuviśeṣa-vācibhyaḥ ukthādibhyaś ca sūtrāntāc ca ṭhak pratyayo bhavati
    tadadhīte tadveda ity etasmin viṣaye  / aṇo 'pavādaḥ  / agniṣṭomam adhīte veda
    vā āgniṣṭomikaḥ  / vājapeyikaḥ  / ukthādibhyaḥ - aukthikaḥ  / laukāyatikaḥ  /
    sūtrāntāt - vārttikasūtrikaḥ  / sāṅgrahasūtrikaḥ  / sūtrāntād akalpāder iṣyate  /
    kalpasūtram adhīte kālpasūtraḥ  / aṇ eva bhavati  / uktha-śabdaḥ keṣucid eva sāmasu
    rūḍhaḥ  / yajñāyajñīyāt pareṇa yāni gīyante, na ca tāny adhīyāne pratyaya iṣyate,
    kiṃ tarhi, sāmalakṣaṇe aukthikye vartamānaḥ uktha-śabdaḥ pratyayam utpādayati  /
    uktham adhīte aukthikaḥ  / aukthikyam adhīte ity arthaḥ  / aukthikya-śabdāc ca
    pratyayo na bhavaty eva, anabhidhānāt  / vidyālakṣaṇa-kalpasūtrāntād iti vaktavyam  /
    vāyasavidyikaḥ  / sārpavidyikaḥ  / gaulakṣaṇikaḥ  / āśvalakṣaṇikaḥ  / mātṛkalpikaḥ  /
    pārāśarakalpikaḥ  / vidyā ca na aṅga-kṣatra-dharma-saṃsarga-tri-pūrvā  / aṅgavidyām
    adhīte āṅgavidyaḥ  / kṣātravidyaḥ  / dhārmavidyaḥ  / sāṃsargavidyaḥ  / traividyaḥ  /
    ākhyānākhyāyiketihāsapurāṇebhyaṣ ṭhag vaktavyaḥ  / ākhyānākhyāyīkayor artha-grahaṇam,
    itihāsa-purāṇayoḥ svarūpa-grahaṇaṃ yāvakrītikaḥ  / praiyaṅgavikaḥ  / vāsavadattikaḥ  /
    saumanottarikaḥ  / aitihāsikaḥ  / paurāṇikaḥ  / sarvasāder dvigoś ca laḥ  / sarvavedaḥ  /
    sarvatantraḥ  / sādeḥ - savārttikaḥ  / sasaṅgrahaḥ  / dvigoḥ - dvivedaḥ  / pañcavyākaraṇaḥ  /
    anusūrlakṣyalakṣaṇe ca  / anusūrnāmagranthaḥ, tam adhīte ānusukaḥ  / lākṣikaḥ  /
    lākṣaṇikaḥ  / ikan bahulaṃ padottarapadāt  / pūrvapadikaḥ  / śataṣaṣṭeḥ ṣikan
    patho bahulam  / śatapathikaḥ  / śatapathikī  / ṣaṣṭipathikaḥ  / ṣaṣṭipathikī  /
    bahula-grahaṇād aṇ api bhavati  / śātapathaḥ  / ṣāṣṭipathaḥ  / uktha  / lokāyata  /
    nyāya  / nyāsa  / nimitta  / punarukta  / nirukta  / yajña  / carcā  / dharma  /
    krametara  / ślakṣṇa  / saṃhitā  / pada  / krama  / saṅghāta  / vṛtti  / saṅgraha  /
    guṇāguṇa  / āyurveda  / sūtrāntādakalpādeḥ  / vidyālakṣaṇakalpāntāt  / vidyācānaṅgakṣatradharmasaṃsargatripūrvā  /
    ākhyānākhyāyiketihāsapurāṇebhyaṣ ṭhak  / sarvasāder dvigoś ca laḥ  / anusūrlakṣyalakṣaṇe
    ca  / dvipadi jyotiṣi  / anupada  / anukalpa  / anuguṇa  / ikanbahulaṃ padottarapadāt  /
    śataṣaṣṭeḥ ṣikan  / patho bahulam //
