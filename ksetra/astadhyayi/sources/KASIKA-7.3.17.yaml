source_id: KASIKA-7.3.17
locator:
  sutra: 7.3.17
witness_text:
  sutra: parimāṇāntasya asañjñā-śāṇayoḥ
  commentary: parimāṇāntasya aṅgasya saṅkhyāyāḥ paraṃ yad uttarapadaṃ tasya acāmāder
    acaḥ vṛddhir bhavati taddhite ñiti, ṇiti, kiti ca parataḥ, sañjñāyāṃ viṣaye śāṇe
    ca+uttarapade na bhavati  / dvau kuḍavau prayojanam asya dvikauḍavikaḥ  / dvābhyāṃ
    suvarṇābhyāṃ krītaṃ dvisauvarṇikam  / vibhāṣā kārṣāpaṇasahasrābhyāṃ (*5,1.29)
    ity atra suvarṇaśatamānayor upasaṅkhyānam iti luko vikalpaḥ  / dvābhyāṃ niṣkābhyāṃ
    krītam dvitripūrvān niṣkāt (*5,1.30) dvinaiṣkikam  / asañjñāśāṇayo iti kim ? pāñcalohitikam  /
    pāñcakalāpikam  / pañca lohityaḥ parimāṇamasya, pañca kalāpāḥ parimāṇamasya iti
    vihṛhya tad asya pariṃāṇam (*5,1.57) iti yogavibhāgāt pratyayaḥ, taddhitāntaścāyaṃ
    samudāyaḥ sañjñā  / [#835] dvābhyāṃ śāṇābhyāṃ krītam dvai śāṇam  / traiśāṇam  /
    śāṇād vā (*5,1.35), dvitripūrvādaṇ ca (*5,1.36) ityaṇ pratyayaḥ  / asañjñāśāṇakulijānām
    iti kecit paṭhanti  / dve kulije prayojanamasya dvaikulijikaḥ //
