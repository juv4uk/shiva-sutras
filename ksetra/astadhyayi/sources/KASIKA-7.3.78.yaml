source_id: KASIKA-7.3.78
locator:
  sutra: 7.3.78
witness_text:
  sutra: pā-ghrā-dhmā-shā-mnā-dāṇ-dṛśy-arti-sarti-śada-sadāṃ piba-jighra-dhama-tiṣtha-mana-yaccha-paśya-rccha-dhau-śīya-sīdāḥ
  commentary: pa ghrā dhmā sthā mnā dāṇ dṛśi arti sarti śada sada ity eteṣāṃ piba
    jighra dhama tiṣtha mana yaccha paśya ṛccha dhau śīya sīda ity ete ādeśā bhavanti
    śiti parataḥ  / pā - pibati  / ghrā - jighrati  / dhmā - dhamati  / sthā - tiṣthati  /
    manā - manati  / dāṇ - yacchati  / dṛśi - paśyati  / arti - ṛcchati  / sarti -
    dhāvati  / śada - śīyate  / sada - sīdati  / pibater laghūpadhaguṇaḥ prāpnoti,
    saḥ aṅgavṛtte punar vṛttāvavidhirniṣṭhitasya iti na bhavati  / atha vā akārānto
    'yam ādeśaḥ ādyudātto nipātyate  / [#851] sartervegitāyāṃ gatau dhāvādeśam icchanti  /
    anyatra sarati, anusarati ity eva bhavati //
