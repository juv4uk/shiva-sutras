source_id: KASIKA-6.1.2
locator:
  sutra: 6.1.2
witness_text:
  sutra: ajāder dvitīyasya
  commentary: prathama-dvirvacana-apavādo 'yam  / ajāder dvitiyasya ekaco dvirvacanam
    adhikriyate  / ac ādir yasya dhātoḥ tadavayavasya dvitīyasya ekāco dve bhavataḥ  /
    aṭiṭiṣati  / aśiśiṣati  / aririṣati  / arteḥ smi-pūṅ-r-añjv-aśāṃ sani (*7,2.74)
    iti iṭ kriyate  / tasmin kṛte guṇe ca raparatve ca dvirvacane 'ci (*1,2.59) iti
    sthānivadbhāvaḥ prāpnoti  / tatra pratividhānaṃ dvirvacananimitte 'ci iti ucyate  /
    na ca atra dvirvacananimittamiṭ  / kiṃ tarhi ? kāryī  / na ca kāryī nimittatvena
    aśrīyate  / tathā hi - kṅinimittayor guṇavṛddhyoḥ pratiṣedho vidhīyamānaḥ śayitā
    ity atra na bhavati, na hi kāryiṇaḥ śīṅo guṇaṃ prati nimittabhāvaḥ iti  / atra
    kecid ajādeḥ iti karmadhārayāt pañcamīm icchanti  / ac ca asau ādiś ca ity ajādiḥ,
    tasmāt ajāder uttarasya ekāco dve bhavataḥ iti  / teṣāṃ dvitīyasya iti vispaṣṭarthaṃ
    draṣṭāvyam //
