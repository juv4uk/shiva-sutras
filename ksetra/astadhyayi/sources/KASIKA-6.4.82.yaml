source_id: KASIKA-6.4.82
locator:
  sutra: 6.4.82
witness_text:
  sutra: er anekāco 'samyogapūrvasya
  commentary: dhātoḥ iti vartate, tena saṃyogo viśeṣyate  / dhātor avayavaḥ saṃyogaḥ
    pūrvo yasmād ivarṇāna bhavati asāvasaṃyogapūrvaḥ, tadantasya aṅgasya anekāco 'ci
    parato yaṇādeśo bhavati  / ninyatuḥ  / ninyuḥ  / unnyau  / unnyaḥ  / grāmaṇyau  /
    grāmaṇyaḥ  / eḥ iti kim ? asaṃyogapūrvagrahaṇam ivarṇaviśeṣaṇaṃ yathā syāt, aṅgaviśeṣaṇaṃ
    mā bhūt iti  / luluvatuḥ, luluvuḥ ity etat tu oḥ supi (*6,4.83) iti niyamādapi
    sidhyati  / anekācaḥ iti kim ? niyau  / niyaḥ  / asaṃyogapūrvasya iti kim ? yavakriyau  /
    yavakriyaḥ  / dhātunā saṃyogaviśeṣaṇam kim ? iha api syād unnyau, unnyaḥ iti  /
    gatikārakābhyām anyapūrvasya neṣyate, paramaniyau, paramaniyaḥ iti //
