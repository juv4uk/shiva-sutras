witness_text:
  sutra: puṣkara-ādibhyo deśe
  commentary: puṣkara ity evam ādibhyaḥ prātipadikebhya iniḥ pratyayo bhavati samudāyena
    ced deśo 'bhidhīyate  / puṣkariṇī  / padminī  / deśe iti kim ? puskaravān hastī  /
    iniprakaraṇe balād bahūr upūrvād upasaṅkhyānam  / bāhuvalī  / ūrubalī  / sarvādeś
    ca  / sarvadhanī  / sarvabījī  / sarvakeśī naṭaḥ  / [#530] arthāc ca asannihite  /
    arthī  / asannihite iti kim ? arthavān  / tadantāc ca+iti vaktavyam  / dhānyārthī  /
    hiraṇyārthī  / puṣkara  / padma  / utpala  / tamāla  / kumuda  / naḍa  / kapittha  /
    bisa  / mṛṇāla  / kardama  / śālūka  / vigarha  / karīṣa  / śirīṣa  / yavāsa  /
    pravāsa  / hiraṇya  / puṣkarādiḥ //
