source_id: KASIKA-7.3.50
locator:
  sutra: 7.3.50
witness_text:
  sutra: ṭhasya+ikaḥ
  commentary: aṅgasya nimittaṃ yaḥ ṭhaḥ, kaś ca aṅgasya nimittam, pratyayaḥ, tasya
    pratyayaṭhasya ikaḥ ity ayam ādeśo bhavati  / prāg vahateṣ ṭhak (*4,4.1) - ākṣikaḥ  /
    śālākikaḥ  / lavaṇāṭ ṭhañ (*4,4.52) lāvaṇikaḥ  / ṭhagādiṣu yadi varṇamātraṃ pratyayaḥ,
    uccāraṇārtho 'kāraḥ, tadā iha api akāra uccāraṇārthaḥ, varnamātraṃ tu sthānitvena+upādīyate  /
    saṅghātagrahaṇe tu pratyaye 'tra api saṅghātagrahaṇam eva  / tatra kaṇeṣṭhaḥ kaṇṭhaḥ
    ity evam ādīnām uṇādīnām uṇādayo bahulam (*3,3.1)iti na bhavati  / mathitaṃ paṇyam
    asya māthitikaḥ ity atra tu yasya+iti ca (*6,4.148) iti lope kṛte is-us-uk-tāntāt
    kaḥ (*7,3.51) iti sthānivadbhāvādikasya kādeśaḥ prāpnoti, sannipātalakṣaṇo vidhir
    animittaṃ tadvighātasya iti na bhavati  / yasyeti ca iti lopasya sthānivadbhāvādvā  /
    pūrvasmādapi hi vidhau sthānivadbhāvaḥ //
