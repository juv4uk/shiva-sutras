source_id: KASIKA-5.4.128
locator:
  sutra: 5.4.128
witness_text:
  sutra: dvidaṇḍyādibhyaś ca
  commentary: dvidaṇḍyādayaḥ śabdāḥ ic pratyayāntāḥ sādhavo bhavanti  / dvidaṇḍyādibhyaḥ
    iti tādarthye eṣā caturthī, na pañcamī  / dvidaṇḍyādyartham ic pratyayo bhavati
    tathā bhavati yathā dvidaṇḍyādayaḥ siddyanti ity arthaḥ  / samudāyanipātanāc ca
    arthaviśeṣe 'varudhyante  / dvidaṇḍi praharati  / dvimusali praharati  / iha na
    bhavati, dvidaṇḍā śālā iti  / bahuvrīhyadhikāre 'pi tatpuruṣāt kvacid vidhānam
    icchanti  / nikucya karṇau dhāvati nikucyakarṇi dhāvati  / prohya pādau hastinaṃ
    vāhayati prodyapādi hastinaṃ vāhayati  / mayūravyaṃsakāditvāt samāsaḥ // dvidaṇḍi  /
    dvimusali  / ubhāñjali  / ubhayāñjali  / ubhākarṇi  / ubhayākarṇi  / ubhādanti  /
    ubhayādanti  / ubhāhasti  / ubhayāhasti  / ubhāpāṇi  / ubhayāpāṇi  / ubhābāhu  /
    ubhayābāhu  / ekapadi  / prohyapadi  / āḍhyapadi  / sapati  / nikucyakarṇi  /
    saṃhatapucchi  / ubhābāhu, ubhayābāhu iti nipātanād icpratyayalopaḥ  / pratyayalakṣaṇena
    avyayībhāvasañjñā // [#588]
