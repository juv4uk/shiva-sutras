source_id: KASIKA-5.1.57
locator:
  sutra: 5.1.57
witness_text:
  sutra: tad asya parimāṇam
  commentary: tat iti prathamāsamarthāt asya iti ṣaṣṭhyarthe yathāvihitaṃ pratyayo
    bhavati yat prathamāsamarthaṃ parimāṇaṃ cet tad bhavati  / prasthaḥ parimāṇam
    asya prāsthiko rāśiḥ  / khāraśatikaḥ  / śatyaḥ, śatikaḥ  / sāhasraḥ  / drauṇikaḥ  /
    kauḍavikaḥ  / varṣaśataṃ parimāṇamasya vārṣaśatikaḥ  / vārṣasahasrikaḥ  / ṣaṣṭirjīvitaparimāṇam
    asya iti ṣāṣṭikaḥ  / sāptatikaḥ  / samarthavibhaktiḥ pratyayārthaś ca pūrvasūtrād
    eva anuvartiṣyate, kim arthaṃ punar anayor upādānam ? punar vidhānārtham  / dve
    ṣaṣṭī jīvitaparimāṇam asya dviṣāṣṭikaḥ  / dvisāptatikaḥ  / punar vidhāna-sāmarthyād
    adhyardha-pūrvadvigor luk na bhavati // [#480]
