source_id: KASIKA-7.4.93
locator:
  sutra: 7.4.93
witness_text:
  sutra: sanval laghuni caṅpare 'nag lope
  commentary: laghuni dhātvakṣare parato yo 'bhyāsaḥ tasya caṅpare ṇau parataḥ sanīva
    kāryaṃ bhavati anaglope  / sanyataḥ (*7,4.79) ity uktam, caṅpare 'pi tathā  /
    [#880] acīkarat  / apīpacat  / oḥ puyaṇjyapare (*7,4.80) ity uktam, caṅpare 'pi
    tathā  / apīpavat  / alīlavat  / ajījavat  / sravatiśṛṇotidravatipravatiplavaticyavatīnāṃ
    vā (*7,4.81) ity uktam, caṅpare 'pi tathā  / asisravat, asusravat  / aśiśravat,
    aśuśravat  / adidravat, adudravat  / apipravat, apupravat  / apiplavat, apuplavat  /
    acicyavat, acucyavat  / lughuni iti kim ? atatakṣat  / ararakṣat  / jāgarayateḥ
    ajajāgarat  / atra kecid gaśabdam labhumāśritya sanbadbhāvam icchanti, sarvatraiva
    laghorānantaryam abhyāsena na asti iti vyavadhāne 'pi vacanaprāmāṇyād bhavitavyam,
    tad asat  / yena na avyavadhānaṃ tena vyavahite 'pi vacanaprāmāṇyāt ity ekena
    vyavadhānam āśrīyate, na punar anekena  / yady evam, katham acikṣaṇat iti ? ācāryapravṛttir
    jñāpayati bhavaty evaṃ jātīyakānām ittvam iti  / yad ayaṃ tad bādhanārthaṃ samratyādīnām
    atvam vidadhāti  / caṅpare iti kim ? ahaṃ papaca  / paragrahaṇaṃ kim ? caṅi eva
    kevale mā bhūt, acakamata  / anaglope iti kim ? acakathat  / dṛṣadamākhyātavān
    adadṛṣat  / vāditavantaṃ prayojitavān avīvadat ity atra yo 'sau ṇau ṇerlopo nāsāvaglopa
    ity āśrīyate  / kiṃ kāraṇam ? caṅpare iti ṇijāter nimittatvena ākṣepāt, tato 'nyasya
    ako lopaḥ parigṛhyate  / mīmādīnām atra grahaṇāt sanvadbhāvena abhyāsalopo na
    bhavati ity uktam  / kiṃ ca sanvat iti sanāśrayaṃ kāryamatidiśyate, na ca lopaḥ
    sanam eva apekṣate, kiṃ tarhi, isbhāvādyapi  / tadabhāvāt amīmapat ity ādau abhyāsalopo
    na bhaviṣyati //
