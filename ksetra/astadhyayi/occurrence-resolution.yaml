# Вирішення структурних неоднозначностей у каноні
#
# Оновлено 2026-09-30 (#53, агент «шіва»): джерело виняткового правила для aṇ знайдено в
# Kāśikā (kAshikAvRRitti.txt), номер сутри виправлено з 8.3.32 на 1.1.69; для другого h
# знайдено пояснення самої Kāśikā (рядки 165-176). Позначки: «цитата» = слова Kāśikā,
# «висновок» = міркування редактора цього файлу. У цитатах опущено зірочки перед номерами
# сутр (*१,१.६९ → १,१.६९); текст Kāśikā (GRETIL-похідний) має транслітераційний шум.

resolutions:
  - anomaly: "Два it-маркери 'ṇ'"
    location: "Sūtra 1 (a i u ṇ) та Sūtra 6 (l ṇ)"
    issue: "Коли правило Паніні посилається на pratyāhāra з маркером 'ṇ' (напр. 'aṇ' або 'iṇ'), до якого з двох 'ṇ' слід утворювати множину?"
    paninian_resolution:
      rule_aṇ: "Pratyāhāra 'aṇ' утворюється до першого 'ṇ' (sutra 1). Результат: [a, i, u]. Виняток: у правилі 1.1.69 (aṇudit savarṇasya cāpratyayaḥ) 'aṇ' утворюється до другого 'ṇ' (sutra 6)."
      rule_iṇ: "Pratyāhāra 'iṇ' завжди утворюється до другого 'ṇ' (sutra 6)."
    correction: "2026-09-30 (#53): раніше виняток приписували правилу '8.3.32 (aṇuḍit…)'. Це помилка: 8.3.32 = ṅamo hrasvād aci ṅamuṇ nityam (pratyāhāra ṅam, не aṇ); фраза 'aṇudit…' це 1.1.69."
    source:
      - work: "Kāśikāvṛtti, вступ до Śiva-sūtras, коментар на сутру 'la ṇ' (kAshikAvRRitti.txt, рядки 99-103)"
        quote: "इण्ग्रहणानि सर्वाणि परेण णकारेण । अण्ग्रहणानि तु पूर्वेण, अणुदित्सवर्णस्य चाप्रत्ययः (१,१.६९) इत्येतदेवेकं परेण ।"
        kind: "цитата"
      - work: "Kāśikāvṛtti на 1.1.69 (kAshikAvRRitti.txt, рядки 1622-1623)"
        quote: "अणुदित्सवर्णस्य चाप्रत्ययः (१,१.६९) । परेण णकारेण प्रत्याहारग्रहणम् ।"
        kind: "цитата"
      - work: "Kāśikāvṛtti на 5.2.55 (kAshikAvRRitti.txt, рядок 43710)"
        quote: "पूर्वेण च णकारेण अण्ग्रहणम्"
        kind: "цитата (підтверджує 'aṇ = перший ṇ' в іншому правилі)"
      - work: "Kāśikāvṛtti на 8.3.32 (kAshikAvRRitti.txt, рядок 113)"
        quote: "ङमो ह्रस्वादचि ङमुण्नित्यम् (८,३.३२) इति ङकारेण"
        kind: "цитата (8.3.32 у Kāśikā названо прикладом pratyāhāra ṅam, утвореного через ṅ, а не aṇ)"
    notes:
      - "Правила про вибір входження маркера в самих сутрах Aṣṭādhyāyī немає: вибір задано перерахуванням вживань у Kāśikā (пояснення до кожного маркера у вступі до Śiva-sūtras). Це висновок: у корпусі ksetra/ я не шукав Mahābhāṣya."
    status: "formalized_by_tradition"
    source_status: "located: Kāśikā (вступ до Śiva-sūtras і 1.1.69), не самі сутри Aṣṭādhyāyī"

  - anomaly: "Два входження звуку 'h'"
    location: "Sūtra 5 (h y v r ṭ) та Sūtra 14 (h l)"
    issue: "Чому звук 'h' дублюється? Яке 'h' використовується при утворенні pratyāhāra?"
    paninian_resolution:
      reason: "Дублювання необхідне для включення 'h' у дві різні макро-множини приголосних, які потрібні для різних фонетичних правил."
      usage_first_h: "Перше 'h' (sutra 5) використовується у множинах aṭ, aś, haś, iṇ, etc. Це групує 'h' із сонорними та дзвінкими."
      usage_second_h: "Друге 'h' (sutra 14) використовується у множинах śal, val, ral, jhal. Це групує 'h' із фрикативними (ś, ṣ, s)."
    source:
      - work: "Kāśikāvṛtti, вступ до Śiva-sūtras, коментар на сутру 'h l' (kAshikAvRRitti.txt, рядки 165-173)"
        quote: "अथ किमर्थमुपदिष्टोऽपि हकारः पुनरुपदिश्यते? कित्त्व विकल्पक्ष इड्विधयो यथा स्युः इति । स्निहित्वा, स्नेहित्वा इत्यत्र रलो व्युपधाद्धलादेः संश्च (१,२.२६) इति कित्त्वं वा यथा स्यात् । लिहेः अलिक्षतिति शल इगुपधादनिटः क्षः (३,१.४५) इति क्षो यथा स्यात् । … रुदिहि, स्वपिहि इति वलादिलक्षण इड्यथा स्यात् । अदाग्धाम् । झल्ग्रहणेषु च हकारस्य ग्रहणं यथा स्यात् ।"
        kind: "цитата (навіщо друге h: ral 1.2.26, śal 3.1.45, val (valādi iṭ), jhal)"
      - work: "Kāśikāvṛtti, там само (kAshikAvRRitti.txt, рядки 174-176)"
        quote: "यद्येवम्, ह य व र डित्यत्र तर्हि किमर्थमुपदिश्यत्? महां हि सः; देवा हसन्ति इत्यत्र अड्ग्रहणेषु च अश्ग्रहणेषु च हकारस्य ग्रहणं यथा स्यात् । ब्राह्मणो हसति हशि च (६,१.११४) इत्युत्वं यथा स्यात् ।"
        kind: "цитата (навіщо перше h: aṭ, aś; приклад haśi ca 6.1.114)"
    notes:
      - "Збігається з переліками в полях usage_first_h і usage_second_h (aṭ, aś / śal, val, ral, jhal): це підтверджено цитатами вище. Формулювання 'групує h із сонорними та дзвінкими / із фрикативними' Kāśikā не наводить: це редакторський висновок, тому reason/usage_* лишено як переказ, а не як цитату."
      - "Kāśikā (рядок 106) окремо пояснює, що 'a' у 'ha' є лише для вимови (uccāraṇa), не маркером: «हकारादिष्वकार उच्चारणार्थः, न अनुबन्धः»."
    status: "formalized_by_tradition"
    source_status: "located: Kāśikā (вступ до Śiva-sūtras); раніше було 'functional_design'"
