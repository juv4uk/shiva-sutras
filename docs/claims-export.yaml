# Claims Export Registry (shiva-sutras)

*Реєстр експортованих тверджень для downstream-споживачів (наприклад, `my-lisp-panini`).*
*Машиночитаний формат: YAML. Канонічний реєстр внутрішніх результатів — `docs/RESULTS_LEDGER.md`.*

Статус: **EXPORT REGISTRY** (постійний інтерфейс)
Протокол: `docs/epistemic-coordination.md`
Revision baseline: `0f6110dd5231e55b9b4a412d457e1df6371b873c` (2026-08-17)

История ревізій: `a8391c4` (2026-08-15, initial) → `0f6110d` (2026-08-17, adds H-SS-EXT-001..003 per REM-008).

