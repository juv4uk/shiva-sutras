*Реєстр експортованих тверджень для downstream-споживачів (наприклад, `my-lisp-panini`).*
*Машиночитаний формат: YAML. Канонічний реєстр внутрішніх результатів — `docs/RESULTS_LEDGER.md`.*

Статус: **EXPORT REGISTRY** (постійний інтерфейс)
