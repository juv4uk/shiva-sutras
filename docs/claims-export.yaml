## Правила експорту

1. Кожен claim має стабільний ID з префіксом `SS-`.
2. `status` використовує епістемічні статуси з `docs/epistemic-coordination.md` (наприклад, `PROVED-IN-MODEL`, `RESOLVED`, `SUPPORTED`, `FALSIFIED`, `UNRESOLVED`).
3. `scope` обов'язковий: математичний результат всередині моделі не є доказом історичного задуму Паніні.
4. `revision` фіксує коміт, на якому claim стабільний.
5. Downstream імпортує claim разом зі `status_at_import` та `revision`; підвищення статусу downstream-контекстом заборонено.

