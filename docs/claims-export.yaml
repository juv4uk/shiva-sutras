# Claims Export Registry (shiva-sutras)

*Реєстр експортованих тверджень для downstream-споживачів (наприклад, `my-lisp-panini`).*
*Машиночитаний формат: YAML. Канонічний реєстр внутрішніх результатів — `docs/RESULTS_LEDGER.md`.*

Статус: **EXPORT REGISTRY** (постійний інтерфейс)
Протокол: `docs/epistemic-coordination.md`
Revision baseline: `cd13c85f1eab19ab16137da2664d52eeff97a626` (2026-09-07)

История ревізій: `a8391c4` (2026-08-15, initial) → `0f6110d` (2026-08-17, adds H-SS-EXT-001..003 per REM-008) → `cd13c85` (2026-09-07, adds L-001-001..004 per L-001 completion).

---

## Правила експорту

1. Кожен claim має стабільний ID з префіксом `SS-` або `L-001-`.
2. `status` використовує епістемічні статуси з `docs/epistemic-coordination.md` (наприклад, `PROVED-IN-MODEL`, `RESOLVED`, `SUPPORTED`, `FALSIFIED`, `UNRESOLVED`).
3. `scope` обов'язковий: математичний результат всередині моделі не є доказом історичного задуму Паніні.
4. `revision` фіксує коміт, на якому claim стабільний.
5. Downstream імпортує claim разом зі `status_at_import` та `revision`; підвищення статусу downstream-контекстом заборонено.

