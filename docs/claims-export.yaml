Revision baseline: `9987e0e` (2026-09-07)

История ревізій: `a8391c4` (2026-08-15, initial) → `0f6110d` (2026-08-17, adds H-SS-EXT-001..003 per REM-008) → `cd13c85` (2026-09-07, adds L-001-001..004 per L-001 completion) → `72046d3` (2026-09-07, adds L-001-005 computational coherence) → `c012ead` (2026-09-07, updates L-001-005 to 116/116=100% + adds L-001-006 staged sandhi) → `9987e0e` (2026-09-07, updates L-001-005 to 152/152=100% with lṛṭ).

