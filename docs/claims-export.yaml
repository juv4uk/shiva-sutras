## Експортовані claims

### SS-CANON-001 — Канон 14 Śiva-sūtras
- **statement**: Канонічна послідовність 14 сутр із it-маркерами є задокументованим порядком, на який посилається PĀṆINIAN FORMAL USE.
- **scope**: Канон як переданий текст; не стосується доведення його оптимальності чи історичного задуму.
- **status**: `RESOLVED` (проvenance зафіксовано; текст узгоджено з традиційним каноном).
- **evidence**: `ksetra/canon/`; `ksetra/astadhyayi/pratyahara-construction.yaml`.
- **limitations**: Історичне походження окремих рукописних свідчень — окреме джерелознавче питання.

### SS-PRATYAHARA-001 — Механіка pratyāhāra (ādir antyena sahetā)
- **statement**: Механізм pratyāhāra: початковий звук + кінцевий it-маркер позначає множину звуків між ними (включно, без it-маркерів), згідно з Aṣṭādhyāyī 1.1.71.
- **scope**: Формальна механіка в системі Паніні.
- **status**: `SUPPORTED` (текст 1.1.71 + використання в Aṣṭādhyāyī).
- **evidence**: `ksetra/astadhyayi/pratyahara-construction.yaml`; `ksetra/astadhyayi/pratyahara-usage.yaml`; `ksetra/astadhyayi/occurrence-resolution.yaml`.
- **limitations**: Чи є множини "компактним дескриптором" у сучасному CS-сенсі — не встановлено і не є предметом цього claim.

### SS-ORDER-001 — Неунікальність C1P порядку
- **statement**: Сама вимога безперервності (C1P) не зумовлює унікальність канонічного порядку; існує понад 10,000 валідних топологій.
- **scope**: 42-класова формальна модель.
- **status**: `PROVED` (внутрішній: `M-001`). Як гіпотеза унікальності — `FALSIFIED`.
- **evidence**: `experiments/ordering/c1p_sat_ablation.py`.
- **limitations**: Не стосується оптимальності канонічного порядку за іншими метриками.

### SS-MARKERS-001 — Глобальний мінімум маркерів M_min = 14
- **statement**: Мінімальна кількість it-маркерів для адресації 42 класів дорівнює 14; канонічний порядок досягає цього оптимуму.
- **scope**: 42-класова формальна модель, стандартне інтервальне представлення.
- **status**: `PROVED-IN-MODEL` (внутрішній: `M-002`).
- **evidence**: CP-SAT UNSAT proof (`experiments/ordering/marker_optimizer.py`).
- **limitations**: Доведено для заданої моделі; не доводить історичний задум Паніні.

### SS-MARKERS-002 — Рівно два оптимальні структурні класи
- **statement**: Існує рівно 2 структурні класи, що досягають M_min = 14.
- **scope**: 42-класова формальна модель.
- **status**: `PROVED-IN-MODEL` (внутрішній: `M-003`).
- **evidence**: Exhaustive exclusion proof.
- **limitations**: Внутрішньомодельний результат.

### SS-MARKERS-003 — Унікальність канонічного класу (Class B) для безколізійної адресації
- **statement**: Канонічна структура (Class B) є єдиною серед оптимальних, що дозволяє безколізійну ідентифікацію маркерів.
- **scope**: 2 оптимальні структурні класи, семантичне іменування пратяхар.
- **status**: `PROVED-IN-MODEL` (внутрішній: `M-005`).
- **evidence**: Address Semantics Fingerprint.
- **limitations**: Не доводить лінгвістичну незалежність 42 класів.

### SS-CORPUS-001 — GRETIL корпус з проvenance
- **statement**: Доступний незалежний корпус Kāśikā/Aṣṭādhyāyī з підтвердженим походженням (sha256 + manifest).
- **scope**: Kāśikāvṛtti (Sharma ed.) + Aṣṭādhyāyī (Baums) через GRETIL.
- **status**: `RESOLVED` / `AUTHENTICITY-VERIFIED (Attributed)` (внутрішній: `L-002`).
- **evidence**: `external_data/gretil_raw/manifest.json`; 3951 parsed sūtras; cross-witness diff (1891 AGREES / 2013 VARIANTS / 22 CONFLICTS / 57 MISSING).
- **limitations**: Редакційні розбіжності (1.1.46–75, 8.3.118–119, 2.4.27) задокументовано; для них REAL не призначається без ад'юдикації.

### SS-EPISTEMIC-001 — Reproducibility ≠ Authenticity
- **statement**: Відтворюваність джерела (checksum match) не доводить його історичну автентичність.
- **scope**: Epistemic pipeline, provenance.
- **status**: `PROVED` (як принцип; гіпотеза оберненого — `FALSIFIED`, внутрішній: `E-001`).
- **evidence**: `validator_v2.py`; `ksetra/EPISTEMIC_CONTRACT.md`.
- **limitations**: Не заперечує корисність checksum як перевірки тотожності байтів.

### SS-EPISTEMIC-002 — False Certainty Rate 83.3%
- **statement**: Автоматичний семантичний агент генерує FCR 83.3% на нестачі доказів (25/30 RESOLVED помилково).
- **scope**: Synthetic Batch-2 benchmark.
- **status**: `MEASURED` (внутрішній: `E-002`).
- **evidence**: `experiments/blind_reconstruction/reports/batch_2_synthetic_expert_gain_report.md`.
- **limitations**: Виміряно на синтетичному (відтворюваному) корпусі; перенесення на REAL-корпус — відкрите питання.

### H-SS-EXT-001 — Фонологічна онтологія вимірів (44 dimensions)
- **statement**: 44 фонологічні виміри можна екстрагувати з трьох мовних реєстрів (санскрит, українська, англійська), класифіковані на 4 онтологічні рівні (segment-feature, phoneme-system-feature, language-system-feature, process-allophony).
- **scope**: Мета-онтологія фонологічного порівняння. Не є твердженням про самі Śiva-sūtras.
- **status**: `SUPPORTED` (per `REM-008`/`REM-009`; нормалізовано з невизначеного "STRENGTHENED" — цього статусу немає в словнику `EPISTEMIC_CONTRACT.md`).
- **evidence**: `RECON-001` — незалежний "сліпий" агент підтвердив 44 виміри без доступу до оригінальної класифікації sarvam-агента; `docs/reconciliation-sarvam-blind-001.md`; `hypotheses/independent-claims-h001-h003-sarvam.yaml`.
- **limitations**: Похідне лише від 3 мов; 4-та мова (напр. німецька) може виявити невраховані виміри. RECON-001 підтверджує лише екстракцію 44 вимірів, **не** 4-рівневу класифікацію саму по собі (див. `ECA-013`). Модель blind-агента не персистована як артефакт (`ECA-011`) — reconciliation-звіт є єдиним записом, не відтворюваним експериментом.

### H-SS-EXT-002 — Багаторівнева структура порівняння замінює пласку shared/differences
- **statement**: Поточна пласка структура `shared`/`differences` в мовних реєстрах-розширеннях змішує 4 онтологічно різні типи інформації; запропонована структура організовує порівняння за рівнем (segment/phoneme_system/language_system/processes).
- **scope**: Структура cross-language реєстрів порівняння (`extensions/*.yaml`). Не стосується канону.
- **status**: `HYPOTHESIS` (не підвищено — на відміну від H-SS-EXT-001, ця гіпотеза не має незалежного підтвердження, лише спостереження).
- **evidence**: 24/44 українських і 22/44 англійських фонем мають `differences`-поля, що змішують рівні (виміряно на реєстрах станом на 2026-08-15).
- **limitations**: Не перевірено на практиці; може ввести редундантність; поточні `extensions/ukrainian.yaml`/`english.yaml` (станом на 2026-08-18) вже не мають структури `shared`/`differences` взагалі — цей claim описує стан реєстрів, що існував на момент гіпотези, і потребує повторної перевірки застосовності до поточної структури файлів.

### H-SS-EXT-003 — Санскрит анотує канон, а не порівнюється з ним
- **statement**: Санскрит як канонічна мова має використовувати іншу модель анотації (`academic_interpretation`, анотує канон), ніж неканонічні мови (`cross_language_comparison`, порівнюються з каноном) — оскільки санскрит *є* каноном, а не порівнюється з ним.
- **scope**: Структура шару академічної інтерпретації санскриту. Не стосується канону чи неканонічних розширень.
- **status**: `SUPPORTED` (per `REM-008`).
- **evidence**: `RECON-001` — незалежний blind-агент підтвердив спостереження "yardstick" (санскрит як еталон, не порівнюваний об'єкт) незалежно.
- **limitations**: Не валідовано власником репозиторію у формальній схемі; конфліктує з H-SS-EXT-002 щодо структури `dimensions` (пласка мапа vs багаторівнева) — потребує узгодження, якщо обидві гіпотези приймаються.

### L-001-001 — Відновлення пратяхар з тексту (blind structural recovery)
- **statement**: Канонічну систему пратяхар Паніні можна сліпо відновити з тексту Aṣṭādhyāyī за допомогою детерміністичного структурного пайплайну: v5.1 (тільки padaccheda) досягає 51.3% recall / 90.9% precision; v5.1 + v6.1 (з обробкою visarga-sandhi, компаундів, кон'юнктів) досягає 94.9% recall / 90.9% precision.
- **scope**: Експеримент L-001 на тексті Aṣṭādhyāyī (Baums, GRETIL). Виміряно на 3983 сутрах. Не стосується питання, чи є ця структура історично унікальною.
- **status**: `MEASURED` (внутрішній: `L-001`, outcome A).
- **evidence**: `experiments/blind_reconstruction/candidate_annotation_v5_1.py`; `experiments/blind_reconstruction/declined_form_detector.py`; `experiments/blind_reconstruction/reports/L-001-blind-pratyahara-final.md`; `experiments/blind_reconstruction/cross_model/sarvam_annotations.json`.
- **limitations**: v5.1 (51.3% recall) є сліпим результатом. v6.1 був розроблений з знанням канонічних 41, хоча додає лише загальну санскритську лінгвістичну обробку (sandhi/компаунди), а не знання про конкретні пратяхари. 2 неоднозначні детекції (छवि 8.3.7, चरः 1.3.53). Не доводить, що пратяхари не можуть бути відновлені іншим методом або з іншого корпусу.

### L-001-002 — Фантомні пратяхари (formable but unused)
- **statement**: 5 пратяхар є утворюваними з Śiva-sūtras, але ніколи не використовуються Паніні в Aṣṭādhyāyī: ऐच् (EC), ञम् (YaM), та 3 інші за даними літератури. Формальна система генерує більше класів, ніж потрібно.
- **scope**: Текстуальний аналіз Aṣṭādhyāyī + крос-перевірка з Kāśikā. Літературна верифікація: Wikipedia "Shiva Sutras", Ananthanarayana 1971.
- **status**: `SUPPORTED` (внутрішній: `L-001`).
- **evidence**: Sandhi-aware пошук у Aṣṭādhyāyī + Kāśikā підтвердив відсутність всіх 5. Усі 118 збігів "सर्" є частинами звичайних слів (सर्व, उपसर्ग), не pratyāhāra-цитаціями.
- **limitations**: "Ніколи не використовуються" означає "не знайдені в тексті Aṣṭādhyāyī та Kāśikā"; не виключає використання в пізніших граматичних традиціях. Список 3 "інших" потребує точнішої верифікації за першоджерелами Ananthanarayana 1971.

### L-001-003 — Віртуальні пратяхари (formable but substituted)
- **statement**: 4 пратяхари є утворюваними з Śiva-sūtras, але Паніні завжди використовує надмножину замість них: uK, caY, CaW, caR. Система Паніні містить редундантність — декілька міток можуть адресувати ту саму множину, і Паніні послідовно обирає ширшу.
- **scope**: Текстуальний аналіз Aṣṭādhyāyī.
- **status**: `SUPPORTED` (внутрішній: `L-001`).
- **evidence**: Кожна з 4 віртуальних пратяхар має відповідну надмножину, яка фіксується в тексті: uK → укладено в更大 class, caY → укладено в更大 class, CaW (छव्) → контекстуально присутня в 8.3.7, caR (चर्) → неоднозначно в 1.3.53.
- **limitations**: "Завжди використовує надмножину" — емпіричне спостереження на наявному тексті; не доводить, що Паніні свідомо уникав цих міток. 2 з 4 (CaW, caR) є неоднозначними (див. epistemic caveats у L-001 фінальному звіті).

### L-001-004 — Золота сутра 8.2.37 (dens pratyāhāra sūtra)
- **statement**: Сутра 8.2.37 (एकाचो बशो भष् झषन्तस्य स्ध्वोः) містить 3 пратяхари у 3 різних поверхневих формах: baS (बश्) у visarga-sandhi (बशो), Baz (भष्) у virama (стандартна цитація), Jaz (झष्) у компаунді (झषन्तस्य). Це найщільніша pratyāhāra-сутра в Aṣṭādhyāyī.
- **scope**: Спостереження на тексті Aṣṭādhyāyī.
- **status**: `SUPPORTED` (внутрішній: `L-001`).
- **evidence**: Padaccheda підтверджує всі 3 як standalone токени. Всі 3 пропущені v5.1, спіймані v6.1.
- **limitations**: "Найщільніша" — емпіричне спостереження, не вичерпний пошук по всіх 3983 сутрах (можливі інші з 3+, хоча малоймовірно).

