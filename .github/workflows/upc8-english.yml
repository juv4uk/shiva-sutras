name: UPC-8 English phoneme extension

on:
  push:
    branches: [master]
    paths:
      - "prototype/upc8.py"
      - "prototype/test_upc8.py"
      - "extensions/english-sarvam.yaml"
      - "extensions/english-claude-sarvam.yaml"
      - "extensions/ukrainian-sarvam.yaml"
      - "extensions/ukrainian-claude-sarvam.yaml"
      - ".github/workflows/upc8-english.yml"
  pull_request:
    paths:
      - "prototype/upc8.py"
      - "prototype/test_upc8.py"
      - "extensions/english-sarvam.yaml"
      - "extensions/english-claude-sarvam.yaml"
      - "extensions/ukrainian-sarvam.yaml"
      - "extensions/ukrainian-claude-sarvam.yaml"
      - ".github/workflows/upc8-english.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-phoneme-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Python syntax
        run: python3 -m compileall -q prototype/upc8.py prototype/test_upc8.py
      - name: Legacy UPC-8 and English 44-phoneme suite
        run: python3 prototype/test_upc8.py
      - name: English one-byte profile smoke test
        working-directory: prototype
        run: |
          python3 - <<'PY'
          from upc8 import UPC8, ENGLISH_SHARED, ENGLISH_SHARED_UKRAINIAN, ENGLISH_NEW, ENGLISH_RETIRED_CODES
          u = UPC8()
          ipa = [p for p, _, _ in ENGLISH_SHARED] + [p for p, _, _ in ENGLISH_SHARED_UKRAINIAN] + [p for _, p, _ in ENGLISH_NEW]
          data = u.encode_english_phonemes(ipa)
          assert len(data) == len(set(data)) == 44
          assert u.decode_english_phonemes(data) == tuple(ipa)
          assert (u.stats()["total_assigned"], u.stats()["reserved"]) == (112, 144)
          assert ENGLISH_RETIRED_CODES == {0x52, 0x53, 0x54, 0x5A, 0x5B}
          for p, letter, _ in ENGLISH_SHARED_UKRAINIAN:
              assert u.encode_english_phoneme(p) == u.encode_ukrainian(letter)
          print("44 IPA phonemes = 7 Sanskrit + 5 Ukrainian + 32 English, exact-byte roundtrip")
          PY
