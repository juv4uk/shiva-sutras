name: UPC-8 English phoneme extension

on:
  push:
    branches: [master]
    paths:
      - "prototype/upc8.py"
      - "prototype/test_upc8.py"
      - "extensions/english-sarvam.yaml"
      - "extensions/english-claude-sarvam.yaml"
      - ".github/workflows/upc8-english.yml"
  pull_request:
    paths:
      - "prototype/upc8.py"
      - "prototype/test_upc8.py"
      - "extensions/english-sarvam.yaml"
      - "extensions/english-claude-sarvam.yaml"
      - ".github/workflows/upc8-english.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-phoneme-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Python syntax
        run: python3 -m compileall -q prototype/upc8.py prototype/test_upc8.py
      - name: Legacy UPC-8 and English 44-phoneme suite
        run: python3 prototype/test_upc8.py
      - name: English one-byte profile smoke test
        working-directory: prototype
        run: |
          python3 - <<'PY'
          from upc8 import UPC8, ENGLISH_SHARED, ENGLISH_NEW
          u = UPC8()
          ipa = [p for p, _, _ in ENGLISH_SHARED] + [p for p, _ in ENGLISH_NEW]
          data = u.encode_english_phonemes(ipa)
          assert len(data) == len(set(data)) == 44
          assert u.decode_english_phonemes(data) == tuple(ipa)
          assert (u.stats()["total_assigned"], u.stats()["reserved"]) == (117, 139)
          print("44 IPA phonemes, 44 unique UPC-8 bytes, zero collisions")
          PY
