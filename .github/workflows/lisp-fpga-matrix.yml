name: Lisp FPGA matrix generator

on:
  pull_request:
    paths:
      - 'prototype/fpga/**'
      - 'prototype/upc8_pratyahara_probe/**'
      - 'tests/fpga/**'
      - 'tests/upc8/**'
      - 'lib/canon/**'
      - 'ksetra/canon/siva-sutras*.yaml'
      - '.github/workflows/lisp-fpga-matrix.yml'

permissions:
  contents: read

concurrency:
  group: lisp-fpga-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-lisp-fpga-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shiva-sutras
        uses: actions/checkout@v4
        with:
          path: shiva-sutras

      - name: Checkout my-lisp runtime
        uses: actions/checkout@v4
        with:
          repository: juv4uk/my-lisp
          path: my-lisp

      - name: Prepare legacy output directory
        run: |
          sudo mkdir -p /workspace/notes
          sudo chown "$USER" /workspace/notes

      - name: Build my-lisp CLI
        working-directory: my-lisp
        run: cargo build --release -p my-lisp-cli --bin my-lisp

      - name: Test native Lisp UPC8 probe
        working-directory: shiva-sutras
        run: ../my-lisp/target/release/my-lisp tests/upc8/pratyahara-probe.lisp

      - name: Verify UPC8 probe byte contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /workspace/notes/upc8-pratyahara-probe-lisp.txt)" -eq 1342
          test "$(sha256sum /workspace/notes/upc8-pratyahara-probe-lisp.txt | awk '{print $1}')" = "d6a87ed981a1ce93365db71508f16a29751b2a6a988c90eaf34f1c90b8682e39"

      - name: Test explicit pratyahara marker policies
        working-directory: shiva-sutras
        run: ../my-lisp/target/release/my-lisp tests/canon/pratyahara-policy.lisp

      - name: Test native Lisp matrix parity
        working-directory: shiva-sutras
        run: ../my-lisp/target/release/my-lisp tests/fpga/gen-matrix.lisp

      - name: Verify generated byte contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /workspace/notes/pratyahara_matrix.mif)" -eq 18284
          test "$(sha256sum /workspace/notes/pratyahara_matrix.mif | awk '{print $1}')" = "c6b78e19acf2d258fd22bbaf645d340890503aa7ed7dea574920aee594e42fc7"
          test "$(wc -c < /workspace/notes/pratyahara_matrix.h)" -eq 28935
          test "$(sha256sum /workspace/notes/pratyahara_matrix.h | awk '{print $1}')" = "f3fb5c874d1fce207c50cb950a4973a44697aa8eda81320e18eb12233dea735f"
          test "$(wc -c < /workspace/notes/pratyahara_matrix.v)" -eq 28360
          test "$(sha256sum /workspace/notes/pratyahara_matrix.v | awk '{print $1}')" = "e1a25ecba0a1410452d2a912476cbb3388d7e14ee6057000f267d2928468a900"
          test "$(wc -c < /workspace/notes/pratyahara_matrix.my)" -eq 81791
          test "$(sha256sum /workspace/notes/pratyahara_matrix.my | awk '{print $1}')" = "188d7da12cbc3b513060a08be24b3ea6698ed6041e860fec3b676d27d4a1af2d"
