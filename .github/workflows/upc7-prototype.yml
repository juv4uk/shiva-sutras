name: UPC-7 prototype

on:
  pull_request:
    paths:
      - "prototype/upc7.py"
      - "prototype/test_upc7.py"
      - "prototype/upc8.py"
      - "prototype/upc7_geometry.py"
      - "prototype/test_upc7_geometry.py"
      - "prototype/upc7_layouts.py"
      - "prototype/test_upc7_layouts.py"
      - "prototype/upc7_table.py"
      - "prototype/upc7-table.tsv"
      - "prototype/upc7-table.sha256"
      - "prototype/upc7_cold_verify.c"
      - "prototype/UPC7.md"
      - "prototype/UPC7-GEOMETRY-v2.md"
      - ".github/workflows/upc7-prototype.yml"
  push:
    branches:
      - "prototype/27-upc7-layouts"
    paths:
      - "prototype/upc7.py"
      - "prototype/test_upc7.py"
      - "prototype/upc8.py"
      - "prototype/upc7_geometry.py"
      - "prototype/test_upc7_geometry.py"
      - "prototype/upc7_layouts.py"
      - "prototype/test_upc7_layouts.py"
      - "prototype/upc7_table.py"
      - "prototype/upc7-table.tsv"
      - "prototype/upc7-table.sha256"
      - "prototype/upc7_cold_verify.c"
      - "prototype/UPC7.md"
      - "prototype/UPC7-GEOMETRY-v2.md"
      - ".github/workflows/upc7-prototype.yml"

jobs:
  upc7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run UPC-7 identity, geometry and layout witnesses
        working-directory: prototype
        run: python3 -m unittest -v test_upc7.py test_upc7_geometry.py test_upc7_layouts.py
      - name: Machine table is current
        working-directory: prototype
        run: python3 upc7_table.py --check
      - name: Pinned machine table SHA is current
        working-directory: prototype
        run: sha256sum -c upc7-table.sha256
      - name: Build independent cold witness
        working-directory: prototype
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic upc7_cold_verify.c -o /tmp/upc7-cold
      - name: Run independent cold witness
        working-directory: prototype
        run: /tmp/upc7-cold upc7-table.tsv
      - name: Mutation must fail closed
        working-directory: prototype
        run: |
          sed '2s/^0000000/0000001/' upc7-table.tsv > /tmp/upc7-mutated.tsv
          if /tmp/upc7-cold /tmp/upc7-mutated.tsv; then
            echo "cold witness accepted a mutated identity row" >&2
            exit 1
          fi
          expected="$(cut -d' ' -f1 upc7-table.sha256)"
          cp upc7-table.tsv /tmp/upc7-sha-mutated.tsv
          printf '\nmutation\n' >> /tmp/upc7-sha-mutated.tsv
          if printf '%s  %s\n' "$expected" /tmp/upc7-sha-mutated.tsv | sha256sum -c -; then
            echo "SHA witness accepted mutated table bytes" >&2
            exit 1
          fi
