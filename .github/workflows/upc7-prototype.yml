name: UPC-7 prototype

on:
  pull_request:
    paths:
      - "prototype/upc7.py"
      - "prototype/test_upc7.py"
      - "prototype/upc8.py"
      - "prototype/UPC7.md"
      - ".github/workflows/upc7-prototype.yml"
  push:
    branches:
      - "prototype/27-upc7-layouts"
    paths:
      - "prototype/upc7.py"
      - "prototype/test_upc7.py"
      - "prototype/upc8.py"
      - "prototype/UPC7.md"
      - ".github/workflows/upc7-prototype.yml"

jobs:
  upc7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run UPC-7 identity and layout witnesses
        working-directory: prototype
        run: python3 -m unittest -v test_upc7.py
