summary: >
  The my-lisp-panini machine (9 modules, commits 756f942-0af6a56) uses
  the canonical Siva-sutras as its sole data source via resolve-pratyahara.
  It produces correct Sanskrit verbal forms (pacati, bhavati, labhate,
  tudati) through sutra-cited derivation chains. 21/27 paradigm forms
  correct (77.8%). 4 gaps precisely identified with sutra references.

