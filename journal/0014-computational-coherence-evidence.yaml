epistemic_note: >
  This claim is SUPPORTED, not PROVED. The machine demonstrates that
  the canonical system is computationally coherent — it works end-to-end.
  This does not prove historical intent, uniqueness of the system, or
  that alternative phonological systems could not also work.
  The 4 gaps are auditable: each points to a specific missing sutra,
  providing a roadmap for expansion.

