The .my machine now structurally supports all 5 feature combinations. The named derivation functions mirror the Python verification tests. Full machine-level verification (running the .my files through a my-lisp interpreter) is pending — the .my syntax has not been validated against an actual interpreter.

## 6. Architectural note

The staged sandhi pipeline in derive-verb-atma is the first implementation of non-flat sandhi ordering in the .my machine. The original derive-verb-lakara uses a flat pipeline (eco → savarṇa → devoice). The ātmanepada path requires staged sandhi because eco and junction are non-commutative (Journal 0025, L-001-006). This creates an architectural split: parasmaipada uses flat sandhi, ātmanepada uses staged sandhi. Future unification should stage sandhi for all paths.
