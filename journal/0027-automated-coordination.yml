## 4. Setup required

The user (Володимир) needs to create a GitHub Personal Access Token (PAT) with `repo` scope and add it as a secret named `SYNC_TOKEN` in both repositories:
- Settings → Secrets and variables → Actions → New repository secret
- Name: SYNC_TOKEN
- Value: <PAT with repo scope>

Until SYNC_TOKEN is set, the workflows will fail at the sync step. The scripts themselves work without it (can be run locally with --token).

## 5. Coordination contract enforced

The automated system enforces the epistemic coordination contract:
- Downstream never elevates status (validate_sync.py check #4)
- Downstream never imports claims that don't exist upstream (check #3)
- Pin drift is detected within 24 hours (drift-check.yml)
- Pin updates happen within minutes of upstream push (sync-downstream.yml)

## 6. Architecture

```
shiva-sutras (upstream)
  │
  ├── journal/0027-automated-coordination.yaml
  ├── docs/claims-export.yaml          ← source of truth for claims
  ├── coordination/sync_downstream.py   ← pushes pin updates
  ├── coordination/validate_sync.py    ← validates consistency
  └── .github/workflows/
      └── sync-downstream.yml          ← triggers on journal/claims push
          │
          │ (GitHub API)
          ▼
my-lisp-panini (downstream)
  ├── coordination/dependencies.yaml    ← pinned_revision (auto-updated)
  ├── ecosystem/imports/shiva_claims.my ← revision (auto-updated)
  ├── coordination/validate_sync.py    ← validates consistency
  └── .github/workflows/
      └── drift-check.yml              ← daily check at 09:00 UTC
```

The flow is unidirectional: shiva-sutras → my-lisp-panini. The downstream never writes back to upstream. The drift-check workflow in my-lisp-panini reports drift but does not auto-fix (it only validates, because the downstream cannot determine which upstream commit to pin to — that requires human/agent judgment about which commits are stable).
