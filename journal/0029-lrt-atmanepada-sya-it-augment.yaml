key_findings:
  - >-
    iṭ sūtra identified: 7.2.35 (ārdhadhātukasyeḍ valādeḥ).
    ārdhadhātuka suffixes (including sya) receive iṭ after val-ādi roots
    (vowel-initial). Roots classified as seṭ (always), aniṭ (never), veṭ (optional).
    7.2.36 blocks iṭ for ātmanepada when not conditioned.
    7.2.61: after vowel, sya doesn't get iṭ if tāsI never gets iṭ.
  - >-
    ātmanepada reuses parasmaipada stem + ṭere ādeśa (wholesale tiṅ replacement).
    The staged sandhi architecture from journal 0025 extends to lṛṭ
    without modification: eco → junction → combine → coalescence → absorption.
  - >-
    a+e → e absorption (6.1.87) is the new sandhi operation for lṛṭ ātmanepada 1sg.
    sya + e → sye (a absorbed by e). This is the same rule as laṭ ātmanepada.
  - >-
    iṭ insertion decision: check stem AFTER guṇa but BEFORE eco.
    The abstract representation determines insertion, not the surface form.
    bhU → bho (guṇa) → vowel-final → i inserted → eco → bhav + i + sya.
    vac → vac (no guṇa, class 2) → consonant-final → NO i → consonant assimilation.
limitations:
  - >-
    Classes 3, 6, 7, 9 not yet tested in lṛṭ.
  - >-
    .my machine files (ting.my, derivation.my) not yet updated with lṛṭ.
  - >-
    seṭ/aniṭ/veṭ root classification not implemented — iṭ insertion
    is currently decided by phonological rule (oral stop check), not by
    the traditional seṭ/aniṭ root list. This may produce incorrect forms
    for aniṭ roots that happen to end in a non-oral-stop.
cross_substrate:
  - substrate: FPGA
    note: >-
      sya marker = Control Token (class 11). iṭ = conditional micro-operation
      gated by aṅga's final sound class AND root's seṭ/aniṭ status.
      Two-stage gate: phonological (oral stop) + lexical (seṭ list).
  - substrate: FST
    note: >-
      iṭ insertion is a finite-state transducer with two ports:
      phonological (stem final class) and lexical (root exception list).
