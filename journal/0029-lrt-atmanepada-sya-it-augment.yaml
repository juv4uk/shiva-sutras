id: 0029
title: lṛṭ ātmanepada + iṭ sūtra identification (7.2.35)
date: 2026-09-07
status: PROVED-IN-MODEL
epistemic_layer: ENGINEERING
scope: >-
  Computational implementation in my-lisp-panini. lṛṭ (future simple)
  ātmanepada verified at 100% for 14 forms across 6 verbal classes.
  Combined with parasmaipada (21 forms), total 35/35 = 100%.
  iṭ insertion sūtra identified as 7.2.35 (ārdhadhātukasyeḍ valādeḥ).
  Not a historical claim about Pāṇini's intent.
hypothesis: >-
  lṛṭ ātmanepada uses the same stem as parasmaipada (dhātu + guṇa + iṭ + sya),
  then ṭere ādeśa replaces parasmaipada tiṅ with ātmanepada tiṅ (te, ante, e).
  a+e → e absorption (6.1.87) applies for 1sg (e ending).
  a+a → a coalescence applies for 3pl (ante ending).
  The staged sandhi architecture (journal 0025) extends to lṛṭ without modification.
