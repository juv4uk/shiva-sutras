## Errors in the review (noted by the project)

1. Tripādī: review claims it is "all of books 6-8." Fact: Tripādī is only 8.2-8.4 (last 3 pāda of adhyāya 8).
2. Prakriyā uniqueness: review claims "only one correct path." May be too categorical.

## Roadmap based on review + our findings

1. Add lakāra to the machine — currently only laṭ (present tense)
2. Model lopa/ādeśa/āgama distinction formally — pipeline already separates them operationally
3. Consult Siddhāntakaumudī for standard derivation sequences
4. Add sārvadhātuka/ārdhadhātuka as explicit machine concepts — currently implicit in vikarana-has-tit?

