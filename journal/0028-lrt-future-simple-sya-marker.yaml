id: 0028
title: lṛṭ (future simple) — sya marker + i-insertion mechanism
date: 2026-09-07
status: PROVED-IN-MODEL
epistemic_layer: ENGINEERING
scope: >-
  Computational implementation in my-lisp-panini. The fifth lakāra
  (lṛṭ, future simple) is verified at 100% for parasmaipada across
  7 verbal classes (1, 2, 4, 5, 8, 10) and 3 persons (3sg, 3pl, 1sg).
  21/21 forms correct. Not a historical claim about Pāṇini's intent.
hypothesis: >-
  lṛṭ derivation follows: dhātu + sya (3.1.33) replaces vikaraṇa,
  guṇa applies (same as laṭ), then i is inserted before sya UNLESS
  the stem ends in an oral stop (sparśa minus nasals). s→ṣ (8.4.63)
  applies after i. Consonant assimilation (c→k, d→t) for stop-final stems.
  a+a coalescence at sya/tiṅ boundary for 3pl.
