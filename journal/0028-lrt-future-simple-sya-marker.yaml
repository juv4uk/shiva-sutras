key_findings:
  - >-
    sya marker (3.1.33) replaces vikaraṇa entirely — no Śap, Śya, etc.
    This is structurally simpler than laṭ.
  - >-
    i-insertion is the new mechanism in lṛṭ: i is inserted between
    stem and sya when the stem does NOT end in an oral stop.
    bhU → bhav + i + sya → bhaviṣyati.
    vac → vak + sya → vakṣyati (no i, consonant assimilation instead).
  - >-
    i-insertion rule: check stem AFTER guṇa but BEFORE eco.
    The decision is based on the abstract representation, not surface form.
    bhU → bho (guṇa) → 'o' is vowel → i inserted → eco → bhav + i + sya.
  - >-
    s→ṣ (8.4.63) triggers ONLY after i/u/ṛ/r/k — NOT after t/p/d.
    This distinguishes bhaviṣyati (ṣ after i) from atsyati (s stays).
  - >-
    a+a coalescence at sya/tiṅ boundary: sya + anti → syanti (not syānti).
    Same coalescence principle as ādeśa boundary in ātmanepada.
  - >-
    guṇa applies to final VOWEL of dhātu, not final character.
    cur → cor (u→o on internal vowel), not cur→cur.
limitations:
  - >-
    Only parasmaipada tested. ātmanepada for lṛṭ pending.
  - >-
    Classes 3, 6, 7, 9 not yet tested in lṛṭ.
  - >-
    i-insertion sūtra not yet identified in Aṣṭādhyāyī. The rule is
    inferred from surface forms. Candidate: 7.2.79 (śūd anupūrve) or
    a related sūtra in 7.2. Further research needed.
cross_substrate:
  - substrate: FPGA
    note: >-
      sya marker could be encoded as a Control Token (class 11) in the
      FPGA architecture. i-insertion is a conditional micro-operation
      gated by the aṅga's final sound class (oral stop vs other).
  - substrate: FST
    note: >-
      The i-insertion decision (oral stop → skip, other → insert) is
      a natural finite-state transducer rule.
