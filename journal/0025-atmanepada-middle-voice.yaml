## 6. Sandhi pipeline (revised)

The ātmanepada implementation revealed that the sandhi pipeline must be staged:

1. **Eco** on anga+suffix (e/o + vowel → ay/av)
2. **Savarṇa** within anga (internal vowel merges)
3. **Junction** (a/ā + e → e, A + a → a)
4. **Combine** anga + tiṅ
5. **Coalescence** (a+a → a at ādeśa boundary)
6. **Eco** on final form
7. **Savarṇa** on final form
8. **Devoice** (8.4.55)

This staged approach is necessary because eco must see the guṇa vowel before junction rules remove it, and savarṇa must not cross the ādeśa boundary.

## Summary

Ātmanepada is the first structural extension beyond parasmaipada. It revealed that the sandhi pipeline cannot be a flat sequence — it must be staged with junction rules between anga and tiṅ layers. The ṭere ādeśa is a wholesale replacement, not a phonological rule, and its boundary behavior blocks savarṇa dīrgha while allowing coalescence.
