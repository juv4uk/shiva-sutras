## 1. What was implemented

### Ātmanepada (middle voice) for laṭ

The ātmanepada (middle voice) represents a fundamentally different grammatical voice from parasmaipada (active). It uses its own set of tiṅ endings and triggers the ṭere rule (3.4.79).

## 2. Key findings

### Finding 1: ṭere (3.4.79) — ādeśa replaces entire tiṅ

When the vikaraṇa has ṭit (classes 1, 5, 7, 8, 9, 10), the ātmanepada tiṅ undergo ādeśa (wholesale replacement):

| Person | Raw tiṅ | ṭere ādeśa |
|:---|:---|:---|
| 3sg | ta | te |
| 3du | ātām | etām |
| 3pl | ja | anta |
| 2sg | thās | se |
| 1sg | iṭ | e |
| 1pl | mahīṃ | āmahi |

The key insight: ṭere is NOT a phonological transformation (like ta→te). It is a complete replacement (ādeśa) of the tiṅ with e-initial forms.

### Finding 2: Junction sandhi ordering — eco BEFORE boundary rules

The critical architectural discovery: eco (e/o + vowel → ay/av) must run BEFORE the anga-tiṅ junction rules. If junction runs first, it drops the connecting vowel that eco needs:

For class 10 1sg: cor+e(guṇa) + ā(vṛddhi) + e(1sg ending)
- WRONG order: junction drops ā → cor+e+e → savarṇa merges e+e → core ✗
- RIGHT order: eco: e+ā → ay+ā → corayā → junction: ā+e → e → coraye ✓

### Finding 3: a+a coalescence (NOT savarṇa dīrgha)

At the ādeśa boundary (vikaraṇa 'a' meeting tiṅ-initial 'a' in 'anta'):
- a + a → a (coalescence: two identical short vowels merge into ONE short vowel)
- This is NOT savarṇa dīrgha (6.1.101), which would give a+a → ā

The blocking mechanism: the tiṅ 'anta' is an ādeśa (wholesale replacement), so its initial 'a' is part of a single morphological unit, not a separate phonological sound available for savarṇa.

### Finding 4: a/ā + e → e (guṇa vowel absorption)

At the anga-tiṅ junction, when the anga ends in a/ā and the tiṅ starts with e (ṭere form):
- a + e → e (the a is absorbed)
- ā + e → e (the ā is absorbed)

This corresponds to 6.1.87 (ād guṇe): when a guṇa-grade vowel follows, the preceding a/ā is dropped.

