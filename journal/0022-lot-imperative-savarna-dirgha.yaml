## Summary

Implemented loṭ (imperative) lakāra — the second tense/mood in the machine. Added savarṇa dīrgha sandhi (6.1.101). Score: 60/60 (100%) on 12 dhātus × 4 forms × 7 classes, for BOTH laṭ and loṭ.

## Key discoveries

### 1. loṭ shares the pipeline with laṭ

The entire derivation pipeline (it-lopa → ṭere → vṛddhi → guṇa/yaṇ → eco → 8.4.55) works unchanged for loṭ. The ONLY difference is the tiṅ endings:

| Person | laṭ | loṭ |
|:---|:---|:---|
| 3sg | ti | tu |
| 3pl | nti | ntu |
| 2sg | si (→dhi) | zero (hi → lopa) |
| 1sg | mi | ani |
| 1du | vas | ava |
| 1pl | mas | ama |

This validates the architectural separation: the pipeline is lakāra-agnostic, only the tiṅ table changes.

### 2. savarṇa dīrgha (6.1.101) was missing

Without 6.1.101 (akas savarṇe dīrghaḥ), the loṭ 1sg forms were wrong:
- bhavAani instead of bhavAni (ā + a → ā)
- pacAani instead of pacAni (a + a → ā)

The rule: two adjacent homogeneous vowels merge into the long form:
- a + a → ā, ā + a → ā, a + ā → ā
- i + i → ī, u + u → ū, r̥ + r̥ → r̥̄

This rule was not needed for laṭ (no adjacent same-vowel pairs occurred) but is essential for loṭ (where the vikaraṇa "a" and the ending "ani" create adjacent vowels).

### 3. Śnu/Śu 1sg loṭ: short a, not long ā

For Śnu/Śu classes (5, 8), the 1sg loṭ form has short "a":
- su → sunavani (not sunavāni)
- tan → tanavani (not tanavāni)

This is because Śnu/Śu vikaraṇa has no "a" to vṛddhi. The "a" in "sunavani" comes from eco (o+a → av+a), not from vṛddhi. No savarṇa dīrgha applies (the two a's are separated by "v").

Status: SUPPORTED — the derivation is mechanically correct per our rules. Needs verification against standard Sanskrit forms.

### 4. loṭ 2sg: zero ending

The 2sg loṭ ending is "hi" which undergoes lopa (disappearance). The guṇa still applies because the sārvadhātuka suffix existed before lopa. Result:
- bhU → bhava (guṇa: ū→o → eco: o+a → av+a → bhava)
- su → suno (guṇa: u→o, no eco because next is nothing)
- cur → coraya (guṇa: u→o, i→e → eco: e+a → ay+a → coraya)

