## Architecture: lakāra dispatch

```
derive-verb(dhatu, class, ting-label, is-atma)
  → derive-verb-lakara(dhatu, class, ting-label, is-atma, lakara)
    → get-ting-para(label, lakara)  ← dispatch: laṭ vs loṭ
    → same pipeline for both
```

Adding a new lakāra requires only:
1. New tiṅ table in ting.my
2. Pass the lakāra label

