## 1. What was implemented

### liṅ (optative, 3.3.161: vidhi-liṅ)

The fourth lakāra. The optative mood expresses possibility, wish, or prescription.

## 2. Key findings

### Finding 1: Optative REPLACES vikaraṇa, not just tiṅ

Unlike laṭ/loṭ/laṅ which use the standard vikaraṇa (Śap→a, Śnu→nu, etc.) + tiṅ endings, the optative uses the "sī" marker which replaces the entire vikaraṇa+tiṅ complex.

The aṅga for optative = dhātu (with guṇa) WITHOUT the laṭ vikaraṇa "a". The "sī" marker (s=it→lopa, ī→guṇa→e) provides the connecting vowel instead.

### Finding 2: Two ending types based on aṅga final

The optative has two distinct ending sets depending on the aṅga's final sound:

| Aṅga final | Classes | Ending type | 3sg example |
|:---|:---|:---|:---|
| a (or a-derived) | 1, 4, 6, 10 | e-type: et, eyātam, eyus | bhavet |
| u (Śnu/Śu) | 5, 8 | yā-type: yāt, yātām, yus | sunuyāt |

The e-type arises because: guṇa'd dhātu vowel (o/e) + optative ī → eco → ay/av + ī → ī→e → ...et.
The yā-type arises because: u-final aṅga + optative ī → no eco (u is not e/o) → the ī surfaces differently.

### Finding 3: Class 4 (Śya) drops final 'a'

Class 4 vikaraṇa is Śya→ya (ends in 'a'). In the optative, this 'a' belongs to the laṭ layer and must be dropped. Without dropping: pazya + et = pazyaet (wrong). With dropping: pazy + et = pazyet = paśyet ✓.

## 3. Pāṇinian derivation trace

### bhavet (bhū class 1, 3sg optative)

1. bhū + sīt (optative suffix: s=it, t=ending)
2. s → lopa: sīt → īt
3. guṇa on dhātu vowel: ū → o → bho
4. eco: o + ī (vowel) → av + ī → bhavīt
5. guṇa on optative ī: ī → e → bhavet ✓

### corayet (cur class 10, 3sg optative)

1. cur + i(Ṇic) + sīt → īt
2. guṇa on ALL vowels: u→o, i→e → cor + e
3. eco: e + ī (vowel) → ay + ī → corayīt
4. guṇa on optative ī: ī → e → corayet ✓

### sunuyāt (su class 5, 3sg optative)

1. su + nu(Śnu) + sīt → īt
2. NO guṇa on dhātu vowel (u stays as u in Śnu optative)
3. No eco (u is not e/o)
4. Optative uses yā-type ending: sunu + yāt → sunuyāt ✓

