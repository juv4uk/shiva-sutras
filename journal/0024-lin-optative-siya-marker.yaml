## Summary

The optative is structurally the most complex lakāra so far. It replaces the vikaraṇa entirely (not just the tiṅ), has two ending types based on aṅga final, and requires dropping the laṭ vikaraṇa vowel for class 4. All 15 test forms verified at 100%.
