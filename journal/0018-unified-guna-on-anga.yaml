## Summary

The guṇa-on-aṅga mechanism (Journal 0017, discovered for class 10 Ṇic) is not a special case. It is a UNIFIED PRINCIPLE that applies to at least 4 verbal classes (1, 5, 8, 10). The vikaraṇa vowel in these classes becomes part of the aṅga and receives guṇa (7.3.84).

