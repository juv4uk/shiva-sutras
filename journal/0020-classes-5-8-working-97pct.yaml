## Remaining failure

ad (class 2) 3pl: ad+nti → adnti. Expected: "atti" (same as 3sg).
This requires 8.4.55 (jhalāṃ jhaśi) applied across the morpheme boundary: d before n → t.
Then dt → tt → t (by some sandhi rule).
This is a class 2 edge case (no vikaraṇa, direct dhātu+tiṅ).

