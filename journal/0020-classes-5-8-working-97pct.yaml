## Summary

Added classes 5 (Śnu) and 8 (u) to the machine. Discovered the guṇa/yaṇ split for Śnu/Śu classes (6.4.87). Score: 38/39 (97.4%) on 13 dhātus × 3 forms across 7 classes.

## Key discoveries

### 1. Śnu's u is NOT it

Previously marked u as it-marker (by 1.3.4: na vibhaktau tusmāḥ). This was wrong: removing u gives vikaraṇa = "n" only, producing "sonti" (guṇa on dhātu) instead of "sunoti" (guṇa on vikaraṇa).

Fix: only ś is it for Śnu. The vikaraṇa is "nu" (n+u), and guṇa applies to the "u" in "nu" → "no" → sunoti.

### 2. Guṇa/yaṇ split for Śnu/Śu classes (6.4.87)

Kāśikā on 6.4.87: "sunvanti / sunvantu / asunvan" — yaṇ (u→v) applies for 3pl.

The pattern:
- 3sg (tip→ti): guṇa (u→o) → sunoti, tanoti
- 3pl (jhi→nti): yaṇ (u→v) + a-insertion → sunvanti, tanvanti
- 1sg (mip→mi): guṇa (u→o) → sunomi, tanomi

The "a" in sunvanti comes from insertion between "v" and consonant-initial tiṅ. This is likely related to 7.2.35 (ārdhadhātukasya iṭ vā) or a similar rule — needs further research.

### 3. Class 8 guṇa target = vikaraṇa vowel

For class 8 (tan+u+ti): guṇa applies to the vikaraṇa "u" → "o" → tanoti.
The dhātu vowel "a" stays unchanged. This is different from class 10 (Ṇic) where guṇa applies to ALL vowels.

### 4. Guṇa target varies by class

| Class | Aṅga | Guṇa target | Example |
|:---|:---|:---|:---|
| 1 (Śap) | dhātu | dhātu vowel | bhavati (ū→o) |
| 5 (Śnu) | dhātu + nu | vikaraṇa vowel | sunoti (nu's u→o) |
| 8 (u) | dhātu + u | vikaraṇa vowel | tanoti (u→o) |
| 10 (Ṇic) | dhātu + i | ALL vowels | corayati (u→o AND i→e) |

Hypothesis: guṇa target = LAST vowel of aṅga for classes 1, 5, 8. For class 10 (ṇiṭ), guṇa applies to ALL vowels (7.2.115: acaḥ ñṇīti).

