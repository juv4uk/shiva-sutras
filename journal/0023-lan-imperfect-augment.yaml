## 1. What was implemented

### laṅ (imperfect tense, 3.2.111: anadyatanaṃ laṅ)

The third lakāra in the Pāṇinian verbal system. laṅ (imperfect) denotes past action not occurring today.

### Architecture

laṅ is the simplest lakāra to add after laṭ and loṭ because:

1. **Same tiṅ as laṭ**: laṅ uses the identical parasmaipada tiṅ set (tip, tas, jhi, sip, thas, tha, mip, vas, mas) with the same it-lopa and jhi→nti processing.
2. **Augment a-**: the only structural difference is the augment a- (6.1.3+ chordasī...) prefixed to the dhātu.
3. **No special vikaraṇa changes**: the same 10-class vikaraṇa table applies.

### ting.my changes

- Added `get-laN-ting-para`: identical processing to `get-lat-ting-para` (hal-lopa + jhi→nti).
- Added `laN` dispatch in `get-ting-para`.
- Commit: `bde2cb7`

### derivation.my changes

- Added `derive-verb-laN`: computes the laṭ derivation, then prepends augment a- to the result and re-applies sandhi (eco + savarṇa dīrgha + 8.4.55).
- The augment a- is NOT part of the aṅga (no guṇa on it).
- savarṇa dīrgha (6.1.101) handles a+a→ā if dhātu starts with vowel a.
- eco sandhi (6.1.78) handles a+i→e, a+u→o if needed.
- Added 14 named laṅ derivations (8 × 3sg, 4 × 3pl, 3 × 1sg).
- Commit: `e7dbaec`

