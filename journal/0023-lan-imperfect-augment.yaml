# Journal 0023: laṅ (imperfect) — third lakāra

date: "2026-09-07"
type: implementation
status: PROVED-IN-MODEL
experiment: L-001
epistemic_layer: PĀṆINIAN FORMAL USE + ENGINEERING

## 1. What was implemented

### laṅ (imperfect tense, 3.2.111: anadyatanaṃ laṅ)

The third lakāra in the Pāṇinian verbal system. laṅ (imperfect) denotes past action not occurring today.

## 2. Key findings

### Finding 1: laṅ tiṅ ≠ laṭ tiṅ

The initial assumption that laṅ uses the same tiṅ as laṭ was FALSIFIED by Python verification.

laṅ tiṅ are structurally different from laṭ tiṅ — they lack the final vowel -i:

| Person | laṭ tiṅ | laṅ tiṅ | Difference |
|:---|:---|:---|:---|
| 3sg | ti | t | -i dropped |
| 3du | tas | tām | s→m |
| 3pl | nti | n | -ti dropped |
| 2sg | si | s | -i dropped |
| 2du | tha(s) | tam | h→m, s-lopa |
| 2pl | tha | ta | h dropped |
| 1sg | mi | m | -i dropped |
| 1du | va | va | same |
| 1pl | ma | ma | same |

### Finding 2: vṛddhi does NOT apply in laṅ

7.3.101 (vṛddhi of vikaraṇa a→ā before 1st person) is NOT triggered in laṅ because the laṅ 1sg tiṅ is `m` (not `mi`) — the absence of `i` means the ṭit condition is not met.

Result: laṅ 1sg = `abhavam` (short a), NOT `abhavām` (long ā).

### Finding 3: guṇa applies to IK-vowels only

guṇa (7.3.84) applies to the last IK-vowel (i, u, ṛ, ḷ and long forms) of the aṅga, NOT to `a`. This is because `a` is already in guṇa grade — guṇa of `a` = `a` (no change). The function must skip `a` and find the last IK-vowel.

