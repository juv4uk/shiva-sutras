The score actually IMPROVED after audit: the "stauti" false expectation was removed, and stu (class 1) is now 3/3 correct (machine produces stavati ✓).

## Root cause

The Python stress test prototype used string-based SLP1 without validation against a reference table. SLP1 has several characters that are easily confused:
- S (ṣ) vs z (ś) — both sibilants, uppercase vs lowercase
- R (ṇ) vs f (ṛ) — both "r-like" characters, but R is a consonant and f is a vowel
- N (ṅ) vs R (ṇ) vs Y (ñ) — three different nasals

## Recommendation

Add SLP1 validation function to phonology.my that checks each character against the standard SLP1 table before use. Run dhātu encodings through this validator before testing.

